# Infrastructure Planning & Development Management
id: BC-5010
name: "Infrastructure Planning & Development Management"
level: 1
industry: Infrastructure
description: |
  Long-range network and system planning, feasibility and options development,
  land and route acquisition, consents and environmental assessment, and
  stakeholder engagement to develop infrastructure schemes up to the point of
  delivery.
references:
  - https://www.buildingsmart.org/
  - https://sustainableinfrastructure.org/envision/
  - https://ppp.worldbank.org/public-private-partnership/
  - https://www.iema.net/
in_scope:
  - Long-range network, capacity, and spatial planning
  - Feasibility studies and options and concept development
  - Land, route, and corridor acquisition and easements
  - Planning consents and environmental impact assessment
  - Stakeholder, community, and landowner engagement
  - Sustainability, carbon, and climate-adaptation planning
out_of_scope:
  - Real-estate development (BC-4900)
  - Construction execution (BC-5040)
  - Operational permits and regulatory approvals (BC-5110)
  - Detailed engineering design and BIM production
children:
  - id: BC-5010.10
    name: "Network & System Planning"
    level: 2
    industry: Infrastructure
    description: |
      Long-range planning of infrastructure networks and systems to meet
      forecast demand and capacity needs.
    children:
      - id: BC-5010.10.10
        name: Demand Forecasting
        level: 3
        industry: Infrastructure
        description: |
          Forecasting of long-range demand and utilisation to size future
          infrastructure needs.
        children: []
      - id: BC-5010.10.20
        name: Network Capacity Planning
        level: 3
        industry: Infrastructure
        description: |
          Planning of network and system capacity to close gaps between demand
          and available provision.
        children: []
      - id: BC-5010.10.30
        name: "Spatial & Corridor Planning"
        level: 3
        industry: Infrastructure
        description: |
          Spatial and corridor planning to reserve land and align schemes with
          land-use policy.
        children: []
      - id: BC-5010.10.40
        name: Master Planning
        level: 3
        industry: Infrastructure
        description: |
          Development of integrated master plans that coordinate schemes across
          a network or region.
        children: []
  - id: BC-5010.20
    name: "Feasibility & Options Development"
    level: 2
    industry: Infrastructure
    description: |
      Assessment of feasibility and development of options and concepts for
      candidate infrastructure schemes.
    children:
      - id: BC-5010.20.10
        name: Feasibility Studies
        level: 3
        industry: Infrastructure
