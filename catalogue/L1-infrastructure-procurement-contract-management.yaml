# Infrastructure Procurement & Contract Management
id: BC-5030
name: "Infrastructure Procurement & Contract Management"
level: 1
industry: Infrastructure
description: |
  Procurement strategy, tendering, and contract administration for
  infrastructure delivery, including commercial and quantity-surveying
  management, variations and claims, and subcontractor and supply-chain
  management.
references:
  - https://fidic.org/
  - https://www.neccontract.com/
  - https://www.rics.org/profession-standards
  - https://ppp.worldbank.org/public-private-partnership/
in_scope:
  - Procurement strategy, packaging, and route selection
  - Tendering, bid management, and prequalification
  - Contract formation, administration, and payment certification
  - Commercial and quantity-surveying and valuation management
  - Variation, compensation event, and claims management
  - Subcontractor and supply-chain procurement and performance
out_of_scope:
  - Enterprise procurement (BC-500)
  - Engineering tendering and estimation (BC-1140)
  - Supplier relationship management (BC-510)
  - Construction works execution and site delivery
