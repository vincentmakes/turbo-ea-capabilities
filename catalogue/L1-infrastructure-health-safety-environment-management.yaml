# Infrastructure Health, Safety & Environment Management
id: BC-5050
name: "Infrastructure Health, Safety & Environment Management"
level: 1
industry: Infrastructure
description: |
  Health, safety, and environmental management across infrastructure
  construction and operations, spanning HSE management systems, construction
  safety, occupational health, environmental management, and incident and
  emergency response. Protects people, communities, and the environment while
  works and assets are delivered and operated.
references:
  - https://www.iso.org/iso-45001-occupational-health-and-safety.html
  - https://www.hse.gov.uk/construction/cdm/2015/index.htm
  - https://www.iso.org/iso-14001-environmental-management.html
in_scope:
  - HSE policy, management systems, culture, and competence
  - Construction safety under CDM, permits, and risk assessment
  - Occupational health surveillance, welfare, and wellbeing
  - Environmental controls, pollution prevention, and consents compliance
  - Ecology and heritage protection during works
  - Incident reporting, investigation, and emergency response
out_of_scope:
  - Cross-industry environment, health & safety (BC-720)
  - Operational resilience and security (BC-5120)
  - Construction quality management (BC-5040.60)
