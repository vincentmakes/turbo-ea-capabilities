    source_hash: sha256-dfe10f250f9dc9bb
  BC-2010.50.20:
    name: Engenharia de pilhas KNX e LonWorks
    description: |
      Engenharia de pilhas de protocolo KNX e LonWorks.
    source_hash: sha256-07b74000715f91e0
  BC-2010.50.30:
    name: Engenharia de drivers Modbus e DALI
    description: |
