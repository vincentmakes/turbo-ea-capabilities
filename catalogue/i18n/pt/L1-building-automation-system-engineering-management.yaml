    source_hash: sha256-fd3ac7dfc9b8df29
  BC-2010.40.30:
    name: Biblioteca de sequências de central
    description: |
      Sequências reutilizáveis para controlo de plantas de chillers e caldeiras.
    source_hash: sha256-10960c4994040ea6
  BC-2010.40.40:
