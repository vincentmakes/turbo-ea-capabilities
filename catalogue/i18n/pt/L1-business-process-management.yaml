locale: pt
source: L1-business-process-management.yaml
entries:
  BC-930:
    name: Gestão de processos de negócio
    description: |
      Disciplina de conceção, modelação, monitorização, mineração, otimização e governo dos processos de negócio end-to-end como classe de ativo gerida. Trata os processos como artefactos de primeira classe, independentemente dos domínios operacionais que os executam.
    in_scope:
      - Governo de taxonomia, propriedade, ciclo de vida e padrões dos processos
      - Descoberta, modelação BPMN, documentação e versionamento dos processos
      - KPI de desempenho dos processos, monitorização e reporte de conformidade
      - Mineração de processos incluindo aquisição de registos de eventos, descoberta e verificação de conformidade
      - Redesenho de processos, simulação e identificação de oportunidades de automação
      - Governo do portfólio de automação em plataformas de workflow e RPA
      - Conceção de controlos de processo e modelação da segregação de funções
    out_of_scope:
      - Entrega de projetos de melhoria via Lean, Six Sigma ou eventos Kaizen (BC-720.50)
      - Execução operacional específica de domínio (encomendas, sinistros, expedições, etc.)
      - Desenvolvimento de software de bots RPA e engenharia de plataforma (capacidades de TI)
      - Execução dos processos de gestão de serviços de TI (capacidades BC-700)
      - Modelação da arquitetura de negócio, capacidades e cadeias de valor (BC-170)
    source_hash: sha256-0652fb00b5eb7656
  BC-930.10:
    name: Arquitetura e governo de processos
    description: |
      Taxonomia de processos, modelo de propriedade, política de ciclo de vida e padrões de autoria que enquadram o portfólio de processos.
    source_hash: sha256-7095e6f7ba0cd6d2
  BC-930.10.10:
    name: Gestão da taxonomia de processos
    description: |
      Definição e custódia do referencial de classificação dos processos da empresa.
    source_hash: sha256-c73a863553027667
  BC-930.10.20:
    name: Atribuição da propriedade dos processos
    description: |
      Atribuição de proprietários, custodiantes e administradores de processos no portfólio.
    source_hash: sha256-09c3365b6f8c9bad
  BC-930.10.30:
    name: Política do ciclo de vida dos processos
    description: |
      Política para introdução, manutenção, desativação e arquivo de processos.
    source_hash: sha256-2243cca49b379b88
  BC-930.10.40:
    name: Padrões e convenções de processos
    description: |
      Notações de modelação, padrões de atributos e convenções de revisão dos artefactos de processo.
    source_hash: sha256-90731d8df472ff96
  BC-930.20:
    name: Modelação e documentação de processos
    description: |
      Descoberta, autoria, publicação e controlo de versões dos modelos de processo e respetiva documentação.
    source_hash: sha256-1f9a41d45471f350
  BC-930.20.10:
    name: Descoberta e elicitação de processos
    description: |
      Workshops, entrevistas e observação para captar o conhecimento do processo as-is.
    source_hash: sha256-a7c3d01546333905
  BC-930.20.20:
    name: Autoria de modelos de processo
    description: |
      Autoria de modelos BPMN e equivalentes na ferramenta de modelação.
    source_hash: sha256-841be1a65dd6c45e
  BC-930.20.30:
    name: Publicação da documentação de processos
    description: |
      Publicação da documentação de processos para audiências operacionais.
    source_hash: sha256-18a095eba2017439
  BC-930.20.40:
    name: Versionamento dos modelos de processo
    description: |
      Controlo de versões, histórico de alterações e fluxo de aprovação dos modelos de processo.
    source_hash: sha256-4dcce221d9996432
  BC-930.30:
    name: Medição do desempenho dos processos
    description: |
      Definição, monitorização e reporte do desempenho e da conformidade dos processos.
    source_hash: sha256-365abeeb7555a22d
  BC-930.30.10:
    name: Definição de KPI de processo
    description: |
      Definição de KPI de tempo de ciclo, throughput, qualidade e custo por processo.
    source_hash: sha256-f5cbbea6ae20b4b3
  BC-930.30.20:
    name: Monitorização do desempenho dos processos
    description: |
      Painéis operacionais e alertas face às metas de desempenho dos processos.
    source_hash: sha256-81520d22a3dfaf73
  BC-930.30.30:
    name: Reporte de conformidade dos processos
    description: |
      Reporte da conformidade de execução face ao processo modelado.
    source_hash: sha256-c586b56d5b11d06d
  BC-930.40:
    name: Mineração e descoberta de processos
    description: |
      Descoberta, verificação de conformidade e inteligência de processos a partir de registos de eventos.
    source_hash: sha256-be0e48176653c027
  BC-930.40.10:
    name: Aquisição de registos de eventos
    description: |
      Extração, transformação e carregamento de registos de eventos a partir dos sistemas fonte.
    source_hash: sha256-a176fd496efb0f9f
  BC-930.40.20:
    name: Análise de descoberta de processos
    description: |
      Reconstrução algorítmica das variantes de processo executadas a partir dos registos de eventos.
    source_hash: sha256-bb5d6f08ae7cbeac
  BC-930.40.30:
    name: Verificação de conformidade
    description: |
      Comparação do comportamento executado com modelos de referência e conjuntos de regras.
    source_hash: sha256-2c8a9aafedeb101b
  BC-930.40.40:
    name: Reporte de inteligência de processos
    description: |
      Reporte dos achados da mineração, como estrangulamentos, retrabalho e impacto das variantes.
    source_hash: sha256-1788a83e6680e4b8
  BC-930.50:
    name: Otimização e redesenho de processos
    description: |
      Redesenho arquitetural e baseado em dados dos processos, incluindo simulação e análise de candidatos a automação. Distinto da entrega de projetos de melhoria, que se localiza em BC-720.50.
    source_hash: sha256-04f7979530678035
  BC-930.50.10:
    name: Análise de estrangulamentos
    description: |
      Identificação e quantificação dos pontos de restrição entre as variantes de processo.
    source_hash: sha256-53ac0648c025549d
  BC-930.50.20:
    name: Simulação de processos
    description: |
      Simulação por eventos discretos e Monte Carlo das alternativas de conceção de processo.
    source_hash: sha256-a5ea0f7269f8f12c
  BC-930.50.30:
    name: Conceção dos processos alvo
    description: |
      Conceção dos fluxos, controlos e transições dos processos redesenhados.
    source_hash: sha256-8b2d41bf9d4f316f
  BC-930.50.40:
    name: Identificação de oportunidades de automação
    description: |
      Identificação de passos candidatos a automação por workflow, RPA ou IA.
    source_hash: sha256-0ce6366323bd54d7
  BC-930.60:
    name: Governo da automação de processos
    description: |
      Governo do portfólio de automação em plataformas de workflow, RPA e automação inteligente. Exclui a engenharia e operação das próprias plataformas.
    source_hash: sha256-e39d402d6410d85b
  BC-930.60.10:
    name: Gestão do portfólio de automação
    description: |
      Receção da procura, priorização e gestão do ciclo de vida dos ativos de automação.
    source_hash: sha256-5985925314b65a65
  BC-930.60.20:
    name: Governo da orquestração de workflows
    description: |
      Padrões e controlos para os processos de workflow orquestrados nos sistemas de negócio.
    source_hash: sha256-64dd8a9a708b2c5c
  BC-930.60.30:
    name: Governo do programa RPA
    description: |
      Governo do programa de automação robótica de processos, incluindo a propriedade dos bots.
    source_hash: sha256-019dfd4a0b768f38
  BC-930.60.40:
    name: Controlo e auditoria da automação
    description: |
      Referencial de controlo, monitorização e trilho de auditoria sobre o parque de automação.
    source_hash: sha256-cfc01924c2e18c84
  BC-930.70:
    name: Gestão de riscos e controlos de processo
    description: |
      Riscos e controlos integrados nos processos, incluindo a segregação de funções. Complementa, sem substituir, as funções de risco empresarial e auditoria.
    source_hash: sha256-6ca81d1368072127
  BC-930.70.10:
    name: Conceção dos controlos de processo
    description: |
      Conceção de controlos preventivos e detetivos integrados nos fluxos de processo.
    source_hash: sha256-0ad8afa949bf8c0b
  BC-930.70.20:
    name: Modelação da segregação de funções
    description: |
      Modelação das regras de segregação de funções e deteção de conflitos nos processos.
    source_hash: sha256-57bbc7c0abbfbca9
  BC-930.70.30:
    name: Teste dos controlos de processo
    description: |
      Testes periódicos da eficácia dos controlos de processo e do tratamento de exceções.
    source_hash: sha256-aff15ff1f48a791f
