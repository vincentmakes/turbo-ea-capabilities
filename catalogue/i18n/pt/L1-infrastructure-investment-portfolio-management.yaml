locale: pt
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Gestão de Investimento e Portefólio de Infraestruturas
    description: |
      Estratégia de investimento, originação, avaliação e alocação de capital
      num portefólio de ativos de infraestruturas e projetos de capital.
      Disciplina do lado do dono/investidor que decide que infraestruturas
      financiar e como, e acompanha as rendibilidades ao nível do portefólio e
      o valor público ao longo do ciclo de vida do ativo.
    in_scope:
      - Estratégia de investimento em infraestruturas e foco setorial
      - Originação e triagem de pipeline de negócios e projetos
      - Casos de negócio, avaliação de opções e análise custo-benefício
      - Priorização e sequenciamento do programa de capital no portefólio
      - Estratégia de financiamento incluindo subvenções e project finance
      - Acompanhamento de desempenho, benefícios e value-for-money do portefólio
    out_of_scope:
      - Tesouraria corporativa e financiamento empresarial (BC-210)
      - Formulação de estratégia empresarial (BC-580)
      - Receita operacional, tarifas e receita de concessão (BC-5100)
      - Controlos de entrega de programa e projeto (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Estratégia de Investimento em Infraestruturas
    description: |
      Definição da estratégia de investimento em infraestruturas de longo prazo,
      do foco setorial e do apetite ao risco que rege onde o capital é aplicado.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: "Estratégia de Setor e Mercado"
    description: |
      Seleção dos setores e mercados de infraestruturas a visar com base na
      procura, na política e na dinâmica competitiva.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Definição da Tese de Investimento
    description: |
      Articulação da tese de investimento e da lógica de criação de valor para
      cada segmento-alvo de infraestruturas.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Enquadramento de Alocação de Capital
    description: |
      Enquadramento e critérios que regem a alocação de capital entre setores,
      geografias e classes de ativos.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Definição do Apetite ao Risco
    description: |
      Definição do apetite e dos limiares de tolerância ao risco de investimento
      do portefólio de infraestruturas.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: "Gestão de Pipeline e Originação"
    description: |
      Originação, triagem e monitorização de oportunidades de investimento e de
      projetos de infraestruturas face a critérios de investimento.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Originação de Oportunidades
    description: |
      Prospeção de oportunidades de investimento e de promoção de infraestruturas
      através de mercados, governo e canais proprietários.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: "Triagem e Priorização de Investimento"
    description: |
      Triagem e priorização inicial de oportunidades face a filtros estratégicos
      e financeiros.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: "Inteligência de Mercado e Setor"
    description: |
      Recolha e análise de inteligência de mercado, procura e política para
      orientar a originação.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Monitorização do Pipeline
    description: |
      Monitorização de oportunidades nas fases de processo de decisão, da lead à
      decisão de investimento.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: "Gestão de Casos de Negócio e Avaliação"
    description: |
      Desenvolvimento e avaliação de casos de negócio para o investimento em
      infraestruturas, incluindo avaliação de opções e de valor.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Avaliação de Opções
    description: |
      Avaliação de opções de investimento e de entrega face aos objetivos e
      restrições estratégicas.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Análise Custo-Benefício
    description: |
      Avaliação quantificada de custo-benefício e económica dos investimentos
      candidatos em infraestruturas.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: "Avaliação de Valor Económico e Social"
    description: |
      Avaliação do valor económico, social e público alargado gerado pelo
      investimento.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Aprovação da Decisão de Investimento
    description: |
      Portões de governação e aprovações que autorizam a progressão e o
      financiamento comprometido.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Priorização do Programa de Capital
    description: |
      Priorização, equilíbrio e sequenciamento de investimentos no programa de
      capital e no portefólio de ativos.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Priorização do Portefólio
    description: |
      Ordenação de investimentos candidatos face ao valor, ao risco e à
      contribuição estratégica.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Racionamento de Capital
    description: |
      Alocação de capital limitado entre exigências de investimento concorrentes.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Equilíbrio do Portefólio
    description: |
      Equilíbrio do portefólio entre horizontes de risco, setor e ciclo de vida.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Sequenciamento de Investimentos
    description: |
      Faseamento e sequenciamento de investimentos para gerir a capacidade de
      entrega e os perfis de financiamento.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: "Estratégia de Financiamento"
    description: |
      Estratégia para obter e estruturar o financiamento necessário para
      entregar o programa de infraestruturas.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Estratégia de Fontes de Financiamento
    description: |
      Seleção de fontes de financiamento entre mecanismos públicos, privados e
      de pagamento pelo utilizador.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: "Gestão de Subvenções e Financiamento Público"
    description: |
      Obtenção e administração de subvenções e contribuições públicas de capital.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Estruturação de Project Finance
    description: |
      Estruturação de project finance, dívida e capital próprio para ativos de
      infraestruturas.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Estruturação de Financiamento Misto
    description: |
      Estruturação de pacotes de financiamento misto público-privado e
      concessional.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Gestão do Desempenho do Portefólio
    description: |
      Monitorização e reporte das rendibilidades, benefícios e valor gerados pelo
      portefólio de investimento em infraestruturas.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Monitorização do Desempenho do Portefólio
    description: |
      Monitorização do desempenho financeiro e operacional em todo o portefólio.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Acompanhamento de Benefícios
    description: |
      Acompanhamento dos benefícios e resultados realizados face aos casos de
      negócio de investimento.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Avaliação de Value-for-Money
    description: |
      Avaliação do value-for-money e do valor ao longo de toda a vida em todo o
      portefólio.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Reporte do Portefólio
    description: |
      Reporte do desempenho do portefólio a investidores, órgãos de administração
      e partes interessadas públicas.
    source_hash: sha256-35c417c36c5cb686
