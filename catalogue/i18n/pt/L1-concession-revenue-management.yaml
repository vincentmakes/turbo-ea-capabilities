locale: pt
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Gestão de Concessão e Receita
    description: |
      Gestão de concessões e parcerias público-privadas, tarifas e preços,
      cobrança e asseguração de receita, gestão de subvenções e subsídios, e
      parcerias comerciais que monetizam os ativos de infraestruturas ao longo do
      prazo da concessão.
    in_scope:
      - Gestão de acordos de concessão e PPP
      - Gestão de tarifas, portagens e preços regulados
      - Cobrança, asseguração de receita e controlo de fugas
      - Administração de subvenções, subsídios e pagamentos por disponibilidade
      - Parcerias comerciais e desenvolvimento de receita acessória
      - Monetização de receita de terrenos e propriedade
    out_of_scope:
      - Gestão empresarial de preços (BC-450)
      - Estratégia de financiamento de investimento (BC-5000)
      - Controlo de preços regulatório (BC-5110)
      - Tesouraria corporativa e gestão de caixa
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: "Gestão de Concessão e PPP"
    description: |
      Gestão de acordos de concessão e de estruturas de parceria público-privada
      ao longo do seu ciclo de vida e obrigações.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Gestão de Acordos de Concessão
    description: |
      Administração de acordos de concessão, termos e obrigações ao longo do prazo
      da concessão.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: Estruturação de PPP
    description: |
      Estruturação de arranjos de parceria público-privada e da sua alocação de
      risco e retorno.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: "Mecanismo de Disponibilidade e Pagamento"
    description: |
      Conceção e operação de mecanismos de disponibilidade e pagamento que regem a
      remuneração da concessão.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Conformidade da Concessão
    description: |
      Asseguração de que as obrigações e os padrões de desempenho da concessão são
      cumpridos ao longo do acordo.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: "Gestão de Tarifas e Preços"
    description: |
      Definição e governação de tarifas, portagens e preços cobrados pelo uso e
      serviços de infraestruturas.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: "Definição de Tarifas e Portagens"
    description: |
      Determinação de tarifas e portagens para o acesso e uso de infraestruturas.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Estratégia de Preços
    description: |
      Definição da estratégia comercial de preços para serviços e capacidade de
      infraestruturas.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Controlo de Preços Regulado
    description: |
      Gestão dos preços dentro de enquadramentos e determinações de controlo de
      preços regulados.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: "Preços Dinâmicos e de Congestionamento"
    description: |
      Aplicação de preços responsivos à procura e baseados no congestionamento
      para gerir utilização e receita.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: "Cobrança e Asseguração de Receita"
    description: |
      Cobrança de receita de infraestruturas e asseguração de que o valor faturado
      é capturado e reconciliado com rigor.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: "Tarifação e Cobrança"
    description: |
      Tarifação e cobrança de taxas de uso, portagens e receita de serviço aos
      clientes.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Asseguração de Receita
    description: |
      Asseguração de que toda a receita gerada é faturada, capturada e registada
      de forma completa.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Gestão de Fugas de Receita
    description: |
      Identificação e recuperação de fugas de receita, evasão e sub-cobrança.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: "Liquidação e Reconciliação"
    description: |
      Liquidação e reconciliação da receita cobrada entre sistemas e contrapartes.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: "Gestão de Subvenções e Subsídios"
    description: |
      Administração de subvenções, subsídios e contribuições públicas que financiam
      a disponibilidade e a operação de infraestruturas.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: "Administração de Subsídios e Subvenções"
    description: |
      Administração de subsídios e subvenções que apoiam os serviços de
      infraestruturas.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Gestão de Pagamentos por Disponibilidade
    description: |
      Gestão de pagamentos baseados na disponibilidade associados ao desempenho do
      serviço e do ativo.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Conformidade de Financiamento Público
    description: |
      Conformidade com as condições e o reporte associados ao financiamento
      público.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Gestão de Contribuições Governamentais
    description: |
      Gestão das contribuições governamentais de capital e de operação para as
      infraestruturas.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Gestão de Parcerias Comerciais
    description: |
      Desenvolvimento de receita de terceiros, acessória e baseada em propriedade
      através de parcerias comerciais.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Gestão de Receita de Terceiros
    description: |
      Gestão da receita proveniente de acesso, serviços e arranjos de terceiros.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Gestão de Parcerias Comerciais
    description: |
      Desenvolvimento e gestão de parcerias comerciais que geram receita de
      infraestruturas.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Desenvolvimento de Receita Acessória
    description: |
      Desenvolvimento de fontes de receita acessórias e não nucleares em torno dos
      ativos de infraestruturas.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: "Receita de Terrenos e Propriedade"
    description: |
      Monetização de terrenos e propriedade associados às infraestruturas.
    source_hash: sha256-4931ef33faa7594b
metadata:
  translator: claude-ai
  date: "2026-07-16"
