locale: pt
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Gestão de Aprovisionamento e Contratos de Infraestruturas
    description: |
      Estratégia de aprovisionamento, concursos e administração de contratos para
      a entrega de infraestruturas, incluindo gestão comercial e de medição de
      quantidades, variações e reclamações, e gestão de subcontratados e da
      cadeia de abastecimento.
    in_scope:
      - Estratégia de aprovisionamento, empacotamento e seleção de via
      - Concursos, gestão de propostas e pré-qualificação
      - Formação, administração de contratos e certificação de pagamentos
      - Gestão comercial e de medição de quantidades e valorização
      - Gestão de variações, eventos de compensação e reclamações
      - Aprovisionamento e desempenho de subcontratados e da cadeia de abastecimento
    out_of_scope:
      - Aprovisionamento empresarial (BC-500)
      - Concursos e estimativa de engenharia (BC-1140)
      - Gestão do relacionamento com fornecedores (BC-510)
      - Execução de trabalhos de construção e entrega em obra
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: "Estratégia e Empacotamento de Aprovisionamento"
    description: |
      Definição da estratégia de aprovisionamento, do empacotamento de trabalhos
      e das vias contratuais para a entrega de infraestruturas.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Definição da Estratégia de Aprovisionamento
    description: |
      Definição da estratégia de aprovisionamento alinhada aos objetivos do
      programa e à capacidade do mercado.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Definição de Pacotes de Trabalho
    description: |
      Estruturação dos trabalhos em pacotes adequados às necessidades do mercado
      e da entrega.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Seleção da Via Contratual
    description: |
      Seleção das vias e formas contratuais apropriadas a cada pacote.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Envolvimento do Mercado Fornecedor
    description: |
      Envolvimento precoce com o mercado fornecedor para moldar e testar as
      abordagens de aprovisionamento.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: "Concursos e Gestão de Propostas"
    description: |
      Preparação, avaliação e adjudicação de concursos para trabalhos e serviços
      de infraestruturas.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Preparação do Concurso
    description: |
      Preparação de documentos e requisitos de concurso para emissão ao mercado.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: "Desenvolvimento e Submissão de Propostas"
    description: |
      Desenvolvimento e submissão de propostas conformes e competitivas quando se
      atua como proponente.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: "Avaliação e Adjudicação de Concursos"
    description: |
      Avaliação de propostas e adjudicação de contratos face a critérios
      definidos.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Gestão de Pré-Qualificação
    description: |
      Gestão da pré-qualificação e das listas de seleção de fornecedores.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Administração de Contratos
    description: |
      Administração de contratos de infraestruturas através da formação,
      obrigações, pagamento e governação.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Formação de Contratos
    description: |
      Formação e celebração de contratos e dos seus acordos de suporte.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Gestão de Obrigações Contratuais
    description: |
      Gestão das obrigações contratuais, notificações e entregáveis ao longo da
      entrega.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Certificação de Pagamentos
    description: |
      Certificação dos pagamentos devidos ao abrigo dos termos do contrato.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Governação de Contratos
    description: |
      Governação do desempenho, conformidade e encerramento do contrato.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: "Gestão Comercial e Medição de Quantidades"
    description: |
      Gestão comercial e de medição de quantidades da medição, valorização e
      custo ao longo do contrato.
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: "Medição de Quantidades e Medição"
    description: |
      Medição e quantificação dos trabalhos em apoio à valorização e ao pagamento.
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: Gestão de Valorizações Intercalares
    description: |
      Gestão das valorizações intercalares e pedidos de pagamento durante a
      entrega.
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: Gestão Comercial de Custos
    description: |
      Gestão comercial do custo, margem e posição de tesouraria do contrato.
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: Fecho de Contas Final
    description: |
      Acordo e liquidação das contas finais à conclusão do contrato.
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: "Gestão de Variações e Reclamações"
    description: |
      Gestão de variações, eventos de compensação, reclamações e disputas
      decorrentes de contratos de infraestruturas.
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: Gestão de Variações
    description: |
      Gestão das variações de âmbito e das suas consequências comerciais.
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: Gestão de Eventos de Compensação
    description: |
      Avaliação e gestão de eventos de compensação ao abrigo do contrato.
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Gestão de Reclamações
    description: |
      Preparação, defesa e resolução de reclamações contratuais.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Resolução de Disputas
    description: |
      Resolução de disputas através de negociação, arbitragem e processos formais.
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: "Gestão de Subcontratados e Cadeia de Abastecimento"
    description: |
      Aprovisionamento, onboarding e gestão de subcontratados e da cadeia de
      abastecimento de entrega.
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Aprovisionamento de Subcontratados
    description: |
      Aprovisionamento e nomeação de subcontratados para os pacotes de entrega.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: Gestão de Pacotes de Especialidade
    description: |
      Gestão dos pacotes de especialidade e das suas interfaces durante a entrega.
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: Onboarding da Cadeia de Abastecimento
    description: |
      Onboarding e verificação de conformidade dos parceiros da cadeia de
      abastecimento.
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: Gestão do Desempenho de Subcontratados
    description: |
      Monitorização e gestão do desempenho dos subcontratados face ao contrato.
    source_hash: sha256-154e39a8ff2b1f3c
metadata:
