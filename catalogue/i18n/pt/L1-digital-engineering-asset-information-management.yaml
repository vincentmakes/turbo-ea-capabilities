locale: pt
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Gestão de Engenharia Digital e Informação de Ativos
    description: |
      Engenharia digital e informação estruturada de ativos ao longo do ciclo de
      vida do ativo construído, abrangendo a modelação de informação da
      construção, o CDE, a integração 4D e 5D, a gestão geoespacial e de
      levantamentos, e a gestão de gémeo digital e de informação de ativos.
      Transforma modelos e dados num ativo de informação de confiança, do projeto
      à construção e operação.
    in_scope:
      - Estratégia, normas e coordenação de modelos e deteção de conflitos BIM
      - Common data environment e gestão de requisitos de informação
      - Sequenciamento de construção 4D e integração de custos 5D
      - Gestão de dados geoespaciais, de levantamento e de reality capture
      - Desenvolvimento de gémeo digital e integração de dados operacionais
      - Transferência estruturada de informação ao longo do ciclo de vida do ativo
    out_of_scope:
      - Gestão de documentos de engenharia (BC-1130)
      - Gestão do ciclo de vida do produto (BC-820)
      - Gestão empresarial de informação e dados (BC-610)
      - Entrega de plataformas e aplicações de TI (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: Gestão BIM
    description: |
      Estratégia, normas e coordenação da modelação de informação da construção
      entre projetos e disciplinas.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: "Estratégia e Normas BIM"
    description: |
      Definição da estratégia, normas e protocolos de informação BIM.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: Planeamento de Execução BIM
    description: |
      Planeamento da execução, papéis e entregáveis BIM de um projeto.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Coordenação de Autoria de Modelos
    description: |
      Coordenação da autoria de modelos por disciplina segundo normas e
      calendários acordados.
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: "Federação de Modelos e Deteção de Conflitos"
    description: |
      Federação de modelos por disciplina e deteção e resolução de conflitos.
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: Common Data Environment
    description: |
      Gestão do ambiente de informação partilhado e dos requisitos, controlo e
      intercâmbio dos dados de projeto.
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: Gestão do Common Data Environment
    description: |
      Operação do CDE como fonte única de informação de projeto.
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: Gestão de Requisitos de Informação
    description: |
      Definição e gestão dos requisitos de informação organizacionais, de ativo e
      de intercâmbio.
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: "Controlo de Documentos e Dados"
    description: |
      Controlo, versionamento e gestão de estado de documentos e dados.
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: "Intercâmbio de Dados e Interoperabilidade"
    description: |
      Intercâmbio de informação entre sistemas usando formatos abertos e
      interoperáveis.
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: "Integração 4D e 5D"
    description: |
      Integração de modelos com o programa e o custo para apoiar o sequenciamento
      de construção e a perceção de quantidades e custos.
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: "Sequenciamento de Construção 4D"
    description: |
      Ligação dos modelos ao programa para visualizar e planear as sequências de
      construção.
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: "Integração de Custos 5D"
    description: |
      Integração dos dados do modelo com o custo para apoiar a estimativa e o
      controlo de custos.
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: Medição de Quantidades Baseada em Modelo
    description: |
      Derivação de quantidades diretamente a partir de modelos coordenados.
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: Coordenação Projeto-Construção
    description: |
      Coordenação da informação do modelo do projeto para a entrega de construção.
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: "Gestão Geoespacial e de Levantamentos"
    description: |
      Gestão de dados geoespaciais, de levantamento e de terreno que sustentam o
      projeto e a construção.
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: Gestão de Dados Geoespaciais
    description: |
      Gestão de dados geoespaciais e cartográficos em toda a base de ativos.
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: "Levantamento e Implantação"
    description: |
      Provisão de controlo de levantamento e implantação para as obras de
      construção.
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: "Reality Capture e Digitalização"
    description: |
      Captura das condições tal-construído através de digitalização e técnicas de
      reality capture.
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: Gestão de Dados Geotécnicos
    description: |
      Gestão de dados geotécnicos e de prospeção de terreno.
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: "Gémeo Digital e Dados de Ativos"
    description: |
      Desenvolvimento de modelos de informação de ativos e gémeos digitais
      alimentados por dados operacionais para o ativo em uso.
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: Gestão do Modelo de Informação de Ativos
    description: |
      Gestão do modelo de informação de ativos para o ativo operacional.
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: Desenvolvimento de Gémeo Digital
    description: |
      Desenvolvimento e manutenção de gémeos digitais de ativos de infraestruturas.
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: Integração de Dados Operacionais
    description: |
      Integração de dados operacionais e de sensores na informação de ativos e nos
      gémeos.
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: Transferência de Informação
    description: |
      Transferência estruturada da informação de ativos da entrega para as
      operações.
    source_hash: sha256-d849483d22283722
