kind: business-process
locale: pt
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Prospecto-a-Cliente"
    description: "Ciclo ponta a ponta de aquisição de clientes, da estratégia de mercado e segmento à marca, geração de demanda, captura de leads, conversão, onboarding e retenção e advocacy contínuos. Um BP2 por stage_name do VS-440."
  BP-1050.10:
    name: "Estratégia de Mercado e Segmento"
    description: "Definir mercados-alvo e segmentos de cliente e alinhar prioridades de go-to-market a onde o direito a vencer é mais forte."
  BP-1050.10.10:
    name: "Analisar Cenário de Mercado"
    description: "Dimensionar mercados, perfilar concorrentes e evidenciar tendências que moldam a demanda e a estratégia de aquisição."
  BP-1050.10.20:
    name: "Definir Segmentos-Alvo"
    description: "Definir e priorizar segmentos-alvo de clientes com base em necessidade, fit e direito a vencer."
  BP-1050.10.30:
    name: "Definir Prioridades de Aquisição"
    description: "Traduzir prioridades de segmento em metas de aquisição — contas, geografias, canais — para o horizonte de planejamento."
  BP-1050.20:
    name: "Marca e Posicionamento"
    description: "Desenvolver e zelar pela marca, posicionamento e sistema de mensagem usado em todos os canais de aquisição."
  BP-1050.20.10:
    name: "Desenvolver Estratégia de Marca"
    description: "Definir promessa de marca, personalidade, arquitetura e identidade visual; alinhar entre mercados e segmentos."
  BP-1050.20.20:
    name: "Desenvolver Posicionamento e Mensagem"
    description: "Desenvolver posicionamento e mensagem para cada segmento e oferta; equipar campanhas e vendas com narrativa consistente."
  BP-1050.20.30:
    name: "Zelar por Ativos de Marca"
    description: "Manter diretrizes de marca, gerenciar aprovações sobre o uso da marca e governar a identidade visual e verbal no mercado."
  BP-1050.30:
    name: "Geração de Demanda"
    description: "Gerar awareness e demanda em escala por canais pagos, próprios, ganhos e de parceiros."
  BP-1050.30.10:
    name: "Planejar Campanhas de Geração de Demanda"
    description: "Planejar campanhas por segmento, canal e oferta; alocar orçamento; definir metas de leads e pipeline."
  BP-1050.30.20:
    name: "Executar Campanhas Multicanal"
    description: "Executar campanhas pagas, próprias, ganhas e de parceiros; gerenciar criativos, landing pages e ofertas."
  BP-1050.30.30:
    name: "Medir Performance de Campanhas"
    description: "Medir alcance, resposta e impacto no pipeline por campanha e canal; iterar criativos e investimento."
  BP-1050.40:
    name: "Captura e Nurture de Leads"
    description: "Capturar interesse de entrada, enriquecer e pontuar leads e nurturá-los até o status sales-ready."
  BP-1050.40.10:
    name: "Capturar Leads de Entrada"
    description: "Capturar leads de formulários, eventos, indicações de parceiros e canais de entrada na plataforma de marketing automation."
  BP-1050.40.20:
    name: "Enriquecer e Pontuar Leads"
    description: "Enriquecer com dados firmográficos e comportamentais; pontuar por fit e intenção para identificar leads sales-ready."
  BP-1050.40.30:
    name: "Nurturar Leads"
    description: "Executar programas de nurture — conteúdo, drip campaigns, retargeting — para avançar leads ao status sales-ready."
  BP-1050.40.40:
    name: "Repassar Leads Sales-Ready"
    description: "Rotear leads sales-ready para vendas para engajamento direto; rastrear conversão em oportunidade."
  BP-1050.50:
    name: "Conversão"
    description: "Converter leads qualificados em primeiros pedidos ou primeiras assinaturas via engajamento de vendas, trials e ofertas."
  BP-1050.50.10:
    name: "Engajar Prospecto"
    description: "Conduzir engajamento direto de vendas, demos e trials para construir confiança do cliente e avançar à decisão."
  BP-1050.50.20:
    name: "Endereçar Objeções do Comprador"
    description: "Evidenciar e endereçar objeções — preço, fit, segurança, integração — por meio de evidência e trial."
  BP-1050.50.30:
    name: "Ofertar e Fechar o Primeiro Negócio"
    description: "Construir uma oferta de primeiro negócio, negociar termos e capturar o primeiro pedido ou assinatura."
  BP-1050.50.40:
    name: "Acompanhar Funil de Conversão"
    description: "Acompanhar conversão lead-a-cliente por segmento, canal e oferta; iterar sobre o funil."
  BP-1050.60:
    name: "Onboarding de Clientes"
    description: "Realizar o onboarding de novos clientes — provisionamento, treinamento, plano de sucesso — para acelerar o time-to-value."
  BP-1050.60.10:
    name: "Receber Novo Cliente"
    description: "Conduzir a experiência de boas-vindas — kickoff, contatos nomeados, plano de sucesso — para definir expectativas e energia."
  BP-1050.60.20:
    name: "Provisionar Cliente"
    description: "Provisionar o cliente nos sistemas de entrega — contas, entitlements, integrações, migração de dados."
  BP-1050.60.30:
    name: "Treinar Usuários do Cliente"
    description: "Treinar os usuários do cliente no produto ou serviço; certificar champions; registrar nos marcos do plano de sucesso."
  BP-1050.60.40:
    name: "Confirmar Time-to-Value"
    description: "Validar que o cliente alcançou os marcos de primeiro valor; capturar para o scoring de retenção."
  BP-1050.70:
    name: "Retenção e Advocacy"
    description: "Reter clientes, dirigir renovação e expansão e transformar promotores em advogados e referências."
  BP-1050.70.10:
    name: "Pontuar Saúde do Cliente"
    description: "Pontuar a saúde do cliente a partir de uso do produto, engajamento e sinais de feedback; evidenciar contas em risco para intervenção."
  BP-1050.70.20:
    name: "Dirigir Renovação e Expansão"
    description: "Conduzir a motion de renovação e identificar oportunidades de expansão — cross-sell, upsell — dentro da conta."
  BP-1050.70.30:
    name: "Cultivar Advocacy"
    description: "Identificar promotores, capturar referências, cases e depoimentos; ativar programas de advocacy."
