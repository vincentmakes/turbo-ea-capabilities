kind: business-process
locale: pt
source: BP1-acquire-to-retire.yaml
entries:
  BP-1090:
    name: "Aquisição-a-Descomissionamento"
    description: "Ciclo de vida de ativos físicos ponta a ponta, da necessidade e justificativa à aquisição, comissionamento, operar e manter, risco e confiabilidade, manutenção da informação do ativo, e descomissionamento. Um BP2 por stage_name do VS-10."
  BP-1090.10:
    name: "Necessidade e Justificativa do Ativo"
    description: "Identificar necessidades de ativo, justificar capital e aprovar o ativo antes que comece a aquisição."
  BP-1090.10.10:
    name: "Identificar Necessidade de Ativo"
    description: "Capturar a necessidade de negócio por um ativo novo ou de reposição; reunir contexto técnico e operacional."
  BP-1090.10.20:
    name: "Construir Justificativa de Capital"
    description: "Construir o business case — custo total de propriedade, NPV, sensibilidade — e obter aprovação de capital."
  BP-1090.10.30:
    name: "Aprovar Plano do Ativo"
    description: "Rotear pelo comitê de aprovação de capital; documentar condições e vincular ao portfólio."
  BP-1090.20:
    name: "Aquisição"
    description: "Sourcing, design ou especificação, compra e aceitação de entrega do ativo."
  BP-1090.20.10:
    name: "Especificar Ativo"
    description: "Traduzir a necessidade em especificação do ativo — capacidade, performance, compliance, requisitos de ciclo de vida."
  BP-1090.20.20:
    name: "Adquirir Ativo"
    description: "Conduzir sourcing, seleção de fornecedor e contratação; emitir pedido de compra ou contrato de construção."
  BP-1090.20.30:
    name: "Aceitar Entrega do Ativo"
    description: "Receber, inspecionar e aceitar formalmente o ativo contra a especificação."
  BP-1090.30:
    name: "Comissionamento e Capitalização"
    description: "Instalar, testar e comissionar o ativo; capitalizá-lo nos livros."
  BP-1090.30.10:
    name: "Instalar e Comissionar Ativo"
    description: "Instalar, energizar e executar testes de comissionamento; transferir para operações na conclusão bem-sucedida."
  BP-1090.30.20:
    name: "Capitalizar Ativo"
    description: "Capitalizar o ativo no registro de ativos fixos com a classe, método de depreciação e vida útil adequados."
  BP-1090.40:
    name: "Operar e Manter"
    description: "Operar o ativo e executar manutenção preventiva, corretiva e baseada em condição ao longo da vida útil."
  BP-1090.40.10:
    name: "Operar Ativo"
    description: "Conduzir operações cotidianas do ativo dentro dos parâmetros de projeto; capturar dados operacionais."
  BP-1090.40.20:
    name: "Planejar e Programar Manutenção"
    description: "Planejar manutenção preventiva, preditiva e baseada em condição; programar contra disponibilidade de operações e recursos."
  BP-1090.40.30:
    name: "Executar Manutenção"
    description: "Executar trabalhos de manutenção — preventiva, corretiva, parada — e confirmar o retorno do ativo ao serviço."
  BP-1090.50:
    name: "Risco e Confiabilidade"
    description: "Gerenciar riscos de integridade do ativo, confiabilidade e segurança operacional ao longo da vida operacional."
  BP-1090.50.10:
    name: "Avaliar Risco do Ativo"
    description: "Conduzir avaliações de criticidade e risco — modos de falha, consequência, probabilidade — para direcionar programas de manutenção e integridade."
  BP-1090.50.20:
    name: "Gerenciar Integridade do Ativo"
    description: "Executar programas de inspeção, testes e gestão de corrosão para manter a integridade ao longo do ciclo de vida."
  BP-1090.50.30:
    name: "Melhorar Confiabilidade do Ativo"
    description: "Conduzir melhoria de confiabilidade — análise de causa-raiz em falhas crônicas, modelagem RAM, recomendações de mudança de design."
  BP-1090.60:
    name: "Manutenção da Informação do Ativo"
    description: "Manter dados mestres do ativo, desenhos, configuração e documentos ao longo do ciclo de vida."
  BP-1090.60.10:
    name: "Manter Dados Mestres do Ativo"
    description: "Manter dados mestres do ativo — classe, localização, parent-child, atributos — no registro de ativos."
  BP-1090.60.20:
    name: "Manter Documentos do Ativo"
    description: "Manter desenhos, manuais, P&IDs, certificados e documentação as-built; alinhar com mudança de engenharia."
  BP-1090.70:
    name: "Descomissionamento e Disposição"
    description: "Planejar e executar fim de vida — descomissionamento, disposição, restauração e tratamento contábil final."
  BP-1090.70.10:
    name: "Planejar Descomissionamento"
    description: "Planejar fim de vida — timing, obrigações ambientais, remoção, restauração, impacto financeiro."
  BP-1090.70.20:
    name: "Executar Descomissionamento"
    description: "Descomissionar, desmontar e remover o ativo; gerenciar manuseio de material perigoso e restauração do site."
  BP-1090.70.30:
    name: "Dispor ou Vender Ativo"
    description: "Dispor, reciclar ou vender o ativo; capturar valor residual e cadeia de custódia."
