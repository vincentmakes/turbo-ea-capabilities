kind: business-process
locale: pt
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Risco-a-Mitigação"
    description: "Ciclo de gestão de riscos corporativos do enquadramento de apetite ao risco à identificação, avaliação, tratamento, monitoramento e reporte de riscos. Um BP2 por stage_name do VS-500."
    source_hash: sha256-494ddf222f3c79d7
  BP-1110.10:
    name: "Apetite e Framework de Risco"
    description: "Definir apetite e tolerâncias de risco; definir o framework de gestão de riscos corporativo, taxonomia e governança."
    source_hash: sha256-5ed438707cfc47f0
  BP-1110.10.10:
    name: "Definir Apetite ao Risco"
    description: "Definir as declarações de apetite ao risco da empresa e os limiares de tolerância por categoria de risco; ratificar com o conselho."
    source_hash: sha256-2702c26d79adb56d
  BP-1110.10.20:
    name: "Definir Framework de Risco"
    description: "Definir o framework de ERM — taxonomia, fóruns de governança, papéis, ciclo de vida — sob COSO ERM e ISO 31000."
    source_hash: sha256-975111890e3db132
  BP-1110.20:
    name: "Identificação de Riscos"
    description: "Identificar riscos corporativos nos domínios estratégico, operacional, financeiro, regulatório e emergente."
    source_hash: sha256-c458af5588d1358c
  BP-1110.20.10:
    name: "Conduzir Workshops de Risco"
    description: "Conduzir workshops estruturados para evidenciar riscos no negócio com owners e SMEs."
    source_hash: sha256-98c4f264e792dc22
  BP-1110.20.20:
    name: "Escanear Riscos Externos"
    description: "Escanear fontes externas — regulatórias, de mercado, geopolíticas, ambientais — em busca de sinais emergentes de risco."
    source_hash: sha256-6ed46d7d6b53c706
  BP-1110.20.30:
    name: "Capturar Inventário de Riscos"
    description: "Persistir riscos identificados no registro de riscos da empresa com owner, categoria e avaliação inicial."
    source_hash: sha256-982ce6599d21e9f5
  BP-1110.30:
    name: "Avaliação de Riscos"
    description: "Avaliar riscos identificados quanto a probabilidade, impacto e velocidade; classificar risco inerente e residual."
    source_hash: sha256-68ad48200248cad9
  BP-1110.30.10:
    name: "Pontuar Probabilidade e Impacto"
    description: "Pontuar a probabilidade e o impacto de cada risco usando métodos qualitativos e quantitativos do framework."
    source_hash: sha256-d19d95f00f313a43
  BP-1110.30.20:
    name: "Classificar Risco Inerente e Residual"
    description: "Calcular a classificação de risco inerente e, considerando os controles existentes, a classificação residual."
    source_hash: sha256-62d82e648198bd19
  BP-1110.30.30:
    name: "Priorizar Riscos"
    description: "Priorizar riscos para tratamento com base em classificação residual, apetite e relevância estratégica."
    source_hash: sha256-bae4d88342581ab3
  BP-1110.40:
    name: "Tratamento e Desenho de Controles"
    description: "Decidir tratamento — aceitar, evitar, mitigar, transferir — e desenhar ou fortalecer controles."
    source_hash: sha256-a53b334a45df6a03
  BP-1110.40.10:
    name: "Decidir Tratamento de Risco"
    description: "Decidir o tratamento por risco — aceitar, evitar, mitigar, transferir (seguro, contratual, hedging)."
    source_hash: sha256-a3831e0126cf6e78
  BP-1110.40.20:
    name: "Desenhar Controles"
    description: "Desenhar ou fortalecer controles — preventivos, detectivos, corretivos — para trazer o risco residual ao apetite."
    source_hash: sha256-5a8597b33882eb25
  BP-1110.40.30:
    name: "Implementar Plano de Tratamento"
    description: "Implementar o plano de tratamento; atribuir owners, prazos e evidências de verificação."
    source_hash: sha256-d1b6ee2996ec0f69
  BP-1110.50:
    name: "Monitoramento"
    description: "Monitorar riscos e controles — acompanhamento de KRIs, teste de controles, monitoramento de padrões de incidente."
    source_hash: sha256-31343c537ab94347
  BP-1110.50.10:
    name: "Acompanhar Indicadores-Chave de Risco"
    description: "Acompanhar KRIs e sinais emergentes de risco; disparar limiares e rotas de escalonamento."
    source_hash: sha256-6998b92c9e955c6c
  BP-1110.50.20:
    name: "Testar Controles"
    description: "Testar a eficácia de desenho e operação dos controles; classificar exceções; conduzir remediação."
    source_hash: sha256-144bcd0032a31a00
  BP-1110.50.30:
    name: "Monitorar Padrões de Incidentes"
    description: "Monitorar padrões de incidentes, near-misses e eventos de perda; refinar visões de risco e controle conforme."
    source_hash: sha256-94b91d87039665ec
  BP-1110.60:
    name: "Reporte e Escalonamento"
    description: "Reportar riscos corporativos a fóruns executivos, conselho e reguladores; escalar violações."
    source_hash: sha256-440701f79d5734c8
  BP-1110.60.10:
    name: "Produzir Relatório de Risco"
    description: "Produzir o relatório periódico de risco corporativo — dashboards, heat-maps, narrativas dos top risks."
    source_hash: sha256-a65872e6f0fd82e1
  BP-1110.60.20:
    name: "Reportar a Executivos e Conselho"
    description: "Reportar ao comitê executivo de risco e ao comitê de risco do conselho; capturar decisões e direção."
    source_hash: sha256-7339dc20573eddab
  BP-1110.60.30:
    name: "Escalar Violações"
    description: "Escalar violações de apetite e incidentes de alta velocidade conforme protocolo; notificar reguladores quando exigido."
    source_hash: sha256-afb51b25de2f12a5
