kind: business-process
locale: pt
source: BP1-opportunity-to-order.yaml
entries:
  BP-1060:
    name: "Oportunidade-a-Pedido"
    description: "Ciclo de vendas enterprise pré-venda da qualificação da oportunidade ao escopo de solução, cotação e configuração, aprovações de preço, proposta, negociação, contrato e booking do pedido, e handover ao atendimento. Um BP2 por stage_name do VS-380."
  BP-1060.10:
    name: "Qualificação da Oportunidade"
    description: "Qualificar a oportunidade contra fit, orçamento, autoridade e timing; decidir se vale investir esforço de pursuit."
  BP-1060.10.10:
    name: "Capturar Oportunidade"
    description: "Capturar a oportunidade no CRM com origem, produtos de interesse, alvo de fechamento e contexto da conta."
  BP-1060.10.20:
    name: "Qualificar Oportunidade"
    description: "Aplicar critérios de qualificação (BANT, MEDDIC ou equivalente) para validar fit, orçamento, autoridade, necessidade e timing."
  BP-1060.10.30:
    name: "Construir Plano de Pursuit"
    description: "Decidir o pursuit, construir o plano de conta e o mapa de unidade decisória, e montar o time de pursuit."
  BP-1060.20:
    name: "Escopo de Solução"
    description: "Descobrir os requisitos do cliente e escopar uma solução que os atenda dentro de restrições comerciais e de entrega."
  BP-1060.20.10:
    name: "Descobrir Requisitos"
    description: "Conduzir workshops e entrevistas de descoberta para capturar requisitos funcionais, não funcionais e de contexto operacional."
  BP-1060.20.20:
    name: "Desenhar Solução"
    description: "Traduzir requisitos em uma solução candidata — produtos, serviços, integrações, configurações."
  BP-1060.20.30:
    name: "Validar Viabilidade da Solução"
    description: "Validar a solução com entrega, finanças e risco quanto a viabilidade, entregabilidade e margem aceitável."
  BP-1060.30:
    name: "Cotação e Configuração"
    description: "Configurar a oferta precificada para o cliente usando configurador de produto, regras de preço e frameworks de desconto."
  BP-1060.30.10:
    name: "Configurar Pacote de Solução"
    description: "Usar o configurador de produto para compor o pacote precificado a partir de componentes do catálogo de ofertas."
  BP-1060.30.20:
    name: "Calcular Cotação"
    description: "Aplicar preço de tabela, desconto contratual e regras tributárias para produzir a cotação precificada."
  BP-1060.40:
    name: "Preço e Aprovações"
    description: "Aplicar governança de desconto e margem; rotear pelo workflow de aprovação de preço; capturar decisões dos aprovadores."
  BP-1060.40.10:
    name: "Verificar Compliance de Preço"
    description: "Validar a cotação contra regras de desconto, margem e acordos especiais de preço; sinalizar exceções."
  BP-1060.40.20:
    name: "Rotear Aprovações de Preço"
    description: "Rotear cotações de exceção pela hierarquia de aprovação de desconto; capturar decisões, condições e justificativa."
  BP-1060.50:
    name: "Desenvolvimento de Proposta"
    description: "Construir a proposta formal ou resposta a RFP; orquestrar inputs de solução, jurídico, segurança e entrega."
  BP-1060.50.10:
    name: "Redigir Conteúdo da Proposta"
    description: "Redigir a narrativa da proposta — sumário executivo, solução, entrega, condições comerciais, referências, termos."
  BP-1060.50.20:
    name: "Coordenar Inputs de SMEs"
    description: "Coordenar inputs de SMEs de solução, jurídico, segurança, finanças e entrega para a proposta."
  BP-1060.50.30:
    name: "Submeter Proposta"
    description: "Formatar, revisar e submeter a proposta pelo canal exigido pelo cliente (portal de RFP, e-mail, presencial)."
  BP-1060.60:
    name: "Negociação"
    description: "Negociar os termos comerciais e contratuais com o cliente; resolver posições abertas até a aceitação."
  BP-1060.60.10:
    name: "Conduzir Negociação Comercial"
    description: "Negociar preço, termos de pagamento, compromissos de volume e concessões comerciais."
  BP-1060.60.20:
    name: "Negociar Termos do Contrato"
    description: "Negociar termos jurídicos — SLAs, indenizações, IP, segurança, dados — com jurídico e advogados do cliente."
  BP-1060.60.30:
    name: "Resolver Pontos Abertos"
    description: "Acompanhar e fechar todos os pontos abertos — comerciais, técnicos, jurídicos — até que o cliente esteja pronto para assinar."
  BP-1060.70:
    name: "Contrato e Booking do Pedido"
    description: "Executar o contrato, fazer o booking do pedido e disparar provisionamento, atendimento e reconhecimento de receita downstream."
  BP-1060.70.10:
    name: "Executar Contrato"
    description: "Capturar assinaturas do cliente e dos signatários autorizados; persistir o contrato executado; vincular à conta e ao pedido."
  BP-1060.70.20:
    name: "Fazer Booking do Pedido de Venda"
    description: "Converter o contrato executado em um pedido de venda firme no OMS; validar completude contra os termos contratuais."
  BP-1060.70.30:
    name: "Confirmar Booking com Finanças"
    description: "Confirmar o booking junto a finanças para backlog, faturamento e setup de reconhecimento de receita; resolver eventuais holds."
  BP-1060.80:
    name: "Handover ao Atendimento"
    description: "Repassar o pedido fechado a equipes de atendimento, entrega ou serviço; fechar o ciclo com vendas para renovação."
  BP-1060.80.10:
    name: "Conduzir Handover de Vendas para Entrega"
    description: "Conduzir a reunião de handover; transferir contexto, critérios de sucesso e relacionamentos com o cliente de vendas para entrega."
  BP-1060.80.20:
    name: "Configurar Engajamento de Entrega"
    description: "Configurar o engajamento de entrega — projeto, time da conta, plano de sucesso — e confirmar prontidão para kick-off."
  BP-1060.80.30:
    name: "Encerrar Ciclo de Vendas"
    description: "Encerrar a oportunidade no CRM, capturar razões de win/loss e disparar workflows de comissionamento e rastreamento de renovação."
