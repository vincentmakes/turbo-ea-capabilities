kind: business-process
locale: pt
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "Contratação-a-Aposentadoria"
    description: "Ciclo de vida do colaborador ponta a ponta, do planejamento de força de trabalho ao sourcing, seleção, onboarding, performance e desenvolvimento, administração de remuneração e benefícios, experiência do colaborador, mobilidade interna e offboarding. Um BP2 por stage_name do VS-280."
  BP-1020.10:
    name: "Planejamento de Força de Trabalho"
    description: "Prever necessidades de força de trabalho contra a estratégia e a oferta atual, identificar lacunas de habilidades e planejar contratações, mobilidade e saídas necessárias para fechá-las."
  BP-1020.10.10:
    name: "Prever Demanda de Força de Trabalho"
    description: "Traduzir o plano de negócios em demanda de headcount, habilidades e capacidade por equipe, papel e horizonte temporal."
  BP-1020.10.20:
    name: "Avaliar Oferta de Força de Trabalho"
    description: "Inventariar colaboradores atuais, contratados e movimentações pendentes; avaliar habilidades contra a demanda para evidenciar lacunas e excedentes."
  BP-1020.10.30:
    name: "Construir Plano de Força de Trabalho"
    description: "Desenhar o plano integrado — contratar, desenvolver, redirecionar, desligar — para fechar a lacuna; sequenciar movimentações com orçamento e aprovações."
  BP-1020.20:
    name: "Sourcing e Atração"
    description: "Identificar e atrair candidatos por meio de marca empregadora, canais de sourcing e contato direto."
  BP-1020.20.10:
    name: "Desenvolver Marca Empregadora"
    description: "Posicionar a proposta de valor da marca empregadora e a mensagem usada nos canais para atrair os segmentos de talento-alvo."
  BP-1020.20.20:
    name: "Captar Candidatos"
    description: "Executar sourcing em job boards, mídias sociais, indicações, agências e contato direto; persistir candidatos no ATS."
  BP-1020.20.30:
    name: "Gerenciar Comunidades de Talento"
    description: "Manter relacionamentos com candidatos em pools de talentos e comunidades para vagas evergreen e de pipeline."
  BP-1020.30:
    name: "Seleção e Contratação"
    description: "Triar, avaliar, entrevistar e selecionar candidatos; conduzir verificações pré-emprego; fazer e aceitar a oferta."
  BP-1020.30.10:
    name: "Triar e Pré-Selecionar Candidatos"
    description: "Aplicar critérios de triagem às candidaturas recebidas; pré-selecionar para entrevista com base em fit e qualificações."
  BP-1020.30.20:
    name: "Conduzir Avaliações e Entrevistas"
    description: "Realizar entrevistas estruturadas e avaliações de habilidades; consolidar feedback dos avaliadores em uma decisão de contratação."
  BP-1020.30.30:
    name: "Realizar Verificações Pré-Emprego"
    description: "Conduzir verificações de antecedentes, referências e direito ao trabalho conforme requisitos da jurisdição e do risco do papel."
  BP-1020.30.40:
    name: "Fazer e Negociar Oferta"
    description: "Construir a oferta (remuneração, equity, data de início), negociar com o candidato e capturar o aceite."
  BP-1020.30.50:
    name: "Contratar Colaborador"
    description: "Executar o contrato de trabalho, configurar o registro do colaborador no HRIS e disparar workflows de onboarding downstream."
  BP-1020.40:
    name: "Onboarding"
    description: "Receber o novo colaborador na organização — boas-vindas, papelada, equipamentos, treinamento e integração."
  BP-1020.40.10:
    name: "Provisionar Equipamento e Acessos"
    description: "Disponibilizar laptop, acesso ao prédio, credenciais de sistemas e qualquer equipamento específico do papel antes do primeiro dia."
  BP-1020.40.20:
    name: "Concluir Papelada de Onboarding"
    description: "Capturar a papelada estatutária de novo colaborador — formulários fiscais, adesão a benefícios, reconhecimento de políticas — para compliance."
  BP-1020.40.30:
    name: "Entregar Programa de Onboarding"
    description: "Executar a jornada estruturada de onboarding — orientação, treinamento de papel, check-ins com gestor — ao longo dos primeiros 30/60/90 dias."
  BP-1020.40.40:
    name: "Confirmar Conclusão do Onboarding"
    description: "Validar que o novo colaborador completou todos os marcos requeridos do onboarding e está plenamente operante."
  BP-1020.50:
    name: "Performance e Desenvolvimento"
    description: "Definir metas, dar feedback, conduzir revisões formais, identificar necessidades de desenvolvimento e entregar aprendizado e coaching."
  BP-1020.50.10:
    name: "Definir Metas de Performance"
    description: "Cascatear objetivos de negócio em metas individuais no início do ciclo; alinhar com prioridades de equipe e função."
  BP-1020.50.20:
    name: "Fornecer Feedback Contínuo"
    description: "Conduzir conversas regulares de 1:1 e feedback contínuo entre gestores e colaboradores ao longo do ciclo."
  BP-1020.50.30:
    name: "Conduzir Revisão de Performance"
    description: "Executar a revisão formal do ciclo — autoavaliação, avaliação do gestor, calibração — para determinar ratings e desfechos."
  BP-1020.50.40:
    name: "Identificar Necessidades de Desenvolvimento"
    description: "Identificar lacunas de capacidade relativas ao papel atual e futuro; capturar em planos de desenvolvimento ligados a intervenções de aprendizado."
  BP-1020.50.50:
    name: "Entregar Aprendizado e Coaching"
    description: "Executar programas de aprendizado, coaching no trabalho, mentoria e desenvolvimento por designação; rastrear conclusão e impacto."
  BP-1020.60:
    name: "Administração de Remuneração e Benefícios"
    description: "Administrar remuneração base, variável, equity e benefícios ao longo do ciclo de vida; conduzir revisão salarial e handoff para folha de pagamento."
  BP-1020.60.10:
    name: "Administrar Remuneração Base e Variável"
    description: "Manter faixas salariais, taxas individuais e planos de remuneração variável; disparar atualizações de folha em promoções, transferências ou mudanças de taxa."
  BP-1020.60.20:
    name: "Conduzir Ciclo de Revisão Salarial"
    description: "Executar o processo anual ou off-cycle de revisão salarial; aplicar diretrizes orçamentárias, propostas de gestores e aprovações."
  BP-1020.60.30:
    name: "Administrar Adesão a Benefícios"
    description: "Conduzir adesão aberta e por evento qualificador para saúde, previdência e outros benefícios; conciliar com feeds das operadoras."
  BP-1020.60.40:
    name: "Gerenciar Programas de Equity"
    description: "Conceder, vincular e exercer equity conforme regras do plano; coordenar com finanças, jurídico e o broker de equity."
  BP-1020.70:
    name: "Experiência e Engajamento do Colaborador"
    description: "Executar o programa de engajamento, pesquisas de voz do colaborador, reconhecimento, bem-estar e a experiência do colaborador como um todo."
  BP-1020.70.10:
    name: "Executar Pesquisas de Engajamento"
    description: "Conduzir pesquisas periódicas e pulse de engajamento; analisar resultados por equipe, segmento e tendência."
  BP-1020.70.20:
    name: "Agir sobre Feedback do Colaborador"
    description: "Traduzir insights das pesquisas em planos de ação no nível de equipe e da empresa; rastrear o follow-through."
  BP-1020.70.30:
    name: "Operar Programas de Reconhecimento"
    description: "Executar programas de reconhecimento entre pares e por gestor; rastrear participação e impacto no engajamento."
  BP-1020.70.40:
    name: "Apoiar o Bem-Estar do Colaborador"
    description: "Operar programas de bem-estar — EAP, saúde mental, bem-estar financeiro, ergonomia — e responder a escalonamentos."
  BP-1020.80:
    name: "Mobilidade Interna e Carreira"
    description: "Operar marketplace interno de vagas, planejamento de sucessão e gestão de trilhas de carreira."
  BP-1020.80.10:
    name: "Operar Marketplace Interno de Vagas"
    description: "Publicar vagas internas, gerenciar candidaturas internas e conduzir entrevistas com candidatos internos."
  BP-1020.80.20:
    name: "Conduzir Planejamento de Sucessão"
    description: "Identificar sucessores para papéis críticos, avaliar prontidão e construir movimentações de desenvolvimento para fechar lacunas."
  BP-1020.80.30:
    name: "Gerenciar Trilhas de Carreira"
    description: "Manter frameworks de trilha de carreira, critérios de progressão de papel e orientação de mobilidade interna para gestores e colaboradores."
  BP-1020.90:
    name: "Offboarding e Alumni"
    description: "Gerenciar separações de colaboradores — voluntárias, involuntárias, aposentadoria — e operar o programa de alumni."
  BP-1020.90.10:
    name: "Processar Demissão ou Desligamento"
    description: "Capturar e processar a separação — pedido de demissão, dispensa, redundância, aposentadoria — pelo workflow de offboarding."
  BP-1020.90.20:
    name: "Conduzir Entrevista de Desligamento"
    description: "Realizar a entrevista de desligamento para capturar aprendizados e feedback; integrar nos insights de engajamento e retenção."
  BP-1020.90.30:
    name: "Recuperar Equipamento e Acessos"
    description: "Recuperar laptop, crachá, credenciais de sistemas e qualquer equipamento específico do papel no último dia útil."
  BP-1020.90.40:
    name: "Operar Rede de Alumni"
    description: "Manter a rede de alumni para recontratação, indicações e comunidade; executar engajamento periódico."
