kind: business-process
locale: pt
source: BP1-audit-to-action.yaml
entries:
  BP-1120:
    name: "Auditoria-a-Ação"
    description: "Ciclo de auditoria interna, do planejamento do universo de auditoria ao escopo do engagement, fieldwork, achados, acompanhamento de remediação e quality assurance da auditoria. Um BP2 por stage_name do VS-80."
    source_hash: sha256-78ba5fa747a3298e
  BP-1120.10:
    name: "Universo e Plano de Auditoria"
    description: "Manter o universo de auditoria e construir o plano anual de auditoria baseado em risco."
    source_hash: sha256-052dfbb5301861aa
  BP-1120.10.10:
    name: "Manter Universo de Auditoria"
    description: "Manter a população de entidades auditáveis — processos, sistemas, locais, terceiros."
    source_hash: sha256-c80bb421c22ca929
  BP-1120.10.20:
    name: "Construir Plano de Auditoria Baseado em Risco"
    description: "Construir o plano anual de auditoria a partir do universo, ponderado por risco; obter aprovação do comitê de auditoria."
    source_hash: sha256-641aa762dfc377f6
  BP-1120.20:
    name: "Escopo do Engagement"
    description: "Escopar o engagement de auditoria — objetivos, controles em escopo, período, recursos."
    source_hash: sha256-379378e4cbe00ff2
  BP-1120.20.10:
    name: "Definir Objetivos da Auditoria"
    description: "Definir objetivos da auditoria, perguntas-chave e riscos a endereçar no engagement."
    source_hash: sha256-9db77920df093c01
  BP-1120.20.20:
    name: "Planejar Procedimentos de Auditoria"
    description: "Planejar procedimentos de auditoria — walk-throughs, testes amostrais, analytics — e a evidência requerida."
    source_hash: sha256-20c9befca109dbaa
  BP-1120.30:
    name: "Fieldwork"
    description: "Executar fieldwork — coletar evidências, realizar testes e documentar workpapers."
    source_hash: sha256-5397ca54ccad52ae
  BP-1120.30.10:
    name: "Realizar Walk-Through do Processo"
    description: "Realizar walk-through do processo em escopo para entender desenho e controles-chave; documentar narrativa e fluxograma."
    source_hash: sha256-360facf431ae416c
  BP-1120.30.20:
    name: "Testar Controles e Transações"
    description: "Executar testes amostrais ou populacionais de eficácia de desenho e operação; documentar workpapers."
    source_hash: sha256-984e0a2fd05bc625
  BP-1120.30.30:
    name: "Executar Analytics de Auditoria"
    description: "Executar analytics de dados sobre toda a população para evidenciar anomalias, exceções e padrões."
    source_hash: sha256-02da298d8bc68b3b
  BP-1120.30.40:
    name: "Documentar Evidência de Auditoria"
    description: "Documentar evidências em workpapers com cross-references; obter confirmações do auditado quando necessário."
    source_hash: sha256-ff668222fb905e5c
  BP-1120.40:
    name: "Achados e Reporte"
    description: "Desenvolver achados, acordar respostas da gestão e emitir o relatório de auditoria."
    source_hash: sha256-882dae2ab975b4e0
  BP-1120.40.10:
    name: "Desenvolver Achados"
    description: "Desenvolver achados com condição, critério, causa, consequência e recomendação."
    source_hash: sha256-ec29da0b1405dcb1
  BP-1120.40.20:
    name: "Acordar Respostas da Gestão"
    description: "Acordar resposta da gestão — aceitar, ação alternativa, contestar — com auditados e data-alvo de remediação."
    source_hash: sha256-d7f6c42262644426
  BP-1120.40.30:
    name: "Emitir Relatório de Auditoria"
    description: "Emitir o relatório final de auditoria ao patrocinador executivo e comitê de auditoria; encerrar o engagement."
    source_hash: sha256-7cb1bfa395b5139f
  BP-1120.50:
    name: "Acompanhamento de Remediação"
    description: "Acompanhar a remediação dos achados pela gestão até o encerramento; verificar com re-teste quando aplicável."
    source_hash: sha256-7d1a7c3bb67fc4f2
  BP-1120.50.10:
    name: "Acompanhar Status de Remediação"
    description: "Acompanhar achados de auditoria abertos, datas-alvo e o progresso da gestão contra o plano de remediação."
    source_hash: sha256-9d2ac6245533df68
  BP-1120.50.20:
    name: "Verificar Encerramento"
    description: "Verificar o encerramento do achado por re-teste, revisão de evidência ou auditoria de follow-up; encerrar no tracker."
    source_hash: sha256-fe5f854372d81622
  BP-1120.60:
    name: "Quality Assurance da Auditoria"
    description: "Conduzir quality assurance sobre a função de auditoria — revisão de workpapers, peer review, avaliação externa."
    source_hash: sha256-bcb7a79e6deadaa3
  BP-1120.60.10:
    name: "Revisar Workpapers de Auditoria"
    description: "Conduzir revisão supervisória de workpapers e achados quanto à evidência suficiente e apropriada."
    source_hash: sha256-69e2e4705ce5c949
  BP-1120.60.20:
    name: "Conduzir Avaliação Externa de Qualidade"
    description: "Conduzir avaliação externa periódica da função de auditoria conforme as IIA Standards."
    source_hash: sha256-dcbe505dd1a3c5cf
