kind: business-process
locale: pt
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Descoberta-a-Automação"
    description: "Ciclo de melhoria de processo e automação desde a descoberta de processo passando por medição, mining, redesign e automação. Um BP2 por cada stage_name de VS-150."
  BP-1160.10:
    name: "Descoberta de processo"
    description: "Descobrir e documentar o processo as-is — atores, passos, dados, sistemas."
  BP-1160.10.10:
    name: "Mapear processo as-is"
    description: "Mapear o processo as-is via entrevistas, walk-throughs e observação; persistir em um modelo de processo."
  BP-1160.10.20:
    name: "Capturar variantes do processo"
    description: "Capturar variantes — por região, canal, tipo de cliente — para fazer aflorar onde a padronização importa."
  BP-1160.20:
    name: "Medição do processo"
    description: "Medir o desempenho do processo — tempo de ciclo, custo, qualidade, experiência do cliente."
  BP-1160.20.10:
    name: "Definir KPIs do processo"
    description: "Definir KPIs para o processo — eficiência, qualidade, outcome do cliente — e baselinear o desempenho atual."
  BP-1160.20.20:
    name: "Baselinear desempenho"
    description: "Baselinear o desempenho atual via sampling e analytics; identificar outliers e padrões."
  BP-1160.30:
    name: "Process mining"
    description: "Minerar event-logs de sistema para derivar o fluxo real do processo e fazer aflorar ineficiências."
  BP-1160.30.10:
    name: "Extrair event log"
    description: "Extrair dados de event-log de sistemas fonte para o processo em escopo; limpar e preparar."
  BP-1160.30.20:
    name: "Executar análise de process mining"
    description: "Aplicar ferramentas de process mining para derivar fluxo real, conformance, gargalos, loops de retrabalho e variantes."
  BP-1160.30.30:
    name: "Fazer aflorar hipóteses de melhoria"
    description: "Traduzir achados de mining em hipóteses de melhoria priorizadas por impacto e viabilidade."
  BP-1160.40:
    name: "Redesign do processo"
    description: "Redesenhar o processo — eliminar, simplificar, integrar, automatizar — para entregar melhoria step-change."
  BP-1160.40.10:
    name: "Desenhar processo to-be"
    description: "Desenhar o processo to-be aplicando princípios lean, alinhamento à jornada do cliente e automação."
  BP-1160.40.20:
    name: "Validar redesign"
    description: "Validar o redesign com operadores, clientes e risco; refinar antes do build."
  BP-1160.50:
    name: "Automação do processo"
    description: "Construir, fazer deploy e operar a automação do processo — RPA, orquestração, assistência IA — em escala."
  BP-1160.50.10:
    name: "Construir automação"
    description: "Construir a automação — bots RPA, fluxos orquestrados, componentes de IA agêntica — conforme o processo redesenhado."
  BP-1160.50.20:
    name: "Fazer deploy e operar a automação"
    description: "Fazer deploy da automação em produção; operar, monitorar e manter através de ciclos de change."
  BP-1160.50.30:
    name: "Rastrear benefícios da automação"
    description: "Rastrear os benefícios realizados da automação contra o business case; iterar e escalar."
