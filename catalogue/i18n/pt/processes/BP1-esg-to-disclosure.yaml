kind: business-process
locale: pt
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-a-Divulgação"
    description: "Ciclo de reporte de sustentabilidade da estratégia e materialidade ESG à coleta de dados, qualidade e asseguração de dados, reporte e divulgação, engajamento de stakeholders e metas de melhoria. Um BP2 por stage_name do VS-200."
    source_hash: sha256-66d60ef4b72a8d5f
  BP-1130.10:
    name: "Estratégia e Materialidade ESG"
    description: "Definir a ambição ESG e conduzir a avaliação de dupla materialidade para focar no que importa."
    source_hash: sha256-59d591c8d59454a6
  BP-1130.10.10:
    name: "Definir Ambição ESG"
    description: "Definir a ambição ESG e vinculá-la à estratégia da empresa; comprometer-se com metas net-zero, sociais e de governança."
    source_hash: sha256-5fa74157442208e6
  BP-1130.10.20:
    name: "Conduzir Avaliação de Dupla Materialidade"
    description: "Conduzir avaliação de dupla materialidade para identificar tópicos materiais — materialidade financeira e materialidade de impacto."
    source_hash: sha256-4c2d2749ad94da76
  BP-1130.20:
    name: "Coleta de Dados"
    description: "Coletar dados ESG — emissões, energia, água, resíduos, social, governança — em toda a cadeia de valor."
    source_hash: sha256-0c21f34aa6281b15
  BP-1130.20.10:
    name: "Coletar Dados Ambientais"
    description: "Coletar emissões (Escopos 1/2/3), energia, água, resíduos, biodiversidade e poluição das operações."
    source_hash: sha256-b7ce2922da1bda78
  BP-1130.20.20:
    name: "Coletar Dados Sociais"
    description: "Coletar dados de força de trabalho, saúde e segurança, diversidade, comunidade e direitos humanos por tópicos materiais."
    source_hash: sha256-4e7113198459286a
  BP-1130.20.30:
    name: "Coletar Dados de Governança"
    description: "Coletar dados de governança — composição do conselho, ética, anti-suborno, remuneração executiva, conduta de fornecedor."
    source_hash: sha256-e6cf111543dc7f20
  BP-1130.20.40:
    name: "Coletar Dados da Cadeia de Valor"
    description: "Coletar dados upstream e downstream da cadeia de valor — emissões de fornecedores, fase de uso do produto, fim de vida."
    source_hash: sha256-0af74fa019d57c4d
  BP-1130.30:
    name: "Qualidade e Asseguração de Dados"
    description: "Executar controles de qualidade de dados e obter asseguração externa sobre os dados divulgados."
    source_hash: sha256-f9693fa74569cc51
  BP-1130.30.10:
    name: "Executar Controles de Qualidade de Dados ESG"
    description: "Executar controles de completude, acurácia, consistência e rastreabilidade sobre os dados ESG."
    source_hash: sha256-7017be162f9deabf
  BP-1130.30.20:
    name: "Obter Asseguração Externa"
    description: "Engajar provedor de asseguração para asseguração limitada ou razoável sobre as métricas divulgadas conforme o padrão aplicável."
    source_hash: sha256-5f0c5838aacf550a
  BP-1130.40:
    name: "Reporte e Divulgação"
    description: "Produzir relatório ESG e divulgações regulatórias — CSRD/ESRS, SEC clima, GRI, SASB, TCFD, ISSB."
    source_hash: sha256-2d52a82565566693
  BP-1130.40.10:
    name: "Construir Pacote de Divulgação ESG"
    description: "Construir o pacote de divulgação ESG — narrativa, métricas, notas, mapeamentos para padrões."
    source_hash: sha256-83bb85f5f8360240
  BP-1130.40.20:
    name: "Apresentar Divulgações Regulatórias"
    description: "Apresentar divulgações ESG / sustentabilidade obrigatórias — CSRD/ESRS, SEC clima, taxonomias jurisdicionais."
    source_hash: sha256-7c0fab2067dbeb32
  BP-1130.40.30:
    name: "Publicar Frameworks Voluntários"
    description: "Publicar divulgações voluntárias — GRI, SASB, TCFD, CDP, ISSB — alinhadas a tópicos materiais."
    source_hash: sha256-bd460ef4e53b9bd9
  BP-1130.50:
    name: "Engajamento de Stakeholders"
    description: "Engajar stakeholders — investidores, reguladores, clientes, colaboradores, ONGs, comunidades — em ESG."
    source_hash: sha256-b4049d33409ffab1
  BP-1130.50.10:
    name: "Engajar Investidores e Analistas"
    description: "Engajar investidores ESG e agências de rating; responder a questionários e ratings."
    source_hash: sha256-8756d4ffe0961ddf
  BP-1130.50.20:
    name: "Engajar Comunidades e ONGs"
    description: "Engajar comunidades locais, ONGs e stakeholders da sociedade civil sobre impacto e remediação."
    source_hash: sha256-263f7bd55b5594a0
  BP-1130.60:
    name: "Metas de Melhoria"
    description: "Definir, acompanhar e ajustar metas de melhoria — emissões, social, governança — ao longo do horizonte."
    source_hash: sha256-06b57ef8ea29fa2b
  BP-1130.60.10:
    name: "Definir Metas de Melhoria"
    description: "Definir metas baseadas na ciência e outras metas ESG de melhoria alinhadas à ambição e a tópicos materiais."
    source_hash: sha256-539bdc8cfd82ce5e
  BP-1130.60.20:
    name: "Acompanhar Progresso das Metas"
    description: "Acompanhar progresso contra as metas ao longo do ciclo ESG; evidenciar lacunas e decidir ações corretivas."
    source_hash: sha256-2286ebfa082ad915
