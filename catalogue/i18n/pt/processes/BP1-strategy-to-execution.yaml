kind: business-process
locale: pt
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Estratégia-a-Execução"
    description: "Ciclo ponta a ponta de entrega de estratégia, da formulação à definição de portfólio, setup de programas e projetos, entrega e governança, adoção de mudança e realização de benefícios. Um BP2 por stage_name do VS-580."
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "Formulação da Estratégia"
    description: "Definir a estratégia da empresa — visão, metas, escolhas e o modelo operacional necessário para vencer."
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "Definir Direção Estratégica"
    description: "Definir visão, missão, metas estratégicas e os princípios que guiam as escolhas."
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "Tomar Escolhas Estratégicas"
    description: "Tomar escolhas de onde-jogar e como-vencer; resolver trade-offs entre mercados, segmentos, produtos e capacidades."
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "Definir Modelo Operacional"
    description: "Definir o modelo operacional — capacidades, organização, localizações e parceiros — necessário para executar a estratégia."
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "Definição de Portfólio"
    description: "Traduzir a estratégia no portfólio de programas e investimentos que entregarão os desfechos escolhidos."
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "Identificar Investimentos do Portfólio"
    description: "Identificar os investimentos candidatos que fecharão lacunas estratégicas; capturar valor, custo, risco e dependências."
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "Priorizar Portfólio"
    description: "Priorizar investimentos por valor, fit, capacidade e risco; construir o portfólio integrado entre horizontes."
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "Aprovar Portfólio"
    description: "Aprovar e financiar o portfólio pelo fórum executivo; disparar o setup de programas e projetos."
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "Setup de Programas e Projetos"
    description: "Configurar programas e projetos com charter, governança, plano, time e orçamento."
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "Constituir Programa"
    description: "Constituir o programa — desfechos, escopo, governança, sponsor, accountabilities, critérios de sucesso."
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "Planejar Entrega do Programa"
    description: "Construir o plano integrado de entrega entre projetos constituintes, com marcos, dependências e alocação de recursos."
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "Estabelecer Times de Projeto"
    description: "Formar times de projeto, confirmar papéis, fazer onboarding e disparar o trabalho de sprint ou phase-zero."
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "Entrega e Governança"
    description: "Entregar programas e projetos contra o plano; conduzir governança para evidenciar risco, decidir mudanças e assegurar qualidade."
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "Executar Trabalho de Projeto"
    description: "Executar o trabalho do projeto — design, build, testes, entrega — pelo método de entrega escolhido (ágil, waterfall, híbrido)."
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "Conduzir Governança de Programa"
    description: "Conduzir comitês diretivos, fóruns de decisão e quality gates sob a autoridade da governança corporativa; evidenciar e resolver riscos, issues e mudanças."
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "Gerenciar Riscos e Mudanças do Programa"
    description: "Manter o registro de riscos e o log de mudanças; mitigar, escalar e decidir mudanças via governança."
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "Adoção de Mudança"
    description: "Conduzir a adoção das mudanças entregues pelo programa pelos usuários finais — comunicar, treinar, suportar, sustentar."
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "Planejar Adoção da Mudança"
    description: "Construir o plano de adoção da mudança — mapa de stakeholders, comunicação, treinamento, suporte, sustentação."
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "Comunicar e Treinar"
    description: "Executar comunicações e treinamento para a população impactada conforme o plano de adoção."
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "Apoiar Adoção"
    description: "Prover suporte hyper-care, evidenciar bloqueadores de adoção e executar atividades de reforço."
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "Realização de Benefícios"
    description: "Acompanhar e colher os benefícios estratégicos que o programa se comprometeu a entregar; encerrar o programa."
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "Acompanhar Métricas de Benefício"
    description: "Acompanhar benefícios prometidos — receita, custo, NPS, throughput — contra baseline e meta."
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "Colher Benefícios"
    description: "Colher benefícios para o business-as-usual — embutir em orçamentos, KPIs, processos run-the-business."
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "Encerrar Programa"
    description: "Encerrar o programa — relatório final, lições aprendidas, arquivamento, liberação do time; disparar quaisquer movimentações de portfólio decorrentes."
    source_hash: sha256-25c19e1849fe48b3
