locale: pt
source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Gestão de Construção e Entrega em Obra
    description: |
      Execução em obra de trabalhos de infraestruturas, abrangendo o
      estabelecimento e mobilização do estaleiro, a gestão de frentes de trabalho
      e produção, obras temporárias, equipamentos e maquinaria, materiais e
      logística de obra, e qualidade de construção. A disciplina de entrega em
      campo que transforma projeto e programa em obra construída de forma segura,
      produtiva e conforme à especificação.
    in_scope:
      - Estabelecimento de estaleiro, mobilização e provisão de instalações temporárias
      - Coordenação de frentes de trabalho, sequenciamento de produção e acompanhamento do progresso
      - Obras temporárias incluindo andaimes, cofragens e suporte de escavações
      - Gestão de maquinaria, equipamentos e operações de elevação
      - Requisição, armazenagem, logística e gestão de resíduos de materiais de obra
      - Controlo de qualidade de construção, inspeção e gestão de não conformidades
    out_of_scope:
      - Gestão de construção de engenharia (BC-1150)
      - Comissionamento e entrega (BC-1160)
      - Engenharia de projeto (BC-1120)
      - Operação e manutenção de ativos permanentes (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: "Estabelecimento e Mobilização de Estaleiro"
    description: |
      Instalação e mobilização do estaleiro de construção, incluindo estaleiros de
      apoio, instalações temporárias e ligação de utilidades e serviços.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: "Instalação de Estaleiro e Estabelecimento do Estaleiro de Apoio"
    description: |
      Estabelecimento dos estaleiros de apoio, escritórios e áreas de bem-estar
      prontos para as operações de construção.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Planeamento da Mobilização
    description: |
      Planeamento da mobilização de recursos, mão de obra e equipamentos para o
      estaleiro de construção.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Provisão de Instalações Temporárias
    description: |
      Provisão de alojamento temporário, bem-estar e instalações de estaleiro para
      a mão de obra de construção.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: "Ligação de Utilidades e Serviços"
    description: |
      Ligação de energia, água e comunicações temporárias necessárias às
      operações de estaleiro.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: "Gestão de Frentes de Trabalho e Produção"
    description: |
      Planeamento, coordenação e acompanhamento da produção de construção nas
      frentes de trabalho ativas para sustentar progresso e produtividade.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: "Planeamento e Sequenciamento da Produção"
    description: |
      Planeamento de intervalo curto e sequenciamento da produção de construção
      nas frentes de trabalho.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Coordenação de Frentes de Trabalho
    description: |
      Coordenação de especialidades, recursos e acessos entre frentes de trabalho
      concorrentes.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Operações Diárias de Estaleiro
    description: |
      Direção e controlo diários das operações de construção em obra.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: "Acompanhamento de Progresso e Produtividade"
    description: |
      Medição do progresso de construção e da produtividade da mão de obra face
      ao programa.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Gestão de Obras Temporárias
    description: |
      Gestão das obras temporárias e sistemas de acesso que permitem a construção
      segura das obras permanentes.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Coordenação do Projeto de Obras Temporárias
    description: |
      Coordenação e controlo do projeto de obras temporárias e do seu regime de
      verificação.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: "Gestão de Andaimes e Acessos"
    description: |
      Provisão e controlo de andaimes e acessos seguros para as atividades de
      construção.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: "Gestão de Cofragens e Escoramentos"
    description: |
      Gestão dos sistemas de cofragem e escoramento que suportam as obras de betão
      e estruturais.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: "Gestão de Escavações e Contenções"
    description: |
      Gestão de escavações e suporte temporário de terreno para manter as obras
      estáveis e seguras.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: "Gestão de Maquinaria e Equipamentos"
    description: |
      Provisão, mobilização e conservação de maquinaria e equipamentos de
      construção, incluindo operações de elevação.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Gestão da Frota de Maquinaria
    description: |
      Gestão da frota de maquinaria de construção entre projetos e frentes de
      trabalho.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: "Aluguer e Utilização de Equipamentos"
    description: |
      Obtenção, aluguer e acompanhamento da utilização de equipamentos de
      construção.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Gestão de Operações de Elevação
    description: |
      Planeamento e controlo das operações de elevação e do uso de gruas em obra.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: "Inspeção e Manutenção de Maquinaria"
    description: |
      Inspeção e manutenção de maquinaria e equipamentos para sustentar
      disponibilidade e segurança.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: "Materiais e Logística de Obra"
    description: |
      Entrega, armazenagem e movimentação de materiais de construção em obra,
      incluindo logística e resíduos.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: "Requisição e Entrega de Materiais"
    description: |
      Requisição e entrega de materiais de construção para cumprir o programa de
      trabalhos.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: "Gestão de Áreas de Depósito e Armazenagem"
    description: |
      Gestão de áreas de depósito e armazenagem em obra de materiais e componentes.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: "Logística de Obra e Gestão de Tráfego"
    description: |
      Gestão da logística de obra, entregas e movimentos de veículos e tráfego.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Gestão de Resíduos de Construção
    description: |
      Segregação, manuseamento e eliminação de resíduos de construção e materiais
      excedentes.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Gestão da Qualidade de Construção
    description: |
      Asseguração e controlo da qualidade de construção para entregar obras
      conformes à especificação.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: "Planeamento de Inspeções e Ensaios"
    description: |
      Planeamento de inspeções e ensaios e dos seus pontos de retenção e
      testemunho.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: "Controlo e Asseguração da Qualidade"
    description: |
      Execução de verificações de controlo da qualidade e asseguração nas
      atividades de construção.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Gestão de Não Conformidades
    description: |
      Identificação, resolução e encerramento de não conformidades de construção.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: "Correção de Defeitos e Apoio à Entrega"
    description: |
      Correção de defeitos, encerramento de anomalias e apoio à entrega das obras
      concluídas.
    source_hash: sha256-c6fb7d5061da1fe6
metadata:
