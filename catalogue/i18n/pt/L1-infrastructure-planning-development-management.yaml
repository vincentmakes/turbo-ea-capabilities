locale: pt
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Gestão de Planeamento e Desenvolvimento de Infraestruturas
    description: |
      Planeamento de rede e sistema de longo prazo, viabilidade e
      desenvolvimento de opções, aquisição de terrenos e traçados, licenciamentos
      e avaliação ambiental, e envolvimento de partes interessadas para
      desenvolver esquemas de infraestruturas até ao ponto de entrega.
    in_scope:
      - Planeamento de rede, capacidade e espacial de longo prazo
      - Estudos de viabilidade e desenvolvimento de opções e conceitos
      - Aquisição de terrenos, traçados e corredores e servidões
      - Licenciamentos de planeamento e avaliação de impacto ambiental
      - Envolvimento de partes interessadas, comunidade e proprietários
      - Planeamento de sustentabilidade, carbono e adaptação climática
    out_of_scope:
      - Promoção imobiliária (BC-4900)
      - Execução de construção (BC-5040)
      - Licenças operacionais e aprovações regulatórias (BC-5110)
      - Projeto de engenharia de detalhe e produção BIM
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: "Planeamento de Rede e Sistema"
    description: |
      Planeamento de longo prazo de redes e sistemas de infraestruturas para
      satisfazer a procura prevista e as necessidades de capacidade.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Previsão de Procura
    description: |
      Previsão da procura e utilização de longo prazo para dimensionar as
      necessidades futuras de infraestruturas.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Planeamento de Capacidade de Rede
    description: |
      Planeamento da capacidade de rede e sistema para colmatar lacunas entre a
      procura e a oferta disponível.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: "Planeamento Espacial e de Corredores"
    description: |
      Planeamento espacial e de corredores para reservar terrenos e alinhar os
      esquemas com a política de uso do solo.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Planeamento-Mestre
    description: |
      Desenvolvimento de planos-mestres integrados que coordenam esquemas numa
      rede ou região.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: "Desenvolvimento de Viabilidade e Opções"
    description: |
      Avaliação de viabilidade e desenvolvimento de opções e conceitos para
      esquemas de infraestruturas candidatos.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Estudos de Viabilidade
    description: |
      Estudos que estabelecem a viabilidade técnica, económica e de entrega dos
      esquemas candidatos.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Desenvolvimento de Opções
    description: |
      Desenvolvimento e comparação de opções de esquema face aos objetivos e
      restrições.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Seleção de Conceito
    description: |
      Seleção do conceito preferido a levar para projeto e entrega.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Avaliação de Construtibilidade
    description: |
      Avaliação da construtibilidade e do risco de entrega para moldar conceitos
      de esquema viáveis.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: "Gestão de Terrenos e Traçados"
    description: |
      Seleção e aquisição de terrenos, traçados e direitos de acesso necessários
      para entregar os esquemas de infraestruturas.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: "Seleção de Traçado e Corredor"
    description: |
      Seleção de traçados e corredores que equilibram custo, impacto e
      capacidade de entrega.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: "Aquisição e Reunião de Terrenos"
    description: |
      Aquisição e reunião das parcelas de terreno necessárias para entregar um
      esquema.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: "Servidões e Direitos de Passagem"
    description: |
      Obtenção de direitos de passagem, servidões e direitos de acesso sobre
      terrenos de terceiros.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Gestão de Expropriação
    description: |
      Gestão da expropriação e da compensação associada para garantir os
      terrenos necessários.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: "Licenciamentos e Avaliação Ambiental"
    description: |
      Obtenção de licenciamentos de planeamento e realização de avaliações
      ambientais e patrimoniais para esquemas de infraestruturas.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Gestão de Licenciamento de Planeamento
    description: |
      Gestão de pedidos e licenciamentos de planeamento até à sua decisão.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Avaliação de Impacto Ambiental
    description: |
      Avaliação de impactos ambientais e mitigação em apoio às decisões de
      licenciamento.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: "Avaliação Ecológica e Patrimonial"
    description: |
      Avaliação de restrições ecológicas e patrimoniais que afetam a conceção e
      o licenciamento do esquema.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Ordens de Aprovação de Desenvolvimento
    description: |
      Preparação e gestão de ordens de aprovação de desenvolvimento para grandes
      esquemas de infraestruturas.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: "Envolvimento de Partes Interessadas e Comunidade"
    description: |
      Envolvimento com comunidades, partes interessadas e proprietários para
      construir apoio e gerir objeções aos esquemas.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Consulta à Comunidade
    description: |
      Consulta às comunidades afetadas para informar e moldar as propostas de
      esquema.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: "Mapeamento e Envolvimento de Partes Interessadas"
    description: |
      Mapeamento e envolvimento de partes interessadas ao longo do ciclo de vida
      do esquema.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Gestão de Inquéritos Públicos
    description: |
      Gestão de inquéritos e exames públicos às propostas de esquema.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: "Ligação a Proprietários e Vizinhos"
    description: |
      Ligação a proprietários e vizinhos para resolver preocupações e garantir
      cooperação.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: "Planeamento de Sustentabilidade e Clima"
    description: |
      Incorporação da sustentabilidade, do carbono e da resiliência climática no
      planeamento e conceção dos esquemas de infraestruturas.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Planeamento de Carbono ao Longo da Vida
    description: |
      Planeamento para reduzir o carbono ao longo de toda a vida na conceção e
      entrega do esquema.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: "Planeamento de Biodiversidade e Ganho Líquido"
    description: |
      Planeamento para proteger a biodiversidade e gerar ganho líquido mensurável.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Planeamento de Adaptação Climática
    description: |
      Planeamento da resiliência e adaptação climática dos ativos de
      infraestruturas.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Normas de Conceção Sustentável
    description: |
      Adoção de normas de conceção sustentável e de enquadramentos de
      classificação para os esquemas.
    source_hash: sha256-5942740434ce459c
