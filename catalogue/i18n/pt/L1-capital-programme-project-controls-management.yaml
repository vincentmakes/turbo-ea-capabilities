locale: pt
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Gestão de Programa de Capital e Controlos de Projeto
    description: |
      Governação e controlos do lado do dono e da entrega para programas e
      projetos de capital de infraestruturas, abrangendo a configuração do
      programa, o controlo de custo e prazo, o earned value, a gestão de risco e
      alterações, e a asseguração.
    in_scope:
      - Configuração, governação e gestão de stage-gates do programa
      - Estimativa, orçamentação, controlo e previsão de custos
      - Planeamento, agendamento e análise do caminho crítico
      - Earned value e gestão integrada do desempenho
      - Controlo de risco, alterações e contingências do programa
      - Asseguração de projeto, revisões de gateway e reporte
    out_of_scope:
      - Gestão empresarial de projetos e mudança (BC-900/BC-910)
      - Gestão de projetos de engenharia (BC-1110)
      - Avaliação de investimento e decisões de financiamento (BC-5000)
      - Execução em obra e entrega de trabalhos de construção
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: "Configuração e Governação do Programa"
    description: |
      Estabelecimento da estrutura, modelo de entrega e governação do programa
      para controlar o investimento de capital através de stage-gates definidos.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: "Definição e Configuração do Programa"
    description: |
      Definição e configuração do âmbito, estrutura e linha de base de controlos
      do programa.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Seleção do Modelo de Entrega
    description: |
      Seleção do modelo de entrega e organização mais adequado ao programa.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: "Enquadramento de Governação e Asseguração"
    description: |
      Estabelecimento do enquadramento de governação e asseguração que supervisiona
      o programa.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Gestão de Stage-Gates
    description: |
      Gestão dos stage-gates que autorizam a progressão e a libertação de
      financiamento.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: "Estimativa e Gestão de Custos"
    description: |
      Estimativa, definição de linha de base e controlo dos custos de programa e
      projeto ao longo do ciclo de vida da entrega.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Estimativa de Custos
    description: |
      Preparação de estimativas de custos nas várias classes de estimativa do
      ciclo de vida.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Gestão da Linha de Base do Orçamento
    description: |
      Estabelecimento e manutenção da linha de base de custo face à qual o
      desempenho é medido.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: "Controlo e Previsão de Custos"
    description: |
      Controlo e previsão dos custos até à conclusão face à linha de base
      aprovada.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Reporte de Custos
    description: |
      Reporte do estado e das previsões de custos às partes interessadas do
      programa e do projeto.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: "Planeamento e Agendamento"
    description: |
      Desenvolvimento e controlo dos cronogramas de programa e projeto para gerir
      o tempo e a certeza de entrega.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Desenvolvimento do Cronograma
    description: |
      Desenvolvimento de cronogramas integrados que cobrem as atividades de
      programa e projeto.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Análise do Caminho Crítico
    description: |
      Análise de caminhos críticos e folgas para proteger os marcos-chave de
      entrega.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Medição do Progresso
    description: |
      Medição do progresso físico e temporal face à linha de base do cronograma.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Análise de Risco do Cronograma
    description: |
      Análise probabilística do risco de cronograma para testar a confiança na
      entrega.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: "Earned Value e Gestão do Desempenho"
    description: |
      Medição e reporte integrados do desempenho de custo e prazo para prever os
      resultados do programa.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Gestão de Earned Value
    description: |
      Integração de âmbito, custo e prazo para medir o earned value e o
      desempenho.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: "Métricas de Desempenho e KPIs"
    description: |
      Definição e acompanhamento de métricas de desempenho e KPIs em todo o
      programa.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: "Análise de Tendências e Desvios"
    description: |
      Análise de tendências e desvios para antecipar afastamentos do plano.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Reporte Integrado do Desempenho
    description: |
      Reporte consolidado do estado integrado de custo, prazo e desempenho.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: "Controlo de Risco e Alterações do Programa"
    description: |
      Gestão do risco, alterações, contingências e interfaces do programa para
      proteger os resultados da entrega.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Gestão de Risco do Programa
    description: |
      Identificação, avaliação e tratamento de riscos em todo o programa.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Controlo de Alterações
    description: |
      Controlo das alterações de âmbito e de linha de base através de um processo
      de alterações disciplinado.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: "Gestão de Contingências e Reservas"
    description: |
      Gestão de contingências e reservas face à exposição de risco quantificada.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: "Gestão de Interfaces e Dependências"
    description: |
      Gestão de interfaces e dependências entre projetos e partes interessadas.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: "Asseguração e Reporte de Projeto"
    description: |
      Asseguração independente, aprendizagem e reporte para confirmar a saúde do
      programa e a realização de benefícios.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: "Asseguração de Projeto e Revisões de Gateway"
    description: |
      Asseguração independente e revisões de gateway da prontidão do programa e
      do projeto.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Gestão de Lições Aprendidas
    description: |
      Captura e aplicação de lições aprendidas ao longo do ciclo de vida do
      programa.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Reporte do Programa
    description: |
      Reporte do estado do programa a órgãos de administração, sponsors e órgãos
      de supervisão.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Acompanhamento da Realização de Benefícios
    description: |
      Acompanhamento da realização de benefícios face ao caso de negócio do
      programa.
    source_hash: sha256-de6ea1cd05c875b0
