locale: pt
source: L1-infrastructure-asset-management.yaml
entries:
  BC-5070:
    name: Gestão de Ativos de Infraestruturas
    description: |
      Gestão ao longo de toda a vida de ativos de infraestruturas segundo a ISO
      55000, abrangendo a estratégia e o planeamento de gestão de ativos, o
      registo de ativos e a base de informação, a avaliação de condição e
      desempenho, a estratégia de manutenção e renovações, o risco e a
      criticidade dos ativos, e o ciclo de vida e descarte.
    in_scope:
      - Estratégia, política e planeamento de gestão de ativos alinhados aos objetivos corporativos
      - Gestão do registo de ativos, hierarquia e qualidade da informação
      - Avaliação de condição, desempenho e vida remanescente dos ativos
      - Estratégia de manutenção e renovações e modelação de custo ao longo da vida
      - Risco, criticidade e priorização de intervenções nos ativos
      - Otimização de valor do ciclo de vida, descomissionamento e descarte
    out_of_scope:
      - Gestão de ativos físicos inter-indústria (BC-1040)
      - Manutenção de instalações (BC-1030)
      - Execução de manutenção (BC-5090)
      - Operações e controlo de rede em tempo real (BC-5080)
    source_hash: sha256-ff71cdfe8c3f3de2
  BC-5070.10:
    name: "Estratégia e Planeamento de Gestão de Ativos"
    description: |
      Definição da estratégia, objetivos e planos de gestão de ativos que alinham
      as decisões de ativos com os objetivos organizacionais.
    source_hash: sha256-cb48a4e3ad61ef68
  BC-5070.10.10:
    name: "Política de Gestão de Ativos e SAMP"
    description: |
      Estabelecimento da política de gestão de ativos e do plano estratégico de
      gestão de ativos (SAMP) que definem a direção para a base de ativos.
    source_hash: sha256-4efc0bc3b4065e29
  BC-5070.10.20:
    name: Objetivos de Gestão de Ativos
    description: |
      Definição de objetivos mensuráveis de gestão de ativos derivados dos
      objetivos organizacionais e das expectativas das partes interessadas.
    source_hash: sha256-d047fa7f6fb972a5
  BC-5070.10.30:
    name: Alinhamento de Linha de Visão
    description: |
      Alinhamento das decisões e atividades de ativos com a estratégia através de
      uma linha de visão clara dos objetivos à entrega.
    source_hash: sha256-6cfd9b4f6132b0eb
  BC-5070.10.40:
    name: Planeamento de Gestão de Ativos
    description: |
      Desenvolvimento de planos de gestão de ativos que traduzem a estratégia em
      atividades definidas e compromissos de recursos.
    source_hash: sha256-fd8ba34b64a99758
  BC-5070.20:
    name: "Registo e Informação de Ativos"
    description: |
      Manutenção de um registo de ativos de confiança e de uma base de informação
      que sustentam as decisões de gestão de ativos.
    source_hash: sha256-5490b84e55347d2a
  BC-5070.20.10:
    name: Gestão do Registo de Ativos
    description: |
      Manutenção de um registo completo e rigoroso dos ativos e dos seus atributos
      em todo o parque.
    source_hash: sha256-6d722217a5f0ac49
  BC-5070.20.20:
    name: "Hierarquia e Classificação de Ativos"
    description: |
      Estruturação dos ativos em hierarquias e classificações consistentes para
      apoiar análise e reporte.
    source_hash: sha256-9e987c11d892100d
  BC-5070.20.30:
    name: Qualidade dos Dados de Ativos
    description: |
      Asseguração da completude, rigor e atualidade dos dados de ativos em toda a
      base de informação.
    source_hash: sha256-f89ea51d1babb241
  BC-5070.20.40:
    name: Normas de Informação de Ativos
    description: |
      Definição das normas e requisitos de informação de ativos que regem a
      captura e o intercâmbio de dados.
    source_hash: sha256-aef275138b49f44b
  BC-5070.30:
    name: "Avaliação de Condição e Desempenho"
    description: |
      Avaliação da condição, desempenho e vida remanescente dos ativos para
      informar decisões de intervenção e investimento.
    source_hash: sha256-c07df052d056fc4d
  BC-5070.30.10:
    name: Monitorização de Condição
    description: |
      Monitorização da condição dos ativos para detetar deterioração e informar
      decisões de manutenção e renovação.
    source_hash: sha256-3199e2eb959c8862
  BC-5070.30.20:
    name: Regime de Inspeção de Ativos
    description: |
      Definição e operação do regime de inspeção que estabelece a condição dos
      ativos ao longo do tempo.
    source_hash: sha256-4d15d9676a325be7
  BC-5070.30.30:
    name: Análise de Desempenho
    description: |
      Análise do desempenho dos ativos face aos padrões esperados e aos requisitos
      de serviço.
    source_hash: sha256-09be7cb7fb9b41f6
  BC-5070.30.40:
    name: Avaliação de Vida Remanescente
    description: |
      Avaliação da vida útil remanescente para apoiar o momento de renovação e o
      planeamento de investimento.
    source_hash: sha256-61a54a779682dd8a
  BC-5070.40:
    name: "Estratégia de Manutenção e Renovações"
    description: |
      Desenvolvimento da estratégia de manutenção e renovações que otimiza as
      intervenções ao longo de toda a vida do ativo.
    source_hash: sha256-13b358ae5b73230a
  BC-5070.40.10:
    name: Desenvolvimento da Estratégia de Manutenção
    description: |
      Desenvolvimento de estratégias de manutenção que equilibram custo, risco e
      desempenho entre tipos de ativo.
    source_hash: sha256-13a334f6b0cc4bf6
  BC-5070.40.20:
    name: "Planeamento de Renovações e Substituições"
    description: |
      Planeamento de renovações e substituições para sustentar o serviço do ativo
      a longo prazo.
    source_hash: sha256-a42bf68efe800c10
  BC-5070.40.30:
    name: Otimização de Intervenções
    description: |
      Otimização do momento e do tipo de intervenção para maximizar o valor da
      manutenção e das renovações.
    source_hash: sha256-0bdf9c3f4fba162e
  BC-5070.40.40:
    name: Modelação de Custo ao Longo da Vida
    description: |
      Modelação dos custos ao longo de toda a vida para informar compromissos de
      manutenção, renovação e investimento.
    source_hash: sha256-1d8e18229d67f995
  BC-5070.50:
    name: "Risco e Criticidade de Ativos"
    description: |
      Avaliação do risco e da criticidade dos ativos para focar as intervenções
      nos ativos mais relevantes para o serviço e a segurança.
    source_hash: sha256-5648edaf25a3143a
  BC-5070.50.10:
    name: Avaliação de Criticidade de Ativos
    description: |
      Avaliação da criticidade dos ativos para a continuidade do serviço, a
      segurança e os objetivos organizacionais.
    source_hash: sha256-9df9330d24dddb32
  BC-5070.50.20:
    name: Análise de Modos de Falha
    description: |
      Análise dos modos de falha dos ativos e das suas consequências para informar
      decisões de risco e manutenção.
    source_hash: sha256-17bc85747541a823
  BC-5070.50.30:
    name: Priorização de Intervenções Baseada no Risco
    description: |
      Priorização das intervenções com base no risco e na criticidade dos ativos.
    source_hash: sha256-3688db42b4cc5c95
  BC-5070.50.40:
    name: Avaliação de Resiliência de Ativos
    description: |
      Avaliação da resiliência dos ativos a perigos e pressões que ameaçam a
      continuidade do serviço.
    source_hash: sha256-4924a98f4d041977
  BC-5070.60:
    name: "Ciclo de Vida e Descarte de Ativos"
    description: |
      Gestão dos ativos em fim de vida, descomissionamento e descarte para
      maximizar o valor e os resultados de sustentabilidade.
    source_hash: sha256-05b0594a435070dd
  BC-5070.60.10:
    name: Otimização de Valor do Ciclo de Vida
    description: |
      Otimização do valor gerado pelos ativos ao longo de todo o seu ciclo de vida.
    source_hash: sha256-778175117807d49e
  BC-5070.60.20:
    name: Planeamento de Descomissionamento
    description: |
      Planeamento do descomissionamento seguro e ordenado dos ativos em fim de
      vida.
    source_hash: sha256-a079a535759c0c43
  BC-5070.60.30:
    name: Gestão de Descarte de Ativos
    description: |
      Gestão do descarte, transferência e retirada de ativos em conformidade com a
      política e as obrigações.
    source_hash: sha256-5a236bad8ace26bd
  BC-5070.60.40:
    name: "Sustentabilidade e Circularidade"
    description: |
      Incorporação de resultados de sustentabilidade e de economia circular nas
      decisões de ciclo de vida e descarte de ativos.
    source_hash: sha256-a30b5016384602a1
