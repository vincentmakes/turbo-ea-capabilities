locale: pt
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Gestão de Saúde, Segurança e Ambiente de Infraestruturas
    description: |
      Gestão de saúde, segurança e ambiente na construção e operação de
      infraestruturas, abrangendo sistemas de gestão HSE, segurança na
      construção, saúde ocupacional, gestão ambiental, e resposta a incidentes e
      emergências. Protege pessoas, comunidades e o ambiente enquanto as obras e
      os ativos são entregues e operados.
    in_scope:
      - Política, sistemas de gestão, cultura e competência HSE
      - Segurança na construção ao abrigo do CDM, licenças e avaliação de risco
      - Vigilância de saúde ocupacional, bem-estar e wellbeing
      - Controlos ambientais, prevenção de poluição e conformidade com licenciamentos
      - Proteção da ecologia e do património durante as obras
      - Reporte, investigação de incidentes e resposta a emergências
    out_of_scope:
      - Ambiente, saúde e segurança inter-indústria (BC-720)
      - Resiliência operacional e segurança (BC-5120)
      - Gestão da qualidade de construção (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: Sistema de Gestão HSE
    description: |
      Política, normas, cultura e competência que compõem o sistema de gestão de
      saúde, segurança e ambiente.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: "Política e Normas HSE"
    description: |
      Definição da política, normas e objetivos HSE nas atividades de
      infraestruturas.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: Sistema de Gestão HSE
    description: |
      Operação e melhoria contínua do sistema de gestão HSE certificado.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: "Cultura e Comportamento de Segurança"
    description: |
      Desenvolvimento de uma cultura de segurança positiva e de comportamentos
      seguros na mão de obra.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: "Competência e Formação HSE"
    description: |
      Asseguração da competência, formação e autorização HSE do pessoal.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Gestão de Segurança na Construção
    description: |
      Gestão do risco de segurança na construção através de projeto, controlos de
      obra, licenças e sistemas seguros de trabalho.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: "CDM e Gestão do Risco de Projeto"
    description: |
      Gestão dos deveres CDM e da redução de risco em fase de projeto.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Gestão da Segurança em Obra
    description: |
      Gestão diária dos controlos de segurança e supervisão no estaleiro de
      construção.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Gestão de Licenças de Trabalho
    description: |
      Controlo de atividades de alto risco através de sistemas de licenças de
      trabalho.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: "Método de Trabalho e Avaliação de Risco"
    description: |
      Preparação e controlo de métodos de trabalho e avaliações de risco de tarefa
      para execução segura.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Gestão da Saúde Ocupacional
    description: |
      Proteção da saúde da mão de obra através de vigilância, bem-estar, higiene e
      gestão do wellbeing.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Vigilância de Saúde Ocupacional
    description: |
      Monitorização da saúde e aptidão da mão de obra face às exposições
      ocupacionais.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Provisão de Bem-Estar
    description: |
      Provisão de instalações e dispositivos de bem-estar para a mão de obra em
      obra.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: "Monitorização de Exposição e Higiene"
    description: |
      Monitorização e controlo das exposições ocupacionais e da higiene no local
      de trabalho.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: "Gestão de Fadiga e Wellbeing"
    description: |
      Gestão da fadiga, saúde mental e wellbeing da mão de obra.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Gestão Ambiental
    description: |
      Gestão dos impactos, controlos e licenciamentos ambientais na construção e
      operações.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Controlos Ambientais
    description: |
      Implementação de controlos que limitam o impacto ambiental das obras e
      operações.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Prevenção da Poluição
    description: |
      Prevenção e controlo da poluição do ar, da água e do solo durante as obras.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Conformidade com Licenciamentos Ambientais
    description: |
      Conformidade com os licenciamentos, licenças e condições ambientais.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: "Proteção da Ecologia e do Património"
    description: |
      Proteção da ecologia, biodiversidade e ativos patrimoniais afetados pelas
      obras.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: "Gestão de Incidentes e Emergências"
    description: |
      Reporte, investigação e resposta de emergência a incidentes HSE, com
      monitorização de desempenho.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: "Reporte e Investigação de Incidentes"
    description: |
      Reporte e investigação de incidentes HSE e quase-acidentes.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Análise de Causa-Raiz
    description: |
      Análise das causas subjacentes para prevenir a recorrência de incidentes.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Planeamento de Resposta a Emergências
    description: |
      Planeamento e prontidão para resposta a emergências em obras e ativos.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: Monitorização do Desempenho HSE
    description: |
      Monitorização e reporte do desempenho HSE e dos indicadores avançados.
    source_hash: sha256-fbf0f34769e795c3
metadata:
