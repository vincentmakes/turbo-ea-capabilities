locale: pt
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Gestão Regulatória e de Conformidade de Infraestruturas
    description: |
      Gestão da regulação económica e de segurança das infraestruturas,
      abrangendo o relacionamento com reguladores e as submissões de controlo de
      preços, a gestão de licenças e obrigações, os safety cases e a asseguração,
      o reporte regulatório, e as licenças e aprovações estatutárias.
    in_scope:
      - Envolvimento com reguladores e submissões de controlo de preços
      - Gestão de licenças de operação e obrigações estatutárias
      - Desenvolvimento de safety cases e asseguração de segurança
      - Desempenho regulatório e reporte estatutário
      - Gestão de licenças operacionais, ambientais e estatutárias
      - Apoio a auditoria e divulgação regulatória
    out_of_scope:
      - Gestão de conformidade inter-indústria (BC-130)
      - Gestão de risco empresarial (BC-140)
      - Gestão comercial de concessões (BC-5100)
      - Gestão jurídica corporativa e de litígios
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Gestão do Relacionamento Regulatório
    description: |
      Envolvimento com reguladores económicos e gestão das submissões e
      determinações de controlo de preços.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Envolvimento com Reguladores
    description: |
      Envolvimento contínuo e gestão do relacionamento com reguladores económicos
      e setoriais.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: "Controlo de Preços e Determinação"
    description: |
      Gestão dos processos regulatórios de controlo de preços e das determinações
      periódicas.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Gestão de Submissões Regulatórias
    description: |
      Preparação e gestão de submissões formais aos reguladores.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Monitorização de Alterações Regulatórias
    description: |
      Monitorização e interpretação das alterações regulatórias que afetam o
      negócio.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: "Gestão de Licenças e Obrigações"
    description: |
      Gestão das licenças de operação e das obrigações e condições estatutárias a
      elas associadas.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Gestão de Licenças de Operação
    description: |
      Gestão das licenças de operação detidas pelo operador de infraestruturas.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Acompanhamento de Obrigações Estatutárias
    description: |
      Acompanhamento das obrigações estatutárias e do seu cumprimento em todo o
      negócio.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Conformidade com Condições de Licença
    description: |
      Asseguração da conformidade com as condições associadas às licenças de
      operação.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: "Gestão de Deveres e Compromissos"
    description: |
      Gestão dos deveres e compromissos estatutários assumidos perante reguladores
      e autoridades.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: "Safety Case e Asseguração"
    description: |
      Desenvolvimento de safety cases e da asseguração e certificação que
      demonstram a operação segura.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Desenvolvimento de Safety Case
    description: |
      Desenvolvimento e manutenção de safety cases para ativos e operações de
      infraestruturas.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: "Certificação e Autorização de Segurança"
    description: |
      Obtenção da certificação e autorização de segurança necessárias para operar.
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: Asseguração Regulatória de Segurança
    description: |
      Asseguração aos reguladores de segurança de que as obrigações de segurança
      são cumpridas.
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: Avaliação Independente de Segurança
    description: |
      Avaliação e validação independentes dos safety cases e dos dispositivos de
      segurança.
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: "Reporte e Divulgação Regulatória"
    description: |
      Reporte de informação de desempenho, financeira e estatutária a reguladores
      e partes interessadas.
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: Reporte de Desempenho Regulatório
    description: |
      Reporte do desempenho operacional e de serviço aos reguladores.
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: Reporte Financeiro Regulatório
    description: |
      Reporte de informação financeira e de custos regulatória às autoridades.
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: Divulgação Estatutária
    description: |
      Divulgação da informação estatutária exigida por lei e regulamento.
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: Apoio a Auditoria Regulatória
    description: |
      Apoio a auditorias, revisões e investigações regulatórias.
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: "Licenças e Aprovações Estatutárias"
    description: |
      Gestão das licenças operacionais, ambientais e estatutárias e das aprovações
      necessárias para operar.
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: Gestão de Licenças Operacionais
    description: |
      Gestão das licenças operacionais exigidas para as atividades de
      infraestruturas.
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: Gestão de Aprovações Estatutárias
    description: |
      Gestão das aprovações e consentimentos estatutários das autoridades.
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: Conformidade com Licenças Ambientais
    description: |
      Conformidade com as licenças ambientais e as suas condições.
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: "Renovação e Alteração de Licenças"
    description: |
      Renovação e alteração de licenças e aprovações à medida que as operações
      mudam.
    source_hash: sha256-07c3c25fd50f1ebe
metadata:
  translator: claude-ai
