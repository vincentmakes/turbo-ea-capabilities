locale: zh
source: L1-legislative-regulatory-drafting-management.yaml
entries:
  BC-3210:
    name: 立法与法规起草管理
    description: |
      开展主要立法、附属法规、法定文书和行政命令的起草、法律审查、影响评估、议会或立法机关程序协调及法典化工作。
    source_hash: sha256-bed24c3de380b067
  BC-3210.10:
    name: 立法起草
    description: |
      由议会法律顾问或立法起草员对主要立法、法案及修正案进行起草。
    in_scope:
      - 法案和修正案起草
      - 起草指令处理
      - 简明语言和双语起草
    out_of_scope:
      - 法规和法定文书（由法规起草覆盖）
    source_hash: sha256-d6de9de06f52f4b5
  BC-3210.10.10:
    name: 起草指令接收
    description: |
      接收并厘清政策和部长发起人的起草指令。
    source_hash: sha256-b1e88335929f4301
  BC-3210.10.20:
    name: 法案和修正案起草
    description: |
      起草法案、修正案和附带条款。
    source_hash: sha256-d3237abe4615aef6
  BC-3210.10.30:
    name: 起草质量审查
    description: |
      由资深法律顾问对立法草案进行清晰度、一致性和效力审查。
    source_hash: sha256-36f0cf52e3cb0068
  BC-3210.20:
    name: 法规起草
    description: |
      起草附属法规、法定文书、行政命令和行政规则。
    source_hash: sha256-5a89867df97991ac
  BC-3210.20.10:
    name: 法规和法定文书起草
    description: |
      依据授权立法起草法规和法定文书。
    source_hash: sha256-742a28444691aec5
  BC-3210.20.20:
    name: 行政命令起草
    description: |
      起草行政命令、法令和公告。
    source_hash: sha256-b088011dcf93c4ba
  BC-3210.20.30:
    name: 行政规则起草
    description: |
      起草机构行政规则和通知。
    source_hash: sha256-595e0e3c19116580
  BC-3210.30:
    name: 法律审查与合宪性审查
    description: |
      对草案文件进行合宪性、人权及国际法符合性法律审查。
    source_hash: sha256-f709b926402ee075
  BC-3210.30.10:
    name: 合宪性审查
    description: |
      依据宪法权力、权利和限制审查草案。
    source_hash: sha256-d843614d0d567a81
  BC-3210.30.20:
    name: 人权相容性评估
    description: |
      评估草案与人权条约和宪章的相容性。
    source_hash: sha256-a15f0be75834184d
  BC-3210.30.30:
    name: 国际法符合性审查
    description: |
      审查草案是否符合条约和超国家义务。
    source_hash: sha256-d4cc9bcce669d916
  BC-3210.40:
    name: 监管影响评估
    description: |
      依据经合组织更好监管原则，评估拟议文件的预期成本、效益和分配效应。
    source_hash: sha256-02ca94d4ce91af03
  BC-3210.40.10:
    name: 影响范围界定
    description: |
      界定监管影响评估范围并确定相称性。
    source_hash: sha256-8d3ffa814edc1f11
  BC-3210.40.20:
    name: 成本效益分析
    description: |
      量化监管成本和效益，包括合规负担。
    source_hash: sha256-56806d6d9492219e
  BC-3210.40.30:
    name: 中小企业测试
    description: |
      评估对小企业和中小企业的不相称影响。
    source_hash: sha256-82238113f86ccfae
  BC-3210.40.40:
    name: 影响评估发布
    description: |
      与文件及配套证据一并发布影响评估报告。
    source_hash: sha256-cc69c04abad2c0e2
  BC-3210.50:
    name: 立法程序协调
    description: |
      协调法案通过议会或立法机关的程序，包括委员会证词、修正案及御准或颁布。
    source_hash: sha256-a5c96243a384a5ba
  BC-3210.50.10:
    name: 议会联络
    description: |
      就政府法案与议会或立法机关进行联络。
    source_hash: sha256-f24971e019545796
  BC-3210.50.20:
    name: 委员会证词准备
    description: |
      为立法委员会准备证词、情况汇报和证人。
    source_hash: sha256-0b6d0f462027d53f
  BC-3210.50.30:
    name: 修正案跟踪
    description: |
      跟踪和评估立法修正案在各审议阶段的进展。
    source_hash: sha256-8f9176162ffb323c
  BC-3210.50.40:
    name: 颁布与御准协调
    description: |
      协调最终颁布、御准或行政首长签署工作。
    source_hash: sha256-56e60d9612111b28
  BC-3210.60:
    name: 法律法规汇编与发布
    description: |
      对法规和规章文本进行汇编、整合、官方公报发布和持续维护。
    source_hash: sha256-d59d3e40ac14a03d
  BC-3210.60.10:
    name: 官方公报发布
    description: |
      在官方公报或期刊上发布已颁布的文件。
    source_hash: sha256-d4dce25cd484ebfb
  BC-3210.60.20:
    name: 整合与法典化
    description: |
      对修正案进行整合并编入法典。
    source_hash: sha256-e60f7b9c6115d8aa
  BC-3210.60.30:
    name: 法律文本维护
    description: |
      持续维护并以机器可读形式发布法规和规章文本。
    source_hash: sha256-131620fccfae9a4a
