    description: |
      满足合同质量规格的混拼决策。
    source_hash: sha256-ee1bced5b8209e7e
  BC-3570.40.30:
    name: 在途头寸跟踪
    description: |
      跟踪船舶、铁路和卡车在途头寸。
    source_hash: sha256-ac7c5faf5748c3c1
  BC-3570.50:
    name: 大宗商品交易运营
    description: |
      实物大宗商品账簿上的现货和基差交易、即期销售执行及跨商品价差管理。
    source_hash: sha256-0dfd2dba91324578
  BC-3570.50.10:
