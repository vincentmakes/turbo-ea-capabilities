    description: |
      含等级折扣和溢价应用的最终定价。
    source_hash: sha256-e9c89985fb46c8b8
  BC-3570.70.20:
    name: 结算单签发
    description: |
      向种植者和交易对手签发结算单。
    source_hash: sha256-5fac0c5476566666
  BC-3570.70.30:
    name: 质量索赔解决
    description: |
      与种植者、买方及仲裁机构解决质量索赔。
    source_hash: sha256-bf1ee5aa4949d900
