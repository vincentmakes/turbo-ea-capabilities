    description: |
      实物大宗商品的现货和基差头寸交易。
    source_hash: sha256-4cea62e2c931b131
  BC-3570.50.20:
    name: 即期销售执行
    description: |
      向加工商和出口商执行即期销售。
    source_hash: sha256-02a09a90129816d9
  BC-3570.50.30:
    name: 跨商品价差管理
    description: |
      管理大豆压榨和裂解等跨商品价差。
    source_hash: sha256-74c23a645fadb9d6
  BC-3570.60:
    name: 套期保值与风险头寸管理
    description: |
      针对实物大宗商品头寸执行和对账期货与期权套期保值。
    source_hash: sha256-439e60a15df9801c
  BC-3570.60.10:
    name: 期货套期保值执行
    description: |
      在监管交易所执行期货套期保值。
    source_hash: sha256-bee15d9ce9d4ec65
  BC-3570.60.20:
    name: 期权套期保值执行
    description: |
      执行期权套期保值以管理价格尾部风险。
    source_hash: sha256-14971ec60b16e821
  BC-3570.60.30:
    name: 套保头寸对账
    description: |
      将套保头寸与底层实物敞口进行对账。
    source_hash: sha256-95f8cea605337782
  BC-3570.70:
    name: 大宗商品结算与定价
    description: |
      最终定价、向交易对手签发结算单及质量索赔解决。
    source_hash: sha256-9658ca156a684199
