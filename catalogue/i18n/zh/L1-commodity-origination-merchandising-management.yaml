entries:
  BC-3570:
    name: 大宗商品采购与经营管理
    description: |
      种植者采购计划、大宗商品合同、地磅与取样、实物库存头寸、现货与基差交易、套期保值，以及谷物、油料、软商品、牲畜和乳制品大宗商品的结算。
    source_hash: sha256-742072528dec68c1
  BC-3570.10:
    name: 采购计划管理
    description: |
      种植者合同签订、生产商关系管理及为供应账簿提供支撑的采购预测。
    source_hash: sha256-747aeacec2fb37d0
  BC-3570.10.10:
    name: 种植者合同计划
    description: |
      按区域设计和执行种植者合同计划。
    source_hash: sha256-0d8f801072d1e2b4
  BC-3570.10.20:
    name: 生产商关系管理
    description: |
      区别于通用CRM的生产商关系管理。
    source_hash: sha256-d0d03540e73ea53d
  BC-3570.10.30:
    name: 采购预测
    description: |
      按区域和作物预测预期采购量。
    source_hash: sha256-7936f53c819b382a
  BC-3570.20:
    name: 大宗商品合同管理
    description: |
      远期、生产和延迟定价大宗商品合同的签发与执行跟踪。
    in_scope:
      - 与种植者和交易对手的远期合同
      - 带质量规格的生产合同
      - 合同执行跟踪
    out_of_scope:
      - 通用法律合同管理（BC-150）
    source_hash: sha256-1f4fc8a5b13a74cc
  BC-3570.20.10:
    name: 远期合同签发
    description: |
      签发固定价格和基差远期合同。
    source_hash: sha256-cddaa1004c6597b4
  BC-3570.20.20:
    name: 生产合同管理
    description: |
      管理带质量和交货规格的生产合同。
    source_hash: sha256-51df6525deb9e05f
  BC-3570.20.30:
    name: 合同执行跟踪
    description: |
      跟踪已交货吨数对应合同的执行情况。
    source_hash: sha256-8de3c3f82f2bfecb
  BC-3570.30:
    name: 到货地磅与取样
    description: |
      收货时的地磅作业、质量取样与分级，以及收货结算计算。
    source_hash: sha256-6cfafb95322b4cbb
  BC-3570.30.10:
    name: 地磅作业
    description: |
      到货和出货地磅作业与称重单据。
    source_hash: sha256-9d9a4972804143f0
  BC-3570.30.20:
    name: 质量取样与分级
    description: |
      依据贸易规格开展收货取样和分级。
    source_hash: sha256-318067a4b25f2ef9
  BC-3570.30.30:
    name: 收货结算计算
    description: |
      收货时计算等级折扣和溢价。
    source_hash: sha256-f911ec823985615a
  BC-3570.40:
    name: 大宗商品库存头寸管理
    description: |
      跟踪实物大宗商品头寸、混拼决策及全网在途头寸。
    source_hash: sha256-da50eea3d8715356
  BC-3570.40.10:
    name: 实物头寸跟踪
    description: |
      按场地和等级跟踪多头和空头实物头寸。
    source_hash: sha256-d44e9797ecef281f
  BC-3570.40.20:
