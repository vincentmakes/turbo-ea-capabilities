locale: zh
source: L1-electricity-distribution-operations-management.yaml
entries:
  BC-3820:
    name: 配电运营管理
    description: |
      运营中低压配电网，涵盖控制中心调度、故障响应与恢复、倒闸操作、一次和二次变电站运营，以及向终端客户供电的现场班组协调。
    source_hash: sha256-bb8d32dfffb323fe
  BC-3820.10:
    name: 配电控制运营
    description: |
      利用配电管理系统/停电管理系统/ADMS、态势感知和潮流分析，对配电网进行全天候控制中心运营。
    source_hash: sha256-6806e02bd5509657
  BC-3820.10.10:
    name: ADMS运营
    description: |
      运营高级配电管理系统 (ADMS) 进行监控。
    source_hash: sha256-677ff44b0f143557
  BC-3820.10.20:
    name: 配电SCADA运营
    description: |
      对配电馈线和开关进行实时SCADA采集和控制。
    source_hash: sha256-5c633657e0372d0f
  BC-3820.10.30:
    name: 网络拓扑管理
    description: |
      在控制系统中维护运行中的网络拓扑结构。
    source_hash: sha256-3ab9633b55056fe6
  BC-3820.20:
    name: 倒闸与恢复运营
    description: |
      在计划性和非计划停电后进行网络重构和供电恢复，包括基于FLISR的自愈操作。
    source_hash: sha256-28e56a550795332c
  BC-3820.20.10:
    name: 倒闸方案执行
    description: |
      经授权执行配电倒闸方案。
    source_hash: sha256-6b62cf147e88fa82
  BC-3820.20.20:
    name: 故障定位、隔离与供电恢复
    description: |
      基于FLISR对故障馈线实施检测、隔离和供电恢复。
    source_hash: sha256-eeb0ac66c07fb9f6
  BC-3820.20.30:
    name: 反馈电与孤岛协调
    description: |
      协调馈线反馈电和有意孤岛运行以实现恢复供电。
    source_hash: sha256-f500b07a6cb34f3b
  BC-3820.30:
    name: 故障响应运营
    description: |
      从检测到现场修复和客户通知，对配电网故障进行端到端响应。
    in_scope:
      - 故障检测与巡线
      - 向故障抢修工单分配班组
      - 向客户发送停电通知
    out_of_scope:
      - 分布式能源相关停电处置（BC-3840）
      - 批发发电停电（BC-3800.10）
    source_hash: sha256-e0a8805040b9738c
  BC-3820.30.10:
    name: 故障分类
    description: |
      对来自现场、客户和遥测的故障报告进行分类处理。
    source_hash: sha256-f5b6de747170daa0
  BC-3820.30.20:
    name: 现场故障巡线
    description: |
      对架空线路和地下资产开展现场巡线以定位并确认故障。
    source_hash: sha256-629aded5b3fe87f4
  BC-3820.30.30:
    name: 停电恢复追踪
    description: |
      追踪停电恢复进度和客户停电分钟数统计。
    source_hash: sha256-c50cda5eaed6d4c9
  BC-3820.30.40:
    name: 重大事件响应
    description: |
      应对风暴及重大事件的配电响应，包括互助班组协调。
    source_hash: sha256-a7a2a177c4dc5928
  BC-3820.40:
    name: 现场班组调度运营
    description: |
      调度、路由和支持配电现场班组处理故障、计划工作及客户工单。
    source_hash: sha256-e3b825d3d196d891
  BC-3820.40.10:
    name: 班组排班
    description: |
      编制班组日常排班和应急轮值安排。
    source_hash: sha256-74e8b038bce34a83
  BC-3820.40.20:
    name: 工单派发与路由
    description: |
      通过工作管理系统向现场班组派发并路由工单。
    source_hash: sha256-87f2e21966a77250
  BC-3820.40.30:
    name: 现场工单收尾
    description: |
      在工单收尾时采集竣工变更记录、材料消耗及工时信息。
    source_hash: sha256-d7b216a660cf4899
  BC-3820.50:
    name: 配电资产巡检运营
    description: |
      对架空线路、电杆、地下电缆及配电变电站进行例行和状态驱动巡检。
    source_hash: sha256-bc313924e30e2687
  BC-3820.50.10:
    name: 电杆与架空线路巡检
    description: |
      对电杆和架空线路进行周期性巡检，包括红外热像调查。
    source_hash: sha256-9158b458ddd1fb51
  BC-3820.50.20:
    name: 地下网络巡检
    description: |
      对地下馈线、连接箱和电缆接头进行巡检和状态评估。
    source_hash: sha256-6da739fa18de20ed
  BC-3820.50.30:
    name: 配电变电站巡检
    description: |
      对主变电站、二次变电站和客户变电站进行例行巡检。
    source_hash: sha256-7cbb4dd9acebf1fd
  BC-3820.60:
    name: 植被与线路走廊管理
    description: |
      对配电线路进行植被清除和线路走廊维护，管理停电风险和法定间距。
    source_hash: sha256-dda63e21d1a8b4ab
  BC-3820.60.10:
    name: 植被周期规划
    description: |
      对配电线路植被工作进行周期性和基于风险的排程规划。
    source_hash: sha256-740dfb950218263d
  BC-3820.60.20:
    name: 植被现场运营
    description: |
      现场执行修剪、砍伐和除草剂喷洒作业。
    source_hash: sha256-802e4844134e2a59
  BC-3820.60.30:
    name: 山火风险缓解运营
    description: |
      在山火风险区域实施PSPS（预防性断电）、快速跳闸和线路加固运营。
    source_hash: sha256-e29b0547329740e7
  BC-3820.70:
    name: 新接入运营
    description: |
      为家庭、商业及工业客户和开发商提供新建和变更电力接入服务。
    source_hash: sha256-7504663ab3ebf4e1
  BC-3820.70.10:
    name: 接入申请评估
    description: |
      对新接入申请进行技术评估，核查容量可用性。
    source_hash: sha256-f661e8eb7add3d2d
  BC-3820.70.20:
    name: 接入设计
    description: |
      完成详细接入设计、接入点选定及增强需求确定。
    source_hash: sha256-f430158d1b6b0994
  BC-3820.70.30:
    name: 接入调试
    description: |
      对新接入工程进行调试和送电验收。
    source_hash: sha256-f04a07253903b26a
  BC-3820.80:
    name: 电能质量管理
    description: |
      监测和整改配电电压水平、闪变、谐波及客户电能质量投诉。
    source_hash: sha256-c06d696b36abdc97
  BC-3820.80.10:
    name: 电压监测
    description: |
      监测馈线电压分布，确保符合法定限值。
    source_hash: sha256-22a4b5ce8bc14de0
  BC-3820.80.20:
    name: 谐波与闪变监测
    description: |
      对网络谐波畸变和电压闪变进行监测。
    source_hash: sha256-58da4094009c5ae7
  BC-3820.80.30:
    name: 客户电能质量调查
    description: |
      调查和整改客户报告的电能质量问题。
    source_hash: sha256-f0dda2a8a08d05c2
