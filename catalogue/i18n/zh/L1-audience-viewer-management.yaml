locale: zh
source: L1-audience-viewer-management.yaml
entries:
  BC-3750:
    name: 受众与观众管理
    description: |
      涵盖OTT、IPTV及付费电视平台上直接面向消费者内容服务的观众身份、订阅与权益、多设备认证、互动与留存，以及家长控制管理。
    source_hash: sha256-0f80fce34da69cbb
  BC-3750.10:
    name: 观众身份管理
    description: |
      跨服务供给并管理观众账号、家庭构成及联合身份认证。
    source_hash: sha256-de494b22ff333d66
  BC-3750.10.10:
    name: 观众账号供给
    description: |
      创建并维护观众账号的生命周期，包括账号合并和拆分操作。
    source_hash: sha256-d143585800dc0afd
  BC-3750.10.20:
    name: 家庭与用户档案管理
    description: |
      在共享账号内管理家庭构成和每位观众的个人档案。
    source_hash: sha256-1703d1787a3a6078
  BC-3750.10.30:
    name: 身份联合认证
    description: |
      将观众身份与运营商、零售商及第三方身份提供方进行联合认证。
    source_hash: sha256-7717e624871e42eb
  BC-3750.20:
    name: 订阅与权益管理
    description: |
      管理观众订阅及控制内容服务和等级访问权限的权益记录的生命周期。
    source_hash: sha256-74a6643f3295ec8f
  BC-3750.20.10:
    name: 订阅套餐注册
    description: |
      将观众注册到订阅、按次付费及广告支持套餐。
    source_hash: sha256-9e900f17171b5eea
  BC-3750.20.20:
    name: 权益授予与撤销
    description: |
      根据订阅、购买及合作伙伴捆绑包授予和撤销内容权益。
    source_hash: sha256-5c5d7360015c4351
  BC-3750.20.30:
    name: 并发流权益
    description: |
      基于权益控制每个账号的并发流数和设备数量。
    source_hash: sha256-8a41bd6a2cf0d5b1
  BC-3750.30:
    name: 多设备认证
    description: |
      跨设备体系对观众进行认证，包括通过运营商身份提供方的TV-Everywhere流程。
    source_hash: sha256-171142fcf4db9d58
  BC-3750.30.10:
    name: 设备注册
    description: |
      向观众账号注册和注销设备。
    source_hash: sha256-312e70e3f8bb1b95
  BC-3750.30.20:
    name: 认证会话管理
    description: |
      跨设备管理认证播放会话及令牌生命周期。
    source_hash: sha256-957308d12d080253
  BC-3750.30.30:
    name: TV-Everywhere认证
    description: |
      通过运营商身份提供方对付费电视订户进行认证，以获取OTT权益。
    source_hash: sha256-2f21828d9145a9e3
  BC-3750.40:
    name: 观众互动与留存管理
    description: |
      通过建模、旅程设计及干预措施，提升直接面向消费者服务上的内容互动率并降低流失率。
    source_hash: sha256-102ebe0654afcb6f
  BC-3750.40.10:
    name: 观看习惯建模
    description: |
      对观众习惯、观看状态及内容偏好进行建模，以驱动互动决策。
    source_hash: sha256-874b4e754b4bbed2
  BC-3750.40.20:
    name: 召回与留存计划管理
    description: |
      针对流失风险及已流失观众，设计并执行挽留、召回及留存计划。
    source_hash: sha256-235b7cc9b6189cde
  BC-3750.40.30:
    name: 引导激活旅程管理
    description: |
      设计引导新观众完成注册并驱动首次有效观看激活的用户旅程。
    source_hash: sha256-aefdb57504812e0f
  BC-3750.50:
    name: 家长控制与档案限制管理
    description: |
      配置并执行用户档案级内容限制、PIN锁及观看时长限制。
    source_hash: sha256-d86330ee3e36b885
  BC-3750.50.10:
    name: 档案级内容限制
    description: |
      按每个档案对内容进行年龄分级、类别及自定义屏蔽列表限制。
    source_hash: sha256-8517d9dda7e66d6d
  BC-3750.50.20:
    name: PIN与锁定管理
    description: |
      跨设备和界面管理PIN码、档案锁及购买锁。
    source_hash: sha256-8bd77316edd8099f
  BC-3750.50.30:
    name: 观看限制配置
    description: |
      配置观看时长限制、时段限制及屏幕使用时间控制。
    source_hash: sha256-2b3a350028428669
