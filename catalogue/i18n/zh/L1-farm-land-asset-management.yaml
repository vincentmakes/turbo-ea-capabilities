entries:
  BC-3540:
    name: 农地资产管理
    description: |
      土地权属和租赁记录、地块与田区管理、农场设备与农机遥测、灌溉基础设施、农场建筑及农场能源资产管理。
    source_hash: sha256-56ca013a0e6db8b5
  BC-3540.10:
    name: 土地权属与租赁管理
    description: |
      支持农场组合运营权利的土地所有权、权属、租赁及地役权记录。
    in_scope:
      - 所有权与权属记录
      - 租赁协议管理
      - 地役权与通行权记录
    out_of_scope:
      - 企业不动产（BC-1410）
    source_hash: sha256-1183eddbff136891
  BC-3540.10.10:
    name: 土地所有权与权属记录
    description: |
      记录农场组合内的完全产权、租赁产权和习惯权属。
    source_hash: sha256-f7bf8f0699443f93
  BC-3540.10.20:
    name: 租赁协议管理
    description: |
      管理农场租赁协议及续签。
    source_hash: sha256-8ff1f2f881a68f74
  BC-3540.10.30:
    name: 土地地役权管理
    description: |
      管理通行地役权、道路通行权及保护地役权。
    source_hash: sha256-282a5a9a2a0ae0aa
  BC-3540.20:
    name: 地块与田区管理
    description: |
      地块边界记录、地块历史及地块和田区级生产力分区。
    source_hash: sha256-80510efce22fa9d7
  BC-3540.20.10:
    name: 地块边界记录
    description: |
      在农场GIS系统中采集和维护地块边界。
    source_hash: sha256-e62cd02e75d5c249
  BC-3540.20.20:
    name: 地块历史记录
    description: |
      记录作物、投入和产量的多年期地块历史。
    source_hash: sha256-f12b861cd361c18a
  BC-3540.20.30:
    name: 地块生产力分区
    description: |
      地块内生产力分区和管理区划定。
    source_hash: sha256-5c541b1bb131a8ab
  BC-3540.30:
    name: 农场设备管理
    description: |
      农场设备台账、农机运营、ISOBUS遥测及设备共享安排。
    source_hash: sha256-f81320b5ab8360e1
  BC-3540.30.10:
    name: 农场设备台账
    description: |
      记录拖拉机、农具及自走式设备台账。
    source_hash: sha256-55c7ddb1126301c1
  BC-3540.30.20:
    name: 田间农机运营
    description: |
      日常田间农机调度和操作人员分配。
    source_hash: sha256-cc11b81762a6b662
  BC-3540.30.30:
