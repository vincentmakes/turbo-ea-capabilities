    description: |
      农场灌溉系统的设计与容量规划。
    source_hash: sha256-9fff9a010de67998
  BC-3540.40.20:
    name: 用水配额合规
    description: |
      地表水和地下水配额及计量合规管理。
    source_hash: sha256-b608483e01e8db0e
  BC-3540.40.30:
