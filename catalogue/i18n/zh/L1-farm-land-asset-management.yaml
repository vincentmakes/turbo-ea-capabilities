    description: |
      畜禽舍运营和垫料管理。
    source_hash: sha256-38bbb192cd516c2c
  BC-3540.50.30:
    name: 堆场与道路维护
    description: |
      维护农场堆场、道路及牲畜处理设施。
    source_hash: sha256-ebb226d8cd7ed3a0
  BC-3540.60:
    name: 农场能源管理
    description: |
      农场能源发电、燃料与能源采购协调及能源使用记录。
    source_hash: sha256-4304503b1f7609b8
  BC-3540.60.10:
    name: 农场能源发电
    description: |
      农场太阳能、风能和沼气发电。
    source_hash: sha256-fba95c3913a75b37
  BC-3540.60.20:
    name: 燃料与能源采购协调
    description: |
      协调农场燃油、电力和天然气采购。
    source_hash: sha256-60911d7a1a8440df
  BC-3540.60.30:
    name: 能源使用记录
    description: |
      按活动和资产记录农场能源使用情况。
    source_hash: sha256-2bc8f84a6d640464
