    description: |
      设备共享、外包和定制作业安排。
    source_hash: sha256-9e3381d1a1503371
  BC-3540.40:
    name: 灌溉基础设施管理
    description: |
      灌溉系统、用水配额及灌溉基础设施维护的全生命周期管理。
    source_hash: sha256-5d1b5f80da54ec9f
  BC-3540.40.10:
