locale: zh
source: L1-freight-forwarding-brokerage-management.yaml
entries:
  BC-2450:
    name: 货运代理与经纪管理
    description: |
      作为货运代理、无船承运人（NVOCC）、货运经纪或报关行，代表货主安排运输，包括多式联运协调及代理网络运营。
    source_hash: sha256-e79ebf8899871210
  BC-2450.10:
    name: 货主报价管理
    description: |
      接收货主询价请求，并跨运输方式及承运商出具代理运价报价。
    in_scope:
      - 针对货主询价开展多承运商运价查询
      - 报价有效期与确认追踪
    out_of_scope:
      - 承运商侧运价表及运费表管理（BC-2520）
    source_hash: sha256-45e57d27ccb8177d
  BC-2450.10.10:
    name: 询价需求采集
    description: |
      跨渠道采集货主询价需求。
    source_hash: sha256-8e74e5c1a4941035
  BC-2450.10.20:
    name: 多承运商运价查询
    description: |
      查询并比较各底层承运商运价。
    source_hash: sha256-03e9f517385ed079
  BC-2450.10.30:
    name: 报价开具与有效期管理
    description: |
      开具约束性及参考性报价，并追踪其有效期。
    source_hash: sha256-00ea905c3cfdd7fb
  BC-2450.20:
    name: 承运商采购与分配管理
    description: |
      向底层承运商订舱，并管理承运商分配及费用。
    source_hash: sha256-6777c740e0e86b5b
  BC-2450.20.10:
    name: 承运商选择
    description: |
      按批次货物选择底层承运商。
    source_hash: sha256-024e7dc7ed481be8
  BC-2450.20.20:
    name: 承运商订舱执行
    description: |
      向选定承运商订舱。
    source_hash: sha256-7750a01aed7f7d47
  BC-2450.20.30:
    name: 分配费用优化
    description: |
      优化代理在各承运商分配间的费用支出。
    source_hash: sha256-8221d3835846f04d
  BC-2450.30:
    name: 多式联运货代协调
    description: |
      协调多航段、多方式运输，包括集拼、拆箱及分单提单操作。
    source_hash: sha256-ca1bb5766e3e0612
  BC-2450.30.10:
    name: 分单提单开具
    description: |
      向货主开具代理分单提单。
    source_hash: sha256-fdbc62c7d5c835dd
  BC-2450.30.20:
    name: 多航段运输协调
    description: |
      协调跨承运商及运输方式的多航段运输。
    source_hash: sha256-b3519743145301a2
  BC-2450.30.30:
    name: 集拼与拆箱
    description: |
      在起运地完成货物集拼，在目的地完成货物拆箱。
    source_hash: sha256-cb1082ca9f8e2b9a
  BC-2450.40:
    name: 报关行管理
    description: |
      代表进口商及出口商提供报关代理服务。
    source_hash: sha256-67a741141081384b
  BC-2450.40.10:
    name: 报关单填报
    description: |
      代客户填报报关单。
    source_hash: sha256-011bed1d1018b0cc
  BC-2450.40.20:
    name: 关税与税款计算
    description: |
      为客户计算并代付关税及间接税款。
    source_hash: sha256-796ff7c643363a45
  BC-2450.40.30:
    name: 报关进度追踪
    description: |
      追踪报关进度及异常问题处理。
    source_hash: sha256-f14b36420a72e45e
  BC-2450.50:
    name: 代理网络协调
    description: |
      与代理网络中的起运地、目的地及合作代理协调，包括内部结算。
    source_hash: sha256-2f584233672f3d6a
  BC-2450.50.10:
    name: 起运地与目的地代理协调
    description: |
      与起运地及目的地代理协调业务活动。
    source_hash: sha256-e4c7612af011696d
  BC-2450.50.20:
    name: 内部结算
    description: |
      开展代理网络内部及跨代理的货代收入与成本结算。
    source_hash: sha256-ebe5eea8188b5136
  BC-2450.50.30:
    name: 合作代理绩效管理
    description: |
      管理合作代理的服务质量与合规情况。
    source_hash: sha256-a4e8c404f3a31fa2
