locale: zh
source: L1-harvest-post-harvest-operations-management.yaml
entries:
  BC-3560:
    name: 收获与采后处理运营管理
    description: |
      收获计划与执行、田间及采后调制、农场储存、分级与包装，以及向农食品链下一环节的到货收货。
    source_hash: sha256-cc6e9c4b383dd73a
  BC-3560.10:
    name: 收获计划与调度
    description: |
      跨地块和作物的收获窗口规划、人员与设备调度及收获物流协调。
    source_hash: sha256-4d2e24ccc7942296
  BC-3560.10.10:
    name: 收获窗口规划
    description: |
      依据成熟度和天气开展逐地块收获窗口规划。
    source_hash: sha256-9fcdf68181f9adc7
  BC-3560.10.20:
    name: 收获人员与设备调度
    description: |
      调度收获人员、承包商和农机。
    source_hash: sha256-94bdf3f188e849f6
  BC-3560.10.30:
    name: 收获物流协调
    description: |
      协调跨活跃收获前线的卡车、料箱和拖车。
    source_hash: sha256-35077c4fe664509e
  BC-3560.20:
    name: 田间收获作业
    description: |
      机械和人工收获作业，包括田间分选和田边转运。
    source_hash: sha256-1845ba838a5f32f3
  BC-3560.20.10:
    name: 机械收获
    description: |
      联合收割机、割草压扁机和专用机械收获作业。
    source_hash: sha256-8e3366590a13889d
  BC-3560.20.20:
    name: 人工收获
    description: |
      园艺作物的手工采摘和选择性人工收获。
    source_hash: sha256-c1c4e3566b4197f5
  BC-3560.20.30:
    name: 田间分选
    description: |
      收获农产品的田间分选与整理。
    source_hash: sha256-bf5e030a0b8c73c3
  BC-3560.30:
    name: 采后调制
    description: |
      收获农产品的干燥、冷却、愈伤和去污处理，以稳定品质备储或向下游流转。
    in_scope:
      - 谷物和种子干燥
      - 园艺农产品预冷
      - 块根和球茎作物愈伤处理
      - 田间清洗和去污
    source_hash: sha256-4534c054aebd2482
  BC-3560.30.10:
    name: 干燥作业
    description: |
      将谷物、种子和牧草干燥至安全含水率。
    source_hash: sha256-e71cdae33223d9ef
  BC-3560.30.20:
    name: 冷却与预冷作业
    description: |
      园艺农产品的水冷、真空预冷和强制通风预冷。
    source_hash: sha256-2e6c70125186ca0f
  BC-3560.30.30:
    name: 愈伤处理作业
    description: |
      马铃薯、洋葱、甘薯及类似作物的愈伤处理。
    source_hash: sha256-aecc7c28c0d6dda6
  BC-3560.30.40:
    name: 清洗与去污处理
    description: |
      收获农产品储前清洗与去污处理。
    source_hash: sha256-74bba3ab707bf761
  BC-3560.40:
    name: 农场储存运营
    description: |
      运营农场料箱、筒仓和冷库，包括通风和储粮害虫管理。
    source_hash: sha256-5bf787463052ef3e
  BC-3560.40.10:
    name: 料箱与筒仓管理
    description: |
      谷物料箱和筒仓的装仓、监测和出仓管理。
    source_hash: sha256-d3a4d73525ef455d
  BC-3560.40.20:
    name: 冷库运营
    description: |
      运营农场保鲜库和气调库。
    source_hash: sha256-fe33b39dd18203e1
  BC-3560.40.30:
    name: 储粮通风管理
    description: |
      通过通风管理维持储粮温度和水分。
    source_hash: sha256-6489aae97c1bb76e
  BC-3560.40.40:
    name: 储粮有害生物管理
    description: |
      仓库中昆虫和鼠害压力的监测与防治。
    source_hash: sha256-16c15c99422e2c13
  BC-3560.50:
    name: 农产品分级与包装
    description: |
      农产品分级、包装车间及批次标识运营，为下游流转做好准备。
    source_hash: sha256-dc5cff1ff7e8f6e3
  BC-3560.50.10:
    name: 品质分级作业
    description: |
      依据大小、颜色和缺陷规格对农产品进行分级。
    source_hash: sha256-0d2cdc703778b7f6
  BC-3560.50.20:
    name: 包装车间运营
    description: |
      包装线运营，包括清洗、打蜡和包装。
    source_hash: sha256-0ddb22ab9c709b53
  BC-3560.50.30:
    name: 批次识别与标识
    description: |
      批次、生产批号及GS1标识分配与标签打印。
    source_hash: sha256-999b40b088bdf7c7
  BC-3560.60:
    name: 向加工商到货收货
    description: |
      协调农场或集货商向加工商或买方场地的到货收货。
    source_hash: sha256-06f9dd3f3c20a217
  BC-3560.60.10:
    name: 卡车调度与收货
    description: |
      加工商入口的到货卡车调度与收货。
    source_hash: sha256-6b6654a2e1a2e132
  BC-3560.60.20:
    name: 收货抽样
    description: |
      谷物、牲畜、牛奶和农产品到货批次的抽样检测。
    source_hash: sha256-aca0a1ca596b8976
  BC-3560.60.30:
    name: 收货质量检测
    description: |
      支持验收和定价的到货批次质量检测。
    source_hash: sha256-fc9b27f15ea6b14b
