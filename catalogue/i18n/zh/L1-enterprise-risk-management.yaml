    description: |
      制定经董事会批准的风险偏好声明及容忍度阈值。
    source_hash: sha256-4afc80f58b535125
  BC-120.10.30:
    name: 风险政策与标准管理
    description: |
      制定并维护集团层面的风险政策、标准及方法论。
    source_hash: sha256-939a4a67c55302b4
  BC-120.10.40:
