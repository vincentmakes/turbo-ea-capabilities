  BC-120:
    name: 企业风险管理
    description: |
      在企业层面识别、评估、缓解及监控风险。
    source_hash: sha256-a1517cbc3d1fd5b8
  BC-120.10:
    name: 风险框架与风险偏好管理
    description: |
      建立风险分类体系、框架、偏好及容忍度。
    source_hash: sha256-13c2d4f4d3edc695
  BC-120.10.10:
    name: 风险分类体系管理
    description: |
      定义并维护企业风险分类体系与类别。
    source_hash: sha256-ae830f6104aac792
  BC-120.10.20:
