    description: |
      制定各险种的承保策略、自留额及保额。
    source_hash: sha256-bc2af224dc251d63
  BC-120.50.20:
    name: 保险安排与续保
    description: |
      管理经纪人关系、市场询价及保单续保。
    source_hash: sha256-14143bd9aec75e67
  BC-120.50.30:
    name: 保险理赔管理
    description: |
      处理企业保险理赔的申报、处理及追偿。
    source_hash: sha256-132dfcb78355cbd8
  BC-120.50.40:
    name: 自保公司管理
    description: |
      运营并治理自保保险载体。
    source_hash: sha256-66fcfcbcc215f73c
