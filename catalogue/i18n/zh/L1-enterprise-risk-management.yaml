    description: |
      开展风险文化评估、意识提升及责任担当项目。
    source_hash: sha256-e121402c953ae918
  BC-120.20:
    name: 风险识别与评估
    description: |
      发现、评估、评分及优先排序风险。
    source_hash: sha256-33956243fbe3a2e3
  BC-120.20.10:
    name: 风险识别
    description: |
