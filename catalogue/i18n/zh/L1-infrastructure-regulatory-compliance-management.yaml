locale: zh
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: 基础设施监管与合规管理
    description: |
      对基础设施的经济性和安全性监管进行管理，涵盖监管机构关系与价格控制提交、执照与义务管理、安全论证与保证、监管报告，以及许可与法定审批。
    in_scope:
      - 监管机构接触与价格控制提交
      - 运营执照与法定义务管理
      - 安全论证编制与安全保证
      - 监管绩效与法定报告
      - 运营、环境和法定许可管理
      - 监管审计与披露支持
    out_of_scope:
      - 跨行业合规管理（BC-130）
      - 企业风险管理（BC-140）
      - 特许经营商务管理（BC-5100）
      - 企业法务与诉讼管理
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: 监管关系管理
    description: |
      与经济监管机构接触，并管理价格控制提交和裁定。
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: 监管机构接触
    description: |
      与经济性和行业监管机构进行持续接触和关系管理。
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: 价格控制与裁定
    description: |
      管理监管价格控制流程和定期裁定。
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: 监管提交管理
    description: |
      准备和管理向监管机构提交的正式材料。
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: 监管变化监测
    description: |
      监测和解读影响业务的监管变化。
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: 执照与义务管理
    description: |
      管理运营执照以及附加于其上的法定义务和条件。
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: 运营执照管理
    description: |
      管理基础设施运营方持有的运营执照。
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: 法定义务跟踪
    description: |
      跟踪法定义务及其在整个业务中的履行情况。
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: 执照条件合规
    description: |
      保证遵守附加于运营执照的条件。
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: 职责与承诺管理
    description: |
      管理向监管机构和主管部门作出的法定职责和承诺。
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: 安全论证与保证
    description: |
      编制安全论证以及证明安全运营的保证和认证。
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: 安全论证编制
    description: |
      为基础设施资产和运营编制并维护安全论证。
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: 安全认证与授权
    description: |
      取得运营所需的安全认证和授权。
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: 安全监管保证
    description: |
      向安全监管机构保证安全义务得到履行。
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: 独立安全评估
    description: |
      对安全论证和安排进行独立评估和验证。
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: 监管报告与披露
    description: |
      向监管机构和利益相关方报告绩效、财务和法定信息。
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: 监管绩效报告
    description: |
      向监管机构报告运营和服务绩效。
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: 财务监管报告
    description: |
      向主管部门报告监管财务和成本信息。
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: 法定披露
    description: |
      披露法律和监管所要求的法定信息。
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: 监管审计支持
    description: |
      为监管审计、审查和调查提供支持。
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: 许可与法定审批
    description: |
      管理运营所需的运营、环境和法定许可及审批。
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: 运营许可管理
    description: |
      管理基础设施活动所需的运营许可。
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: 法定审批管理
    description: |
      管理来自主管部门的法定审批和同意。
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: 环境许可合规
    description: |
      遵守环境许可及其条件。
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: 许可续期与变更
    description: |
      随运营变化对许可和审批进行续期和变更。
    source_hash: sha256-07c3c25fd50f1ebe
metadata:
  translator: claude-ai
  date: "2026-07-16"
