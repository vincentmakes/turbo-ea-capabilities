locale: zh
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: 基础设施投资与组合管理
    description: |
      跨基础设施资产和资本项目组合的投资战略、机会来源拓展、评估及资本配置。作为业主/投资方学科，决定为哪些基础设施出资以及如何出资，并在资产全生命周期内跟踪组合层面的回报和公共价值。
    in_scope:
      - 基础设施投资战略与行业聚焦
      - 交易与项目管道来源拓展及筛选
      - 商业论证、方案评估及成本效益分析
      - 组合内资本方案的优先排序与排序编排
      - 出资与融资战略，含拨款和项目融资
      - 组合绩效、效益及资金价值跟踪
    out_of_scope:
      - 企业财资与企业融资（BC-210）
      - 企业战略制定（BC-580）
      - 运营收入、资费及特许经营收入（BC-5100）
      - 方案与项目交付控制（BC-5020）
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: 基础设施投资战略
    description: |
      定义长期基础设施投资战略、行业聚焦及支配资本投放方向的风险偏好。
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: 行业与市场战略
    description: |
      依据需求、政策和竞争动态选择目标基础设施行业和市场。
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: 投资论点定义
    description: |
      阐明各目标基础设施细分领域的投资论点和价值创造逻辑。
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: 资本配置框架
    description: |
      支配资本在行业、地区和资产类别间配置的框架和标准。
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: 风险偏好定义
    description: |
      定义基础设施组合的投资风险偏好和容忍阈值。
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: 管道与机会来源拓展管理
    description: |
      依据投资标准对基础设施投资和项目机会进行来源拓展、筛选和跟踪。
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: 机会来源拓展
    description: |
      通过市场、政府和专有渠道获取基础设施投资和开发机会。
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: 投资筛选与优先排序
    description: |
      依据战略和财务筛选条件对机会进行筛选和早期优先排序。
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: 市场与行业情报
    description: |
      收集和分析市场、需求和政策情报以支持机会来源拓展。
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: 管道跟踪
    description: |
      通过阶段关口跟踪机会从线索到投资决策的进展。
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: 商业论证与评估管理
    description: |
      制定和评估基础设施投资的商业论证，包括方案和价值评估。
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: 方案评估
    description: |
      依据战略目标和约束条件评估投资和交付方案。
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: 成本效益分析
    description: |
      对候选基础设施投资进行量化的成本效益和经济评估。
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: 经济与社会价值评估
    description: |
      评估投资所带来的更广泛的经济、社会和公共价值。
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: 投资决策关口
    description: |
      授权推进和承诺出资的治理关口和审批。
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: 资本方案优先排序
    description: |
      对资本方案和资产组合内的投资进行优先排序、平衡和排序编排。
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: 组合优先排序
    description: |
      依据价值、风险和战略贡献对候选投资进行排序。
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: 资本配给
    description: |
      在相互竞争的投资需求间配置受限资本。
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: 组合平衡
    description: |
      在风险、行业和生命周期视野间平衡组合。
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: 投资排序编排
    description: |
      对投资进行分期和排序编排以管理可交付性和出资曲线。
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: 出资与融资战略
    description: |
      为交付基础设施方案所需的出资和融资进行来源获取和结构设计的战略。
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: 出资来源战略
    description: |
      在公共、私营和使用者付费机制间选择出资来源。
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: 拨款与公共出资管理
    description: |
      获取和管理拨款及公共资本出资。
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: 项目融资结构设计
    description: |
      为基础设施资产设计项目融资、债务和股权结构。
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: 混合融资结构设计
    description: |
      设计公私混合及优惠性融资方案的结构。
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: 组合绩效管理
    description: |
      监测和报告基础设施投资组合所交付的回报、效益和价值。
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: 组合绩效监测
    description: |
      监测组合内的财务和运营绩效。
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: 效益跟踪
    description: |
      依据投资商业论证跟踪已实现的效益和成果。
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: 资金价值评估
    description: |
      评估组合的资金价值和全生命周期价值。
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: 组合报告
    description: |
      向投资人、董事会和公共利益相关方报告组合绩效。
    source_hash: sha256-35c417c36c5cb686
metadata:
  translator: claude-ai
  date: "2026-07-16"
