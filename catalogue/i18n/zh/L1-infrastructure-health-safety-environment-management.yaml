locale: zh
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: 基础设施健康、安全与环境管理
    description: |
      跨基础设施施工和运营的健康、安全与环境管理，涵盖HSE管理体系、施工安全、职业健康、环境管理以及事件与应急响应。在交付和运营工程与资产的同时，保护人员、社区和环境。
    in_scope:
      - HSE方针、管理体系、文化和能力
      - CDM框架下的施工安全、许可和风险评估
      - 职业健康监护、福利和身心健康
      - 环境控制、污染预防和许可合规
      - 施工期间的生态和遗产保护
      - 事件报告、调查和应急响应
    out_of_scope:
      - 跨行业环境、健康与安全（BC-720）
      - 运营韧性与安保（BC-5120）
      - 施工质量管理（BC-5040.60）
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: HSE管理体系
    description: |
      构成健康、安全与环境管理体系的方针、标准、文化和能力。
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: HSE方针与标准
    description: |
      在基础设施各项活动中定义HSE方针、标准和目标。
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: HSE管理体系
    description: |
      运行并持续改进经认证的HSE管理体系。
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: 安全文化与行为
    description: |
      在劳动力中培育积极的安全文化和安全行为。
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: HSE能力与培训
    description: |
      保证人员的HSE能力、培训和授权。
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: 施工安全管理
    description: |
      通过设计、现场控制、许可和安全作业系统管理施工安全风险。
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: CDM与设计风险管理
    description: |
      管理施工设计与管理职责以及设计阶段的风险削减。
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: 现场安全管理
    description: |
      对施工现场的安全控制和监督进行日常管理。
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: 作业许可管理
    description: |
      通过作业许可系统控制高风险活动。
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: 方法陈述与风险评估
    description: |
      为安全执行编制和控制方法陈述和任务风险评估。
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: 职业健康管理
    description: |
      通过监护、福利、卫生和身心健康管理来保护劳动力健康。
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: 职业健康监护
    description: |
      针对职业暴露监测劳动力的健康和适任状况。
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: 福利提供
    description: |
      为现场劳动力提供福利设施和安排。
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: 暴露与卫生监测
    description: |
      监测和控制职业暴露和工作场所卫生。
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: 疲劳与身心健康管理
    description: |
      管理劳动力的疲劳、心理健康和身心健康。
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: 环境管理
    description: |
      跨施工和运营管理环境影响、控制和许可。
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: 环境控制
    description: |
      实施限制工程和运营环境影响的控制措施。
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: 污染预防
    description: |
      在施工期间预防和控制对空气、水和土地的污染。
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: 环境许可合规
    description: |
      遵守环境许可、批准和执照的条件。
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: 生态与遗产保护
    description: |
      保护受工程影响的生态、生物多样性和遗产资产。
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: 事件与应急管理
    description: |
      对HSE事件进行报告、调查和应急响应，并进行绩效监测。
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: 事件报告与调查
    description: |
      报告和调查HSE事件和未遂事件。
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: 根本原因分析
    description: |
      分析潜在原因，以防止事件再次发生。
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: 应急响应规划
    description: |
      为跨场地和资产的应急响应进行规划和准备。
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: HSE绩效监测
    description: |
      监测和报告HSE绩效及先导指标。
    source_hash: sha256-fbf0f34769e795c3
metadata:
  translator: claude-ai
  date: "2026-07-16"
