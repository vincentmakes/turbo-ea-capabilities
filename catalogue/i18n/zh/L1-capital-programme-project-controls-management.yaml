locale: zh
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: 资本方案与项目控制管理
    description: |
      基础设施资本方案和项目的业主方与交付方治理及控制，涵盖方案设立、成本与进度控制、挣值、风险与变更控制以及保证。
    in_scope:
      - 方案设立、治理和阶段关口管理
      - 成本估算、预算、控制和预测
      - 计划编制、进度安排和关键路径分析
      - 挣值与一体化绩效管理
      - 方案风险、变更和应急储备控制
      - 项目保证、关口评审和报告
    out_of_scope:
      - 企业项目与变革管理（BC-900/BC-910）
      - 工程项目管理（BC-1110）
      - 投资评估与出资决策（BC-5000）
      - 施工现场执行与工程交付
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: 方案设立与治理
    description: |
      建立方案结构、交付模式和治理，以通过既定的阶段关口控制资本投资。
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: 方案定义与设立
    description: |
      定义和设立方案范围、结构及控制基线。
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: 交付模式选择
    description: |
      选择最适合方案的交付和组织模式。
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: 治理与保证框架
    description: |
      建立监督方案的治理和保证框架。
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: 阶段关口管理
    description: |
      管理授权推进和释放出资的阶段关口。
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: 成本估算与管理
    description: |
      在交付全生命周期内对方案和项目成本进行估算、基线设定和控制。
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: 成本估算
    description: |
      按生命周期各估算等级编制成本估算。
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: 预算基线管理
    description: |
      建立和维护衡量绩效所依据的成本基线。
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: 成本控制与预测
    description: |
      依据核准基线控制和预测直至完工的成本。
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: 成本报告
    description: |
      向方案和项目利益相关方报告成本状态和预测。
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: 计划编制与进度安排
    description: |
      编制和控制方案与项目进度计划，以管理时间和交付确定性。
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: 进度计划编制
    description: |
      编制涵盖方案和项目活动的一体化进度计划。
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: 关键路径分析
    description: |
      分析关键路径和浮时，以保护关键交付里程碑。
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: 进展测量
    description: |
      依据进度基线测量实物和时间进展。
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: 进度风险分析
    description: |
      对进度风险进行概率分析，以检验交付信心。
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: 挣值与绩效管理
    description: |
      对成本和进度绩效进行一体化测量和报告，以预测方案成果。
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: 挣值管理
    description: |
      整合范围、成本和进度，以测量挣值和绩效。
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: 绩效指标与KPI
    description: |
      定义和跟踪方案的绩效指标和KPI。
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: 趋势与偏差分析
    description: |
      分析趋势和偏差，以预判对计划的偏离。
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: 一体化绩效报告
    description: |
      对一体化的成本、进度和绩效状态进行汇总报告。
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: 方案风险与变更控制
    description: |
      管理方案风险、变更、应急储备和接口，以保护交付成果。
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: 方案风险管理
    description: |
      识别、评估和处置方案范围内的风险。
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: 变更控制
    description: |
      通过规范的变更流程控制范围和基线变更。
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: 应急储备管理
    description: |
      依据量化的风险敞口管理应急储备和储备金。
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: 接口与依赖管理
    description: |
      管理项目和利益相关方之间的接口和依赖关系。
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: 项目保证与报告
    description: |
      通过独立保证、经验教训和报告，确认方案健康度和效益交付。
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: 项目保证与关口评审
    description: |
      对方案和项目就绪度进行独立保证和关口评审。
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: 经验教训管理
    description: |
      在方案全生命周期内采集和应用经验教训。
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: 方案报告
    description: |
      向董事会、发起人和监督机构报告方案状态。
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: 效益实现跟踪
    description: |
      依据方案商业论证跟踪效益实现情况。
    source_hash: sha256-de6ea1cd05c875b0
metadata:
  translator: claude-ai
  date: "2026-07-16"
