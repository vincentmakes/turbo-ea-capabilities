locale: zh
source: L1-chemical-regulatory-compliance-management.yaml
entries:
  BC-4660:
    name: 化工法规合规管理
    description: |
      依据 REACH、TSCA、K-REACH、CWC 及同等制度，开展物质登记、档案管理、授权申请、限制合规、清单申报及进出口管制。有别于保留企业政策合规范围的跨行业合规管理（BC-130）。
    source_hash: sha256-250e562140d1d1e0
  BC-4660.10:
    name: 物质登记管理
    description: |
      在主要全球化学品清单制度下开展物质登记。
    source_hash: sha256-87bd25fffd94af55
  BC-4660.10.10:
    name: REACH 登记管理
    description: |
      管理 REACH 登记，包括物质信息交流论坛（SIEF）和联合提交。
    source_hash: sha256-fad3f3a4de2ec258
  BC-4660.10.20:
    name: TSCA 预制造申报与清单申报
    description: |
      开展预制造申报（PMN）和 TSCA 清单申报。
    source_hash: sha256-65aff716bf245af8
  BC-4660.10.30:
    name: K-REACH 与亚太申报
    description: |
      开展 K-REACH、中国、日本及其他亚太制度下的申报。
    source_hash: sha256-3711a3fd97da3fd6
  BC-4660.10.40:
    name: 聚合物申报管理
    description: |
      管理聚合物物质的申报和豁免。
    source_hash: sha256-30825f93cb369668
  BC-4660.20:
    name: 授权与限制管理
    description: |
      遵守授权申请、限制和新兴物质管控要求。
    source_hash: sha256-05b4797ade4325d7
  BC-4660.20.10:
    name: REACH 授权申请
    description: |
      编制和提交 REACH 附件 XIV 授权申请材料。
    source_hash: sha256-cec52bbc6a145cae
  BC-4660.20.20:
    name: REACH 限制合规
    description: |
      遵守 REACH 附件 XVII 限制条款。
    source_hash: sha256-76c16bdefe40f13a
  BC-4660.20.30:
    name: SVHC 候选清单追踪
    description: |
      追踪 SVHC 候选清单更新及影响分析。
    source_hash: sha256-6c22fe83d2b5e962
  BC-4660.20.40:
    name: PFAS 与新兴限制管理
    description: |
      管理 PFAS、微塑料及其他新兴限制事项。
    source_hash: sha256-4b727d88a98fa10f
  BC-4660.30:
    name: 监管档案管理
    description: |
      在 IUCLID 及同等格式中编制和维护监管档案。
    source_hash: sha256-50c64444876084e1
  BC-4660.30.10:
    name: IUCLID 档案管理
    description: |
      编制和维护 IUCLID 6 档案。
    source_hash: sha256-45ca733383350356
  BC-4660.30.20:
    name: 化学品安全报告编制
    description: |
      按照 REACH 附件 I 编制化学品安全报告。
    source_hash: sha256-f2cf479a13fb3373
  BC-4660.30.30:
    name: 物质身份档案维护
    description: |
      维护物质身份档案和分析证据。
    source_hash: sha256-9170908f3059a5c0
  BC-4660.40:
    name: 清单申报管理
    description: |
      管理物质在 EINECS、EC 和国家化学品清单中的收录情况。
    source_hash: sha256-2eb1fe06d84bba93
  BC-4660.40.10:
    name: EINECS 与 EC 编号管理
    description: |
      管理 EINECS 和 EC 编号的分配和更新。
    source_hash: sha256-68838a28e125783d
  BC-4660.40.20:
    name: 新物质清单申报
    description: |
      向国家化学品清单申报新物质。
    source_hash: sha256-ce3477408ac272d3
  BC-4660.40.30:
    name: 国家清单对账
    description: |
      将产品组合与各国化学品清单进行对账。
    source_hash: sha256-8fb1a35f9e0c7b6a
  BC-4660.50:
    name: 化学品进出口管制
    description: |
      遵守国际化学品贸易管控，包括 CWC、毒品前体物、两用品和事先知情同意制度。
    source_hash: sha256-6f70f702fb077fc2
  BC-4660.50.10:
    name: CWC 附表合规
    description: |
      遵守禁止化学武器组织（OPCW）一、二、三类附表的申报和许可要求。
    source_hash: sha256-f325edb42017d8b6
  BC-4660.50.20:
    name: 毒品前体物管制
    description: |
      遵守国际麻醉品管制局（INCB）和国家毒品前体物管制制度。
    source_hash: sha256-6cdfe1cc0fcec3aa
  BC-4660.50.30:
    name: 两用品出口许可
    description: |
      对两用化学品出口开展许可和最终用途合规管理。
    source_hash: sha256-68166cf2823f1cd9
  BC-4660.50.40:
    name: 事先知情同意合规
    description: |
      遵守《鹿特丹公约》事先知情同意制度。
    source_hash: sha256-86b1cbe08830122b
  BC-4660.60:
    name: 法规监控与情报
    description: |
      监测和评估各市场化学品法规的演变情况及影响。
    source_hash: sha256-55e36bcf4410fa9b
  BC-4660.60.10:
    name: 法规前瞻扫描
    description: |
      开展待出台和新兴化学品法规的前瞻扫描。
    source_hash: sha256-361fd38abdcc45f3
  BC-4660.60.20:
    name: 法规变化影响评估
    description: |
      评估法规变化对产品组合和运营的影响。
    source_hash: sha256-d70b03bcc22f5cc4
  BC-4660.60.30:
    name: 行业协会联络
    description: |
      与 Cefic、ACC 及同等行业协会开展联络。
    source_hash: sha256-d793bd0c03c5a002
  BC-4660.70:
    name: 主管机构参与与提交
    description: |
      与监管机构开展参与，包括提交、答疑和检查应对。
    source_hash: sha256-ea829a6c1315e956
  BC-4660.70.10:
    name: 主管机构提交材料编制
    description: |
      编制向 ECHA、EPA 及同等主管机构的提交材料。
    source_hash: sha256-ed720d1f66ded276
  BC-4660.70.20:
    name: 主管机构询问答复
    description: |
      答复主管机构就档案和登记提出的询问。
    source_hash: sha256-b0ab602dc310b7ba
  BC-4660.70.30:
    name: 检查准备就绪
    description: |
      持续保持应对监管机构检查和审计的准备状态。
    source_hash: sha256-c75beb0b81e1d4db
