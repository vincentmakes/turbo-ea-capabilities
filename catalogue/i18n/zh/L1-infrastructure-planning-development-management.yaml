locale: zh
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: 基础设施规划与开发管理
    description: |
      长期网络与系统规划、可行性与方案开发、土地与线路取得、许可审批与环境评估，以及利益相关方沟通，以将基础设施方案发展至可交付状态。
    in_scope:
      - 长期网络、容量和空间规划
      - 可行性研究及方案与概念开发
      - 土地、线路和走廊的取得与地役权
      - 规划许可与环境影响评估
      - 利益相关方、社区和地主沟通
      - 可持续性、碳和气候适应规划
    out_of_scope:
      - 房地产开发（BC-4900）
      - 施工执行（BC-5040）
      - 运营许可与监管审批（BC-5110）
      - 详细工程设计与BIM制作
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: 网络与系统规划
    description: |
      对基础设施网络和系统进行长期规划，以满足预测的需求和容量需要。
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: 需求预测
    description: |
      预测长期需求和使用量，以确定未来基础设施需要的规模。
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: 网络容量规划
    description: |
      规划网络和系统容量，以弥合需求与可用供给之间的差距。
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: 空间与走廊规划
    description: |
      进行空间和走廊规划，以预留土地并使方案与土地使用政策相协调。
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: 总体规划
    description: |
      制定统筹网络或区域内各方案的一体化总体规划。
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: 可行性与方案开发
    description: |
      对候选基础设施方案进行可行性评估并开发方案和概念。
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: 可行性研究
    description: |
      确立候选方案在技术、经济和可交付性方面可行性的研究。
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: 方案开发
    description: |
      依据目标和约束条件开发并比较方案选项。
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: 概念选定
    description: |
      选定推进至设计和交付阶段的优选概念。
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: 可施工性评估
    description: |
      评估可建造性和交付风险，以形成可行的方案概念。
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: 土地与线路管理
    description: |
      选定和取得交付基础设施方案所需的土地、线路和通行权。
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: 线路与走廊选定
    description: |
      选定在成本、影响和可交付性之间取得平衡的线路和走廊。
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: 土地收购与归集
    description: |
      收购和归集交付方案所需的土地地块。
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: 通行权与地役权
    description: |
      在第三方土地上取得通行权、地役权和进入权。
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: 强制征收管理
    description: |
      管理强制征收及相关补偿，以取得所需土地。
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: 许可审批与环境评估
    description: |
      为基础设施方案取得规划许可并完成环境和遗产评估。
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: 规划许可管理
    description: |
      管理规划申请和许可直至审定。
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: 环境影响评估
    description: |
      评估环境影响及缓解措施，以支持许可决定。
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: 生态与遗产评估
    description: |
      评估影响方案设计和许可的生态和遗产约束。
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: 开发同意令
    description: |
      为重大基础设施方案准备和管理开发同意令。
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: 利益相关方与社区沟通
    description: |
      与社区、利益相关方和地主沟通，以建立支持并管理对方案的反对意见。
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: 社区咨询
    description: |
      与受影响社区进行咨询，以告知并塑造方案提案。
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: 利益相关方映射与沟通
    description: |
      在方案全生命周期内对利益相关方进行映射和沟通。
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: 公众听证管理
    description: |
      管理针对方案提案的公众听证和审查。
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: 地主与邻里联络
    description: |
      与地主和邻里联络，以化解关切并取得配合。
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: 可持续性与气候规划
    description: |
      将可持续性、碳和气候韧性融入基础设施方案的规划和设计。
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: 全生命周期碳规划
    description: |
      规划以在方案设计和交付全过程中降低全生命周期碳排放。
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: 生物多样性与净增益规划
    description: |
      规划以保护生物多样性并实现可衡量的净增益。
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: 气候适应规划
    description: |
      规划基础设施资产的气候韧性和适应。
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: 可持续设计标准
    description: |
      为方案采用可持续设计标准和评级框架。
    source_hash: sha256-5942740434ce459c
metadata:
  translator: claude-ai
  date: "2026-07-16"
