locale: zh
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: 特许经营与收入管理
    description: |
      特许经营和PPP管理、资费与定价、收入收取与保证、拨款与补贴管理，以及在特许经营期内使基础设施资产变现的商业合作。
    in_scope:
      - 特许经营协议和PPP管理
      - 资费、通行费和受监管定价管理
      - 收入收取、保证和漏损控制
      - 拨款、补贴和可用性付款管理
      - 商业合作与附属收入开发
      - 土地和物业收入变现
    out_of_scope:
      - 企业定价管理（BC-450）
      - 投资出资与融资战略（BC-5000）
      - 监管价格控制（BC-5110）
      - 企业财资与现金管理
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: 特许经营与PPP管理
    description: |
      在特许经营协议和PPP结构的全生命周期及义务范围内加以管理。
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: 特许经营协议管理
    description: |
      在特许经营期内管理特许经营协议、条款和义务。
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: PPP结构设计
    description: |
      设计PPP安排及其风险与回报分配。
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: 可用性与付款机制
    description: |
      设计和运行支配特许经营报酬的可用性和付款机制。
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: 特许经营合规
    description: |
      保证在整个协议中满足特许经营义务和绩效标准。
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: 资费与定价管理
    description: |
      设定和治理基础设施使用及服务所收取的资费、通行费和价格。
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: 资费与通行费设定
    description: |
      确定基础设施进入和使用的资费和通行费。
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: 定价战略
    description: |
      为基础设施服务和容量定义商业定价战略。
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: 受监管价格控制
    description: |
      在受监管的价格控制框架和裁定内管理价格。
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: 动态与拥堵定价
    description: |
      应用需求响应型和基于拥堵的定价，以管理利用率和收入。
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: 收入收取与保证
    description: |
      收取基础设施收入，并保证已计费价值被准确捕获和对账。
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: 计费与收取
    description: |
      向客户计费并收取使用费、通行费和服务收入。
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: 收入保证
    description: |
      保证所有已赚取收入均被完整计费、捕获和记录。
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: 收入漏损管理
    description: |
      识别和追回收入漏损、逃费和少收。
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: 清算与对账
    description: |
      跨系统和交易对手对已收取收入进行清算和对账。
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: 拨款与补贴管理
    description: |
      管理为基础设施可用性和运营提供资金的拨款、补贴和公共出资。
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: 补贴与拨款管理
    description: |
      管理支持基础设施服务的补贴和拨款。
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: 可用性付款管理
    description: |
      管理与服务和资产绩效挂钩的基于可用性的付款。
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: 公共出资合规
    description: |
      遵守附加于公共出资的条件和报告要求。
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: 政府出资管理
    description: |
      管理政府对基础设施的资本和运营出资。
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: 商业合作管理
    description: |
      通过商业合作开发第三方、附属和基于物业的收入。
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: 第三方收入管理
    description: |
      管理来自第三方进入、服务和安排的收入。
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: 商业合作管理
    description: |
      开发和管理产生基础设施收入的商业合作。
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: 附属收入开发
    description: |
      开发围绕基础设施资产的附属和非核心收入来源。
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: 土地与物业收入
    description: |
      将与基础设施相关的土地和物业持有变现。
    source_hash: sha256-4931ef33faa7594b
metadata:
  translator: claude-ai
  date: "2026-07-16"
