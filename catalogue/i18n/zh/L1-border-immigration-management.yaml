locale: zh
source: L1-border-immigration-management.yaml
entries:
  BC-3300:
    name: 边境与移民管理
    description: |
      以人员为主的边境管控、签证和出行授权、庇护与难民身份认定、移民身份与居留管理、入籍及遣返运营。
    source_hash: sha256-aef6947657cfea72
  BC-3300.10:
    name: 签证与出行授权管理
    description: |
      处理签证申请、作出决定并签发签证和出行授权，包括ETA电子旅行授权式预审。
    in_scope:
      - 签证申请处理与决定
      - 电子旅行授权
      - 签证欺诈筛查
    out_of_scope:
      - 货物海关和贸易合规（由海关与贸易合规管理覆盖）
    source_hash: sha256-4e42a4e300e143ab
  BC-3300.10.10:
    name: 签证申请处理
    description: |
      跨各类别接收、验证和处理签证申请。
    source_hash: sha256-9161685dea8ab952
  BC-3300.10.20:
    name: 签证决定
    description: |
      对签证申请作出决定，包括拒签和附加条件。
    source_hash: sha256-0e41eacb04d69b9d
  BC-3300.10.30:
    name: 电子旅行授权
    description: |
      签发和撤销ETA电子旅行授权。
    source_hash: sha256-823a67fb52b42180
  BC-3300.10.40:
    name: 签证欺诈筛查
    description: |
      对申请进行欺诈、证件篡改和身份证件异常筛查。
    source_hash: sha256-838588540021db2e
  BC-3300.20:
    name: 边境检查与入境
    description: |
      在口岸对旅行者开展一线和二线检查与入境处理。
    source_hash: sha256-5b9fb48fc72edd74
  BC-3300.20.10:
    name: 旅行者提前信息处理
    description: |
      在旅行者抵达前处理API和PNR数据。
    source_hash: sha256-4dcb106413f5db61
  BC-3300.20.20:
    name: 一线检查
    description: |
      在口岸开展一线检查，包括生物特征核验。
    source_hash: sha256-6d4a26621e7b49fb
  BC-3300.20.30:
    name: 二线检查
    description: |
      对需要进一步审查的旅行者开展二线检查。
    source_hash: sha256-0c4296aed0f218d8
  BC-3300.20.40:
    name: 入境与拒绝入境决定
    description: |
      对入境、拒绝入境和入境条件作出决定。
    source_hash: sha256-8c03de2845243261
  BC-3300.30:
    name: 庇护与难民身份认定
    description: |
      依据1951年《难民公约》和国家保护制度，接收、审查和认定庇护申请。
    source_hash: sha256-8862f4c63aab8dad
  BC-3300.30.10:
    name: 庇护申请接收
    description: |
      在边境和国内接收和登记庇护申请。
    source_hash: sha256-8815f7a34f433401
  BC-3300.30.20:
    name: 难民身份认定
    description: |
      依据1951年《公约》和补充保护规定裁定难民身份。
    source_hash: sha256-859644903629a3c3
  BC-3300.30.30:
    name: 庇护接待与支援协调
    description: |
      协调庇护申请人的接待、住宿和基本生活支援。
    source_hash: sha256-afd1e21d4efae7fc
  BC-3300.30.40:
    name: 安置与人道主义通道
    description: |
      运营安置和人道主义入境项目。
    source_hash: sha256-4add652d464bed79
  BC-3300.40:
    name: 移民身份与居留管理
    description: |
      管理国内移民身份，包括居留许可、工作授权和家庭团聚案件。
    source_hash: sha256-9180a44f221060f5
  BC-3300.40.10:
    name: 居留许可管理
    description: |
      签发和续期居留许可及生物特征居留卡。
    source_hash: sha256-d1edcd8e7806ac78
  BC-3300.40.20:
    name: 工作授权管理
    description: |
      管理工作许可证、担保人执照和劳动力市场测试。
    source_hash: sha256-c54c37b4cf4512a3
  BC-3300.40.30:
    name: 家庭团聚处理
    description: |
      处理家庭团聚和随行人员申请。
    source_hash: sha256-ad6d850a6c1be6d9
  BC-3300.40.40:
    name: 身份合规监控
    description: |
      监控移民条件合规情况和身份变化。
    source_hash: sha256-f099477e81429973
  BC-3300.50:
    name: 入籍与公民身份管理
    description: |
      裁定入籍申请、血统或注册取得公民身份以及公民身份剥夺案件。
    source_hash: sha256-0bbf1df0593f0f98
  BC-3300.50.10:
    name: 入籍申请处理
    description: |
      处理入籍申请和品行评估。
    source_hash: sha256-a2295656f809595f
  BC-3300.50.20:
    name: 血统与注册取得公民身份
    description: |
      认定血统取得、注册取得和收养取得公民身份。
    source_hash: sha256-266e4594d1328a99
  BC-3300.50.30:
    name: 入籍仪式与宣誓管理
    description: |
      管理入籍仪式和效忠宣誓。
    source_hash: sha256-bbbdcb7fecf4cd4f
  BC-3300.50.40:
    name: 公民身份剥夺处理
    description: |
      裁定公民身份剥夺、放弃和撤销案件。
    source_hash: sha256-850bc9a2fdc509b4
  BC-3300.60:
    name: 遣返与拘留管理
    description: |
      对无移民身份人员开展拘留、遣返和自愿遣返运营。
    source_hash: sha256-6c411b9ed0c9d374
  BC-3300.60.10:
    name: 移民拘留运营
    description: |
      运营移民拘留设施并维护福利标准。
    source_hash: sha256-fd9eaa7fdaffbf93
  BC-3300.60.20:
    name: 遣返令执行
    description: |
      执行驱逐出境和遣返令，包括押送遣返。
    source_hash: sha256-a660bc60d0c3c6b7
  BC-3300.60.30:
    name: 自愿遣返项目运营
    description: |
      协调辅助自愿遣返和重新融入项目。
    source_hash: sha256-38de234c2eb2fa82
