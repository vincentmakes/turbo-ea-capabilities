kind: business-process
locale: zh
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG到披露"
    description: "可持续发展报告循环,涵盖ESG战略与重要性、数据采集、数据质量与鉴证、报告与披露、利益相关者互动以及改进目标。每个BP2对应VS-200的一个stage_name。"
    source_hash: sha256-66d60ef4b72a8d5f
  BP-1130.10:
    name: "ESG战略与重要性"
    description: "设定ESG雄心并执行双重重要性评估,聚焦于真正重要的议题。"
    source_hash: sha256-59d591c8d59454a6
  BP-1130.10.10:
    name: "设定ESG雄心"
    description: "设定ESG雄心并与企业战略关联;承诺净零、社会和治理目标。"
    source_hash: sha256-5fa74157442208e6
  BP-1130.10.20:
    name: "执行双重重要性评估"
    description: "执行双重重要性评估以识别重大议题——财务重要性与影响重要性。"
    source_hash: sha256-4c2d2749ad94da76
  BP-1130.20:
    name: "数据采集"
    description: "在价值链范围内采集ESG数据——排放、能源、水、废弃物、社会、治理。"
    source_hash: sha256-0c21f34aa6281b15
  BP-1130.20.10:
    name: "采集环境数据"
    description: "从运营中采集排放(范围1/2/3)、能源、水、废弃物、生物多样性和污染数据。"
    source_hash: sha256-b7ce2922da1bda78
  BP-1130.20.20:
    name: "采集社会数据"
    description: "依据重大议题采集员工、健康与安全、多元化、社区和人权数据。"
    source_hash: sha256-4e7113198459286a
  BP-1130.20.30:
    name: "采集治理数据"
    description: "采集治理数据——董事会构成、伦理、反贿赂、高管薪酬、供应商行为。"
    source_hash: sha256-e6cf111543dc7f20
  BP-1130.20.40:
    name: "采集价值链数据"
    description: "采集上游和下游价值链数据——供应商排放、产品使用阶段、寿命终结。"
    source_hash: sha256-0af74fa019d57c4d
  BP-1130.30:
    name: "数据质量与鉴证"
    description: "对ESG数据执行数据质量控制并取得对披露数据的外部鉴证。"
    source_hash: sha256-f9693fa74569cc51
  BP-1130.30.10:
    name: "执行ESG数据质量控制"
    description: "对ESG数据执行完整性、准确性、一致性和可追溯性控制。"
    source_hash: sha256-7017be162f9deabf
  BP-1130.30.20:
    name: "取得外部鉴证"
    description: "依据适用准则聘请鉴证机构对披露指标提供有限或合理鉴证。"
    source_hash: sha256-5f0c5838aacf550a
  BP-1130.40:
    name: "报告与披露"
    description: "产出ESG报告与监管披露——CSRD/ESRS、SEC气候、GRI、SASB、TCFD、ISSB。"
    source_hash: sha256-2d52a82565566693
  BP-1130.40.10:
    name: "构建ESG披露包"
    description: "构建ESG披露包——叙事、指标、附注、与各准则的映射。"
    source_hash: sha256-83bb85f5f8360240
  BP-1130.40.20:
    name: "申报监管披露"
    description: "申报强制ESG/可持续发展披露——CSRD/ESRS、SEC气候、司法管辖区分类法。"
    source_hash: sha256-7c0fab2067dbeb32
  BP-1130.40.30:
    name: "发布自愿性框架"
    description: "依据重大议题发布自愿性披露——GRI、SASB、TCFD、CDP、ISSB。"
    source_hash: sha256-bd460ef4e53b9bd9
  BP-1130.50:
    name: "利益相关者互动"
    description: "就ESG与利益相关者互动——投资者、监管机构、客户、员工、NGO、社区。"
    source_hash: sha256-b4049d33409ffab1
  BP-1130.50.10:
    name: "与投资者及分析师互动"
    description: "与关注ESG的投资者及评级机构互动;响应问卷与评级。"
    source_hash: sha256-8756d4ffe0961ddf
  BP-1130.50.20:
    name: "与社区及NGO互动"
    description: "就影响和补救与本地社区、NGO和公民社会利益相关者互动。"
    source_hash: sha256-263f7bd55b5594a0
  BP-1130.60:
    name: "改进目标"
    description: "在视野内设定、跟踪并调整改进目标——排放、社会、治理。"
    source_hash: sha256-06b57ef8ea29fa2b
  BP-1130.60.10:
    name: "设定改进目标"
    description: "设定与雄心和重大议题对齐的科学目标(SBTi)及其他ESG改进目标。"
    source_hash: sha256-539bdc8cfd82ce5e
  BP-1130.60.20:
    name: "跟踪目标进展"
    description: "在ESG周期内跟踪目标进展;浮现差距并决定纠正措施。"
    source_hash: sha256-2286ebfa082ad915
