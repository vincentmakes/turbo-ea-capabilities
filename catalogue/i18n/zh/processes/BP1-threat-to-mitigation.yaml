kind: business-process
locale: zh
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "威胁到缓解"
    description: "网络安全运营循环,涵盖安全态势定义、威胁情报、漏洞发现、检测、事件响应、身份与访问加固以及意识培训。每个BP2对应VS-600的一个stage_name。"
  BP-1150.10:
    name: "安全态势定义"
    description: "为企业定义安全态势、控制基线和目标成熟度。"
  BP-1150.10.10:
    name: "定义安全战略"
    description: "定义网络安全战略——风险偏好、目标成熟度、框架(NIST CSF、ISO 27001)。"
  BP-1150.10.20:
    name: "设定控制基线"
    description: "为企业设定控制基线;与控制框架及适用法规对齐。"
  BP-1150.20:
    name: "威胁情报"
    description: "采集、分析并向防御者和决策者分发威胁情报。"
  BP-1150.20.10:
    name: "采集威胁情报"
    description: "从内部传感器、ISAC订阅源、供应商和OSINT采集威胁情报。"
  BP-1150.20.20:
    name: "分析并分发情报"
    description: "对情报进行相关性分析并落地——IOC、Hunt假设、简报。"
  BP-1150.30:
    name: "漏洞发现"
    description: "通过扫描、渗透测试、bug bounty、代码审查发现漏洞并推动整改。"
  BP-1150.30.10:
    name: "执行漏洞扫描"
    description: "对基础设施、应用和云工作负载执行持续漏洞扫描。"
  BP-1150.30.20:
    name: "执行渗透测试"
    description: "执行周期性和事件驱动的渗透测试;采集可利用发现及整改建议。"
  BP-1150.30.30:
    name: "推动漏洞整改"
    description: "依据可利用性和资产关键性排序漏洞;对照SLA跟踪整改。"
  BP-1150.40:
    name: "检测"
    description: "通过监控、分析、威胁狩猎(Hunt)和行为基线检测安全事件。"
  BP-1150.40.10:
    name: "运行安全监控"
    description: "运行SOC——SIEM、EDR、XDR、网络检测——以7×24监控安全事件。"
  BP-1150.40.20:
    name: "分诊并调查告警"
    description: "分诊并调查告警;升级已确认事件;关闭误报。"
  BP-1150.40.30:
    name: "狩猎威胁"
    description: "依据情报和新兴TTP衍生的假设执行主动威胁狩猎(Hunt)。"
  BP-1150.50:
    name: "事件响应"
    description: "响应已确认的安全事件——遏制、根除、恢复并萃取经验。"
  BP-1150.50.10:
    name: "遏制事件"
    description: "遏制事件——隔离受影响系统、撤销凭证、阻断流量——以阻止扩散。"
  BP-1150.50.20:
    name: "根除威胁"
    description: "根除威胁——清除恶意软件、修补漏洞、关闭持久化机制。"
  BP-1150.50.30:
    name: "恢复运营"
    description: "将受影响系统和运营恢复至已知良好状态;返回服务前予以验证。"
  BP-1150.50.40:
    name: "通报与报告"
    description: "依据数据泄露通知义务和协议,向监管机构、客户及受影响方进行通报。"
  BP-1150.60:
    name: "身份与访问加固"
    description: "加固身份与访问——IAM、MFA、特权访问——以阻断基于身份的攻击路径。"
  BP-1150.60.10:
    name: "管理身份生命周期"
    description: "管理员工、合同工和机器身份的生命周期——开通、角色变更、撤销。"
  BP-1150.60.20:
    name: "强制认证控制"
    description: "在所有访问路径上强制MFA、条件访问和基于风险的认证。"
  BP-1150.60.30:
    name: "治理特权访问"
    description: "治理特权访问——保险库、即时(JIT)提权、会话监控、周期性重新认证。"
  BP-1150.70:
    name: "意识培训与经验萃取"
    description: "面向员工运行安全意识培训;从事件和演练中萃取经验。"
  BP-1150.70.10:
    name: "运行安全意识培训"
    description: "运行安全意识培训、钓鱼模拟和角色定向培训。"
  BP-1150.70.20:
    name: "采集并应用经验"
    description: "从事件、演练和泄露报告中采集经验;应用至控制、培训和runbook。"
