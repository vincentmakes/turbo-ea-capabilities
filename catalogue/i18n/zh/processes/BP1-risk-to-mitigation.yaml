kind: business-process
locale: zh
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "风险到缓解"
    description: "企业风险管理循环,涵盖风险偏好框定、风险识别、评估、处置、监控和报告。每个BP2对应VS-500的一个stage_name。"
  BP-1110.10:
    name: "风险偏好与框架"
    description: "设定风险偏好与容忍度;依据COSO ERM和ISO 31000定义企业风险管理框架、分类法和治理。"
  BP-1110.10.10:
    name: "设定风险偏好"
    description: "按风险类别设定企业风险偏好声明和容忍阈值;经董事会批准。"
  BP-1110.10.20:
    name: "定义风险框架"
    description: "在COSO ERM和ISO 31000下定义ERM框架——分类法、治理论坛、角色、生命周期。"
  BP-1110.20:
    name: "风险识别"
    description: "识别跨战略、运营、财务、监管和新兴领域的企业风险。"
  BP-1110.20.10:
    name: "执行风险工作坊"
    description: "与所有人和SME执行结构化工作坊以浮现业务中的风险。"
  BP-1110.20.20:
    name: "扫描外部风险"
    description: "扫描外部来源——监管、市场、地缘政治、环境——寻找新兴风险信号。"
  BP-1110.20.30:
    name: "捕获风险清单"
    description: "将已识别风险持久化至企业风险登记册,附上所有人、类别和初步评估。"
  BP-1110.30:
    name: "风险评估"
    description: "评估已识别风险的可能性、影响和速度;评定固有风险与残余风险。"
  BP-1110.30.10:
    name: "对可能性与影响打分"
    description: "依据框架使用定性和定量方法对每个风险的可能性和影响打分。"
  BP-1110.30.20:
    name: "评定固有与残余风险"
    description: "计算固有风险评级,考虑现有控制后得出残余风险评级。"
  BP-1110.30.30:
    name: "排序风险"
    description: "依据残余评级、偏好和战略相关性,为处置排序风险。"
  BP-1110.40:
    name: "处置与控制设计"
    description: "决定处置——接受、规避、缓解、转移——并设计或强化控制。"
  BP-1110.40.10:
    name: "决定风险处置"
    description: "为每个风险决定处置——接受、规避、缓解、转移(保险、合同、对冲)。"
  BP-1110.40.20:
    name: "设计控制"
    description: "设计或强化控制——预防性、检测性、纠正性——以将残余风险降至偏好之内。"
  BP-1110.40.30:
    name: "实施处置计划"
    description: "实施处置计划;分配责任人、截止日期和验证证据。"
  BP-1110.50:
    name: "监控"
    description: "监控风险与控制——KRI跟踪、控制测试、事件模式监控。"
  BP-1110.50.10:
    name: "跟踪关键风险指标"
    description: "跟踪KRI和新兴风险信号;触发阈值与升级路径。"
  BP-1110.50.20:
    name: "测试控制"
    description: "测试控制的设计有效性和运行有效性;评定例外;推动整改。"
  BP-1110.50.30:
    name: "监控事件模式"
    description: "监控事故、未遂事件和损失事件模式;据此优化风险与控制视图。"
  BP-1110.60:
    name: "报告与升级"
    description: "向执行论坛、董事会和监管机构报告企业风险;升级偏好突破。"
  BP-1110.60.10:
    name: "产出风险报告"
    description: "产出周期性企业风险报告——dashboard、热力图、顶级风险叙述。"
  BP-1110.60.20:
    name: "向执行层与董事会汇报"
    description: "向执行风险委员会和董事会风险委员会汇报;采集决策与方向。"
  BP-1110.60.30:
    name: "升级偏好突破"
    description: "依据协议升级偏好突破和高速度事件;必要时通知监管机构。"
