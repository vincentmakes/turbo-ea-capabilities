kind: business-process
locale: zh
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "入职到离职"
    description: "端到端的员工生命周期,涵盖人力规划、招聘寻源、甄选、入职、绩效与发展、薪酬福利管理、员工体验、内部流动以及离职。每个BP2对应VS-280的一个stage_name。"
    source_hash: sha256-09ffdeb0d20eb666
  BP-1020.10:
    name: "人力规划"
    description: "依据战略与现有供给预测人力需求,识别技能缺口,并规划填补缺口所需的招聘、流动和退出动作。"
    source_hash: sha256-8ee05419330812e0
  BP-1020.10.10:
    name: "预测人力需求"
    description: "将业务计划按团队、岗位和时间维度转化为人头数、技能和产能需求。"
    source_hash: sha256-b13cd46fc052b75b
  BP-1020.10.20:
    name: "评估人力供给"
    description: "盘点现有员工、合同工和待定调动;对照需求评估技能,识别缺口与盈余。"
    source_hash: sha256-9aa3173db35ae515
  BP-1020.10.30:
    name: "构建人力规划"
    description: "设计整合方案——招聘、培养、再部署、退出——以填补缺口;在预算和审批下安排动作时序。"
    source_hash: sha256-05868c274352d2bf
  BP-1020.20:
    name: "招聘寻源与吸引"
    description: "通过雇主品牌、寻源渠道和直接触达识别并吸引候选人。"
    source_hash: sha256-c9f25567ef00b334
  BP-1020.20.10:
    name: "构建雇主品牌"
    description: "明确雇主品牌价值主张及在各渠道使用的传播信息,以吸引目标人才群体。"
    source_hash: sha256-301153251b07415f
  BP-1020.20.20:
    name: "寻源候选人"
    description: "在招聘网站、社交平台、推荐、机构及主动触达等渠道开展寻源;持久化至ATS。"
    source_hash: sha256-d2e9732fbea74c90
  BP-1020.20.30:
    name: "管理人才社区"
    description: "在人才储备池和社区中维护候选人关系,服务于常青岗位与人才管线。"
    source_hash: sha256-0d81fb41f934c50b
  BP-1020.30:
    name: "甄选与录用"
    description: "筛选、评估、面试并选定候选人;执行入职前背景调查;发出并接受Offer。"
    source_hash: sha256-05bfafa6ba03c777
  BP-1020.30.10:
    name: "筛选并入围候选人"
    description: "对收到的申请应用筛选标准;基于契合度与资质入围面试。"
    source_hash: sha256-cb5a307727a052bc
  BP-1020.30.20:
    name: "开展评估与面试"
    description: "执行结构化面试与技能测评;汇总评估人反馈形成录用决策。"
    source_hash: sha256-3d521eea12b26cfa
  BP-1020.30.30:
    name: "执行入职前背景调查"
    description: "依据司法管辖区和岗位风险要求执行背景调查、推荐人核实和工作权调查。"
    source_hash: sha256-19a67bb8129a9e6a
  BP-1020.30.40:
    name: "发出并谈判Offer"
    description: "构建Offer(薪酬、股权、入职日期),与候选人谈判并采集接受确认。"
    source_hash: sha256-761e6d7b309b32d4
  BP-1020.30.50:
    name: "录用员工"
    description: "签署劳动合同,在HRIS中建立员工记录,并触发下游入职(Onboarding)工作流。"
    source_hash: sha256-d80a4476cf0e5849
  BP-1020.40:
    name: "入职"
    description: "将新员工引入组织——欢迎、文档、设备、培训和融入。"
    source_hash: sha256-f60d0cdc7e828a78
  BP-1020.40.10:
    name: "配置设备与权限"
    description: "在入职第一天前发放笔记本电脑、门禁、系统凭证及任何岗位专用设备。"
    source_hash: sha256-7c434b47b861c4de
  BP-1020.40.20:
    name: "完成入职文档"
    description: "采集法定新员工文档——税务表、福利登记、政策确认——以满足合规要求。"
    source_hash: sha256-ddbf6f961bce99c1
  BP-1020.40.30:
    name: "交付入职项目"
    description: "在前30/60/90天内执行结构化的入职旅程——岗前介绍、岗位培训、经理沟通会。"
    source_hash: sha256-ee4ee7e3818020aa
  BP-1020.40.40:
    name: "确认入职完成"
    description: "验证新员工已完成所有必需的入职里程碑且已完全胜任岗位。"
    source_hash: sha256-0341b621099346a9
  BP-1020.50:
    name: "绩效与发展"
    description: "设定目标、提供反馈、运行正式评估、识别发展需求,并交付学习与教练。"
    source_hash: sha256-7f4f873f09922c08
  BP-1020.50.10:
    name: "设定绩效目标"
    description: "在周期开始时将业务目标分解为个人目标;与团队和职能优先事项对齐。"
    source_hash: sha256-6d6c3da452126277
  BP-1020.50.20:
    name: "提供持续反馈"
    description: "在整个周期内由经理与员工开展定期1对1及持续反馈对话。"
    source_hash: sha256-108b0046db668289
  BP-1020.50.30:
    name: "执行绩效评估"
    description: "执行正式周期评估——自评、经理评估、校准——以确定评级与结果。"
    source_hash: sha256-672da1819702f401
  BP-1020.50.40:
    name: "识别发展需求"
    description: "识别相对当前及未来岗位的能力缺口;在发展计划中记录并关联学习干预。"
    source_hash: sha256-0c9679c589077ab9
  BP-1020.50.50:
    name: "交付学习与教练"
    description: "执行学习项目、在岗教练、导师制及基于任务的发展;跟踪完成情况与影响。"
    source_hash: sha256-45e4c4dda86fdd30
  BP-1020.60:
    name: "薪酬与福利管理"
    description: "在生命周期中管理基本薪酬、可变薪酬、股权和福利;运行调薪并对接薪资发放。"
    source_hash: sha256-ed60011d8ab65f0e
  BP-1020.60.10:
    name: "管理基本与可变薪酬"
    description: "维护薪等、个人薪资水平及可变薪酬计划;在晋升、调岗或薪资变更时触发薪资更新。"
    source_hash: sha256-c45df0159b0099aa
  BP-1020.60.20:
    name: "执行调薪周期"
    description: "执行年度或非周期调薪流程;应用预算指引、经理建议和审批。"
    source_hash: sha256-c01fd88d6f4da442
  BP-1020.60.30:
    name: "管理福利登记"
    description: "执行公开登记和合格事件登记的健康、退休及其他福利;与承保方数据对账。"
    source_hash: sha256-09055d65dc34c179
  BP-1020.60.40:
    name: "管理股权计划"
    description: "依据计划规则授予、归属并行权股权;与财务、法务及股权经纪商协同。"
    source_hash: sha256-31daf9cd9c81ea58
  BP-1020.70:
    name: "员工体验与敬业度"
    description: "运行敬业度项目、员工心声调研、表彰、健康关怀及更广泛的员工体验。"
    source_hash: sha256-f0e69b4282464c4a
  BP-1020.70.10:
    name: "执行敬业度调研"
    description: "执行周期性及脉动敬业度调研;按团队、群体和趋势分析结果。"
    source_hash: sha256-78f0d2806028c8ed
  BP-1020.70.20:
    name: "依据员工反馈采取行动"
    description: "将调研洞察转化为团队级和企业级行动计划;跟踪落实情况。"
    source_hash: sha256-952715be78e361e8
  BP-1020.70.30:
    name: "运行表彰项目"
    description: "运行同事间及经理表彰项目;跟踪参与度及对敬业度的影响。"
    source_hash: sha256-2f1b11504ae2ac03
  BP-1020.70.40:
    name: "支持员工健康关怀"
    description: "运行健康关怀项目——EAP、心理健康、财务健康、人体工学——并响应升级事项。"
    source_hash: sha256-04c0e83acf6247b0
  BP-1020.80:
    name: "内部流动与职业发展"
    description: "运行内部岗位市场、继任者规划及职业路径管理。"
    source_hash: sha256-993c916a1d85bec6
  BP-1020.80.10:
    name: "运行内部岗位市场"
    description: "发布内部岗位、管理内部申请并对内部候选人开展面试。"
    source_hash: sha256-43393d28f6a60618
  BP-1020.80.20:
    name: "执行继任者规划"
    description: "为关键岗位识别继任者,评估准备度,并制定填补缺口的发展动作。"
    source_hash: sha256-1fdfca6245f60e37
  BP-1020.80.30:
    name: "管理职业路径"
    description: "维护职业路径框架、岗位晋级标准及面向经理与员工的内部流动指引。"
    source_hash: sha256-dfdd52489ff5725d
  BP-1020.90:
    name: "离职与校友"
    description: "管理员工离职——主动、被动、退休——并运行校友项目。"
    source_hash: sha256-22e8c08197f922e3
  BP-1020.90.10:
    name: "处理辞职或解聘"
    description: "通过离职工作流采集并处理离职——辞职、解聘、裁员、退休。"
    source_hash: sha256-a125a10cab774080
  BP-1020.90.20:
    name: "执行离职面谈"
    description: "执行离职面谈以采集学习与反馈;融入敬业度与留任洞察。"
    source_hash: sha256-e9c23ee30af51824
  BP-1020.90.30:
    name: "回收设备与权限"
    description: "在最后工作日回收笔记本电脑、工卡、系统凭证及任何岗位专用设备。"
    source_hash: sha256-4c346ccd2649f029
  BP-1020.90.40:
    name: "运行校友网络"
    description: "维护校友网络以服务于回聘、推荐和社区;周期性运行互动活动。"
    source_hash: sha256-d66212468362c119
