kind: business-process
locale: zh
source: BP1-acquire-to-retire.yaml
entries:
  BP-1090:
    name: "购置到退役"
    description: "端到端的实物资产生命周期,涵盖需求与论证、购置、调试、运行与维护、风险与可靠性、资产信息维护以及退役。每个BP2对应VS-10的一个stage_name。"
    source_hash: sha256-e62b5deb624ae388
  BP-1090.10:
    name: "资产需求与论证"
    description: "识别资产需求、论证资本投入并在采购启动前批准该资产。"
    source_hash: sha256-12ac5e53e1eac73a
  BP-1090.10.10:
    name: "识别资产需求"
    description: "采集对新资产或替换资产的业务需求;收集技术和运营背景信息。"
    source_hash: sha256-0ba6e8034def920a
  BP-1090.10.20:
    name: "构建资本论证"
    description: "构建商业论证——总体拥有成本、NPV、敏感性分析——并取得资本审批。"
    source_hash: sha256-e5a5098d98246214
  BP-1090.10.30:
    name: "审批资产计划"
    description: "通过资本审批委员会路由;记录条件并关联到组合。"
    source_hash: sha256-54bb4cd0abe633ef
  BP-1090.20:
    name: "购置"
    description: "寻源、设计或定规、采购并接受资产交付。"
    source_hash: sha256-8a2af9b2f027187d
  BP-1090.20.10:
    name: "明确资产规格"
    description: "将需求转化为资产规格——产能、性能、合规、生命周期要求。"
    source_hash: sha256-ee95f91c13836728
  BP-1090.20.20:
    name: "采购资产"
    description: "执行寻源、供应商选择和签约;下采购订单或工程合同。"
    source_hash: sha256-a89c0660f830a179
  BP-1090.20.30:
    name: "接受资产交付"
    description: "对照规格接收、检验并正式接受资产。"
    source_hash: sha256-f3cbe16302a78266
  BP-1090.30:
    name: "调试与资本化"
    description: "安装、测试并调试资产;在账上完成资本化。"
    source_hash: sha256-f9c452c0a5eaced6
  BP-1090.30.10:
    name: "安装并调试资产"
    description: "安装、通电并执行调试测试;通过后移交至运营。"
    source_hash: sha256-42048155b77cddc0
  BP-1090.30.20:
    name: "资本化资产"
    description: "在固定资产台账中以正确的类别、折旧方法和使用寿命资本化该资产。"
    source_hash: sha256-cd17f71e2989fdf0
  BP-1090.40:
    name: "运行与维护"
    description: "在使用寿命内运行资产并执行预防性、纠正性和基于状态的维护。"
    source_hash: sha256-855e61ee20a48fef
  BP-1090.40.10:
    name: "运行资产"
    description: "依据设计参数执行日常资产运行;采集运行数据。"
    source_hash: sha256-6e004e72b3b6da7a
  BP-1090.40.20:
    name: "规划并安排维护"
    description: "规划预防性、预测性和基于状态的维护;依据运营和资源可用性安排时序。"
    source_hash: sha256-be9c73f890d79d9c
  BP-1090.40.30:
    name: "执行维护"
    description: "执行维护工作——预防性、纠正性、停机检修——并确认资产已恢复使用。"
    source_hash: sha256-7a96a98afd74f07d
  BP-1090.50:
    name: "风险与可靠性"
    description: "在运行寿命内管理资产完整性、可靠性和运营安全风险。"
    source_hash: sha256-2f4c073ebb07c42c
  BP-1090.50.10:
    name: "评估资产风险"
    description: "执行关键性与风险评估——失效模式、后果、可能性——以驱动维护与完整性项目。"
    source_hash: sha256-8b4ead978114ab1b
  BP-1090.50.20:
    name: "管理资产完整性"
    description: "执行检查、测试和腐蚀管理项目以在生命周期内维持完整性。"
    source_hash: sha256-486b8e28b1e5901c
  BP-1090.50.30:
    name: "提升资产可靠性"
    description: "推动可靠性提升——对慢性故障执行根因分析、RAM建模、设计变更建议。"
    source_hash: sha256-df0f5b75748e9dc9
  BP-1090.60:
    name: "资产信息维护"
    description: "在生命周期内维护资产主数据、图纸、配置和文档。"
    source_hash: sha256-02e2536216d99c0f
  BP-1090.60.10:
    name: "维护资产主数据"
    description: "在资产台账中维护资产主数据——类别、位置、父子关系、属性。"
    source_hash: sha256-769c671bf8c0ccfd
  BP-1090.60.20:
    name: "维护资产文档"
    description: "维护图纸、手册、P&ID、证书和竣工文档;与工程变更对齐。"
    source_hash: sha256-7fe4c2b4f307119b
  BP-1090.70:
    name: "退役与处置"
    description: "规划并执行寿命终结——退役、处置、复原和最终会计处理。"
    source_hash: sha256-8f5f32685fcc7a93
  BP-1090.70.10:
    name: "规划退役"
    description: "规划寿命终结——时序、环境义务、移除、复原、财务影响。"
    source_hash: sha256-6cec6f5bc4b6a2d0
  BP-1090.70.20:
    name: "执行退役"
    description: "退役、拆除并移除资产;管理危险物料处置和场地复原。"
    source_hash: sha256-ba0de4c3142fd086
  BP-1090.70.30:
    name: "处置或出售资产"
    description: "处置、回收或出售资产;捕获残值和监管链信息。"
    source_hash: sha256-ac9cbf74dc190003
