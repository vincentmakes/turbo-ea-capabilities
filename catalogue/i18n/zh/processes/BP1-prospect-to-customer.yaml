kind: business-process
locale: zh
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "潜客到客户"
    description: "端到端的客户获取循环,涵盖市场与细分战略、品牌、需求生成、线索捕获、转化、入职(Onboarding)以及持续的留存与倡导。每个BP2对应VS-440的一个stage_name。"
    source_hash: sha256-93500f1974f9bc3b
  BP-1050.10:
    name: "市场与细分战略"
    description: "定义目标市场与客户细分,并将GTM优先级与最具胜出权的领域对齐。"
    source_hash: sha256-affbbf0ef7d77300
  BP-1050.10.10:
    name: "分析市场格局"
    description: "测算市场规模、刻画竞争对手画像并浮现塑造需求与获取战略的趋势。"
    source_hash: sha256-44620ac30ced91a3
  BP-1050.10.20:
    name: "定义目标细分"
    description: "基于需求、契合度和胜出权,定义并优先排序目标客户细分。"
    source_hash: sha256-f063a341ea447f3b
  BP-1050.10.30:
    name: "设定获取优先级"
    description: "将细分优先级转化为规划周期内的获取目标——客户、地区、渠道。"
    source_hash: sha256-22780eafb5cef487
  BP-1050.20:
    name: "品牌与定位"
    description: "建设并管理品牌、定位及在所有获取渠道使用的信息体系。"
    source_hash: sha256-3ee43aa33df82837
  BP-1050.20.10:
    name: "制定品牌战略"
    description: "定义品牌承诺、个性、架构和视觉识别;在各市场与细分中保持对齐。"
    source_hash: sha256-7651aec340f759c2
  BP-1050.20.20:
    name: "制定定位与信息"
    description: "为每个细分和产品制定定位与信息;以一致叙事赋能营销活动与销售。"
    source_hash: sha256-493dde1c09daa73b
  BP-1050.20.30:
    name: "管理品牌资产"
    description: "维护品牌指南,管理品牌使用审批,并治理在市场中的视觉与口头识别。"
    source_hash: sha256-ad30bd57517a4650
  BP-1050.30:
    name: "需求生成"
    description: "通过付费、自有、赢得和合作伙伴渠道大规模生成认知与需求。"
    source_hash: sha256-c2a538e9bf3ed99e
  BP-1050.30.10:
    name: "规划需求生成活动"
    description: "按细分、渠道和产品规划营销活动;分配预算;设定线索与管线目标。"
    source_hash: sha256-0e7bc3c21de36a17
  BP-1050.30.20:
    name: "执行多渠道营销活动"
    description: "执行付费、自有、赢得和合作伙伴营销活动;管理创意、落地页和优惠。"
    source_hash: sha256-95e0e1eccc5507c7
  BP-1050.30.30:
    name: "衡量活动绩效"
    description: "按活动和渠道衡量触达、响应和管线影响;迭代创意与投放。"
    source_hash: sha256-ded149ab6943e5a3
  BP-1050.40:
    name: "线索捕获与培育"
    description: "捕获入站兴趣,丰富并评分线索,培育至销售就绪状态。"
    source_hash: sha256-afcfc963e76608d6
  BP-1050.40.10:
    name: "捕获入站线索"
    description: "通过表单、活动、合作伙伴推荐及入站渠道将线索捕获至营销自动化平台。"
    source_hash: sha256-48d12c0c6fcc3640
  BP-1050.40.20:
    name: "丰富并评分线索"
    description: "用企业属性和行为数据丰富线索;基于契合度与意向评分以识别销售就绪线索。"
    source_hash: sha256-4de63882bcf6a017
  BP-1050.40.30:
    name: "培育线索"
    description: "运行培育项目——内容、滴灌活动、再营销——以推进线索至销售就绪状态。"
    source_hash: sha256-b46f3cbccd469a24
  BP-1050.40.40:
    name: "移交销售就绪线索"
    description: "将销售就绪线索路由至销售直接接洽;跟踪向商机的转化。"
    source_hash: sha256-b2707c9824fb2f78
  BP-1050.50:
    name: "转化"
    description: "通过销售接洽、试用和优惠将合格线索转化为首单或首次订阅。"
    source_hash: sha256-2804c90b69e13459
  BP-1050.50.10:
    name: "接洽潜客"
    description: "执行直接销售接洽、演示和试用,以建立客户信心并推进至决策。"
    source_hash: sha256-129f7034dbc8ff1b
  BP-1050.50.20:
    name: "应对买方异议"
    description: "通过证据与试用浮现并应对异议——价格、契合度、安全、集成。"
    source_hash: sha256-6feba148c9f6c9ff
  BP-1050.50.30:
    name: "提出并赢得首单"
    description: "构建首单方案,谈判条款,并捕获首单或首次订阅。"
    source_hash: sha256-f136feaecfeab56e
  BP-1050.50.40:
    name: "跟踪转化漏斗"
    description: "按细分、渠道和产品跟踪线索到客户的转化;持续迭代漏斗。"
    source_hash: sha256-995511608d3d6c95
  BP-1050.60:
    name: "客户入职"
    description: "对新客户进行入职(Onboarding)——开通、培训、成功规划——以加速价值实现时间。"
    source_hash: sha256-b0c9a08158552296
  BP-1050.60.10:
    name: "欢迎新客户"
    description: "执行欢迎体验——kick-off、指定联系人、成功计划——以设定预期与势能。"
    source_hash: sha256-676b4f99c985ba0d
  BP-1050.60.20:
    name: "为客户开通服务"
    description: "在交付系统中为客户开通——账户、权限、集成、数据迁移。"
    source_hash: sha256-68087a83d23150ba
  BP-1050.60.30:
    name: "培训客户用户"
    description: "对客户用户进行产品或服务培训;认证关键用户;记入成功计划里程碑。"
    source_hash: sha256-2ffb520c607d6641
  BP-1050.60.40:
    name: "确认价值实现时间"
    description: "验证客户已达成首次价值里程碑;采集用于留存评分。"
    source_hash: sha256-36760c034df79c39
  BP-1050.70:
    name: "留存与倡导"
    description: "留住客户,推动续约与扩展,并将推荐者转化为倡导者与参考客户。"
    source_hash: sha256-5e7532f7855a510e
  BP-1050.70.10:
    name: "执行客户健康度评分"
    description: "基于产品使用、互动和反馈信号对客户健康度评分;浮现高风险账户以介入。"
    source_hash: sha256-3d3607b0bd4bd7d2
  BP-1050.70.20:
    name: "推动续约与扩展"
    description: "执行续约动作并识别账户内的扩展机会——交叉销售、向上销售。"
    source_hash: sha256-6229d03ee763a6f1
  BP-1050.70.30:
    name: "培育倡导"
    description: "识别推荐者,采集参考客户、案例和证言;激活倡导项目。"
    source_hash: sha256-a60f0082731bb75f
