kind: business-process
locale: zh
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "战略到执行"
    description: "端到端的战略落地循环,涵盖战略制定、组合定义、项目集与项目搭建、交付与治理、变革采用以及收益实现。每个BP2对应VS-580的一个stage_name。"
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "战略制定"
    description: "制定企业战略——愿景、目标、选择以及为获胜所需的运营模式。"
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "明确战略方向"
    description: "明确愿景、使命、战略目标以及指导决策的原则。"
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "做出战略选择"
    description: "做出在哪里竞争、如何取胜的选择;在市场、细分、产品和能力间解决权衡。"
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "定义运营模式"
    description: "定义执行战略所需的运营模式——能力、组织、地点和合作伙伴。"
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "组合定义"
    description: "将战略转化为将交付既定结果的项目集与投资组合。"
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "识别组合投资"
    description: "识别将关闭战略缺口的候选投资;采集价值、成本、风险和依赖关系。"
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "排序组合"
    description: "依据价值、契合度、产能和风险排序投资;在各视野内构建整合组合。"
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "审批组合"
    description: "通过执行论坛审批并出资组合;触发项目集与项目搭建。"
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "项目集与项目搭建"
    description: "搭建项目集与项目,确立章程、治理、计划、团队和预算。"
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "立项项目集"
    description: "立项项目集——结果、范围、治理、发起人、问责、成功标准。"
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "规划项目集交付"
    description: "构建跨子项目的整合交付计划,含里程碑、依赖关系和资源配置。"
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "组建项目团队"
    description: "组建项目团队、确认角色、入职(Onboarding),并触发sprint或第零阶段工作。"
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "交付与治理"
    description: "依据计划交付项目集与项目;运行治理以浮现风险、决策变更并保障质量。"
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "执行项目工作"
    description: "依据所选交付方法(敏捷、瀑布、混合)执行项目工作——设计、构建、测试、交付。"
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "运行项目集治理"
    description: "在企业公司治理权限下运行指导委员会、决策论坛和质量门;浮现并解决风险、问题和变更。"
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "管理项目集风险与变更"
    description: "维护风险登记册和变更日志;通过治理缓释、升级并决策变更。"
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "变革采用"
    description: "推动最终用户对项目集所交付变更的采用——沟通、培训、支持、固化。"
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "规划变革采用"
    description: "构建变革采用计划——利益相关者地图、沟通、培训、支持、固化。"
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "沟通与培训"
    description: "依据变革采用计划面向受影响人群执行沟通与培训。"
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "支持采用"
    description: "提供hyper-care支持,浮现采用阻碍并执行强化活动。"
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "收益实现"
    description: "跟踪并兑现项目集承诺的战略收益;关闭项目集。"
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "跟踪收益指标"
    description: "对照基线和目标跟踪承诺收益——收入、成本、NPS、吞吐量。"
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "兑现收益"
    description: "将收益兑现到日常运营——嵌入预算、KPI和经营流程。"
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "结项项目集"
    description: "结项项目集——最终报告、经验教训、归档、团队释放;触发任何后续组合动作。"
    source_hash: sha256-25c19e1849fe48b3
