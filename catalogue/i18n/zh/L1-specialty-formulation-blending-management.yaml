locale: zh
source: L1-specialty-formulation-blending-management.yaml
entries:
  BC-4630:
    name: 特种配方与配混管理
    description: |
      开展特种化学品（包括涂料、粘合剂、农药制剂、润滑剂、表面活性剂和精细化学品）的配方设计、配混、复配、灌装和精整。
    source_hash: sha256-b72ac92073ef64bd
  BC-4630.10:
    name: 配方设计与开发
    description: |
      开展特种配方的规格制定、原材料选择、实验室规模试验和成本优化。
    source_hash: sha256-f83c33f26229a459
  BC-4630.10.10:
    name: 配方规格开发
    description: |
      根据应用目标开发配方规格。
    source_hash: sha256-70dcc713bd468a34
  BC-4630.10.20:
    name: 原材料选择
    description: |
      综合性能、成本和 HSE 因素选择原材料。
    source_hash: sha256-4624ba1e9cabb291
  BC-4630.10.30:
    name: 实验室规模配方试验
    description: |
      制备和表征候选配方的实验室规模试样。
    source_hash: sha256-05674325b0969cec
  BC-4630.10.40:
    name: 配方成本优化
    description: |
      在规格约束下优化配方成本。
    source_hash: sha256-2a5680f453fad184
  BC-4630.20:
    name: 配混与混合运营
    description: |
      操作液体、固体、乳液和分散体配混设备。
    source_hash: sha256-f5ad782e583f4a55
  BC-4630.20.10:
    name: 液体配混运营
    description: |
      开展液体化学品的储罐式和在线配混。
    source_hash: sha256-e350fef491528652
  BC-4630.20.20:
    name: 固体配混运营
    description: |
      开展固体配方的螺旋带、V 型锥和滚筒配混。
    source_hash: sha256-66f387ed87a83dfe
  BC-4630.20.30:
    name: 乳化运营
    description: |
      使用转子定子和高压均质机生产乳液。
    source_hash: sha256-244cfc476ac76ad6
  BC-4630.20.40:
    name: 分散与研磨运营
    description: |
      操作砂磨机、三辊研磨机和分散机。
    source_hash: sha256-876b4fbbd7dcdcb9
  BC-4630.30:
    name: 复合与挤出运营
    description: |
      开展聚合物复合、母料生产和特种中间体挤出。
    source_hash: sha256-7bb559828e17ae67
  BC-4630.30.10:
    name: 聚合物复合
    description: |
      将聚合物与填料、稳定剂和助剂进行复合。
    source_hash: sha256-0667d226cab4205f
  BC-4630.30.20:
    name: 母料生产
    description: |
      生产色母、助剂母料和功能性母料。
    source_hash: sha256-4f1dbe984b2ebaa4
  BC-4630.30.30:
    name: 挤出运营
    description: |
      操作单螺杆和双螺杆挤出生产线。
    source_hash: sha256-b709898b799bd4c3
  BC-4630.40:
    name: 灌装与包装运营
    description: |
      将特种产品灌装至散装、桶装、IBC、小包装和加压容器。
    source_hash: sha256-510308493a60941c
  BC-4630.40.10:
    name: 散装容器灌装
    description: |
      灌装散装公路、铁路和 ISO 集装箱。
    source_hash: sha256-c7863ddad2450af2
  BC-4630.40.20:
    name: 桶装与 IBC 灌装
    description: |
      灌装钢桶、塑料桶和中型散装容器（IBC）。
    source_hash: sha256-74ff77a238561143
  BC-4630.40.30:
    name: 小包装灌装
    description: |
      对瓶、桶和消费品包装进行高速灌装。
    source_hash: sha256-76242cf33cb50482
  BC-4630.40.40:
    name: 气雾剂与加压包装灌装
    description: |
      对气雾罐和加压容器进行灌装和封口。
    source_hash: sha256-fea8a2ad500f1740
  BC-4630.50:
    name: 配方性能测试
    description: |
      开展特种配方的应用性能、稳定性和对比测试。
    source_hash: sha256-419915f8e8134cd9
  BC-4630.50.10:
    name: 应用性能测试
    description: |
      在模拟最终使用条件下测试配方性能。
    source_hash: sha256-df76a94efe0e90fd
  BC-4630.50.20:
    name: 稳定性与货架寿命测试
    description: |
      开展实时和加速稳定性及货架寿命测试。
    source_hash: sha256-1d5d2baf27e92af5
  BC-4630.50.30:
    name: 对比基准测试
    description: |
      开展配方与竞品的并行对比基准测试。
    source_hash: sha256-e5f20dec195419a1
  BC-4630.60:
    name: 特种配方配方管理
    description: |
      开展多基地配方生产的主配方编制、版本控制和本地化。
    source_hash: sha256-d5d5738b1b2e7dd9
  BC-4630.60.10:
    name: 主配方维护
    description: |
      按照 ISA-88 规范编制和维护主配方。
    source_hash: sha256-e0a297720cc06f0d
  BC-4630.60.20:
    name: 配方版本控制
    description: |
      对配方在审批和修订周期中进行版本控制。
    source_hash: sha256-c9813b74a09386a0
  BC-4630.60.30:
    name: 配方本地化
    description: |
      针对场地特定设备对主配方进行本地化。
    source_hash: sha256-6177ae29cc586255
