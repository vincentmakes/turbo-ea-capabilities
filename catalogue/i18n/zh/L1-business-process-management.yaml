locale: zh
source: L1-business-process-management.yaml
entries:
  BC-930:
    name: 业务流程管理
    description: |
      作为受管资产类别,对端到端业务流程进行设计、建模、监控、挖掘、优化与治理的学科。将流程视为一等产物,独立于执行流程的业务运营领域。
    in_scope:
      - 流程分类、责任、生命周期与标准的治理
      - 流程发现、BPMN 建模、文档化与版本管理
      - 流程绩效 KPI、监控与符合性报告
      - 流程挖掘,包括事件日志获取、发现与一致性核查
      - 流程再设计、仿真与自动化机会识别
      - 跨工作流与 RPA 平台的自动化组合治理
      - 流程控制设计与职责分离建模
    out_of_scope:
      - 通过 Lean、Six Sigma 或 Kaizen 进行的改进项目交付(BC-720.50)
      - 各业务领域内的运营执行(订单、理赔、运输等)
      - RPA 机器人软件开发与平台工程(IT 交付能力)
      - IT 服务管理流程的执行(BC-700 系列 IT 能力)
      - 业务架构、能力与价值流建模(BC-170)
    source_hash: sha256-0652fb00b5eb7656
  BC-930.10:
    name: 流程架构与治理
    description: |
      规范流程组合的流程分类、责任模型、生命周期政策与编写标准。
    source_hash: sha256-7095e6f7ba0cd6d2
  BC-930.10.10:
    name: 流程分类管理
    description: |
      定义并维护企业的流程分类框架。
    source_hash: sha256-c73a863553027667
  BC-930.10.20:
    name: 流程责任分配
    description: |
      在整个流程组合中分配流程负责人、看护人与管理员。
    source_hash: sha256-09c3365b6f8c9bad
  BC-930.10.30:
    name: 流程生命周期政策
    description: |
      规定流程的引入、维护、退出与归档的政策。
    source_hash: sha256-2243cca49b379b88
  BC-930.10.40:
    name: 流程标准与约定
    description: |
      流程产物的建模符号、属性标准与评审约定。
    source_hash: sha256-90731d8df472ff96
  BC-930.20:
    name: 流程建模与文档化
    description: |
      流程模型及其支持文档的发现、编写、发布与版本控制。
    source_hash: sha256-1f9a41d45471f350
  BC-930.20.10:
    name: 流程发现与诉求收集
    description: |
      通过工作坊、访谈与观察捕获现状流程知识。
    source_hash: sha256-a7c3d01546333905
  BC-930.20.20:
    name: 流程模型编写
    description: |
      在建模工具中编写 BPMN 及同等流程模型。
    source_hash: sha256-841be1a65dd6c45e
  BC-930.20.30:
    name: 流程文档发布
    description: |
      面向运营受众发布流程文档。
    source_hash: sha256-18a095eba2017439
  BC-930.20.40:
    name: 流程模型版本管理
    description: |
      流程模型的版本控制、变更历史与审批工作流。
    source_hash: sha256-4dcce221d9996432
  BC-930.30:
    name: 流程绩效衡量
    description: |
      流程绩效与符合性的定义、监控与报告。
    source_hash: sha256-365abeeb7555a22d
  BC-930.30.10:
    name: 流程 KPI 定义
    description: |
      按流程定义周期时间、吞吐量、质量与成本等 KPI。
    source_hash: sha256-f5cbbea6ae20b4b3
  BC-930.30.20:
    name: 流程绩效监控
    description: |
      面向流程绩效目标的运营仪表板与告警。
    source_hash: sha256-81520d22a3dfaf73
  BC-930.30.30:
    name: 流程符合性报告
    description: |
      报告执行行为与建模目标流程的符合性。
    source_hash: sha256-c586b56d5b11d06d
  BC-930.40:
    name: 流程挖掘与发现
    description: |
      基于事件日志的流程发现、一致性核查与流程智能。
    source_hash: sha256-be0e48176653c027
  BC-930.40.10:
    name: 事件日志获取
    description: |
      从源系统抽取、转换并加载事件日志。
    source_hash: sha256-a176fd496efb0f9f
  BC-930.40.20:
    name: 流程发现分析
    description: |
      基于事件日志通过算法重建已执行的流程变体。
    source_hash: sha256-bb5d6f08ae7cbeac
  BC-930.40.30:
    name: 一致性核查
    description: |
      将已执行行为与参考模型及规则集进行比对。
    source_hash: sha256-2c8a9aafedeb101b
  BC-930.40.40:
    name: 流程智能报告
    description: |
      报告挖掘所得洞察,例如瓶颈、返工与变体影响。
    source_hash: sha256-1788a83e6680e4b8
  BC-930.50:
    name: 流程优化与再设计
    description: |
      基于数据的流程架构性再设计,包含仿真与自动化候选分析。区别于 BC-720.50 的改进项目交付。
    source_hash: sha256-04f7979530678035
  BC-930.50.10:
    name: 流程瓶颈分析
    description: |
      识别并量化流程变体中的约束点。
    source_hash: sha256-53ac0648c025549d
  BC-930.50.20:
    name: 流程仿真
    description: |
      对流程设计备选方案进行离散事件与蒙特卡洛仿真。
    source_hash: sha256-a5ea0f7269f8f12c
  BC-930.50.30:
    name: 目标流程设计
    description: |
      设计再设计后流程的流转、控制与交接。
    source_hash: sha256-8b2d41bf9d4f316f
  BC-930.50.40:
    name: 自动化机会识别
    description: |
      识别可通过工作流、RPA 或 AI 实现自动化的候选步骤。
    source_hash: sha256-0ce6366323bd54d7
  BC-930.60:
    name: 流程自动化治理
    description: |
      跨工作流、RPA 与智能自动化平台对自动化组合进行治理。不包括平台本身的工程与运维。
    source_hash: sha256-e39d402d6410d85b
  BC-930.60.10:
    name: 自动化组合管理
    description: |
      自动化资产的需求受理、优先排序与全生命周期管理。
    source_hash: sha256-5985925314b65a65
  BC-930.60.20:
    name: 工作流编排治理
    description: |
      面向跨业务系统编排式工作流流程的标准与控制。
    source_hash: sha256-64dd8a9a708b2c5c
  BC-930.60.30:
    name: RPA 计划治理
    description: |
      机器人流程自动化计划的治理,包括机器人责任归属。
    source_hash: sha256-019dfd4a0b768f38
  BC-930.60.40:
    name: 自动化控制与审计
    description: |
      面向自动化资产的控制框架、监控与审计轨迹。
    source_hash: sha256-cfc01924c2e18c84
  BC-930.70:
    name: 流程风险与控制管理
    description: |
      嵌入流程的风险与控制,包括职责分离。补充而非替代企业风险与审计职能。
    source_hash: sha256-6ca81d1368072127
  BC-930.70.10:
    name: 流程控制设计
    description: |
      在流程流转中嵌入预防性与检测性控制。
    source_hash: sha256-0ad8afa949bf8c0b
  BC-930.70.20:
    name: 职责分离建模
    description: |
      跨流程对职责分离规则进行建模并检测冲突。
    source_hash: sha256-57bbc7c0abbfbca9
  BC-930.70.30:
    name: 流程控制测试
    description: |
      定期测试流程控制的有效性与异常处理情况。
    source_hash: sha256-aff15ff1f48a791f
