locale: zh
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: 基础设施采购与合同管理
    description: |
      基础设施交付的采购战略、招标及合同管理，包括商务与工料测量管理、变更与索赔，以及分包商和供应链管理。
    in_scope:
      - 采购战略、打包及采购路径选择
      - 招标、投标管理和资格预审
      - 合同订立、管理和付款认证
      - 商务与工料测量和估价管理
      - 变更、补偿事件和索赔管理
      - 分包商和供应链采购及绩效
    out_of_scope:
      - 企业采购（BC-500）
      - 工程招标与估算（BC-1140）
      - 供应商关系管理（BC-510）
      - 施工工程执行与现场交付
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: 采购战略与打包
    description: |
      为基础设施交付定义采购战略、工作打包和合同路径。
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: 采购战略定义
    description: |
      定义与方案目标和市场承载力相协调的采购战略。
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: 工作包定义
    description: |
      将工作组织为适合市场和交付需要的工作包。
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: 合同路径选择
    description: |
      为每个工作包选择适当的合同路径和合同形式。
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: 供应商市场接触
    description: |
      与供应商市场进行早期接触，以塑造和检验采购方法。
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: 招标与投标管理
    description: |
      为基础设施工程和服务准备、评估和授予招标。
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: 招标准备
    description: |
      准备向市场发出的招标文件和要求。
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: 投标编制与提交
    description: |
      在作为投标方时编制并提交合规、有竞争力的投标。
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: 评标与授标
    description: |
      依据既定标准评估投标并授予合同。
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: 资格预审管理
    description: |
      管理供应商资格预审和入选名单。
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: 合同管理
    description: |
      通过订立、履约、付款和治理各环节管理基础设施合同。
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: 合同订立
    description: |
      订立和签署合同及其配套协议。
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: 合同义务管理
    description: |
      在交付过程中管理合同义务、通知和交付物。
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: 付款认证
    description: |
      认证依据合同条款应付的款项。
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: 合同治理
    description: |
      治理合同履约、合规和收尾。
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: 商务与工料测量
    description: |
      在合同全过程中对计量、估价和成本进行商务和工料测量管理。
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: 工料测量与计量
    description: |
      对工程进行计量和量化，以支持估价和付款。
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: 期中估价管理
    description: |
      在交付期间管理期中估价和付款申请。
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: 商务成本管理
    description: |
      对合同成本、利润和现金状况进行商务管理。
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: 最终结算
    description: |
      在合同完成时商定并结清最终账目。
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: 变更与索赔管理
    description: |
      管理基础设施合同下产生的变更、补偿事件、索赔和争议。
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: 变更管理
    description: |
      管理范围变更及其商务后果。
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: 补偿事件管理
    description: |
      评估和管理合同下的补偿事件。
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: 索赔管理
    description: |
      编制、抗辩和了结合同索赔。
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: 争议解决
    description: |
      通过谈判、裁决和正式程序解决争议。
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: 分包商与供应链管理
    description: |
      对分包商和交付供应链进行采购、准入和管理。
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: 分包商采购
    description: |
      为交付工作包采购和任命分包商。
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: 专业分项包管理
    description: |
      在交付期间管理专业分项包及其接口。
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: 供应链准入
    description: |
      对供应链伙伴进行准入和合规核查。
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: 分包商绩效管理
    description: |
      依据合同监测和管理分包商绩效。
    source_hash: sha256-154e39a8ff2b1f3c
metadata:
  translator: claude-ai
  date: "2026-07-16"
