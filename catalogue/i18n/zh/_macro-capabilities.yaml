kind: macro-capability
locale: zh
source: _macro-capabilities.yaml
entries:
  MC-10:
    name: "企业治理与风险"
    description: |
      为企业设定方向并设置使其保持航向的护栏：战略、治理、风险、合规、审计、
      法务、业务连续性，以及将它们整合在一起的架构职能。
    in_scope:
      - "战略意图、董事会监督与公司治理"
      - "企业风险的识别、处置与监控"
      - "监管合规、内部审计与法律咨询"
      - "业务连续性、危机准备与架构治理"
    out_of_scope:
      - "财务报告与司库运营（参见 MC-20)"
      - "与人员相关的风险运营（参见 MC-30)"
      - "在相关 L1 内处理的领域专有风险（例如信贷、保险、安全）"
    source_hash: sha256-742b9d11877faaa1
  MC-20:
    name: "公司金融"
    description: |
      管理企业的财务资源：账簿与记录、司库、税务、规划与分析，以及与投资者和
      资本市场的对话。
    in_scope:
      - "总账、控制人职能与法定报告"
      - "司库、现金与流动性管理"
      - "税务合规与规划"
      - "财务规划、预算、预测与绩效分析"
      - "投资者关系与资本市场沟通"
    out_of_scope:
      - "产品与服务的定价（参见 MC-40)"
      - "客户界面的收入确认操作（参见 MC-40)"
      - "采购支出管理（参见 MC-50)"
    source_hash: sha256-d45328ca473bb0f0
  MC-30:
    name: "人力资本"
    description: |
      获取、培养、部署、激励和支持员工队伍，使企业在合适的岗位上拥有合适的
      人员，达成合适的绩效水平。
    in_scope:
      - "人员规划、招聘、入职与部署"
      - "绩效、人才、继任与学习管理"
      - "薪酬、福利、薪资发放与总回报"
      - "员工关系、敬业度与离职"
    out_of_scope:
      - "工作场所设施与物理工作环境（参见 MC-70)"
      - "受监管运营中的劳动力安全（参见 MC-80 的政策框架，以及相关运营 L1 的执行)"
    source_hash: sha256-ef68e5156c6ba75c
  MC-40:
    name: "客户与商务"
    description: |
      获取、服务并发展客户关系：需求生成、销售执行、客户管理、客户服务，
      以及将报价与支付意愿联系起来的定价。
    in_scope:
      - "营销战略、品牌与需求生成"
      - "销售运营、商机管理与渠道使能"
      - "客户关系生命周期与客户管理"
      - "客户服务、支持与投诉处理"
      - "定价战略、价格表管理与折扣治理"
    out_of_scope:
      - "订单履行与物流执行（参见 MC-50)"
      - "开票、收款与收入核算（参见 MC-20)"
      - "在其行业 L1 内处理的行业专有客户工件（银行客户、保单持有人、电信用户等)"
    source_hash: sha256-47519d8a70bd3787
  MC-50:
    name: "供应链与采购"
    description: |
      获取投入并编排从供应商到客户的材料、服务和信息端到端流动，以正确的
      成本、服务水平和风险特征运行。
    in_scope:
      - "采购战略、寻源、合同与采购到付款"
      - "供应商资格认证、绩效与关系管理"
      - "供应链规划、履约编排与物流"
      - "库存定位、控制与优化"
    out_of_scope:
      - "在其 L1 内处理的行业专有运营（制造、炼制、采矿、仓储运营等)"
      - "客户订单获取（参见 MC-40)"
      - "供应商发票的司库结算（参见 MC-20)"
    source_hash: sha256-23b8a759fde708ca
  MC-60:
    name: "技术与信息"
    description: |
      运行企业的数字基础设施：IT 服务、数据与信息资产，以及保护两者的网络
      安全态势。
    in_scope:
      - "IT 战略、架构、服务交付与运营"
      - "信息与数据管理、治理与分析平台"
      - "网络安全政策、控制、监控与事件响应"
    out_of_scope:
      - "嵌入产品的软件与连接设备固件（在相关产品工程 L1 内处理)"
      - "在其 L1 内处理的行业专有临床、银行或电信信息系统"
      - "受监管资产的运营技术（OT），与相关行业 L1 共同治理"
    source_hash: sha256-f578fe11ce79d38f
  MC-70:
    name: "工作场所与设施"
    description: |
      提供企业的物理工作环境：容纳人员、流程与设备的运营设施组合与企业不动
      产足迹。
    in_scope:
      - "设施运营、维护与工作场所服务"
      - "企业不动产战略、收购与处置"
      - "空间规划与入住管理"
    out_of_scope:
      - "以房产作为商业产品运营的不动产业务（参见房地产行业 L1)"
      - "由行业维护 L1 管理的生产工厂资产"
      - "健康、安全与环境政策（参见 MC-80)"
    source_hash: sha256-2af429b32f798951
  MC-80:
    name: "质量、创新与知识"
    description: |
      提升企业运营标准并革新其供给：质量与 HSE 保证、可持续性、创新与研发
      引擎、产品生命周期管理，以及随时间复合学习的知识、知识产权与传播。
    in_scope:
      - "质量管理体系与持续改进"
      - "健康、安全、环境与可持续性计划"
      - "创新组合、研究与开发和产品生命周期管理"
      - "知识管理、知识产权与公司传播"
    out_of_scope:
      - "在相关 L1 内处理的行业专有产品工程（制药、电气、汽车等)"
      - "产品与报价的营销传播（参见 MC-40)"
      - "在相关行业 L1 内处理的受监管资产运营安全执行"
    source_hash: sha256-8a8128aa3ace91c4
  MC-90:
    name: "项目、变更与流程"
    description: |
      将意图转化为成果：项目组合与交付、组织变革采纳、企业转型，以及捕获、
      衡量和改进工作方式的业务流程纪律。
    in_scope:
      - "项目与方案组合管理"
      - "组织变革管理与采纳"
      - "企业级转型编排"
      - "业务流程建模、绩效与改进"
    out_of_scope:
      - "IT 专属的技术交付实践（参见 MC-60)"
      - "在相关 L1 内处理的行业专有方案管理（国防方案、车辆方案、制药开发、矿业项目)"
    source_hash: sha256-bdf5fbe3800d21eb
