locale: zh
source: L1-electoral-administration-management.yaml
entries:
  BC-3330:
    name: 选举行政管理
    description: |
      选举行政管理，涵盖选民登记、选区管理、候选人和政党登记、选票设计与制作、投票运营、计票与结果汇总，以及竞选经费披露。
    source_hash: sha256-67d2d4c5349543d7
  BC-3330.10:
    name: 选民登记管理
    description: |
      维护权威选民名册，包括登记、地址变更和名册维护工作。
    in_scope:
      - 选民注册和重新登记
      - 选民名册维护
      - 资格核验
    out_of_scope:
      - 民事身份登记（由民事登记与身份登记管理覆盖）
    source_hash: sha256-8a0903b8d85ffaec
  BC-3330.10.10:
    name: 选民注册
    description: |
      通过各渠道将符合条件的选民注册至选民名册。
    source_hash: sha256-5da1617dbd8dcc9a
  BC-3330.10.20:
    name: 选民名册维护
    description: |
      开展名册维护，包括地址更新、已故选民注销和重复处理。
    source_hash: sha256-a2d60dc4f76e3cfe
  BC-3330.10.30:
    name: 选民资格核验
    description: |
      依据公民身份、年龄和居住地标准核验选民资格。
    source_hash: sha256-a918247373031178
  BC-3330.10.40:
    name: 选民信息提供
    description: |
      提供选民卡、投票站查询和选民教育信息。
    source_hash: sha256-f365c06297503dce
  BC-3330.20:
    name: 选区与选举区管理
    description: |
      维护选举区、投票站地理范围及选区重划周期。
    source_hash: sha256-e28ac8fdc6fe3552
  BC-3330.20.10:
    name: 选举区维护
    description: |
      维护选举区和选区边界。
    source_hash: sha256-1f5dd81cc650dd00
  BC-3330.20.20:
    name: 投票站指定
    description: |
      指定投票站，开展无障碍评估并发布公告。
    source_hash: sha256-446ec5eeb4d2812b
  BC-3330.20.30:
    name: 选区重划协调
    description: |
      协调法定选区重划和边界委员会周期工作。
    source_hash: sha256-4d90ac29103396e7
  BC-3330.30:
    name: 候选人与政党登记
    description: |
      登记政党、候选人、提名申报和上票资格。
    source_hash: sha256-ec5ac3a9a7ff6479
  BC-3330.30.10:
    name: 政党登记
    description: |
      登记和认可政党及政党标识。
    source_hash: sha256-af1858adebe42302
  BC-3330.30.20:
    name: 候选人提名申报
    description: |
      接收和核实候选人提名及法定声明。
    source_hash: sha256-95c2f0f07d592b23
  BC-3330.30.30:
    name: 上票资格确定
    description: |
      确定上票资格，包括签名要求和入围门槛。
    source_hash: sha256-a51499d89bc152f0
  BC-3330.40:
    name: 选票设计与制作
    description: |
      设计、排版、无障碍、翻译和制作纸质及电子格式选票。
    source_hash: sha256-d510156ea8e06602
  BC-3330.40.10:
    name: 选票版式设计
    description: |
      为选票设计排版，确保清晰度、无障碍性和语言覆盖。
    source_hash: sha256-a60e9e530f170f0d
  BC-3330.40.20:
    name: 选票翻译与无障碍
    description: |
      为残障选民提供翻译选票和无障碍格式。
    source_hash: sha256-f2e94da3fe343a9c
  BC-3330.40.30:
    name: 选票制作与分发
    description: |
      印制、编程和安全分发纸质和电子选票。
    source_hash: sha256-ca99b5e87f55a7d7
  BC-3330.50:
    name: 投票运营
    description: |
      依据VVSG相关管控，在选举日运营投票站，包括投票工作人员管理、选民签到和选票投出。
    source_hash: sha256-28ed686615426d0e
  BC-3330.50.10:
    name: 投票工作人员管理
    description: |
      招募、培训和部署投票工作人员和选举官员。
    source_hash: sha256-8c2790c22e22a4b0
  BC-3330.50.20:
    name: 选民签到
    description: |
      在投票站开展选民签到、身份核验和选票发放。
    source_hash: sha256-e46f19fb954fc354
  BC-3330.50.30:
    name: 现场投票
    description: |
      在纸质或VVSG认证投票设备上开展现场投票。
    source_hash: sha256-0f54fbf29006d963
  BC-3330.50.40:
    name: 缺席与邮寄投票运营
    description: |
      支持缺席投票、邮寄投票和海外投票运营。
    source_hash: sha256-b300adb99228b8ce
  BC-3330.60:
    name: 计票与结果汇总
    description: |
      开展选票统计、结果汇总、审计和选举结果认证。
    source_hash: sha256-8f253538eed4a566
  BC-3330.60.10:
    name: 选票统计
    description: |
      依据法定程序统计纸质和电子选票。
    source_hash: sha256-f514952d0a9ebc7e
  BC-3330.60.20:
    name: 结果汇总与报告
    description: |
      汇总各投票站结果并向公众报告。
    source_hash: sha256-da36cff74e7f38e8
  BC-3330.60.30:
    name: 选后审计
    description: |
      开展风险限制型和选后计票及设备审计。
    source_hash: sha256-419116c8dd20337c
  BC-3330.60.40:
    name: 选举认证
    description: |
      对选举结果进行法定认证，并宣布当选官员。
    source_hash: sha256-2430e83bc7dea18c
  BC-3330.70:
    name: 竞选经费披露
    description: |
      登记政治委员会，开展捐款和支出披露，以及竞选经费限制执法。
    source_hash: sha256-f509e0c778bfd683
  BC-3330.70.10:
    name: 政治委员会登记
    description: |
      登记政治委员会、政党和PAC同等实体。
    source_hash: sha256-e05924e3a24be1a3
  BC-3330.70.20:
    name: 捐款与支出报告
    description: |
      接收、核实和发布捐款及支出披露信息。
    source_hash: sha256-897f9a46997d1b0e
  BC-3330.70.30:
    name: 竞选经费执法
    description: |
      调查和执法竞选经费限制和披露违规行为。
    source_hash: sha256-83ff1a4cf5a6c4c5
