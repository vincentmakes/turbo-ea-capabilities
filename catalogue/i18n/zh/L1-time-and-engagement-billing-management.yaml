locale: zh
source: L1-time-and-engagement-billing-management.yaml
entries:
  BC-4330:
    name: 工时与接洽计费管理
    description: |
      管理计费接洽的工时捕获、在制品管理、费用安排、开票、实现率及核销管控，以及法律执业特有的客户信托资金和保留金管理。
    source_hash: sha256-7355028b66c9a50a
  BC-4330.10:
    name: 工时管理
    description: |
      在接洽和任务层面捕获、核验并提交含说明的专业人员工时记录。
    source_hash: sha256-73e168ce71ef39da
  BC-4330.10.10:
    name: 工时录入
    description: |
      按接洽、任务和活动粒度进行计费和非计费工时的日常录入。
    source_hash: sha256-92b17bff52f126ce
  BC-4330.10.20:
    name: 工时叙述质量管理
    description: |
      对工时叙述进行质量管控，满足客户计费指引和电子账单要求。
    source_hash: sha256-001a7c4bce4342d1
  BC-4330.10.30:
    name: 工时提交与审批
    description: |
      完成工时记录的提交、主管审批及锁定。
    source_hash: sha256-cede9146ec79bc00
  BC-4330.20:
    name: 接洽垫付款管理
    description: |
      捕获和分摊接洽相关垫付款，如法院申请费、专家费、差旅费及印刷费，以便向客户转收。
    source_hash: sha256-44d412886839cfef
  BC-4330.20.10:
    name: 垫付款捕获
    description: |
      将垫付款捕获至接洽档案，以便后续追收。
    source_hash: sha256-35695362312e1311
  BC-4330.20.20:
    name: 垫付款可收回性审查
    description: |
      依据接洽委托书和客户计费指引审查垫付款可收回性。
    source_hash: sha256-0a8d9a99cbdc6ab6
  BC-4330.20.30:
    name: 垫付款分摊至接洽
    description: |
      将已批准垫付款分摊至接洽在制品，以便后续开票。
    source_hash: sha256-44cbac35eef8f128
  BC-4330.30:
    name: 在制品管理
    description: |
      追踪未开票在制品（WIP）余额、账龄及开票前的增收或减收决策。
    source_hash: sha256-a1ebc4428dd3b636
  BC-4330.30.10:
    name: 在制品追踪
    description: |
      按接洽、合伙人和执业部门实时追踪未开票在制品（WIP）。
    source_hash: sha256-e9e98d7268c423bd
  BC-4330.30.20:
    name: 在制品账龄分析
    description: |
      对未开票在制品进行账龄分析，并对陈旧余额进行上报。
    source_hash: sha256-5d989695815ea238
  BC-4330.30.30:
    name: 在制品增收与减收决策
    description: |
      由合伙人就开票前的在制品增收、减收及延期进行决策。
    source_hash: sha256-f51aa92b310461b6
  BC-4330.40:
    name: 费用安排管理
    description: |
      维护接洽级费用结构，包括小时费率表、替代费用安排、固定费用、成功费及保留金。
    source_hash: sha256-9f308b4c6b07b0ed
  BC-4330.40.10:
    name: 费率表维护
    description: |
      维护标准、客户专属和接洽专属的小时费率表。
    source_hash: sha256-eb4f0b51536590d6
  BC-4330.40.20:
    name: 替代费用安排设置
    description: |
      按接洽设置固定费用、封顶费用、成功费、风险代理及保留金费用安排。
    source_hash: sha256-a1953ba107a7a508
  BC-4330.40.30:
    name: 费用折扣与批量定价管理
    description: |
      跨客户接洽组合应用商定的费用折扣和批量定价。
    source_hash: sha256-1dae209b7531e287
  BC-4330.50:
    name: 发票生成管理
    description: |
      生成接洽发票，对叙述进行格式化，并满足客户电子账单格式要求。
    source_hash: sha256-14596c589d0f6489
  BC-4330.50.10:
    name: 预开票准备
    description: |
      在最终签发前准备预开票并由合伙人审查。
    source_hash: sha256-b9e0c20592f2a21c
  BC-4330.50.20:
    name: 最终发票签发
    description: |
      签发包含叙述、垫付款及税款的最终接洽发票。
    source_hash: sha256-9c2220447ca3aa01
  BC-4330.50.30:
    name: 客户电子账单格式合规
    description: |
      遵守客户电子账单要求，包括LEDES、UTBMS任务代码及客户门户提交。
    source_hash: sha256-495d684e5a8ec663
  BC-4330.50.40:
    name: 客户计费指引遵守
    description: |
      在工时、费率和垫付款方面遵守客户外部顾问计费指引。
    source_hash: sha256-8fdadd3916fc413d
  BC-4330.60:
    name: 接洽实现率管理
    description: |
      追踪开票到回款和标准到开票的实现率、核销及接洽盈利能力。
    source_hash: sha256-adaa6d0f5ebe63c1
  BC-4330.60.10:
    name: 标准到开票实现率追踪
    description: |
      追踪标准费率在制品与开票金额的对比，以发现收入漏损。
    source_hash: sha256-cd495b81a9d3cc4a
  BC-4330.60.20:
    name: 开票到回款实现率追踪
    description: |
      追踪开票金额与回款现金的对比，包括坏账拨备。
    source_hash: sha256-ea48f5dfb3315b33
  BC-4330.60.30:
    name: 接洽盈利能力报告
    description: |
      按接洽、合伙人和执业部门使用已实现收入和直接成本报告盈利能力。
    source_hash: sha256-ec289430782fc4d6
  BC-4330.60.40:
    name: 核销审批与分析
    description: |
      对在制品和应收账款核销进行审批工作流和根因分析。
    source_hash: sha256-5edb6b6b067f0d61
  BC-4330.70:
    name: 客户信托资金与保留金管理
    description: |
      管理代客持有的信托资金、IOLTA类账户及保留金余额，满足法律执业特有的隔离和对账要求。
    in_scope:
      - 客户信托账户运营
      - 保留金余额追踪
      - 信托账户对账与报告
    out_of_scope:
      - 事务所一般财务（BC-180）
    source_hash: sha256-026aa23a923ab99a
  BC-4330.70.10:
    name: 客户信托账户运营
    description: |
      代表客户运营隔离信托账户，处理收款和支出。
    source_hash: sha256-4fbf69d1a499e9ca
  BC-4330.70.20:
    name: 保留金余额管理
    description: |
      追踪客户保留金余额和补充触发条件。
    source_hash: sha256-c4a5a71a14547c0a
  BC-4330.70.30:
    name: 信托对账与报告
    description: |
      进行信托账本三方对账，并向监管机构或执业监管机构报告信托余额。
    source_hash: sha256-373e682252e5740f
