locale: zh
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: 数字工程与资产信息管理
    description: |
      跨建成资产生命周期的数字工程和结构化资产信息，涵盖建筑信息模型、公共数据环境、4D与5D集成、地理空间与测量管理，以及数字孪生与资产信息管理。将模型和数据转化为从设计、施工到运营均可信赖的信息资产。
    in_scope:
      - BIM战略、标准以及模型协调和碰撞检测
      - CDE公共数据环境和信息要求管理
      - 4D施工排序和5D成本集成
      - 地理空间、测量和实景采集数据管理
      - 数字孪生开发和运营数据集成
      - 跨资产生命周期的结构化信息移交
    out_of_scope:
      - 工程文档管理（BC-1130）
      - 产品生命周期管理（BC-820）
      - 企业信息与数据管理（BC-610）
      - IT平台与应用交付（BC-600）
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: BIM管理
    description: |
      跨项目和专业对建筑信息模型进行战略、标准和协调管理。
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: BIM战略与标准
    description: |
      定义BIM战略、标准和信息协议。
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: BIM执行规划
    description: |
      为项目规划BIM执行、角色和交付物。
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: 模型创建协调
    description: |
      按约定的标准和进度协调各专业的模型创建。
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: 模型集成与碰撞检测
    description: |
      集成各专业模型，并检测和解决碰撞。
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: 公共数据环境
    description: |
      管理共享信息环境以及项目数据的要求、控制和交换。
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: 公共数据环境管理
    description: |
      将CDE作为项目信息的单一可信来源加以运行。
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: 信息要求管理
    description: |
      定义和管理组织、资产和交换信息要求。
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: 文档与数据控制
    description: |
      对文档和数据进行控制、版本管理和状态管理。
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: 数据交换与互操作性
    description: |
      使用开放和可互操作的格式跨系统交换信息。
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: 4D与5D集成
    description: |
      将模型与方案和成本集成，以支持施工排序及工程量和成本洞察。
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: 4D施工排序
    description: |
      将模型与方案关联，以可视化和规划施工顺序。
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: 5D成本集成
    description: |
      将模型数据与成本集成，以支持估算和成本控制。
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: 基于模型的工程量提取
    description: |
      直接从协调后的模型中提取工程量。
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: 设计到施工协调
    description: |
      协调模型信息从设计流转至施工交付。
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: 地理空间与测量管理
    description: |
      管理支撑设计和施工的地理空间、测量和地层数据。
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: 地理空间数据管理
    description: |
      跨资产基础管理地理空间和地图数据。
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: 测量与放样
    description: |
      为施工工程提供测量控制和放样。
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: 实景采集与扫描
    description: |
      通过扫描和实景采集技术采集竣工状态。
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: 岩土数据管理
    description: |
      管理岩土和地层勘察数据。
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: 数字孪生与资产数据
    description: |
      为在用资产开发由运营数据驱动的资产信息模型和数字孪生。
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: 资产信息模型管理
    description: |
      管理运营资产的资产信息模型。
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: 数字孪生开发
    description: |
      开发和维护基础设施资产的数字孪生。
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: 运营数据集成
    description: |
      将运营和传感器数据集成到资产信息和孪生中。
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: 信息移交
    description: |
      将资产信息从交付结构化地移交至运营。
    source_hash: sha256-d849483d22283722
metadata:
