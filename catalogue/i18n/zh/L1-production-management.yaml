locale: zh
source: L1-production-management.yaml
entries:
  BC-1000:
    name: 生产管理
    description: |
      在企业层面统筹物理产品的生产规划、调度与执行，确保产量与成本目标达成。
    source_hash: sha256-dc19b089540c0b71
  BC-1000.10:
    name: 生产战略管理
    description: |
      制定生产布局、自制/外包与产能战略，支撑长期制造竞争力。
    source_hash: sha256-baf1326c8dfc3800
  BC-1000.10.10:
    name: 制造布局战略
    description: |
      规划长期制造布局与各工厂职能定位。
    source_hash: sha256-125cd49198ba9272
  BC-1000.10.20:
    name: 自制或外包战略
    description: |
      按产品线制定自制/外包与外委战略。
    source_hash: sha256-b8d9e3216e160dec
  BC-1000.10.30:
    name: 产能战略
    description: |
      制定长期产能战略与资本扩张规划。
    source_hash: sha256-3e9b5dbac3586398
  BC-1000.10.40:
    name: 制造运营模式设计
    description: |
      设计制造运营模式与治理架构。
    source_hash: sha256-438a0f6fcd3639e6
  BC-1000.20:
    name: 生产计划管理
    description: |
      制定主生产计划，开展中期（周至月度）生产规划。
    source_hash: sha256-d3e5c95bee5e6ee0
  BC-1000.20.10:
    name: 主生产计划编制
    description: |
      跨工厂生成主生产计划。
    source_hash: sha256-0dd25ca7292eb5d9
  BC-1000.20.20:
    name: 粗产能规划
    description: |
      对照主计划开展粗产能校验。
    source_hash: sha256-de110a25f9c02bbb
  BC-1000.20.30:
    name: 中期生产规划
    description: |
      按生产线开展周度与月度生产计划制定。
    source_hash: sha256-4f55b5fd0e88dc85
  BC-1000.20.40:
    name: 生产计划平衡
    description: |
      平衡生产计划与供需实际情况。
    source_hash: sha256-cee144f168ee0182
  BC-1000.30:
    name: 生产排程管理
    description: |
      开展详细排程与顺序优化（以小时至天为单位）。
    source_hash: sha256-c1d83fdb7f23c6d9
  BC-1000.30.10:
    name: 有限产能详细排程
    description: |
      在机器与产线层面开展有限产能排程。
    source_hash: sha256-12f63aaa4b07d484
  BC-1000.30.20:
    name: 顺序优化
    description: |
      优化生产顺序以减少换型损失与浪费。
    source_hash: sha256-8205e92ba598f035
  BC-1000.30.30:
    name: 计划达成率监控
    description: |
      监控计划达成情况并开展滚动调整。
    source_hash: sha256-7a9424cf3a6177af
  BC-1000.30.40:
    name: 生产工单下达
    description: |
      向车间下达生产工单。
    source_hash: sha256-22b259a2bcb7a816
  BC-1000.40:
    name: 生产执行管理
    description: |
      实施生产执行监控、派工与实时管控，确保计划按时完成。
    source_hash: sha256-4a9a1df4bf3dfde5
  BC-1000.40.10:
    name: 生产工单派工
    description: |
      向工作中心派发生产工单。
    source_hash: sha256-099bdc029f21b1ec
  BC-1000.40.20:
    name: 生产状态跟踪
    description: |
      实时跟踪生产工单状态。
    source_hash: sha256-4e85aa1f90be2815
  BC-1000.40.30:
    name: 生产异常处理
    description: |
      处理生产异常与升级事项。
    source_hash: sha256-428250e031b8de32
  BC-1000.40.40:
    name: 生产工单结算
    description: |
      确认、结算并关闭生产工单。
    source_hash: sha256-d52dcfefe5d60ccb
  BC-1000.50:
    name: 生产绩效管理
    description: |
      管理OEE、产量、良率与生产KPI，推动生产效率持续提升。
    source_hash: sha256-b9e74504c8f6b1df
  BC-1000.50.10:
    name: OEE测量
    description: |
      测量并报告设备综合效率（OEE）。
    source_hash: sha256-3bcae7b2c24f19ec
  BC-1000.50.20:
    name: 产量与良率分析
    description: |
      分析生产产量、良率与首通率。
    source_hash: sha256-f3def58502ac1aa3
  BC-1000.50.30:
    name: 停机与损失分析
    description: |
      对停机进行分类，开展损失树分析。
    source_hash: sha256-b3b95643db25f20b
  BC-1000.50.40:
    name: 生产绩效报告
    description: |
      输出工厂绩效报告与对标分析。
    source_hash: sha256-61e008ee261a850d
  BC-1000.60:
    name: 生产成本管理
    description: |
      管理标准成本、生产差异与成本分析，提升成本透明度。
    source_hash: sha256-ebd10e8643590845
  BC-1000.60.10:
    name: 标准成本设定
    description: |
      设定并重估产品标准成本。
    source_hash: sha256-8f1b903f30aa0e22
  BC-1000.60.20:
    name: 生产差异分析
    description: |
      分析材料、人工与制造费用差异。
    source_hash: sha256-f22cbe8bf421a1a2
  BC-1000.60.30:
    name: 生产成本报告
    description: |
      定期输出生产成本报告与对标分析。
    source_hash: sha256-c1dcb3982a1a7ec7
