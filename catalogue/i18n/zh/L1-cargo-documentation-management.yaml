    description: |
      运营e-AWB及ONE Record数据交换。
    source_hash: sha256-80bf34e1023a8412
  BC-2500.50.30:
    name: 单证交换与核验
    description: |
      开展各方单证交换及电子签名与印章核验。
    source_hash: sha256-6d007a5108d1a664
