    description: |
      向港口终端及海关申报出口舱单。
    source_hash: sha256-9a3893584da646a2
  BC-2500.40.30:
    name: 预到港货物报告
    description: |
      依据ICS2及CBP ACE等制度提交预到港货物申报。
    source_hash: sha256-04ea7eda2fc9de39
  BC-2500.50:
    name: 电子单证管理
    description: |
      运营电子运输单证平台，包括eBL及ONE Record数据交换。
    source_hash: sha256-7164f8516ac087ff
  BC-2500.50.10:
    name: 电子提单运营
    description: |
      运营电子提单平台。
    source_hash: sha256-e34c4ccfc7460611
  BC-2500.50.20:
