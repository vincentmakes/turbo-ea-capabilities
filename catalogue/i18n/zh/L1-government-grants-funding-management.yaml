locale: zh
source: L1-government-grants-funding-management.yaml
entries:
  BC-3260:
    name: 政府补贴与资金管理
    description: |
      向机构、社区和个人奖励和管理竞争性及公式化补贴与政府资金，涵盖征集、申请审查、奖励、监督和结项。
    source_hash: sha256-d9d1931c296c3f2d
  BC-3260.10:
    name: 补贴项目设计
    description: |
      设计补贴项目，包括目标、资格条件、资金分配公式和评审标准。
    source_hash: sha256-a8c65b6790801fd8
  BC-3260.10.10:
    name: 项目目标制定
    description: |
      制定补贴项目目标、成果和变化理论。
    source_hash: sha256-7f6ed2a088053810
  BC-3260.10.20:
    name: 资金分配建模
    description: |
      对资金分配方案进行建模，包括公式化、竞争性和配套资金设计。
    source_hash: sha256-8dba55eb8d419a59
  BC-3260.10.30:
    name: 评审标准设定
    description: |
      设定补贴遴选的优先审查和评估标准。
    source_hash: sha256-f19697c5e2c9082c
  BC-3260.20:
    name: 征集与通告管理
    description: |
      发布资助机会、资金可用性通告和征集文件。
    source_hash: sha256-5b4463ddfcac777c
  BC-3260.20.10:
    name: 资助机会发布
    description: |
      发布补贴征集通告、资金可用性通告和征集文件。
    source_hash: sha256-d25b170a9843ed48
  BC-3260.20.20:
    name: 申请方外联与支持
    description: |
      为补贴项目开展外联活动、信息说明和申请方支持。
    source_hash: sha256-d64f15df5f76a4f8
  BC-3260.20.30:
    name: 奖励前问题处理
    description: |
      处理潜在申请方在奖励前的问题和说明请求。
    source_hash: sha256-bd2bdcc178ef34b4
  BC-3260.30:
    name: 申请接收与审查
    description: |
      接收、筛查和对补贴申请进行优先审查，包括评审小组审查和评分。
    source_hash: sha256-b42405eaf8755180
  BC-3260.30.10:
    name: 申请提交
    description: |
      提交和接收补贴申请及支持文件。
    source_hash: sha256-24da063d43ae18a1
  BC-3260.30.20:
    name: 资格筛查
    description: |
      依据资格和门槛标准筛查申请。
    source_hash: sha256-c521a26ed88660b0
  BC-3260.30.30:
    name: 优先审查与评分
    description: |
      由评审小组依据公布的标准对申请进行审查、评分和排序。
    source_hash: sha256-8af09b96ed8d7188
  BC-3260.30.40:
    name: 审查员与利益冲突管理
    description: |
      招募审查员并管理利益冲突。
    source_hash: sha256-9e34a364f91254c9
  BC-3260.40:
    name: 奖励与资金决定
    description: |
      作出奖励决定，签发补贴协议，并向受益方安排资金义务。
    source_hash: sha256-d81664f188b00c3b
  BC-3260.40.10:
    name: 奖励遴选
    description: |
      最终确定获奖申请和奖励金额。
    source_hash: sha256-37dcfc5a74a08c2b
  BC-3260.40.20:
    name: 补贴协议签发
    description: |
      起草和签订补贴协议及条款条件。
    source_hash: sha256-945a545527eea132
  BC-3260.40.30:
    name: 资金义务与发放安排
    description: |
      安排资金义务和发放计划。
    source_hash: sha256-f138f6f5d0185df5
  BC-3260.50:
    name: 受益方监督与报告
    description: |
      监督受益方绩效、财务报告及补贴条款合规情况。
    source_hash: sha256-6cc5693c80b0d8bd
  BC-3260.50.10:
    name: 绩效报告审查
    description: |
      审查受益方绩效和里程碑进度报告。
    source_hash: sha256-d5fc82a50a7d378b
  BC-3260.50.20:
    name: 财务报告审查
    description: |
      审查受益方财务报告和提款申请。
    source_hash: sha256-fd3e472e08a3f85e
  BC-3260.50.30:
    name: 现场监督与核实
    description: |
      开展现场访问，核实受益方活动和可交付成果。
    source_hash: sha256-d7f9692abb0d6cac
  BC-3260.50.40:
    name: 子受益方监督
    description: |
      对转拨资金和子受益方安排实施监督。
    source_hash: sha256-7a6800ee46b99324
  BC-3260.60:
    name: 补贴结项与审计核查
    description: |
      开展最终报告、结项、审计核查及不合规成本追缴。
    source_hash: sha256-2b049d513b4d8431
  BC-3260.60.10:
    name: 最终报告与可交付成果验收
    description: |
      在项目结束时验收最终报告和可交付成果。
    source_hash: sha256-8ce136c7762097e7
  BC-3260.60.20:
    name: 综合审计与合规审计核查
    description: |
      核查针对补贴受益方的综合审计和合规审计发现。
    source_hash: sha256-f814b8fca66b5d92
  BC-3260.60.30:
    name: 不合规成本追缴
    description: |
      在结项时追缴不合规成本和未使用结余。
    source_hash: sha256-7114c4d07b4aebce
