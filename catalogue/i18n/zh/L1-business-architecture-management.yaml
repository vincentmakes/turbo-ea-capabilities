locale: zh
source: L1-business-architecture-management.yaml
entries:
  BC-170:
    name: 业务架构管理
    description: |
      对战略、能力、价值流、运营模式与业务信息资产之间的结构性关系进行设计、记录与治理。提供将企业战略转译为统一、可导航视图的架构产物,呈现企业如何组织以创造价值。
    in_scope:
      - 业务能力的建模、分解、热力图与评估
      - 价值流的识别、阶段定义与能力映射
      - 目标运营模式设计与过渡规划
      - 业务信息的概念层与逻辑层建模
      - 业务架构原则、框架采用与治理
      - 架构产物库管理与可追溯性
    out_of_scope:
      - IT、应用、数据层、技术与安全架构
      - 战略制定与执行治理(BC-100)
      - 项目、计划与组合交付(BC-900)
      - 组织变革采用与收益实现(BC-910 与 BC-920)
      - 流程建模、挖掘、优化及自动化治理(BC-930)
    source_hash: sha256-fa0e18614e62c0ff
  BC-170.10:
    name: 业务架构治理
    description: |
      业务架构实践的架构原则、框架采用、评审及偏离管理。
    source_hash: sha256-3655c50fc042e96e
  BC-170.10.10:
    name: 架构原则定义
    description: |
      定义并维护指引企业范围设计决策的业务架构原则。
    source_hash: sha256-57b10d299ffd5f96
  BC-170.10.20:
    name: 架构框架采用
    description: |
      选择、裁剪并推广 TOGAF、BIZBOK 等框架。
    source_hash: sha256-b11a71bff56f4470
  BC-170.10.30:
    name: 架构评审与合规
    description: |
      依据架构标准与原则评审解决方案与举措。
    source_hash: sha256-01825638711e7dc9
  BC-170.10.40:
    name: 架构偏离管理
    description: |
      捕获、评估并处理对架构标准的偏离。
    source_hash: sha256-b22f3dc4e76e2c91
  BC-170.20:
    name: 业务能力建模
    description: |
      作为主要架构锚点的业务能力的识别、分解、评估与供给分析。
    source_hash: sha256-b3a28632f8f73dbf
  BC-170.20.10:
    name: 能力识别
    description: |
      在企业层面发现并命名业务能力。
    source_hash: sha256-38258162b47b00f2
  BC-170.20.20:
    name: 能力分解
    description: |
      按 MECE 原则将能力分解至工作层级。
    source_hash: sha256-23dd94d394ccd9b0
  BC-170.20.30:
    name: 能力热力图
    description: |
      可视化能力的重要性、表现与投资态势。
    source_hash: sha256-2220b043dc0c71eb
  BC-170.20.40:
    name: 能力评估
    description: |
      评估单项能力的成熟度、表现与差距。
    source_hash: sha256-f2fbf186daa0dd9d
  BC-170.20.50:
    name: 能力供给策略
    description: |
      在能力组合视角下作出自建、采购、合作或保留的决策。
    source_hash: sha256-192fe428ff8c8582
  BC-170.30:
    name: 价值流建模
    description: |
      端到端价值流的识别与建模,以及与其支撑能力的关联。
    source_hash: sha256-7cd5cc41e14ed512
  BC-170.30.10:
    name: 价值流识别
    description: |
      在企业范围内发现客户、合作方与内部价值流。
    source_hash: sha256-b1e35be32c17de07
  BC-170.30.20:
    name: 价值流阶段定义
    description: |
      定义价值流的阶段、入口标准与价值要素。
    source_hash: sha256-a844de7ec0244b62
  BC-170.30.30:
    name: 价值流绩效衡量
    description: |
      定义并跟踪阶段层级的绩效与价值创造指标。
    source_hash: sha256-26face5c369d9839
  BC-170.30.40:
    name: 价值流与能力映射
    description: |
      将各价值流阶段所需的支撑能力进行映射。
    source_hash: sha256-716d4b5af18ad3a8
  BC-170.40:
    name: 运营模式设计
    description: |
      运营模式的架构性设计,涵盖服务交付模式、供给布局与过渡规划。
    source_hash: sha256-902f0cef57a853a2
  BC-170.40.10:
    name: 目标运营模式设计
    description: |
      跨能力、流程、组织、地点与信息维度定义目标运营模式。
    source_hash: sha256-28113ad71e8a19be
  BC-170.40.20:
    name: 服务交付模式设计
    description: |
      设计内部服务交付模式、共享服务与卓越中心的结构。
    source_hash: sha256-51b0e44074159e89
  BC-170.40.30:
    name: 供给与地点策略
    description: |
      为能力交付制定架构性供给与地点布局决策。
    source_hash: sha256-381e7a2be19c49aa
  BC-170.40.40:
    name: 运营模式过渡规划
    description: |
      将运营模式变更切分为过渡状态与波次,并进行排序。
    source_hash: sha256-e25af28374c45718
  BC-170.50:
    name: 业务信息建模
    description: |
      从业务视角对信息资产、术语表及信息生命周期进行建模。属概念与逻辑视图;物理数据架构归 IT。
    source_hash: sha256-b60ff76a6a3596ef
  BC-170.50.10:
    name: 业务实体建模
    description: |
      识别并定义核心业务实体及其关系。
    source_hash: sha256-532cb2f0a4a1ff80
  BC-170.50.20:
    name: 业务术语表管理
    description: |
      对业务术语与概念的权威性定义。
    source_hash: sha256-c1c4c82d507b8ece
  BC-170.50.30:
    name: 信息生命周期映射
    description: |
      映射业务信息的创建、使用、保留与退出位置。
    source_hash: sha256-fd20e53b2a6e92e3
  BC-170.60:
    name: 业务架构产物库管理
    description: |
      业务架构产物的编目、版本管理与工具支持。
    source_hash: sha256-5524a98e06acd234
  BC-170.60.10:
    name: 架构产物编目
    description: |
      在产物库中对业务架构产物进行盘点与分类。
    source_hash: sha256-093dc90d3772d48c
  BC-170.60.20:
    name: 产物版本与可追溯
    description: |
      产物版本管理及其在战略、能力、价值流与举措之间的可追溯性。
    source_hash: sha256-262b450d11418f00
  BC-170.60.30:
    name: 产物库工具管理
    description: |
      架构产物库工具的配置、访问管理与运维。
    source_hash: sha256-0823048b97df116e
  BC-170.70:
    name: 业务架构路线图与过渡规划
    description: |
      规划当前态、目标态与过渡架构,以指导组合与投资决策。
    source_hash: sha256-fe9f63a1e6a8b804
  BC-170.70.10:
    name: 当前态评估
    description: |
      跨能力与价值流记录当前业务架构。
    source_hash: sha256-fd0ed0b841a9be12
  BC-170.70.20:
    name: 目标态定义
    description: |
      定义与战略一致的目标业务架构。
    source_hash: sha256-90648fcc5e9a0de1
  BC-170.70.30:
    name: 差距分析
    description: |
      识别并优先排序当前态与目标态之间的差距。
    source_hash: sha256-814f370f626ebe31
  BC-170.70.40:
    name: 过渡架构设计
    description: |
      设计中间过渡架构,并按依赖关系进行排序。
    source_hash: sha256-beead6f3bcd8a9f3
