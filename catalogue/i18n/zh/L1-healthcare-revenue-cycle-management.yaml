entries:
  BC-2870:
    name: 医疗收费周期管理
    description: |
      管理医疗机构的费用采集和收费价格表、临床编码、医疗索赔生成和提交、拒付与申诉、现金过账、患者财务服务以及支付方合同管理。
    source_hash: sha256-ee114b4ef12b976f
  BC-2870.10:
    name: 费用采集与收费价格表管理
    description: |
      采集临床费用并跨服务线管理收费价格表。
    source_hash: sha256-9455230fab83ad20
  BC-2870.10.10:
    name: 费用采集
    description: |
      从临床文档和辅助系统采集费用。
    source_hash: sha256-6dc9ea86991db4dc
  BC-2870.10.20:
    name: 收费价格表维护
    description: |
      维护收费价格表条目、编码和定价。
    source_hash: sha256-53ed76c0514dddcc
  BC-2870.10.30:
    name: 费用核对
    description: |
      按服务区域核对预期与实际采集的费用。
    source_hash: sha256-fb27fe2196c44cc2
  BC-2870.10.40:
    name: 费用审计
    description: |
      对费用准确性和完整性开展内部和外部审计。
    source_hash: sha256-5c1a285fae2354dc
  BC-2870.20:
    name: 临床编码管理
    description: |
      开展住院、门诊和专业费用的编码生产和合规审计。
    source_hash: sha256-cd79069b9a4766b7
  BC-2870.20.10:
    name: 住院编码
    description: |
      使用诊断相关分组方法对住院就诊进行编码。
    source_hash: sha256-b0b24fbbe5f8c44c
  BC-2870.20.20:
    name: 门诊编码
    description: |
      使用门诊预付款分类方法对门诊就诊进行编码。
    source_hash: sha256-d719e26fff4db67c
  BC-2870.20.30:
    name: 专业费用编码
    description: |
      使用诊疗程序和评估管理编码对专业费用服务进行编码。
    source_hash: sha256-fa6d91bf68111023
  BC-2870.20.40:
    name: 编码审计与合规
    description: |
      开展编码审计、合规和宣教项目。
    source_hash: sha256-5ebdee4017ae802c
  BC-2870.30:
    name: 医疗索赔生成与提交
    description: |
      生成、审核、提交并追踪向支付方提交的医疗索赔状态。
    source_hash: sha256-02f289d4e0d451e9
  BC-2870.30.10:
    name: 索赔编辑与审核
    description: |
      在提交前应用编辑规则和索赔审核规则。
    source_hash: sha256-8070e34117046f3e
  BC-2870.30.20:
    name: 索赔提交
    description: |
      向支付方和票据交换所电子提交医疗索赔。
    source_hash: sha256-34e3f11ca81a7e25
  BC-2870.30.30:
    name: 索赔状态查询
    description: |
      通过电子和人工方式查询和跟进索赔状态。
    source_hash: sha256-6400f9955ab85707
  BC-2870.30.40:
    name: 赔付协调顺序
    description: |
      确定跨支付方的主要、次要和第三方索赔提交顺序。
    source_hash: sha256-dac72ad20093ec26
  BC-2870.40:
    name: 拒付与申诉管理
    description: |
      对支付方拒付和少付进行分诊、申诉和预防。
    source_hash: sha256-44d52b8fed3841df
  BC-2870.40.10:
    name: 拒付分诊
    description: |
      按拒付原因和追回概率对被拒索赔进行分诊和路由。
    source_hash: sha256-a931f4f0a211405d
  BC-2870.40.20:
    name: 申诉起草与提交
    description: |
      起草和提交临床和技术申诉。
    source_hash: sha256-07672e2829d2826c
  BC-2870.40.30:
    name: 少付分析
    description: |
      识别和追偿支付方相对于合同费率的少付金额。
    source_hash: sha256-a9d21cce8a2f0660
  BC-2870.40.40:
    name: 拒付预防分析
    description: |
      通过根本原因分析预防反复出现的拒付。
    source_hash: sha256-fffff6255035495a
  BC-2870.50:
    name: 现金过账与支付方核对
    description: |
      过账支付方汇款和患者付款，并与预期报销金额核对。
    source_hash: sha256-1e015d1ae469993a
  BC-2870.50.10:
    name: 汇款过账
    description: |
      进行电子汇款通知过账和核对。
    source_hash: sha256-a32cd5612522af6b
  BC-2870.50.20:
    name: 患者付款过账
    description: |
      过账跨渠道的患者付款。
    source_hash: sha256-990dfe195deede6a
  BC-2870.50.30:
    name: 合同调整应用
    description: |
      根据支付方协议应用合同调整。
    source_hash: sha256-0601aac3e7d138fe
  BC-2870.50.40:
    name: 未过账现金处理
    description: |
      解决和应用未识别和未过账的现金。
    source_hash: sha256-d0110c9dba079155
  BC-2870.60:
    name: 患者财务服务
    description: |
      管理患者账单、催收、分期付款计划和坏账处置。
    source_hash: sha256-39a33266b02e2922
  BC-2870.60.10:
    name: 患者账单生成
    description: |
      通过纸质和数字渠道生成患者账单。
    source_hash: sha256-1cfaa75d36b537a2
  BC-2870.60.20:
    name: 患者催收
    description: |
      开展自费患者催收运营和外联。
    source_hash: sha256-a5428d61898922de
  BC-2870.60.30:
    name: 分期付款计划管理
    description: |
      设置和管理患者分期付款计划。
    source_hash: sha256-f041166936e90e16
  BC-2870.60.40:
    name: 坏账处置
    description: |
      将账户移交外部催收机构并进行管理。
    source_hash: sha256-fb307b495802b0a3
  BC-2870.70:
    name: 支付方合同管理
    description: |
      对支付方合同进行建模、谈判支持、差异分析和绩效监控。
    source_hash: sha256-66f2747f25e46bbc
  BC-2870.70.10:
    name: 合同建模
    description: |
      对支付方合同条款和报销方法进行建模。
    source_hash: sha256-157e7af3ae522037
  BC-2870.70.20:
    name: 报销差异分析
    description: |
      分析合同约定与实际报销之间的差异。
    source_hash: sha256-45851445f30fbd4d
  BC-2870.70.30:
    name: 合同谈判支持
    description: |
      为支付方合同谈判提供分析和运营支持。
    source_hash: sha256-feba31d852c5aee5
  BC-2870.70.40:
    name: 支付方绩效监控
    description: |
      持续监控支付方对合同SLA的履行情况。
    source_hash: sha256-fdce4002249a4557
