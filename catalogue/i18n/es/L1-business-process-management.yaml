locale: es
source: L1-business-process-management.yaml
entries:
  BC-930:
    name: Gestión de procesos de negocio
    description: |
      Disciplina de diseño, modelado, monitorización, minería, optimización y gobierno de los procesos de negocio de extremo a extremo como una clase de activo gestionada. Trata los procesos como artefactos de primera clase con independencia de los dominios operativos que los ejecutan.
    in_scope:
      - Gobierno de la taxonomía, propiedad, ciclo de vida y estándares de los procesos
      - Descubrimiento, modelado BPMN, documentación y versionado de procesos
      - KPI de desempeño de procesos, monitorización y reporte de conformidad
      - Minería de procesos incluyendo adquisición de registros de eventos, descubrimiento y verificación de conformidad
      - Rediseño de procesos, simulación e identificación de oportunidades de automatización
      - Gobierno del portafolio de automatización a través de plataformas de workflow y RPA
      - Diseño de controles de proceso y modelado de la segregación de funciones
    out_of_scope:
      - Entrega de proyectos de mejora vía Lean, Six Sigma o eventos Kaizen (BC-720.50)
      - Ejecución operativa específica de dominio (pedidos, siniestros, envíos, etc.)
      - Desarrollo de software de bots RPA e ingeniería de plataforma (capacidades de TI)
      - Ejecución de procesos de gestión de servicios de TI (capacidades BC-700)
      - Modelado de la arquitectura de negocio, capacidades y cadenas de valor (BC-170)
  BC-930.10:
    name: Arquitectura y gobierno de procesos
    description: |
      Taxonomía de procesos, modelo de propiedad, política de ciclo de vida y estándares de autoría que enmarcan el portafolio de procesos.
  BC-930.10.10:
    name: Gestión de la taxonomía de procesos
    description: |
      Definición y custodia del marco de clasificación de procesos de la empresa.
  BC-930.10.20:
    name: Asignación de la propiedad de procesos
    description: |
      Asignación de propietarios, custodios y administradores de procesos en todo el portafolio.
  BC-930.10.30:
    name: Política del ciclo de vida de procesos
    description: |
      Política para la introducción, mantenimiento, retirada y archivado de procesos.
  BC-930.10.40:
    name: Estándares y convenciones de procesos
    description: |
      Notaciones de modelado, estándares de atributos y convenciones de revisión para los artefactos de proceso.
  BC-930.20:
    name: Modelado y documentación de procesos
    description: |
      Descubrimiento, autoría, publicación y control de versiones de los modelos de proceso y su documentación de apoyo.
  BC-930.20.10:
    name: Descubrimiento y elicitación de procesos
    description: |
      Talleres, entrevistas y observación para capturar el conocimiento del proceso tal como es.
  BC-930.20.20:
    name: Autoría de modelos de proceso
    description: |
      Autoría de modelos BPMN y equivalentes en la herramienta de modelado.
  BC-930.20.30:
    name: Publicación de la documentación de procesos
    description: |
      Publicación de la documentación de procesos a las audiencias operativas.
  BC-930.20.40:
    name: Versionado de modelos de proceso
    description: |
      Control de versiones, historial de cambios y flujo de aprobación para los modelos de proceso.
  BC-930.30:
    name: Medición del desempeño de procesos
    description: |
      Definición, monitorización y reporte del desempeño y la conformidad de los procesos.
  BC-930.30.10:
    name: Definición de KPI de proceso
    description: |
      Definición de KPI de tiempo de ciclo, rendimiento, calidad y coste por proceso.
  BC-930.30.20:
    name: Monitorización del desempeño de procesos
    description: |
      Cuadros de mando operativos y alertas frente a los objetivos de desempeño de proceso.
  BC-930.30.30:
    name: Reporte de conformidad de procesos
    description: |
      Reporte de la conformidad de ejecución frente al proceso modelado.
  BC-930.40:
    name: Minería y descubrimiento de procesos
    description: |
      Descubrimiento, verificación de conformidad e inteligencia de procesos a partir de registros de eventos.
  BC-930.40.10:
    name: Adquisición de registros de eventos
    description: |
      Extracción, transformación y carga de registros de eventos desde los sistemas fuente.
  BC-930.40.20:
    name: Análisis de descubrimiento de procesos
    description: |
      Reconstrucción algorítmica de las variantes de proceso ejecutadas a partir de registros de eventos.
  BC-930.40.30:
    name: Verificación de conformidad
    description: |
      Comparación del comportamiento ejecutado frente a modelos de referencia y conjuntos de reglas.
  BC-930.40.40:
    name: Reporte de inteligencia de procesos
    description: |
      Reporte de hallazgos de la minería como cuellos de botella, retrabajo e impacto de variantes.
  BC-930.50:
    name: Optimización y rediseño de procesos
    description: |
      Rediseño arquitectónico de procesos basado en datos, incluyendo simulación y análisis de candidatos a automatización. Distinto de la entrega de proyectos de mejora ubicada en BC-720.50.
  BC-930.50.10:
    name: Análisis de cuellos de botella
    description: |
      Identificación y cuantificación de puntos de restricción a través de las variantes de proceso.
  BC-930.50.20:
    name: Simulación de procesos
    description: |
      Simulación por eventos discretos y Monte Carlo de alternativas de diseño de proceso.
  BC-930.50.30:
    name: Diseño de procesos objetivo
    description: |
      Diseño de los flujos, controles y traspasos de los procesos rediseñados.
  BC-930.50.40:
    name: Identificación de oportunidades de automatización
    description: |
      Identificación de pasos candidatos a automatización por workflow, RPA o IA.
  BC-930.60:
    name: Gobierno de la automatización de procesos
    description: |
      Gobierno del portafolio de automatización a través de plataformas de workflow, RPA y automatización inteligente. Excluye la ingeniería y operación de las plataformas en sí.
  BC-930.60.10:
    name: Gestión del portafolio de automatización
    description: |
      Recepción de demanda, priorización y gestión del ciclo de vida de los activos de automatización.
  BC-930.60.20:
    name: Gobierno de la orquestación de workflows
    description: |
      Estándares y controles para los procesos de workflow orquestados a través de los sistemas de negocio.
  BC-930.60.30:
    name: Gobierno del programa RPA
    description: |
      Gobierno del programa de automatización robótica de procesos, incluyendo la propiedad de los bots.
  BC-930.60.40:
    name: Control y auditoría de la automatización
    description: |
      Marco de control, monitorización y registro de auditoría sobre el parque de automatización.
  BC-930.70:
    name: Gestión de riesgos y controles de proceso
    description: |
      Riesgos y controles integrados en los procesos, incluyendo la segregación de funciones. Complementa, sin sustituirlas, las funciones de riesgo empresarial y auditoría.
  BC-930.70.10:
    name: Diseño de controles de proceso
    description: |
      Diseño de controles preventivos y detectivos integrados en los flujos de proceso.
  BC-930.70.20:
    name: Modelado de la segregación de funciones
    description: |
      Modelado de las reglas de segregación de funciones y detección de conflictos en los procesos.
  BC-930.70.30:
    name: Pruebas de controles de proceso
    description: |
      Pruebas periódicas de la efectividad de los controles de proceso y del tratamiento de excepciones.
