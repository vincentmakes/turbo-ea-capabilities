locale: es
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Gestión del programa de capital y los controles de proyecto
    description: |
      Gobernanza y controles del lado del propietario y de la ejecución para los programas de capital y proyectos de infraestructura, que abarcan la puesta en marcha del programa, el control de costes y de cronograma, el valor ganado, la gestión de riesgos y el control de cambios, y el aseguramiento.
    in_scope:
      - Puesta en marcha del programa, gobernanza y gestión de puertas de fase
      - Estimación de costes, presupuestación, control y previsión
      - Planificación, programación y análisis del camino crítico
      - Valor ganado y gestión integrada del desempeño
      - Gestión de riesgos, cambios y contingencias del programa
      - Aseguramiento de proyectos, revisiones de puerta y reporte
    out_of_scope:
      - Gestión de proyectos y cambios a nivel empresarial (BC-900/BC-910)
      - Gestión de proyectos de ingeniería (BC-1110)
      - Evaluación de inversiones y decisiones de financiación (BC-5000)
      - Ejecución en obra de la construcción y entrega de trabajos
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: Puesta en marcha y gobernanza del programa
    description: |
      Establecimiento de la estructura del programa, el modelo de ejecución y la gobernanza para controlar la inversión de capital a través de puertas de fase definidas.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: Definición y puesta en marcha del programa
    description: |
      Definición y puesta en marcha del alcance, la estructura y la línea base de controles del programa.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Selección del modelo de ejecución
    description: |
      Selección del modelo de ejecución y de organización más adecuado para el programa.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: Marco de gobernanza y aseguramiento
    description: |
      Establecimiento del marco de gobernanza y aseguramiento que supervisa el programa.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Gestión de puertas de fase
    description: |
      Gestión de las puertas de fase que autorizan la progresión y la liberación de fondos.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: Estimación y gestión de costes
    description: |
      Estimación, establecimiento de línea base y control de los costes del programa y del proyecto a lo largo del ciclo de vida de ejecución.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Estimación de costes
    description: |
      Elaboración de estimaciones de costes en las distintas clases de estimación del ciclo de vida.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Gestión de la línea base del presupuesto
    description: |
      Establecimiento y mantenimiento de la línea base de costes frente a la que se mide el desempeño.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: Control y previsión de costes
    description: |
      Control y previsión de los costes hasta la finalización frente a la línea base aprobada.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Reporte de costes
    description: |
      Reporte del estado y las previsiones de costes a los grupos de interés del programa y del proyecto.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: Planificación y programación
    description: |
      Desarrollo y control de los cronogramas del programa y del proyecto para gestionar el plazo y la certeza de entrega.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Desarrollo del cronograma
    description: |
      Desarrollo de cronogramas integrados que abarcan las actividades del programa y del proyecto.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Análisis del camino crítico
    description: |
      Análisis de los caminos críticos y las holguras para proteger los hitos clave de entrega.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Medición del avance
    description: |
      Medición del avance físico y temporal frente a la línea base del cronograma.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Análisis de riesgos del cronograma
    description: |
      Análisis probabilístico del riesgo del cronograma para poner a prueba la confianza en la entrega.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: Gestión del valor ganado y el desempeño
    description: |
      Medición y reporte integrados del desempeño de costes y cronograma para prever los resultados del programa.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Gestión del valor ganado
    description: |
      Integración del alcance, el coste y el cronograma para medir el valor ganado y el desempeño.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: Métricas de desempeño y KPI
    description: |
      Definición y seguimiento de las métricas de desempeño y los KPI en todo el programa.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: Análisis de tendencias y desviaciones
    description: |
      Análisis de las tendencias y desviaciones para anticipar las desviaciones respecto al plan.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Reporte integrado del desempeño
    description: |
      Reporte consolidado del estado integrado de costes, cronograma y desempeño.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: Gestión de riesgos y control de cambios del programa
    description: |
      Gestión del riesgo, los cambios, la contingencia y las interfaces del programa para proteger los resultados de entrega.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Gestión de riesgos del programa
    description: |
      Identificación, evaluación y tratamiento de los riesgos en todo el programa.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Control de cambios
    description: |
      Control de los cambios de alcance y de línea base a través de un proceso de cambios disciplinado.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: Gestión de contingencias y reservas
    description: |
      Gestión de la contingencia y las reservas frente a la exposición al riesgo cuantificada.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: Gestión de interfaces y dependencias
    description: |
      Gestión de las interfaces y dependencias entre proyectos y grupos de interés.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: Aseguramiento y reporte de proyectos
    description: |
      Aseguramiento independiente, aprendizaje y reporte para confirmar la salud del programa y la entrega de beneficios.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: Aseguramiento de proyectos y revisiones de puerta
    description: |
      Aseguramiento independiente y revisiones de puerta de la preparación del programa y del proyecto.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Gestión de lecciones aprendidas
    description: |
      Captura y aplicación de las lecciones aprendidas a lo largo del ciclo de vida del programa.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Reporte del programa
    description: |
      Reporte del estado del programa a consejos, patrocinadores y órganos de supervisión.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Seguimiento de la realización de beneficios
    description: |
      Seguimiento de la realización de beneficios frente al caso de negocio del programa.
    source_hash: sha256-de6ea1cd05c875b0
