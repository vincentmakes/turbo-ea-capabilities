locale: es
source: L1-infrastructure-asset-management.yaml
entries:
  BC-5070:
    name: Gestión de activos de infraestructura
    description: |
      Gestión de ciclo de vida completo de los activos de infraestructura conforme a ISO 55000, abarcando la estrategia y planificación de la gestión de activos, el registro de activos y la base de información, la evaluación del estado y el desempeño, la estrategia de mantenimiento y renovaciones, el riesgo y la criticidad de los activos, y el ciclo de vida y la baja.
    in_scope:
      - Estrategia, política y planificación de la gestión de activos alineadas con los objetivos corporativos
      - Registro de activos, jerarquía y gestión de la calidad de la información
      - Evaluación del estado, el desempeño y la vida residual de los activos
      - Estrategia de mantenimiento y renovaciones y modelización del coste de ciclo de vida completo
      - Riesgo, criticidad y priorización de intervenciones de los activos
      - Optimización del valor del ciclo de vida, desmantelamiento y baja
    out_of_scope:
      - Gestión de activos físicos transversal a industrias (BC-1040)
      - Mantenimiento de planta (BC-1030)
      - Ejecución del mantenimiento (BC-5090)
      - Operación y control de redes en servicio (BC-5080)
    source_hash: sha256-ff71cdfe8c3f3de2
  BC-5070.10:
    name: Estrategia y planificación de la gestión de activos
    description: |
      Definición de la estrategia, los objetivos y los planes de gestión de activos que alinean las decisiones sobre activos con las metas de la organización.
    source_hash: sha256-cb48a4e3ad61ef68
  BC-5070.10.10:
    name: Política de gestión de activos y SAMP
    description: |
      Establecimiento de la política de gestión de activos y del plan estratégico de gestión de activos (SAMP) que fijan la dirección para el parque de activos.
    source_hash: sha256-4efc0bc3b4065e29
  BC-5070.10.20:
    name: Objetivos de gestión de activos
    description: |
      Definición de objetivos medibles de gestión de activos derivados de las metas de la organización y de las expectativas de los grupos de interés.
    source_hash: sha256-d047fa7f6fb972a5
  BC-5070.10.30:
    name: Alineación de línea de visión
    description: |
      Alineación de las decisiones y actividades sobre activos con la estrategia mediante una línea de visión clara desde los objetivos hasta la ejecución.
    source_hash: sha256-6cfd9b4f6132b0eb
  BC-5070.10.40:
    name: Planificación de la gestión de activos
    description: |
      Elaboración de planes de gestión de activos que traducen la estrategia en actividades acotadas y compromisos de recursos.
    source_hash: sha256-fd8ba34b64a99758
  BC-5070.20:
    name: Registro e información de activos
    description: |
      Mantenimiento de un registro de activos fiable y de una base de información que sustentan las decisiones de gestión de activos.
    source_hash: sha256-5490b84e55347d2a
  BC-5070.20.10:
    name: Gestión del registro de activos
    description: |
      Mantenimiento de un registro completo y preciso de los activos y sus atributos en todo el patrimonio.
    source_hash: sha256-6d722217a5f0ac49
  BC-5070.20.20:
    name: Jerarquía y clasificación de activos
    description: |
      Estructuración de los activos en jerarquías y clasificaciones coherentes para apoyar el análisis y los informes.
    source_hash: sha256-9e987c11d892100d
  BC-5070.20.30:
    name: Calidad de los datos de activos
    description: |
      Aseguramiento de la integridad, exactitud y vigencia de los datos de activos en toda la base de información.
    source_hash: sha256-f89ea51d1babb241
  BC-5070.20.40:
    name: Estándares de información de activos
    description: |
      Definición de los estándares y requisitos de información de activos que rigen la captura y el intercambio de datos.
    source_hash: sha256-aef275138b49f44b
  BC-5070.30:
    name: Evaluación del estado y el desempeño
    description: |
      Evaluación del estado, el desempeño y la vida residual de los activos para fundamentar las decisiones de intervención e inversión.
    source_hash: sha256-c07df052d056fc4d
  BC-5070.30.10:
    name: Seguimiento del estado
    description: |
      Seguimiento del estado de los activos para detectar el deterioro y fundamentar las decisiones de mantenimiento y renovación.
    source_hash: sha256-3199e2eb959c8862
  BC-5070.30.20:
    name: Régimen de inspección de activos
    description: |
      Definición y operación del régimen de inspección que determina el estado de los activos a lo largo del tiempo.
    source_hash: sha256-4d15d9676a325be7
  BC-5070.30.30:
    name: Análisis del desempeño
    description: |
      Análisis del desempeño de los activos frente a los estándares esperados y los requisitos de servicio.
    source_hash: sha256-09be7cb7fb9b41f6
  BC-5070.30.40:
    name: Evaluación de la vida residual
    description: |
      Evaluación de la vida útil residual para apoyar la planificación del momento de renovación y de la inversión.
    source_hash: sha256-61a54a779682dd8a
  BC-5070.40:
    name: Estrategia de mantenimiento y renovaciones
    description: |
      Desarrollo de la estrategia de mantenimiento y renovaciones que optimiza las intervenciones a lo largo de toda la vida del activo.
    source_hash: sha256-13b358ae5b73230a
  BC-5070.40.10:
    name: Desarrollo de la estrategia de mantenimiento
    description: |
      Desarrollo de estrategias de mantenimiento que equilibran coste, riesgo y desempeño entre los tipos de activos.
    source_hash: sha256-13a334f6b0cc4bf6
  BC-5070.40.20:
    name: Planificación de renovaciones y reposiciones
    description: |
      Planificación de las renovaciones y reposiciones para sostener el servicio del activo a largo plazo.
    source_hash: sha256-a42bf68efe800c10
  BC-5070.40.30:
    name: Optimización de intervenciones
    description: |
      Optimización del momento y el tipo de intervención para maximizar el valor del mantenimiento y las renovaciones.
    source_hash: sha256-0bdf9c3f4fba162e
  BC-5070.40.40:
    name: Modelización del coste de ciclo de vida completo
    description: |
      Modelización de los costes de ciclo de vida completo para fundamentar los compromisos entre mantenimiento, renovación e inversión.
    source_hash: sha256-1d8e18229d67f995
  BC-5070.50:
    name: Riesgo y criticidad de activos
    description: |
      Evaluación del riesgo y la criticidad de los activos para centrar las intervenciones en los activos más relevantes para el servicio y la seguridad.
    source_hash: sha256-5648edaf25a3143a
  BC-5070.50.10:
    name: Evaluación de la criticidad de activos
    description: |
      Evaluación de la criticidad de los activos para la continuidad del servicio, la seguridad y los objetivos de la organización.
    source_hash: sha256-9df9330d24dddb32
  BC-5070.50.20:
    name: Análisis de modos de fallo
    description: |
      Análisis de los modos de fallo de los activos y sus consecuencias para fundamentar las decisiones de riesgo y mantenimiento.
    source_hash: sha256-17bc85747541a823
  BC-5070.50.30:
    name: Priorización de intervenciones basada en riesgo
    description: |
      Priorización de las intervenciones sobre la base del riesgo y la criticidad de los activos.
    source_hash: sha256-3688db42b4cc5c95
  BC-5070.50.40:
    name: Evaluación de la resiliencia de activos
    description: |
      Evaluación de la resiliencia de los activos frente a peligros y tensiones que amenazan la continuidad del servicio.
    source_hash: sha256-4924a98f4d041977
  BC-5070.60:
    name: Ciclo de vida y baja de activos
    description: |
      Gestión de los activos a lo largo de la fase final de vida, el desmantelamiento y la baja para maximizar el valor y los resultados de sostenibilidad.
    source_hash: sha256-05b0594a435070dd
  BC-5070.60.10:
    name: Optimización del valor del ciclo de vida
    description: |
      Optimización del valor aportado por los activos a lo largo de todo su ciclo de vida.
    source_hash: sha256-778175117807d49e
  BC-5070.60.20:
    name: Planificación del desmantelamiento
    description: |
      Planificación del desmantelamiento seguro y ordenado de los activos al final de su vida.
    source_hash: sha256-a079a535759c0c43
  BC-5070.60.30:
    name: Gestión de la baja de activos
    description: |
      Gestión de la baja, transferencia y retirada de activos conforme a la política y las obligaciones.
    source_hash: sha256-5a236bad8ace26bd
  BC-5070.60.40:
    name: Sostenibilidad y circularidad
    description: |
      Incorporación de resultados de sostenibilidad y economía circular en las decisiones de ciclo de vida y baja de los activos.
    source_hash: sha256-a30b5016384602a1
metadata:
