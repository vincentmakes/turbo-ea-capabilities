    description: |
      Planes de inventario en centros de distribución para repuestos.
    source_hash: sha256-e5cfc4fcb2d62003
  BC-1060.40:
    name: Gestión de ventas de posventa
    description: |
      Ventas comerciales de posventa, renovaciones y venta adicional.
    source_hash: sha256-3a49616a7fc168c8
  BC-1060.40.10:
    name: Generación de prospectos de posventa
    description: |
      Generación de prospectos de posventa a partir de datos de la base instalada.
    source_hash: sha256-e90e6081170ebb95
  BC-1060.40.20:
    name: Gestión de pedidos de posventa
    description: |
      Captura y procesamiento de pedidos de posventa.
    source_hash: sha256-90f4048ab9f7b7d9
  BC-1060.40.30:
    name: Venta cruzada y adicional en posventa
    description: |
      Venta cruzada y adicional de productos y servicios de posventa.
    source_hash: sha256-8dddfd129a2d9a13
  BC-1060.50:
    name: Gestión de servicio y reparación
    description: |
      Reparaciones, unidades de intercambio y refacción.
    source_hash: sha256-cca86cda3c7001a9
  BC-1060.50.10:
    name: Operaciones del taller de reparación
    description: |
      Operación de talleres centrales de reparación.
    source_hash: sha256-477742608ef0d029
  BC-1060.50.20:
    name: Gestión del pool de unidades de intercambio
    description: |
      Gestión del pool de unidades de intercambio y piezas rotantes.
    source_hash: sha256-643756e8d82d9dd2
  BC-1060.50.30:
    name: Operaciones de refacción
    description: |
