    name: Gestión de políticas de garantía
    description: |
      Definición de términos, períodos y exclusiones de garantía.
    source_hash: sha256-aa9450e41b551e77
  BC-1060.60.20:
    name: Procesamiento de reclamaciones de garantía
    description: |
      Captura y adjudicación de reclamaciones de garantía de clientes.
    source_hash: sha256-e509b1efb6c665ca
  BC-1060.60.30:
    name: Recuperación de garantía de proveedores
    description: |
      Recuperación de costos de garantía de proveedores.
    source_hash: sha256-21848f0d40a07dea
  BC-1060.60.40:
    name: Gestión de la reserva de garantía
    description: |
      Estimación y contabilización de la reserva de garantía.
    source_hash: sha256-0002af9ccf5f5294
  BC-1060.70:
    name: Gestión de la base instalada
    description: |
      Datos de la base instalada, conectividad de activos e información del ciclo de vida.
    source_hash: sha256-e48b170cb8871170
  BC-1060.70.10:
    name: Gestión de datos de la base instalada
    description: |
      Captura y custodia de datos de la base instalada.
    source_hash: sha256-f534bff5f491bda6
  BC-1060.70.20:
    name: Operaciones de activos conectados
    description: |
      Operación de activos conectados y telemetría IoT.
    source_hash: sha256-16d17d6f12135b23
  BC-1060.70.30:
    name: Analítica de la base instalada
    description: |
      Analítica sobre el uso, condición y ciclo de vida de la base instalada.
    source_hash: sha256-5e8dea59388277c8
