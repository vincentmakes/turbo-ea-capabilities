locale: es
source: L1-spare-parts-aftermarket-management.yaml
entries:
  BC-1060:
    name: Gestión de repuestos y posventa
    description: |
      Suministro de repuestos, ventas y servicios de posventa para la base instalada.
    source_hash: sha256-e7445179d87deec9
  BC-1060.10:
    name: Gestión del catálogo de repuestos
    description: |
      Catálogo, identificación y sustituciones de repuestos.
    source_hash: sha256-b23a8697b274c5f2
  BC-1060.10.10:
    name: Identificación de repuestos
    description: |
      Identificación de piezas incluyendo catálogos ilustrados de repuestos.
    source_hash: sha256-5e1b29fbe0276ed6
  BC-1060.10.20:
    name: Gestión de sustituciones de piezas
    description: |
      Gestión de sustituciones y equivalencias de piezas.
    source_hash: sha256-1a4847fcc11aea99
  BC-1060.10.30:
    name: Publicación del catálogo
    description: |
      Publicación y distribución de catálogos de repuestos.
    source_hash: sha256-a9b9909171c8afea
  BC-1060.20:
    name: Gestión de precios de repuestos
    description: |
      Estrategia de precios, precios de lista y precios específicos por cliente.
    source_hash: sha256-87e84213973aedc3
  BC-1060.20.10:
    name: Estrategia de precios de repuestos
    description: |
      Estrategia y segmentación de precios para repuestos.
    source_hash: sha256-076dd5340b649c92
  BC-1060.20.20:
    name: Establecimiento de precios de repuestos
    description: |
      Establecimiento de precios de lista y precios basados en valor para repuestos.
    source_hash: sha256-e075fe7b8af1b69f
  BC-1060.20.30:
    name: Precios de repuestos específicos por cliente
    description: |
      Precios específicos por cliente y precios contractuales para repuestos.
    source_hash: sha256-2b43416e49e3a051
  BC-1060.30:
    name: Pronóstico de demanda de repuestos
    description: |
      Pronóstico de demanda para repuestos con movimiento lento y demanda intermitente.
    source_hash: sha256-371a607047bee0a6
  BC-1060.30.10:
    name: Pronóstico de demanda intermitente
    description: |
      Pronóstico de demanda de repuestos con movimiento lento e intermitente.
    source_hash: sha256-05fa6394cfc8bdad
  BC-1060.30.20:
    name: Pronóstico basado en la base instalada
    description: |
      Pronóstico de demanda impulsado por datos de la base instalada.
    source_hash: sha256-1b6f605343c981b7
  BC-1060.30.30:
