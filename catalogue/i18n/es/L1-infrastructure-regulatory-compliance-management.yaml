locale: es
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Gestión regulatoria y de cumplimiento de infraestructuras
    description: |
      Gestión de la regulación económica y de seguridad de la infraestructura, que abarca las relaciones con los reguladores y las presentaciones de control de precios, la gestión de licencias y obligaciones, los casos de seguridad y el aseguramiento, el reporte regulatorio, y los permisos y autorizaciones estatutarias.
    in_scope:
      - Relación con los reguladores y presentaciones de control de precios
      - Gestión de licencias de operación y obligaciones estatutarias
      - Desarrollo de casos de seguridad y aseguramiento de la seguridad
      - Reporte regulatorio de desempeño y estatutario
      - Gestión de permisos operativos, ambientales y estatutarios
      - Apoyo a auditorías regulatorias y divulgación
    out_of_scope:
      - Gestión de cumplimiento transversal a industrias (BC-130)
      - Gestión de riesgos corporativos (BC-140)
      - Gestión comercial de concesiones (BC-5100)
      - Gestión jurídica corporativa y de litigios
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Gestión de la relación regulatoria
    description: |
      Relación con los reguladores económicos y gestión de las presentaciones y determinaciones de control de precios.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Relación con el regulador
    description: |
      Relación y gestión continua del vínculo con los reguladores económicos y sectoriales.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: Control de precios y determinación
    description: |
      Gestión de los procesos regulatorios de control de precios y las determinaciones periódicas.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Gestión de presentaciones regulatorias
    description: |
      Preparación y gestión de las presentaciones formales ante los reguladores.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Seguimiento del cambio regulatorio
    description: |
      Seguimiento e interpretación de los cambios regulatorios que afectan al negocio.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: Gestión de licencias y obligaciones
    description: |
      Gestión de las licencias de operación y las obligaciones y condiciones estatutarias asociadas a ellas.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Gestión de licencias de operación
    description: |
      Gestión de las licencias de operación en poder del operador de infraestructura.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Seguimiento de obligaciones estatutarias
    description: |
      Seguimiento de las obligaciones estatutarias y su cumplimiento en todo el negocio.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Cumplimiento de las condiciones de licencia
    description: |
      Aseguramiento del cumplimiento de las condiciones asociadas a las licencias de operación.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: Gestión de deberes y compromisos
    description: |
      Gestión de los deberes estatutarios y los compromisos asumidos ante reguladores y autoridades.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: Caso de seguridad y aseguramiento
    description: |
      Desarrollo de los casos de seguridad y el aseguramiento y la certificación que demuestran una operación segura.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Desarrollo del caso de seguridad
    description: |
      Desarrollo y mantenimiento de los casos de seguridad para los activos y las operaciones de infraestructura.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: Certificación y autorización de seguridad
    description: |
      Obtención de la certificación y autorización de seguridad necesarias para operar.
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: Aseguramiento regulatorio de seguridad
    description: |
      Aseguramiento ante los reguladores de seguridad de que se cumplen las obligaciones de seguridad.
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: Evaluación independiente de seguridad
    description: |
      Evaluación y validación independiente de los casos de seguridad y los dispositivos asociados.
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: Reporte y divulgación regulatorios
    description: |
      Reporte de información de desempeño, financiera y estatutaria a los reguladores y grupos de interés.
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: Reporte regulatorio de desempeño
    description: |
      Reporte del desempeño operativo y de servicio a los reguladores.
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: Reporte regulatorio financiero
    description: |
      Reporte de la información financiera y de costes regulatoria a las autoridades.
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: Divulgación estatutaria
    description: |
      Divulgación de la información estatutaria exigida por la ley y la regulación.
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: Apoyo a auditorías regulatorias
    description: |
      Apoyo a las auditorías, revisiones e investigaciones regulatorias.
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: Permisos y autorizaciones estatutarias
    description: |
      Gestión de los permisos operativos, ambientales y estatutarios y de las autorizaciones necesarias para operar.
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: Gestión de permisos operativos
    description: |
      Gestión de los permisos operativos requeridos para las actividades de infraestructura.
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: Gestión de autorizaciones estatutarias
    description: |
      Gestión de las autorizaciones y consentimientos estatutarios de las autoridades.
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: Cumplimiento de permisos ambientales
    description: |
      Cumplimiento de los permisos ambientales y sus condiciones.
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: Renovación y modificación de permisos
    description: |
      Renovación y modificación de permisos y autorizaciones a medida que cambian las operaciones.
    source_hash: sha256-07c3c25fd50f1ebe
metadata:
  translator: claude-ai
  date: "2026-07-16"
