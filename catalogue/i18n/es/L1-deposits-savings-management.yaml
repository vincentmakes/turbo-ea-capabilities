locale: es
source: L1-deposits-savings-management.yaml
entries:
  BC-1330:
    name: Gestión de depósitos y ahorro
    description: |
      Ciclo de vida de cuentas corrientes, cuentas de ahorro y depósitos a plazo.
    source_hash: sha256-4060f73dd034fcfc
  BC-1330.10:
    name: Gestión de cuentas de depósito
    description: |
      Cuentas de depósito a la vista y cuentas corrientes.
    source_hash: sha256-14636f2be833a78c
  BC-1330.10.10:
    name: Operaciones de cuentas corrientes
    description: |
      Operación de cuentas corrientes incluyendo la gestión de descubiertos.
    source_hash: sha256-050512ef4f976f68
  BC-1330.10.20:
    name: Gestión de cuentas conjuntas y con poderes
    description: |
      Administración de cuentas conjuntas, fiduciarias y con poderes notariales.
    source_hash: sha256-0df0f70b7c355909
  BC-1330.10.30:
    name: Emisión de extractos de cuentas de depósito
    description: |
      Generación y distribución de extractos de cuentas de depósito.
    source_hash: sha256-2e32b84a57877323
  BC-1330.20:
    name: Gestión de productos de ahorro
    description: |
      Cuentas de ahorro, planes de ahorro periódico, ISA y productos con ventajas fiscales.
    source_hash: sha256-46c5260a5ef687ed
  BC-1330.20.10:
    name: Operaciones de ahorro de libre disposición
    description: |
      Operación de cuentas de ahorro de libre disposición y con preaviso.
    source_hash: sha256-a7039e49dd60ee8a
  BC-1330.20.20:
    name: Operaciones de planes de ahorro periódico
    description: |
      Operación de planes de ahorro periódico y órdenes permanentes.
    source_hash: sha256-468988fe1d2a570f
  BC-1330.20.30:
    name: Operaciones de ahorro con ventajas fiscales
    description: |
      Operaciones de ISA, IRA y productos de ahorro equivalentes con ventajas fiscales.
    source_hash: sha256-3b93506bc33d3630
  BC-1330.30:
    name: Gestión de depósitos a plazo
    description: |
      Depósitos a plazo fijo, certificados de depósito y depósitos estructurados.
    source_hash: sha256-d97c8d759393e6b8
  BC-1330.30.10:
    name: Contratación de depósitos a plazo
    description: |
      Contratación y confirmación de depósitos a plazo.
    source_hash: sha256-7bc1d02dcc93be11
  BC-1330.30.20:
    name: Gestión del vencimiento de depósitos a plazo
    description: |
      Gestión del vencimiento, renovación y opciones de prórroga.
    source_hash: sha256-27dc399f6ddb8ef1
  BC-1330.30.30:
    name: Operaciones de depósitos estructurados
    description: |
      Operación de depósitos estructurados y en doble divisa.
    source_hash: sha256-eb75af6a9653753a
  BC-1330.30.40:
    name: Cancelación anticipada y cálculo de penalización
    description: |
      Gestión de cancelaciones anticipadas y cálculo de penalizaciones por ruptura.
    source_hash: sha256-643095e87195f64a
  BC-1330.40:
    name: Gestión del ciclo de vida de cuentas
    description: |
      Apertura de cuentas, inactividad y operaciones de cierre.
    source_hash: sha256-49f16365fee64588
  BC-1330.40.10:
    name: Operaciones de apertura de cuentas
    description: |
      Apertura operativa de nuevas cuentas de depósito.
    source_hash: sha256-ea28b93b5d6bd514
  BC-1330.40.20:
    name: Gestión de cuentas inactivas
    description: |
      Identificación y gestión de cuentas inactivas.
    source_hash: sha256-adace3ca86fb7425
  BC-1330.40.30:
    name: Operaciones de cierre de cuentas
    description: |
      Operaciones de cierre de cuentas y liquidación final.
    source_hash: sha256-0cdced7bda210a9c
  BC-1330.40.40:
    name: Reporte de saldos no reclamados
    description: |
      Reporte y remisión de saldos no reclamados.
    source_hash: sha256-fa0c698558603c90
  BC-1330.50:
    name: Gestión de precios de depósitos e intereses
    description: |
      Tipos de interés, extractos y devengo de intereses.
    source_hash: sha256-d0e34b13a1c89bbc
  BC-1330.50.10:
    name: Fijación de tipos de interés de depósitos
    description: |
      Establecimiento de tipos de interés de depósitos y tarifas de tasas.
    source_hash: sha256-1ed604aa5cd06a39
  BC-1330.50.20:
    name: Cálculo y devengo de intereses
    description: |
      Devengo diario de intereses y abono periódico de intereses.
    source_hash: sha256-843573b3da70f854
  BC-1330.50.30:
    name: Retención fiscal sobre intereses
    description: |
      Retención fiscal sobre intereses de depósitos e informes correspondientes.
    source_hash: sha256-fd670578b8257546
  BC-1330.50.40:
    name: Reporte al fondo de garantía de depósitos
    description: |
      Informes y contribuciones al fondo de garantía de depósitos.
    source_hash: sha256-946a6a4f6a1725e8
