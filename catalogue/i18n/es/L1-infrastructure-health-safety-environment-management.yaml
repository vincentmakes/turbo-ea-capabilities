locale: es
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Gestión de seguridad, salud y medio ambiente de infraestructura
    description: |
      Gestión de la seguridad, la salud y el medio ambiente a lo largo de la construcción y las operaciones de infraestructura, que abarca los sistemas de gestión de HSE, la seguridad en la construcción, la salud laboral, la gestión ambiental y la respuesta a incidentes y emergencias. Protege a las personas, las comunidades y el medio ambiente mientras se ejecutan y operan las obras y los activos.
    in_scope:
      - Política, sistemas de gestión, cultura y competencia de HSE
      - Seguridad en la construcción bajo CDM, permisos y evaluación de riesgos
      - Vigilancia de la salud laboral, bienestar social y bienestar
      - Controles ambientales, prevención de la contaminación y cumplimiento de autorizaciones
      - Protección de la ecología y el patrimonio durante las obras
      - Reporte de incidentes, investigación y respuesta a emergencias
    out_of_scope:
      - Medio ambiente, salud y seguridad intersectorial (BC-720)
      - Resiliencia operativa y seguridad (BC-5120)
      - Gestión de la calidad de la construcción (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: Sistema de gestión de HSE
    description: |
      Política, estándares, cultura y competencia que conforman el sistema de gestión de seguridad, salud y medio ambiente.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: Política y estándares de HSE
    description: |
      Definición de la política, los estándares y los objetivos de HSE a lo largo de las actividades de infraestructura.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: Sistema de gestión de HSE
    description: |
      Operación y mejora continua del sistema de gestión de HSE certificado.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: Cultura y comportamiento de seguridad
    description: |
      Desarrollo de una cultura de seguridad positiva y comportamientos seguros en el conjunto del personal.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: Competencia y formación en HSE
    description: |
      Aseguramiento de la competencia, la formación y la autorización en HSE del personal.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Gestión de la seguridad en la construcción
    description: |
      Gestión del riesgo de seguridad en la construcción mediante el diseño, los controles en obra, los permisos y los sistemas de trabajo seguros.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: Gestión de CDM y riesgos de diseño
    description: |
      Gestión de las obligaciones de diseño y gestión de la construcción y de la reducción de riesgos en la fase de diseño.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Gestión de la seguridad en obra
    description: |
      Gestión diaria de los controles de seguridad y la supervisión en la obra de construcción.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Gestión de permisos de trabajo
    description: |
      Control de las actividades de alto riesgo mediante sistemas de permiso de trabajo.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: Procedimiento de trabajo y evaluación de riesgos
    description: |
      Preparación y control de los procedimientos de trabajo y las evaluaciones de riesgo de las tareas para una ejecución segura.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Gestión de la salud laboral
    description: |
      Protección de la salud del personal mediante la vigilancia, el bienestar social, la higiene y la gestión del bienestar.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Vigilancia de la salud laboral
    description: |
      Seguimiento de la salud y la aptitud del personal frente a las exposiciones laborales.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Provisión de bienestar social
    description: |
      Provisión de instalaciones y medidas de bienestar social para el personal de obra.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: Seguimiento de exposiciones e higiene
    description: |
      Seguimiento y control de las exposiciones laborales y la higiene en el lugar de trabajo.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: Gestión de la fatiga y el bienestar
    description: |
      Gestión de la fatiga, la salud mental y el bienestar en el conjunto del personal.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Gestión ambiental
    description: |
      Gestión de los impactos, los controles y las autorizaciones ambientales a lo largo de la construcción y las operaciones.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Controles ambientales
    description: |
      Implantación de controles que limitan el impacto ambiental de las obras y las operaciones.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Prevención de la contaminación
    description: |
      Prevención y control de la contaminación del aire, el agua y el suelo durante las obras.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Cumplimiento de autorizaciones ambientales
    description: |
      Cumplimiento de las autorizaciones, permisos y condiciones de licencia ambientales.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: Protección de la ecología y el patrimonio
    description: |
      Protección de la ecología, la biodiversidad y los activos patrimoniales afectados por las obras.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: Gestión de incidentes y emergencias
    description: |
      Reporte, investigación y respuesta a emergencias para los incidentes de HSE, con seguimiento del desempeño.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: Reporte e investigación de incidentes
    description: |
      Reporte e investigación de los incidentes de HSE y los cuasi accidentes.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Análisis de causa raíz
    description: |
      Análisis de las causas subyacentes para prevenir la recurrencia de los incidentes.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Planificación de la respuesta a emergencias
    description: |
      Planificación y preparación de la respuesta a emergencias en las obras y los activos.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: Seguimiento del desempeño de HSE
    description: |
      Seguimiento y reporte del desempeño de HSE y de los indicadores anticipados.
    source_hash: sha256-fbf0f34769e795c3
