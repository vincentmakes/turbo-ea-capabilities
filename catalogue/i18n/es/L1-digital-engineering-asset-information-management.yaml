locale: es
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Ingeniería digital y gestión de la información de activos
    description: |
      Ingeniería digital e información estructurada de activos a lo largo del ciclo de vida del activo construido, abarcando el modelado de información de la edificación (BIM), el entorno común de datos (CDE), la integración 4D y 5D, la gestión geoespacial y de topografía, y la gestión de gemelos digitales e información de activos. Convierte los modelos y los datos en un activo de información fiable desde el diseño hasta la construcción y la operación.
    in_scope:
      - Estrategia, estándares y coordinación de modelos y detección de colisiones BIM
      - Entorno común de datos (CDE) y gestión de requisitos de información
      - Secuenciación constructiva 4D e integración de costes 5D
      - Gestión de datos geoespaciales, topográficos y de captura de la realidad
      - Desarrollo de gemelos digitales e integración de datos operativos
      - Entrega estructurada de información a lo largo del ciclo de vida del activo
    out_of_scope:
      - Gestión de documentación de ingeniería (BC-1130)
      - Gestión del ciclo de vida del producto (BC-820)
      - Gestión de información y datos empresariales (BC-610)
      - Entrega de plataformas y aplicaciones de TI (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: Gestión de BIM
    description: |
      Estrategia, estándares y coordinación del modelado de información de la edificación (BIM) entre proyectos y disciplinas.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: Estrategia y estándares BIM
    description: |
      Definición de la estrategia, los estándares y los protocolos de información BIM.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: Planificación de la ejecución BIM
    description: |
      Planificación de la ejecución BIM, los roles y los entregables de un proyecto.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Coordinación de la elaboración de modelos
    description: |
      Coordinación de la elaboración de modelos por disciplina conforme a los estándares y calendarios acordados.
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: Federación de modelos y detección de colisiones
    description: |
      Federación de los modelos por disciplina y detección y resolución de colisiones.
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: Entorno común de datos
    description: |
      Gestión del entorno de información compartido y de los requisitos, el control y el intercambio de los datos del proyecto.
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: Gestión del entorno común de datos
    description: |
      Operación del entorno común de datos (CDE) como fuente única de la información del proyecto.
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: Gestión de requisitos de información
    description: |
      Definición y gestión de los requisitos de información organizativos, de activos y de intercambio.
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: Control de documentos y datos
    description: |
      Control, versionado y gestión del estado de documentos y datos.
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: Intercambio de datos e interoperabilidad
    description: |
      Intercambio de información entre sistemas utilizando formatos abiertos e interoperables.
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: Integración 4D y 5D
    description: |
      Integración de los modelos con el programa y el coste para apoyar la secuenciación constructiva y el análisis de mediciones y costes.
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: Secuenciación constructiva 4D
    description: |
      Vinculación de los modelos con el programa para visualizar y planificar las secuencias constructivas.
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: Integración de costes 5D
    description: |
      Integración de los datos del modelo con el coste para apoyar la estimación y el control de costes.
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: Extracción de mediciones basada en modelos
    description: |
      Obtención de mediciones directamente a partir de modelos coordinados.
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: Coordinación del diseño a la construcción
    description: |
      Coordinación de la información del modelo desde el diseño hasta la ejecución constructiva.
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: Gestión geoespacial y de topografía
    description: |
      Gestión de los datos geoespaciales, topográficos y del terreno que sustentan el diseño y la construcción.
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: Gestión de datos geoespaciales
    description: |
      Gestión de los datos geoespaciales y cartográficos en todo el parque de activos.
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: Topografía y replanteo
    description: |
      Provisión del control topográfico y el replanteo para las obras de construcción.
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: Captura de la realidad y escaneo
    description: |
      Captura de las condiciones as-built mediante escaneo y técnicas de captura de la realidad.
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: Gestión de datos geotécnicos
    description: |
      Gestión de los datos geotécnicos y de investigación del terreno.
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: Gemelo digital y datos de activos
    description: |
      Desarrollo de modelos de información de activos y gemelos digitales alimentados con datos operativos para el activo en uso.
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: Gestión del modelo de información de activos
    description: |
      Gestión del modelo de información de activos para el activo en operación.
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: Desarrollo de gemelos digitales
    description: |
      Desarrollo y mantenimiento de gemelos digitales de los activos de infraestructura.
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: Integración de datos operativos
    description: |
      Integración de datos operativos y de sensores en la información de activos y los gemelos digitales.
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: Entrega de información
    description: |
      Entrega estructurada de la información de activos desde la ejecución hacia las operaciones.
    source_hash: sha256-d849483d22283722
