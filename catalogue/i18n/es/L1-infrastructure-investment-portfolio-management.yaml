locale: es
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Gestión de la inversión y la cartera de infraestructuras
    description: |
      Estrategia de inversión, originación, evaluación y asignación de capital a través de una cartera de activos de infraestructura y proyectos de capital. Disciplina del lado del propietario/inversor que decide qué infraestructura financiar y cómo, y realiza el seguimiento de las rentabilidades a nivel de cartera y del valor público a lo largo del ciclo de vida del activo.
    in_scope:
      - Estrategia de inversión en infraestructuras y foco sectorial
      - Originación y cribado de la cartera de operaciones y proyectos
      - Casos de negocio, evaluación de opciones y análisis coste-beneficio
      - Priorización y secuenciación del programa de capital en toda la cartera
      - Estrategia de financiación, incluidas la subvención y la financiación de proyectos
      - Seguimiento del desempeño de la cartera, los beneficios y la relación calidad-precio
    out_of_scope:
      - Tesorería corporativa y financiación empresarial (BC-210)
      - Formulación de la estrategia empresarial (BC-580)
      - Ingresos operativos, tarifas e ingresos por concesión (BC-5100)
      - Controles de ejecución de programas y proyectos (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Estrategia de inversión en infraestructuras
    description: |
      Definición de la estrategia de inversión en infraestructuras a largo plazo, el foco sectorial y el apetito de riesgo que rige dónde se despliega el capital.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: Estrategia de sector y mercado
    description: |
      Selección de los sectores y mercados de infraestructura a los que dirigirse en función de la demanda, las políticas y la dinámica competitiva.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Definición de la tesis de inversión
    description: |
      Articulación de la tesis de inversión y la lógica de creación de valor para cada segmento de infraestructura objetivo.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Marco de asignación de capital
    description: |
      Marco y criterios que rigen la asignación de capital entre sectores, geografías y clases de activos.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Definición del apetito de riesgo
    description: |
      Definición del apetito de riesgo de inversión y los umbrales de tolerancia para la cartera de infraestructuras.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: Gestión de la cartera de proyectos y la originación
    description: |
      Originación, cribado y seguimiento de las oportunidades de inversión y de proyectos de infraestructura frente a los criterios de inversión.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Originación de oportunidades
    description: |
      Búsqueda de oportunidades de inversión y desarrollo de infraestructuras a través de los mercados, la administración pública y canales propietarios.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: Cribado y priorización de inversiones
    description: |
      Cribado y priorización temprana de las oportunidades frente a filtros estratégicos y financieros.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: Inteligencia de mercado y sectorial
    description: |
      Recopilación y análisis de información de mercado, demanda y políticas para orientar la originación.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Seguimiento de la cartera de proyectos
    description: |
      Seguimiento de las oportunidades a través de las puertas de fase desde el lead hasta la decisión de inversión.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: Gestión del caso de negocio y la evaluación
    description: |
      Elaboración y evaluación de casos de negocio para la inversión en infraestructuras, incluida la valoración de opciones y de valor.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Evaluación de opciones
    description: |
      Evaluación de las opciones de inversión y de ejecución frente a los objetivos estratégicos y las restricciones.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Análisis coste-beneficio
    description: |
      Evaluación coste-beneficio cuantificada y valoración económica de las inversiones de infraestructura candidatas.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: Evaluación del valor económico y social
    description: |
      Evaluación del valor económico, social y público más amplio que aporta la inversión.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Puertas de decisión de inversión
    description: |
      Puertas de gobernanza y aprobaciones que autorizan la progresión y la financiación comprometida.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Priorización del programa de capital
    description: |
      Priorización, equilibrado y secuenciación de las inversiones a través del programa de capital y la cartera de activos.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Priorización de la cartera
    description: |
      Ordenación de las inversiones candidatas frente al valor, el riesgo y la contribución estratégica.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Racionamiento de capital
    description: |
      Asignación de capital limitado entre demandas de inversión que compiten entre sí.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Equilibrado de la cartera
    description: |
      Equilibrado de la cartera entre horizontes de riesgo, sector y ciclo de vida.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Secuenciación de inversiones
    description: |
      Fasado y secuenciación de las inversiones para gestionar la capacidad de ejecución y los perfiles de financiación.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: Estrategia de financiación
    description: |
      Estrategia para obtener y estructurar la financiación necesaria para ejecutar el programa de infraestructuras.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Estrategia de fuentes de financiación
    description: |
      Selección de fuentes de financiación entre mecanismos públicos, privados y de pago por el usuario.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: Gestión de subvenciones y financiación pública
    description: |
      Obtención y administración de subvenciones y aportaciones públicas de capital.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Estructuración de la financiación de proyectos
    description: |
      Estructuración de la financiación de proyectos, deuda y capital para los activos de infraestructura.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Estructuración de la financiación combinada
    description: |
      Estructuración de paquetes de financiación combinada público-privada y concesional.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Gestión del desempeño de la cartera
    description: |
      Seguimiento y reporte de las rentabilidades, los beneficios y el valor aportado por la cartera de inversión en infraestructuras.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Seguimiento del desempeño de la cartera
    description: |
      Seguimiento del desempeño financiero y operativo en toda la cartera.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Seguimiento de beneficios
    description: |
      Seguimiento de los beneficios y resultados realizados frente a los casos de negocio de inversión.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Evaluación de la relación calidad-precio
    description: |
      Evaluación de la relación calidad-precio y del valor de ciclo de vida completo en toda la cartera.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Informes de la cartera
    description: |
      Reporte del desempeño de la cartera a inversores, consejos y grupos de interés públicos.
    source_hash: sha256-35c417c36c5cb686
