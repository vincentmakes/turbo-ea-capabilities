entries:
  BC-1360:
    name: Tesorería y gestión de activos y pasivos
    description: |
      Tesorería bancaria, ALM, precios de transferencia de fondos, liquidez y riesgo de tipo de interés del banking book.
    source_hash: sha256-c60d5c86b1c776bb
