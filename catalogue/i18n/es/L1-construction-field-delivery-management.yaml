locale: es
source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Gestión de la construcción y la ejecución en obra
    description: |
      Ejecución en obra de trabajos de infraestructura, que abarca la implantación y movilización de la obra, la gestión del frente de trabajo y la producción, las obras temporales, la maquinaria y los equipos, los materiales y la logística de obra, y la calidad de la construcción. La disciplina de ejecución en obra que convierte el diseño y el programa en obras construidas de forma segura, productiva y conforme a especificación.
    in_scope:
      - Implantación de la obra, movilización y provisión de instalaciones temporales
      - Coordinación del frente de trabajo, secuenciación de la producción y seguimiento del avance
      - Obras temporales, incluidos andamios, encofrados y sostenimiento de excavaciones
      - Gestión de maquinaria, equipos y operaciones de izado
      - Aprovisionamiento de materiales de obra, acopio, logística y gestión de residuos
      - Control de calidad de la construcción, inspección y gestión de no conformidades
    out_of_scope:
      - Gestión de la construcción de ingeniería (BC-1150)
      - Puesta en marcha y entrega (BC-1160)
      - Ingeniería de diseño (BC-1120)
      - Operación y mantenimiento de activos permanentes (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: Implantación y movilización de la obra
    description: |
      Preparación y movilización de la obra de construcción, incluyendo recintos, instalaciones temporales y conexión de servicios y suministros.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: Preparación de la obra y establecimiento del recinto
    description: |
      Establecimiento de recintos de obra, oficinas y zonas de bienestar listos para las operaciones de construcción.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Planificación de la movilización
    description: |
      Planificación de la movilización de recursos, personal y equipos a la obra de construcción.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Provisión de instalaciones temporales
    description: |
      Provisión de alojamiento temporal, bienestar e instalaciones de obra para el personal de construcción.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: Conexión de servicios y suministros
    description: |
      Conexión de energía, agua y comunicaciones temporales necesarias para las operaciones de obra.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: Gestión del frente de trabajo y la producción
    description: |
      Planificación, coordinación y seguimiento de la producción de la construcción a través de los frentes de trabajo activos para sostener el avance y la productividad.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: Planificación y secuenciación de la producción
    description: |
      Planificación de intervalo corto y secuenciación de la producción de la construcción a través de los frentes de trabajo.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Coordinación del frente de trabajo
    description: |
      Coordinación de oficios, recursos y accesos a través de frentes de trabajo simultáneos.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Operaciones diarias de obra
    description: |
      Dirección y control diarios de las operaciones de construcción en obra.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: Seguimiento del avance y la productividad
    description: |
      Medición del avance de la construcción y la productividad de la mano de obra frente al programa.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Gestión de las obras temporales
    description: |
      Gestión de las obras temporales y los sistemas de acceso que permiten la construcción segura de las obras permanentes.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Coordinación del diseño de obras temporales
    description: |
      Coordinación y control del diseño de las obras temporales y de su régimen de verificación.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: Gestión de andamios y accesos
    description: |
      Provisión y control de andamios y accesos seguros para las actividades de construcción.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: Gestión de encofrados y cimbras
    description: |
      Gestión de los sistemas de encofrado y cimbra que sostienen las obras de hormigón y estructurales.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: Gestión de excavaciones y sostenimiento
    description: |
      Gestión de las excavaciones y el sostenimiento temporal del terreno para mantener las obras estables y seguras.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: Gestión de maquinaria y equipos
    description: |
      Provisión, despliegue y mantenimiento de la maquinaria y los equipos de construcción, incluidas las operaciones de izado.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Gestión de la flota de maquinaria
    description: |
      Gestión de la flota de maquinaria de construcción a través de los proyectos y frentes de trabajo.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: Alquiler y utilización de equipos
    description: |
      Abastecimiento, alquiler y seguimiento de la utilización de los equipos de construcción.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Gestión de operaciones de izado
    description: |
      Planificación y control de las operaciones de izado y el uso de grúas en obra.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: Inspección y mantenimiento de maquinaria
    description: |
      Inspección y mantenimiento de la maquinaria y los equipos para sostener la disponibilidad y la seguridad.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: Materiales y logística de obra
    description: |
      Entrega, almacenamiento y movimiento de los materiales de construcción en obra, incluidas la logística y los residuos.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: Solicitud y entrega de materiales
    description: |
      Solicitud y entrega de materiales de construcción para cumplir el programa de trabajo.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: Gestión de acopios y almacenamiento
    description: |
      Gestión de las zonas de acopio y el almacenamiento en obra de materiales y componentes.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: Logística de obra y gestión del tráfico
    description: |
      Gestión de la logística de obra, las entregas y los movimientos de vehículos y tráfico.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Gestión de residuos de construcción
    description: |
      Segregación, manipulación y eliminación de los residuos de construcción y los materiales sobrantes.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Gestión de la calidad de la construcción
    description: |
      Aseguramiento y control de la calidad de la construcción para entregar obras conformes a especificación.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: Planificación de inspecciones y ensayos
    description: |
      Planificación de las inspecciones y ensayos y de sus puntos de parada y de testificación.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: Control y aseguramiento de la calidad
    description: |
      Ejecución de las verificaciones de control de calidad y del aseguramiento a través de las actividades de construcción.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Gestión de no conformidades
    description: |
      Identificación, tratamiento y cierre de las no conformidades de la construcción.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: Repaso de defectos y soporte a la entrega
    description: |
      Repaso de defectos, cierre de defectos y soporte para la entrega de las obras terminadas.
    source_hash: sha256-c6fb7d5061da1fe6
