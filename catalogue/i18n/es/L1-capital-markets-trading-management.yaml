locale: es
source: L1-capital-markets-trading-management.yaml
entries:
  BC-1370:
    name: Negociación en mercados de capitales
    description: |
      Negociación en front-office, creación de mercado, gestión de posiciones y ventas y negociación.
    source_hash: sha256-346ed82dc69d1988
  BC-1370.10:
    name: Gestión de creación de mercado
    description: |
      Creación de mercado en todas las clases de activos.
    source_hash: sha256-24d1f369a87d5bde
  BC-1370.10.10:
    name: Generación de cotizaciones
    description: |
      Generación de cotizaciones de compra/venta en los distintos mercados.
    source_hash: sha256-a619140649aaab86
  BC-1370.10.20:
    name: Gestión de inventario del creador de mercado
    description: |
      Gestión del inventario y posición de riesgo del creador de mercado.
    source_hash: sha256-df6a9cedcdac0b73
  BC-1370.10.30:
    name: Motor de precios del creador de mercado
    description: |
      Operación del motor de precios y gestión de parámetros.
    source_hash: sha256-b84a269b8bb57337
  BC-1370.20:
    name: Gestión de posiciones de negociación
    description: |
      Posiciones de negociación y atribución de P&L.
    source_hash: sha256-2531f3f8f50f3db9
  BC-1370.20.10:
    name: Seguimiento de posiciones en tiempo real
    description: |
      Seguimiento en tiempo real de las posiciones del libro de negociación.
    source_hash: sha256-077f61662084cdae
  BC-1370.20.20:
    name: Cálculo del P&L de negociación
    description: |
      Cálculo del P&L de negociación por mesa.
    source_hash: sha256-eb9eec2f07898308
  BC-1370.20.30:
    name: Análisis de atribución del P&L
    description: |
      Atribución del P&L por factor de riesgo, tiempo y operador.
    source_hash: sha256-9b949accd825891e
  BC-1370.30:
    name: Gestión de órdenes de negociación
    description: |
      Captura de órdenes, ejecución, enrutamiento inteligente y mejor ejecución.
    source_hash: sha256-8b902ca2ea6c9c5a
  BC-1370.30.10:
    name: Captura de órdenes de negociación
    description: |
      Captura y validación de órdenes de clientes y propietarias.
    source_hash: sha256-57439082479c204c
  BC-1370.30.20:
    name: Enrutamiento inteligente de órdenes
    description: |
      Enrutamiento inteligente de órdenes entre plataformas para lograr la mejor ejecución.
    source_hash: sha256-f01a8b1230195413
  BC-1370.30.30:
    name: Seguimiento de la calidad de ejecución
    description: |
      Seguimiento de la calidad de ejecución y analítica de mejor ejecución.
    source_hash: sha256-6aea7f7f8b56b8cc
  BC-1370.30.40:
    name: Gestión del ciclo de vida de órdenes
    description: |
      Ciclo de vida de órdenes incluyendo modificaciones y cancelaciones.
    source_hash: sha256-b41deffc9853dfce
  BC-1370.40:
    name: Gestión de negociación algorítmica
    description: |
      Estrategias algorítmicas, pruebas retrospectivas y cumplimiento normativo.
    source_hash: sha256-e9a5e7f7ed82cdce
  BC-1370.40.10:
    name: Desarrollo de estrategias algorítmicas
    description: |
      Desarrollo y certificación de estrategias algorítmicas.
    source_hash: sha256-cd73c987c7c05d67
  BC-1370.40.20:
    name: Pruebas retrospectivas de algoritmos
    description: |
      Pruebas retrospectivas y simulación de algoritmos de negociación.
    source_hash: sha256-9a85b465516ce7df
  BC-1370.40.30:
    name: Controles de negociación algorítmica
    description: |
      Controles pre-negociación y en tiempo de ejecución sobre la negociación algorítmica.
    source_hash: sha256-fd0aa164df34bb04
  BC-1370.50:
    name: Gestión de ventas y negociación
    description: |
      Mesas de ventas a clientes, negociación por voz y electrónica.
    source_hash: sha256-465ded8be1ea9e79
  BC-1370.50.10:
    name: Operaciones de la mesa de ventas a clientes
    description: |
      Operación de mesas de ventas telefónicas para clientes institucionales.
    source_hash: sha256-a8d9d69459542774
  BC-1370.50.20:
    name: Operaciones de negociación electrónica
    description: |
      Operación de plataformas de negociación electrónica y conectividad.
    source_hash: sha256-6143d1bfb2780ff3
  BC-1370.50.30:
    name: Investigación pre-negociación y tarificación
    description: |
      Investigación pre-negociación, precios indicativos y apoyo a la estructuración.
    source_hash: sha256-2d08b03831c6e90d
  BC-1370.60:
    name: Gestión del cumplimiento normativo y la vigilancia de negociación
    description: |
      Vigilancia de operaciones, detección de abuso de mercado y MiFID II.
    source_hash: sha256-d147abbb4bc75194
  BC-1370.60.10:
    name: Vigilancia de operaciones
    description: |
      Vigilancia de operaciones y detección de patrones sospechosos.
    source_hash: sha256-51bfa1cc5a0f7c27
  BC-1370.60.20:
    name: Detección de abuso de mercado
    description: |
      Detección de abuso de mercado incluyendo uso de información privilegiada y manipulación.
    source_hash: sha256-d509bd59b705d866
  BC-1370.60.30:
    name: Vigilancia de comunicaciones
    description: |
      Vigilancia de comunicaciones y voz de operadores.
    source_hash: sha256-5280c5a068d55344
  BC-1370.60.40:
    name: Reporte regulatorio de operaciones
    description: |
      Reporting regulatorio de operaciones y transacciones (MiFIR, EMIR, SFTR).
    source_hash: sha256-e83219f414f2a687
