    source_hash: sha256-1905580bcfa1fdf5
  BC-2060.60.30:
    name: Operaciones del mecanismo de reparto de riesgos
    description: |
      Operación de mecanismos de bonificación y penalización de reparto de riesgos.
    source_hash: sha256-7690dd5f0fe82dd1
  BC-2060.60.40:
    name: Reporte de resultados
    description: |
      Reporte de resultados contratados y métricas de nivel de servicio.
    source_hash: sha256-a8242b3db1b7dde6
  BC-2060.70:
    name: Operaciones de servicio conectado remoto
    description: |
      Operaciones del centro de servicio remoto que aprovechan los datos de HVAC y BAS conectados.
    source_hash: sha256-8fd9c6bcbeacc45c
  BC-2060.70.10:
    name: Operaciones del centro de diagnóstico remoto
    description: |
      Operaciones del centro de diagnóstico remoto para equipos conectados.
    source_hash: sha256-577e4a850a77d5a2
  BC-2060.70.20:
    name: Triaje remoto de incidencias
    description: |
      Triaje de incidencias identificadas a través de la telemetría remota.
    source_hash: sha256-45734eefcf5e94bf
  BC-2060.70.30:
    name: Ejecución de resoluciones remotas
    description: |
      Ejecución de resoluciones exclusivamente remotas cuando la incidencia no requiere visita en sitio.
    source_hash: sha256-e18a967f405875d5
  BC-2060.70.40:
