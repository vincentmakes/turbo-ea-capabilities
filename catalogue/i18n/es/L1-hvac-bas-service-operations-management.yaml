    source_hash: sha256-93584d5c52191492
  BC-2060.80.30:
    name: Gestión de escaladas de servicio
    description: |
      Gestión de escaladas de servicio y acciones de recuperación.
    source_hash: sha256-f007bf1b3e9abb81
  BC-2060.80.40:
    name: Reporte de rendimiento del servicio
    description: |
