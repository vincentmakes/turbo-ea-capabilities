    source_hash: sha256-04eb7ecf2bd2bb86
  BC-2060.40.10:
    name: Despliegue de actualizaciones de secuencias
    description: |
      Despliegue de secuencias de operación actualizadas en los controladores instalados.
    source_hash: sha256-e9ab0d22f2d18fea
  BC-2060.40.20:
    name: Actualización de firmware del controlador
    description: |
      Actualización del firmware de los controladores BAS instalados.
    source_hash: sha256-f14f5e528dd0fd4b
  BC-2060.40.30:
    name: Modificación de puntos y horarios
    description: |
