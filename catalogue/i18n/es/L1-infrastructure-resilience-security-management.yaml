locale: es
source: L1-infrastructure-resilience-security-management.yaml
entries:
  BC-5120:
    name: Gestión de la resiliencia y la seguridad de infraestructuras
    description: |
      Protección y resiliencia de la infraestructura crítica en el ámbito de la seguridad física, la seguridad ciberfísica y de la tecnología operativa, la resiliencia y la continuidad, la gestión de emergencias y crisis, y la resiliencia climática y ambiental.
    in_scope:
      - Seguridad física, control de accesos y videovigilancia
      - Seguridad ciberfísica y de la tecnología operativa
      - Resiliencia operativa y continuidad del negocio
      - Preparación ante emergencias y gestión de crisis
      - Adaptación climática y resiliencia ante fenómenos meteorológicos extremos
      - Protección de sistemas y activos críticos
    out_of_scope:
      - Gestión de riesgos corporativos (BC-140)
      - Gestión de la continuidad del negocio (BC-160)
      - Gestión de la ciberseguridad (BC-620)
      - Seguridad, salud y medio ambiente (BC-5050)
    source_hash: sha256-bcfbe910a7b9a461
  BC-5120.10:
    name: Gestión de la seguridad física
    description: |
      Protección de los emplazamientos y activos de infraestructura mediante control de accesos, videovigilancia y personal de seguridad.
    source_hash: sha256-ab6fd81d819c7d19
  BC-5120.10.10:
    name: Gestión de accesos e intrusiones
    description: |
      Gestión de los derechos de acceso y detección de intrusiones no autorizadas en los emplazamientos de infraestructura.
    source_hash: sha256-bf54fd2f6191d076
  BC-5120.10.20:
    name: Control de perímetro y accesos
    description: |
      Control de los perímetros de los emplazamientos y de los puntos de acceso físico a los activos críticos.
    source_hash: sha256-aaeb117e531a75c4
  BC-5120.10.30:
    name: Videovigilancia de seguridad
    description: |
      Videovigilancia y monitorización de los emplazamientos de infraestructura frente a amenazas de seguridad.
    source_hash: sha256-c8a6e9e5d44e94ed
  BC-5120.10.40:
    name: Gestión del personal de seguridad
    description: |
      Gestión del personal de seguridad y de los servicios de vigilancia en los emplazamientos.
    source_hash: sha256-92a7a9683019e254
  BC-5120.20:
    name: Seguridad ciberfísica
    description: |
      Protección de la tecnología operativa y los sistemas de control que operan la infraestructura crítica frente a amenazas ciberfísicas.
    source_hash: sha256-76663dc59f61c43e
  BC-5120.20.10:
    name: Seguridad de OT y sistemas de control
    description: |
      Seguridad de la tecnología operativa (OT) y los sistemas de control industrial que sustentan la infraestructura.
    source_hash: sha256-bab81199c8b2066f
  BC-5120.20.20:
    name: Protección de sistemas críticos
    description: |
      Protección de los sistemas y activos críticos esenciales para la operación de la infraestructura.
    source_hash: sha256-8782fc5bee69d8ed
  BC-5120.20.30:
    name: Gestión de amenazas ciberfísicas
    description: |
      Gestión de las amenazas que abarcan los dominios cibernético y físico de la infraestructura.
    source_hash: sha256-45b5d8d04bf46916
  BC-5120.20.40:
    name: Monitorización y respuesta de seguridad
    description: |
      Monitorización de eventos de seguridad y respuesta a incidentes que afectan a los sistemas de control.
    source_hash: sha256-2c7999abe3b319bf
  BC-5120.30:
    name: Gestión de la resiliencia y la continuidad
    description: |
      Planificación y pruebas que mantienen en funcionamiento los servicios de infraestructura crítica ante disrupciones.
    source_hash: sha256-50c82bf8d9652c50
  BC-5120.30.10:
    name: Planificación de la resiliencia operativa
    description: |
      Planificación de la resiliencia operativa de los servicios de infraestructura crítica.
    source_hash: sha256-87d444d87065fb57
  BC-5120.30.20:
    name: Gestión de la continuidad del negocio
    description: |
      Gestión de la continuidad del negocio para las operaciones de infraestructura durante disrupciones.
    source_hash: sha256-e9e5fdd1c4f37b7d
  BC-5120.30.30:
    name: Diseño de redundancia y conmutación por error
    description: |
      Diseño de redundancia y conmutación por error para sostener el servicio ante el fallo de activos.
    source_hash: sha256-de3a61dc3d3e824a
  BC-5120.30.40:
    name: Pruebas y ejercicios de resiliencia
    description: |
      Pruebas y ejercicios de los dispositivos de resiliencia y continuidad.
    source_hash: sha256-ccbec6e3ab225a02
  BC-5120.40:
    name: Gestión de emergencias y crisis
    description: |
      Preparación y respuesta ante emergencias y crisis que afectan a la infraestructura y a sus usuarios.
    source_hash: sha256-c9a84def75d1bc66
  BC-5120.40.10:
    name: Preparación ante emergencias
    description: |
      Planificación de la preparación ante emergencias que afectan a los activos y servicios de infraestructura.
    source_hash: sha256-2c08b126adcf3a8b
  BC-5120.40.20:
    name: Gestión de crisis
    description: |
      Gestión de las crisis que amenazan las operaciones de infraestructura y a los grupos de interés.
    source_hash: sha256-dda20de9498639d8
  BC-5120.40.30:
    name: Coordinación de la respuesta a emergencias
    description: |
      Coordinación de la respuesta a emergencias entre equipos y servicios de respuesta externos.
    source_hash: sha256-23673881e80ccf22
  BC-5120.40.40:
    name: Planificación de recuperación y restauración
    description: |
      Planificación de la recuperación y restauración de los servicios tras eventos disruptivos.
    source_hash: sha256-e8210e4f65f83176
  BC-5120.50:
    name: Resiliencia climática y ambiental
    description: |
      Adaptación y protección de la infraestructura frente al cambio climático y los peligros ambientales.
    source_hash: sha256-5c8519c07ef26be6
  BC-5120.50.10:
    name: Gestión de la adaptación climática
    description: |
      Gestión de la adaptación climática para los activos de infraestructura de larga vida útil.
    source_hash: sha256-7eded7738db31aa4
  BC-5120.50.20:
    name: Resiliencia ante fenómenos meteorológicos extremos
    description: |
      Resiliencia de la infraestructura ante fenómenos meteorológicos extremos y sus impactos.
    source_hash: sha256-d38d9fa5f0f02308
  BC-5120.50.30:
    name: Protección frente a inundaciones y peligros
    description: |
      Protección de la infraestructura frente a inundaciones y peligros naturales.
    source_hash: sha256-e133de2790603d36
  BC-5120.50.40:
    name: Gestión de peligros ambientales
    description: |
      Gestión de los peligros ambientales que afectan a la infraestructura y su entorno.
    source_hash: sha256-f9a3bb27d308ea50
metadata:
  translator: claude-ai
  date: "2026-07-16"
