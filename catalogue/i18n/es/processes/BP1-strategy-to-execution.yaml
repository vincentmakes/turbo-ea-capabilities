kind: business-process
locale: es
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Estrategia-a-Ejecución"
    description: "Ciclo de entrega estratégica de extremo a extremo desde la formulación de la estrategia pasando por definición del portafolio, setup de programas y proyectos, entrega y gobernanza, adopción del cambio y realización de beneficios. Un BP2 por cada stage_name de VS-580."
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "Formulación de la estrategia"
    description: "Definir la estrategia corporativa — visión, objetivos, choices y el modelo operativo necesario para ganar."
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "Definir dirección estratégica"
    description: "Definir visión, misión, objetivos estratégicos y los principios que guían los choices."
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "Tomar choices estratégicos"
    description: "Tomar choices where-to-play y how-to-win; arbitrar trade-offs entre mercados, segmentos, productos y capabilities."
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "Definir modelo operativo"
    description: "Definir el modelo operativo — capabilities, organización, ubicaciones y partners — necesario para ejecutar la estrategia."
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "Definición del portafolio"
    description: "Traducir la estrategia en un portafolio de programas e inversiones que entregarán los outcomes elegidos."
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "Identificar inversiones del portafolio"
    description: "Identificar inversiones candidatas que cerrarán brechas estratégicas; capturar valor, costo, riesgo y dependencias."
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "Priorizar el portafolio"
    description: "Priorizar inversiones por valor, ajuste, capacidad y riesgo; construir el portafolio integrado a través de horizontes."
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "Aprobar el portafolio"
    description: "Aprobar y financiar el portafolio vía el foro ejecutivo; disparar el setup de programas y proyectos."
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "Setup de programas y proyectos"
    description: "Establecer programas y proyectos con charter, gobernanza, plan, equipo y presupuesto."
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "Chartar el programa"
    description: "Chartar el programa — outcomes, alcance, gobernanza, sponsor, accountabilities, criterios de éxito."
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "Planificar entrega del programa"
    description: "Construir el plan integrado de entrega a través de los proyectos constitutivos, con hitos, dependencias y recursos."
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "Conformar equipos de proyecto"
    description: "Conformar equipos de proyecto, confirmar roles, hacer onboarding y disparar el trabajo de sprint o fase cero."
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "Entrega y gobernanza"
    description: "Entregar programas y proyectos contra el plan; ejecutar gobernanza para hacer aflorar riesgo, decidir cambios y asegurar calidad."
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "Ejecutar trabajo de proyecto"
    description: "Ejecutar trabajo de proyecto — diseño, build, prueba, entrega — según el método de entrega elegido (ágil, cascada, híbrido)."
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "Ejecutar gobernanza del programa"
    description: "Ejecutar comités de dirección, foros de decisión y gates de calidad bajo la autoridad de gobernanza corporativa de la empresa; hacer aflorar y resolver riesgos, issues y cambios."
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "Gestionar riesgos y cambios del programa"
    description: "Mantener el registro de riesgos y el log de cambios; mitigar, escalar y decidir cambios vía gobernanza."
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "Adopción del cambio"
    description: "Impulsar la adopción end-user de los cambios entregados por el programa — comunicar, capacitar, soportar, anclar."
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "Planificar adopción del cambio"
    description: "Construir el plan de adopción del cambio — mapeo de stakeholders, comunicación, capacitación, soporte, sustentabilidad."
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "Comunicar y capacitar"
    description: "Ejecutar comunicaciones y capacitación a través de la población impactada según el plan de adopción del cambio."
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "Soportar la adopción"
    description: "Proveer soporte hyper-care, hacer aflorar bloqueadores de adopción y ejecutar actividades de refuerzo."
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "Realización de beneficios"
    description: "Rastrear y capturar los beneficios estratégicos que el programa se comprometió a entregar; cerrar el programa."
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "Rastrear métricas de beneficios"
    description: "Rastrear los beneficios comprometidos — ingresos, costo, NPS, throughput — contra baseline y meta."
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "Capturar beneficios"
    description: "Capturar beneficios en business-as-usual — embeber en presupuestos, KPI y procesos run-the-business."
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "Cerrar el programa"
    description: "Cerrar el programa — reporte final, lecciones aprendidas, archivado, liberación del equipo; disparar movimientos de portafolio de seguimiento."
    source_hash: sha256-25c19e1849fe48b3
