kind: business-process
locale: es
source: BP1-acquire-to-retire.yaml
entries:
  BP-1090:
    name: "Adquisición-a-Retiro"
    description: "Ciclo de vida de extremo a extremo de activos físicos desde necesidad y justificación pasando por adquisición, puesta en marcha, operate-and-maintain, riesgo y reliability, mantenimiento de información del activo y desmantelamiento. Un BP2 por cada stage_name de VS-10."
  BP-1090.10:
    name: "Necesidad y justificación del activo"
    description: "Identificar necesidades de activo, justificar capital y aprobar el activo antes de iniciar la compra."
  BP-1090.10.10:
    name: "Identificar necesidad de activo"
    description: "Capturar la necesidad de negocio para un activo nuevo o de reemplazo; recopilar contexto técnico y operativo."
  BP-1090.10.20:
    name: "Construir justificación de capital"
    description: "Construir el business case — costo total de propiedad, NPV, sensibilidad — y asegurar aprobación de capital."
  BP-1090.10.30:
    name: "Aprobar plan de activo"
    description: "Enrutar a través del comité de aprobación de capital; documentar condiciones y vincular al portafolio."
  BP-1090.20:
    name: "Adquisición"
    description: "Sourcing, diseño o especificación, compra y aceptación de entrega del activo."
  BP-1090.20.10:
    name: "Especificar activo"
    description: "Traducir la necesidad en especificación de activo — capacidad, performance, compliance, requisitos de ciclo de vida."
  BP-1090.20.20:
    name: "Comprar activo"
    description: "Ejecutar sourcing, selección de proveedor y contratación; colocar orden de compra o contrato de construcción."
  BP-1090.20.30:
    name: "Aceptar entrega del activo"
    description: "Recibir, inspeccionar y aceptar formalmente el activo contra la especificación."
  BP-1090.30:
    name: "Puesta en marcha y capitalización"
    description: "Instalar, probar y poner en marcha el activo; capitalizarlo en los libros."
  BP-1090.30.10:
    name: "Instalar y poner en marcha el activo"
    description: "Instalar, energizar y ejecutar pruebas de puesta en marcha; transferir a operaciones tras finalización exitosa."
  BP-1090.30.20:
    name: "Capitalizar activo"
    description: "Capitalizar el activo en el registro de activos fijos con clase, método de depreciación y vida útil apropiados."
  BP-1090.40:
    name: "Operate y maintain"
    description: "Operar el activo y ejecutar mantenimiento preventivo, correctivo y basado en condición a lo largo de su vida útil."
  BP-1090.40.10:
    name: "Operar activo"
    description: "Ejecutar operaciones diarias del activo contra los parámetros de diseño; capturar datos operativos."
  BP-1090.40.20:
    name: "Planificar y programar mantenimiento"
    description: "Planificar mantenimiento preventivo, predictivo y basado en condición; programar contra disponibilidad de operaciones y recursos."
  BP-1090.40.30:
    name: "Ejecutar mantenimiento"
    description: "Ejecutar trabajo de mantenimiento — preventivo, correctivo, shutdown — y confirmar el activo retornado al servicio."
  BP-1090.50:
    name: "Riesgo y reliability"
    description: "Gestionar integridad del activo, reliability y riesgo de operational safety a lo largo de la vida operativa."
  BP-1090.50.10:
    name: "Evaluar riesgo del activo"
    description: "Realizar evaluaciones de criticidad y riesgo — modos de falla, consecuencia, probabilidad — para impulsar programas de mantenimiento e integridad."
  BP-1090.50.20:
    name: "Gestionar integridad del activo"
    description: "Ejecutar programas de inspección, prueba y gestión de corrosión para mantener integridad a lo largo del ciclo de vida."
  BP-1090.50.30:
    name: "Mejorar reliability del activo"
    description: "Impulsar mejora de reliability — análisis de causa raíz en fallas crónicas, modelado RAM, recomendaciones de cambio de diseño."
  BP-1090.60:
    name: "Mantenimiento de información del activo"
    description: "Mantener datos maestros del activo, planos, configuración y documentos a lo largo del ciclo de vida."
  BP-1090.60.10:
    name: "Mantener datos maestros del activo"
    description: "Mantener datos maestros del activo — clase, ubicación, parent-child, atributos — en el registro de activos."
  BP-1090.60.20:
    name: "Mantener documentos del activo"
    description: "Mantener planos, manuales, P&IDs, certificados y documentación as-built; alinear con cambio de ingeniería."
  BP-1090.70:
    name: "Desmantelamiento y disposición"
    description: "Planificar y ejecutar fin de vida — desmantelamiento, disposición, restauración y tratamiento contable final."
  BP-1090.70.10:
    name: "Planificar desmantelamiento"
    description: "Planificar fin de vida — timing, obligaciones ambientales, remoción, restauración, impacto financiero."
  BP-1090.70.20:
    name: "Ejecutar desmantelamiento"
    description: "Desmantelar, desensamblar y remover el activo; gestionar manejo de materiales peligrosos y restauración del sitio."
  BP-1090.70.30:
    name: "Disponer o vender activo"
    description: "Disponer, reciclar o vender el activo; capturar valor residual y chain-of-custody."
