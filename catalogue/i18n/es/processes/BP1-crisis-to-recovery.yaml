kind: business-process
locale: es
source: BP1-crisis-to-recovery.yaml
entries:
  BP-1140:
    name: "Crisis-a-Recuperación"
    description: "Ciclo de continuidad de negocio y gestión de crisis desde la planeación de continuidad pasando por pruebas de resiliencia, detección y activación, respuesta a crisis, disaster recovery, restauración y revisión post-crisis. Un BP2 por cada stage_name de VS-140."
    source_hash: sha256-6b5a46bc8192fd2e
  BP-1140.10:
    name: "Planeación de continuidad"
    description: "Construir y mantener planes de continuidad de negocio y disaster recovery para procesos y sistemas críticos."
    source_hash: sha256-015c32937d1d65af
  BP-1140.10.10:
    name: "Realizar análisis de impacto al negocio"
    description: "Identificar procesos críticos, metas RTO/RPO, dependencias y requisitos mínimos de operación."
    source_hash: sha256-16d992be1d96a2e6
  BP-1140.10.20:
    name: "Construir planes de continuidad"
    description: "Construir planes de continuidad de negocio a nivel proceso y sitio — workarounds, sitios alternos, contactos clave."
    source_hash: sha256-504a6e02114d49ad
  BP-1140.10.30:
    name: "Construir planes de disaster recovery"
    description: "Construir planes de disaster recovery IT — runbooks, replicación, metas de failover — para sistemas críticos."
    source_hash: sha256-88c412c4c1a51500
  BP-1140.20:
    name: "Pruebas de resiliencia"
    description: "Probar planes de continuidad y recovery — ejercicios tabletop, walk-throughs, failover completo."
    source_hash: sha256-eb3618fdb4e292cb
  BP-1140.20.10:
    name: "Conducir ejercicios tabletop"
    description: "Conducir ejercicios tabletop con equipos clave para validar planes y hacer aflorar brechas sin disrumpir operaciones."
    source_hash: sha256-19611168ac84e9f3
  BP-1140.20.20:
    name: "Realizar drills de failover"
    description: "Realizar drills de failover controlados para validar la recovery técnica; capturar timing contra metas."
    source_hash: sha256-549dfa1938c1c12c
  BP-1140.20.30:
    name: "Actualizar planes según hallazgos"
    description: "Actualizar planes de continuidad y recovery basados en hallazgos de pruebas; cerrar brechas antes del próximo ciclo."
    source_hash: sha256-a53a2d1c7ca74f86
  BP-1140.30:
    name: "Detección y activación"
    description: "Detectar el trigger de crisis y activar la respuesta — incident commander, war-room, comms."
    source_hash: sha256-0373dbdb7e081af0
  BP-1140.30.10:
    name: "Detectar trigger de crisis"
    description: "Detectar eventos que satisfacen los criterios de trigger de crisis — outage, brecha, evento de seguridad, acción regulatoria."
    source_hash: sha256-a2b600c30c99453b
  BP-1140.30.20:
    name: "Activar protocolo de crisis"
    description: "Activar el protocolo de gestión de crisis — designar commander, convocar war-room, establecer cadencia de comms."
    source_hash: sha256-c4d200ad5dcab2c4
  BP-1140.40:
    name: "Respuesta a crisis"
    description: "Gestionar la crisis activa — proteger personas y activos, contener daño, comunicar, coordinar."
    source_hash: sha256-4c79bc509b89d20c
  BP-1140.40.10:
    name: "Proteger personas y bienes"
    description: "Conducir acciones protectoras — evacuación, shutdown, aislamiento, médico, seguridad — para limitar el daño."
    source_hash: sha256-bc0d35d4aee77175
  BP-1140.40.20:
    name: "Contener impacto de la crisis"
    description: "Contener el impacto operativo, financiero, regulatorio y reputacional vía acciones de respuesta dirigidas."
    source_hash: sha256-9a019f4fa1f15864
  BP-1140.40.30:
    name: "Gestionar comunicación de crisis"
    description: "Conducir comunicaciones internas, externas, a reguladores y medios a lo largo de la crisis activa."
    source_hash: sha256-4dad5b0557fd8542
  BP-1140.50:
    name: "Disaster recovery"
    description: "Ejecutar procedimientos de disaster recovery para restaurar servicios IT dentro de las metas RTO/RPO."
    source_hash: sha256-fb85c409a6e401a5
  BP-1140.50.10:
    name: "Ejecutar failover IT"
    description: "Ejecutar el failover planeado de sistemas IT críticos a la infraestructura de recovery."
    source_hash: sha256-10be996126e393fa
  BP-1140.50.20:
    name: "Validar servicios restaurados"
    description: "Validar servicios restaurados contra criterios de aceptación; reanudar operaciones cara al cliente."
    source_hash: sha256-036370fd854b7000
  BP-1140.50.30:
    name: "Realizar failback"
    description: "Planificar y ejecutar el failback a la infraestructura primaria una vez estable; validar restauración completa."
    source_hash: sha256-c1689ce7096339a1
  BP-1140.60:
    name: "Restauración"
    description: "Restaurar activos físicos, supply chains y operaciones al estado pre-crisis."
    source_hash: sha256-44df1443f713f43d
  BP-1140.60.10:
    name: "Restaurar operaciones físicas"
    description: "Restaurar activos físicos, sitios y equipos a condición operativa; pasar verificaciones de seguridad."
    source_hash: sha256-f505be01a02d874a
  BP-1140.60.20:
    name: "Restaurar flujos de suministro y demanda"
    description: "Restaurar flujos de proveedores, flujo de pedidos de cliente y posicionamiento de inventario al baseline."
    source_hash: sha256-93a3ae915fd7288e
  BP-1140.70:
    name: "Revisión post-crisis"
    description: "Conducir post-action review; capturar lecciones aprendidas; impulsar mejoras sistémicas de resiliencia."
    source_hash: sha256-2955b6f0dfd36dd5
  BP-1140.70.10:
    name: "Conducir post-action review"
    description: "Conducir post-action review blameless con todos los responders; capturar timeline, decisiones y aprendizajes."
    source_hash: sha256-7583baae8ac29129
  BP-1140.70.20:
    name: "Fortalecer resiliencia"
    description: "Traducir lecciones aprendidas en mejoras de resiliencia — controles, planes, capacitación, tecnología."
    source_hash: sha256-676cf9bedb8b4c35
