kind: business-process
locale: es
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Descubrimiento-a-Automatización"
    description: "Ciclo de mejora de procesos y automatización desde el descubrimiento de procesos pasando por medición, mining, rediseño y automatización. Un BP2 por cada stage_name de VS-150."
    source_hash: sha256-242ccdd2644d3357
  BP-1160.10:
    name: "Descubrimiento de procesos"
    description: "Descubrir y documentar el proceso as-is — actores, pasos, datos, sistemas."
    source_hash: sha256-98b633c844e6186d
  BP-1160.10.10:
    name: "Mapear proceso as-is"
    description: "Mapear el proceso as-is vía entrevistas, walk-throughs y observación; persistir en un modelo de procesos."
    source_hash: sha256-67cdd9b1759b8c85
  BP-1160.10.20:
    name: "Capturar variantes del proceso"
    description: "Capturar variantes — por región, canal, tipo de cliente — para hacer aflorar dónde la estandarización importa."
    source_hash: sha256-4fd5fee3601621d3
  BP-1160.20:
    name: "Medición del proceso"
    description: "Medir el desempeño del proceso — tiempo de ciclo, costo, calidad, experiencia del cliente."
    source_hash: sha256-a3c0f1e1d505a6cc
  BP-1160.20.10:
    name: "Definir KPIs del proceso"
    description: "Definir KPIs para el proceso — eficiencia, calidad, outcome del cliente — y baselinear el desempeño actual."
    source_hash: sha256-30ac3e4647779862
  BP-1160.20.20:
    name: "Baselinear desempeño"
    description: "Baselinear el desempeño actual mediante muestreo y analytics; identificar outliers y patrones."
    source_hash: sha256-e76ab6dab63ebabb
  BP-1160.30:
    name: "Process mining"
    description: "Minear los event-logs de sistema para derivar el flujo real del proceso y hacer aflorar ineficiencias."
    source_hash: sha256-29c23b6d3ba32017
  BP-1160.30.10:
    name: "Extraer event log"
    description: "Extraer datos de event-log de sistemas fuente para el proceso en alcance; limpiar y preparar."
    source_hash: sha256-123c36e8e61e369a
  BP-1160.30.20:
    name: "Ejecutar análisis de process mining"
    description: "Aplicar herramientas de process mining para derivar flujo real, conformance, cuellos de botella, bucles de retrabajo y variantes."
    source_hash: sha256-57df458afdfbfe9a
  BP-1160.30.30:
    name: "Hacer aflorar hipótesis de mejora"
    description: "Traducir los hallazgos de mining en hipótesis de mejora priorizadas por impacto y factibilidad."
    source_hash: sha256-b2937b52a52a943e
  BP-1160.40:
    name: "Rediseño del proceso"
    description: "Rediseñar el proceso — eliminar, simplificar, integrar, automatizar — para entregar mejora step-change."
    source_hash: sha256-494cbf24df9546c1
  BP-1160.40.10:
    name: "Diseñar proceso to-be"
    description: "Diseñar el proceso to-be aplicando principios lean, alineamiento al journey del cliente y automatización."
    source_hash: sha256-d48fc9741c148b80
  BP-1160.40.20:
    name: "Validar rediseño"
    description: "Validar el rediseño con operadores, clientes y riesgo; refinar antes del build."
    source_hash: sha256-db270467cb280b5c
  BP-1160.50:
    name: "Automatización del proceso"
    description: "Construir, desplegar y operar la automatización del proceso — RPA, orquestación, asistencia IA — a escala."
    source_hash: sha256-10dd79850ae8b384
  BP-1160.50.10:
    name: "Construir automatización"
    description: "Construir la automatización — bots RPA, flujos orquestados, componentes de IA agéntica — según el proceso rediseñado."
    source_hash: sha256-041615d4647618a2
  BP-1160.50.20:
    name: "Desplegar y operar la automatización"
    description: "Desplegar la automatización a producción; operar, monitorear y mantener a través de ciclos de cambio."
    source_hash: sha256-a131e4085bd2075a
  BP-1160.50.30:
    name: "Rastrear beneficios de la automatización"
    description: "Rastrear los beneficios realizados de la automatización contra el business case; iterar y escalar."
    source_hash: sha256-3ad25892234ed3fc
