kind: business-process
locale: es
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Prospecto-a-Cliente"
    description: "Ciclo de extremo a extremo de adquisición de cliente desde estrategia de mercado y segmento pasando por marca, demand generation, captación de leads, conversión, onboarding y retención y advocacy continua. Un BP2 por cada stage_name de VS-440."
    source_hash: sha256-93500f1974f9bc3b
  BP-1050.10:
    name: "Estrategia de mercado y segmento"
    description: "Definir mercados objetivo y segmentos de cliente, y alinear prioridades go-to-market a donde el right-to-win es más fuerte."
    source_hash: sha256-affbbf0ef7d77300
  BP-1050.10.10:
    name: "Analizar el panorama del mercado"
    description: "Dimensionar mercados, perfilar competidores y hacer aflorar tendencias que dan forma a la demanda y la estrategia de adquisición."
    source_hash: sha256-44620ac30ced91a3
  BP-1050.10.20:
    name: "Definir segmentos objetivo"
    description: "Definir y priorizar segmentos de cliente objetivo basados en necesidad, ajuste y right-to-win."
    source_hash: sha256-f063a341ea447f3b
  BP-1050.10.30:
    name: "Establecer prioridades de adquisición"
    description: "Traducir prioridades de segmento en metas de adquisición — cuentas, geografías, canales — para el horizonte de planeación."
    source_hash: sha256-22780eafb5cef487
  BP-1050.20:
    name: "Marca y posicionamiento"
    description: "Desarrollar y custodiar la marca, posicionamiento y sistema de mensajería usado en todos los canales de adquisición."
    source_hash: sha256-3ee43aa33df82837
  BP-1050.20.10:
    name: "Desarrollar estrategia de marca"
    description: "Definir promesa de marca, personalidad, arquitectura e identidad visual; alinear a través de mercados y segmentos."
    source_hash: sha256-7651aec340f759c2
  BP-1050.20.20:
    name: "Desarrollar posicionamiento y mensajería"
    description: "Desarrollar posicionamiento y mensajería para cada segmento y oferta; equipar campañas y ventas con narrativa consistente."
    source_hash: sha256-493dde1c09daa73b
  BP-1050.20.30:
    name: "Custodiar activos de marca"
    description: "Mantener guidelines de marca, gestionar aprobaciones de uso de marca y gobernar identidad visual y verbal en mercado."
    source_hash: sha256-ad30bd57517a4650
  BP-1050.30:
    name: "Demand generation"
    description: "Generar awareness y demanda a escala mediante canales paid, owned, earned y partner."
    source_hash: sha256-c2a538e9bf3ed99e
  BP-1050.30.10:
    name: "Planificar campañas de demand generation"
    description: "Planificar campañas por segmento, canal y oferta; asignar presupuesto; establecer metas de leads y pipeline."
    source_hash: sha256-0e7bc3c21de36a17
  BP-1050.30.20:
    name: "Ejecutar campañas multicanal"
    description: "Ejecutar campañas paid, owned, earned y partner; gestionar creatividad, landing pages y ofertas."
    source_hash: sha256-95e0e1eccc5507c7
  BP-1050.30.30:
    name: "Medir desempeño de campañas"
    description: "Medir alcance, respuesta e impacto en pipeline por campaña y canal; iterar creatividad y spend."
    source_hash: sha256-ded149ab6943e5a3
  BP-1050.40:
    name: "Captación y nurture de leads"
    description: "Capturar interés inbound, enriquecer y puntuar leads y nurturarlos hasta sales-ready."
    source_hash: sha256-afcfc963e76608d6
  BP-1050.40.10:
    name: "Capturar leads inbound"
    description: "Capturar leads de formularios, eventos, referencias de partners y canales inbound en la plataforma de marketing automation."
    source_hash: sha256-48d12c0c6fcc3640
  BP-1050.40.20:
    name: "Enriquecer y puntuar leads"
    description: "Enriquecer con datos firmográficos y conductuales; puntuar por ajuste e intención para identificar leads sales-ready."
    source_hash: sha256-4de63882bcf6a017
  BP-1050.40.30:
    name: "Nurturar leads"
    description: "Ejecutar programas de nurture — contenido, drip campaigns, retargeting — para hacer avanzar leads hacia sales-ready."
    source_hash: sha256-b46f3cbccd469a24
  BP-1050.40.40:
    name: "Hacer handover de leads sales-ready"
    description: "Enrutar leads sales-ready a ventas para engagement directo; rastrear conversión a oportunidad."
    source_hash: sha256-b2707c9824fb2f78
  BP-1050.50:
    name: "Conversión"
    description: "Convertir leads calificados en primeros pedidos o primeras suscripciones a través de engagement de ventas, trials y ofertas."
    source_hash: sha256-2804c90b69e13459
  BP-1050.50.10:
    name: "Engagement con prospecto"
    description: "Ejecutar engagement directo de ventas, demos y trials para construir confianza del cliente y avanzar hacia decisión."
    source_hash: sha256-129f7034dbc8ff1b
  BP-1050.50.20:
    name: "Atender objeciones del comprador"
    description: "Hacer aflorar y atender objeciones — precio, ajuste, seguridad, integración — mediante evidencia y trial."
    source_hash: sha256-6feba148c9f6c9ff
  BP-1050.50.30:
    name: "Ofertar y cerrar primer deal"
    description: "Construir una oferta de primer deal, negociar términos y capturar el primer pedido o suscripción."
    source_hash: sha256-f136feaecfeab56e
  BP-1050.50.40:
    name: "Rastrear funnel de conversión"
    description: "Rastrear conversión lead-a-cliente por segmento, canal y oferta; iterar en el funnel."
    source_hash: sha256-995511608d3d6c95
  BP-1050.60:
    name: "Onboarding del cliente"
    description: "Onboardear nuevos clientes — provisioning, capacitación, success planning — para acelerar time-to-value."
    source_hash: sha256-b0c9a08158552296
  BP-1050.60.10:
    name: "Dar bienvenida al nuevo cliente"
    description: "Ejecutar la experiencia de bienvenida — kickoff, contactos nombrados, success plan — para establecer expectativas y energía."
    source_hash: sha256-676b4f99c985ba0d
  BP-1050.60.20:
    name: "Provisionar cliente"
    description: "Provisionar al cliente en sistemas de delivery — cuentas, entitlements, integraciones, migración de datos."
    source_hash: sha256-68087a83d23150ba
  BP-1050.60.30:
    name: "Capacitar usuarios del cliente"
    description: "Capacitar a usuarios del cliente en el producto o servicio; certificar champions; registrar en hitos del success plan."
    source_hash: sha256-2ffb520c607d6641
  BP-1050.60.40:
    name: "Confirmar time-to-value"
    description: "Validar que el cliente alcanzó hitos de first-value; capturar para scoring de retención."
    source_hash: sha256-36760c034df79c39
  BP-1050.70:
    name: "Retención y advocacy"
    description: "Retener clientes, impulsar renewal y expansión y convertir promotores en advocates y referencias."
    source_hash: sha256-5e7532f7855a510e
  BP-1050.70.10:
    name: "Ejecutar customer health scoring"
    description: "Puntuar la salud del cliente desde uso del producto, engagement y señales de feedback; hacer aflorar cuentas en riesgo para intervención."
    source_hash: sha256-3d3607b0bd4bd7d2
  BP-1050.70.20:
    name: "Impulsar renewal y expansión"
    description: "Ejecutar el motion de renewal e identificar oportunidades de expansión — cross-sell, upsell — dentro de la cuenta."
    source_hash: sha256-6229d03ee763a6f1
  BP-1050.70.30:
    name: "Cultivar advocacy"
    description: "Identificar promotores, capturar referencias, case studies y testimonios; activar programas de advocacy."
    source_hash: sha256-a60f0082731bb75f
