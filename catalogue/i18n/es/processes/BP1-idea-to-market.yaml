kind: business-process
locale: es
source: BP1-idea-to-market.yaml
entries:
  BP-1030:
    name: "Idea-a-Mercado"
    description: "Ciclo de innovación de producto/servicio de extremo a extremo desde captación de ideas pasando por concepto y factibilidad, investigación y prototipado, selección de portafolio, diseño y desarrollo, protección de IP, launch readiness, introducción al mercado y desempeño post-launch. Un BP2 por cada stage_name de VS-290."
    source_hash: sha256-b36539c6a860d958
  BP-1030.10:
    name: "Captación de ideas"
    description: "Hacer aflorar, capturar y consolidar ideas de empleados, clientes, partners y señales de mercado; enrutar a triage."
    source_hash: sha256-a7061e299a1ff468
  BP-1030.10.10:
    name: "Solicitar ideas"
    description: "Ejecutar campañas de generación de ideas, hackathons y canales continuos; alentar la presentación a través de la organización y el ecosistema."
    source_hash: sha256-c583fe2370715b4c
  BP-1030.10.20:
    name: "Capturar y triagear ideas"
    description: "Persistir ideas entrantes, deduplicar y triagear en colas de revisión con categorización inicial."
    source_hash: sha256-c9215649b73f4f3e
  BP-1030.10.30:
    name: "Validar ajuste de la idea"
    description: "Aplicar primer screen de ajuste contra estrategia, capability y señal de mercado; rechazar, parquear o avanzar a factibilidad."
    source_hash: sha256-e141bfd4610a44b2
  BP-1030.20:
    name: "Concepto y factibilidad"
    description: "Convertir ideas prometedoras en conceptos; evaluar factibilidad técnica, de mercado y comercial; construir el caso para selección de portafolio."
    source_hash: sha256-bad24bcc25be296d
  BP-1030.20.10:
    name: "Desarrollar concepto"
    description: "Articular el concepto — problema, usuario objetivo, solución propuesta, hipótesis de valor — con suficiente profundidad para evaluación."
    source_hash: sha256-7f29485cfc7bb17a
  BP-1030.20.20:
    name: "Evaluar factibilidad técnica"
    description: "Validar que el concepto puede construirse con tecnología, materiales y competencias disponibles o adquiribles."
    source_hash: sha256-79c0fcd5a32d0a6b
  BP-1030.20.30:
    name: "Evaluar factibilidad comercial"
    description: "Construir el business case — mercado direccionable, pricing, costo-de-servir, ROI — para dimensionar la oportunidad."
    source_hash: sha256-91311fcf277dd9f2
  BP-1030.20.40:
    name: "Decidir avance del concepto"
    description: "Decidir en el gate de concepto avanzar, refinar, parquear o matar, con justificación clara y condiciones."
    source_hash: sha256-138369baf58db536
  BP-1030.30:
    name: "Investigación y prototipado"
    description: "Conducir investigación, construir prototipos y probar con usuarios para deriskar el concepto antes del diseño completo."
    source_hash: sha256-17f18132d611266a
  BP-1030.30.10:
    name: "Conducir investigación de usuarios"
    description: "Ejecutar investigación cualitativa y cuantitativa con usuarios objetivo para validar problem-solution fit."
    source_hash: sha256-6f99d5b5143f9411
  BP-1030.30.20:
    name: "Construir prototipo"
    description: "Construir prototipos de baja o alta fidelidad — mock-ups físicos, wireframes, código funcional — para hacer tangible el concepto."
    source_hash: sha256-5739023c197a8fda
  BP-1030.30.30:
    name: "Probar prototipo con usuarios"
    description: "Ejecutar pruebas de usabilidad y valor con usuarios objetivo; capturar hallazgos para informar iteración o decisiones de matar."
    source_hash: sha256-e0ce8001b6cefc0d
  BP-1030.30.40:
    name: "Iterar concepto"
    description: "Aplicar aprendizajes de pruebas de prototipo al concepto; iterar hasta que el concepto esté listo para selección de portafolio o matar."
    source_hash: sha256-b97ec6e807254040
  BP-1030.40:
    name: "Selección de portafolio"
    description: "Priorizar conceptos validados dentro del portafolio de innovación; asignar recursos, secuenciar entrega y balancear riesgo."
    source_hash: sha256-05557aba2112750f
  BP-1030.40.10:
    name: "Puntuar candidatos del portafolio"
    description: "Puntuar conceptos validados contra criterios de portafolio — ajuste estratégico, valor, riesgo, ajuste de capability, time to market."
    source_hash: sha256-2122433ebccc8046
  BP-1030.40.20:
    name: "Secuenciar portafolio"
    description: "Secuenciar el portafolio a través de horizontes, balanceando now/next/later y mix core/adyacente/transformacional."
    source_hash: sha256-038a49840a38ad82
  BP-1030.40.30:
    name: "Asignar recursos"
    description: "Asignar financiamiento, talento e infraestructura a conceptos seleccionados; disparar kick-off formal a diseño y desarrollo."
    source_hash: sha256-e99973b9328d841f
  BP-1030.50:
    name: "Diseño y desarrollo"
    description: "Diseño detallado, ingeniería, build e integración del producto o servicio hasta launch readiness."
    source_hash: sha256-6787748725dca2eb
  BP-1030.50.10:
    name: "Definir requisitos detallados"
    description: "Traducir el concepto validado en requisitos funcionales, no funcionales y de aceptación detallados."
    source_hash: sha256-e0f465f9e03256c8
  BP-1030.50.20:
    name: "Diseñar producto o servicio"
    description: "Producir el diseño detallado — arquitectura, materiales, UX, BOM — que será construido y validado."
    source_hash: sha256-a18aadaba349f517
  BP-1030.50.30:
    name: "Construir e integrar"
    description: "Construir el producto o servicio según diseño; integrar componentes y subsistemas; gestionar cambio y configuración."
    source_hash: sha256-43fb091529479223
  BP-1030.50.40:
    name: "Validar y verificar"
    description: "Ejecutar verificación y validación de diseño contra requisitos; cerrar no conformidades antes de launch readiness."
    source_hash: sha256-0491e890b9359851
  BP-1030.60:
    name: "Protección de IP"
    description: "Identificar, proteger y gestionar la propiedad intelectual generada a través del ciclo de innovación."
    source_hash: sha256-61ef19429576caef
  BP-1030.60.10:
    name: "Identificar IP patentable"
    description: "Revisar innovaciones por novedad, utilidad y no-obviedad; identificar invenciones candidatas para patentamiento."
    source_hash: sha256-1bda5b069a27694a
  BP-1030.60.20:
    name: "Presentar y prosecutar patentes"
    description: "Presentar solicitudes provisionales y completas de patente; gestionar prosecution hasta otorgamiento a través de jurisdicciones."
    source_hash: sha256-f6bb1449f35764c6
  BP-1030.60.30:
    name: "Gestionar trade secrets y trademarks"
    description: "Identificar material de trade-secret y activos de marca; aplicar protección (NDAs, controles de acceso, registros)."
    source_hash: sha256-5618df73b3f9460a
  BP-1030.70:
    name: "Launch readiness"
    description: "Preparar para el launch al mercado — go-to-market, manufactura, supply chain, canales, soporte, capacitación."
    source_hash: sha256-7421f1a483dcc4f8
  BP-1030.70.10:
    name: "Construir plan go-to-market"
    description: "Desarrollar el plan GTM — posicionamiento, pricing, canales, sales enablement, campañas de marketing — para la ventana de launch."
    source_hash: sha256-6258e6325e861f8d
  BP-1030.70.20:
    name: "Hacer ramp de manufactura o entrega de servicio"
    description: "Levantar capacidad de manufactura o readiness de entrega de servicio — equipo, capacitación, suministro, certificaciones."
    source_hash: sha256-176d0f039e4a2315
  BP-1030.70.30:
    name: "Capacitar ventas y soporte"
    description: "Capacitar a equipos de ventas, partners y soporte sobre el nuevo producto/servicio antes del launch."
    source_hash: sha256-30636bf100386a45
  BP-1030.70.40:
    name: "Pasar review de launch readiness"
    description: "Ejecutar el review cross-funcional de launch readiness; cerrar brechas o postergar launch hasta que esté listo."
    source_hash: sha256-5158e4d8c5beec12
  BP-1030.80:
    name: "Introducción al mercado"
    description: "Ejecutar el launch — release, anuncio, venta y soporte del nuevo producto o servicio en mercado."
    source_hash: sha256-fccc929bbdbc1c0e
  BP-1030.80.10:
    name: "Releasear al mercado"
    description: "Cortar el release a través de canales y geografías según el plan de launch; coordinar con PR, partners y suministro."
    source_hash: sha256-595440a14e2c944e
  BP-1030.80.20:
    name: "Ejecutar marketing de launch"
    description: "Ejecutar campañas de launch — publicidad, contenido, eventos, PR, social — según el plan GTM."
    source_hash: sha256-7bef6ca901f65664
  BP-1030.80.30:
    name: "Capturar ventas iniciales"
    description: "Impulsar el motion inicial de ventas vía canales directos, partners y digitales; rastrear conversión para validar la curva de launch."
    source_hash: sha256-d7010f1d15c04462
  BP-1030.90:
    name: "Desempeño post-launch"
    description: "Rastrear desempeño contra business case, capturar feedback del cliente, impulsar mejoras y decidir movimientos de ciclo de vida."
    source_hash: sha256-01cca0985f06a990
  BP-1030.90.10:
    name: "Rastrear KPIs de launch"
    description: "Monitorear adopción, ingresos, margen bruto, NPS y otros KPIs de launch contra el business case para los primeros 30/60/90 días y más allá."
    source_hash: sha256-9749cd117ed6d4c6
  BP-1030.90.20:
    name: "Capturar feedback del cliente"
    description: "Capturar feedback estructurado y no estructurado del cliente en mercado; enrutar al backlog de producto y roadmap."
    source_hash: sha256-eb22fe36b8bf4541
  BP-1030.90.30:
    name: "Planificar mejoras de ciclo de vida"
    description: "Decidir mejoras, fast-follow features o movimientos de pivot basados en evidencia post-launch; alimentar de vuelta a captación de ideas."
    source_hash: sha256-7dd9d530f1896f55
