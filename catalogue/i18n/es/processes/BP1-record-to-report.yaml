kind: business-process
locale: es
source: BP1-record-to-report.yaml
entries:
  BP-1080:
    name: "Registro-a-Reporte"
    description: "Ciclo de cierre financiero desde la captura de transacciones pasando por cierre de sub-libros mayores, conciliación, consolidación, reporting de gestión, reporting estatutario y regulatorio y sign-off de auditoría. Un BP2 por cada stage_name de VS-460."
  BP-1080.10:
    name: "Captura de transacciones"
    description: "Capturar transacciones económicas a través de sistemas fuente al backbone financiero con codificación apropiada."
  BP-1080.10.10:
    name: "Capturar transacciones fuente"
    description: "Capturar transacciones de ventas, compras, nómina, tesorería y otros sistemas fuente en los flujos contables."
  BP-1080.10.20:
    name: "Aplicar codificación contable"
    description: "Aplicar codificación de cuenta, centro de costo y proyecto según el plan de cuentas y la política."
  BP-1080.10.30:
    name: "Validar datos de transacción"
    description: "Ejecutar reglas de validación — completitud, clasificación, divisa, período — y enrutar excepciones para corrección."
  BP-1080.20:
    name: "Cierre de sub-libros mayores"
    description: "Cerrar sub-libros mayores — AR, AP, activos fijos, nómina, tesorería — y postear al libro mayor."
  BP-1080.20.10:
    name: "Cerrar sub-libro mayor de AR"
    description: "Cerrar el sub-libro mayor de cuentas por cobrar; postear el resumen AR-a-GL y reportar saldos abiertos."
  BP-1080.20.20:
    name: "Cerrar sub-libro mayor de AP"
    description: "Cerrar el sub-libro mayor de cuentas por pagar; postear el resumen AP-a-GL y reportar saldos abiertos."
  BP-1080.20.30:
    name: "Cerrar sub-libro mayor de activos fijos"
    description: "Ejecutar depreciación de activos fijos y adquisiciones/bajas; postear al libro mayor."
  BP-1080.20.40:
    name: "Cerrar otros sub-libros mayores"
    description: "Cerrar sub-libros mayores de nómina, tesorería, inventario y proyectos; postear al libro mayor con pista de auditoría."
  BP-1080.30:
    name: "Conciliación y ajustes"
    description: "Conciliar cuentas de balance y procesar ajustes de fin de período para lockear los libros."
  BP-1080.30.10:
    name: "Conciliar cuentas de balance"
    description: "Conciliar cuentas de tesorería, AR, AP, intercompañía, devengados y otras cuentas de balance con el detalle fuente."
  BP-1080.30.20:
    name: "Procesar ajustes de fin de período"
    description: "Procesar devengos, gastos pagados por anticipado, ingresos diferidos y asientos de reclasificación; capturar documentación soporte."
  BP-1080.30.30:
    name: "Resolver variaciones de conciliación"
    description: "Investigar y resolver partidas de conciliación; escalar partidas no resueltas a controllership para castigo o arrastre."
  BP-1080.40:
    name: "Consolidación"
    description: "Consolidar estados financieros a través de entidades legales y divisas; eliminar intercompañía; producir resultados del grupo."
  BP-1080.40.10:
    name: "Convertir saldos en moneda local"
    description: "Convertir saldos en moneda local a la moneda de reporte a las tasas FX apropiadas según la norma contable."
  BP-1080.40.20:
    name: "Eliminar intercompañía"
    description: "Eliminar ventas intercompañía, saldos y ganancias no realizadas según las reglas de consolidación."
  BP-1080.40.30:
    name: "Producir resultados consolidados del grupo"
    description: "Producir el balance, estado de resultados, estado de flujos de efectivo y patrimonio consolidados del grupo; persistir en el sistema de consolidación."
  BP-1080.50:
    name: "Reporting de gestión"
    description: "Producir reportes de gestión internos para el equipo ejecutivo, el consejo y líderes operativos."
  BP-1080.50.10:
    name: "Construir reportes de gestión"
    description: "Construir reportes de gestión — P&L por segmento, centro de costo, producto, cliente; vistas de cash y working capital."
  BP-1080.50.20:
    name: "Analizar variaciones contra plan"
    description: "Analizar variaciones actual vs plan y vs período previo; identificar drivers y acciones correctivas."
  BP-1080.50.30:
    name: "Distribuir el pack de gestión"
    description: "Distribuir el pack de reporting de gestión a ejecutivos y líderes operativos según la cadencia acordada."
  BP-1080.60:
    name: "Reporting estatutario y regulatorio"
    description: "Producir declaraciones estatutarias, regulatorias y fiscales a las autoridades según calendario."
  BP-1080.60.10:
    name: "Preparar cuentas estatutarias"
    description: "Preparar estados financieros estatutarios según GAAP local / NIIF para cada entidad legal de la jurisdicción."
  BP-1080.60.20:
    name: "Presentar declaraciones fiscales"
    description: "Preparar y presentar declaraciones de impuesto corporativo, IVA/GST, retenciones y precios de transferencia por jurisdicción."
  BP-1080.60.30:
    name: "Presentar reportes regulatorios"
    description: "Presentar reportes regulatorios sectoriales (banca, seguros, divulgaciones de empresas listadas) ante los reguladores aplicables."
  BP-1080.70:
    name: "Auditoría y sign-off"
    description: "Soportar auditoría interna y externa; obtener sign-off sobre estados financieros y controles."
  BP-1080.70.10:
    name: "Soportar auditoría externa"
    description: "Proveer evidencia y walk-throughs a auditores externos; resolver consultas de auditoría; responder a hallazgos."
  BP-1080.70.20:
    name: "Soportar auditoría interna"
    description: "Soportar revisiones de auditoría interna sobre cierre financiero, conciliaciones y controles; cerrar hallazgos."
  BP-1080.70.30:
    name: "Obtener sign-off de gestión"
    description: "Obtener sign-off de CFO y CEO sobre estados financieros y representaciones de control SOX o equivalente; briefar al comité de auditoría según protocolo de gobernanza corporativa."
