kind: business-process
locale: es
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-a-Divulgación"
    description: "Ciclo de reporting de sostenibilidad desde estrategia ESG y materialidad pasando por recolección de datos, calidad de datos y aseguramiento, reporting y divulgación, engagement de stakeholders y metas de mejora. Un BP2 por cada stage_name de VS-200."
  BP-1130.10:
    name: "Estrategia ESG y materialidad"
    description: "Establecer ambición ESG y conducir evaluación de doble materialidad para enfocarse en lo que importa."
  BP-1130.10.10:
    name: "Establecer ambición ESG"
    description: "Establecer la ambición ESG y vincularla con la estrategia corporativa; comprometerse con metas net-zero, sociales y de gobernanza."
  BP-1130.10.20:
    name: "Realizar evaluación de doble materialidad"
    description: "Realizar evaluación de doble materialidad para identificar temas materiales — materialidad financiera y materialidad de impacto."
  BP-1130.20:
    name: "Recolección de datos"
    description: "Recolectar datos ESG — emisiones, energía, agua, residuos, sociales, gobernanza — a lo largo de la cadena de valor."
  BP-1130.20.10:
    name: "Recolectar datos ambientales"
    description: "Recolectar emisiones (Alcances 1/2/3), energía, agua, residuos, biodiversidad y datos de contaminación de las operaciones."
  BP-1130.20.20:
    name: "Recolectar datos sociales"
    description: "Recolectar datos de fuerza laboral, salud y seguridad, diversidad, comunidad y derechos humanos según temas materiales."
  BP-1130.20.30:
    name: "Recolectar datos de gobernanza"
    description: "Recolectar datos de gobernanza — composición del consejo, ética, anti-soborno, remuneración ejecutiva, conducta de proveedores."
  BP-1130.20.40:
    name: "Recolectar datos de cadena de valor"
    description: "Recolectar datos upstream y downstream de la cadena de valor — emisiones de proveedores, fase de uso del producto, fin de vida."
  BP-1130.30:
    name: "Calidad de datos y aseguramiento"
    description: "Ejecutar controles de calidad de datos y obtener aseguramiento externo sobre los datos divulgados."
  BP-1130.30.10:
    name: "Ejecutar controles de calidad de datos ESG"
    description: "Ejecutar controles de completitud, precisión, consistencia y trazabilidad sobre los datos ESG."
  BP-1130.30.20:
    name: "Obtener aseguramiento externo"
    description: "Contratar proveedor de aseguramiento para aseguramiento limitado o razonable sobre métricas divulgadas según el estándar aplicable."
  BP-1130.40:
    name: "Reporting y divulgación"
    description: "Producir reporte ESG y divulgaciones regulatorias — CSRD/ESRS, SEC clima, GRI, SASB, TCFD, ISSB."
  BP-1130.40.10:
    name: "Construir pack de divulgación ESG"
    description: "Construir el pack de divulgación ESG — narrativa, métricas, notas al pie, mapeos a estándares."
  BP-1130.40.20:
    name: "Presentar divulgaciones regulatorias"
    description: "Presentar divulgaciones obligatorias ESG / sostenibilidad — CSRD/ESRS, SEC clima, taxonomías jurisdiccionales."
  BP-1130.40.30:
    name: "Publicar frameworks voluntarios"
    description: "Publicar divulgaciones voluntarias — GRI, SASB, TCFD, CDP, ISSB — alineadas a temas materiales."
  BP-1130.50:
    name: "Engagement de stakeholders"
    description: "Engagement con stakeholders — inversores, reguladores, clientes, empleados, ONG, comunidades — sobre ESG."
  BP-1130.50.10:
    name: "Engagement con inversores y analistas"
    description: "Engagement con inversores enfocados en ESG y agencias de rating; responder a cuestionarios y ratings."
  BP-1130.50.20:
    name: "Engagement con comunidades y ONG"
    description: "Engagement con comunidades locales, ONG y stakeholders de la sociedad civil sobre impacto y remediación."
  BP-1130.60:
    name: "Metas de mejora"
    description: "Establecer, rastrear y ajustar metas de mejora — emisiones, sociales, gobernanza — a lo largo del horizonte."
  BP-1130.60.10:
    name: "Establecer metas de mejora"
    description: "Establecer science-based targets y otras metas de mejora ESG alineadas a la ambición y temas materiales."
  BP-1130.60.20:
    name: "Rastrear progreso de metas"
    description: "Rastrear progreso contra metas a lo largo del ciclo ESG; hacer aflorar brechas y decidir acción correctiva."
