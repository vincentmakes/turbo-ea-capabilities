kind: business-process
locale: es
source: BP1-procure-to-pay.yaml
entries:
  BP-1010:
    name: "Compra-a-Pago"
    description: "Ciclo de gasto del lado del proveedor de extremo a extremo desde la identificación de la necesidad pasando por sourcing, selección del proveedor, contrato y orden de compra, recepción de bienes o servicios, procesamiento de facturas, pago, conciliación y monitoreo de desempeño del proveedor. Un BP2 por cada stage_name de VS-420."
  BP-1010.10:
    name: "Identificación de necesidad y requisición"
    description: "Capturar, validar y aprobar la demanda interna de bienes o servicios y traducirla en una requisición de compra."
  BP-1010.10.10:
    name: "Identificar necesidad de compra"
    description: "Capturar la demanda de negocio por un bien o servicio de la función solicitante y confirmar que se han considerado alternativas internas."
  BP-1010.10.20:
    name: "Especificar requisitos"
    description: "Convertir la necesidad en una especificación clara — cantidad, calidad, nivel de servicio y restricciones de entrega — contra la cual los proveedores puedan cotizar."
  BP-1010.10.30:
    name: "Levantar requisición de compra"
    description: "Crear la requisición de compra en el sistema de procurement, asignar codificación presupuestaria y someter a aprobación."
  BP-1010.10.40:
    name: "Aprobar requisición de compra"
    description: "Enrutar la requisición a través de la jerarquía de autorización de gasto; capturar decisiones y rechazos del aprobador con motivos."
  BP-1010.20:
    name: "Sourcing"
    description: "Seleccionar la estrategia de sourcing, ejecutar eventos de sourcing (RFx), evaluar respuestas y adjudicar el trabajo."
  BP-1010.20.10:
    name: "Desarrollar estrategia de sourcing por categoría"
    description: "Confirmar la estrategia de la categoría — make-vs-buy, single vs multi-source, restricciones geográficas — que enmarca este evento de sourcing."
  BP-1010.20.20:
    name: "Ejecutar evento de sourcing"
    description: "Emitir RFI/RFP/RFQ a proveedores calificados, gestionar Q&A y recopilar respuestas en el plazo."
  BP-1010.20.30:
    name: "Evaluar respuestas de proveedores"
    description: "Puntuar respuestas contra los criterios de evaluación publicados — TCO, calidad, capacidad, sostenibilidad, riesgo."
  BP-1010.20.40:
    name: "Negociar adjudicación de sourcing"
    description: "Conducir rondas de negociación best-and-final con proveedores en shortlist y finalizar la decisión de adjudicación y su justificación."
  BP-1010.30:
    name: "Selección y onboarding del proveedor"
    description: "Calificar al proveedor adjudicado, ejecutar verificaciones de riesgo y compliance e onboardearlo en datos maestros y sistemas operativos."
  BP-1010.30.10:
    name: "Realizar due diligence del proveedor"
    description: "Ejecutar verificaciones financieras, regulatorias, de sanciones, ESG y ciberseguridad sobre el proveedor adjudicado y documentar riesgos residuales."
  BP-1010.30.20:
    name: "Calificar al proveedor"
    description: "Confirmar que el proveedor cumple los gates de calificación de la categoría — certificaciones, seguros, estándares de calidad — antes de que el onboarding proceda."
  BP-1010.30.30:
    name: "Configurar datos maestros del proveedor"
    description: "Persistir los datos bancarios, fiscales, de dirección y contacto del proveedor en datos maestros con las verificaciones de stewardship apropiadas."
  BP-1010.30.40:
    name: "Onboardear proveedor a sistemas operativos"
    description: "Provisionar al proveedor en P2P, EDI/portal y cualquier sistema específico de la categoría; ejecutar pruebas de integración en transacciones."
  BP-1010.40:
    name: "Contrato y orden de compra"
    description: "Ejecutar el contrato del proveedor y convertir las requisiciones aprobadas en órdenes de compra contra las cuales el proveedor pueda cumplir."
  BP-1010.40.10:
    name: "Negociar contrato del proveedor"
    description: "Negociar términos comerciales, legales y operativos — precios, SLAs, indemnizaciones, control de cambios — y capturar redlines hasta la ejecución."
  BP-1010.40.20:
    name: "Ejecutar contrato del proveedor"
    description: "Capturar firmas autorizadas, persistir el contrato ejecutado en el repositorio de contratos y vincularlo a los datos maestros del proveedor."
  BP-1010.40.30:
    name: "Emitir orden de compra"
    description: "Convertir la requisición aprobada (bajo contrato ejecutado o PO puntual) en una orden de compra firme y transmitirla al proveedor."
  BP-1010.40.40:
    name: "Gestionar cambios en la OC"
    description: "Procesar cambios solicitados por proveedor o comprador — cantidad, fecha, precio — a través del workflow de control de cambios de OC."
  BP-1010.50:
    name: "Recepción de bienes/servicios"
    description: "Recibir bienes o servicios, verificar cantidad y calidad contra la OC y registrar la recepción para el matching de factura aguas abajo."
  BP-1010.50.10:
    name: "Recibir bienes o servicios"
    description: "Tomar recepción física de bienes en el muelle, o sign-off de finalización de servicios prestados, y capturar prueba de entrega."
  BP-1010.50.20:
    name: "Inspeccionar cantidad y calidad"
    description: "Verificar cantidad, condición y conformidad con la especificación de la OC; emitir reportes de no conformidad cuando se detecte faltante."
  BP-1010.50.30:
    name: "Registrar recepción de bienes"
    description: "Registrar la recepción de bienes en el ERP, liberando inventario o reconocimiento de gasto y habilitando el matching de tres vías de facturas."
  BP-1010.50.40:
    name: "Resolver excepciones de recepción"
    description: "Gestionar faltantes, daños o disputas de finalización de servicio con el proveedor; acordar ajustes antes de aceptar la factura."
  BP-1010.60:
    name: "Recepción y verificación de facturas"
    description: "Recibir la factura del proveedor, ejecutar matching de tres vías contra OC y recepción y resolver discrepancias."
  BP-1010.60.10:
    name: "Recibir factura del proveedor"
    description: "Capturar la factura del proveedor vía e-invoicing, EDI, portal o papel; persistir con metadatos del sistema de origen."
  BP-1010.60.20:
    name: "Hacer matching de factura con OC y recepción"
    description: "Ejecutar el matching de tres vías contra OC y recepción de bienes; enrutar excepciones a AP para resolución antes de la autorización de pago."
  BP-1010.60.30:
    name: "Resolver discrepancias de factura"
    description: "Investigar discrepancias de precio, cantidad o términos con comprador y proveedor; capturar notas de crédito o ajustes antes de aprobar."
  BP-1010.60.40:
    name: "Aprobar factura para pago"
    description: "Enrutar la factura matcheada a través de cualquier aprobación requerida (umbral CFO, sign-off de proyecto) y autorizarla para pago."
  BP-1010.70:
    name: "Ejecución del pago"
    description: "Ejecutar el pago al proveedor por el instrumento elegido y enviar aviso de remesa al proveedor."
  BP-1010.70.10:
    name: "Programar corrida de pagos"
    description: "Agrupar facturas aprobadas en una corrida de pagos por fecha de vencimiento, divisa e instrumento; optimizar captura de descuento por pronto pago y float."
  BP-1010.70.20:
    name: "Ejecutar pago"
    description: "Desembolsar vía transferencia, ACH, virtual card, cheque o e-payment; persistir confirmaciones bancarias de tesorería."
  BP-1010.70.30:
    name: "Enviar aviso de remesa"
    description: "Notificar al proveedor del pago con detalle de remesa línea por línea para que pueda aplicar contra sus AR abiertas."
  BP-1010.80:
    name: "Conciliación"
    description: "Conciliar el sub-libro mayor de AP con el libro mayor general y con el banco, resolviendo variaciones antes del cierre de período."
  BP-1010.80.10:
    name: "Conciliar AP con libro mayor"
    description: "Hacer rolling-forward del sub-libro mayor de AP y conciliar saldos con cuentas de control de GL, investigando cualquier variación."
  BP-1010.80.20:
    name: "Conciliar pagos con banco"
    description: "Hacer matching de corridas de pagos con extractos bancarios; investigar cheques no cobrados, ACH retornados, timing FX y variaciones de cargos bancarios."
  BP-1010.80.30:
    name: "Resolver variaciones de conciliación"
    description: "Llevar variaciones a la causa raíz — pago duplicado, asiento mal posteado, crédito de proveedor no aplicado — y postear asientos correctivos."
  BP-1010.90:
    name: "Monitoreo de desempeño del proveedor"
    description: "Rastrear el desempeño del proveedor contra SLAs y KPIs contractuales, ejecutar scorecards y gestionar acciones correctivas."
  BP-1010.90.10:
    name: "Rastrear KPIs del proveedor"
    description: "Recolectar datos operativos sobre calidad, entrega a tiempo, fill rate y cumplimiento de SLA; persistir para generación de scorecard."
  BP-1010.90.20:
    name: "Emitir scorecard del proveedor"
    description: "Producir y compartir la scorecard periódica del proveedor con el proveedor y la gestión interna de categoría; capturar feedback del proveedor."
  BP-1010.90.30:
    name: "Gestionar acciones correctivas con proveedores"
    description: "Abrir, rastrear y cerrar planes de acción correctiva con proveedores de bajo desempeño; escalar a remedios contractuales si la falta persiste."
