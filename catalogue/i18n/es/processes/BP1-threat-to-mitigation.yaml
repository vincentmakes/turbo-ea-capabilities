kind: business-process
locale: es
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "Amenaza-a-Mitigación"
    description: "Ciclo operativo de ciberseguridad desde la definición de postura pasando por threat intelligence, descubrimiento de vulnerabilidades, detección, respuesta a incidentes, endurecimiento de identidad y acceso, y concientización. Un BP2 por cada stage_name de VS-600."
    source_hash: sha256-62cfa323d63dbb61
  BP-1150.10:
    name: "Definición de postura de seguridad"
    description: "Definir postura de seguridad, baseline de controles y madurez objetivo para la empresa."
    source_hash: sha256-285a1bef4d6d76a0
  BP-1150.10.10:
    name: "Definir estrategia de seguridad"
    description: "Definir estrategia de ciberseguridad — apetito de riesgo, madurez objetivo, framework (NIST CSF, ISO 27001)."
    source_hash: sha256-2981098fcc513191
  BP-1150.10.20:
    name: "Establecer baseline de controles"
    description: "Establecer el baseline de controles para la empresa; alinear a frameworks de control y regulación aplicable."
    source_hash: sha256-63384bd7bbe11517
  BP-1150.20:
    name: "Threat intelligence"
    description: "Recolectar, analizar y diseminar threat intelligence a defensores y tomadores de decisión."
    source_hash: sha256-e4b50b0b5b6967dc
  BP-1150.20.10:
    name: "Recolectar threat intelligence"
    description: "Recolectar threat intelligence de sensores internos, feeds ISAC, vendors y OSINT."
    source_hash: sha256-25a4ebda6df7a42c
  BP-1150.20.20:
    name: "Analizar y diseminar inteligencia"
    description: "Analizar inteligencia por relevancia y operacionalizarla — IOCs, hipótesis de hunt, briefings."
    source_hash: sha256-8dc002ed9ddc3a76
  BP-1150.30:
    name: "Descubrimiento de vulnerabilidades"
    description: "Descubrir vulnerabilidades — escaneos, pen tests, bug bounty, code review — e impulsar remediación."
    source_hash: sha256-1cd2e38ea225310b
  BP-1150.30.10:
    name: "Ejecutar escaneos de vulnerabilidades"
    description: "Ejecutar escaneos continuos de vulnerabilidades a través de infraestructura, aplicaciones y workloads cloud."
    source_hash: sha256-3d007f831d2f79fc
  BP-1150.30.20:
    name: "Ejecutar pruebas de penetración"
    description: "Ejecutar pruebas de penetración periódicas y event-driven; capturar hallazgos explotables y remediaciones."
    source_hash: sha256-2201a76850035e2c
  BP-1150.30.30:
    name: "Impulsar remediación de vulnerabilidades"
    description: "Priorizar vulnerabilidades por explotabilidad y criticidad de activo; rastrear remediación contra SLA."
    source_hash: sha256-005fa7631055e776
  BP-1150.40:
    name: "Detección"
    description: "Detectar eventos de seguridad mediante monitoreo, analytics, threat hunting y baselines de comportamiento."
    source_hash: sha256-5b45b06eb911ec76
  BP-1150.40.10:
    name: "Operar monitoreo de seguridad"
    description: "Operar el SOC — SIEM, EDR, XDR, detección de red — para monitorear eventos de seguridad 24/7."
    source_hash: sha256-585fc4acb622dda1
  BP-1150.40.20:
    name: "Triagear e investigar alertas"
    description: "Triagear e investigar alertas; escalar incidentes confirmados; cerrar falsos positivos."
    source_hash: sha256-7d2b0bd5673e3f73
  BP-1150.40.30:
    name: "Cazar amenazas"
    description: "Ejecutar threat hunts proactivos sobre hipótesis derivadas de inteligencia y TTPs emergentes."
    source_hash: sha256-2ffda774c0958b04
  BP-1150.50:
    name: "Respuesta a incidentes"
    description: "Responder a incidentes de seguridad confirmados — contener, erradicar, recuperar y aprender."
    source_hash: sha256-d8dfacbd546cd220
  BP-1150.50.10:
    name: "Contener incidente"
    description: "Contener el incidente — aislar sistemas afectados, revocar credenciales, bloquear tráfico — para detener la propagación."
    source_hash: sha256-e08d702bed938c2b
  BP-1150.50.20:
    name: "Erradicar amenaza"
    description: "Erradicar la amenaza — remover malware, parchear vulnerabilidad, cerrar mecanismo de persistencia."
    source_hash: sha256-cd617fc1c8cb81cf
  BP-1150.50.30:
    name: "Recuperar operaciones"
    description: "Recuperar sistemas y operaciones afectados a estado known-good; validar antes de retornar al servicio."
    source_hash: sha256-811a7311f022d96f
  BP-1150.50.40:
    name: "Notificar y reportar"
    description: "Notificar a reguladores, clientes y partes afectadas según obligaciones de breach notification y protocolo."
    source_hash: sha256-26950b7503501bb9
  BP-1150.60:
    name: "Endurecimiento de identidad y acceso"
    description: "Endurecer identidad y acceso — IAM, MFA, privileged access — para prevenir rutas de ataque basadas en identidad."
    source_hash: sha256-72dbc7762816a757
  BP-1150.60.10:
    name: "Gestionar ciclo de vida de identidad"
    description: "Gestionar el ciclo de vida de identidad — provisioning, cambio de rol, deprovisioning — para empleados, contractors y máquinas."
    source_hash: sha256-227f2ed8620f69a0
  BP-1150.60.20:
    name: "Imponer controles de autenticación"
    description: "Imponer MFA, conditional access y autenticación basada en riesgo en todas las rutas de acceso."
    source_hash: sha256-06480b7b3357d537
  BP-1150.60.30:
    name: "Gobernar acceso privilegiado"
    description: "Gobernar acceso privilegiado — vault, elevación just-in-time, monitoreo de sesión, re-atestación periódica."
    source_hash: sha256-f89226ca9d7688a4
  BP-1150.70:
    name: "Concientización y lecciones aprendidas"
    description: "Ejecutar concientización de seguridad en la fuerza laboral; capturar lecciones de incidentes y ejercicios."
    source_hash: sha256-520072a406ecbde5
  BP-1150.70.10:
    name: "Ejecutar concientización de seguridad"
    description: "Ejecutar capacitación de concientización de seguridad, simulaciones de phishing y capacitación dirigida por rol."
    source_hash: sha256-9a21fcb8f5340c81
  BP-1150.70.20:
    name: "Capturar y aplicar lecciones"
    description: "Capturar lecciones de incidentes, ejercicios y reportes de brechas; aplicar a controles, capacitación, runbooks."
    source_hash: sha256-ecb7a0e28fb3b9af
