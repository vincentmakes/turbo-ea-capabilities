kind: business-process
locale: es
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Riesgo-a-Mitigación"
    description: "Ciclo de gestión de riesgo empresarial desde el encuadre del apetito de riesgo pasando por identificación, evaluación, tratamiento, monitoreo y reporte de riesgos. Un BP2 por cada stage_name de VS-500."
    source_hash: sha256-494ddf222f3c79d7
  BP-1110.10:
    name: "Apetito y framework de riesgo"
    description: "Establecer apetito de riesgo y tolerancias; definir el framework, taxonomía y gobernanza de gestión de riesgo empresarial."
    source_hash: sha256-5ed438707cfc47f0
  BP-1110.10.10:
    name: "Establecer apetito de riesgo"
    description: "Establecer declaraciones de apetito de riesgo empresarial y umbrales de tolerancia por categoría de riesgo; ratificar con el consejo."
    source_hash: sha256-2702c26d79adb56d
  BP-1110.10.20:
    name: "Definir framework de riesgo"
    description: "Definir el framework ERM — taxonomía, foros de gobernanza, roles, ciclo de vida — bajo COSO ERM e ISO 31000."
    source_hash: sha256-975111890e3db132
  BP-1110.20:
    name: "Identificación de riesgos"
    description: "Identificar riesgos empresariales en dominios estratégicos, operativos, financieros, regulatorios y emergentes."
    source_hash: sha256-c458af5588d1358c
  BP-1110.20.10:
    name: "Conducir talleres de riesgo"
    description: "Conducir talleres estructurados para hacer aflorar riesgos en el negocio con dueños y SMEs."
    source_hash: sha256-98c4f264e792dc22
  BP-1110.20.20:
    name: "Escanear riesgos externos"
    description: "Escanear fuentes externas — regulatorias, de mercado, geopolíticas, ambientales — buscando señales de riesgo emergente."
    source_hash: sha256-6ed46d7d6b53c706
  BP-1110.20.30:
    name: "Capturar inventario de riesgos"
    description: "Persistir riesgos identificados en el registro de riesgos empresariales con dueño, categoría y evaluación inicial."
    source_hash: sha256-982ce6599d21e9f5
  BP-1110.30:
    name: "Evaluación de riesgos"
    description: "Evaluar riesgos identificados por probabilidad, impacto y velocidad; calificar riesgo inherente y residual."
    source_hash: sha256-68ad48200248cad9
  BP-1110.30.10:
    name: "Puntuar probabilidad e impacto"
    description: "Puntuar la probabilidad e impacto de cada riesgo usando métodos cualitativos y cuantitativos según el framework."
    source_hash: sha256-d19d95f00f313a43
  BP-1110.30.20:
    name: "Calificar riesgo inherente y residual"
    description: "Calcular el rating de riesgo inherente y, tras considerar controles existentes, el rating residual."
    source_hash: sha256-62d82e648198bd19
  BP-1110.30.30:
    name: "Priorizar riesgos"
    description: "Priorizar riesgos para tratamiento en base a rating residual, apetito y relevancia estratégica."
    source_hash: sha256-bae4d88342581ab3
  BP-1110.40:
    name: "Tratamiento y diseño de controles"
    description: "Decidir tratamiento — aceptar, evitar, mitigar, transferir — y diseñar o fortalecer controles."
    source_hash: sha256-a53b334a45df6a03
  BP-1110.40.10:
    name: "Decidir tratamiento del riesgo"
    description: "Decidir tratamiento por riesgo — aceptar, evitar, mitigar, transferir (seguros, contractual, hedging)."
    source_hash: sha256-a3831e0126cf6e78
  BP-1110.40.20:
    name: "Diseñar controles"
    description: "Diseñar o fortalecer controles — preventivos, detectivos, correctivos — para llevar el riesgo residual al apetito."
    source_hash: sha256-5a8597b33882eb25
  BP-1110.40.30:
    name: "Implementar plan de tratamiento"
    description: "Implementar el plan de tratamiento; asignar dueños, plazos y evidencia de verificación."
    source_hash: sha256-d1b6ee2996ec0f69
  BP-1110.50:
    name: "Monitoreo"
    description: "Monitorear riesgos y controles — tracking de KRI, prueba de controles, monitoreo de patrones de incidentes."
    source_hash: sha256-31343c537ab94347
  BP-1110.50.10:
    name: "Rastrear key risk indicators"
    description: "Rastrear KRIs y señales de riesgo emergente; disparar umbrales y rutas de escalación."
    source_hash: sha256-6998b92c9e955c6c
  BP-1110.50.20:
    name: "Probar controles"
    description: "Probar la efectividad de diseño y operativa de controles; calificar excepciones; impulsar remediación."
    source_hash: sha256-144bcd0032a31a00
  BP-1110.50.30:
    name: "Monitorear patrones de incidentes"
    description: "Monitorear patrones de incidentes, near-misses y eventos de pérdida; refinar las vistas de riesgo y control en consecuencia."
    source_hash: sha256-94b91d87039665ec
  BP-1110.60:
    name: "Reporte y escalación"
    description: "Reportar el riesgo empresarial a foros ejecutivos, al consejo y a reguladores; escalar incumplimientos."
    source_hash: sha256-440701f79d5734c8
  BP-1110.60.10:
    name: "Producir reporte de riesgo"
    description: "Producir el reporte periódico de riesgo empresarial — dashboards, heat maps, narrativas de top-risks."
    source_hash: sha256-a65872e6f0fd82e1
  BP-1110.60.20:
    name: "Briefar a ejecutivos y consejo"
    description: "Briefar al comité ejecutivo de riesgo y al comité de riesgo del consejo; capturar decisiones y dirección."
    source_hash: sha256-7339dc20573eddab
  BP-1110.60.30:
    name: "Escalar incumplimientos"
    description: "Escalar incumplimientos de apetito e incidentes de alta velocidad según protocolo; notificar reguladores donde se requiera."
    source_hash: sha256-afb51b25de2f12a5
