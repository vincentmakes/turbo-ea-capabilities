kind: business-process
locale: es
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "Contratación-a-Jubilación"
    description: "Ciclo de vida del colaborador de extremo a extremo desde planeación de fuerza laboral pasando por sourcing, selección, onboarding, performance y desarrollo, administración de compensación y beneficios, experiencia del colaborador, movilidad interna y offboarding. Un BP2 por cada stage_name de VS-280."
    source_hash: sha256-09ffdeb0d20eb666
  BP-1020.10:
    name: "Planeación de fuerza laboral"
    description: "Pronosticar necesidades de fuerza laboral contra la estrategia y la oferta actual, identificar brechas de competencias y planificar movimientos de contratación, movilidad y salida necesarios para cerrarlas."
    source_hash: sha256-8ee05419330812e0
  BP-1020.10.10:
    name: "Pronosticar demanda de fuerza laboral"
    description: "Traducir el plan de negocio en demanda de headcount, competencias y capacidad por equipo, rol y horizonte temporal."
    source_hash: sha256-b13cd46fc052b75b
  BP-1020.10.20:
    name: "Evaluar oferta de fuerza laboral"
    description: "Inventariar colaboradores actuales, contractors y movimientos en curso; evaluar competencias contra demanda para hacer aflorar brechas y excedentes."
    source_hash: sha256-9aa3173db35ae515
  BP-1020.10.30:
    name: "Construir plan de fuerza laboral"
    description: "Diseñar el plan integrado — contratar, desarrollar, redesplegar, salir — para cerrar la brecha; secuenciar movimientos con presupuesto y aprobaciones."
    source_hash: sha256-05868c274352d2bf
  BP-1020.20:
    name: "Sourcing y atracción"
    description: "Identificar y atraer candidatos vía employer brand, canales de sourcing y outreach directo."
    source_hash: sha256-c9f25567ef00b334
  BP-1020.20.10:
    name: "Desarrollar employer brand"
    description: "Posicionar la propuesta de valor de employer brand y los mensajes usados a través de canales para atraer segmentos objetivo de talento."
    source_hash: sha256-301153251b07415f
  BP-1020.20.20:
    name: "Sourcear candidatos"
    description: "Sourcear vía job boards, redes sociales, referidos, agencias y outreach directo; persistir candidatos en el ATS."
    source_hash: sha256-d2e9732fbea74c90
  BP-1020.20.30:
    name: "Gestionar talent communities"
    description: "Mantener relaciones con candidatos en talent pools y comunidades para roles evergreen y pipelines."
    source_hash: sha256-0d81fb41f934c50b
  BP-1020.30:
    name: "Selección y contratación"
    description: "Filtrar, evaluar, entrevistar y seleccionar candidatos; ejecutar verificaciones pre-contratación; hacer y obtener aceptación de la oferta."
    source_hash: sha256-05bfafa6ba03c777
  BP-1020.30.10:
    name: "Filtrar y preseleccionar candidatos"
    description: "Aplicar criterios de filtrado a candidaturas entrantes; preseleccionar para entrevista basándose en ajuste y calificaciones."
    source_hash: sha256-cb5a307727a052bc
  BP-1020.30.20:
    name: "Conducir evaluaciones y entrevistas"
    description: "Conducir entrevistas estructuradas y evaluaciones de competencias; consolidar feedback de evaluadores en una decisión de contratación."
    source_hash: sha256-3d521eea12b26cfa
  BP-1020.30.30:
    name: "Realizar verificaciones pre-contratación"
    description: "Ejecutar verificaciones de background, referencias y derecho a trabajar según jurisdicción y riesgo del puesto."
    source_hash: sha256-19a67bb8129a9e6a
  BP-1020.30.40:
    name: "Hacer y negociar oferta"
    description: "Construir la oferta (compensación, equity, fecha de inicio), negociar con el candidato y capturar la aceptación."
    source_hash: sha256-761e6d7b309b32d4
  BP-1020.30.50:
    name: "Contratar al colaborador"
    description: "Ejecutar el contrato laboral, crear el registro del colaborador en el HRIS y disparar workflows de onboarding aguas abajo."
    source_hash: sha256-d80a4476cf0e5849
  BP-1020.40:
    name: "Onboarding"
    description: "Hacer entrar al nuevo colaborador en la organización — bienvenida, formalidades, equipamiento, capacitación e integración."
    source_hash: sha256-f60d0cdc7e828a78
  BP-1020.40.10:
    name: "Provisionar equipamiento y accesos"
    description: "Entregar laptop, accesos a instalaciones, credenciales de sistema y cualquier equipamiento específico al rol antes del día 1."
    source_hash: sha256-7c434b47b861c4de
  BP-1020.40.20:
    name: "Completar formalidades de onboarding"
    description: "Capturar formalidades estatutarias de contratación — formularios fiscales, inscripción a beneficios, acuses de políticas — para compliance."
    source_hash: sha256-ddbf6f961bce99c1
  BP-1020.40.30:
    name: "Entregar programa de onboarding"
    description: "Ejecutar el camino estructurado de onboarding — orientación, capacitación al rol, check-ins con manager — sobre los primeros 30/60/90 días."
    source_hash: sha256-ee4ee7e3818020aa
  BP-1020.40.40:
    name: "Confirmar finalización de onboarding"
    description: "Validar que el nuevo colaborador completó todos los hitos de onboarding requeridos y está plenamente operacional."
    source_hash: sha256-0341b621099346a9
  BP-1020.50:
    name: "Performance y desarrollo"
    description: "Establecer objetivos, dar feedback, conducir reviews formales, identificar necesidades de desarrollo y entregar aprendizaje y coaching."
    source_hash: sha256-7f4f873f09922c08
  BP-1020.50.10:
    name: "Establecer objetivos de performance"
    description: "Cascadear objetivos de negocio a objetivos individuales al inicio del ciclo; alinear con prioridades de equipo y función."
    source_hash: sha256-6d6c3da452126277
  BP-1020.50.20:
    name: "Proveer feedback continuo"
    description: "Sostener conversaciones 1:1 regulares y feedback continuo entre managers y colaboradores a lo largo del ciclo."
    source_hash: sha256-108b0046db668289
  BP-1020.50.30:
    name: "Conducir review de performance"
    description: "Ejecutar el review formal del ciclo — autoevaluación, review de manager, calibración — para determinar ratings y consecuencias."
    source_hash: sha256-672da1819702f401
  BP-1020.50.40:
    name: "Identificar necesidades de desarrollo"
    description: "Identificar brechas de competencias respecto al rol actual y futuro; capturarlas en planes de desarrollo vinculados a intervenciones de capacitación."
    source_hash: sha256-0c9679c589077ab9
  BP-1020.50.50:
    name: "Entregar aprendizaje y coaching"
    description: "Ejecutar programas de capacitación, coaching on-the-job, mentoría y desarrollo por asignación; rastrear finalización e impacto."
    source_hash: sha256-45e4c4dda86fdd30
  BP-1020.60:
    name: "Administración de compensación y beneficios"
    description: "Administrar salario base, compensación variable, equity y beneficios a lo largo del ciclo de vida; ejecutar review salarial y handoff a nómina."
    source_hash: sha256-ed60011d8ab65f0e
  BP-1020.60.10:
    name: "Administrar compensación fija y variable"
    description: "Mantener bandas salariales, tasas individuales y planes de compensación variable; disparar actualizaciones de nómina por promoción, transferencia o cambio de tasa."
    source_hash: sha256-c45df0159b0099aa
  BP-1020.60.20:
    name: "Conducir ciclo de review salarial"
    description: "Conducir el proceso de review salarial anual o off-cycle; aplicar guidelines presupuestarios, propuestas de manager y aprobaciones."
    source_hash: sha256-c01fd88d6f4da442
  BP-1020.60.30:
    name: "Administrar inscripción a beneficios"
    description: "Conducir inscripción en open enrolment y eventos calificantes para salud, retiro y otros beneficios; reconciliar con flujos de proveedores."
    source_hash: sha256-09055d65dc34c179
  BP-1020.60.40:
    name: "Gestionar programas de equity"
    description: "Otorgar, vestear y ejercer equity según las reglas del plan; coordinar con finanzas, legal y broker de equity."
    source_hash: sha256-31daf9cd9c81ea58
  BP-1020.70:
    name: "Experiencia y engagement del colaborador"
    description: "Ejecutar el programa de engagement, encuestas de employee voice, reconocimiento, wellbeing y experiencia del colaborador en sentido amplio."
    source_hash: sha256-f0e69b4282464c4a
  BP-1020.70.10:
    name: "Conducir encuestas de engagement"
    description: "Conducir encuestas de engagement periódicas y pulse surveys; analizar resultados por equipo, segmento y tendencia."
    source_hash: sha256-78f0d2806028c8ed
  BP-1020.70.20:
    name: "Actuar sobre feedback del colaborador"
    description: "Traducir insights de encuestas en planes de acción a nivel equipo y empresa; rastrear implementación."
    source_hash: sha256-952715be78e361e8
  BP-1020.70.30:
    name: "Operar programas de reconocimiento"
    description: "Ejecutar programas de reconocimiento peer-to-peer y de manager; rastrear participación e impacto en engagement."
    source_hash: sha256-2f1b11504ae2ac03
  BP-1020.70.40:
    name: "Soportar bienestar del colaborador"
    description: "Operar programas de wellbeing — EAP, salud mental, bienestar financiero, ergonomía — y responder a escalaciones."
    source_hash: sha256-04c0e83acf6247b0
  BP-1020.80:
    name: "Movilidad interna y carrera"
    description: "Operar el marketplace interno de empleos, planeación de sucesión y gestión de paths de carrera."
    source_hash: sha256-993c916a1d85bec6
  BP-1020.80.10:
    name: "Operar marketplace interno de empleos"
    description: "Publicar roles internos, gestionar candidaturas internas y conducir entrevistas con candidatos internos."
    source_hash: sha256-43393d28f6a60618
  BP-1020.80.20:
    name: "Conducir planeación de sucesión"
    description: "Identificar sucesores para roles críticos, evaluar su readiness y construir movimientos de desarrollo para cerrar brechas."
    source_hash: sha256-1fdfca6245f60e37
  BP-1020.80.30:
    name: "Gestionar paths de carrera"
    description: "Mantener frameworks de paths de carrera, criterios de progresión de rol y guidelines de movilidad interna para managers y colaboradores."
    source_hash: sha256-dfdd52489ff5725d
  BP-1020.90:
    name: "Offboarding y alumni"
    description: "Gestionar salidas de colaboradores — voluntarias, involuntarias, retiro — y operar el programa de alumni."
    source_hash: sha256-22e8c08197f922e3
  BP-1020.90.10:
    name: "Procesar renuncia o terminación"
    description: "Capturar y procesar la separación — renuncia, despido, terminación económica, retiro — vía el workflow de offboarding."
    source_hash: sha256-a125a10cab774080
  BP-1020.90.20:
    name: "Conducir entrevista de salida"
    description: "Conducir la entrevista de salida para capturar aprendizajes y feedback; integrar en insights de engagement y retención."
    source_hash: sha256-e9c23ee30af51824
  BP-1020.90.30:
    name: "Recuperar equipamiento y accesos"
    description: "Recuperar laptop, badge, credenciales de sistema y cualquier equipamiento específico al rol en el último día de trabajo."
    source_hash: sha256-4c346ccd2649f029
  BP-1020.90.40:
    name: "Operar red de alumni"
    description: "Mantener la red de alumni para re-contratación, referencias y comunidad; ejecutar engagement periódico."
    source_hash: sha256-d66212468362c119
