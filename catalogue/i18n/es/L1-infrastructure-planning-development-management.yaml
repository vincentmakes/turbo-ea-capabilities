locale: es
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Gestión de la planificación y el desarrollo de infraestructuras
    description: |
      Planificación de redes y sistemas a largo plazo, viabilidad y desarrollo de opciones, adquisición de suelo y trazado, autorizaciones y evaluación ambiental, y participación de grupos de interés para desarrollar los esquemas de infraestructura hasta el punto de ejecución.
    in_scope:
      - Planificación de red, capacidad y espacial a largo plazo
      - Estudios de viabilidad y desarrollo de opciones y conceptos
      - Adquisición de suelo, trazado y corredores y servidumbres
      - Autorizaciones urbanísticas y evaluación de impacto ambiental
      - Participación de grupos de interés, la comunidad y los propietarios del suelo
      - Planificación de sostenibilidad, carbono y adaptación climática
    out_of_scope:
      - Desarrollo inmobiliario (BC-4900)
      - Ejecución de la construcción (BC-5040)
      - Permisos operativos y aprobaciones normativas (BC-5110)
      - Diseño de ingeniería de detalle y producción BIM
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: Planificación de red y sistema
    description: |
      Planificación a largo plazo de las redes y los sistemas de infraestructura para atender la demanda prevista y las necesidades de capacidad.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Previsión de la demanda
    description: |
      Previsión de la demanda y la utilización a largo plazo para dimensionar las necesidades futuras de infraestructura.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Planificación de la capacidad de red
    description: |
      Planificación de la capacidad de red y sistema para cerrar las brechas entre la demanda y la provisión disponible.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: Planificación espacial y de corredores
    description: |
      Planificación espacial y de corredores para reservar suelo y alinear los esquemas con la política de usos del suelo.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Planificación maestra
    description: |
      Desarrollo de máster planes integrados que coordinan los esquemas a través de una red o región.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: Viabilidad y desarrollo de opciones
    description: |
      Evaluación de la viabilidad y desarrollo de opciones y conceptos para los esquemas de infraestructura candidatos.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Estudios de viabilidad
    description: |
      Estudios que establecen la viabilidad técnica, económica y de ejecución de los esquemas candidatos.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Desarrollo de opciones
    description: |
      Desarrollo y comparación de las opciones de esquema frente a los objetivos y las restricciones.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Selección del concepto
    description: |
      Selección del concepto preferido para llevarlo adelante hacia el diseño y la ejecución.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Evaluación de la constructibilidad
    description: |
      Evaluación de la constructibilidad y el riesgo de ejecución para configurar conceptos de esquema viables.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: Gestión de suelo y trazado
    description: |
      Selección y adquisición del suelo, los trazados y los derechos de acceso necesarios para ejecutar los esquemas de infraestructura.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: Selección de trazado y corredor
    description: |
      Selección de trazados y corredores que equilibren coste, impacto y capacidad de ejecución.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: Adquisición y agrupación de suelo
    description: |
      Adquisición y agrupación de las parcelas de suelo necesarias para ejecutar un esquema.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: Servidumbres de paso y servidumbres
    description: |
      Obtención de servidumbres de paso, servidumbres y derechos de acceso sobre suelo de terceros.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Gestión de la expropiación forzosa
    description: |
      Gestión de la expropiación forzosa y la compensación asociada para asegurar el suelo requerido.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: Autorizaciones y evaluación ambiental
    description: |
      Obtención de las autorizaciones urbanísticas y realización de las evaluaciones ambientales y de patrimonio para los esquemas de infraestructura.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Gestión de autorizaciones urbanísticas
    description: |
      Gestión de las solicitudes y autorizaciones urbanísticas hasta su resolución.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Evaluación de impacto ambiental
    description: |
      Evaluación de los impactos ambientales y las medidas correctoras para respaldar las decisiones de autorización.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: Evaluación de ecología y patrimonio
    description: |
      Evaluación de las restricciones ecológicas y de patrimonio que afectan al diseño y la autorización del esquema.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Órdenes de autorización de desarrollo
    description: |
      Preparación y gestión de las órdenes de autorización de desarrollo para grandes esquemas de infraestructura.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: Participación de grupos de interés y la comunidad
    description: |
      Participación con las comunidades, los grupos de interés y los propietarios del suelo para generar apoyo y gestionar las objeciones a los esquemas.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Consulta a la comunidad
    description: |
      Consulta con las comunidades afectadas para informar y configurar las propuestas de esquema.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: Mapeo y participación de grupos de interés
    description: |
      Mapeo y participación de los grupos de interés a lo largo del ciclo de vida del esquema.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Gestión de audiencias públicas
    description: |
      Gestión de las audiencias públicas y los exámenes de las propuestas de esquema.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: Enlace con propietarios y vecinos
    description: |
      Enlace con los propietarios del suelo y los vecinos para resolver inquietudes y asegurar la cooperación.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: Planificación de sostenibilidad y clima
    description: |
      Integración de la sostenibilidad, el carbono y la resiliencia climática en la planificación y el diseño de los esquemas de infraestructura.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Planificación del carbono de ciclo de vida completo
    description: |
      Planificación para reducir el carbono de ciclo de vida completo en el diseño y la ejecución del esquema.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: Planificación de biodiversidad y ganancia neta
    description: |
      Planificación para proteger la biodiversidad y aportar una ganancia neta medible.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Planificación de la adaptación climática
    description: |
      Planificación de la resiliencia y la adaptación climática de los activos de infraestructura.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Estándares de diseño sostenible
    description: |
      Adopción de estándares de diseño sostenible y marcos de certificación para los esquemas.
    source_hash: sha256-5942740434ce459c
metadata:
