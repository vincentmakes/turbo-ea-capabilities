locale: es
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Gestión del aprovisionamiento y los contratos de infraestructura
    description: |
      Estrategia de aprovisionamiento, licitación y administración de contratos para la ejecución de infraestructura, incluyendo la gestión comercial y de mediciones, las modificaciones y reclamaciones, y la gestión de subcontratistas y de la cadena de suministro.
    in_scope:
      - Estrategia de aprovisionamiento, paquetización y selección de modalidad de contrato
      - Licitación, gestión de ofertas y precalificación
      - Formalización del contrato, administración y certificación de pagos
      - Gestión comercial, de mediciones y de valoración
      - Gestión de modificaciones, eventos compensables y reclamaciones
      - Aprovisionamiento y desempeño de subcontratistas y de la cadena de suministro
    out_of_scope:
      - Aprovisionamiento corporativo (BC-500)
      - Licitación y estimación de ingeniería (BC-1140)
      - Gestión de relaciones con proveedores (BC-510)
      - Ejecución de obra de construcción y ejecución en obra
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: Estrategia de aprovisionamiento y paquetización
    description: |
      Definición de la estrategia de aprovisionamiento, la paquetización del trabajo y las modalidades de contrato para la ejecución de infraestructura.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Definición de la estrategia de aprovisionamiento
    description: |
      Definición de la estrategia de aprovisionamiento alineada con los objetivos del programa y la capacidad del mercado.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Definición del paquete de trabajo
    description: |
      Estructuración del trabajo en paquetes adecuados a las necesidades del mercado y de la ejecución.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Selección de la modalidad de contrato
    description: |
      Selección de las modalidades y formas de contrato apropiadas para cada paquete.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Participación del mercado de proveedores
    description: |
      Participación temprana con el mercado de proveedores para configurar y contrastar los enfoques de aprovisionamiento.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: Licitación y gestión de ofertas
    description: |
      Preparación, evaluación y adjudicación de licitaciones para obras y servicios de infraestructura.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Preparación de la licitación
    description: |
      Preparación de los documentos y requisitos de licitación para su emisión al mercado.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: Desarrollo y presentación de ofertas
    description: |
      Desarrollo y presentación de ofertas conformes y competitivas cuando se actúa como licitador.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: Evaluación y adjudicación de licitaciones
    description: |
      Evaluación de licitaciones y adjudicación de contratos conforme a criterios definidos.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Gestión de la precalificación
    description: |
      Gestión de la precalificación de proveedores y de las listas de selección.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Administración de contratos
    description: |
      Administración de los contratos de infraestructura a lo largo de la formalización, las obligaciones, el pago y la gobernanza.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Formalización del contrato
    description: |
      Formalización y ejecución de los contratos y de sus acuerdos de apoyo.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Gestión de las obligaciones contractuales
    description: |
      Gestión de las obligaciones contractuales, notificaciones y entregables a lo largo de la ejecución.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Certificación de pagos
    description: |
      Certificación de los pagos debidos conforme a los términos del contrato.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Gobernanza del contrato
    description: |
      Gobernanza del desempeño, el cumplimiento y el cierre del contrato.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: Gestión comercial y de mediciones
    description: |
      Gestión comercial y de mediciones de la medición, la valoración y el coste a lo largo del contrato.
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: Mediciones y medición
    description: |
      Medición y cuantificación de las obras para dar soporte a la valoración y al pago.
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: Gestión de la valoración provisional
    description: |
      Gestión de las valoraciones provisionales y de las solicitudes de pago durante la ejecución.
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: Gestión comercial de costes
    description: |
      Gestión comercial del coste, el margen y la posición de tesorería del contrato.
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: Liquidación de la cuenta final
    description: |
      Acuerdo y liquidación de las cuentas finales a la finalización del contrato.
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: Gestión de modificaciones y reclamaciones
    description: |
      Gestión de las modificaciones, los eventos compensables, las reclamaciones y las disputas que surgen bajo los contratos de infraestructura.
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: Gestión de modificaciones
    description: |
      Gestión de las modificaciones del alcance y de sus consecuencias comerciales.
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: Gestión de eventos compensables
    description: |
      Evaluación y gestión de los eventos compensables bajo el contrato.
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Gestión de reclamaciones
    description: |
      Preparación, defensa y resolución de las reclamaciones contractuales.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Resolución de disputas
    description: |
      Resolución de disputas mediante negociación, adjudicación y procesos formales.
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: Gestión de subcontratistas y de la cadena de suministro
    description: |
      Aprovisionamiento, incorporación y gestión de los subcontratistas y de la cadena de suministro de la ejecución.
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Aprovisionamiento de subcontratistas
    description: |
      Aprovisionamiento y contratación de subcontratistas para los paquetes de ejecución.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: Gestión de paquetes de oficios
    description: |
      Gestión de los paquetes de oficios y de sus interfaces durante la ejecución.
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: Incorporación de la cadena de suministro
    description: |
      Incorporación y verificación de cumplimiento de los socios de la cadena de suministro.
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: Gestión del desempeño de subcontratistas
    description: |
      Seguimiento y gestión del desempeño de los subcontratistas frente al contrato.
    source_hash: sha256-154e39a8ff2b1f3c
metadata:
  translator: claude-ai
  date: "2026-07-16"
