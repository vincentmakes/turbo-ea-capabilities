locale: es
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Gestión de concesiones e ingresos
    description: |
      Gestión de concesiones y colaboraciones público-privadas, tarificación y fijación de precios, recaudación y aseguramiento de ingresos, gestión de subvenciones y subsidios, y alianzas comerciales que monetizan los activos de infraestructura a lo largo del plazo de concesión.
    in_scope:
      - Gestión de acuerdos de concesión y de colaboraciones público-privadas
      - Gestión de tarifas, peajes y precios regulados
      - Recaudación, aseguramiento y control de fugas de ingresos
      - Administración de subvenciones, subsidios y pagos por disponibilidad
      - Alianzas comerciales y desarrollo de ingresos accesorios
      - Monetización de ingresos por suelo y propiedades
    out_of_scope:
      - Gestión de precios corporativa (BC-450)
      - Estrategia de financiación de la inversión (BC-5000)
      - Control regulatorio de precios (BC-5110)
      - Tesorería corporativa y gestión de caja
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: Gestión de concesiones y PPP
    description: |
      Gestión de los acuerdos de concesión y las estructuras de colaboración público-privada a lo largo de su ciclo de vida y sus obligaciones.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Gestión de acuerdos de concesión
    description: |
      Administración de los acuerdos de concesión, sus términos y obligaciones a lo largo del plazo de concesión.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: Estructuración de PPP
    description: |
      Estructuración de los acuerdos de colaboración público-privada y su asignación de riesgos y beneficios.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: Mecanismo de disponibilidad y pago
    description: |
      Diseño y operación de los mecanismos de disponibilidad y pago que rigen la remuneración de la concesión.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Cumplimiento de la concesión
    description: |
      Aseguramiento de que las obligaciones y los estándares de desempeño de la concesión se cumplen a lo largo del acuerdo.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: Gestión de tarifas y precios
    description: |
      Fijación y gobernanza de las tarifas, peajes y precios cobrados por el uso y los servicios de la infraestructura.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: Fijación de tarifas y peajes
    description: |
      Determinación de las tarifas y peajes por el acceso y el uso de la infraestructura.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Estrategia de precios
    description: |
      Definición de la estrategia comercial de precios para los servicios y la capacidad de infraestructura.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Control regulado de precios
    description: |
      Gestión de los precios dentro de los marcos y determinaciones de control regulado de precios.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: Precios dinámicos y por congestión
    description: |
      Aplicación de precios sensibles a la demanda y basados en la congestión para gestionar la utilización y los ingresos.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: Recaudación y aseguramiento de ingresos
    description: |
      Recaudación de los ingresos de la infraestructura y aseguramiento de que el valor facturado se captura y concilia con precisión.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: Cobro y recaudación
    description: |
      Cobro y recaudación de tasas de uso, peajes e ingresos por servicios a los clientes.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Aseguramiento de ingresos
    description: |
      Aseguramiento de que todos los ingresos devengados se facturan, capturan y registran de forma completa.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Gestión de fugas de ingresos
    description: |
      Identificación y recuperación de fugas de ingresos, evasión e infrarrecaudación.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: Liquidación y conciliación
    description: |
      Liquidación y conciliación de los ingresos recaudados entre sistemas y contrapartes.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: Gestión de subvenciones y subsidios
    description: |
      Administración de subvenciones, subsidios y aportaciones públicas que financian la disponibilidad y las operaciones de la infraestructura.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: Administración de subsidios y subvenciones
    description: |
      Administración de los subsidios y subvenciones que apoyan los servicios de infraestructura.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Gestión de pagos por disponibilidad
    description: |
      Gestión de los pagos basados en la disponibilidad, vinculados al desempeño del servicio y de los activos.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Cumplimiento de la financiación pública
    description: |
      Cumplimiento de las condiciones y los requisitos de reporte asociados a la financiación pública.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Gestión de aportaciones públicas
    description: |
      Gestión de las aportaciones públicas de capital y de explotación a la infraestructura.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Gestión de alianzas comerciales
    description: |
      Desarrollo de ingresos de terceros, accesorios y basados en la propiedad mediante alianzas comerciales.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Gestión de ingresos de terceros
    description: |
      Gestión de los ingresos derivados del acceso, los servicios y los acuerdos con terceros.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Gestión de alianzas comerciales
    description: |
      Desarrollo y gestión de alianzas comerciales que generan ingresos para la infraestructura.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Desarrollo de ingresos accesorios
    description: |
      Desarrollo de fuentes de ingresos accesorios y no esenciales en torno a los activos de infraestructura.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: Ingresos por suelo y propiedades
    description: |
      Monetización de las participaciones en suelo y propiedades asociadas a la infraestructura.
    source_hash: sha256-4931ef33faa7594b
metadata:
  translator: claude-ai
  date: "2026-07-16"
