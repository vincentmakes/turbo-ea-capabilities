locale: de
source: L1-business-process-management.yaml
entries:
  BC-930:
    name: Geschäftsprozessmanagement
    description: |
      Disziplin der Gestaltung, Modellierung, Überwachung, Analyse, Optimierung und Steuerung durchgängiger Geschäftsprozesse als verwaltete Vermögensklasse. Behandelt Prozesse als eigenständige Artefakte, unabhängig von den operativen Domänen, die sie ausführen.
    in_scope:
      - Prozessgouvernance über Taxonomie, Eigentümerschaft, Lebenszyklus und Standards
      - Prozesserhebung, BPMN-Modellierung, Dokumentation und Versionierung
      - Prozessleistungs-KPIs, Überwachung und Konformitätsberichterstattung
      - Process Mining inklusive Ereignisprotokollerfassung, Discovery und Konformitätsprüfung
      - Prozess-Redesign, Simulation und Identifikation von Automatisierungschancen
      - Steuerung des Automatisierungsportfolios über Workflow- und RPA-Plattformen
      - Entwurf von Prozesskontrollen und Funktionstrennungs-Modellierung
    out_of_scope:
      - Verbesserungsprojekte über Lean, Six Sigma oder Kaizen (BC-720.50)
      - Domänenspezifische operative Ausführung wie Auftrags-, Schaden- oder Sendungsabwicklung
      - Entwicklung von RPA-Bot-Software und Plattform-Engineering (IT-Lieferfähigkeiten)
      - Ausführung von IT-Servicemanagement-Prozessen (IT-Fähigkeiten der BC-700-Reihe)
      - Geschäftsarchitektur-, Fähigkeiten- und Wertstrommodellierung (BC-170)
    source_hash: sha256-0652fb00b5eb7656
  BC-930.10:
    name: Prozessarchitektur und -governance
    description: |
      Prozesstaxonomie, Eigentümermodell, Lebenszyklusrichtlinie und Erstellungsstandards, die das Prozessportfolio rahmen.
    source_hash: sha256-7095e6f7ba0cd6d2
  BC-930.10.10:
    name: Verwaltung der Prozesstaxonomie
    description: |
      Definition und Pflege des unternehmensweiten Prozessklassifikationsrahmens.
    source_hash: sha256-c73a863553027667
  BC-930.10.20:
    name: Zuweisung der Prozessverantwortung
    description: |
      Zuordnung von Prozesseigentümern, -betreuern und -verwaltern über das Portfolio.
    source_hash: sha256-09c3365b6f8c9bad
  BC-930.10.30:
    name: Lebenszyklusrichtlinie für Prozesse
    description: |
      Richtlinie für Einführung, Pflege, Außerbetriebnahme und Archivierung von Prozessen.
    source_hash: sha256-2243cca49b379b88
  BC-930.10.40:
    name: Prozessstandards und -konventionen
    description: |
      Modellierungsnotationen, Attributstandards und Reviewkonventionen für Prozessartefakte.
    source_hash: sha256-90731d8df472ff96
  BC-930.20:
    name: Prozessmodellierung und -dokumentation
    description: |
      Erhebung, Erstellung, Veröffentlichung und Versionskontrolle von Prozessmodellen und unterstützender Dokumentation.
    source_hash: sha256-1f9a41d45471f350
  BC-930.20.10:
    name: Prozesserhebung und -elizitierung
    description: |
      Workshops, Interviews und Beobachtung zur Erfassung des Ist-Prozesswissens.
    source_hash: sha256-a7c3d01546333905
  BC-930.20.20:
    name: Erstellung von Prozessmodellen
    description: |
      Erstellung von BPMN- und gleichwertigen Prozessmodellen im Modellierungstool.
    source_hash: sha256-841be1a65dd6c45e
  BC-930.20.30:
    name: Veröffentlichung der Prozessdokumentation
    description: |
      Veröffentlichung der Prozessdokumentation für operative Zielgruppen.
    source_hash: sha256-18a095eba2017439
  BC-930.20.40:
    name: Versionierung von Prozessmodellen
    description: |
      Versionskontrolle, Änderungshistorie und Genehmigungsworkflow für Prozessmodelle.
    source_hash: sha256-4dcce221d9996432
  BC-930.30:
    name: Prozessleistungsmessung
    description: |
      Definition, Überwachung und Berichterstattung der Prozessleistung und -konformität.
    source_hash: sha256-365abeeb7555a22d
  BC-930.30.10:
    name: Definition von Prozess-KPIs
    description: |
      Definition von KPIs für Durchlaufzeit, Durchsatz, Qualität und Kosten je Prozess.
    source_hash: sha256-f5cbbea6ae20b4b3
  BC-930.30.20:
    name: Überwachung der Prozessleistung
    description: |
      Operative Dashboards und Alarmierung gegen Prozessleistungsziele.
    source_hash: sha256-81520d22a3dfaf73
  BC-930.30.30:
    name: Berichterstattung zur Prozesskonformität
    description: |
      Berichterstattung der Ausführungskonformität gegenüber dem modellierten Soll-Prozess.
    source_hash: sha256-c586b56d5b11d06d
  BC-930.40:
    name: Process Mining und Discovery
    description: |
      Ereignisprotokollgestützte Discovery, Konformitätsprüfung und Prozessintelligenz.
    source_hash: sha256-be0e48176653c027
  BC-930.40.10:
    name: Erfassung von Ereignisprotokollen
    description: |
      Extraktion, Transformation und Laden von Ereignisprotokollen aus Quellsystemen.
    source_hash: sha256-a176fd496efb0f9f
  BC-930.40.20:
    name: Process-Discovery-Analyse
    description: |
      Algorithmische Rekonstruktion der ausgeführten Prozessvarianten aus Ereignisprotokollen.
    source_hash: sha256-bb5d6f08ae7cbeac
  BC-930.40.30:
    name: Konformitätsprüfung
    description: |
      Vergleich des ausgeführten Verhaltens mit Referenzmodellen und Regelwerken.
    source_hash: sha256-2c8a9aafedeb101b
  BC-930.40.40:
    name: Berichterstattung zur Prozessintelligenz
    description: |
      Berichterstattung gewonnener Erkenntnisse wie Engpässe, Nacharbeit und Variantenwirkung.
    source_hash: sha256-1788a83e6680e4b8
  BC-930.50:
    name: Prozessoptimierung und -redesign
    description: |
      Architektonisches, datengetriebenes Prozess-Redesign einschließlich Simulation und Automatisierungskandidatenanalyse. Abgegrenzt von der Verbesserungsprojektabwicklung unter BC-720.50.
    source_hash: sha256-04f7979530678035
  BC-930.50.10:
    name: Engpassanalyse
    description: |
      Identifikation und Quantifizierung von Engpunkten über Prozessvarianten hinweg.
    source_hash: sha256-53ac0648c025549d
  BC-930.50.20:
    name: Prozesssimulation
    description: |
      Diskrete-Ereignis- und Monte-Carlo-Simulation von Prozessdesignalternativen.
    source_hash: sha256-a5ea0f7269f8f12c
  BC-930.50.30:
    name: Soll-Prozess-Design
    description: |
      Entwurf von Flussabläufen, Kontrollen und Übergaben in redesignten Prozessen.
    source_hash: sha256-8b2d41bf9d4f316f
  BC-930.50.40:
    name: Identifikation von Automatisierungschancen
    description: |
      Identifikation kandidatenfähiger Schritte für Workflow-, RPA- oder KI-basierte Automatisierung.
    source_hash: sha256-0ce6366323bd54d7
  BC-930.60:
    name: Steuerung der Prozessautomatisierung
    description: |
      Steuerung des Automatisierungsportfolios über Workflow-, RPA- und Intelligent-Automation-Plattformen. Schließt Engineering und Betrieb der Plattformen selbst aus.
    source_hash: sha256-e39d402d6410d85b
  BC-930.60.10:
    name: Verwaltung des Automatisierungsportfolios
    description: |
      Bedarfserfassung, Priorisierung und Lebenszyklusmanagement der Automatisierungsbestände.
    source_hash: sha256-5985925314b65a65
  BC-930.60.20:
    name: Steuerung der Workflow-Orchestrierung
    description: |
      Standards und Kontrollen für orchestrierte Workflow-Prozesse über Geschäftssysteme hinweg.
    source_hash: sha256-64dd8a9a708b2c5c
  BC-930.60.30:
    name: Steuerung des RPA-Programms
    description: |
      Steuerung des Programms zur robotergestützten Prozessautomatisierung einschließlich Bot-Eigentümerschaft.
    source_hash: sha256-019dfd4a0b768f38
  BC-930.60.40:
    name: Kontrolle und Audit der Automatisierung
    description: |
      Kontrollrahmen, Überwachung und Audit-Trail über den Automatisierungsbestand.
    source_hash: sha256-cfc01924c2e18c84
  BC-930.70:
    name: Prozessrisiko- und Kontrollmanagement
    description: |
      In Prozessen verankerte Risiken und Kontrollen einschließlich Funktionstrennung. Ergänzt Unternehmensrisiko- und Auditfunktionen, ohne sie zu ersetzen.
    source_hash: sha256-6ca81d1368072127
  BC-930.70.10:
    name: Entwurf von Prozesskontrollen
    description: |
      Entwurf präventiver und detektiver Kontrollen, die in Prozessabläufe eingebettet sind.
    source_hash: sha256-0ad8afa949bf8c0b
  BC-930.70.20:
    name: Modellierung der Funktionstrennung
    description: |
      Modellierung der Funktionstrennungsregeln und Konflikterkennung über Prozesse hinweg.
    source_hash: sha256-57bbc7c0abbfbca9
  BC-930.70.30:
    name: Prüfung von Prozesskontrollen
    description: |
      Periodische Prüfung der Wirksamkeit von Prozesskontrollen und der Ausnahmebehandlung.
    source_hash: sha256-aff15ff1f48a791f
