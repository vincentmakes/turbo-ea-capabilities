locale: de
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Infrastruktur-Investitions- und Portfoliomanagement
    description: |
      Investitionsstrategie, Origination, Bewertung und Kapitalallokation über
      ein Portfolio von Infrastrukturanlagen und Investitionsprojekten.
      Eigentümer- bzw. investorenseitige Disziplin, die entscheidet, welche
      Infrastruktur wie finanziert wird, und die Renditen auf Portfolioebene
      sowie den öffentlichen Wert über den Anlagenlebenszyklus verfolgt.
    in_scope:
      - Infrastruktur-Investitionsstrategie und Sektorfokus
      - Origination und Screening der Deal- und Projekt-Pipeline
      - Business Cases, Optionsbewertung und Kosten-Nutzen-Analyse
      - Priorisierung und Sequenzierung des Investitionsprogramms über das Portfolio
      - Förder- und Finanzierungsstrategie einschließlich Zuschuss- und Projektfinanzierung
      - Nachverfolgung von Portfolioleistung, Nutzen und Wirtschaftlichkeit
    out_of_scope:
      - Unternehmens-Treasury und Unternehmensfinanzierung (BC-210)
      - Unternehmensstrategieformulierung (BC-580)
      - Operative Erlöse, Tarife und Konzessionseinnahmen (BC-5100)
      - Programm- und Projektlieferungssteuerung (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Infrastruktur-Investitionsstrategie
    description: |
      Definition der langfristigen Infrastruktur-Investitionsstrategie, des
      Sektorfokus und der Risikobereitschaft, die bestimmt, wo Kapital
      eingesetzt wird.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: Sektor- und Marktstrategie
    description: |
      Auswahl der anzuvisierenden Infrastruktursektoren und -märkte auf Basis
      von Nachfrage, Politik und Wettbewerbsdynamik.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Definition der Investitionsthese
    description: |
      Ausarbeitung der Investitionsthese und Wertschöpfungslogik für jedes
      anvisierte Infrastruktursegment.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Kapitalallokationsrahmen
    description: |
      Rahmen und Kriterien für die Allokation von Kapital über Sektoren,
      Regionen und Anlageklassen.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Definition der Risikobereitschaft
    description: |
      Definition der Investitionsrisikobereitschaft und der Toleranzschwellen
      für das Infrastrukturportfolio.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: Pipeline- und Originationsmanagement
    description: |
      Origination, Screening und Nachverfolgung von Infrastrukturinvestitions-
      und Projektmöglichkeiten anhand von Investitionskriterien.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Origination von Möglichkeiten
    description: |
      Erschließung von Infrastrukturinvestitions- und Entwicklungsmöglichkeiten
      über Märkte sowie staatliche und proprietäre Kanäle.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: Investitions-Screening und -Priorisierung
    description: |
      Screening und frühe Priorisierung von Möglichkeiten anhand strategischer
      und finanzieller Filter.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: Markt- und Sektorintelligenz
    description: |
      Erhebung und Analyse von Markt-, Nachfrage- und politischen Informationen
      als Grundlage für die Origination.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Pipeline-Nachverfolgung
    description: |
      Nachverfolgung von Möglichkeiten durch Stufentore vom Lead bis zur
      Investitionsentscheidung.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: Business-Case- und Bewertungsmanagement
    description: |
      Entwicklung und Bewertung von Business Cases für Infrastrukturinvestitionen
      einschließlich Optionen und Wertbeurteilung.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Optionsbewertung
    description: |
      Bewertung von Investitions- und Lieferoptionen anhand strategischer Ziele
      und Randbedingungen.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Kosten-Nutzen-Analyse
    description: |
      Quantifizierte Kosten-Nutzen- und volkswirtschaftliche Bewertung möglicher
      Infrastrukturinvestitionen.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: Beurteilung des ökonomischen und sozialen Werts
    description: |
      Beurteilung des weiteren ökonomischen, sozialen und öffentlichen Werts,
      den die Investition liefert.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Investitionsentscheidungs-Gating
    description: |
      Governance-Tore und Freigaben, die den Fortschritt und die zugesagte
      Finanzierung autorisieren.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Priorisierung des Investitionsprogramms
    description: |
      Priorisierung, Ausbalancierung und Sequenzierung von Investitionen über
      das Investitionsprogramm und das Anlagenportfolio.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Portfolio-Priorisierung
    description: |
      Rangfolge möglicher Investitionen anhand von Wert, Risiko und
      strategischem Beitrag.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Kapitalrationierung
    description: |
      Allokation von begrenztem Kapital über konkurrierende
      Investitionsanforderungen.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Portfolio-Ausbalancierung
    description: |
      Ausbalancierung des Portfolios über Risiko-, Sektor- und
      Lebenszyklushorizonte.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Investitionssequenzierung
    description: |
      Phasierung und Sequenzierung von Investitionen zur Steuerung von
      Lieferfähigkeit und Finanzierungsprofilen.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: Förder- und Finanzierungsstrategie
    description: |
      Strategie zur Beschaffung und Strukturierung der Förderung und
      Finanzierung, die zur Lieferung des Infrastrukturprogramms erforderlich
      ist.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Strategie der Förderquellen
    description: |
      Auswahl von Förderquellen über öffentliche, private und
      nutzerfinanzierte Mechanismen.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: Zuschuss- und Fördermittelmanagement
    description: |
      Beschaffung und Verwaltung von Zuschüssen und öffentlichen
      Kapitalbeiträgen.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Strukturierung der Projektfinanzierung
    description: |
      Strukturierung von Projektfinanzierung, Fremd- und Eigenkapital für
      Infrastrukturanlagen.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Strukturierung von Mischfinanzierung
    description: |
      Strukturierung von gemischten öffentlich-privaten und konzessionären
      Finanzierungspaketen.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Portfolio-Leistungsmanagement
    description: |
      Überwachung und Berichterstattung von Renditen, Nutzen und Wert, die das
      Infrastruktur-Investitionsportfolio liefert.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Überwachung der Portfolioleistung
    description: |
      Überwachung der finanziellen und operativen Leistung über das Portfolio.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Nutzennachverfolgung
    description: |
      Nachverfolgung realisierter Nutzen und Ergebnisse anhand der
      Investitions-Business-Cases.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Wirtschaftlichkeitsbeurteilung
    description: |
      Beurteilung der Wirtschaftlichkeit und des Gesamtlebensdauerwerts über das
      Portfolio.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Portfolio-Berichtswesen
    description: |
      Berichterstattung über die Portfolioleistung an Investoren, Vorstände und
      öffentliche Stakeholder.
    source_hash: sha256-35c417c36c5cb686
