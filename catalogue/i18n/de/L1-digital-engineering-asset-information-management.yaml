locale: de
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Digital-Engineering- und Anlageninformationsmanagement
    description: |
      Digital Engineering und strukturierte Anlageninformationen über den
      Lebenszyklus des gebauten Vermögenswerts, umfassend Building Information
      Modelling, die Common Data Environment (CDE), 4D- und 5D-Integration,
      Geodaten- und Vermessungsmanagement sowie Digital-Twin- und
      Anlageninformationsmanagement. Verwandelt Modelle und Daten von der Planung
      über den Bau bis zum Betrieb in ein vertrauenswürdiges Informationsgut.
    in_scope:
      - BIM-Strategie, -Standards sowie Modellkoordination und Kollisionsprüfung
      - Common Data Environment und Management der Informationsanforderungen
      - 4D-Bausequenzierung und 5D-Kostenintegration
      - Management von Geodaten-, Vermessungs- und Reality-Capture-Daten
      - Digital-Twin-Entwicklung und Integration operativer Daten
      - Strukturierte Informationsübergabe über den Anlagenlebenszyklus
    out_of_scope:
      - Ingenieurdokumentenmanagement (BC-1130)
      - Produktlebenszyklusmanagement (BC-820)
      - Unternehmensinformations- und Datenmanagement (BC-610)
      - IT-Plattform- und Anwendungslieferung (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: BIM-Management
    description: |
      Strategie, Standards und Koordination des Building Information Modelling
      über Projekte und Fachdisziplinen.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: BIM-Strategie und -Standards
    description: |
      Definition von BIM-Strategie, -Standards und Informationsprotokollen.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: BIM-Abwicklungsplanung
    description: |
      Planung von BIM-Abwicklung, Rollen und Lieferergebnissen für ein Projekt.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Koordination der Modellerstellung
    description: |
      Koordination der fachspezifischen Modellerstellung nach vereinbarten
      Standards und Terminen.
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: Modellföderation und Kollisionsprüfung
    description: |
      Föderation fachspezifischer Modelle sowie Erkennung und Lösung von
      Kollisionen.
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: Common Data Environment
    description: |
      Management der gemeinsamen Informationsumgebung sowie der Anforderungen,
      Steuerung und des Austauschs von Projektdaten.
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: Management der Common Data Environment
    description: |
      Betrieb der Common Data Environment als einzige Quelle der
      Projektinformationen.
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: Management der Informationsanforderungen
    description: |
      Definition und Management von organisatorischen, anlagenbezogenen und
      austauschbezogenen Informationsanforderungen.
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: Dokumenten- und Datensteuerung
    description: |
      Steuerung, Versionierung und Statusmanagement von Dokumenten und Daten.
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: Datenaustausch und Interoperabilität
    description: |
      Austausch von Informationen über Systeme hinweg mittels offener und
      interoperabler Formate.
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: 4D- und 5D-Integration
    description: |
      Integration von Modellen mit Programm und Kosten zur Unterstützung der
      Bausequenzierung sowie von Mengen- und Kostentransparenz.
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: 4D-Bausequenzierung
    description: |
      Verknüpfung von Modellen mit dem Programm zur Visualisierung und Planung
      von Bausequenzen.
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: 5D-Kostenintegration
    description: |
      Integration von Modelldaten mit Kosten zur Unterstützung von Kalkulation
      und Kostensteuerung.
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: Modellbasierte Mengenermittlung
    description: |
      Ableitung von Mengen direkt aus koordinierten Modellen.
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: Koordination von Planung zu Bau
    description: |
      Koordination von Modellinformationen aus der Planung in die Baulieferung.
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: Geodaten- und Vermessungsmanagement
    description: |
      Management von Geodaten, Vermessungs- und Baugrunddaten, die Planung und
      Bau untermauern.
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: Geodatenmanagement
    description: |
      Management von Geodaten und Kartierungsdaten über den Anlagenbestand.
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: Vermessung und Absteckung
    description: |
      Bereitstellung von Vermessungskontrolle und Absteckung für Bauwerke.
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: Reality Capture und Scanning
    description: |
      Erfassung des Ist-Zustands durch Scanning- und Reality-Capture-Techniken.
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: Geotechnisches Datenmanagement
    description: |
      Management geotechnischer und Baugrunduntersuchungsdaten.
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: Digital Twin und Anlagendaten
    description: |
      Entwicklung von Anlageninformationsmodellen und Digital Twins, die von
      operativen Daten für die genutzte Anlage gespeist werden.
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: Management des Anlageninformationsmodells
    description: |
      Management des Anlageninformationsmodells für die operative Anlage.
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: Digital-Twin-Entwicklung
    description: |
      Entwicklung und Pflege von Digital Twins von Infrastrukturanlagen.
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: Integration operativer Daten
    description: |
      Integration von operativen und Sensordaten in Anlageninformationen und
      Twins.
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: Informationsübergabe
    description: |
      Strukturierte Übergabe von Anlageninformationen aus der Lieferung in den
      Betrieb.
    source_hash: sha256-d849483d22283722
