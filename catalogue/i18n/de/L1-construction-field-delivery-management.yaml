source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Bau- und Baustellenausführungsmanagement
    description: |
      Baustellenausführung von Infrastrukturbauwerken, umfassend
      Baustelleneinrichtung und Mobilisierung, Arbeitsfront- und
      Produktionsmanagement, Behelfsbauwerke, Geräte und Ausrüstung,
      Baustellenmaterialien und Logistik sowie Bauqualität. Die
      Baustellenausführungsdisziplin, die Planung und Programm sicher, produktiv
      und spezifikationsgerecht in gebaute Werke überführt.
    in_scope:
      - Baustelleneinrichtung, Mobilisierung und Bereitstellung temporärer Einrichtungen
      - Arbeitsfrontkoordination, Produktionssequenzierung und Fortschrittsverfolgung
      - Behelfsbauwerke einschließlich Gerüsten, Schalungen und Baugrubensicherung
      - Management von Geräten, Ausrüstung und Hebevorgängen
      - Baustellenmaterialabruf, Lagerung, Logistik und Abfallmanagement
      - Bauqualitätskontrolle, Prüfung und Management von Nichtkonformitäten
    out_of_scope:
      - Ingenieur-Baumanagement (BC-1150)
      - Inbetriebnahme und Übergabe (BC-1160)
      - Ingenieurplanung (BC-1120)
      - Betrieb und Instandhaltung dauerhafter Anlagen (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: Baustelleneinrichtung und Mobilisierung
    description: |
      Aufbau und Mobilisierung der Baustelle, einschließlich Baustellenlager,
      temporärer Einrichtungen und Anschluss von Ver- und Entsorgung sowie
      Diensten.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: Baustellenaufbau und Baustellenlagereinrichtung
    description: |
      Einrichtung von Baustellenlagern, Büros und Sozialbereichen bereit für den
      Baubetrieb.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Mobilisierungsplanung
    description: |
      Planung der Mobilisierung von Ressourcen, Arbeitskräften und Ausrüstung auf
      die Baustelle.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Bereitstellung temporärer Einrichtungen
    description: |
      Bereitstellung temporärer Unterkünfte, Sozial- und Baustelleneinrichtungen
      für die Bauarbeitskräfte.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: Anschluss von Ver- und Entsorgung sowie Diensten
    description: |
      Anschluss temporärer Strom-, Wasser- und Kommunikationsdienste, die für den
      Baustellenbetrieb erforderlich sind.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: Arbeitsfront- und Produktionsmanagement
    description: |
      Planung, Koordination und Nachverfolgung der Bauproduktion über aktive
      Arbeitsfronten zur Aufrechterhaltung von Fortschritt und Produktivität.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: Produktionsplanung und -sequenzierung
    description: |
      Kurzzyklische Planung und Sequenzierung der Bauproduktion über
      Arbeitsfronten.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Arbeitsfrontkoordination
    description: |
      Koordination von Gewerken, Ressourcen und Zugang über gleichzeitige
      Arbeitsfronten.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Täglicher Baustellenbetrieb
    description: |
      Tägliche Leitung und Steuerung des Baubetriebs auf der Baustelle.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: Fortschritts- und Produktivitätsverfolgung
    description: |
      Messung von Baufortschritt und Arbeitsproduktivität anhand des Programms.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Management der Behelfsbauwerke
    description: |
      Management von Behelfsbauwerken und Zugangssystemen, die den sicheren Bau
      der dauerhaften Bauwerke ermöglichen.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Koordination der Behelfsbauwerksplanung
    description: |
      Koordination und Steuerung der Behelfsbauwerksplanung und ihres
      Prüfregimes.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: Gerüst- und Zugangsmanagement
    description: |
      Bereitstellung und Steuerung von Gerüsten und sicherem Zugang für
      Bauaktivitäten.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: Schalungs- und Traggerüstmanagement
    description: |
      Management von Schalungs- und Traggerüstsystemen zur Unterstützung von
      Beton- und Tragwerksarbeiten.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: Baugruben- und Verbaumanagement
    description: |
      Management von Baugruben und temporärer Bodensicherung, damit die Werke
      stabil und sicher bleiben.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: Geräte- und Ausrüstungsmanagement
    description: |
      Bereitstellung, Einsatz und Instandhaltung von Baugeräten und -ausrüstung,
      einschließlich Hebevorgängen.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Gerätefuhrparkmanagement
    description: |
      Management des Baugerätefuhrparks über Projekte und Arbeitsfronten.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: Gerätemiete und -auslastung
    description: |
      Beschaffung, Miete und Auslastungsverfolgung von Bauausrüstung.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Management von Hebevorgängen
    description: |
      Planung und Steuerung von Hebevorgängen und Krannutzung auf der Baustelle.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: Geräteprüfung und -instandhaltung
    description: |
      Prüfung und Instandhaltung von Geräten und Ausrüstung zur Aufrechterhaltung
      von Verfügbarkeit und Sicherheit.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: Baustellenmaterialien und Logistik
    description: |
      Lieferung, Lagerung und Bewegung von Baumaterialien auf der Baustelle,
      einschließlich Logistik und Abfall.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: Materialabruf und -lieferung
    description: |
      Abruf und Lieferung von Baumaterialien zur Erfüllung des Arbeitsprogramms.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: Lager- und Lagerplatzmanagement
    description: |
      Management von Lagerplätzen und baustelleninterner Lagerung von Materialien
      und Bauteilen.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: Baustellenlogistik und Verkehrsmanagement
    description: |
      Management von Baustellenlogistik, Lieferungen sowie Fahrzeug- und
      Verkehrsbewegungen.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Bauabfallmanagement
    description: |
      Trennung, Handhabung und Entsorgung von Bauabfall und überschüssigem
      Material.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Bauqualitätsmanagement
    description: |
      Assurance und Kontrolle der Bauqualität zur Lieferung von Werken, die der
      Spezifikation entsprechen.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: Prüf- und Testplanung
    description: |
      Planung von Prüfungen und Tests sowie ihrer Halte- und Zeugenpunkte.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: Qualitätskontrolle und -sicherung
    description: |
      Durchführung von Qualitätskontrollen und -sicherung über Bauaktivitäten.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Management von Nichtkonformitäten
    description: |
      Identifizierung, Disposition und Abschluss von Bau-Nichtkonformitäten.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: Mängelbeseitigung und Übergabeunterstützung
    description: |
      Mängelaufnahme, Mängelbeseitigung und Unterstützung der Übergabe
      fertiggestellter Werke.
    source_hash: sha256-c6fb7d5061da1fe6
