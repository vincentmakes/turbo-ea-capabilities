  BC-1050.30.10:
    name: Vor-Ort-Serviceerbringung
    description: |
      Vor-Ort-Ausführung von Serviceaufgaben gemäß Arbeitsauftrag.
    source_hash: sha256-5a08e51217067705
  BC-1050.30.20:
