    source_hash: sha256-e1f64a922e08795f
  BC-160.40.40:
    name: Testergebnisse und Verbesserungsverfolgung
    description: |
      Erfassung von Übungsergebnissen und Nachverfolgung von Verbesserungsmaßnahmen.
    source_hash: sha256-55f4b565329b1afb
