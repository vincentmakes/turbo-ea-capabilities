locale: de
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Konzessions- und Erlösmanagement
    description: |
      Konzessions- und Public-Private-Partnership-Management, Tarif und
      Preisgestaltung, Erlöserhebung und -sicherung, Zuschuss- und
      Subventionsmanagement sowie kommerzielle Partnerschaften, die
      Infrastrukturanlagen über die Konzessionslaufzeit monetarisieren.
    in_scope:
      - Konzessionsvertrags- und Public-Private-Partnership-Management
      - Tarif-, Maut- und regulierte Preisgestaltung
      - Erlöserhebung, -sicherung und Kontrolle von Erlösverlusten
      - Verwaltung von Zuschüssen, Subventionen und Verfügbarkeitszahlungen
      - Kommerzielle Partnerschaften und Entwicklung von Nebenerlösen
      - Monetarisierung von Grundstücks- und Immobilienerlösen
    out_of_scope:
      - Unternehmenspreismanagement (BC-450)
      - Investitionsförder- und -finanzierungsstrategie (BC-5000)
      - Regulatorische Preiskontrolle (BC-5110)
      - Unternehmens-Treasury und Liquiditätsmanagement
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: Konzessions- und PPP-Management
    description: |
      Management von Konzessionsverträgen und Public-Private-Partnership-Strukturen
      über ihren Lebenszyklus und ihre Pflichten.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Konzessionsvertragsmanagement
    description: |
      Verwaltung von Konzessionsverträgen, -bedingungen und -pflichten über die
      Konzessionslaufzeit.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: PPP-Strukturierung
    description: |
      Strukturierung von Public-Private-Partnership-Vereinbarungen und ihrer
      Risiko- und Ertragsverteilung.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: Verfügbarkeits- und Zahlungsmechanismus
    description: |
      Gestaltung und Betrieb von Verfügbarkeits- und Zahlungsmechanismen, die die
      Konzessionsvergütung regeln.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Konzessions-Compliance
    description: |
      Sicherstellung, dass Konzessionspflichten und Leistungsstandards über den
      Vertrag hinweg erfüllt werden.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: Tarif- und Preismanagement
    description: |
      Festsetzung und Governance von Tarifen, Mauten und Preisen, die für
      Infrastrukturnutzung und -dienste berechnet werden.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: Tarif- und Mautfestsetzung
    description: |
      Bestimmung von Tarifen und Mauten für Infrastrukturzugang und -nutzung.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Preisstrategie
    description: |
      Definition der kommerziellen Preisstrategie für Infrastrukturdienste und
      -kapazität.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Regulierte Preiskontrolle
    description: |
      Management von Preisen innerhalb regulierter Preiskontrollrahmen und
      -festlegungen.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: Dynamische und Überlastungspreisgestaltung
    description: |
      Anwendung nachfrageabhängiger und überlastungsbasierter Preisgestaltung zur
      Steuerung von Auslastung und Erlös.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: Erlöserhebung und -sicherung
    description: |
      Erhebung von Infrastrukturerlösen und Sicherung, dass der abgerechnete Wert
      genau erfasst und abgestimmt wird.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: Berechnung und Erhebung
    description: |
      Berechnung und Erhebung von Nutzungsgebühren, Mauten und Serviceerlösen von
      Kunden.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Erlössicherung
    description: |
      Sicherung, dass alle erwirtschafteten Erlöse vollständig abgerechnet,
      erfasst und verbucht werden.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Management von Erlösverlusten
    description: |
      Identifizierung und Rückgewinnung von Erlösverlusten, Umgehung und
      Untererfassung.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: Abrechnung und Abstimmung
    description: |
      Abrechnung und Abstimmung erhobener Erlöse über Systeme und
      Vertragspartner.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: Zuschuss- und Subventionsmanagement
    description: |
      Verwaltung von Zuschüssen, Subventionen und öffentlichen Beiträgen, die
      Infrastrukturverfügbarkeit und -betrieb finanzieren.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: Subventions- und Zuschussverwaltung
    description: |
      Verwaltung von Subventionen und Zuschüssen zur Unterstützung von
      Infrastrukturdiensten.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Management von Verfügbarkeitszahlungen
    description: |
      Management verfügbarkeitsbasierter Zahlungen, die an Service- und
      Anlagenleistung geknüpft sind.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Compliance öffentlicher Förderung
    description: |
      Einhaltung der an öffentliche Förderung geknüpften Bedingungen und
      Berichterstattung.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Management staatlicher Beiträge
    description: |
      Management staatlicher Investitions- und Betriebsbeiträge zur
      Infrastruktur.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Management kommerzieller Partnerschaften
    description: |
      Entwicklung von Erlösen aus Dritt-, Neben- und immobilienbasierten Quellen
      durch kommerzielle Partnerschaften.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Management von Drittparteierlösen
    description: |
      Management von Erlösen aus Drittzugang, -diensten und -vereinbarungen.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Management kommerzieller Partnerschaften
    description: |
      Entwicklung und Management kommerzieller Partnerschaften, die
      Infrastrukturerlöse generieren.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Entwicklung von Nebenerlösen
    description: |
      Entwicklung von Neben- und Nichtkernerlösströmen rund um
      Infrastrukturanlagen.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: Grundstücks- und Immobilienerlöse
    description: |
      Monetarisierung von Grundstücks- und Immobilienbeständen, die mit der
      Infrastruktur verbunden sind.
    source_hash: sha256-4931ef33faa7594b
metadata:
