locale: de
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Infrastruktur-Management für Gesundheit, Sicherheit und Umwelt
    description: |
      Gesundheits-, Sicherheits- und Umweltmanagement über Infrastrukturbau und
      -betrieb, umfassend HSE-Managementsysteme, Bausicherheit, Arbeitsmedizin,
      Umweltmanagement sowie Vorfall- und Notfallreaktion. Schützt Menschen,
      Gemeinschaften und die Umwelt, während Werke und Anlagen geliefert und
      betrieben werden.
    in_scope:
      - HSE-Politik, Managementsysteme, Kultur und Kompetenz
      - Bausicherheit nach CDM, Genehmigungen und Gefährdungsbeurteilung
      - Arbeitsmedizinische Überwachung, Sozialeinrichtungen und Wohlbefinden
      - Umweltkontrollen, Emissionsvermeidung und Einhaltung von Genehmigungen
      - Ökologie- und Denkmalschutz während der Bauarbeiten
      - Vorfallmeldung, -untersuchung und Notfallreaktion
    out_of_scope:
      - Branchenübergreifende Umwelt, Gesundheit & Sicherheit (BC-720)
      - Operative Resilienz und Sicherheit (BC-5120)
      - Bauqualitätsmanagement (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: HSE-Managementsystem
    description: |
      Politik, Standards, Kultur und Kompetenz, die das Gesundheits-,
      Sicherheits- und Umweltmanagementsystem ausmachen.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: HSE-Politik und -Standards
    description: |
      Definition von HSE-Politik, -Standards und -Zielen über
      Infrastrukturaktivitäten.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: HSE-Managementsystem
    description: |
      Betrieb und kontinuierliche Verbesserung des zertifizierten
      HSE-Managementsystems.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: Sicherheitskultur und -verhalten
    description: |
      Entwicklung einer positiven Sicherheitskultur und sicherer Verhaltensweisen
      über die Arbeitskräfte.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: HSE-Kompetenz und -Schulung
    description: |
      Sicherstellung von HSE-Kompetenz, Schulung und Autorisierung für Personal.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Bausicherheitsmanagement
    description: |
      Management von Bausicherheitsrisiken durch Planung, Baustellenkontrollen,
      Genehmigungen und sichere Arbeitssysteme.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: CDM- und Planungsrisikomanagement
    description: |
      Management der Pflichten aus Bauplanung und -management sowie der
      Risikoreduzierung in der Planungsphase.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Baustellensicherheitsmanagement
    description: |
      Tägliches Management von Sicherheitskontrollen und Aufsicht auf der
      Baustelle.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Arbeitsfreigabemanagement
    description: |
      Steuerung risikoreicher Tätigkeiten durch Permit-to-Work-Systeme.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: Arbeitsanweisung und Gefährdungsbeurteilung
    description: |
      Erstellung und Steuerung von Arbeitsanweisungen und
      aufgabenbezogenen Gefährdungsbeurteilungen für sichere Ausführung.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Arbeitsmedizinmanagement
    description: |
      Schutz der Gesundheit der Arbeitskräfte durch Überwachung,
      Sozialeinrichtungen, Hygiene und Wohlbefindensmanagement.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Arbeitsmedizinische Überwachung
    description: |
      Überwachung von Gesundheit und Eignung der Arbeitskräfte gegenüber
      arbeitsbedingten Expositionen.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Bereitstellung von Sozialeinrichtungen
    description: |
      Bereitstellung von Sozialeinrichtungen und -vorkehrungen für die
      Baustellenarbeitskräfte.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: Expositions- und Hygieneüberwachung
    description: |
      Überwachung und Kontrolle arbeitsbedingter Expositionen und der
      Arbeitsplatzhygiene.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: Ermüdungs- und Wohlbefindensmanagement
    description: |
      Management von Ermüdung, psychischer Gesundheit und Wohlbefinden über die
      Arbeitskräfte.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Umweltmanagement
    description: |
      Management von Umweltauswirkungen, -kontrollen und -genehmigungen über Bau
      und Betrieb.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Umweltkontrollen
    description: |
      Umsetzung von Kontrollen, die die Umweltauswirkungen von Werken und Betrieb
      begrenzen.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Emissionsvermeidung
    description: |
      Vermeidung und Kontrolle von Verunreinigungen von Luft, Wasser und Boden
      während der Bauarbeiten.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Einhaltung von Umweltgenehmigungen
    description: |
      Einhaltung von Umweltgenehmigungen, -erlaubnissen und Lizenzbedingungen.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: Ökologie- und Denkmalschutz
    description: |
      Schutz von Ökologie, Biodiversität und Denkmälern, die von den Bauarbeiten
      betroffen sind.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: Vorfall- und Notfallmanagement
    description: |
      Meldung, Untersuchung und Notfallreaktion bei HSE-Vorfällen, mit
      Leistungsüberwachung.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: Vorfallmeldung und -untersuchung
    description: |
      Meldung und Untersuchung von HSE-Vorfällen und Beinaheunfällen.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Ursachenanalyse
    description: |
      Analyse der zugrunde liegenden Ursachen zur Vermeidung einer
      Wiederholung von Vorfällen.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Notfallreaktionsplanung
    description: |
      Planung und Bereitschaft für Notfallreaktion über Baustellen und Anlagen.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: HSE-Leistungsüberwachung
    description: |
      Überwachung und Berichterstattung der HSE-Leistung und Frühindikatoren.
    source_hash: sha256-fbf0f34769e795c3
