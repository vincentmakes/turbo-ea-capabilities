kind: business-process
locale: de
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Risiko-zu-Minderung"
    description: "Enterprise-Risk-Management-Zyklus von der Risikoappetit-Rahmung über Risikoidentifikation, -bewertung, -behandlung, -überwachung und -berichterstattung. Ein BP2 pro VS-500-stage_name."
  BP-1110.10:
    name: "Risikoappetit & Framework"
    description: "Risikoappetit und Toleranzen setzen; das Enterprise-Risk-Management-Framework, die Taxonomie und Governance definieren."
  BP-1110.10.10:
    name: "Risikoappetit setzen"
    description: "Enterprise-Risikoappetit-Statements und Toleranzschwellen pro Risikokategorie setzen; mit dem Vorstand ratifizieren."
  BP-1110.10.20:
    name: "Risiko-Framework definieren"
    description: "Das ERM-Framework definieren — Taxonomie, Governance-Foren, Rollen, Lebenszyklus — unter COSO ERM und ISO 31000."
  BP-1110.20:
    name: "Risikoidentifikation"
    description: "Enterprise-Risiken über strategische, operative, finanzielle, regulatorische und Emerging Domains identifizieren."
  BP-1110.20.10:
    name: "Risiko-Workshops durchführen"
    description: "Strukturierte Workshops durchführen, um Risiken im Geschäft mit Eigentümern und SMEs aufzudecken."
  BP-1110.20.20:
    name: "Externe Risiken scannen"
    description: "Externe Quellen scannen — regulatorisch, marktlich, geopolitisch, ökologisch — auf Emerging-Risk-Signale."
  BP-1110.20.30:
    name: "Risiko-Inventar erfassen"
    description: "Identifizierte Risiken im Enterprise-Risikoregister mit Eigentümer, Kategorie und Erstbewertung persistieren."
  BP-1110.30:
    name: "Risikobewertung"
    description: "Identifizierte Risiken auf Wahrscheinlichkeit, Auswirkung und Geschwindigkeit bewerten; Inherent- und Residual-Risiko bewerten."
  BP-1110.30.10:
    name: "Wahrscheinlichkeit und Auswirkung scoren"
    description: "Wahrscheinlichkeit und Auswirkung jedes Risikos mit qualitativen und quantitativen Methoden gemäß Framework scoren."
  BP-1110.30.20:
    name: "Inherent- und Residual-Risiko bewerten"
    description: "Inherent-Risiko-Rating berechnen und nach Berücksichtigung bestehender Kontrollen Residual-Rating ermitteln."
  BP-1110.30.30:
    name: "Risiken priorisieren"
    description: "Risiken auf Basis von Residual-Rating, Appetit und strategischer Relevanz für Behandlung priorisieren."
  BP-1110.40:
    name: "Behandlung & Kontroll-Design"
    description: "Behandlung entscheiden — akzeptieren, vermeiden, mitigieren, transferieren — und Kontrollen designen oder verstärken."
  BP-1110.40.10:
    name: "Risikobehandlung entscheiden"
    description: "Behandlung pro Risiko entscheiden — akzeptieren, vermeiden, mitigieren, transferieren (Versicherung, vertraglich, Hedging)."
  BP-1110.40.20:
    name: "Kontrollen designen"
    description: "Kontrollen designen oder verstärken — präventiv, detektiv, korrektiv — um Residual-Risiko in den Appetit zu bringen."
  BP-1110.40.30:
    name: "Behandlungsplan implementieren"
    description: "Den Behandlungsplan implementieren; Eigentümer, Termine und Verifikations-Evidenz zuweisen."
  BP-1110.50:
    name: "Überwachung"
    description: "Risiken und Kontrollen überwachen — KRI-Tracking, Kontroll-Tests, Vorfallsmuster-Überwachung."
  BP-1110.50.10:
    name: "Key Risk Indicators verfolgen"
    description: "KRIs und Emerging-Risk-Signale verfolgen; Schwellenwerte und Eskalationsrouten triggern."
  BP-1110.50.20:
    name: "Kontrollen testen"
    description: "Design- und Operating-Effectiveness von Kontrollen testen; Ausnahmen bewerten; Remediation treiben."
  BP-1110.50.30:
    name: "Vorfallsmuster überwachen"
    description: "Vorfalls-, Beinahe- und Schadensereignis-Muster überwachen; Risiko- und Kontroll-Sichten entsprechend verfeinern."
  BP-1110.60:
    name: "Berichterstattung & Eskalation"
    description: "Enterprise-Risiko an Executive-Foren, den Vorstand und Regulatoren berichten; Verstöße eskalieren."
  BP-1110.60.10:
    name: "Risikobericht produzieren"
    description: "Den periodischen Enterprise-Risk-Bericht produzieren — Dashboards, Heat Maps, Top-Risk-Narrative."
  BP-1110.60.20:
    name: "Executive und Vorstand briefen"
    description: "Executive-Risikokomitee und Vorstands-Risikokomitee briefen; Entscheidungen und Richtung erfassen."
  BP-1110.60.30:
    name: "Verstöße eskalieren"
    description: "Appetit-Verstöße und High-Velocity-Vorfälle gemäß Protokoll eskalieren; Regulatoren benachrichtigen wo erforderlich."
