kind: business-process
locale: de
source: BP1-record-to-report.yaml
entries:
  BP-1080:
    name: "Buchung-zu-Berichterstattung"
    description: "Finanzabschlusszyklus von der Transaktionserfassung über Nebenbuch-Schließung, Abstimmung, Konsolidierung, Management-Reporting, Statutary- und Regulatory-Reporting bis zum Audit-Sign-off. Ein BP2 pro VS-460-stage_name."
  BP-1080.10:
    name: "Transaktionserfassung"
    description: "Wirtschaftliche Transaktionen aus Quellsystemen mit angemessener Kodierung in das Finanz-Backbone erfassen."
  BP-1080.10.10:
    name: "Quelltransaktionen erfassen"
    description: "Transaktionen aus Vertrieb, Einkauf, Lohnabrechnung, Treasury und anderen Quellsystemen in die Buchungsflüsse erfassen."
  BP-1080.10.20:
    name: "Buchhaltungs-Kodierung anwenden"
    description: "Konten-, Kostenstellen- und Projekt-Kodierung gemäß Kontenplan und Richtlinie anwenden."
  BP-1080.10.30:
    name: "Transaktionsdaten validieren"
    description: "Validierungsregeln ausführen — Vollständigkeit, Klassifikation, Währung, Periode — und Ausnahmen zur Korrektur routen."
  BP-1080.20:
    name: "Nebenbuch-Schließung"
    description: "Nebenbücher schließen — Debitoren, Kreditoren, Anlagen, Lohn, Treasury — und ins Hauptbuch buchen."
  BP-1080.20.10:
    name: "Debitoren-Nebenbuch schließen"
    description: "Das Debitoren-Nebenbuch schließen; AR-zu-GL-Zusammenfassung buchen und offene Salden reporten."
  BP-1080.20.20:
    name: "Kreditoren-Nebenbuch schließen"
    description: "Das Kreditoren-Nebenbuch schließen; AP-zu-GL-Zusammenfassung buchen und offene Salden reporten."
  BP-1080.20.30:
    name: "Anlagen-Nebenbuch schließen"
    description: "Anlagenabschreibung und Zugänge/Abgänge ausführen; ins Hauptbuch buchen."
  BP-1080.20.40:
    name: "Andere Nebenbücher schließen"
    description: "Lohn-, Treasury-, Bestand- und Projekt-Nebenbücher schließen; mit Audit-Trail ins Hauptbuch buchen."
  BP-1080.30:
    name: "Abstimmung & Anpassungen"
    description: "Bilanzkonten abstimmen und Periodenend-Anpassungen vornehmen, um die Bücher zu schließen."
  BP-1080.30.10:
    name: "Bilanzkonten abstimmen"
    description: "Treasury-, Debitoren-, Kreditoren-, Inter-Company-, Rückstellungs- und andere Bilanzkonten mit Quelldetail abstimmen."
  BP-1080.30.20:
    name: "Periodenend-Anpassungen vornehmen"
    description: "Rückstellungen, ARAP, PRAP und Umgliederungsbuchungen vornehmen; Belegdokumentation erfassen."
  BP-1080.30.30:
    name: "Abstimmungsabweichungen lösen"
    description: "Abstimmungspositionen untersuchen und lösen; nicht gelöste Positionen an Controllership zur Abschreibung oder Übertragung eskalieren."
  BP-1080.40:
    name: "Konsolidierung"
    description: "Jahresabschlüsse über Rechtspersonen und Währungen konsolidieren; Inter-Company eliminieren; Konzernergebnisse produzieren."
  BP-1080.40.10:
    name: "Lokalwährungs-Salden umrechnen"
    description: "Lokalwährungs-Salden zu den geeigneten FX-Kursen gemäß Rechnungslegungsstandard in die Berichtswährung umrechnen."
  BP-1080.40.20:
    name: "Inter-Company eliminieren"
    description: "Inter-Company-Verkäufe, -Salden und nicht realisierte Gewinne gemäß Konsolidierungsregeln eliminieren."
  BP-1080.40.30:
    name: "Konsolidierte Konzernergebnisse produzieren"
    description: "Konsolidierte Konzern-Bilanz, GuV, Cashflow-Rechnung und Eigenkapital produzieren; im Konsolidierungssystem persistieren."
  BP-1080.50:
    name: "Management-Reporting"
    description: "Interne Management-Berichte für Executive-Team, Vorstand und operative Leader produzieren."
  BP-1080.50.10:
    name: "Management-Berichte erstellen"
    description: "Management-Berichte erstellen — P&L nach Segment, Kostenstelle, Produkt, Kunde; Cash- und Working-Capital-Sichten."
  BP-1080.50.20:
    name: "Plan-Abweichungen analysieren"
    description: "Abweichungen Ist vs. Plan und vs. Vorperiode analysieren; Treiber und Korrekturmaßnahmen identifizieren."
  BP-1080.50.30:
    name: "Management-Pack verteilen"
    description: "Den Management-Reporting-Pack an Executives und operative Leader gemäß vereinbarter Kadenz verteilen."
  BP-1080.60:
    name: "Statutary- & Regulatory-Reporting"
    description: "Statutary-, Regulatory- und Steuererklärungen an Behörden gemäß Kalender produzieren."
  BP-1080.60.10:
    name: "Statutary-Abschlüsse erstellen"
    description: "Statutary-Jahresabschlüsse nach lokalem GAAP / IFRS für jede Rechtspersönlichkeit der Jurisdiktion erstellen."
  BP-1080.60.20:
    name: "Steuererklärungen einreichen"
    description: "Körperschaftsteuer-, USt./GST-, Quellensteuer- und Verrechnungspreis-Erklärungen pro Jurisdiktion erstellen und einreichen."
  BP-1080.60.30:
    name: "Regulatorische Berichte einreichen"
    description: "Sektor-Regulierungs-Berichte (Banken, Versicherungen, börsennotierte Unternehmensoffenlegungen) bei den zuständigen Regulatoren einreichen."
  BP-1080.70:
    name: "Audit & Sign-off"
    description: "Internes und externes Audit unterstützen; Sign-off auf Jahresabschlüsse und Kontrollen erhalten."
  BP-1080.70.10:
    name: "Externes Audit unterstützen"
    description: "Externen Wirtschaftsprüfern Belege und Walk-throughs bereitstellen; Audit-Anfragen lösen; auf Findings reagieren."
  BP-1080.70.20:
    name: "Internes Audit unterstützen"
    description: "Interne Audit-Reviews zu Finanzabschluss, Abstimmungen und Kontrollen unterstützen; Findings schließen."
  BP-1080.70.30:
    name: "Management-Sign-off erhalten"
    description: "Sign-off von CFO und CEO auf Jahresabschlüsse und SOX- oder äquivalente Kontroll-Repräsentationen erhalten; Audit-Komitee gemäß Corporate-Governance-Protokoll briefen."
