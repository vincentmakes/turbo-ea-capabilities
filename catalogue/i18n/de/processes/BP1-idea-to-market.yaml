kind: business-process
locale: de
source: BP1-idea-to-market.yaml
entries:
  BP-1030:
    name: "Idee-zu-Markt"
    description: "End-to-End-Produkt-/Service-Innovationszyklus von der Ideenerfassung über Konzept und Machbarkeit, Forschung und Prototyping, Portfolio-Auswahl, Design und Entwicklung, IP-Schutz, Launch-Readiness, Markteinführung bis zur Post-Launch-Performance. Ein BP2 pro VS-290-stage_name."
  BP-1030.10:
    name: "Ideenerfassung"
    description: "Ideen von Mitarbeitern, Kunden, Partnern und Marktsignalen sichtbar machen, erfassen und konsolidieren; an Triage routen."
  BP-1030.10.10:
    name: "Ideen einholen"
    description: "Ideen-Generierungs-Kampagnen, Hackathons und kontinuierliche Kanäle durchführen; Einreichung im gesamten Unternehmen und Ökosystem ermutigen."
  BP-1030.10.20:
    name: "Ideen erfassen und triagieren"
    description: "Eingehende Ideen persistieren, deduplizieren und mit erster Kategorisierung in Review-Queues triagieren."
  BP-1030.10.30:
    name: "Ideen-Fit validieren"
    description: "Erstes Fit-Screening gegen Strategie, Capability und Marktsignal anwenden; ablehnen, parken oder zur Machbarkeit weiterleiten."
  BP-1030.20:
    name: "Konzept & Machbarkeit"
    description: "Vielversprechende Ideen in Konzepte überführen; technische, marktliche und kommerzielle Machbarkeit bewerten; Begründung für Portfolio-Auswahl aufbauen."
  BP-1030.20.10:
    name: "Konzept entwickeln"
    description: "Das Konzept artikulieren — Problem, Zielnutzer, vorgeschlagene Lösung, Wert-Hypothese — in ausreichender Tiefe für die Bewertung."
  BP-1030.20.20:
    name: "Technische Machbarkeit bewerten"
    description: "Validieren, dass das Konzept mit verfügbarer oder beschaffbarer Technologie, Materialien und Skills gebaut werden kann."
  BP-1030.20.30:
    name: "Kommerzielle Machbarkeit bewerten"
    description: "Den Business Case aufbauen — adressierbarer Markt, Pricing, Cost-to-Serve, ROI — um die Opportunity zu dimensionieren."
  BP-1030.20.40:
    name: "Über Konzept-Fortschritt entscheiden"
    description: "Am Konzept-Gate über Weiterführung, Verfeinerung, Parken oder Stoppen entscheiden, mit klarer Begründung und Bedingungen."
  BP-1030.30:
    name: "Forschung & Prototyping"
    description: "Forschung durchführen, Prototypen bauen und mit Nutzern testen, um das Konzept vor dem vollen Design zu derisken."
  BP-1030.30.10:
    name: "Nutzerforschung durchführen"
    description: "Qualitative und quantitative Forschung mit Zielnutzern durchführen, um Problem-Lösungs-Fit zu validieren."
  BP-1030.30.20:
    name: "Prototyp bauen"
    description: "Prototypen niedriger oder hoher Fidelity bauen — physische Mock-ups, Wireframes, lauffähigen Code — um das Konzept greifbar zu machen."
  BP-1030.30.30:
    name: "Prototyp mit Nutzern testen"
    description: "Usability- und Werttests mit Zielnutzern durchführen; Erkenntnisse erfassen, um Iteration oder Stopp-Entscheidungen zu informieren."
  BP-1030.30.40:
    name: "Konzept iterieren"
    description: "Erkenntnisse aus Prototyp-Tests auf das Konzept anwenden; iterieren, bis das Konzept reif für Portfolio-Auswahl oder Stopp ist."
  BP-1030.40:
    name: "Portfolio-Auswahl"
    description: "Validierte Konzepte im Innovationsportfolio priorisieren; Ressourcen allokieren, Lieferung sequenzieren und Risiko ausbalancieren."
  BP-1030.40.10:
    name: "Portfolio-Kandidaten bewerten"
    description: "Validierte Konzepte gegen Portfolio-Kriterien bewerten — strategischer Fit, Wert, Risiko, Capability-Fit, Time-to-Market."
  BP-1030.40.20:
    name: "Portfolio sequenzieren"
    description: "Das Portfolio über Horizonte sequenzieren, Now/Next/Later und Core/Adjacent/Transformational-Mix ausbalancieren."
  BP-1030.40.30:
    name: "Ressourcen allokieren"
    description: "Finanzierung, Talent und Infrastruktur für ausgewählte Konzepte allokieren; formalen Kick-off in Design und Entwicklung auslösen."
  BP-1030.50:
    name: "Design & Entwicklung"
    description: "Detailliertes Design, Engineering, Bau und Integration des Produkts oder Service bis zur Launch-Readiness."
  BP-1030.50.10:
    name: "Detaillierte Anforderungen definieren"
    description: "Das validierte Konzept in detaillierte funktionale, nicht-funktionale und Akzeptanzanforderungen übersetzen."
  BP-1030.50.20:
    name: "Produkt oder Service designen"
    description: "Das detaillierte Design produzieren — Architektur, Materialien, UX, Stückliste — das gebaut und validiert wird."
  BP-1030.50.30:
    name: "Bauen und integrieren"
    description: "Das Produkt oder den Service nach Design bauen; Komponenten und Subsysteme integrieren; Change und Konfiguration managen."
  BP-1030.50.40:
    name: "Validieren und verifizieren"
    description: "Design-Verifikation und -Validierung gegen Anforderungen durchführen; Nichtkonformitäten vor Launch-Readiness schließen."
  BP-1030.60:
    name: "IP-Schutz"
    description: "Im Innovationszyklus erzeugtes geistiges Eigentum identifizieren, schützen und managen."
  BP-1030.60.10:
    name: "Patentierbares IP identifizieren"
    description: "Innovationen auf Neuheit, Nutzen und Nicht-Offensichtlichkeit prüfen; Kandidatenerfindungen für Patentierung identifizieren."
  BP-1030.60.20:
    name: "Patente einreichen und durchsetzen"
    description: "Vorläufige und vollständige Patentanmeldungen einreichen; Prosecution bis zur Erteilung über Jurisdiktionen managen."
  BP-1030.60.30:
    name: "Geschäftsgeheimnisse und Marken managen"
    description: "Geschäftsgeheimnis-Material und Markenwerte identifizieren; Schutz anwenden (NDAs, Zugriffskontrollen, Registrierungen)."
  BP-1030.70:
    name: "Launch-Readiness"
    description: "Auf den Markt-Launch vorbereiten — Go-to-Market, Fertigung, Supply Chain, Kanäle, Support, Schulung."
  BP-1030.70.10:
    name: "Go-to-Market-Plan aufbauen"
    description: "Den GTM-Plan entwickeln — Positionierung, Pricing, Kanäle, Sales Enablement, Marketingkampagnen — für das Launch-Fenster."
  BP-1030.70.20:
    name: "Fertigung oder Service-Delivery hochfahren"
    description: "Fertigungskapazität oder Service-Delivery-Bereitschaft aufbauen — Equipment, Schulung, Versorgung, Zertifizierungen."
  BP-1030.70.30:
    name: "Vertrieb und Support schulen"
    description: "Vertrieb, Partner und Support-Teams vor dem Launch auf das neue Produkt/Service schulen."
  BP-1030.70.40:
    name: "Launch-Readiness-Review bestehen"
    description: "Den cross-funktionalen Launch-Readiness-Review durchführen; Lücken schließen oder Launch zurückhalten, bis bereit."
  BP-1030.80:
    name: "Markteinführung"
    description: "Den Launch ausführen — release, ankündigen, verkaufen und das neue Produkt oder Service im Markt unterstützen."
  BP-1030.80.10:
    name: "An Markt releasen"
    description: "Das Release über Kanäle und Geografien gemäß Launch-Plan schalten; mit PR, Partnern und Versorgung koordinieren."
  BP-1030.80.20:
    name: "Launch-Marketing ausführen"
    description: "Launch-Kampagnen durchführen — Werbung, Content, Events, PR, Social — gemäß GTM-Plan."
  BP-1030.80.30:
    name: "Initial-Sales erfassen"
    description: "Initiale Sales-Bewegung über direkte, Partner- und digitale Kanäle treiben; Conversion verfolgen, um die Launch-Kurve zu validieren."
  BP-1030.90:
    name: "Post-Launch-Performance"
    description: "Performance gegen Business Case verfolgen, Kundenfeedback erfassen, Verbesserungen treiben und Lifecycle-Bewegungen entscheiden."
  BP-1030.90.10:
    name: "Launch-KPIs verfolgen"
    description: "Adoption, Umsatz, Bruttomarge, NPS und andere Launch-KPIs gegen den Business Case für die ersten 30/60/90 Tage und darüber hinaus überwachen."
  BP-1030.90.20:
    name: "Kundenfeedback erfassen"
    description: "Strukturiertes und unstrukturiertes Kundenfeedback im Markt erfassen; in Produkt-Backlog und Roadmap einspeisen."
  BP-1030.90.30:
    name: "Lifecycle-Verbesserungen planen"
    description: "Verbesserungen, Fast-Follow-Features oder Pivot-Bewegungen auf Basis von Post-Launch-Evidenz entscheiden; an Ideenerfassung zurückspielen."
