kind: business-process
locale: de
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Entdeckung-zu-Automatisierung"
    description: "Prozessverbesserungs- und Automatisierungszyklus von der Prozess-Entdeckung über Messung, Mining, Redesign bis zur Automatisierung. Ein BP2 pro VS-150-stage_name."
    source_hash: sha256-242ccdd2644d3357
  BP-1160.10:
    name: "Prozess-Entdeckung"
    description: "Den Ist-Prozess entdecken und dokumentieren — Akteure, Schritte, Daten, Systeme."
    source_hash: sha256-98b633c844e6186d
  BP-1160.10.10:
    name: "Ist-Prozess kartieren"
    description: "Den Ist-Prozess über Interviews, Walk-throughs und Beobachtung kartieren; in einem Prozessmodell persistieren."
    source_hash: sha256-67cdd9b1759b8c85
  BP-1160.10.20:
    name: "Prozessvarianten erfassen"
    description: "Varianten erfassen — nach Region, Kanal, Kundentyp — um aufzudecken, wo Standardisierung wichtig ist."
    source_hash: sha256-4fd5fee3601621d3
  BP-1160.20:
    name: "Prozessmessung"
    description: "Prozessleistung messen — Zykluszeit, Kosten, Qualität, Kundenerfahrung."
    source_hash: sha256-a3c0f1e1d505a6cc
  BP-1160.20.10:
    name: "Prozess-KPIs definieren"
    description: "KPIs für den Prozess definieren — Effizienz, Qualität, Kundenoutcome — und aktuelle Performance baselinen."
    source_hash: sha256-30ac3e4647779862
  BP-1160.20.20:
    name: "Performance baselinen"
    description: "Aktuelle Performance durch Sampling und Analytics baselinen; Outliers und Muster identifizieren."
    source_hash: sha256-e76ab6dab63ebabb
  BP-1160.30:
    name: "Process Mining"
    description: "System-Event-Logs minen, um den tatsächlichen Prozessfluss abzuleiten und Ineffizienzen aufzudecken."
    source_hash: sha256-29c23b6d3ba32017
  BP-1160.30.10:
    name: "Event Log extrahieren"
    description: "Event-Log-Daten aus Quellsystemen für den in-Scope-Prozess extrahieren; bereinigen und vorbereiten."
    source_hash: sha256-123c36e8e61e369a
  BP-1160.30.20:
    name: "Process-Mining-Analyse durchführen"
    description: "Process-Mining-Tools anwenden, um tatsächlichen Fluss, Conformance, Engpässe, Rework-Loops und Varianten abzuleiten."
    source_hash: sha256-57df458afdfbfe9a
  BP-1160.30.30:
    name: "Verbesserungs-Hypothesen aufdecken"
    description: "Mining-Findings in Verbesserungs-Hypothesen übersetzen, priorisiert nach Wirkung und Machbarkeit."
    source_hash: sha256-b2937b52a52a943e
  BP-1160.40:
    name: "Prozess-Redesign"
    description: "Den Prozess redesignen — eliminieren, vereinfachen, integrieren, automatisieren — um Step-Change-Verbesserung zu liefern."
    source_hash: sha256-494cbf24df9546c1
  BP-1160.40.10:
    name: "Soll-Prozess designen"
    description: "Den Soll-Prozess designen unter Anwendung von Lean-Prinzipien, Customer-Journey-Ausrichtung und Automatisierung."
    source_hash: sha256-d48fc9741c148b80
  BP-1160.40.20:
    name: "Redesign validieren"
    description: "Das Redesign mit Operatoren, Kunden und Risiko validieren; vor dem Build verfeinern."
    source_hash: sha256-db270467cb280b5c
  BP-1160.50:
    name: "Prozessautomatisierung"
    description: "Prozessautomatisierung in Skalierung bauen, deployen und betreiben — RPA, Orchestrierung, KI-Assistenz."
    source_hash: sha256-10dd79850ae8b384
  BP-1160.50.10:
    name: "Automatisierung bauen"
    description: "Automatisierung bauen — RPA-Bots, orchestrierte Flows, agentic-AI-Komponenten — gemäß redesigntem Prozess."
    source_hash: sha256-041615d4647618a2
  BP-1160.50.20:
    name: "Automatisierung deployen und betreiben"
    description: "Automatisierung in Produktion deployen; betreiben, monitoren und durch Change-Zyklen pflegen."
    source_hash: sha256-a131e4085bd2075a
  BP-1160.50.30:
    name: "Automatisierungs-Benefits verfolgen"
    description: "Realisierte Automatisierungs-Benefits gegen den Business Case verfolgen; iterieren und skalieren."
    source_hash: sha256-3ad25892234ed3fc
