kind: business-process
locale: de
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Interessent-zu-Kunde"
    description: "End-to-End-Kundengewinnungszyklus von Markt- und Segmentstrategie über Marke, Demand Generation, Lead-Erfassung, Conversion, Onboarding bis zu laufender Retention und Advocacy. Ein BP2 pro VS-440-stage_name."
    source_hash: sha256-93500f1974f9bc3b
  BP-1050.10:
    name: "Markt- & Segmentstrategie"
    description: "Zielmärkte und Kundensegmente definieren und Go-to-Market-Prioritäten dort ausrichten, wo das Right-to-Win am stärksten ist."
    source_hash: sha256-affbbf0ef7d77300
  BP-1050.10.10:
    name: "Marktlandschaft analysieren"
    description: "Märkte dimensionieren, Wettbewerber profilieren und Trends aufdecken, die Nachfrage und Akquisitionsstrategie prägen."
    source_hash: sha256-44620ac30ced91a3
  BP-1050.10.20:
    name: "Zielsegmente definieren"
    description: "Zielkundensegmente auf Basis von Bedarf, Fit und Right-to-Win definieren und priorisieren."
    source_hash: sha256-f063a341ea447f3b
  BP-1050.10.30:
    name: "Akquisitionsprioritäten setzen"
    description: "Segmentprioritäten in Akquisitionsziele übersetzen — Accounts, Geografien, Kanäle — für den Planungshorizont."
    source_hash: sha256-22780eafb5cef487
  BP-1050.20:
    name: "Marke & Positionierung"
    description: "Die in allen Akquisitionskanälen verwendete Marke, Positionierung und Botschaftsarchitektur entwickeln und pflegen."
    source_hash: sha256-3ee43aa33df82837
  BP-1050.20.10:
    name: "Markenstrategie entwickeln"
    description: "Markenversprechen, Persönlichkeit, Architektur und visuelle Identität definieren; über Märkte und Segmente ausrichten."
    source_hash: sha256-7651aec340f759c2
  BP-1050.20.20:
    name: "Positionierung und Botschaft entwickeln"
    description: "Positionierung und Botschaft für jedes Segment und Angebot entwickeln; Kampagnen und Vertrieb mit konsistenter Erzählung ausstatten."
    source_hash: sha256-493dde1c09daa73b
  BP-1050.20.30:
    name: "Markenwerte pflegen"
    description: "Markenrichtlinien pflegen, Genehmigungen zur Markenverwendung managen und visuelle und verbale Identität im Markt steuern."
    source_hash: sha256-ad30bd57517a4650
  BP-1050.30:
    name: "Demand Generation"
    description: "Awareness und Nachfrage in Skalierung über Paid-, Owned-, Earned- und Partnerkanäle erzeugen."
    source_hash: sha256-c2a538e9bf3ed99e
  BP-1050.30.10:
    name: "Demand-Generation-Kampagnen planen"
    description: "Kampagnen nach Segment, Kanal und Angebot planen; Budget allokieren; Lead- und Pipeline-Ziele setzen."
    source_hash: sha256-0e7bc3c21de36a17
  BP-1050.30.20:
    name: "Multi-Channel-Kampagnen ausführen"
    description: "Paid-, Owned-, Earned- und Partnerkampagnen ausführen; Kreativität, Landing Pages und Angebote managen."
    source_hash: sha256-95e0e1eccc5507c7
  BP-1050.30.30:
    name: "Kampagnen-Performance messen"
    description: "Reichweite, Response und Pipeline-Wirkung pro Kampagne und Kanal messen; Kreatives und Spend iterieren."
    source_hash: sha256-ded149ab6943e5a3
  BP-1050.40:
    name: "Lead-Erfassung & Nurture"
    description: "Eingehendes Interesse erfassen, Leads anreichern und bewerten und sie bis zum Sales-Ready-Status nurturen."
    source_hash: sha256-afcfc963e76608d6
  BP-1050.40.10:
    name: "Inbound-Leads erfassen"
    description: "Leads aus Formularen, Veranstaltungen, Partnerempfehlungen und Inbound-Kanälen in die Marketing-Automation-Plattform erfassen."
    source_hash: sha256-48d12c0c6fcc3640
  BP-1050.40.20:
    name: "Leads anreichern und bewerten"
    description: "Mit firmographischen und Verhaltensdaten anreichern; auf Fit und Intent bewerten, um sales-ready Leads zu identifizieren."
    source_hash: sha256-4de63882bcf6a017
  BP-1050.40.30:
    name: "Leads nurturen"
    description: "Nurture-Programme durchführen — Content, Drip-Kampagnen, Retargeting — um Leads zum Sales-Ready-Status zu bringen."
    source_hash: sha256-b46f3cbccd469a24
  BP-1050.40.40:
    name: "Sales-Ready-Leads übergeben"
    description: "Sales-Ready-Leads für direktes Engagement an den Vertrieb routen; Conversion zur Opportunity verfolgen."
    source_hash: sha256-b2707c9824fb2f78
  BP-1050.50:
    name: "Conversion"
    description: "Qualifizierte Leads über Sales-Engagement, Trials und Angebote in Erstaufträge oder Erst-Subscriptions konvertieren."
    source_hash: sha256-2804c90b69e13459
  BP-1050.50.10:
    name: "Interessenten engagieren"
    description: "Direktes Sales-Engagement, Demos und Trials durchführen, um Kundenvertrauen aufzubauen und zur Entscheidung voranzukommen."
    source_hash: sha256-129f7034dbc8ff1b
  BP-1050.50.20:
    name: "Käufer-Einwände adressieren"
    description: "Einwände aufdecken und adressieren — Preis, Fit, Sicherheit, Integration — durch Evidenz und Trial."
    source_hash: sha256-6feba148c9f6c9ff
  BP-1050.50.30:
    name: "Erstdeal anbieten und abschließen"
    description: "Ein Erstdeal-Angebot konstruieren, Bedingungen verhandeln und den Erstauftrag oder die Erst-Subscription erfassen."
    source_hash: sha256-f136feaecfeab56e
  BP-1050.50.40:
    name: "Conversion-Funnel verfolgen"
    description: "Lead-zu-Kunde-Conversion nach Segment, Kanal und Angebot verfolgen; den Funnel iterieren."
    source_hash: sha256-995511608d3d6c95
  BP-1050.60:
    name: "Kunden-Onboarding"
    description: "Neue Kunden onboarden — Provisionierung, Schulung, Success-Planning — um Time-to-Value zu beschleunigen."
    source_hash: sha256-b0c9a08158552296
  BP-1050.60.10:
    name: "Neukunden willkommen heißen"
    description: "Die Welcome-Experience durchführen — Kickoff, benannte Ansprechpartner, Success-Plan — um Erwartungen und Energie zu setzen."
    source_hash: sha256-676b4f99c985ba0d
  BP-1050.60.20:
    name: "Kunden provisionieren"
    description: "Den Kunden in den Liefersystemen provisionieren — Accounts, Berechtigungen, Integrationen, Datenmigration."
    source_hash: sha256-68087a83d23150ba
  BP-1050.60.30:
    name: "Kundennutzer schulen"
    description: "Kundennutzer auf das Produkt oder den Service schulen; Champions zertifizieren; in die Success-Plan-Meilensteine eintragen."
    source_hash: sha256-2ffb520c607d6641
  BP-1050.60.40:
    name: "Time-to-Value bestätigen"
    description: "Validieren, dass der Kunde First-Value-Meilensteine erreicht hat; für Retention-Scoring erfassen."
    source_hash: sha256-36760c034df79c39
  BP-1050.70:
    name: "Retention & Advocacy"
    description: "Kunden halten, Renewal und Expansion treiben und Promotoren in Advocates und Referenzen verwandeln."
    source_hash: sha256-5e7532f7855a510e
  BP-1050.70.10:
    name: "Kundengesundheits-Scoring durchführen"
    description: "Kundengesundheit aus Produktnutzung, Engagement und Feedback-Signalen scoren; gefährdete Accounts für Intervention aufdecken."
    source_hash: sha256-3d3607b0bd4bd7d2
  BP-1050.70.20:
    name: "Renewal und Expansion treiben"
    description: "Die Renewal-Bewegung durchführen und Expansionsopportunities identifizieren — Cross-Sell, Upsell — innerhalb des Accounts."
    source_hash: sha256-6229d03ee763a6f1
  BP-1050.70.30:
    name: "Advocacy kultivieren"
    description: "Promotoren identifizieren, Referenzen, Case Studies und Testimonials erfassen; Advocacy-Programme aktivieren."
    source_hash: sha256-a60f0082731bb75f
