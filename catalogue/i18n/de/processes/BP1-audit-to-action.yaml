kind: business-process
locale: de
source: BP1-audit-to-action.yaml
entries:
  BP-1120:
    name: "Audit-zu-Maßnahme"
    description: "Internal-Audit-Zyklus von Audit-Universe-Planung über Engagement-Scoping, Fieldwork, Findings, Remediation-Tracking bis zu Audit-Quality-Assurance. Ein BP2 pro VS-80-stage_name."
    source_hash: sha256-78ba5fa747a3298e
  BP-1120.10:
    name: "Audit-Universe & Plan"
    description: "Das Audit-Universe pflegen und den risikobasierten Jahres-Audit-Plan aufbauen."
    source_hash: sha256-052dfbb5301861aa
  BP-1120.10.10:
    name: "Audit-Universe pflegen"
    description: "Die Population auditierbarer Entitäten pflegen — Prozesse, Systeme, Standorte, Dritte."
    source_hash: sha256-c80bb421c22ca929
  BP-1120.10.20:
    name: "Risikobasierten Audit-Plan aufbauen"
    description: "Den Jahres-Audit-Plan aus dem Universe nach Risiko gewichtet aufbauen; Audit-Komitee-Freigabe einholen."
    source_hash: sha256-641aa762dfc377f6
  BP-1120.20:
    name: "Engagement-Scoping"
    description: "Das Audit-Engagement scopen — Ziele, in-Scope-Kontrollen, Periode, Ressourcen."
    source_hash: sha256-379378e4cbe00ff2
  BP-1120.20.10:
    name: "Audit-Ziele definieren"
    description: "Audit-Ziele, Schlüsselfragen und Risiken definieren, die im Engagement adressiert werden sollen."
    source_hash: sha256-9db77920df093c01
  BP-1120.20.20:
    name: "Audit-Verfahren planen"
    description: "Audit-Verfahren planen — Walk-throughs, Stichprobentests, Analytics — und erforderliche Evidenz."
    source_hash: sha256-20c9befca109dbaa
  BP-1120.30:
    name: "Fieldwork"
    description: "Audit-Fieldwork ausführen — Evidenz sammeln, Tests durchführen und Workpapers dokumentieren."
    source_hash: sha256-5397ca54ccad52ae
  BP-1120.30.10:
    name: "Prozess walken"
    description: "Den in-Scope-Prozess walken, um Design und Schlüsselkontrollen zu verstehen; Narrative und Flowchart dokumentieren."
    source_hash: sha256-360facf431ae416c
  BP-1120.30.20:
    name: "Kontrollen und Transaktionen testen"
    description: "Stichprobenbasiertes oder populationsweites Testen von Design- und Operating-Effectiveness durchführen; Workpapers dokumentieren."
    source_hash: sha256-984e0a2fd05bc625
  BP-1120.30.30:
    name: "Audit-Analytics durchführen"
    description: "Datenanalysen über die volle Population durchführen, um Anomalien, Ausnahmen und Muster aufzudecken."
    source_hash: sha256-02da298d8bc68b3b
  BP-1120.30.40:
    name: "Audit-Evidenz dokumentieren"
    description: "Evidenz in Workpapers mit Querverweisen dokumentieren; Auditee-Bestätigungen einholen wo erforderlich."
    source_hash: sha256-ff668222fb905e5c
  BP-1120.40:
    name: "Findings & Berichterstattung"
    description: "Findings entwickeln, Management-Antworten vereinbaren und den Audit-Bericht ausstellen."
    source_hash: sha256-882dae2ab975b4e0
  BP-1120.40.10:
    name: "Findings entwickeln"
    description: "Findings mit Condition, Criteria, Cause, Consequence und Empfehlung entwickeln."
    source_hash: sha256-ec29da0b1405dcb1
  BP-1120.40.20:
    name: "Management-Antworten vereinbaren"
    description: "Management-Antwort vereinbaren — akzeptieren, alternative Maßnahme, bestreiten — mit Auditees und Ziel-Remediation-Datum."
    source_hash: sha256-d7f6c42262644426
  BP-1120.40.30:
    name: "Audit-Bericht ausstellen"
    description: "Den finalen Audit-Bericht an Executive-Sponsor und Audit-Komitee ausstellen; das Engagement schließen."
    source_hash: sha256-7cb1bfa395b5139f
  BP-1120.50:
    name: "Remediation-Tracking"
    description: "Management-Remediation der Findings bis zum Schluss verfolgen; mit Re-Test verifizieren wo zutreffend."
    source_hash: sha256-7d1a7c3bb67fc4f2
  BP-1120.50.10:
    name: "Remediation-Status verfolgen"
    description: "Offene Audit-Findings, Zieltermine und Management-Fortschritt gegen den Remediation-Plan verfolgen."
    source_hash: sha256-9d2ac6245533df68
  BP-1120.50.20:
    name: "Schließung verifizieren"
    description: "Schließung des Findings durch Re-Test, Evidenz-Review oder Follow-up-Audit verifizieren; im Tracker schließen."
    source_hash: sha256-fe5f854372d81622
  BP-1120.60:
    name: "Audit-Quality-Assurance"
    description: "Quality Assurance über die Audit-Funktion durchführen — Workpaper-Review, Peer Review, externe Bewertung."
    source_hash: sha256-bcb7a79e6deadaa3
  BP-1120.60.10:
    name: "Audit-Workpapers reviewen"
    description: "Supervisorische Review von Workpapers und Findings auf ausreichende und angemessene Evidenz durchführen."
    source_hash: sha256-69e2e4705ce5c949
  BP-1120.60.20:
    name: "Externe Quality Assessment durchführen"
    description: "Periodische externe Quality Assessment der Audit-Funktion gemäß IIA-Standards durchführen."
    source_hash: sha256-dcbe505dd1a3c5cf
