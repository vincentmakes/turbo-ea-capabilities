kind: business-process
locale: de
source: BP1-acquire-to-retire.yaml
entries:
  BP-1090:
    name: "Beschaffung-zu-Stilllegung"
    description: "End-to-End-Lebenszyklus physischer Anlagen vom Bedarf und der Begründung über Anschaffung, Inbetriebnahme, Operate-and-Maintain, Risiko und Reliability, Asset-Information-Pflege bis zur Stilllegung. Ein BP2 pro VS-10-stage_name."
  BP-1090.10:
    name: "Anlagebedarf & Begründung"
    description: "Anlagebedarfe identifizieren, Capital begründen und die Anlage vor Beschaffungsbeginn freigeben."
  BP-1090.10.10:
    name: "Anlagebedarf identifizieren"
    description: "Geschäftlichen Bedarf für eine neue oder Ersatz-Anlage erfassen; technischen und Operating-Kontext sammeln."
  BP-1090.10.20:
    name: "Capital-Begründung aufbauen"
    description: "Den Business Case aufbauen — Total Cost of Ownership, NPV, Sensitivität — und Capital-Freigabe sichern."
  BP-1090.10.30:
    name: "Anlagenplan freigeben"
    description: "Durch das Capital-Freigabe-Komitee routen; Bedingungen dokumentieren und mit dem Portfolio verknüpfen."
  BP-1090.20:
    name: "Anschaffung"
    description: "Die Anlage sourcen, designen oder spezifizieren, beschaffen und Lieferung annehmen."
  BP-1090.20.10:
    name: "Anlage spezifizieren"
    description: "Bedarf in Anlagenspezifikation übersetzen — Kapazität, Performance, Compliance, Lebenszyklusanforderungen."
  BP-1090.20.20:
    name: "Anlage beschaffen"
    description: "Sourcing, Lieferantenauswahl und Vertragsabschluss durchführen; Bestellung oder Bauvertrag platzieren."
  BP-1090.20.30:
    name: "Anlagenlieferung annehmen"
    description: "Die Anlage empfangen, inspizieren und formal gegen die Spezifikation annehmen."
  BP-1090.30:
    name: "Inbetriebnahme & Aktivierung"
    description: "Die Anlage installieren, testen und in Betrieb nehmen; in den Büchern aktivieren."
  BP-1090.30.10:
    name: "Anlage installieren und in Betrieb nehmen"
    description: "Installieren, einschalten und Inbetriebnahme-Tests durchführen; bei erfolgreichem Abschluss an Operations übergeben."
  BP-1090.30.20:
    name: "Anlage aktivieren"
    description: "Die Anlage im Anlagenregister mit ordnungsgemäßer Klasse, Abschreibungsmethode und Nutzungsdauer aktivieren."
  BP-1090.40:
    name: "Operate & Maintain"
    description: "Die Anlage betreiben und vorbeugende, korrektive und zustandsbasierte Instandhaltung über die Nutzungsdauer durchführen."
  BP-1090.40.10:
    name: "Anlage betreiben"
    description: "Tägliche Anlagenoperation gegen Designparameter durchführen; Betriebsdaten erfassen."
  BP-1090.40.20:
    name: "Instandhaltung planen und einplanen"
    description: "Vorbeugende, prädiktive und zustandsbasierte Instandhaltung planen; gegen Operations und Ressourcenverfügbarkeit einplanen."
  BP-1090.40.30:
    name: "Instandhaltung ausführen"
    description: "Instandhaltungsarbeit ausführen — vorbeugend, korrektiv, Shutdown — und Anlage als wieder betriebsbereit bestätigen."
  BP-1090.50:
    name: "Risiko & Reliability"
    description: "Asset-Integrity, Reliability und Operational-Safety-Risiko über die Betriebsdauer managen."
  BP-1090.50.10:
    name: "Asset-Risiko bewerten"
    description: "Kritikalitäts- und Risikobewertungen durchführen — Failure Modes, Konsequenz, Wahrscheinlichkeit — um Instandhaltungs- und Integrity-Programme zu treiben."
  BP-1090.50.20:
    name: "Asset-Integrity managen"
    description: "Inspektions-, Test- und Korrosionsmanagement-Programme durchführen, um Integrity über den Lebenszyklus aufrechtzuerhalten."
  BP-1090.50.30:
    name: "Asset-Reliability verbessern"
    description: "Reliability-Verbesserung treiben — Wurzelursachenanalyse bei chronischen Ausfällen, RAM-Modellierung, Design-Change-Empfehlungen."
  BP-1090.60:
    name: "Asset-Informationspflege"
    description: "Anlagenstammdaten, Zeichnungen, Konfiguration und Dokumente über den Lebenszyklus pflegen."
  BP-1090.60.10:
    name: "Anlagenstammdaten pflegen"
    description: "Anlagenstammdaten pflegen — Klasse, Standort, Parent-Child, Attribute — im Anlagenregister."
  BP-1090.60.20:
    name: "Anlagendokumente pflegen"
    description: "Zeichnungen, Handbücher, P&IDs, Zertifikate und As-Built-Dokumentation pflegen; mit Engineering Change abgleichen."
  BP-1090.70:
    name: "Stilllegung & Entsorgung"
    description: "Lebensende planen und ausführen — Stilllegung, Entsorgung, Wiederherstellung und finale buchhalterische Behandlung."
  BP-1090.70.10:
    name: "Stilllegung planen"
    description: "Lebensende planen — Timing, Umweltauflagen, Entfernung, Wiederherstellung, finanzielle Auswirkung."
  BP-1090.70.20:
    name: "Stilllegung ausführen"
    description: "Die Anlage stilllegen, demontieren und entfernen; Gefahrstoff-Handhabung und Standort-Wiederherstellung managen."
  BP-1090.70.30:
    name: "Anlage entsorgen oder verkaufen"
    description: "Die Anlage entsorgen, recyclen oder verkaufen; Restwert und Chain-of-Custody erfassen."
