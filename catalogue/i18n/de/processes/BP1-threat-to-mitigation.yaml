kind: business-process
locale: de
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "Bedrohung-zu-Minderung"
    description: "Cybersecurity-Operating-Zyklus von Posture-Definition über Threat Intelligence, Vulnerability Discovery, Detektion, Incident Response, Identity-and-Access-Härtung bis zu Awareness. Ein BP2 pro VS-600-stage_name."
  BP-1150.10:
    name: "Security-Posture-Definition"
    description: "Security-Posture, Kontroll-Baseline und Ziel-Reife für das Unternehmen definieren."
  BP-1150.10.10:
    name: "Security-Strategie definieren"
    description: "Cybersecurity-Strategie definieren — Risikoappetit, Ziel-Reife, Framework (NIST CSF, ISO 27001)."
  BP-1150.10.20:
    name: "Kontroll-Baseline setzen"
    description: "Die Kontroll-Baseline für das Unternehmen setzen; auf Kontroll-Frameworks und anwendbare Regulierung ausrichten."
  BP-1150.20:
    name: "Threat Intelligence"
    description: "Threat Intelligence sammeln, analysieren und an Verteidiger und Entscheider verteilen."
  BP-1150.20.10:
    name: "Threat Intelligence sammeln"
    description: "Threat Intelligence aus internen Sensoren, ISAC-Feeds, Vendoren und OSINT sammeln."
  BP-1150.20.20:
    name: "Intelligence analysieren und verteilen"
    description: "Intelligence auf Relevanz analysieren und operationalisieren — IOCs, Hunt-Hypothesen, Briefings."
  BP-1150.30:
    name: "Vulnerability Discovery"
    description: "Vulnerabilities entdecken — Scans, Pen-Tests, Bug Bounty, Code Review — und Remediation treiben."
  BP-1150.30.10:
    name: "Vulnerability-Scans durchführen"
    description: "Kontinuierliche Vulnerability-Scans über Infrastruktur, Anwendungen und Cloud-Workloads durchführen."
  BP-1150.30.20:
    name: "Penetrationstests durchführen"
    description: "Periodische und eventgetriebene Penetrationstests durchführen; ausnutzbare Findings und Remediations erfassen."
  BP-1150.30.30:
    name: "Vulnerability-Remediation treiben"
    description: "Vulnerabilities nach Ausnutzbarkeit und Asset-Kritikalität priorisieren; Remediation gegen SLA verfolgen."
  BP-1150.40:
    name: "Detektion"
    description: "Sicherheitsereignisse durch Monitoring, Analytics, Threat Hunting und Verhaltens-Baselines detektieren."
  BP-1150.40.10:
    name: "Security-Monitoring betreiben"
    description: "Das SOC betreiben — SIEM, EDR, XDR, Netzwerk-Detektion — um Sicherheitsereignisse 24/7 zu überwachen."
  BP-1150.40.20:
    name: "Alerts triagieren und untersuchen"
    description: "Alerts triagieren und untersuchen; bestätigte Incidents eskalieren; False Positives schließen."
  BP-1150.40.30:
    name: "Bedrohungen jagen"
    description: "Proaktive Threat Hunts auf Hypothesen aus Intelligence und Emerging TTPs durchführen."
  BP-1150.50:
    name: "Incident Response"
    description: "Auf bestätigte Sicherheits-Incidents reagieren — eindämmen, eradizieren, wiederherstellen und lernen."
  BP-1150.50.10:
    name: "Incident eindämmen"
    description: "Den Incident eindämmen — betroffene Systeme isolieren, Credentials widerrufen, Traffic blockieren — um die Ausbreitung zu stoppen."
  BP-1150.50.20:
    name: "Bedrohung eradizieren"
    description: "Die Bedrohung eradizieren — Malware entfernen, Vulnerability patchen, Persistenz-Mechanismus schließen."
  BP-1150.50.30:
    name: "Operationen wiederherstellen"
    description: "Betroffene Systeme und Operationen in einen Known-Good-Zustand wiederherstellen; vor Rückkehr in den Service validieren."
  BP-1150.50.40:
    name: "Benachrichtigen und reporten"
    description: "Regulatoren, Kunden und betroffene Parteien gemäß Breach-Notification-Verpflichtungen und Protokoll benachrichtigen."
  BP-1150.60:
    name: "Identity- & Access-Härtung"
    description: "Identity und Access härten — IAM, MFA, Privileged Access — um identitätsbasierte Angriffspfade zu verhindern."
  BP-1150.60.10:
    name: "Identity-Lebenszyklus managen"
    description: "Identity-Lebenszyklus managen — Provisioning, Rollenwechsel, Deprovisioning — über Mitarbeiter, Contractors und Maschinen."
  BP-1150.60.20:
    name: "Authentifizierungs-Kontrollen durchsetzen"
    description: "MFA, Conditional Access und risikobasierte Authentifizierung auf allen Zugriffspfaden durchsetzen."
  BP-1150.60.30:
    name: "Privileged Access governance"
    description: "Privileged Access governen — Vault, Just-in-Time-Elevation, Session-Monitoring, periodische Re-Attestation."
  BP-1150.70:
    name: "Awareness & Lessons Learned"
    description: "Security-Awareness in der Workforce durchführen; Lessons aus Incidents und Übungen erfassen."
  BP-1150.70.10:
    name: "Security-Awareness durchführen"
    description: "Security-Awareness-Schulung, Phishing-Simulationen und rollenbezogene Schulung durchführen."
  BP-1150.70.20:
    name: "Lessons erfassen und anwenden"
    description: "Lessons aus Incidents, Übungen und Breach-Berichten erfassen; auf Kontrollen, Schulung, Runbooks anwenden."
