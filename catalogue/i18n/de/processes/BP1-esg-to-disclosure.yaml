kind: business-process
locale: de
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-zu-Offenlegung"
    description: "Nachhaltigkeits-Reporting-Zyklus von ESG-Strategie und Wesentlichkeit über Datenerhebung, Datenqualität und Assurance, Reporting und Offenlegung, Stakeholder-Engagement bis zu Verbesserungszielen. Ein BP2 pro VS-200-stage_name."
    source_hash: sha256-66d60ef4b72a8d5f
  BP-1130.10:
    name: "ESG-Strategie & Wesentlichkeit"
    description: "ESG-Ambition setzen und doppelte Wesentlichkeitsbewertung durchführen, um sich auf das Wesentliche zu konzentrieren."
    source_hash: sha256-59d591c8d59454a6
  BP-1130.10.10:
    name: "ESG-Ambition setzen"
    description: "Die ESG-Ambition setzen und mit der Unternehmensstrategie verknüpfen; Net-Zero-, Sozial- und Governance-Ziele commiten."
    source_hash: sha256-5fa74157442208e6
  BP-1130.10.20:
    name: "Doppelte Wesentlichkeitsbewertung durchführen"
    description: "Doppelte Wesentlichkeitsbewertung durchführen, um wesentliche Themen zu identifizieren — finanzielle Wesentlichkeit und Auswirkungs-Wesentlichkeit."
    source_hash: sha256-4c2d2749ad94da76
  BP-1130.20:
    name: "Datenerhebung"
    description: "ESG-Daten erheben — Emissionen, Energie, Wasser, Abfall, Sozial, Governance — entlang der Wertschöpfungskette."
    source_hash: sha256-0c21f34aa6281b15
  BP-1130.20.10:
    name: "Umweltdaten erheben"
    description: "Emissionen (Scopes 1/2/3), Energie, Wasser, Abfall, Biodiversität und Verschmutzungsdaten aus dem Betrieb erheben."
    source_hash: sha256-b7ce2922da1bda78
  BP-1130.20.20:
    name: "Sozialdaten erheben"
    description: "Workforce-, Health-and-Safety-, Diversity-, Community- und Menschenrechtsdaten gemäß wesentlicher Themen erheben."
    source_hash: sha256-4e7113198459286a
  BP-1130.20.30:
    name: "Governance-Daten erheben"
    description: "Governance-Daten erheben — Vorstands-Komposition, Ethik, Anti-Bribery, Executive-Vergütung, Lieferantenverhalten."
    source_hash: sha256-e6cf111543dc7f20
  BP-1130.20.40:
    name: "Wertschöpfungsketten-Daten erheben"
    description: "Upstream- und Downstream-Wertschöpfungskettendaten erheben — Lieferanten-Emissionen, Produkt-Use-Phase, End-of-Life."
    source_hash: sha256-0af74fa019d57c4d
  BP-1130.30:
    name: "Datenqualität & Assurance"
    description: "Datenqualitäts-Kontrollen ausführen und externe Assurance auf offengelegten Daten erhalten."
    source_hash: sha256-f9693fa74569cc51
  BP-1130.30.10:
    name: "ESG-Datenqualitäts-Kontrollen ausführen"
    description: "Vollständigkeits-, Genauigkeits-, Konsistenz- und Nachverfolgbarkeits-Kontrollen über ESG-Daten ausführen."
    source_hash: sha256-7017be162f9deabf
  BP-1130.30.20:
    name: "Externe Assurance erhalten"
    description: "Assurance-Provider für limitierte oder reasonable Assurance auf offengelegten Metriken gemäß anwendbarem Standard engagieren."
    source_hash: sha256-5f0c5838aacf550a
  BP-1130.40:
    name: "Reporting & Offenlegung"
    description: "ESG-Bericht und regulatorische Offenlegungen produzieren — CSRD/ESRS, SEC-Klima, GRI, SASB, TCFD, ISSB."
    source_hash: sha256-2d52a82565566693
  BP-1130.40.10:
    name: "ESG-Disclosure-Pack aufbauen"
    description: "Den ESG-Disclosure-Pack aufbauen — Narrative, Metriken, Fußnoten, Mappings auf Standards."
    source_hash: sha256-83bb85f5f8360240
  BP-1130.40.20:
    name: "Regulatorische Offenlegungen einreichen"
    description: "Pflicht-ESG-/Nachhaltigkeits-Offenlegungen einreichen — CSRD/ESRS, SEC-Klima, jurisdiktionale Taxonomien."
    source_hash: sha256-7c0fab2067dbeb32
  BP-1130.40.30:
    name: "Freiwillige Frameworks publizieren"
    description: "Freiwillige Offenlegungen publizieren — GRI, SASB, TCFD, CDP, ISSB — auf wesentliche Themen ausgerichtet."
    source_hash: sha256-bd460ef4e53b9bd9
  BP-1130.50:
    name: "Stakeholder-Engagement"
    description: "Stakeholder engagieren — Investoren, Regulatoren, Kunden, Mitarbeiter, NGOs, Communities — zu ESG."
    source_hash: sha256-b4049d33409ffab1
  BP-1130.50.10:
    name: "Investoren und Analysten engagieren"
    description: "ESG-fokussierte Investoren und Rating-Agenturen engagieren; auf Fragebögen und Ratings reagieren."
    source_hash: sha256-8756d4ffe0961ddf
  BP-1130.50.20:
    name: "Communities und NGOs engagieren"
    description: "Lokale Communities, NGOs und zivilgesellschaftliche Stakeholder zu Auswirkung und Remediation engagieren."
    source_hash: sha256-263f7bd55b5594a0
  BP-1130.60:
    name: "Verbesserungsziele"
    description: "Verbesserungsziele über den Horizont setzen, verfolgen und anpassen — Emissionen, Sozial, Governance."
    source_hash: sha256-06b57ef8ea29fa2b
  BP-1130.60.10:
    name: "Verbesserungsziele setzen"
    description: "Science-based Targets und andere ESG-Verbesserungsziele setzen, ausgerichtet auf Ambition und wesentliche Themen."
    source_hash: sha256-539bdc8cfd82ce5e
  BP-1130.60.20:
    name: "Ziel-Fortschritt verfolgen"
    description: "Fortschritt gegen Ziele über den ESG-Zyklus verfolgen; Lücken aufdecken und Korrekturmaßnahmen entscheiden."
    source_hash: sha256-2286ebfa082ad915
