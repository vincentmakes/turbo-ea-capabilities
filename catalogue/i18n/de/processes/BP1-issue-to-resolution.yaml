kind: business-process
locale: de
source: BP1-issue-to-resolution.yaml
entries:
  BP-1070:
    name: "Vorfall-zu-Lösung"
    description: "Universeller Incident- und Issue-Handling-Zyklus von der Erfassung über Untersuchung, Lösung bis zu Lessons Learned. Übergreifend genutzt in Kundendienst, IT, Sicherheit, Compliance, Audit und Operational Risk — branchenspezifische Varianten in VS-310 reduzieren sich hier auf vier logische Phasen."
  BP-1070.10:
    name: "Vorfall-Erfassung"
    description: "Vorfälle, Beschwerden, Defekte, Beinahe-Unfälle und Audit-Findings über jeden Kanal erfassen; mit strukturierten Metadaten persistieren."
  BP-1070.10.10:
    name: "Vorfall empfangen"
    description: "Den Vorfall vom auslösenden Kanal (Kunde, Mitarbeiter, System, Regulator, Audit) im Issue-Management-System annehmen."
  BP-1070.10.20:
    name: "Vorfall klassifizieren"
    description: "Vorfall nach Typ, Schweregrad, Geschäftsauswirkung und betroffenem Service oder Asset klassifizieren; in die richtige Queue routen."
  BP-1070.10.30:
    name: "An Auslöser bestätigen"
    description: "Empfangsbestätigung an den Auslöser mit Fall-Identifier und erwarteter Reaktionskadenz."
  BP-1070.10.40:
    name: "Major-Incident-Protokoll auslösen"
    description: "Bei hochgradig schweren Vorfällen das Major-Incident- oder Krisen-Protokoll auslösen — Incident Commander, War-Room, Eskalationspfade."
  BP-1070.20:
    name: "Untersuchung"
    description: "Den Vorfall untersuchen — Beweise sammeln, Diagnosen durchführen, Wurzelursache identifizieren und Auswirkung bewerten."
  BP-1070.20.10:
    name: "Beweise sammeln"
    description: "Logs, Aussagen, Proben und andere für den Vorfall relevante Beweise sammeln; in der Falldatei persistieren."
  BP-1070.20.20:
    name: "Wurzelursache diagnostizieren"
    description: "Wurzelursachen-Analysemethoden (5-Whys, Fault-Tree, Fishbone) anwenden, um primäre und beitragende Ursachen zu identifizieren."
  BP-1070.20.30:
    name: "Auswirkung bewerten"
    description: "Kunden-, finanzielle, regulatorische, sicherheitsbezogene und Reputationsauswirkung des Vorfalls und des vorgeschlagenen Lösungspfades bewerten."
  BP-1070.30:
    name: "Lösung"
    description: "Den Vorfall lösen — Service wiederherstellen, Schaden beheben, kommunizieren und den Fall schließen."
  BP-1070.30.10:
    name: "Workaround anwenden"
    description: "Einen Workaround anwenden, um den Service wiederherzustellen oder Schaden einzudämmen, während die dauerhafte Behebung entwickelt wird."
  BP-1070.30.20:
    name: "Permanente Behebung implementieren"
    description: "Die permanente Korrekturmaßnahme über Change Management entwickeln und deployen; die Behebung validieren."
  BP-1070.30.30:
    name: "Lösung kommunizieren"
    description: "Lösung an Auslöser, betroffene Kunden, Regulatoren wo erforderlich und interne Stakeholder kommunizieren."
  BP-1070.30.40:
    name: "Fall schließen"
    description: "Auslöser-Zufriedenheit bestätigen; den Fall mit vollständigem Audit-Trail und CSAT- oder äquivalentem Rating schließen."
  BP-1070.40:
    name: "Lessons Learned"
    description: "Lessons aus dem Fall extrahieren, systemische präventive Maßnahmen treiben und die Lösungsfähigkeit verbessern."
  BP-1070.40.10:
    name: "Post-Incident-Review durchführen"
    description: "Blameless Post-Incident-Review durchführen; erfassen, was gut lief, was nicht und was geändert werden soll."
  BP-1070.40.20:
    name: "Präventive Maßnahmen treiben"
    description: "Präventive Maßnahmen (System, Prozess, Schulung) öffnen und verfolgen; Schließung mit Evidenz bestätigen."
  BP-1070.40.30:
    name: "Knowledge Base aktualisieren"
    description: "Knowledge Base, Runbooks und Entscheidungsregeln mit neuer Evidenz aktualisieren, um zukünftige Lösungen zu beschleunigen."
