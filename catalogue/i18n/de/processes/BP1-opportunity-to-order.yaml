kind: business-process
locale: de
source: BP1-opportunity-to-order.yaml
entries:
  BP-1060:
    name: "Opportunity-zu-Auftrag"
    description: "Pre-Sale-Enterprise-Selling-Zyklus von der Opportunity-Qualifizierung über Solution-Scoping, Angebot und Konfiguration, Pricing-Genehmigungen, Proposal, Verhandlung, Vertrag und Auftrags-Buchung bis zur Übergabe an die Erfüllung. Ein BP2 pro VS-380-stage_name."
    source_hash: sha256-8a1a0e6c41d58ca5
  BP-1060.10:
    name: "Opportunity-Qualifizierung"
    description: "Die Opportunity gegen Fit, Budget, Authority und Timing qualifizieren; entscheiden, ob Pursuit-Aufwand investiert wird."
    source_hash: sha256-cfcce898301b9f16
  BP-1060.10.10:
    name: "Opportunity erfassen"
    description: "Die Opportunity im CRM mit Quelle, interessierten Produkten, Ziel-Close und Account-Kontext erfassen."
    source_hash: sha256-436ccbe744d04f49
  BP-1060.10.20:
    name: "Opportunity qualifizieren"
    description: "Qualifizierungskriterien (BANT, MEDDIC oder äquivalent) anwenden, um Fit, Budget, Authority, Bedarf und Timing zu validieren."
    source_hash: sha256-0edf81b549f113b1
  BP-1060.10.30:
    name: "Pursuit-Plan aufbauen"
    description: "Pursuit entscheiden, Account-Plan und Decision-Making-Unit-Map aufbauen und das Pursuit-Team zusammenstellen."
    source_hash: sha256-05a81bb7581c5e2e
  BP-1060.20:
    name: "Solution-Scoping"
    description: "Kundenanforderungen entdecken und eine Lösung scopen, die diese innerhalb kommerzieller und Liefer-Beschränkungen erfüllt."
    source_hash: sha256-3a1257e11aeb8669
  BP-1060.20.10:
    name: "Anforderungen entdecken"
    description: "Discovery-Workshops und Interviews durchführen, um funktionale, nicht-funktionale und operating-Kontext-Anforderungen zu erfassen."
    source_hash: sha256-e484ab7a698ed3a5
  BP-1060.20.20:
    name: "Lösung designen"
    description: "Anforderungen in eine Kandidatenlösung übersetzen — Produkte, Services, Integrationen, Konfigurationen."
    source_hash: sha256-431bb2ccc1177c11
  BP-1060.20.30:
    name: "Lösungsmachbarkeit validieren"
    description: "Die Lösung mit Delivery, Finanz und Risiko auf Machbarkeit, Lieferbarkeit und akzeptable Marge validieren."
    source_hash: sha256-891b9f5af2c22958
  BP-1060.30:
    name: "Angebot & Konfiguration"
    description: "Das bepreiste Angebot für den Kunden mit Produkt-Konfigurator, Pricing-Regeln und Rabatt-Frameworks konfigurieren."
    source_hash: sha256-9985d7a00beac8c2
  BP-1060.30.10:
    name: "Lösungsbündel konfigurieren"
    description: "Den Produkt-Konfigurator nutzen, um das bepreiste Bündel aus Angebotskatalog-Komponenten zu komponieren."
    source_hash: sha256-dbd0a6f8c05d9bfc
  BP-1060.30.20:
    name: "Angebot kalkulieren"
    description: "Listenpreis, vertraglichen Rabatt und Steuerregeln anwenden, um das bepreiste Angebot zu produzieren."
    source_hash: sha256-acb8536573a9c904
  BP-1060.40:
    name: "Pricing & Genehmigungen"
    description: "Rabatt- und Marge-Governance anwenden; durch Pricing-Genehmigungs-Workflow routen; Genehmigerentscheidungen erfassen."
    source_hash: sha256-ae9b5bc5a53cd4fb
  BP-1060.40.10:
    name: "Pricing-Compliance prüfen"
    description: "Das Angebot gegen Rabatt-, Marge- und Special-Pricing-Agreement-Regeln validieren; Ausnahmen markieren."
    source_hash: sha256-1a9666f3ca203856
  BP-1060.40.20:
    name: "Pricing-Genehmigungen routen"
    description: "Ausnahme-Angebote durch die Rabatt-Genehmigungshierarchie routen; Entscheidungen, Bedingungen und Begründung erfassen."
    source_hash: sha256-5940523d16019a2e
  BP-1060.50:
    name: "Proposal-Entwicklung"
    description: "Das formale Proposal oder die RFP-Antwort aufbauen; Inputs aus Solution, Legal, Security und Delivery orchestrieren."
    source_hash: sha256-c9cc2f984d49d0f4
  BP-1060.50.10:
    name: "Proposal-Inhalt verfassen"
    description: "Die Proposal-Erzählung verfassen — Executive Summary, Lösung, Delivery, Kommerzielles, Referenzen, Bedingungen."
    source_hash: sha256-1e95a476ce3a5f0e
  BP-1060.50.20:
    name: "SME-Inputs koordinieren"
    description: "Inputs von Solution-, Legal-, Security-, Finanz- und Delivery-SMEs in das Proposal koordinieren."
    source_hash: sha256-adc9e8e346581fb6
  BP-1060.50.30:
    name: "Proposal einreichen"
    description: "Das Proposal über den vom Kunden geforderten Kanal (RFP-Portal, E-Mail, persönlich) formatieren, reviewen und einreichen."
    source_hash: sha256-0c91eafc652e43e7
  BP-1060.60:
    name: "Verhandlung"
    description: "Die kommerziellen und vertraglichen Bedingungen mit dem Kunden verhandeln; offene Positionen bis zur Annahme klären."
    source_hash: sha256-5b67248014901319
  BP-1060.60.10:
    name: "Kommerzielle Verhandlung führen"
    description: "Preis, Zahlungsbedingungen, Volumenverpflichtungen und kommerzielle Konzessionen verhandeln."
    source_hash: sha256-e80a594858f1cbe0
  BP-1060.60.20:
    name: "Vertragsbedingungen verhandeln"
    description: "Rechtliche Bedingungen — SLAs, Freistellungen, IP, Sicherheit, Daten — mit Legal und Kunden-Counsel verhandeln."
    source_hash: sha256-05e5b44465e6cf12
  BP-1060.60.30:
    name: "Offene Punkte klären"
    description: "Alle offenen Punkte — kommerziell, technisch, rechtlich — verfolgen und schließen, bis der Kunde unterzeichnungsbereit ist."
    source_hash: sha256-460b5ec799c72c0d
  BP-1060.70:
    name: "Vertrag & Auftrags-Buchung"
    description: "Den Vertrag ausführen, den Auftrag buchen und nachgelagerte Provisionierung, Erfüllung und Umsatzrealisierung auslösen."
    source_hash: sha256-7e7532bf65be5538
  BP-1060.70.10:
    name: "Vertrag ausführen"
    description: "Unterschriften von Kunde und autorisiertem Unterzeichner erfassen; den ausgeführten Vertrag persistieren; mit Account und Auftrag verknüpfen."
    source_hash: sha256-5dcd5cb7d7b77fc9
  BP-1060.70.20:
    name: "Verkaufsauftrag buchen"
    description: "Den ausgeführten Vertrag in einen festen Verkaufsauftrag im OMS umwandeln; Vollständigkeit gegen Vertragsbedingungen validieren."
    source_hash: sha256-9bfea8ca62d52534
  BP-1060.70.30:
    name: "Buchung mit Finance bestätigen"
    description: "Die Buchung an Finance für Backlog, Billing und Umsatzrealisierungs-Setup bestätigen; etwaige Holds klären."
    source_hash: sha256-0874878ede4057bd
  BP-1060.80:
    name: "Übergabe an Erfüllung"
    description: "Den gebuchten Auftrag an Erfüllung, Lieferung oder Service-Teams übergeben; den Loop mit Sales für Renewal schließen."
    source_hash: sha256-acd76b2c5aac72c9
  BP-1060.80.10:
    name: "Sales-zu-Delivery-Übergabe durchführen"
    description: "Das Übergabe-Meeting durchführen; Kontext, Erfolgskriterien und Kundenbeziehungen von Sales an Delivery transferieren."
    source_hash: sha256-58ff5189568c4e64
  BP-1060.80.20:
    name: "Delivery-Engagement aufsetzen"
    description: "Das Delivery-Engagement aufsetzen — Projekt, Account-Team, Success-Plan — und Kick-off-Readiness bestätigen."
    source_hash: sha256-a10e2ab2cb17661b
  BP-1060.80.30:
    name: "Sales-Zyklus schließen"
    description: "Die Opportunity im CRM schließen, Win/Loss-Gründe erfassen und Provisions- und Renewal-Tracking-Workflows auslösen."
    source_hash: sha256-024a3560b43944cb
