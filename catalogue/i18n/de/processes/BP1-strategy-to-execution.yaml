kind: business-process
locale: de
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Strategie-zu-Ausführung"
    description: "End-to-End-Strategie-Lieferzyklus von der Strategieformulierung über Portfolio-Definition, Programm- und Projekt-Setup, Lieferung und Governance, Change-Adoption bis zur Benefit-Realisierung. Ein BP2 pro VS-580-stage_name."
  BP-1100.10:
    name: "Strategieformulierung"
    description: "Die Unternehmensstrategie definieren — Vision, Ziele, Choices und das Operating Model, das zum Gewinnen erforderlich ist."
  BP-1100.10.10:
    name: "Strategische Richtung definieren"
    description: "Vision, Mission, strategische Ziele und die die Choices leitenden Prinzipien definieren."
  BP-1100.10.20:
    name: "Strategische Choices treffen"
    description: "Where-to-Play- und How-to-Win-Choices treffen; Trade-offs zwischen Märkten, Segmenten, Produkten und Capabilities arbitrieren."
  BP-1100.10.30:
    name: "Operating Model definieren"
    description: "Das Operating Model definieren — Capabilities, Organisation, Standorte und Partner — das zur Strategieausführung benötigt wird."
  BP-1100.20:
    name: "Portfolio-Definition"
    description: "Strategie in ein Portfolio von Programmen und Investitionen übersetzen, das die gewählten Outcomes liefert."
  BP-1100.20.10:
    name: "Portfolio-Investitionen identifizieren"
    description: "Kandidaten-Investitionen identifizieren, die strategische Lücken schließen; Wert, Kosten, Risiko und Abhängigkeiten erfassen."
  BP-1100.20.20:
    name: "Portfolio priorisieren"
    description: "Investitionen nach Wert, Fit, Kapazität und Risiko priorisieren; das integrierte Portfolio über Horizonte aufbauen."
  BP-1100.20.30:
    name: "Portfolio freigeben"
    description: "Das Portfolio über das Executive-Forum freigeben und finanzieren; Programm- und Projekt-Setup auslösen."
  BP-1100.30:
    name: "Programm- & Projekt-Setup"
    description: "Programme und Projekte mit Charter, Governance, Plan, Team und Budget aufsetzen."
  BP-1100.30.10:
    name: "Programm chartern"
    description: "Das Programm chartern — Outcomes, Scope, Governance, Sponsor, Verantwortlichkeiten, Erfolgskriterien."
  BP-1100.30.20:
    name: "Programmlieferung planen"
    description: "Den integrierten Lieferplan über die konstituierenden Projekte aufbauen, mit Meilensteinen, Abhängigkeiten und Ressourcen."
  BP-1100.30.30:
    name: "Projektteams aufstellen"
    description: "Projektteams zusammenstellen, Rollen bestätigen, onboarden und Sprint- oder Phase-Zero-Arbeit auslösen."
  BP-1100.40:
    name: "Lieferung & Governance"
    description: "Programme und Projekte gegen den Plan liefern; Governance durchführen, um Risiken aufzudecken, Change zu entscheiden und Qualität zu sichern."
  BP-1100.40.10:
    name: "Projektarbeit ausführen"
    description: "Projektarbeit ausführen — Design, Build, Test, Lieferung — gemäß gewählter Liefermethode (agil, Wasserfall, hybrid)."
  BP-1100.40.20:
    name: "Programm-Governance durchführen"
    description: "Steering Committees, Entscheidungsforen und Quality Gates unter Corporate-Governance-Autorität des Unternehmens durchführen; Risiken, Issues und Changes aufdecken und lösen."
  BP-1100.40.30:
    name: "Programm-Risiken und -Changes managen"
    description: "Risikoregister und Change Log pflegen; mitigieren, eskalieren und Changes über Governance entscheiden."
  BP-1100.50:
    name: "Change-Adoption"
    description: "End-User-Adoption der vom Programm gelieferten Changes treiben — kommunizieren, schulen, unterstützen, verankern."
  BP-1100.50.10:
    name: "Change-Adoption planen"
    description: "Den Change-Adoption-Plan aufbauen — Stakeholder-Mapping, Kommunikation, Schulung, Support, Nachhaltigkeit."
  BP-1100.50.20:
    name: "Kommunizieren und schulen"
    description: "Kommunikation und Schulung über die betroffene Population gemäß Change-Adoption-Plan durchführen."
  BP-1100.50.30:
    name: "Adoption unterstützen"
    description: "Hyper-Care-Support liefern, Adoption-Blocker aufdecken und Verstärkungsaktivitäten durchführen."
  BP-1100.60:
    name: "Benefit-Realisierung"
    description: "Strategische Benefits, die das Programm zugesagt hat, verfolgen und erfassen; Programm schließen."
  BP-1100.60.10:
    name: "Benefit-Metriken verfolgen"
    description: "Zugesagte Benefits — Umsatz, Kosten, NPS, Throughput — gegen Baseline und Ziel verfolgen."
  BP-1100.60.20:
    name: "Benefits einfangen"
    description: "Benefits in Business-as-Usual einfangen — in Budgets, KPI und Run-the-Business-Prozesse einbetten."
  BP-1100.60.30:
    name: "Programm schließen"
    description: "Das Programm schließen — Abschlussbericht, Lessons Learned, Archivierung, Team-Freigabe; Folgeportfolio-Bewegungen auslösen."
