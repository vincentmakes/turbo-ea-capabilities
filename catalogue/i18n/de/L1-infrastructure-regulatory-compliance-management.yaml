locale: de
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Infrastruktur-Regulierungs- und Compliance-Management
    description: |
      Management der wirtschaftlichen und sicherheitsbezogenen Regulierung von
      Infrastruktur, umfassend Regulatorbeziehungen und Preiskontrollanträge,
      Lizenz- und Pflichtenmanagement, Sicherheitsnachweise und Assurance,
      regulatorische Berichterstattung sowie Genehmigungen und behördliche
      Zulassungen.
    in_scope:
      - Regulatorenengagement und Preiskontrollanträge
      - Management von Betriebslizenzen und gesetzlichen Pflichten
      - Entwicklung von Sicherheitsnachweisen und Sicherheits-Assurance
      - Regulatorische Leistungs- und gesetzliche Berichterstattung
      - Management operativer, umweltbezogener und gesetzlicher Genehmigungen
      - Unterstützung regulatorischer Prüfungen und Offenlegung
    out_of_scope:
      - Branchenübergreifendes Compliance-Management (BC-130)
      - Unternehmensrisikomanagement (BC-140)
      - Konzessions-Kaufmännisches-Management (BC-5100)
      - Unternehmensrecht und Prozessführungsmanagement
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Regulatorbeziehungsmanagement
    description: |
      Engagement mit Wirtschaftsregulierern und Management von Preiskontrollanträgen
      und -festlegungen.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Regulatorenengagement
    description: |
      Laufendes Engagement und Beziehungsmanagement mit Wirtschafts- und
      Sektorregulierern.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: Preiskontrolle und Festlegung
    description: |
      Management regulatorischer Preiskontrollprozesse und periodischer
      Festlegungen.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Management regulatorischer Einreichungen
    description: |
      Erstellung und Management formeller Einreichungen bei Regulierern.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Überwachung regulatorischer Änderungen
    description: |
      Überwachung und Interpretation regulatorischer Änderungen, die das
      Unternehmen betreffen.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: Lizenz- und Pflichtenmanagement
    description: |
      Management von Betriebslizenzen und der daran geknüpften gesetzlichen
      Pflichten und Bedingungen.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Betriebslizenzmanagement
    description: |
      Management von Betriebslizenzen, die der Infrastrukturbetreiber hält.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Nachverfolgung gesetzlicher Pflichten
    description: |
      Nachverfolgung gesetzlicher Pflichten und ihrer Erfüllung über das
      Unternehmen.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Einhaltung von Lizenzbedingungen
    description: |
      Sicherstellung der Einhaltung der an Betriebslizenzen geknüpften
      Bedingungen.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: Management von Pflichten und Zusagen
    description: |
      Management gesetzlicher Pflichten und Zusagen gegenüber Regulierern und
      Behörden.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: Sicherheitsnachweis und Assurance
    description: |
      Entwicklung von Sicherheitsnachweisen sowie die Assurance und
      Zertifizierung, die sicheren Betrieb belegen.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Entwicklung von Sicherheitsnachweisen
    description: |
      Entwicklung und Pflege von Sicherheitsnachweisen für Infrastrukturanlagen
      und -betrieb.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: Sicherheitszertifizierung und -autorisierung
    description: |
      Erlangung der zum Betrieb erforderlichen Sicherheitszertifizierung und
      -autorisierung.
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: Sicherheitsregulatorische Assurance
    description: |
      Assurance gegenüber Sicherheitsregulierern, dass Sicherheitspflichten
      erfüllt werden.
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: Unabhängige Sicherheitsbewertung
    description: |
      Unabhängige Bewertung und Validierung von Sicherheitsnachweisen und
      -vorkehrungen.
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: Regulatorische Berichterstattung und Offenlegung
    description: |
      Berichterstattung von Leistungs-, Finanz- und gesetzlichen Informationen an
      Regulierer und Stakeholder.
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: Regulatorische Leistungsberichterstattung
    description: |
      Berichterstattung von operativer und Serviceleistung an Regulierer.
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: Regulatorische Finanzberichterstattung
    description: |
      Berichterstattung regulatorischer Finanz- und Kosteninformationen an
      Behörden.
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: Gesetzliche Offenlegung
    description: |
      Offenlegung gesetzlicher Informationen, die durch Recht und Regulierung
      gefordert werden.
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: Unterstützung regulatorischer Prüfungen
    description: |
      Unterstützung regulatorischer Prüfungen, Reviews und Untersuchungen.
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: Genehmigungen und behördliche Zulassungen
    description: |
      Management operativer, umweltbezogener und gesetzlicher Genehmigungen und
      der zum Betrieb erforderlichen Zulassungen.
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: Management operativer Genehmigungen
    description: |
      Management operativer Genehmigungen, die für Infrastrukturaktivitäten
      erforderlich sind.
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: Management behördlicher Zulassungen
    description: |
      Management behördlicher Zulassungen und Genehmigungen von Behörden.
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: Einhaltung von Umweltgenehmigungen
    description: |
      Einhaltung von Umweltgenehmigungen und ihren Bedingungen.
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: Genehmigungserneuerung und -änderung
    description: |
      Erneuerung und Änderung von Genehmigungen und Zulassungen bei
      Betriebsänderungen.
    source_hash: sha256-07c3c25fd50f1ebe
metadata:
  translator: claude-ai
  date: "2026-07-16"
