locale: de
source: L1-infrastructure-resilience-security-management.yaml
entries:
  BC-5120:
    name: Infrastruktur-Resilienz- und Sicherheitsmanagement
    description: |
      Schutz und Resilienz kritischer Infrastruktur über physische Sicherheit,
      cyber-physische und Betriebstechnik-Sicherheit (OT), Resilienz und
      Kontinuität, Notfall- und Krisenmanagement sowie Klima- und
      Umweltresilienz.
    in_scope:
      - Physische Sicherheit, Zugangskontrolle und Überwachung
      - Cyber-physische und Betriebstechnik-Sicherheit (OT)
      - Operative Resilienz und Betriebskontinuität
      - Notfallvorsorge und Krisenmanagement
      - Klimaanpassung und Resilienz gegenüber Extremwetter
      - Schutz kritischer Systeme und Anlagen
    out_of_scope:
      - Unternehmensrisikomanagement (BC-140)
      - Betriebskontinuitätsmanagement (BC-160)
      - Cybersicherheitsmanagement (BC-620)
      - Gesundheit, Sicherheit & Umwelt (BC-5050)
    source_hash: sha256-bcfbe910a7b9a461
  BC-5120.10:
    name: Management der physischen Sicherheit
    description: |
      Schutz von Infrastrukturstandorten und -anlagen durch Zugangskontrolle,
      Überwachung und Sicherheitspersonal.
    source_hash: sha256-ab6fd81d819c7d19
  BC-5120.10.10:
    name: Zugangs- und Eindringmanagement
    description: |
      Management von Zugangsrechten und Erkennung unbefugten Eindringens an
      Infrastrukturstandorten.
    source_hash: sha256-bf54fd2f6191d076
  BC-5120.10.20:
    name: Perimeter- und Zutrittskontrolle
    description: |
      Kontrolle von Standortperimetern und physischen Zugangspunkten zu
      kritischen Anlagen.
    source_hash: sha256-aaeb117e531a75c4
  BC-5120.10.30:
    name: Sicherheitsüberwachung
    description: |
      Überwachung und Monitoring von Infrastrukturstandorten auf
      Sicherheitsbedrohungen.
    source_hash: sha256-c8a6e9e5d44e94ed
  BC-5120.10.40:
    name: Management des Sicherheitspersonals
    description: |
      Management von Sicherheitspersonal und Bewachungsdiensten über Standorte.
    source_hash: sha256-92a7a9683019e254
  BC-5120.20:
    name: Cyber-physische Sicherheit
    description: |
      Schutz von Betriebstechnik (OT) und Steuerungssystemen, die kritische
      Infrastruktur betreiben, vor cyber-physischen Bedrohungen.
    source_hash: sha256-76663dc59f61c43e
  BC-5120.20.10:
    name: OT- und Steuerungssystemsicherheit
    description: |
      Sicherheit von Betriebstechnik (OT) und industriellen Steuerungssystemen,
      die Infrastruktur untermauern.
    source_hash: sha256-bab81199c8b2066f
  BC-5120.20.20:
    name: Schutz kritischer Systeme
    description: |
      Schutz kritischer Systeme und Anlagen, die für den Infrastrukturbetrieb
      wesentlich sind.
    source_hash: sha256-8782fc5bee69d8ed
  BC-5120.20.30:
    name: Management cyber-physischer Bedrohungen
    description: |
      Management von Bedrohungen, die die cyber- und physischen Domänen der
      Infrastruktur umspannen.
    source_hash: sha256-45b5d8d04bf46916
  BC-5120.20.40:
    name: Sicherheitsüberwachung und -reaktion
    description: |
      Überwachung auf Sicherheitsereignisse und Reaktion auf Vorfälle, die
      Steuerungssysteme betreffen.
    source_hash: sha256-2c7999abe3b319bf
  BC-5120.30:
    name: Resilienz- und Kontinuitätsmanagement
    description: |
      Planung und Erprobung, die kritische Infrastrukturdienste durch Störungen
      hindurch am Laufen halten.
    source_hash: sha256-50c82bf8d9652c50
  BC-5120.30.10:
    name: Planung operativer Resilienz
    description: |
      Planung für die operative Resilienz kritischer Infrastrukturdienste.
    source_hash: sha256-87d444d87065fb57
  BC-5120.30.20:
    name: Betriebskontinuitätsmanagement
    description: |
      Management der Betriebskontinuität für den Infrastrukturbetrieb während
      Störungen.
    source_hash: sha256-e9e5fdd1c4f37b7d
  BC-5120.30.30:
    name: Redundanz- und Failover-Design
    description: |
      Gestaltung von Redundanz und Failover zur Aufrechterhaltung des Service bei
      Anlagenausfall.
    source_hash: sha256-de3a61dc3d3e824a
  BC-5120.30.40:
    name: Resilienztests und -übungen
    description: |
      Test und Übung von Resilienz- und Kontinuitätsvorkehrungen.
    source_hash: sha256-ccbec6e3ab225a02
  BC-5120.40:
    name: Notfall- und Krisenmanagement
    description: |
      Vorbereitung auf und Reaktion auf Notfälle und Krisen, die Infrastruktur
      und ihre Nutzer betreffen.
    source_hash: sha256-c9a84def75d1bc66
  BC-5120.40.10:
    name: Notfallvorsorge
    description: |
      Vorsorgeplanung für Notfälle, die Infrastrukturanlagen und -dienste
      betreffen.
    source_hash: sha256-2c08b126adcf3a8b
  BC-5120.40.20:
    name: Krisenmanagement
    description: |
      Management von Krisen, die den Infrastrukturbetrieb und die Stakeholder
      bedrohen.
    source_hash: sha256-dda20de9498639d8
  BC-5120.40.30:
    name: Koordination der Notfallreaktion
    description: |
      Koordination der Notfallreaktion über Teams und externe Einsatzkräfte
      hinweg.
    source_hash: sha256-23673881e80ccf22
  BC-5120.40.40:
    name: Wiederherstellungs- und Wiederinbetriebnahmeplanung
    description: |
      Planung für Wiederherstellung und Wiederinbetriebnahme von Diensten nach
      störenden Ereignissen.
    source_hash: sha256-e8210e4f65f83176
  BC-5120.50:
    name: Klima- und Umweltresilienz
    description: |
      Anpassung und Schutz von Infrastruktur gegen Klimawandel und
      Umweltgefahren.
    source_hash: sha256-5c8519c07ef26be6
  BC-5120.50.10:
    name: Management der Klimaanpassung
    description: |
      Management der Klimaanpassung für langlebige Infrastrukturanlagen.
    source_hash: sha256-7eded7738db31aa4
  BC-5120.50.20:
    name: Resilienz gegenüber Extremwetter
    description: |
      Resilienz von Infrastruktur gegenüber Extremwetterereignissen und ihren
      Auswirkungen.
    source_hash: sha256-d38d9fa5f0f02308
  BC-5120.50.30:
    name: Hochwasser- und Gefahrenschutz
    description: |
      Schutz von Infrastruktur gegen Hochwasser und Naturgefahren.
    source_hash: sha256-e133de2790603d36
  BC-5120.50.40:
    name: Management von Umweltgefahren
    description: |
      Management von Umweltgefahren, die Infrastruktur und ihre Umgebung
      betreffen.
    source_hash: sha256-f9a3bb27d308ea50
metadata:
  translator: claude-ai
  date: "2026-07-16"
