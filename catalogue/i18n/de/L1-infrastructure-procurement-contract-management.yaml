locale: de
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Infrastruktur-Beschaffungs- und Vertragsmanagement
    description: |
      Beschaffungsstrategie, Ausschreibung und Vertragsverwaltung für die
      Infrastrukturlieferung, einschließlich kaufmännischem und
      Mengenermittlungs-Management, Nachträgen und Ansprüchen sowie
      Nachunternehmer- und Lieferkettenmanagement.
    in_scope:
      - Beschaffungsstrategie, Paketierung und Vergabewegauswahl
      - Ausschreibung, Angebotsmanagement und Präqualifikation
      - Vertragsschluss, -verwaltung und Zahlungszertifizierung
      - Kaufmännisches und Mengenermittlungs- und Bewertungsmanagement
      - Management von Nachträgen, Entschädigungsereignissen und Ansprüchen
      - Nachunternehmer- und Lieferkettenbeschaffung sowie -leistung
    out_of_scope:
      - Unternehmensbeschaffung (BC-500)
      - Ingenieurausschreibung und -kalkulation (BC-1140)
      - Lieferantenbeziehungsmanagement (BC-510)
      - Bauwerksausführung und Baustellenlieferung
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: Beschaffungsstrategie und Paketierung
    description: |
      Definition von Beschaffungsstrategie, Arbeitspaketierung und Vergabewegen
      für die Infrastrukturlieferung.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Definition der Beschaffungsstrategie
    description: |
      Definition der Beschaffungsstrategie, ausgerichtet an Programmzielen und
      Marktkapazität.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Definition der Arbeitspakete
    description: |
      Strukturierung von Arbeit in Pakete, die auf Markt- und Lieferbedarfe
      zugeschnitten sind.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Auswahl des Vergabewegs
    description: |
      Auswahl von Vergabewegen und Vertragsformen, die für jedes Paket
      angemessen sind.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Lieferantenmarkt-Engagement
    description: |
      Frühzeitiges Engagement mit dem Lieferantenmarkt zur Gestaltung und
      Erprobung von Beschaffungsansätzen.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: Ausschreibung und Angebotsmanagement
    description: |
      Erstellung, Bewertung und Vergabe von Ausschreibungen für
      Infrastrukturbauwerke und -dienstleistungen.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Ausschreibungserstellung
    description: |
      Erstellung von Ausschreibungsunterlagen und Anforderungen zur Ausgabe an
      den Markt.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: Angebotsentwicklung und -abgabe
    description: |
      Entwicklung und Abgabe konformer, wettbewerbsfähiger Angebote in der Rolle
      als Bieter.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: Angebotsbewertung und -vergabe
    description: |
      Bewertung von Angeboten und Vergabe von Verträgen anhand definierter
      Kriterien.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Präqualifikationsmanagement
    description: |
      Management der Lieferantenpräqualifikation und Auswahllisten.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Vertragsverwaltung
    description: |
      Verwaltung von Infrastrukturverträgen über Zustandekommen, Pflichten,
      Zahlung und Governance.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Vertragsschluss
    description: |
      Zustandekommen und Ausfertigung von Verträgen und ihren
      Begleitvereinbarungen.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Management von Vertragspflichten
    description: |
      Management von Vertragspflichten, Mitteilungen und Lieferergebnissen über
      die Lieferung.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Zahlungszertifizierung
    description: |
      Zertifizierung fälliger Zahlungen gemäß den Bedingungen des Vertrags.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Vertrags-Governance
    description: |
      Governance von Vertragsleistung, -konformität und -abschluss.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: Kaufmännisches und Mengenermittlung
    description: |
      Kaufmännisches und Mengenermittlungs-Management von Aufmaß, Bewertung und
      Kosten über den Vertrag.
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: Mengenermittlung und Aufmaß
    description: |
      Aufmaß und Quantifizierung von Bauwerken zur Stützung von Bewertung und
      Zahlung.
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: Management der Zwischenbewertung
    description: |
      Management von Zwischenbewertungen und Zahlungsanträgen während der
      Lieferung.
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: Kaufmännisches Kostenmanagement
    description: |
      Kaufmännisches Management von Vertragskosten, Marge und Cash-Position.
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: Schlussrechnungsvereinbarung
    description: |
      Vereinbarung und Abrechnung von Schlussrechnungen bei Vertragsabschluss.
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: Nachtrags- und Anspruchsmanagement
    description: |
      Management von Nachträgen, Entschädigungsereignissen, Ansprüchen und
      Streitigkeiten aus Infrastrukturverträgen.
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: Nachtragsmanagement
    description: |
      Management von Umfangsänderungen und ihren kaufmännischen Folgen.
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: Management von Entschädigungsereignissen
    description: |
      Bewertung und Management von Entschädigungsereignissen unter dem Vertrag.
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Anspruchsmanagement
    description: |
      Erstellung, Abwehr und Beilegung vertraglicher Ansprüche.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Streitbeilegung
    description: |
      Beilegung von Streitigkeiten durch Verhandlung, Adjudikation und formelle
      Verfahren.
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: Nachunternehmer- und Lieferkettenmanagement
    description: |
      Beschaffung, Onboarding und Management von Nachunternehmern und der
      Lieferkette der Lieferung.
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Nachunternehmerbeschaffung
    description: |
      Beschaffung und Beauftragung von Nachunternehmern für Lieferpakete.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: Gewerkepaketmanagement
    description: |
      Management von Gewerkepaketen und ihren Schnittstellen während der
      Lieferung.
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: Lieferketten-Onboarding
    description: |
      Onboarding und Konformitätsprüfung von Lieferkettenpartnern.
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: Nachunternehmer-Leistungsmanagement
    description: |
      Überwachung und Management der Nachunternehmerleistung anhand des
      Vertrags.
    source_hash: sha256-154e39a8ff2b1f3c
metadata:
  translator: claude-ai
  date: "2026-07-16"
