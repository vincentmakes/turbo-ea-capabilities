locale: de
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Infrastruktur-Planungs- und Entwicklungsmanagement
    description: |
      Langfristige Netz- und Systemplanung, Machbarkeits- und
      Optionsentwicklung, Grundstücks- und Trassenerwerb, Genehmigungen und
      Umweltprüfung sowie Stakeholder-Engagement zur Entwicklung von
      Infrastrukturvorhaben bis zum Punkt der Lieferung.
    in_scope:
      - Langfristige Netz-, Kapazitäts- und Raumplanung
      - Machbarkeitsstudien sowie Options- und Konzeptentwicklung
      - Grundstücks-, Trassen- und Korridorerwerb sowie Dienstbarkeiten
      - Baugenehmigungen und Umweltverträglichkeitsprüfung
      - Stakeholder-, Gemeinschafts- und Grundeigentümer-Engagement
      - Nachhaltigkeits-, Kohlenstoff- und Klimaanpassungsplanung
    out_of_scope:
      - Immobilienentwicklung (BC-4900)
      - Bauausführung (BC-5040)
      - Betriebsgenehmigungen und behördliche Zulassungen (BC-5110)
      - Detaillierte Ingenieurplanung und BIM-Produktion
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: Netz- und Systemplanung
    description: |
      Langfristige Planung von Infrastrukturnetzen und -systemen zur Deckung
      prognostizierter Nachfrage- und Kapazitätsbedarfe.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Nachfrageprognose
    description: |
      Prognose langfristiger Nachfrage und Auslastung zur Dimensionierung
      künftiger Infrastrukturbedarfe.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Netzkapazitätsplanung
    description: |
      Planung von Netz- und Systemkapazität zur Schließung von Lücken zwischen
      Nachfrage und verfügbarem Angebot.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: Raum- und Korridorplanung
    description: |
      Raum- und Korridorplanung zur Sicherung von Grundstücken und zur
      Ausrichtung von Vorhaben an der Raumordnungspolitik.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Masterplanung
    description: |
      Entwicklung integrierter Masterpläne, die Vorhaben über ein Netz oder eine
      Region koordinieren.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: Machbarkeits- und Optionsentwicklung
    description: |
      Bewertung der Machbarkeit sowie Entwicklung von Optionen und Konzepten für
      mögliche Infrastrukturvorhaben.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Machbarkeitsstudien
    description: |
      Studien zur Feststellung der technischen, wirtschaftlichen und
      lieferbezogenen Machbarkeit möglicher Vorhaben.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Optionsentwicklung
    description: |
      Entwicklung und Vergleich von Vorhabenoptionen anhand von Zielen und
      Randbedingungen.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Konzeptauswahl
    description: |
      Auswahl des bevorzugten Konzepts zur Weiterführung in Planung und
      Lieferung.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Baubarkeitsbewertung
    description: |
      Bewertung der Baubarkeit und des Lieferrisikos zur Gestaltung tragfähiger
      Vorhabenkonzepte.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: Grundstücks- und Trassenmanagement
    description: |
      Auswahl und Erwerb von Grundstücken, Trassen und Zugangsrechten, die zur
      Lieferung von Infrastrukturvorhaben erforderlich sind.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: Trassen- und Korridorauswahl
    description: |
      Auswahl von Trassen und Korridoren, die Kosten, Auswirkungen und
      Lieferfähigkeit ausbalancieren.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: Grundstückserwerb und -zusammenlegung
    description: |
      Erwerb und Zusammenlegung der Grundstücksparzellen, die zur Lieferung
      eines Vorhabens benötigt werden.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: Wegerechte und Dienstbarkeiten
    description: |
      Sicherung von Wegerechten, Dienstbarkeiten und Zugangsrechten über
      Grundstücke Dritter.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Management der Enteignung
    description: |
      Management von Enteignungen und zugehöriger Entschädigung zur Sicherung
      der benötigten Grundstücke.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: Genehmigungen und Umweltprüfung
    description: |
      Sicherung von Baugenehmigungen und Durchführung von Umwelt- und
      Denkmalprüfungen für Infrastrukturvorhaben.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Baugenehmigungsmanagement
    description: |
      Management von Bauanträgen und Genehmigungen bis zur Entscheidung.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Umweltverträglichkeitsprüfung
    description: |
      Prüfung von Umweltauswirkungen und Minderungsmaßnahmen zur Stützung von
      Genehmigungsentscheidungen.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: Ökologie- und Denkmalprüfung
    description: |
      Prüfung ökologischer und denkmalpflegerischer Randbedingungen, die
      Vorhabenplanung und Genehmigung betreffen.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Planfeststellungsbeschlüsse
    description: |
      Erstellung und Management von Planfeststellungsbeschlüssen für große
      Infrastrukturvorhaben.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: Stakeholder- und Gemeinschafts-Engagement
    description: |
      Engagement mit Gemeinschaften, Stakeholdern und Grundeigentümern zum
      Aufbau von Unterstützung und zur Bewältigung von Einwendungen gegen
      Vorhaben.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Gemeinschaftskonsultation
    description: |
      Konsultation betroffener Gemeinschaften zur Information und Gestaltung von
      Vorhabenvorschlägen.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: Stakeholder-Mapping und -Engagement
    description: |
      Mapping und Engagement von Stakeholdern über den gesamten
      Vorhabenlebenszyklus.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Management von Anhörungsverfahren
    description: |
      Management öffentlicher Anhörungen und Prüfungen von Vorhabenvorschlägen.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: Grundeigentümer- und Nachbarschaftskontakt
    description: |
      Kontakt mit Grundeigentümern und Nachbarn zur Klärung von Bedenken und zur
      Sicherung der Kooperation.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: Nachhaltigkeits- und Klimaplanung
    description: |
      Verankerung von Nachhaltigkeit, Kohlenstoff und Klimaresilienz in der
      Planung und Gestaltung von Infrastrukturvorhaben.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Planung des Lebensdauer-Kohlenstoffs
    description: |
      Planung zur Reduzierung des Kohlenstoffs über die gesamte Lebensdauer in
      Vorhabengestaltung und -lieferung.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: Biodiversitäts- und Netto-Gewinn-Planung
    description: |
      Planung zum Schutz der Biodiversität und zur Erzielung eines messbaren
      Netto-Gewinns.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Klimaanpassungsplanung
    description: |
      Planung für Klimaresilienz und Anpassung von Infrastrukturanlagen.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Nachhaltige Planungsstandards
    description: |
      Übernahme nachhaltiger Planungsstandards und Bewertungsrahmen für
      Vorhaben.
    source_hash: sha256-5942740434ce459c
metadata:
