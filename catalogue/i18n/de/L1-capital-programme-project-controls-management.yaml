locale: de
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Investitionsprogramm- und Projektsteuerungsmanagement
    description: |
      Eigentümer- und lieferseitige Governance und Steuerung für
      Infrastruktur-Investitionsprogramme und -projekte, umfassend
      Programmaufbau, Kosten- und Terminsteuerung, Earned Value, Risiko- und
      Änderungssteuerung sowie Assurance.
    in_scope:
      - Programmaufbau, Governance und Stufentor-Management
      - Kostenschätzung, Budgetierung, Steuerung und Prognose
      - Planung, Terminierung und Analyse des kritischen Pfads
      - Earned Value und integriertes Leistungsmanagement
      - Programmrisiko-, Änderungs- und Reservesteuerung
      - Projekt-Assurance, Gateway-Reviews und Berichtswesen
    out_of_scope:
      - Unternehmens-Projekt- und Änderungsmanagement (BC-900/BC-910)
      - Ingenieur-Projektmanagement (BC-1110)
      - Investitionsbewertung und Finanzierungsentscheidungen (BC-5000)
      - Baustellenausführung und Bauwerksleistung
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: Programmaufbau und Governance
    description: |
      Einrichtung von Programmstruktur, Liefermodell und Governance zur
      Steuerung der Investitionsausgaben durch definierte Stufentore.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: Programmdefinition und -aufbau
    description: |
      Definition und Aufbau von Programmumfang, -struktur und
      Steuerungsbasislinie.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Auswahl des Liefermodells
    description: |
      Auswahl des Liefer- und Organisationsmodells, das am besten zum Programm
      passt.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: Governance- und Assurance-Rahmen
    description: |
      Einrichtung des Governance- und Assurance-Rahmens, der das Programm
      überwacht.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Stufentor-Management
    description: |
      Management von Stufentoren, die den Fortschritt und die Freigabe von
      Finanzierung autorisieren.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: Kostenschätzung und -management
    description: |
      Schätzung, Baselining und Steuerung von Programm- und Projektkosten über
      den gesamten Lieferlebenszyklus.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Kostenschätzung
    description: |
      Erstellung von Kostenschätzungen über die Schätzklassen des
      Lebenszyklus.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Management der Budget-Basislinie
    description: |
      Einrichtung und Pflege der Kostenbasislinie, an der die Leistung gemessen
      wird.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: Kostensteuerung und -prognose
    description: |
      Steuerung und Prognose der Kosten bis zur Fertigstellung anhand der
      genehmigten Basislinie.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Kostenberichtswesen
    description: |
      Berichterstattung über Kostenstatus und -prognosen an Programm- und
      Projekt-Stakeholder.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: Planung und Terminierung
    description: |
      Entwicklung und Steuerung von Programm- und Projektterminplänen zur
      Steuerung von Zeit und Liefersicherheit.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Terminplanentwicklung
    description: |
      Entwicklung integrierter Terminpläne, die Programm- und Projektaktivitäten
      abdecken.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Analyse des kritischen Pfads
    description: |
      Analyse kritischer Pfade und Puffer zum Schutz wichtiger
      Liefermeilensteine.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Fortschrittsmessung
    description: |
      Messung des physischen und zeitlichen Fortschritts anhand der
      Terminplan-Basislinie.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Terminrisikoanalyse
    description: |
      Probabilistische Analyse des Terminrisikos zur Prüfung der
      Liefersicherheit.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: Earned Value und Leistungsmanagement
    description: |
      Integrierte Messung und Berichterstattung von Kosten- und
      Terminleistung zur Prognose von Programmergebnissen.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Earned-Value-Management
    description: |
      Integration von Umfang, Kosten und Termin zur Messung von Earned Value und
      Leistung.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: Leistungskennzahlen und KPIs
    description: |
      Definition und Nachverfolgung von Leistungskennzahlen und KPIs über das
      Programm.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: Trend- und Abweichungsanalyse
    description: |
      Analyse von Trends und Abweichungen zur Antizipation von Planabweichungen.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Integriertes Leistungsberichtswesen
    description: |
      Konsolidierte Berichterstattung des integrierten Kosten-, Termin- und
      Leistungsstatus.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: Programmrisiko- und Änderungssteuerung
    description: |
      Management von Programmrisiko, Änderung, Reserve und Schnittstellen zum
      Schutz der Lieferergebnisse.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Programmrisikomanagement
    description: |
      Identifizierung, Bewertung und Behandlung von Risiken über das Programm.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Änderungssteuerung
    description: |
      Steuerung von Umfangs- und Basislinienänderungen durch einen
      disziplinierten Änderungsprozess.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: Reserve- und Rückstellungsmanagement
    description: |
      Management von Reserven und Rückstellungen anhand des quantifizierten
      Risikoexposures.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: Schnittstellen- und Abhängigkeitsmanagement
    description: |
      Management von Schnittstellen und Abhängigkeiten zwischen Projekten und
      Stakeholdern.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: Projekt-Assurance und Berichtswesen
    description: |
      Unabhängige Assurance, Lernen und Berichterstattung zur Bestätigung der
      Programmgesundheit und Nutzenlieferung.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: Projekt-Assurance und Gateway-Reviews
    description: |
      Unabhängige Assurance und Gateway-Reviews der Programm- und
      Projektreife.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Management der Lessons Learned
    description: |
      Erfassung und Anwendung von Lessons Learned über den gesamten
      Programmlebenszyklus.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Programmberichtswesen
    description: |
      Berichterstattung des Programmstatus an Vorstände, Sponsoren und
      Aufsichtsorgane.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Nachverfolgung der Nutzenrealisierung
    description: |
      Nachverfolgung der Nutzenrealisierung anhand des Programm-Business-Case.
    source_hash: sha256-de6ea1cd05c875b0
