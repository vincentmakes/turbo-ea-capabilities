# Gestione dell'ingegneria digitale e delle informazioni sugli asset (it) — translations for L1-digital-engineering-asset-information-management.yaml
locale: it
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Gestione dell'ingegneria digitale e delle informazioni sugli asset
    description: |
      Ingegneria digitale e informazioni strutturate sugli asset lungo il ciclo di vita dell'asset costruito, che spazia dal building information modelling, al common data environment, all'integrazione 4D e 5D, alla gestione geospaziale e dei rilievi, e alla gestione del digital twin e delle informazioni sugli asset. Trasforma modelli e dati in un asset informativo affidabile dalla progettazione alla costruzione e all'esercizio.
    in_scope:
      - Strategia e standard BIM e coordinamento dei modelli e clash detection
      - Common data environment e gestione dei requisiti informativi
      - Sequenziamento costruttivo 4D e integrazione dei costi 5D
      - Gestione dei dati geospaziali, di rilievo e di reality capture
      - Sviluppo del digital twin e integrazione dei dati operativi
      - Handover strutturato delle informazioni lungo il ciclo di vita dell'asset
    out_of_scope:
      - Gestione documentale ingegneristica (BC-1130)
      - Gestione del ciclo di vita del prodotto (BC-820)
      - Gestione delle informazioni e dei dati aziendali (BC-610)
      - Consegna di piattaforme IT e applicazioni (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: Gestione BIM
    description: |
      Strategia, standard e coordinamento del building information modelling tra progetti e discipline.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: Strategia e standard BIM
    description: |
      Definizione della strategia, degli standard e dei protocolli informativi BIM.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: Pianificazione dell'esecuzione BIM
    description: |
      Pianificazione dell'esecuzione BIM, dei ruoli e dei deliverable per un progetto.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Coordinamento della modellazione
    description: |
      Coordinamento della modellazione delle discipline secondo standard e tempistiche concordati.
