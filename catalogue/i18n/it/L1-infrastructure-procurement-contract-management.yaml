# Gestione degli approvvigionamenti e dei contratti infrastrutturali (it) — translations for L1-infrastructure-procurement-contract-management.yaml
locale: it
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Gestione degli approvvigionamenti e dei contratti infrastrutturali
    description: |
      Strategia di approvvigionamento, gare e amministrazione contrattuale per la consegna infrastrutturale, inclusa la gestione commerciale e di computo metrico, varianti e claim, e gestione di subappaltatori e supply chain.
    in_scope:
      - Strategia di approvvigionamento, pacchettizzazione e selezione della modalità
      - Gare, gestione delle offerte e prequalifica
      - Formazione, amministrazione contrattuale e certificazione dei pagamenti
      - Gestione commerciale, di computo metrico e valutazione
      - Gestione di varianti, compensation event e claim
      - Approvvigionamento e performance di subappaltatori e supply chain
    out_of_scope:
      - Approvvigionamento aziendale (BC-500)
      - Gare e stime ingegneristiche (BC-1140)
      - Gestione delle relazioni con i fornitori (BC-510)
      - Esecuzione dei lavori costruttivi e consegna in cantiere
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: Strategia di approvvigionamento e pacchettizzazione
    description: |
      Definizione della strategia di approvvigionamento, della pacchettizzazione dei lavori e delle modalità contrattuali per la consegna infrastrutturale.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Definizione della strategia di approvvigionamento
    description: |
      Definizione della strategia di approvvigionamento allineata agli obiettivi di programma e alla capacità del mercato.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Definizione dei pacchetti di lavoro
    description: |
      Strutturazione dei lavori in pacchetti adatti alle esigenze di mercato e di consegna.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Selezione della modalità contrattuale
    description: |
      Selezione delle modalità e delle forme contrattuali appropriate a ciascun pacchetto.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Engagement del mercato dei fornitori
    description: |
      Engagement anticipato con il mercato dei fornitori per definire e testare gli approcci di approvvigionamento.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: Gare e gestione delle offerte
    description: |
      Predisposizione, valutazione e aggiudicazione delle gare per lavori e servizi infrastrutturali.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Predisposizione della gara
    description: |
      Predisposizione dei documenti di gara e dei requisiti da pubblicare sul mercato.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: Sviluppo e presentazione dell'offerta
    description: |
      Sviluppo e presentazione di offerte conformi e competitive quando si agisce come offerente.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: Valutazione e aggiudicazione delle gare
    description: |
      Valutazione delle offerte e aggiudicazione dei contratti rispetto a criteri definiti.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Gestione della prequalifica
    description: |
      Gestione della prequalifica dei fornitori e degli elenchi di selezione.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Amministrazione contrattuale
    description: |
      Amministrazione dei contratti infrastrutturali attraverso formazione, obbligazioni, pagamento e governance.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Formazione del contratto
    description: |
      Formazione e sottoscrizione dei contratti e dei relativi accordi accessori.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Gestione delle obbligazioni contrattuali
    description: |
      Gestione delle obbligazioni contrattuali, delle notifiche e dei deliverable durante la consegna.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Certificazione dei pagamenti
    description: |
      Certificazione dei pagamenti dovuti secondo i termini del contratto.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Governance del contratto
    description: |
      Governance della performance, della conformità e della chiusura del contratto.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: Gestione commerciale e computo metrico
    description: |
      Gestione commerciale e di computo metrico della misurazione, valutazione e costo lungo il contratto.
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: Computo metrico e misurazione
    description: |
      Misurazione e quantificazione dei lavori a supporto di valutazione e pagamento.
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: Gestione delle valutazioni intermedie
    description: |
      Gestione delle valutazioni intermedie e delle richieste di pagamento durante la consegna.
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: Gestione commerciale dei costi
    description: |
      Gestione commerciale del costo, del margine e della posizione di cassa del contratto.
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: Chiusura del conto finale
    description: |
      Concordamento e chiusura dei conti finali al completamento del contratto.
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: Gestione di varianti e claim
    description: |
      Gestione di varianti, compensation event, claim e controversie che sorgono nei contratti infrastrutturali.
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: Gestione delle varianti
    description: |
      Gestione delle varianti allo scope e delle relative conseguenze commerciali.
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: Gestione dei compensation event
    description: |
      Valutazione e gestione dei compensation event previsti dal contratto.
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Gestione dei claim
    description: |
      Predisposizione, difesa e transazione dei claim contrattuali.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Risoluzione delle controversie
    description: |
      Risoluzione delle controversie attraverso negoziazione, adjudication e processi formali.
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: Gestione di subappaltatori e supply chain
    description: |
      Approvvigionamento, onboarding e gestione dei subappaltatori e della supply chain di consegna.
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Approvvigionamento dei subappaltatori
    description: |
      Approvvigionamento e nomina dei subappaltatori per i pacchetti di consegna.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: Gestione dei pacchetti di trade
    description: |
      Gestione dei pacchetti di trade e delle loro interfacce durante la consegna.
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: Onboarding della supply chain
    description: |
      Onboarding e verifica di conformità dei partner della supply chain.
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: Gestione della performance dei subappaltatori
    description: |
      Monitoraggio e gestione della performance dei subappaltatori rispetto al contratto.
    source_hash: sha256-154e39a8ff2b1f3c
