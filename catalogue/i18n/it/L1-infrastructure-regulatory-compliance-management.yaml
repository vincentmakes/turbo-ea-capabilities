# Gestione della regolamentazione e della conformità infrastrutturale (it) — translations for L1-infrastructure-regulatory-compliance-management.yaml
locale: it
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Gestione della regolamentazione e della conformità infrastrutturale
    description: |
      Gestione della regolamentazione economica e di sicurezza per le infrastrutture, che spazia dai rapporti con i regolatori e le submission di controllo dei prezzi, alla gestione di licenze e obbligazioni, ai safety case e all'assurance, al reporting regolatorio, e ai permessi e alle approvazioni statutarie.
    in_scope:
      - Engagement dei regolatori e submission di controllo dei prezzi
      - Gestione delle licenze di esercizio e delle obbligazioni statutarie
      - Sviluppo dei safety case e assurance della sicurezza
      - Performance regolatoria e reporting statutario
      - Gestione di permessi operativi, ambientali e statutari
      - Supporto ad audit e disclosure regolatori
    out_of_scope:
      - Gestione della conformità cross-industry (BC-130)
      - Gestione del rischio d'impresa (BC-140)
      - Gestione commerciale delle concessioni (BC-5100)
      - Gestione legale e del contenzioso aziendale
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Gestione dei rapporti regolatori
    description: |
      Engagement con i regolatori economici e gestione delle submission e delle determinazioni di controllo dei prezzi.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Engagement dei regolatori
    description: |
      Engagement continuo e gestione dei rapporti con i regolatori economici e di settore.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: Controllo e determinazione dei prezzi
    description: |
      Gestione dei processi regolatori di controllo dei prezzi e delle determinazioni periodiche.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Gestione delle submission regolatorie
    description: |
      Predisposizione e gestione delle submission formali ai regolatori.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Monitoraggio del cambiamento regolatorio
    description: |
      Monitoraggio e interpretazione del cambiamento regolatorio che incide sul business.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: Gestione di licenze e obbligazioni
    description: |
      Gestione delle licenze di esercizio e delle obbligazioni e condizioni statutarie ad esse associate.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Gestione della licenza di esercizio
    description: |
      Gestione delle licenze di esercizio detenute dall'operatore infrastrutturale.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Tracking delle obbligazioni statutarie
    description: |
      Tracking delle obbligazioni statutarie e del loro adempimento nel business.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Conformità alle condizioni di licenza
    description: |
      Assurance della conformità alle condizioni associate alle licenze di esercizio.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: Gestione di doveri e impegni
    description: |
      Gestione dei doveri statutari e degli impegni assunti verso regolatori e autorità.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: Safety case e assurance
    description: |
      Sviluppo dei safety case e dell'assurance e certificazione che dimostrano l'esercizio sicuro.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Sviluppo del safety case
    description: |
      Sviluppo e manutenzione dei safety case per gli asset e le operazioni infrastrutturali.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: Certificazione e autorizzazione di sicurezza
    description: |
