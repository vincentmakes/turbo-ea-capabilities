    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: Rinnovo e variazione dei permessi
    description: |
      Rinnovo e variazione di permessi e approvazioni al mutare delle operazioni.
    source_hash: sha256-07c3c25fd50f1ebe
