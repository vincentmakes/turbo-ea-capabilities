# Gestione degli investimenti e del portfolio infrastrutturale (it) — translations for L1-infrastructure-investment-portfolio-management.yaml
locale: it
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Gestione degli investimenti e del portfolio infrastrutturale
    description: |
      Strategia di investimento, origination, valutazione e allocazione del capitale su un portfolio di asset infrastrutturali e progetti di investimento. Disciplina lato proprietario/investitore che decide quali infrastrutture finanziare e come, e monitora i rendimenti a livello di portfolio e il valore pubblico lungo il ciclo di vita dell'asset.
    in_scope:
      - Strategia di investimento infrastrutturale e focus settoriale
      - Origination e screening della pipeline di deal e progetti
      - Business case, valutazione delle opzioni e analisi costi-benefici
      - Prioritizzazione e sequenziamento del programma di investimenti sull'intero portfolio
      - Strategia di funding e finanziamento inclusi contributi pubblici e project finance
      - Performance del portfolio, benefici e monitoraggio del value-for-money
    out_of_scope:
      - Tesoreria aziendale e finanziamento d'impresa (BC-210)
      - Formulazione della strategia d'impresa (BC-580)
      - Ricavi operativi, tariffe e proventi da concessione (BC-5100)
      - Controlli di consegna di programma e progetto (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Strategia di investimento infrastrutturale
    description: |
      Definizione della strategia di investimento infrastrutturale di lungo periodo, del focus settoriale e della propensione al rischio che governa dove viene impiegato il capitale.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: Strategia di settore e di mercato
    description: |
      Selezione dei settori e dei mercati infrastrutturali da presidiare in base a domanda, policy e dinamiche competitive.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Definizione della tesi di investimento
    description: |
      Articolazione della tesi di investimento e della logica di creazione di valore per ciascun segmento infrastrutturale target.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Framework di allocazione del capitale
    description: |
      Framework e criteri che governano l'allocazione del capitale tra settori, geografie e classi di asset.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Definizione della propensione al rischio
    description: |
      Definizione della propensione al rischio di investimento e delle soglie di tolleranza per il portfolio infrastrutturale.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: Gestione della pipeline e dell'origination
    description: |
      Origination, screening e monitoraggio delle opportunità di investimento e di progetto infrastrutturale rispetto ai criteri di investimento.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Origination delle opportunità
    description: |
      Reperimento di opportunità di investimento e sviluppo infrastrutturale attraverso mercati, governo e canali proprietari.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: Screening e prioritizzazione degli investimenti
    description: |
      Screening e prioritizzazione iniziale delle opportunità rispetto a filtri strategici e finanziari.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: Intelligence di mercato e di settore
    description: |
      Raccolta e analisi di intelligence su mercato, domanda e policy per orientare l'origination.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Monitoraggio della pipeline
    description: |
      Monitoraggio delle opportunità attraverso stage gate dal lead alla decisione di investimento.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: Gestione del business case e della valutazione
    description: |
      Sviluppo e valutazione dei business case per gli investimenti infrastrutturali, incluse le opzioni e la valutazione del valore.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Valutazione delle opzioni
    description: |
      Valutazione delle opzioni di investimento e consegna rispetto agli obiettivi strategici e ai vincoli.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Analisi costi-benefici
    description: |
      Analisi costi-benefici quantificata e valutazione economica degli investimenti infrastrutturali candidati.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: Valutazione del valore economico e sociale
    description: |
      Valutazione del più ampio valore economico, sociale e pubblico generato dall'investimento.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Gating della decisione di investimento
    description: |
      Gate di governance e approvazioni che autorizzano l'avanzamento e il funding impegnato.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Prioritizzazione del programma di investimenti
    description: |
      Prioritizzazione, bilanciamento e sequenziamento degli investimenti sul programma di investimenti e sul portfolio di asset.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Prioritizzazione del portfolio
    description: |
      Ranking degli investimenti candidati rispetto a valore, rischio e contributo strategico.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Razionamento del capitale
    description: |
      Allocazione del capitale limitato tra domande di investimento concorrenti.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Bilanciamento del portfolio
    description: |
      Bilanciamento del portfolio tra orizzonti di rischio, settore e ciclo di vita.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Sequenziamento degli investimenti
    description: |
      Fasatura e sequenziamento degli investimenti per gestire la realizzabilità e i profili di funding.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: Strategia di funding e finanziamento
    description: |
      Strategia per il reperimento e la strutturazione del funding e del finanziamento necessari a realizzare il programma infrastrutturale.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Strategia delle fonti di funding
    description: |
      Selezione delle fonti di funding tra meccanismi pubblici, privati e a carico dell'utente.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: Gestione di contributi e finanziamenti pubblici
    description: |
      Reperimento e amministrazione di contributi e conferimenti di capitale pubblico.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Strutturazione del project finance
    description: |
      Strutturazione di project finance, debito ed equity per gli asset infrastrutturali.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Strutturazione del blended finance
    description: |
      Strutturazione di pacchetti di finanza mista pubblico-privata e concessionale.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Gestione della performance del portfolio
    description: |
      Monitoraggio e reporting di rendimenti, benefici e valore generati dal portfolio di investimenti infrastrutturali.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Monitoraggio della performance del portfolio
    description: |
      Monitoraggio della performance finanziaria e operativa sull'intero portfolio.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Tracking dei benefici
    description: |
      Tracking dei benefici realizzati e degli esiti rispetto ai business case di investimento.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Valutazione del value-for-money
    description: |
      Valutazione del value-for-money e del valore whole-life sull'intero portfolio.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Reporting del portfolio
    description: |
      Reporting sulla performance del portfolio a investitori, board e stakeholder pubblici.
    source_hash: sha256-35c417c36c5cb686
