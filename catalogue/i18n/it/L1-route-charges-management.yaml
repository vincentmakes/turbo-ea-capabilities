    source_hash: sha256-894eb5685c3c175b
  BC-1270.30:
    name: Gestione della riscossione delle tariffe
    description: |
      Fatturazione, riscossione, elaborazione dei pagamenti, solleciti.
    source_hash: sha256-779bc02370a0e2e3
