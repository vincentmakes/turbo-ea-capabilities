    source_hash: sha256-f4ea73083e610ccb
  BC-700.50.40:
    name: Conformità normativa dell'edificio
    description: |
      Ispezioni e certificazioni obbligatorie per la sicurezza degli edifici.
    source_hash: sha256-964c7d71c68921e3
