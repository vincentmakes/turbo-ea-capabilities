# Gestione della resilienza e della sicurezza infrastrutturale (it) — translations for L1-infrastructure-resilience-security-management.yaml
locale: it
source: L1-infrastructure-resilience-security-management.yaml
entries:
  BC-5120:
    name: Gestione della resilienza e della sicurezza infrastrutturale
    description: |
      Protezione e resilienza delle infrastrutture critiche attraverso sicurezza fisica, sicurezza cyber-fisica e delle tecnologie operative (OT), resilienza e continuità, gestione di emergenze e crisi, e resilienza climatica e ambientale.
    in_scope:
      - Sicurezza fisica, controllo degli accessi e sorveglianza
      - Sicurezza cyber-fisica e delle tecnologie operative (OT)
      - Resilienza operativa e continuità operativa
      - Prontezza alle emergenze e gestione delle crisi
      - Adattamento climatico e resilienza agli eventi meteorologici estremi
      - Protezione di sistemi e asset critici
    out_of_scope:
      - Gestione del rischio d'impresa (BC-140)
      - Gestione della continuità operativa (BC-160)
      - Gestione della cybersecurity (BC-620)
      - Salute, sicurezza e ambiente (BC-5050)
    source_hash: sha256-bcfbe910a7b9a461
  BC-5120.10:
    name: Gestione della sicurezza fisica
    description: |
      Protezione dei siti e degli asset infrastrutturali attraverso controllo degli accessi, sorveglianza e personale di sicurezza.
    source_hash: sha256-ab6fd81d819c7d19
  BC-5120.10.10:
    name: Gestione di accessi e intrusioni
    description: |
      Gestione dei diritti di accesso e rilevamento delle intrusioni non autorizzate presso i siti infrastrutturali.
    source_hash: sha256-bf54fd2f6191d076
  BC-5120.10.20:
    name: Controllo di perimetro e accessi
    description: |
      Controllo dei perimetri dei siti e dei punti di accesso fisico agli asset critici.
    source_hash: sha256-aaeb117e531a75c4
  BC-5120.10.30:
    name: Sorveglianza di sicurezza
    description: |
      Sorveglianza e monitoraggio dei siti infrastrutturali per le minacce alla sicurezza.
    source_hash: sha256-c8a6e9e5d44e94ed
  BC-5120.10.40:
    name: Gestione del personale di sicurezza
    description: |
      Gestione del personale di sicurezza e dei servizi di guardiania sui siti.
    source_hash: sha256-92a7a9683019e254
  BC-5120.20:
    name: Sicurezza cyber-fisica
    description: |
      Protezione delle tecnologie operative e dei sistemi di controllo che gestiscono le infrastrutture critiche dalle minacce cyber-fisiche.
    source_hash: sha256-76663dc59f61c43e
  BC-5120.20.10:
    name: Sicurezza OT e dei sistemi di controllo
    description: |
      Sicurezza delle tecnologie operative (OT) e dei sistemi di controllo industriale che sottendono le infrastrutture.
    source_hash: sha256-bab81199c8b2066f
  BC-5120.20.20:
    name: Protezione dei sistemi critici
    description: |
      Protezione dei sistemi e degli asset critici essenziali all'esercizio delle infrastrutture.
    source_hash: sha256-8782fc5bee69d8ed
  BC-5120.20.30:
    name: Gestione delle minacce cyber-fisiche
    description: |
      Gestione delle minacce che spaziano i domini cyber e fisico delle infrastrutture.
    source_hash: sha256-45b5d8d04bf46916
  BC-5120.20.40:
    name: Monitoraggio e risposta di sicurezza
    description: |
      Monitoraggio degli eventi di sicurezza e risposta agli incidenti che interessano i sistemi di controllo.
    source_hash: sha256-2c7999abe3b319bf
  BC-5120.30:
    name: Gestione di resilienza e continuità
    description: |
      Pianificazione e test che mantengono operativi i servizi infrastrutturali critici attraverso la disruption.
    source_hash: sha256-50c82bf8d9652c50
  BC-5120.30.10:
    name: Pianificazione della resilienza operativa
    description: |
      Pianificazione della resilienza operativa dei servizi infrastrutturali critici.
    source_hash: sha256-87d444d87065fb57
  BC-5120.30.20:
    name: Gestione della continuità operativa
    description: |
      Gestione della continuità operativa per le operazioni infrastrutturali durante la disruption.
    source_hash: sha256-e9e5fdd1c4f37b7d
  BC-5120.30.30:
    name: Progettazione di ridondanza e failover
    description: |
      Progettazione di ridondanza e failover per sostenere il servizio attraverso il guasto degli asset.
    source_hash: sha256-de3a61dc3d3e824a
  BC-5120.30.40:
    name: Test ed esercitazioni di resilienza
    description: |
      Test ed esercitazione degli assetti di resilienza e continuità.
    source_hash: sha256-ccbec6e3ab225a02
  BC-5120.40:
    name: Gestione di emergenze e crisi
    description: |
      Preparazione e risposta alle emergenze e alle crisi che interessano le infrastrutture e i loro utenti.
    source_hash: sha256-c9a84def75d1bc66
  BC-5120.40.10:
    name: Prontezza alle emergenze
    description: |
      Pianificazione della prontezza per le emergenze che interessano asset e servizi infrastrutturali.
    source_hash: sha256-2c08b126adcf3a8b
  BC-5120.40.20:
    name: Gestione delle crisi
    description: |
      Gestione delle crisi che minacciano le operazioni infrastrutturali e gli stakeholder.
    source_hash: sha256-dda20de9498639d8
  BC-5120.40.30:
    name: Coordinamento della risposta alle emergenze
    description: |
      Coordinamento della risposta alle emergenze tra team e responder esterni.
    source_hash: sha256-23673881e80ccf22
  BC-5120.40.40:
    name: Pianificazione di recupero e ripristino
    description: |
      Pianificazione del recupero e del ripristino dei servizi dopo eventi disruptive.
    source_hash: sha256-e8210e4f65f83176
  BC-5120.50:
    name: Resilienza climatica e ambientale
    description: |
      Adattamento e protezione delle infrastrutture contro il cambiamento climatico e i pericoli ambientali.
    source_hash: sha256-5c8519c07ef26be6
  BC-5120.50.10:
    name: Gestione dell'adattamento climatico
    description: |
      Gestione dell'adattamento climatico per gli asset infrastrutturali a lunga vita.
    source_hash: sha256-7eded7738db31aa4
  BC-5120.50.20:
    name: Resilienza agli eventi meteorologici estremi
    description: |
      Resilienza delle infrastrutture agli eventi meteorologici estremi e ai loro impatti.
    source_hash: sha256-d38d9fa5f0f02308
  BC-5120.50.30:
    name: Protezione da alluvioni e pericoli
    description: |
      Protezione delle infrastrutture da alluvioni e pericoli naturali.
    source_hash: sha256-e133de2790603d36
  BC-5120.50.40:
    name: Gestione dei pericoli ambientali
    description: |
      Gestione dei pericoli ambientali che interessano le infrastrutture e il loro intorno.
    source_hash: sha256-f9a3bb27d308ea50
