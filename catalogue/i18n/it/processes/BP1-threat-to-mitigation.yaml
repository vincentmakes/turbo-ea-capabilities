kind: business-process
locale: it
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "Minaccia-a-Mitigazione"
    description: "Ciclo operativo di cybersecurity dalla definizione della postura attraverso threat intelligence, scoperta di vulnerabilità, rilevazione, incident response, hardening di identità e accesso e awareness. Un BP2 per ogni stage_name di VS-600."
    source_hash: sha256-62cfa323d63dbb61
  BP-1150.10:
    name: "Definizione della postura di sicurezza"
    description: "Definire postura di sicurezza, baseline di controllo e maturità target per l'azienda."
    source_hash: sha256-285a1bef4d6d76a0
  BP-1150.10.10:
    name: "Definire strategia di sicurezza"
    description: "Definire strategia di cybersecurity — appetito al rischio, maturità target, framework (NIST CSF, ISO 27001)."
    source_hash: sha256-2981098fcc513191
  BP-1150.10.20:
    name: "Stabilire baseline di controllo"
    description: "Stabilire la baseline di controllo per l'azienda; allineare a framework di controllo e regolamentazione applicabile."
    source_hash: sha256-63384bd7bbe11517
  BP-1150.20:
    name: "Threat intelligence"
    description: "Raccogliere, analizzare e diffondere threat intelligence a difensori e decision-maker."
    source_hash: sha256-e4b50b0b5b6967dc
  BP-1150.20.10:
    name: "Raccogliere threat intelligence"
    description: "Raccogliere threat intelligence da sensori interni, feed ISAC, vendor e OSINT."
    source_hash: sha256-25a4ebda6df7a42c
  BP-1150.20.20:
    name: "Analizzare e diffondere intelligence"
    description: "Analizzare intelligence per rilevanza e operazionalizzarla — IOC, ipotesi di hunt, briefing."
    source_hash: sha256-8dc002ed9ddc3a76
  BP-1150.30:
    name: "Scoperta di vulnerabilità"
    description: "Scoprire vulnerabilità — scan, pen test, bug bounty, code review — e guidare la remediation."
    source_hash: sha256-1cd2e38ea225310b
  BP-1150.30.10:
    name: "Eseguire scan di vulnerabilità"
    description: "Eseguire scan continui di vulnerabilità attraverso infrastruttura, applicazioni e workload cloud."
    source_hash: sha256-3d007f831d2f79fc
  BP-1150.30.20:
    name: "Eseguire penetration test"
    description: "Eseguire penetration test periodici ed event-driven; catturare rilievi sfruttabili e remediation."
    source_hash: sha256-2201a76850035e2c
  BP-1150.30.30:
    name: "Guidare remediation di vulnerabilità"
    description: "Prioritizzare vulnerabilità per sfruttabilità e criticità dell'asset; tracciare remediation rispetto agli SLA."
    source_hash: sha256-005fa7631055e776
  BP-1150.40:
    name: "Rilevazione"
    description: "Rilevare eventi di sicurezza tramite monitoring, analytics, threat hunting e baseline comportamentali."
    source_hash: sha256-5b45b06eb911ec76
  BP-1150.40.10:
    name: "Operare monitoring di sicurezza"
    description: "Operare il SOC — SIEM, EDR, XDR, network detection — per monitorare eventi di sicurezza 24/7."
    source_hash: sha256-585fc4acb622dda1
  BP-1150.40.20:
    name: "Triagiare e investigare alert"
    description: "Triagiare e investigare alert; escalare incident confermati; chiudere falsi positivi."
    source_hash: sha256-7d2b0bd5673e3f73
  BP-1150.40.30:
    name: "Cacciare minacce"
    description: "Eseguire threat hunt proattivi su ipotesi derivate da intelligence e TTP emergenti."
    source_hash: sha256-2ffda774c0958b04
  BP-1150.50:
    name: "Incident response"
    description: "Rispondere a incident di sicurezza confermati — contenere, eradicare, ripristinare e imparare."
    source_hash: sha256-d8dfacbd546cd220
  BP-1150.50.10:
    name: "Contenere incident"
    description: "Contenere l'incident — isolare sistemi interessati, revocare credenziali, bloccare traffico — per fermare la propagazione."
    source_hash: sha256-e08d702bed938c2b
  BP-1150.50.20:
    name: "Eradicare minaccia"
    description: "Eradicare la minaccia — rimuovere malware, patchare vulnerabilità, chiudere meccanismo di persistenza."
    source_hash: sha256-cd617fc1c8cb81cf
  BP-1150.50.30:
    name: "Ripristinare operazioni"
    description: "Ripristinare sistemi e operazioni interessati allo stato known-good; validare prima del rientro in servizio."
    source_hash: sha256-811a7311f022d96f
  BP-1150.50.40:
    name: "Notificare e reportare"
    description: "Notificare regolatori, clienti e parti interessate secondo obblighi di breach notification e protocollo."
    source_hash: sha256-26950b7503501bb9
  BP-1150.60:
    name: "Hardening di identità e accesso"
    description: "Fare hardening di identità e accesso — IAM, MFA, privileged access — per prevenire percorsi di attacco basati su identità."
    source_hash: sha256-72dbc7762816a757
  BP-1150.60.10:
    name: "Gestire ciclo di vita dell'identità"
    description: "Gestire ciclo di vita dell'identità — provisioning, cambio di ruolo, deprovisioning — per dipendenti, contractor e macchine."
    source_hash: sha256-227f2ed8620f69a0
  BP-1150.60.20:
    name: "Imporre controlli di autenticazione"
    description: "Imporre MFA, conditional access e autenticazione basata sul rischio su tutti i percorsi di accesso."
    source_hash: sha256-06480b7b3357d537
  BP-1150.60.30:
    name: "Governare accesso privilegiato"
    description: "Governare accesso privilegiato — vault, elevazione just-in-time, monitoraggio di sessione, ri-attestazione periodica."
    source_hash: sha256-f89226ca9d7688a4
  BP-1150.70:
    name: "Awareness e lessons learned"
    description: "Eseguire awareness di sicurezza nella workforce; catturare lessons da incident ed esercizi."
    source_hash: sha256-520072a406ecbde5
  BP-1150.70.10:
    name: "Eseguire awareness di sicurezza"
    description: "Eseguire formazione di awareness di sicurezza, simulazioni di phishing e formazione mirata per ruolo."
    source_hash: sha256-9a21fcb8f5340c81
  BP-1150.70.20:
    name: "Catturare e applicare lessons"
    description: "Catturare lessons da incident, esercizi e report di breach; applicare a controlli, formazione, runbook."
    source_hash: sha256-ecb7a0e28fb3b9af
