kind: business-process
locale: it
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Scoperta-a-Automazione"
    description: "Ciclo di miglioramento di processo e automazione dalla scoperta del processo attraverso misurazione, mining, redesign e automazione. Un BP2 per ogni stage_name di VS-150."
  BP-1160.10:
    name: "Scoperta del processo"
    description: "Scoprire e documentare il processo as-is — attori, passi, dati, sistemi."
  BP-1160.10.10:
    name: "Mappare processo as-is"
    description: "Mappare il processo as-is via interviste, walk-through e osservazione; persistere in un modello di processo."
  BP-1160.10.20:
    name: "Catturare varianti del processo"
    description: "Catturare varianti — per regione, canale, tipo cliente — per far emergere dove conta la standardizzazione."
  BP-1160.20:
    name: "Misurazione del processo"
    description: "Misurare la performance del processo — tempo di ciclo, costo, qualità, customer experience."
  BP-1160.20.10:
    name: "Definire KPI del processo"
    description: "Definire KPI per il processo — efficienza, qualità, outcome del cliente — e baselineare la performance attuale."
  BP-1160.20.20:
    name: "Baselineare performance"
    description: "Baselineare la performance attuale tramite sampling e analytics; identificare outlier e pattern."
  BP-1160.30:
    name: "Process mining"
    description: "Minare gli event-log dei sistemi per derivare il flusso reale del processo e far emergere inefficienze."
  BP-1160.30.10:
    name: "Estrarre event log"
    description: "Estrarre dati di event-log dai sistemi sorgente per il processo in scope; pulire e preparare."
  BP-1160.30.20:
    name: "Eseguire analisi di process mining"
    description: "Applicare strumenti di process mining per derivare flusso reale, conformance, colli di bottiglia, loop di rilavorazione e varianti."
  BP-1160.30.30:
    name: "Far emergere ipotesi di miglioramento"
    description: "Tradurre i rilievi di mining in ipotesi di miglioramento prioritizzate per impatto e fattibilità."
  BP-1160.40:
    name: "Redesign del processo"
    description: "Riprogettare il processo — eliminare, semplificare, integrare, automatizzare — per consegnare miglioramento step-change."
  BP-1160.40.10:
    name: "Progettare processo to-be"
    description: "Progettare il processo to-be applicando principi lean, allineamento al customer journey e automazione."
  BP-1160.40.20:
    name: "Validare redesign"
    description: "Validare il redesign con operatori, clienti e rischio; raffinare prima del build."
  BP-1160.50:
    name: "Automazione del processo"
    description: "Costruire, deployare e operare l'automazione del processo — RPA, orchestrazione, assistenza AI — su scala."
  BP-1160.50.10:
    name: "Costruire automazione"
    description: "Costruire l'automazione — bot RPA, flussi orchestrati, componenti di AI agentica — secondo il processo riprogettato."
  BP-1160.50.20:
    name: "Deployare e operare automazione"
    description: "Deployare l'automazione in produzione; operare, monitorare e mantenere attraverso cicli di change."
  BP-1160.50.30:
    name: "Tracciare benefici dell'automazione"
    description: "Tracciare i benefici realizzati dell'automazione rispetto al business case; iterare e scalare."
