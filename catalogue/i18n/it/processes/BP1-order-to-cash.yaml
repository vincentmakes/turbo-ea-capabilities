kind: business-process
locale: it
source: BP1-order-to-cash.yaml
entries:
  BP-1000:
    name: "Ordine-a-Incasso"
    description: "Ciclo di ricavi end-to-end dalla cattura del lead attraverso preventivo, contratto e cattura dell'ordine (con verifica del credito), promessa e allocazione dell'ordine, produzione o erogazione del servizio, logistica in uscita, fatturazione al cliente, incasso e applicazione dei pagamenti, fino al riconoscimento dei ricavi. Un BP2 per ogni stage di VS-390; BP3 scompone il lavoro in attività operative in forma verbale."
  BP-1000.10:
    name: "Cattura e qualificazione dei lead"
    description: "Catturare l'interesse del prospect, arricchirlo con dati firmografici e comportamentali, valutarlo rispetto ai criteri di profilo cliente ideale e instradare i lead qualificati alle vendite."
  BP-1000.10.10:
    name: "Catturare lead inbound"
    description: "Ricevere l'interesse inbound del prospect da form web, eventi, referenze partner o prospecting outbound e persisterlo come record di lead."
  BP-1000.10.20:
    name: "Arricchire dati del lead"
    description: "Aumentare il lead con dati firmografici, tecnografici e comportamentali da fonti interne e di terze parti per abilitare scoring e routing."
  BP-1000.10.30:
    name: "Valutare e qualificare il lead"
    description: "Applicare un modello di scoring (fit + intent) per qualificare il lead come Marketing-Qualified o Sales-Qualified, oppure squalificarlo e ricicarlo."
  BP-1000.10.40:
    name: "Instradare lead alle vendite"
    description: "Assegnare il lead qualificato al territorio di vendita, ruolo o partner appropriato secondo le regole di routing e SLA."
  BP-1000.20:
    name: "Preventivo e configurazione"
    description: "Configurare la soluzione cliente, prezzarla secondo le regole di sconto approvate ed emettere un preventivo che il cliente possa accettare."
  BP-1000.20.10:
    name: "Configurare soluzione cliente"
    description: "Tradurre i requisiti del cliente in un bundle prodotto/servizio configurato, validando compatibilità e fattibilità rispetto al catalogo offerta."
  BP-1000.20.20:
    name: "Calcolare prezzo del preventivo"
    description: "Applicare prezzo di listino, sconti contrattuali, promozioni, valuta e regole fiscali per produrre il totale del preventivo riga per riga."
  BP-1000.20.30:
    name: "Sottoporre preventivo ad approvazione"
    description: "Instradare il preventivo attraverso il workflow di approvazione di sconto e margine quando le soglie richiedono sign-off, catturando le decisioni dell'approvatore."
  BP-1000.20.40:
    name: "Emettere preventivo al cliente"
    description: "Consegnare il preventivo approvato al cliente con condizioni, validità e istruzioni di accettazione; tracciare lo stato del preventivo fino alla decisione."
  BP-1000.30:
    name: "Contratto e cattura dell'ordine"
    description: "Negoziare ed eseguire il contratto, eseguire la verifica del credito del cliente e catturare l'ordine di vendita fermo."
  BP-1000.30.10:
    name: "Negoziare termini contrattuali"
    description: "Negoziare termini commerciali, livelli di servizio, indennizzi e responsabilità; redlinare il contratto fino a quando entrambe le parti accettano."
  BP-1000.30.20:
    name: "Verificare credito del cliente"
    description: "Eseguire la verifica del credito sul cliente (storico interno + bureau esterno dove applicabile), impostare o confermare il limite di credito e autorizzare l'ordine rispetto al credito disponibile."
  BP-1000.30.30:
    name: "Eseguire contratto"
    description: "Catturare le firme del cliente e del firmatario autorizzato, persistere il contratto eseguito nel repository contratti e attivare la cattura ordine a valle."
  BP-1000.30.40:
    name: "Catturare ordine cliente"
    description: "Convertire il contratto eseguito o il preventivo accettato in un ordine di vendita fermo nel sistema di gestione ordini; validare completezza e fattibilità prima del commit."
  BP-1000.40:
    name: "Promessa e allocazione dell'ordine"
    description: "Promettere la data di consegna, allocare inventario o capacità e schedulare l'ordine per il fulfilment."
  BP-1000.40.10:
    name: "Promettere data di consegna"
    description: "Eseguire verifiche available-to-promise / capable-to-promise rispetto a inventario, fornitura e capacità per impegnare una data di consegna su cui il cliente possa contare."
  BP-1000.40.20:
    name: "Allocare inventario all'ordine"
    description: "Riservare inventario specifico (lotti, seriali, ubicazioni) all'ordine; risolvere conflitti di allocazione quando la fornitura è vincolata."
  BP-1000.40.30:
    name: "Riservare capacità di produzione"
    description: "Per make-to-order o assemble-to-order, riservare la linea di produzione e la fornitura di componenti necessaria per rispettare la data promessa."
  BP-1000.40.40:
    name: "Rilasciare ordine al fulfilment"
    description: "Consegnare l'ordine allocato e schedulato a produzione o fulfilment di magazzino con tutte le istruzioni di routing."
  BP-1000.50:
    name: "Produzione / Erogazione del servizio"
    description: "Eseguire l'ordine di lavoro di produzione o erogare il servizio per soddisfare l'ordine cliente."
  BP-1000.50.10:
    name: "Emettere ordine di lavoro di produzione"
    description: "Generare l'ordine di lavoro rispetto alla capacità riservata, includendo BOM, routing e checkpoint di qualità."
  BP-1000.50.20:
    name: "Eseguire produzione make-to-order"
    description: "Eseguire il lavoro di produzione secondo specifica sulla linea pianificata, registrando consumo di lavoro, macchina e materiale."
  BP-1000.50.30:
    name: "Erogare servizio al cliente"
    description: "Per ordini di servizio, eseguire l'engagement rispetto allo statement of work, catturando tempi, milestone e deliverable."
  BP-1000.50.40:
    name: "Confermare completamento ordine"
    description: "Chiudere l'ordine di lavoro o l'engagement di servizio con sign-off di qualità; attivare fatturazione e riconoscimento ricavi a valle."
  BP-1000.60:
    name: "Logistica in uscita"
    description: "Picking, packing e spedizione dell'ordine; gestire il trasporto in uscita e confermare la consegna al cliente."
  BP-1000.60.10:
    name: "Pickare, imballare e spedire l'ordine"
    description: "Pickare lo stock allocato, imballare in condizione di spedizione con documentazione e consegnare al corriere."
  BP-1000.60.20:
    name: "Gestire trasporto in uscita"
    description: "Pianificare freight, selezionare corriere, generare etichette di spedizione e documentazione doganale e spedire il carico."
  BP-1000.60.30:
    name: "Tracciare spedizione al cliente"
    description: "Monitorare lo stato in transito, gestire eccezioni (ritardo, danno, mis-routing) e mantenere il cliente informato."
  BP-1000.60.40:
    name: "Confermare consegna al cliente"
    description: "Catturare prova di consegna, chiudere la spedizione e attivare fatturazione a valle dove la fatturazione è basata sulla consegna."
  BP-1000.70:
    name: "Fatturazione al cliente"
    description: "Generare la fattura cliente con tasse e sconti, emetterla attraverso il canale preferito del cliente e gestire eventuali dispute."
  BP-1000.70.10:
    name: "Generare fattura cliente"
    description: "Costruire la fattura da dati di ordine, consegna e contratto; validare completezza e aritmetica prima dell'emissione."
  BP-1000.70.20:
    name: "Applicare tasse e sconti"
    description: "Applicare tasse giurisdizionali (IVA/GST/sales tax), ritenute e sconti contrattuali alle righe di fattura."
  BP-1000.70.30:
    name: "Emettere fattura al cliente"
    description: "Consegnare la fattura tramite il canale preferito del cliente (portale e-invoicing, EDI, email, cartaceo) e persistere l'audit trail."
  BP-1000.70.40:
    name: "Gestire dispute di fattura"
    description: "Ricevere, investigare e risolvere dispute del cliente sul contenuto della fattura; emettere note di credito o revisioni dove giustificato."
  BP-1000.80:
    name: "Incasso e applicazione dei pagamenti"
    description: "Incassare i pagamenti del cliente attraverso il ciclo di sollecito, applicare gli incassi alle fatture e perseguire saldi scaduti."
  BP-1000.80.10:
    name: "Inviare solleciti di pagamento"
    description: "Eseguire il ciclo di sollecito — promemoria automatici a intervalli di policy man mano che le fatture si avvicinano e superano la scadenza."
  BP-1000.80.20:
    name: "Ricevere pagamento del cliente"
    description: "Accettare il pagamento tramite lo strumento scelto dal cliente (bonifico, ACH, carta, assegno, e-payment) e persistere l'incasso."
  BP-1000.80.30:
    name: "Applicare pagamento alla fattura"
    description: "Conciliare l'incasso rispetto alla(e) fattura(e) aperta(e), allocare per riga dove parziale e chiudere il credito."
  BP-1000.80.40:
    name: "Gestire collections del cliente"
    description: "Perseguire saldi scaduti attraverso la scala di escalation (esattore, agenzia di recupero crediti, write-off / accantonamento per crediti dubbi)."
  BP-1000.90:
    name: "Riconoscimento dei ricavi"
    description: "Riconoscere i ricavi maturati secondo lo standard contabile applicabile (IFRS 15 / ASC 606), differire i ricavi non maturati e conciliare con il sub-libro mastro."
  BP-1000.90.10:
    name: "Riconoscere ricavi maturati"
    description: "Applicare il modello a cinque step IFRS 15 / ASC 606 per riconoscere ricavi nel momento appropriato o lungo la durata del contratto."
  BP-1000.90.20:
    name: "Differire ricavi non maturati"
    description: "Parcheggiare gli importi fatturati ma non ancora maturati in conti di ricavi differiti, rilasciandoli man mano che l'obbligazione di performance viene soddisfatta."
  BP-1000.90.30:
    name: "Conciliare ricavi con sub-libro mastro"
    description: "Conciliare il libro mastro dei ricavi con AR e i sistemi di ordine/fatturazione; risolvere variazioni prima della chiusura del periodo."
  BP-1000.90.40:
    name: "Reportare performance dei ricavi"
    description: "Produrre reporting dei ricavi (riconosciuti, differiti, backlog) per management, chiusura finanziaria e disclosure esterna."
