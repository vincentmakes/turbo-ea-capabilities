kind: business-process
locale: it
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Rischio-a-Mitigazione"
    description: "Ciclo di enterprise risk management dall'inquadramento dell'appetito al rischio attraverso identificazione, valutazione, trattamento, monitoraggio e reportistica dei rischi. Un BP2 per ogni stage_name di VS-500."
  BP-1110.10:
    name: "Appetito al rischio e framework"
    description: "Stabilire appetito al rischio e tolleranze; definire il framework, tassonomia e governance di enterprise risk management."
  BP-1110.10.10:
    name: "Stabilire appetito al rischio"
    description: "Stabilire dichiarazioni di appetito al rischio enterprise e soglie di tolleranza per categoria di rischio; ratificare con il consiglio."
  BP-1110.10.20:
    name: "Definire framework di rischio"
    description: "Definire il framework ERM — tassonomia, forum di governance, ruoli, ciclo di vita — sotto COSO ERM e ISO 31000."
  BP-1110.20:
    name: "Identificazione dei rischi"
    description: "Identificare rischi enterprise attraverso domini strategici, operativi, finanziari, regolatori ed emergenti."
  BP-1110.20.10:
    name: "Condurre workshop di rischio"
    description: "Condurre workshop strutturati per far emergere rischi nel business con owner e SME."
  BP-1110.20.20:
    name: "Scansionare rischi esterni"
    description: "Scansionare fonti esterne — regolatorie, di mercato, geopolitiche, ambientali — per segnali di rischio emergente."
  BP-1110.20.30:
    name: "Catturare inventario dei rischi"
    description: "Persistere rischi identificati nel registro dei rischi enterprise con owner, categoria e valutazione iniziale."
  BP-1110.30:
    name: "Valutazione dei rischi"
    description: "Valutare rischi identificati per probabilità, impatto e velocità; valutare rischio inerente e residuo."
  BP-1110.30.10:
    name: "Punteggiare probabilità e impatto"
    description: "Punteggiare la probabilità e l'impatto di ciascun rischio usando metodi qualitativi e quantitativi secondo il framework."
  BP-1110.30.20:
    name: "Valutare rischio inerente e residuo"
    description: "Calcolare il rating di rischio inerente e, dopo aver considerato i controlli esistenti, il rating residuo."
  BP-1110.30.30:
    name: "Prioritizzare rischi"
    description: "Prioritizzare rischi per il trattamento sulla base di rating residuo, appetito e rilevanza strategica."
  BP-1110.40:
    name: "Trattamento e progettazione dei controlli"
    description: "Decidere trattamento — accettare, evitare, mitigare, trasferire — e progettare o rafforzare controlli."
  BP-1110.40.10:
    name: "Decidere trattamento del rischio"
    description: "Decidere trattamento per rischio — accettare, evitare, mitigare, trasferire (assicurazione, contrattuale, hedging)."
  BP-1110.40.20:
    name: "Progettare controlli"
    description: "Progettare o rafforzare controlli — preventivi, detettivi, correttivi — per portare il rischio residuo nell'appetito."
  BP-1110.40.30:
    name: "Implementare piano di trattamento"
    description: "Implementare il piano di trattamento; assegnare owner, scadenze ed evidenza di verifica."
  BP-1110.50:
    name: "Monitoraggio"
    description: "Monitorare rischi e controlli — tracking di KRI, test di controlli, monitoraggio di pattern di incidenti."
  BP-1110.50.10:
    name: "Tracciare key risk indicator"
    description: "Tracciare KRI e segnali di rischio emergente; attivare soglie e percorsi di escalation."
  BP-1110.50.20:
    name: "Testare controlli"
    description: "Testare l'efficacia di design e operativa dei controlli; valutare eccezioni; guidare la remediation."
  BP-1110.50.30:
    name: "Monitorare pattern di incidenti"
    description: "Monitorare pattern di incidenti, near-miss ed eventi di perdita; raffinare di conseguenza le viste di rischio e controllo."
  BP-1110.60:
    name: "Reportistica e escalation"
    description: "Reportare il rischio enterprise a forum esecutivi, al consiglio e ai regolatori; escalare violazioni."
  BP-1110.60.10:
    name: "Produrre report di rischio"
    description: "Produrre il report periodico di rischio enterprise — dashboard, heat map, narrative dei top-risk."
  BP-1110.60.20:
    name: "Briefare esecutivi e consiglio"
    description: "Briefare il comitato esecutivo di rischio e il comitato di rischio del consiglio; catturare decisioni e direzione."
  BP-1110.60.30:
    name: "Escalare violazioni"
    description: "Escalare violazioni di appetito e incidenti ad alta velocità secondo protocollo; notificare regolatori dove richiesto."
