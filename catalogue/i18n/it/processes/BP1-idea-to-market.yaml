kind: business-process
locale: it
source: BP1-idea-to-market.yaml
entries:
  BP-1030:
    name: "Idea-a-Mercato"
    description: "Ciclo end-to-end di innovazione di prodotto/servizio dalla cattura di idee attraverso concetto e fattibilità, ricerca e prototipazione, selezione del portafoglio, design e sviluppo, protezione IP, launch readiness, introduzione sul mercato e performance post-launch. Un BP2 per ogni stage_name di VS-290."
  BP-1030.10:
    name: "Cattura di idee"
    description: "Far emergere, catturare e consolidare idee da dipendenti, clienti, partner e segnali di mercato; instradare a triage."
  BP-1030.10.10:
    name: "Sollecitare idee"
    description: "Eseguire campagne di generazione di idee, hackathon e canali continui; incoraggiare la sottomissione attraverso l'organizzazione e l'ecosistema."
  BP-1030.10.20:
    name: "Catturare e triagiare idee"
    description: "Persistere idee in arrivo, deduplicare e triagiare in code di revisione con categorizzazione iniziale."
  BP-1030.10.30:
    name: "Validare fit dell'idea"
    description: "Applicare primo screen di fit rispetto a strategia, capability e segnale di mercato; rifiutare, parcheggiare o avanzare a fattibilità."
  BP-1030.20:
    name: "Concetto e fattibilità"
    description: "Convertire idee promettenti in concetti; valutare fattibilità tecnica, di mercato e commerciale; costruire il caso per selezione del portafoglio."
  BP-1030.20.10:
    name: "Sviluppare concetto"
    description: "Articolare il concetto — problema, utente target, soluzione proposta, ipotesi di valore — a profondità sufficiente per valutazione."
  BP-1030.20.20:
    name: "Valutare fattibilità tecnica"
    description: "Validare che il concetto possa essere costruito con tecnologia, materiali e competenze disponibili o acquisibili."
  BP-1030.20.30:
    name: "Valutare fattibilità commerciale"
    description: "Costruire il business case — mercato indirizzabile, pricing, cost-to-serve, ROI — per dimensionare l'opportunità."
  BP-1030.20.40:
    name: "Decidere avanzamento del concetto"
    description: "Decidere al gate di concetto avanzare, raffinare, parcheggiare o killare, con giustificazione chiara e condizioni."
  BP-1030.30:
    name: "Ricerca e prototipazione"
    description: "Condurre ricerca, costruire prototipi e testare con utenti per deriskare il concetto prima del design completo."
  BP-1030.30.10:
    name: "Condurre ricerca con utenti"
    description: "Eseguire ricerca qualitativa e quantitativa con utenti target per validare problem-solution fit."
  BP-1030.30.20:
    name: "Costruire prototipo"
    description: "Costruire prototipi a bassa o alta fedeltà — mock-up fisici, wireframe, codice funzionante — per rendere tangibile il concetto."
  BP-1030.30.30:
    name: "Testare prototipo con utenti"
    description: "Eseguire test di usabilità e valore con utenti target; catturare rilievi per informare iterazione o decisioni di kill."
  BP-1030.30.40:
    name: "Iterare concetto"
    description: "Applicare apprendimenti dei test di prototipo al concetto; iterare finché il concetto non sia pronto per selezione del portafoglio o kill."
  BP-1030.40:
    name: "Selezione del portafoglio"
    description: "Prioritizzare concetti validati nel portafoglio di innovazione; allocare risorse, sequenziare consegna e bilanciare rischio."
  BP-1030.40.10:
    name: "Punteggiare candidati del portafoglio"
    description: "Punteggiare concetti validati rispetto a criteri di portafoglio — fit strategico, valore, rischio, fit di capability, time to market."
  BP-1030.40.20:
    name: "Sequenziare portafoglio"
    description: "Sequenziare il portafoglio attraverso orizzonti, bilanciando now/next/later e mix core/adiacente/trasformazionale."
  BP-1030.40.30:
    name: "Allocare risorse"
    description: "Allocare finanziamento, talento e infrastruttura ai concetti selezionati; attivare kick-off formale a design e sviluppo."
  BP-1030.50:
    name: "Design e sviluppo"
    description: "Design dettagliato, ingegneria, build e integrazione del prodotto o servizio fino alla launch readiness."
  BP-1030.50.10:
    name: "Definire requisiti dettagliati"
    description: "Tradurre il concetto validato in requisiti funzionali, non funzionali e di accettazione dettagliati."
  BP-1030.50.20:
    name: "Progettare prodotto o servizio"
    description: "Produrre il design dettagliato — architettura, materiali, UX, BOM — che sarà costruito e validato."
  BP-1030.50.30:
    name: "Costruire e integrare"
    description: "Costruire il prodotto o servizio secondo design; integrare componenti e sottosistemi; gestire change e configurazione."
  BP-1030.50.40:
    name: "Validare e verificare"
    description: "Eseguire verifica e validazione di design rispetto ai requisiti; chiudere non conformità prima della launch readiness."
  BP-1030.60:
    name: "Protezione IP"
    description: "Identificare, proteggere e gestire la proprietà intellettuale generata attraverso il ciclo di innovazione."
  BP-1030.60.10:
    name: "Identificare IP brevettabile"
    description: "Rivedere innovazioni per novità, utilità e non-ovvietà; identificare invenzioni candidate per brevettazione."
  BP-1030.60.20:
    name: "Depositare e prosecutare brevetti"
    description: "Depositare domande di brevetto provvisorie e complete; gestire prosecution fino alla concessione attraverso giurisdizioni."
  BP-1030.60.30:
    name: "Gestire trade secret e marchi"
    description: "Identificare materiale di trade-secret e asset di brand; applicare protezione (NDA, controlli di accesso, registrazioni)."
  BP-1030.70:
    name: "Launch readiness"
    description: "Prepararsi per il launch sul mercato — go-to-market, manifattura, supply chain, canali, supporto, formazione."
  BP-1030.70.10:
    name: "Costruire piano go-to-market"
    description: "Sviluppare il piano GTM — posizionamento, pricing, canali, sales enablement, campagne marketing — per la finestra di launch."
  BP-1030.70.20:
    name: "Fare ramp di manifattura o consegna del servizio"
    description: "Allestire capacità di manifattura o readiness di consegna del servizio — attrezzature, formazione, fornitura, certificazioni."
  BP-1030.70.30:
    name: "Formare vendite e supporto"
    description: "Formare team di vendite, partner e supporto sul nuovo prodotto/servizio prima del launch."
  BP-1030.70.40:
    name: "Passare review di launch readiness"
    description: "Eseguire la review cross-funzionale di launch readiness; chiudere gap o rinviare launch finché non sia pronto."
  BP-1030.80:
    name: "Introduzione sul mercato"
    description: "Eseguire il launch — release, annuncio, vendita e supporto del nuovo prodotto o servizio sul mercato."
  BP-1030.80.10:
    name: "Releasare al mercato"
    description: "Tagliare il release attraverso canali e geografie secondo il piano di launch; coordinare con PR, partner e fornitura."
  BP-1030.80.20:
    name: "Eseguire marketing di launch"
    description: "Eseguire campagne di launch — pubblicità, contenuto, eventi, PR, social — secondo il piano GTM."
  BP-1030.80.30:
    name: "Catturare vendite iniziali"
    description: "Guidare il motion iniziale di vendita via canali diretti, partner e digitali; tracciare conversione per validare la curva di launch."
  BP-1030.90:
    name: "Performance post-launch"
    description: "Tracciare performance rispetto al business case, catturare feedback del cliente, guidare miglioramenti e decidere movimenti di ciclo di vita."
  BP-1030.90.10:
    name: "Tracciare KPI di launch"
    description: "Monitorare adozione, ricavi, margine lordo, NPS e altri KPI di launch rispetto al business case per i primi 30/60/90 giorni e oltre."
  BP-1030.90.20:
    name: "Catturare feedback del cliente"
    description: "Catturare feedback strutturato e non strutturato del cliente sul mercato; instradare al backlog di prodotto e roadmap."
  BP-1030.90.30:
    name: "Pianificare miglioramenti di ciclo di vita"
    description: "Decidere miglioramenti, fast-follow feature o movimenti di pivot basati su evidenza post-launch; alimentare di ritorno alla cattura di idee."
