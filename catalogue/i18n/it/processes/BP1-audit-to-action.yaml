kind: business-process
locale: it
source: BP1-audit-to-action.yaml
entries:
  BP-1120:
    name: "Audit-a-Azione"
    description: "Ciclo di internal audit dalla pianificazione dell'audit-universe attraverso scoping dell'engagement, fieldwork, rilievi, tracciamento della remediation e quality assurance dell'audit. Un BP2 per ogni stage_name di VS-80."
  BP-1120.10:
    name: "Audit-universe e piano"
    description: "Mantenere l'audit-universe e costruire il piano annuale di audit basato sul rischio."
  BP-1120.10.10:
    name: "Mantenere audit-universe"
    description: "Mantenere la popolazione di entità auditabili — processi, sistemi, ubicazioni, terze parti."
  BP-1120.10.20:
    name: "Costruire piano di audit basato sul rischio"
    description: "Costruire il piano annuale di audit dall'universe pesato per rischio; ottenere approvazione del comitato di audit."
  BP-1120.20:
    name: "Scoping dell'engagement"
    description: "Definire scope dell'engagement di audit — obiettivi, controlli in scope, periodo, risorse."
  BP-1120.20.10:
    name: "Definire obiettivi di audit"
    description: "Definire obiettivi di audit, domande chiave e rischi da affrontare nell'engagement."
  BP-1120.20.20:
    name: "Pianificare procedure di audit"
    description: "Pianificare procedure di audit — walk-through, test campionari, analytics — ed evidenze richieste."
  BP-1120.30:
    name: "Fieldwork"
    description: "Eseguire fieldwork di audit — raccogliere evidenze, eseguire test e documentare workpaper."
  BP-1120.30.10:
    name: "Walk-through del processo"
    description: "Fare walk-through del processo in scope per comprendere design e controlli chiave; documentare narrativa e diagramma di flusso."
  BP-1120.30.20:
    name: "Testare controlli e transazioni"
    description: "Eseguire test campionari o sull'intera popolazione di efficacia di design e operativa; documentare workpaper."
  BP-1120.30.30:
    name: "Eseguire audit analytics"
    description: "Eseguire data analytics sull'intera popolazione per far emergere anomalie, eccezioni e pattern."
  BP-1120.30.40:
    name: "Documentare evidenze di audit"
    description: "Documentare evidenze nei workpaper con cross-reference; ottenere conferme dell'auditato dove richiesto."
  BP-1120.40:
    name: "Rilievi e reportistica"
    description: "Sviluppare rilievi, concordare risposte di management ed emettere il report di audit."
  BP-1120.40.10:
    name: "Sviluppare rilievi"
    description: "Sviluppare rilievi con condition, criteria, cause, consequence e raccomandazione."
  BP-1120.40.20:
    name: "Concordare risposte di management"
    description: "Concordare risposta di management — accettare, azione alternativa, contestare — con auditati e data target di remediation."
  BP-1120.40.30:
    name: "Emettere report di audit"
    description: "Emettere il report finale di audit allo sponsor esecutivo e al comitato di audit; chiudere l'engagement."
  BP-1120.50:
    name: "Tracciamento della remediation"
    description: "Tracciare la remediation dei rilievi da parte del management fino alla chiusura; verificare con re-test dove applicabile."
  BP-1120.50.10:
    name: "Tracciare stato della remediation"
    description: "Tracciare rilievi aperti, date target e progresso del management rispetto al piano di remediation."
  BP-1120.50.20:
    name: "Verificare chiusura"
    description: "Verificare chiusura del rilievo per re-test, revisione di evidenza o audit di follow-up; chiudere nel tracker."
  BP-1120.60:
    name: "Quality assurance dell'audit"
    description: "Eseguire quality assurance sulla funzione di audit — revisione workpaper, peer review, valutazione esterna."
  BP-1120.60.10:
    name: "Rivedere workpaper di audit"
    description: "Eseguire revisione supervisoria dei workpaper e dei rilievi per evidenza sufficiente e appropriata."
  BP-1120.60.20:
    name: "Eseguire valutazione esterna di qualità"
    description: "Eseguire valutazione esterna periodica di qualità della funzione di audit secondo gli Standard IIA."
