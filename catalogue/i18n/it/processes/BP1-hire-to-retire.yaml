kind: business-process
locale: it
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "Assunzione-a-Pensionamento"
    description: "Ciclo di vita end-to-end del dipendente da pianificazione della forza lavoro attraverso sourcing, selezione, onboarding, performance e sviluppo, amministrazione di compensi e benefit, esperienza del dipendente, mobilità interna e offboarding. Un BP2 per ogni stage_name di VS-280."
    source_hash: sha256-09ffdeb0d20eb666
  BP-1020.10:
    name: "Pianificazione della forza lavoro"
    description: "Prevedere bisogni di forza lavoro rispetto a strategia e offerta attuale, identificare gap di competenze e pianificare movimenti di assunzione, mobilità e uscita necessari per chiuderli."
    source_hash: sha256-8ee05419330812e0
  BP-1020.10.10:
    name: "Prevedere domanda di forza lavoro"
    description: "Tradurre il business plan in domanda di headcount, competenze e capacità per team, ruolo e orizzonte temporale."
    source_hash: sha256-b13cd46fc052b75b
  BP-1020.10.20:
    name: "Valutare offerta di forza lavoro"
    description: "Inventariare dipendenti attuali, contractor e movimenti in corso; valutare competenze rispetto alla domanda per far emergere gap ed eccedenze."
    source_hash: sha256-9aa3173db35ae515
  BP-1020.10.30:
    name: "Costruire piano di forza lavoro"
    description: "Progettare il piano integrato — assumere, sviluppare, ricollocare, far uscire — per chiudere il gap; sequenziare movimenti con budget e approvazioni."
    source_hash: sha256-05868c274352d2bf
  BP-1020.20:
    name: "Sourcing e attrazione"
    description: "Identificare e attrarre candidati via employer brand, canali di sourcing e outreach diretto."
    source_hash: sha256-c9f25567ef00b334
  BP-1020.20.10:
    name: "Sviluppare employer brand"
    description: "Posizionare la value proposition di employer brand e i messaggi usati attraverso i canali per attrarre segmenti target di talento."
    source_hash: sha256-301153251b07415f
  BP-1020.20.20:
    name: "Sourcare candidati"
    description: "Sourcare via job board, social media, referenze, agenzie e outreach diretto; persistere candidati nell'ATS."
    source_hash: sha256-d2e9732fbea74c90
  BP-1020.20.30:
    name: "Gestire talent community"
    description: "Mantenere relazioni con candidati in talent pool e community per ruoli evergreen e pipeline."
    source_hash: sha256-0d81fb41f934c50b
  BP-1020.30:
    name: "Selezione e assunzione"
    description: "Filtrare, valutare, intervistare e selezionare candidati; eseguire verifiche pre-assunzione; fare e ottenere accettazione dell'offerta."
    source_hash: sha256-05bfafa6ba03c777
  BP-1020.30.10:
    name: "Filtrare e preselezionare candidati"
    description: "Applicare criteri di filtro alle candidature in arrivo; preselezionare per intervista basandosi su fit e qualifiche."
    source_hash: sha256-cb5a307727a052bc
  BP-1020.30.20:
    name: "Condurre valutazioni e interviste"
    description: "Condurre interviste strutturate e valutazioni di competenze; consolidare feedback degli intervistatori in una decisione di assunzione."
    source_hash: sha256-3d521eea12b26cfa
  BP-1020.30.30:
    name: "Eseguire verifiche pre-assunzione"
    description: "Eseguire verifiche di background, referenze e diritto al lavoro secondo giurisdizione e rischio della posizione."
    source_hash: sha256-19a67bb8129a9e6a
  BP-1020.30.40:
    name: "Fare e negoziare offerta"
    description: "Costruire l'offerta (compensi, equity, data di inizio), negoziare con il candidato e catturare l'accettazione."
    source_hash: sha256-761e6d7b309b32d4
  BP-1020.30.50:
    name: "Assumere il dipendente"
    description: "Eseguire il contratto di lavoro, creare il record del dipendente nell'HRIS e attivare workflow di onboarding a valle."
    source_hash: sha256-d80a4476cf0e5849
  BP-1020.40:
    name: "Onboarding"
    description: "Far entrare il nuovo dipendente nell'organizzazione — accoglienza, formalità, attrezzatura, formazione e integrazione."
    source_hash: sha256-f60d0cdc7e828a78
  BP-1020.40.10:
    name: "Provisionare attrezzatura e accessi"
    description: "Consegnare laptop, accessi a uffici, credenziali di sistema e qualsiasi attrezzatura specifica del ruolo prima del giorno 1."
    source_hash: sha256-7c434b47b861c4de
  BP-1020.40.20:
    name: "Completare formalità di onboarding"
    description: "Catturare formalità statutarie di assunzione — moduli fiscali, iscrizione benefit, conferme di policy — per compliance."
    source_hash: sha256-ddbf6f961bce99c1
  BP-1020.40.30:
    name: "Erogare programma di onboarding"
    description: "Eseguire il percorso strutturato di onboarding — orientamento, formazione al ruolo, check-in con manager — sui primi 30/60/90 giorni."
    source_hash: sha256-ee4ee7e3818020aa
  BP-1020.40.40:
    name: "Confermare completamento di onboarding"
    description: "Validare che il nuovo dipendente abbia completato tutte le milestone di onboarding richieste e sia pienamente operativo."
    source_hash: sha256-0341b621099346a9
  BP-1020.50:
    name: "Performance e sviluppo"
    description: "Stabilire obiettivi, dare feedback, condurre review formali, identificare bisogni di sviluppo ed erogare apprendimento e coaching."
    source_hash: sha256-7f4f873f09922c08
  BP-1020.50.10:
    name: "Stabilire obiettivi di performance"
    description: "Cascadare obiettivi di business in obiettivi individuali all'inizio del ciclo; allineare con priorità di team e funzione."
    source_hash: sha256-6d6c3da452126277
  BP-1020.50.20:
    name: "Fornire feedback continuo"
    description: "Tenere conversazioni 1:1 regolari e feedback continuo tra manager e dipendenti lungo il ciclo."
    source_hash: sha256-108b0046db668289
  BP-1020.50.30:
    name: "Condurre review di performance"
    description: "Eseguire la review formale di ciclo — auto-valutazione, review del manager, calibrazione — per determinare rating e conseguenze."
    source_hash: sha256-672da1819702f401
  BP-1020.50.40:
    name: "Identificare bisogni di sviluppo"
    description: "Identificare gap di competenze rispetto al ruolo attuale e futuro; catturarli in piani di sviluppo collegati a interventi formativi."
    source_hash: sha256-0c9679c589077ab9
  BP-1020.50.50:
    name: "Erogare apprendimento e coaching"
    description: "Eseguire programmi di formazione, coaching on-the-job, mentoring e sviluppo per missione; tracciare completamento e impatto."
    source_hash: sha256-45e4c4dda86fdd30
  BP-1020.60:
    name: "Amministrazione di compensi e benefit"
    description: "Amministrare salario base, compensi variabili, equity e benefit lungo il ciclo di vita; eseguire review salariale e handoff alla payroll."
    source_hash: sha256-ed60011d8ab65f0e
  BP-1020.60.10:
    name: "Amministrare compensi fissi e variabili"
    description: "Mantenere fasce retributive, tassi individuali e piani di compensi variabili; attivare aggiornamenti payroll su promozione, trasferimento o cambio di tasso."
    source_hash: sha256-c45df0159b0099aa
  BP-1020.60.20:
    name: "Condurre ciclo di review salariale"
    description: "Condurre il processo di review salariale annuale o off-cycle; applicare linee guida di budget, proposte dei manager e approvazioni."
    source_hash: sha256-c01fd88d6f4da442
  BP-1020.60.30:
    name: "Amministrare iscrizione ai benefit"
    description: "Condurre iscrizione in open enrolment ed eventi qualificanti per salute, pensione e altri benefit; riconciliare con flussi dei provider."
    source_hash: sha256-09055d65dc34c179
  BP-1020.60.40:
    name: "Gestire programmi di equity"
    description: "Concedere, vestire ed esercitare equity secondo le regole del piano; coordinare con finance, legale e broker di equity."
    source_hash: sha256-31daf9cd9c81ea58
  BP-1020.70:
    name: "Esperienza ed engagement del dipendente"
    description: "Eseguire il programma di engagement, sondaggi di employee voice, riconoscimento, wellbeing ed esperienza del dipendente in senso ampio."
    source_hash: sha256-f0e69b4282464c4a
  BP-1020.70.10:
    name: "Condurre sondaggi di engagement"
    description: "Condurre sondaggi di engagement periodici e pulse survey; analizzare risultati per team, segmento e trend."
    source_hash: sha256-78f0d2806028c8ed
  BP-1020.70.20:
    name: "Agire sul feedback del dipendente"
    description: "Tradurre insight dei sondaggi in piani di azione a livello team e azienda; tracciare implementazione."
    source_hash: sha256-952715be78e361e8
  BP-1020.70.30:
    name: "Operare programmi di riconoscimento"
    description: "Eseguire programmi di riconoscimento peer-to-peer e manager; tracciare partecipazione e impatto sull'engagement."
    source_hash: sha256-2f1b11504ae2ac03
  BP-1020.70.40:
    name: "Supportare benessere del dipendente"
    description: "Operare programmi di wellbeing — EAP, salute mentale, benessere finanziario, ergonomia — e rispondere a escalation."
    source_hash: sha256-04c0e83acf6247b0
  BP-1020.80:
    name: "Mobilità interna e carriera"
    description: "Operare il marketplace interno di lavori, pianificazione della successione e gestione di percorsi di carriera."
    source_hash: sha256-993c916a1d85bec6
  BP-1020.80.10:
    name: "Operare marketplace interno di lavori"
    description: "Pubblicare ruoli interni, gestire candidature interne e condurre interviste con candidati interni."
    source_hash: sha256-43393d28f6a60618
  BP-1020.80.20:
    name: "Condurre pianificazione della successione"
    description: "Identificare successori per ruoli critici, valutare la loro readiness e costruire movimenti di sviluppo per chiudere gap."
    source_hash: sha256-1fdfca6245f60e37
  BP-1020.80.30:
    name: "Gestire percorsi di carriera"
    description: "Mantenere framework di percorsi di carriera, criteri di progressione di ruolo e linee guida di mobilità interna per manager e dipendenti."
    source_hash: sha256-dfdd52489ff5725d
  BP-1020.90:
    name: "Offboarding e alumni"
    description: "Gestire uscite di dipendenti — volontarie, involontarie, pensionamento — e operare il programma alumni."
    source_hash: sha256-22e8c08197f922e3
  BP-1020.90.10:
    name: "Processare dimissioni o cessazione"
    description: "Catturare e processare la separazione — dimissioni, licenziamento, cessazione economica, pensionamento — via il workflow di offboarding."
    source_hash: sha256-a125a10cab774080
  BP-1020.90.20:
    name: "Condurre intervista di uscita"
    description: "Condurre l'intervista di uscita per catturare apprendimenti e feedback; integrare in insight di engagement e retention."
    source_hash: sha256-e9c23ee30af51824
  BP-1020.90.30:
    name: "Recuperare attrezzatura e accessi"
    description: "Recuperare laptop, badge, credenziali di sistema e qualsiasi attrezzatura specifica del ruolo nell'ultimo giorno di lavoro."
    source_hash: sha256-4c346ccd2649f029
  BP-1020.90.40:
    name: "Operare rete alumni"
    description: "Mantenere la rete alumni per ri-assunzione, referenze e community; eseguire engagement periodico."
    source_hash: sha256-d66212468362c119
