kind: business-process
locale: it
source: BP1-crisis-to-recovery.yaml
entries:
  BP-1140:
    name: "Crisi-a-Ripristino"
    description: "Ciclo di business continuity e gestione delle crisi dalla pianificazione di continuità attraverso test di resilienza, rilevazione e attivazione, risposta alla crisi, disaster recovery, ripristino e revisione post-crisi. Un BP2 per ogni stage_name di VS-140."
    source_hash: sha256-6b5a46bc8192fd2e
  BP-1140.10:
    name: "Pianificazione di continuità"
    description: "Costruire e mantenere piani di business continuity e disaster recovery per processi e sistemi critici."
    source_hash: sha256-015c32937d1d65af
  BP-1140.10.10:
    name: "Condurre business impact analysis"
    description: "Identificare processi critici, target RTO/RPO, dipendenze e requisiti minimi di operatività."
    source_hash: sha256-16d992be1d96a2e6
  BP-1140.10.20:
    name: "Costruire piani di continuità"
    description: "Costruire piani di business continuity a livello processo e sito — workaround, siti alternativi, contatti chiave."
    source_hash: sha256-504a6e02114d49ad
  BP-1140.10.30:
    name: "Costruire piani di disaster recovery"
    description: "Costruire piani di disaster recovery IT — runbook, replica, target di failover — per sistemi critici."
    source_hash: sha256-88c412c4c1a51500
  BP-1140.20:
    name: "Test di resilienza"
    description: "Testare piani di continuità e recovery — esercizi tabletop, walk-through, failover completo."
    source_hash: sha256-eb3618fdb4e292cb
  BP-1140.20.10:
    name: "Condurre esercizi tabletop"
    description: "Condurre esercizi tabletop con team chiave per validare piani e far emergere gap senza interrompere le operazioni."
    source_hash: sha256-19611168ac84e9f3
  BP-1140.20.20:
    name: "Eseguire drill di failover"
    description: "Eseguire drill di failover controllati per validare il recovery tecnico; catturare timing rispetto ai target."
    source_hash: sha256-549dfa1938c1c12c
  BP-1140.20.30:
    name: "Aggiornare piani secondo i rilievi"
    description: "Aggiornare piani di continuità e recovery sulla base dei rilievi dei test; chiudere gap prima del prossimo ciclo."
    source_hash: sha256-a53a2d1c7ca74f86
  BP-1140.30:
    name: "Rilevazione e attivazione"
    description: "Rilevare il trigger di crisi e attivare la risposta — incident commander, war-room, comms."
    source_hash: sha256-0373dbdb7e081af0
  BP-1140.30.10:
    name: "Rilevare trigger di crisi"
    description: "Rilevare eventi che soddisfano i criteri di trigger di crisi — outage, breach, evento di sicurezza, azione regolatoria."
    source_hash: sha256-a2b600c30c99453b
  BP-1140.30.20:
    name: "Attivare protocollo di crisi"
    description: "Attivare il protocollo di gestione delle crisi — designare commander, convocare war-room, stabilire cadenza di comms."
    source_hash: sha256-c4d200ad5dcab2c4
  BP-1140.40:
    name: "Risposta alla crisi"
    description: "Gestire la crisi attiva — proteggere persone e asset, contenere il danno, comunicare, coordinare."
    source_hash: sha256-4c79bc509b89d20c
  BP-1140.40.10:
    name: "Proteggere persone e beni"
    description: "Condurre azioni protettive — evacuazione, shutdown, isolamento, medico, sicurezza — per limitare il danno."
    source_hash: sha256-bc0d35d4aee77175
  BP-1140.40.20:
    name: "Contenere impatto della crisi"
    description: "Contenere l'impatto operativo, finanziario, regolatorio e reputazionale via azioni di risposta mirate."
    source_hash: sha256-9a019f4fa1f15864
  BP-1140.40.30:
    name: "Gestire comunicazione di crisi"
    description: "Condurre comunicazioni interne, esterne, ai regolatori e ai media lungo l'intera crisi attiva."
    source_hash: sha256-4dad5b0557fd8542
  BP-1140.50:
    name: "Disaster recovery"
    description: "Eseguire procedure di disaster recovery per ripristinare servizi IT entro i target RTO/RPO."
    source_hash: sha256-fb85c409a6e401a5
  BP-1140.50.10:
    name: "Eseguire failover IT"
    description: "Eseguire il failover pianificato di sistemi IT critici verso l'infrastruttura di recovery."
    source_hash: sha256-10be996126e393fa
  BP-1140.50.20:
    name: "Validare servizi ripristinati"
    description: "Validare servizi ripristinati rispetto ai criteri di accettazione; riprendere operazioni cliente-facing."
    source_hash: sha256-036370fd854b7000
  BP-1140.50.30:
    name: "Eseguire failback"
    description: "Pianificare ed eseguire il failback all'infrastruttura primaria una volta stabile; validare ripristino completo."
    source_hash: sha256-c1689ce7096339a1
  BP-1140.60:
    name: "Ripristino"
    description: "Ripristinare asset fisici, supply chain e operazioni allo stato pre-crisi."
    source_hash: sha256-44df1443f713f43d
  BP-1140.60.10:
    name: "Ripristinare operazioni fisiche"
    description: "Ripristinare asset fisici, siti e attrezzature in condizione operativa; passare verifiche di sicurezza."
    source_hash: sha256-f505be01a02d874a
  BP-1140.60.20:
    name: "Ripristinare flussi di fornitura e domanda"
    description: "Ripristinare flussi fornitori, flusso di ordini cliente e posizionamento dell'inventario alla baseline."
    source_hash: sha256-93a3ae915fd7288e
  BP-1140.70:
    name: "Revisione post-crisi"
    description: "Condurre post-action review; catturare lessons learned; guidare miglioramenti sistemici di resilienza."
    source_hash: sha256-2955b6f0dfd36dd5
  BP-1140.70.10:
    name: "Condurre post-action review"
    description: "Condurre post-action review blameless con tutti i responder; catturare timeline, decisioni e apprendimenti."
    source_hash: sha256-7583baae8ac29129
  BP-1140.70.20:
    name: "Rafforzare resilienza"
    description: "Tradurre lessons learned in miglioramenti di resilienza — controlli, piani, formazione, tecnologia."
    source_hash: sha256-676cf9bedb8b4c35
