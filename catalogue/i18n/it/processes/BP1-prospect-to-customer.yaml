kind: business-process
locale: it
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Prospect-a-Cliente"
    description: "Ciclo end-to-end di acquisizione cliente da strategia di mercato e segmento attraverso brand, demand generation, cattura di lead, conversione, onboarding e retention e advocacy continue. Un BP2 per ogni stage_name di VS-440."
  BP-1050.10:
    name: "Strategia di mercato e segmento"
    description: "Definire mercati target e segmenti di cliente, e allineare priorità go-to-market dove il right-to-win è più forte."
  BP-1050.10.10:
    name: "Analizzare panorama del mercato"
    description: "Dimensionare mercati, profilare competitor e far emergere trend che plasmano domanda e strategia di acquisizione."
  BP-1050.10.20:
    name: "Definire segmenti target"
    description: "Definire e prioritizzare segmenti di cliente target basati su bisogno, fit e right-to-win."
  BP-1050.10.30:
    name: "Stabilire priorità di acquisizione"
    description: "Tradurre priorità di segmento in target di acquisizione — account, geografie, canali — per l'orizzonte di pianificazione."
  BP-1050.20:
    name: "Brand e posizionamento"
    description: "Sviluppare e custodire il brand, posizionamento e sistema di messaging usato attraverso tutti i canali di acquisizione."
  BP-1050.20.10:
    name: "Sviluppare strategia di brand"
    description: "Definire promessa di brand, personalità, architettura e identità visiva; allineare attraverso mercati e segmenti."
  BP-1050.20.20:
    name: "Sviluppare posizionamento e messaging"
    description: "Sviluppare posizionamento e messaging per ogni segmento e offerta; equipaggiare campagne e vendite con narrativa consistente."
  BP-1050.20.30:
    name: "Custodire asset di brand"
    description: "Mantenere linee guida di brand, gestire approvazioni di uso del brand e governare identità visiva e verbale sul mercato."
  BP-1050.30:
    name: "Demand generation"
    description: "Generare awareness e domanda su scala attraverso canali paid, owned, earned e partner."
  BP-1050.30.10:
    name: "Pianificare campagne di demand generation"
    description: "Pianificare campagne per segmento, canale e offerta; allocare budget; stabilire target di lead e pipeline."
  BP-1050.30.20:
    name: "Eseguire campagne multi-canale"
    description: "Eseguire campagne paid, owned, earned e partner; gestire creatività, landing page e offerte."
  BP-1050.30.30:
    name: "Misurare performance delle campagne"
    description: "Misurare reach, response e impatto su pipeline per campagna e canale; iterare creatività e spend."
  BP-1050.40:
    name: "Cattura e nurture di lead"
    description: "Catturare interesse inbound, arricchire e valutare lead e nurturarli fino allo stato sales-ready."
  BP-1050.40.10:
    name: "Catturare lead inbound"
    description: "Catturare lead da form, eventi, referenze partner e canali inbound nella piattaforma di marketing automation."
  BP-1050.40.20:
    name: "Arricchire e valutare lead"
    description: "Arricchire con dati firmografici e comportamentali; valutare su fit e intent per identificare lead sales-ready."
  BP-1050.40.30:
    name: "Nurturare lead"
    description: "Eseguire programmi di nurture — contenuto, drip campaign, retargeting — per far avanzare lead verso sales-ready."
  BP-1050.40.40:
    name: "Fare handover di lead sales-ready"
    description: "Instradare lead sales-ready alle vendite per engagement diretto; tracciare conversione a opportunità."
  BP-1050.50:
    name: "Conversione"
    description: "Convertire lead qualificati in primi ordini o prime sottoscrizioni tramite engagement di vendita, trial e offerte."
  BP-1050.50.10:
    name: "Engagement con prospect"
    description: "Eseguire engagement diretto di vendita, demo e trial per costruire fiducia del cliente e progredire verso decisione."
  BP-1050.50.20:
    name: "Affrontare obiezioni del buyer"
    description: "Far emergere e affrontare obiezioni — prezzo, fit, sicurezza, integrazione — tramite evidenza e trial."
  BP-1050.50.30:
    name: "Offrire e chiudere primo deal"
    description: "Costruire un'offerta di primo deal, negoziare termini e catturare il primo ordine o sottoscrizione."
  BP-1050.50.40:
    name: "Tracciare funnel di conversione"
    description: "Tracciare conversione lead-a-cliente per segmento, canale e offerta; iterare sul funnel."
  BP-1050.60:
    name: "Onboarding del cliente"
    description: "Fare onboarding di nuovi clienti — provisioning, formazione, success planning — per accelerare time-to-value."
  BP-1050.60.10:
    name: "Dare benvenuto al nuovo cliente"
    description: "Eseguire l'esperienza di benvenuto — kickoff, contatti nominati, success plan — per stabilire aspettative ed energia."
  BP-1050.60.20:
    name: "Provisionare cliente"
    description: "Provisionare il cliente nei sistemi di delivery — account, entitlement, integrazioni, migrazione dati."
  BP-1050.60.30:
    name: "Formare utenti del cliente"
    description: "Formare gli utenti del cliente sul prodotto o servizio; certificare champion; registrare in milestone del success plan."
  BP-1050.60.40:
    name: "Confermare time-to-value"
    description: "Validare che il cliente abbia raggiunto milestone di first-value; catturare per scoring di retention."
  BP-1050.70:
    name: "Retention e advocacy"
    description: "Trattenere clienti, guidare renewal ed espansione e trasformare promotori in advocate e referenze."
  BP-1050.70.10:
    name: "Eseguire customer health scoring"
    description: "Valutare salute del cliente da uso del prodotto, engagement e segnali di feedback; far emergere account a rischio per intervento."
  BP-1050.70.20:
    name: "Guidare renewal ed espansione"
    description: "Eseguire il motion di renewal e identificare opportunità di espansione — cross-sell, upsell — all'interno dell'account."
  BP-1050.70.30:
    name: "Coltivare advocacy"
    description: "Identificare promotori, catturare referenze, case study e testimonianze; attivare programmi di advocacy."
