kind: business-process
locale: it
source: BP1-procure-to-pay.yaml
entries:
  BP-1010:
    name: "Acquisto-a-Pagamento"
    description: "Ciclo di spesa lato fornitore end-to-end dall'identificazione del bisogno attraverso sourcing, selezione del fornitore, contratto e ordine d'acquisto, ricezione di beni o servizi, elaborazione fatture, pagamento, riconciliazione e monitoraggio della performance del fornitore. Un BP2 per ogni stage_name di VS-420."
  BP-1010.10:
    name: "Identificazione del bisogno e richiesta"
    description: "Catturare, validare e approvare la domanda interna di beni o servizi e tradurla in una richiesta d'acquisto."
  BP-1010.10.10:
    name: "Identificare bisogno di acquisto"
    description: "Catturare la domanda di business per un bene o servizio dalla funzione richiedente e confermare che siano state considerate alternative interne."
  BP-1010.10.20:
    name: "Specificare requisiti"
    description: "Convertire il bisogno in una specifica chiara — quantità, qualità, livello di servizio e vincoli di consegna — su cui i fornitori possano quotare."
  BP-1010.10.30:
    name: "Sollevare richiesta d'acquisto"
    description: "Creare la richiesta d'acquisto nel sistema procurement, assegnare codifica budget e sottomettere ad approvazione."
  BP-1010.10.40:
    name: "Approvare richiesta d'acquisto"
    description: "Instradare la richiesta attraverso la gerarchia di autorizzazione di spesa; catturare decisioni e rifiuti dell'approvatore con motivazioni."
  BP-1010.20:
    name: "Sourcing"
    description: "Selezionare la strategia di sourcing, eseguire eventi di sourcing (RFx), valutare risposte e aggiudicare il lavoro."
  BP-1010.20.10:
    name: "Sviluppare strategia di sourcing per categoria"
    description: "Confermare la strategia di categoria — make-vs-buy, single vs multi-source, vincoli geografici — che inquadra questo evento di sourcing."
  BP-1010.20.20:
    name: "Eseguire evento di sourcing"
    description: "Emettere RFI/RFP/RFQ a fornitori qualificati, gestire Q&A e raccogliere risposte entro la deadline."
  BP-1010.20.30:
    name: "Valutare risposte dei fornitori"
    description: "Valutare risposte rispetto ai criteri di valutazione pubblicati — TCO, qualità, capacità, sostenibilità, rischio."
  BP-1010.20.40:
    name: "Negoziare aggiudicazione di sourcing"
    description: "Condurre round di negoziazione best-and-final con fornitori in shortlist e finalizzare la decisione di aggiudicazione e la sua giustificazione."
  BP-1010.30:
    name: "Selezione e onboarding del fornitore"
    description: "Qualificare il fornitore aggiudicato, eseguire verifiche di rischio e compliance e farlo onboarding nei dati anagrafici e nei sistemi operativi."
  BP-1010.30.10:
    name: "Condurre due diligence del fornitore"
    description: "Eseguire verifiche finanziarie, regolatorie, sanzioni, ESG e cybersecurity sul fornitore aggiudicato e documentare rischi residui."
  BP-1010.30.20:
    name: "Qualificare fornitore"
    description: "Confermare che il fornitore soddisfa i gate di qualificazione della categoria — certificazioni, assicurazioni, standard di qualità — prima che l'onboarding proceda."
  BP-1010.30.30:
    name: "Configurare dati anagrafici del fornitore"
    description: "Persistere dati bancari, fiscali, di indirizzo e contatto del fornitore nei dati anagrafici con le opportune verifiche di stewardship."
  BP-1010.30.40:
    name: "Onboardare fornitore nei sistemi operativi"
    description: "Provisionare il fornitore in P2P, EDI/portale e qualsiasi sistema specifico di categoria; eseguire test di integrazione sulle transazioni."
  BP-1010.40:
    name: "Contratto e ordine d'acquisto"
    description: "Eseguire il contratto del fornitore e convertire le richieste approvate in ordini d'acquisto su cui il fornitore possa adempiere."
  BP-1010.40.10:
    name: "Negoziare contratto del fornitore"
    description: "Negoziare termini commerciali, legali e operativi — prezzi, SLA, indennizzi, change control — e catturare redline fino all'esecuzione."
  BP-1010.40.20:
    name: "Eseguire contratto del fornitore"
    description: "Catturare firme autorizzate, persistere il contratto eseguito nel repository contratti e collegarlo ai dati anagrafici del fornitore."
  BP-1010.40.30:
    name: "Emettere ordine d'acquisto"
    description: "Convertire la richiesta approvata (sotto contratto eseguito o PO una tantum) in un ordine d'acquisto fermo e trasmetterlo al fornitore."
  BP-1010.40.40:
    name: "Gestire modifiche all'OA"
    description: "Processare modifiche richieste dal fornitore o dall'acquirente — quantità, data, prezzo — attraverso il workflow di change control dell'OA."
  BP-1010.50:
    name: "Ricezione di beni/servizi"
    description: "Ricevere beni o servizi, verificare quantità e qualità rispetto all'OA e registrare la ricezione per il matching fattura a valle."
  BP-1010.50.10:
    name: "Ricevere beni o servizi"
    description: "Prendere ricezione fisica di beni alla banchina, o sign-off di completamento di servizi erogati, e catturare prova di consegna."
  BP-1010.50.20:
    name: "Ispezionare quantità e qualità"
    description: "Verificare quantità, condizione e conformità alla specifica dell'OA; emettere report di non conformità dove rilevato shortfall."
  BP-1010.50.30:
    name: "Registrare ricezione beni"
    description: "Registrare la ricezione beni nell'ERP, rilasciando inventario o riconoscimento di spesa e abilitando il matching tre vie delle fatture."
  BP-1010.50.40:
    name: "Risolvere eccezioni di ricezione"
    description: "Gestire shortfall, danni o dispute di completamento servizi con il fornitore; concordare aggiustamenti prima dell'accettazione fattura."
  BP-1010.60:
    name: "Ricezione e verifica fatture"
    description: "Ricevere la fattura del fornitore, eseguire matching tre vie rispetto a OA e ricezione e risolvere discrepanze."
  BP-1010.60.10:
    name: "Ricevere fattura del fornitore"
    description: "Catturare la fattura del fornitore via e-invoicing, EDI, portale o cartaceo; persistere con metadati del sistema sorgente."
  BP-1010.60.20:
    name: "Fare matching fattura con OA e ricezione"
    description: "Eseguire il matching tre vie rispetto a OA e ricezione beni; instradare eccezioni a AP per risoluzione prima dell'autorizzazione al pagamento."
  BP-1010.60.30:
    name: "Risolvere discrepanze di fattura"
    description: "Investigare discrepanze di prezzo, quantità o termini con acquirente e fornitore; catturare note di credito o aggiustamenti prima dell'approvazione."
  BP-1010.60.40:
    name: "Approvare fattura per pagamento"
    description: "Instradare la fattura matchata attraverso eventuali approvazioni richieste (soglia CFO, sign-off di progetto) e autorizzarla al pagamento."
  BP-1010.70:
    name: "Esecuzione del pagamento"
    description: "Eseguire il pagamento del fornitore tramite lo strumento scelto e inviare avviso di rimessa al fornitore."
  BP-1010.70.10:
    name: "Schedulare run di pagamento"
    description: "Raggruppare fatture approvate in una run di pagamento per data scadenza, valuta e strumento; ottimizzare cattura di sconto e float."
  BP-1010.70.20:
    name: "Eseguire pagamento"
    description: "Erogare via bonifico, ACH, virtual card, assegno o e-payment; persistere conferme bancarie di tesoreria."
  BP-1010.70.30:
    name: "Inviare avviso di rimessa"
    description: "Notificare al fornitore il pagamento con dettaglio di rimessa riga per riga affinché possa applicare alle proprie AR aperte."
  BP-1010.80:
    name: "Riconciliazione"
    description: "Conciliare il sub-libro mastro AP con il libro mastro generale e con la banca, risolvendo variazioni prima della chiusura del periodo."
  BP-1010.80.10:
    name: "Conciliare AP con libro mastro"
    description: "Fare rolling-forward del sub-libro mastro AP e conciliare saldi con conti di controllo GL, investigando qualsiasi variazione."
  BP-1010.80.20:
    name: "Conciliare pagamenti con banca"
    description: "Fare matching delle run di pagamento con estratti conto bancari; investigare assegni non incassati, ACH ritornati, timing FX e variazioni di commissioni bancarie."
  BP-1010.80.30:
    name: "Risolvere variazioni di riconciliazione"
    description: "Portare variazioni alla causa radice — pagamento duplicato, registrazione mal postata, credito fornitore non applicato — e postare scritture correttive."
  BP-1010.90:
    name: "Monitoraggio della performance del fornitore"
    description: "Tracciare la performance del fornitore rispetto a SLA e KPI contrattuali, eseguire scorecard e gestire azioni correttive."
  BP-1010.90.10:
    name: "Tracciare KPI del fornitore"
    description: "Raccogliere dati operativi su qualità, consegna on-time, fill rate e raggiungimento SLA; persistere per generazione di scorecard."
  BP-1010.90.20:
    name: "Emettere scorecard del fornitore"
    description: "Produrre e condividere la scorecard periodica del fornitore con il fornitore e la gestione interna di categoria; catturare feedback del fornitore."
  BP-1010.90.30:
    name: "Gestire azioni correttive con fornitori"
    description: "Aprire, tracciare e chiudere piani di azione correttiva con fornitori sotto-performanti; escalare a rimedi contrattuali se la mancanza persiste."
