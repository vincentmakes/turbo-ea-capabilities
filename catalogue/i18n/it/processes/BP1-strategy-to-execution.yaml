kind: business-process
locale: it
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Strategia-a-Esecuzione"
    description: "Ciclo end-to-end di consegna strategica dalla formulazione della strategia attraverso definizione del portafoglio, setup di programma e progetto, consegna e governance, adozione del cambiamento e realizzazione dei benefici. Un BP2 per ogni stage_name di VS-580."
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "Formulazione della strategia"
    description: "Definire la strategia aziendale — visione, obiettivi, choice e il modello operativo necessario per vincere."
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "Definire direzione strategica"
    description: "Definire visione, missione, obiettivi strategici e i principi che guidano le choice."
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "Effettuare choice strategiche"
    description: "Effettuare choice where-to-play e how-to-win; arbitrare trade-off tra mercati, segmenti, prodotti e capability."
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "Definire modello operativo"
    description: "Definire il modello operativo — capability, organizzazione, ubicazioni e partner — necessario per eseguire la strategia."
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "Definizione del portafoglio"
    description: "Tradurre la strategia in un portafoglio di programmi e investimenti che consegneranno gli outcome scelti."
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "Identificare investimenti del portafoglio"
    description: "Identificare investimenti candidati che chiuderanno gap strategici; catturare valore, costo, rischio e dipendenze."
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "Prioritizzare il portafoglio"
    description: "Prioritizzare investimenti per valore, fit, capacità e rischio; costruire il portafoglio integrato attraverso orizzonti."
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "Approvare il portafoglio"
    description: "Approvare e finanziare il portafoglio via il forum esecutivo; attivare il setup di programmi e progetti."
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "Setup di programma e progetto"
    description: "Stabilire programmi e progetti con charter, governance, piano, team e budget."
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "Charter del programma"
    description: "Charter del programma — outcome, scope, governance, sponsor, accountability, criteri di successo."
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "Pianificare consegna del programma"
    description: "Costruire il piano integrato di consegna attraverso i progetti costituenti, con milestone, dipendenze e risorse."
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "Costituire team di progetto"
    description: "Costituire team di progetto, confermare ruoli, fare onboarding e attivare il lavoro di sprint o fase zero."
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "Consegna e governance"
    description: "Consegnare programmi e progetti rispetto al piano; eseguire governance per far emergere rischi, decidere cambiamenti e assicurare qualità."
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "Eseguire lavoro di progetto"
    description: "Eseguire lavoro di progetto — design, build, test, consegna — secondo il metodo di consegna scelto (agile, waterfall, ibrido)."
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "Eseguire governance del programma"
    description: "Eseguire steering committee, forum di decisione e quality gate sotto autorità di corporate governance dell'azienda; far emergere e risolvere rischi, issue e cambiamenti."
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "Gestire rischi e cambiamenti del programma"
    description: "Mantenere registro dei rischi e change log; mitigare, escalare e decidere cambiamenti via governance."
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "Adozione del cambiamento"
    description: "Guidare l'adozione end-user dei cambiamenti consegnati dal programma — comunicare, formare, supportare, ancorare."
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "Pianificare adozione del cambiamento"
    description: "Costruire il piano di adozione del cambiamento — mappatura degli stakeholder, comunicazione, formazione, supporto, sostenibilità."
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "Comunicare e formare"
    description: "Eseguire comunicazioni e formazione attraverso la popolazione impattata secondo il piano di adozione del cambiamento."
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "Supportare adozione"
    description: "Fornire supporto hyper-care, far emergere blocker di adozione e condurre attività di rinforzo."
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "Realizzazione dei benefici"
    description: "Tracciare e catturare i benefici strategici che il programma si è impegnato a consegnare; chiudere il programma."
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "Tracciare metriche di benefici"
    description: "Tracciare i benefici impegnati — ricavi, costi, NPS, throughput — rispetto a baseline e target."
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "Catturare benefici"
    description: "Catturare benefici nel business-as-usual — incorporare in budget, KPI e processi run-the-business."
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "Chiudere il programma"
    description: "Chiudere il programma — report finale, lessons learned, archiviazione, rilascio del team; attivare movimenti di portafoglio di follow-up."
    source_hash: sha256-25c19e1849fe48b3
