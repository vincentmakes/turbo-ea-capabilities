kind: business-process
locale: it
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-a-Disclosure"
    description: "Ciclo di reporting di sostenibilità da strategia ESG e materialità attraverso raccolta dati, qualità dei dati e assurance, reporting e disclosure, engagement degli stakeholder e obiettivi di miglioramento. Un BP2 per ogni stage_name di VS-200."
    source_hash: sha256-66d60ef4b72a8d5f
  BP-1130.10:
    name: "Strategia ESG e materialità"
    description: "Stabilire ambizione ESG e condurre valutazione di doppia materialità per concentrarsi su ciò che conta."
    source_hash: sha256-59d591c8d59454a6
  BP-1130.10.10:
    name: "Stabilire ambizione ESG"
    description: "Stabilire l'ambizione ESG e collegarla alla strategia aziendale; impegnarsi su obiettivi net-zero, sociali e di governance."
    source_hash: sha256-5fa74157442208e6
  BP-1130.10.20:
    name: "Eseguire valutazione di doppia materialità"
    description: "Eseguire valutazione di doppia materialità per identificare temi materiali — materialità finanziaria e materialità di impatto."
    source_hash: sha256-4c2d2749ad94da76
  BP-1130.20:
    name: "Raccolta dati"
    description: "Raccogliere dati ESG — emissioni, energia, acqua, rifiuti, sociali, governance — lungo la catena del valore."
    source_hash: sha256-0c21f34aa6281b15
  BP-1130.20.10:
    name: "Raccogliere dati ambientali"
    description: "Raccogliere emissioni (Scope 1/2/3), energia, acqua, rifiuti, biodiversità e dati di inquinamento dalle operazioni."
    source_hash: sha256-b7ce2922da1bda78
  BP-1130.20.20:
    name: "Raccogliere dati sociali"
    description: "Raccogliere dati di workforce, salute e sicurezza, diversità, comunità e diritti umani secondo i temi materiali."
    source_hash: sha256-4e7113198459286a
  BP-1130.20.30:
    name: "Raccogliere dati di governance"
    description: "Raccogliere dati di governance — composizione del consiglio, etica, anti-corruzione, remunerazione esecutiva, condotta dei fornitori."
    source_hash: sha256-e6cf111543dc7f20
  BP-1130.20.40:
    name: "Raccogliere dati della catena del valore"
    description: "Raccogliere dati upstream e downstream della catena del valore — emissioni dei fornitori, fase d'uso del prodotto, fine vita."
    source_hash: sha256-0af74fa019d57c4d
  BP-1130.30:
    name: "Qualità dei dati e assurance"
    description: "Eseguire controlli di qualità dei dati e ottenere assurance esterna sui dati divulgati."
    source_hash: sha256-f9693fa74569cc51
  BP-1130.30.10:
    name: "Eseguire controlli di qualità dei dati ESG"
    description: "Eseguire controlli di completezza, accuratezza, consistenza e tracciabilità sui dati ESG."
    source_hash: sha256-7017be162f9deabf
  BP-1130.30.20:
    name: "Ottenere assurance esterna"
    description: "Ingaggiare provider di assurance per assurance limitata o ragionevole sulle metriche divulgate secondo lo standard applicabile."
    source_hash: sha256-5f0c5838aacf550a
  BP-1130.40:
    name: "Reporting e disclosure"
    description: "Produrre report ESG e disclosure regolatorie — CSRD/ESRS, SEC clima, GRI, SASB, TCFD, ISSB."
    source_hash: sha256-2d52a82565566693
  BP-1130.40.10:
    name: "Costruire pack di disclosure ESG"
    description: "Costruire il pack di disclosure ESG — narrativa, metriche, note a piè di pagina, mapping agli standard."
    source_hash: sha256-83bb85f5f8360240
  BP-1130.40.20:
    name: "Depositare disclosure regolatorie"
    description: "Depositare disclosure ESG / sostenibilità obbligatorie — CSRD/ESRS, SEC clima, tassonomie giurisdizionali."
    source_hash: sha256-7c0fab2067dbeb32
  BP-1130.40.30:
    name: "Pubblicare framework volontari"
    description: "Pubblicare disclosure volontarie — GRI, SASB, TCFD, CDP, ISSB — allineate ai temi materiali."
    source_hash: sha256-bd460ef4e53b9bd9
  BP-1130.50:
    name: "Engagement degli stakeholder"
    description: "Fare engagement con stakeholder — investitori, regolatori, clienti, dipendenti, ONG, comunità — su ESG."
    source_hash: sha256-b4049d33409ffab1
  BP-1130.50.10:
    name: "Engagement con investitori e analisti"
    description: "Fare engagement con investitori focalizzati ESG e agenzie di rating; rispondere a questionari e rating."
    source_hash: sha256-8756d4ffe0961ddf
  BP-1130.50.20:
    name: "Engagement con comunità e ONG"
    description: "Fare engagement con comunità locali, ONG e stakeholder della società civile su impatto e remediation."
    source_hash: sha256-263f7bd55b5594a0
  BP-1130.60:
    name: "Obiettivi di miglioramento"
    description: "Stabilire, tracciare e aggiustare obiettivi di miglioramento — emissioni, sociali, governance — lungo l'orizzonte."
    source_hash: sha256-06b57ef8ea29fa2b
  BP-1130.60.10:
    name: "Stabilire obiettivi di miglioramento"
    description: "Stabilire science-based target e altri obiettivi di miglioramento ESG allineati ad ambizione e temi materiali."
    source_hash: sha256-539bdc8cfd82ce5e
  BP-1130.60.20:
    name: "Tracciare progresso degli obiettivi"
    description: "Tracciare progresso rispetto agli obiettivi lungo il ciclo ESG; far emergere gap e decidere azione correttiva."
    source_hash: sha256-2286ebfa082ad915
