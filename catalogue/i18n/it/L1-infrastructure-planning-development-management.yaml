# Gestione della pianificazione e dello sviluppo infrastrutturale (it) — translations for L1-infrastructure-planning-development-management.yaml
locale: it
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Gestione della pianificazione e dello sviluppo infrastrutturale
    description: |
      Pianificazione di rete e di sistema di lungo periodo, sviluppo di fattibilità e opzioni, acquisizione di terreni e tracciati, autorizzazioni e valutazione ambientale, ed engagement degli stakeholder per sviluppare gli schemi infrastrutturali fino al punto di consegna.
    in_scope:
      - Pianificazione di rete, capacità e spaziale di lungo periodo
      - Studi di fattibilità e sviluppo di opzioni e concept
      - Acquisizione di terreni, tracciati e corridoi e servitù
      - Autorizzazioni urbanistiche e valutazione di impatto ambientale
      - Engagement di stakeholder, comunità e proprietari terrieri
      - Pianificazione di sostenibilità, carbonio e adattamento climatico
    out_of_scope:
      - Sviluppo immobiliare (BC-4900)
      - Esecuzione costruttiva (BC-5040)
      - Permessi operativi e approvazioni regolatorie (BC-5110)
      - Progettazione ingegneristica di dettaglio e produzione BIM
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: Pianificazione di rete e di sistema
    description: |
      Pianificazione di lungo periodo delle reti e dei sistemi infrastrutturali per soddisfare la domanda prevista e i fabbisogni di capacità.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Previsione della domanda
    description: |
      Previsione della domanda e dell'utilizzo di lungo periodo per dimensionare i fabbisogni infrastrutturali futuri.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Pianificazione della capacità di rete
    description: |
      Pianificazione della capacità di rete e di sistema per colmare i divari tra domanda e provvista disponibile.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: Pianificazione spaziale e dei corridoi
    description: |
      Pianificazione spaziale e dei corridoi per riservare i terreni e allineare gli schemi alla politica di uso del suolo.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Master planning
    description: |
      Sviluppo di master plan integrati che coordinano gli schemi su una rete o una regione.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: Sviluppo di fattibilità e opzioni
    description: |
      Valutazione della fattibilità e sviluppo di opzioni e concept per gli schemi infrastrutturali candidati.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Studi di fattibilità
    description: |
      Studi che stabiliscono la fattibilità tecnica, economica e di realizzabilità degli schemi candidati.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Sviluppo delle opzioni
    description: |
      Sviluppo e confronto delle opzioni di schema rispetto a obiettivi e vincoli.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Selezione del concept
    description: |
      Selezione del concept preferito da portare avanti nella progettazione e nella consegna.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Valutazione della costruibilità
    description: |
      Valutazione della costruibilità e del rischio di consegna per definire concept di schema realizzabili.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: Gestione di terreni e tracciati
    description: |
      Selezione e acquisizione di terreni, tracciati e diritti di accesso necessari a realizzare gli schemi infrastrutturali.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: Selezione di tracciati e corridoi
    description: |
      Selezione di tracciati e corridoi che bilanciano costo, impatto e realizzabilità.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: Acquisizione e assemblaggio dei terreni
    description: |
      Acquisizione e assemblaggio delle particelle di terreno necessarie a realizzare uno schema.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: Servitù di passaggio e servitù prediali
    description: |
      Ottenimento di servitù di passaggio, servitù prediali e diritti di accesso su terreni di terzi.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Gestione dell'espropriazione
    description: |
      Gestione dell'espropriazione per pubblica utilità e del relativo indennizzo per assicurare i terreni necessari.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: Autorizzazioni e valutazione ambientale
    description: |
      Ottenimento delle autorizzazioni urbanistiche e completamento delle valutazioni ambientali e del patrimonio per gli schemi infrastrutturali.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Gestione delle autorizzazioni urbanistiche
    description: |
      Gestione delle domande e delle autorizzazioni urbanistiche fino alla determinazione.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Valutazione di impatto ambientale
    description: |
      Valutazione degli impatti ambientali e delle mitigazioni a supporto delle decisioni di autorizzazione.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: Valutazione ecologica e del patrimonio
    description: |
      Valutazione dei vincoli ecologici e del patrimonio che incidono sulla progettazione e sull'autorizzazione dello schema.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Development consent order
    description: |
      Predisposizione e gestione dei development consent order per i grandi schemi infrastrutturali.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: Engagement di stakeholder e comunità
    description: |
      Engagement con comunità, stakeholder e proprietari terrieri per costruire consenso e gestire le opposizioni agli schemi.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Consultazione della comunità
    description: |
      Consultazione delle comunità interessate per informare e orientare le proposte di schema.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: Mappatura ed engagement degli stakeholder
    description: |
      Mappatura ed engagement degli stakeholder lungo il ciclo di vita dello schema.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Gestione delle inchieste pubbliche
    description: |
      Gestione delle inchieste pubbliche e degli esami delle proposte di schema.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: Rapporti con proprietari terrieri e vicini
    description: |
      Rapporti con proprietari terrieri e vicini per risolvere le preoccupazioni e assicurare la cooperazione.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: Pianificazione di sostenibilità e clima
    description: |
      Integrazione di sostenibilità, carbonio e resilienza climatica nella pianificazione e progettazione degli schemi infrastrutturali.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Pianificazione del carbonio whole-life
    description: |
      Pianificazione per ridurre il carbonio whole-life nella progettazione e nella consegna degli schemi.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: Pianificazione della biodiversità e del net gain
    description: |
      Pianificazione per proteggere la biodiversità e realizzare un net gain misurabile.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Pianificazione dell'adattamento climatico
    description: |
      Pianificazione per la resilienza climatica e l'adattamento degli asset infrastrutturali.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Standard di progettazione sostenibile
    description: |
      Adozione di standard di progettazione sostenibile e di framework di rating per gli schemi.
    source_hash: sha256-5942740434ce459c
