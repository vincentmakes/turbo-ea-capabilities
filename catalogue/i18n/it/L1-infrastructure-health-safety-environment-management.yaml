# Gestione di salute, sicurezza e ambiente infrastrutturale (it) — translations for L1-infrastructure-health-safety-environment-management.yaml
locale: it
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Gestione di salute, sicurezza e ambiente infrastrutturale
    description: |
      Gestione di salute, sicurezza e ambiente nella costruzione e nell'esercizio delle infrastrutture, che spazia dai sistemi di gestione HSE, alla sicurezza costruttiva, alla salute occupazionale, alla gestione ambientale, e alla risposta a incidenti ed emergenze. Protegge persone, comunità e ambiente durante la consegna e l'esercizio di opere e asset.
    in_scope:
      - Policy HSE, sistemi di gestione, cultura e competenze
      - Sicurezza costruttiva secondo CDM, permessi e valutazione dei rischi
      - Sorveglianza sanitaria occupazionale, welfare e benessere
      - Controlli ambientali, prevenzione dell'inquinamento e conformità alle autorizzazioni
      - Protezione di ecologia e patrimonio durante i lavori
      - Segnalazione e indagine degli incidenti e risposta alle emergenze
    out_of_scope:
      - Ambiente, salute e sicurezza cross-industry (BC-720)
      - Resilienza e sicurezza operativa (BC-5120)
      - Gestione della qualità costruttiva (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: Sistema di gestione HSE
    description: |
      Policy, standard, cultura e competenze che compongono il sistema di gestione di salute, sicurezza e ambiente.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: Policy e standard HSE
    description: |
      Definizione di policy, standard e obiettivi HSE nelle attività infrastrutturali.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: Sistema di gestione HSE
    description: |
      Esercizio e miglioramento continuo del sistema di gestione HSE certificato.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: Cultura e comportamento della sicurezza
    description: |
      Sviluppo di una cultura della sicurezza positiva e di comportamenti sicuri nella manodopera.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: Competenze e formazione HSE
    description: |
      Assurance delle competenze, della formazione e delle autorizzazioni HSE del personale.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Gestione della sicurezza costruttiva
    description: |
      Gestione del rischio di sicurezza costruttiva attraverso progettazione, controlli di cantiere, permessi e sistemi di lavoro sicuri.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: CDM e gestione del rischio di progettazione
    description: |
      Gestione degli obblighi CDM di progettazione e costruzione e della riduzione del rischio in fase di progettazione.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Gestione della sicurezza di cantiere
    description: |
      Gestione quotidiana dei controlli di sicurezza e della supervisione in cantiere.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Gestione dei permessi di lavoro
    description: |
      Controllo delle attività ad alto rischio attraverso sistemi di permesso di lavoro.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: Method statement e valutazione dei rischi
    description: |
      Predisposizione e controllo dei method statement e delle valutazioni dei rischi delle attività per un'esecuzione sicura.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Gestione della salute occupazionale
    description: |
      Protezione della salute della manodopera attraverso sorveglianza, welfare, igiene e gestione del benessere.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Sorveglianza sanitaria occupazionale
    description: |
      Monitoraggio della salute e dell'idoneità della manodopera rispetto alle esposizioni occupazionali.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Fornitura di welfare
    description: |
      Fornitura di strutture e servizi di welfare per la manodopera di cantiere.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: Monitoraggio di esposizione e igiene
    description: |
      Monitoraggio e controllo delle esposizioni occupazionali e dell'igiene sul luogo di lavoro.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: Gestione di affaticamento e benessere
    description: |
      Gestione di affaticamento, salute mentale e benessere della manodopera.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Gestione ambientale
    description: |
      Gestione degli impatti, dei controlli e delle autorizzazioni ambientali nella costruzione e nell'esercizio.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Controlli ambientali
    description: |
      Implementazione di controlli che limitano l'impatto ambientale di lavori ed esercizio.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Prevenzione dell'inquinamento
    description: |
      Prevenzione e controllo dell'inquinamento di aria, acqua e suolo durante i lavori.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Conformità alle autorizzazioni ambientali
    description: |
      Conformità alle autorizzazioni, ai permessi e alle condizioni di licenza ambientali.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: Protezione di ecologia e patrimonio
    description: |
      Protezione di ecologia, biodiversità e beni del patrimonio interessati dai lavori.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: Gestione di incidenti ed emergenze
    description: |
      Segnalazione, indagine e risposta alle emergenze per gli incidenti HSE, con monitoraggio della performance.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: Segnalazione e indagine degli incidenti
    description: |
      Segnalazione e indagine degli incidenti HSE e dei near miss.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Analisi delle cause profonde
    description: |
      Analisi delle cause sottostanti per prevenire il ripetersi degli incidenti.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Pianificazione della risposta alle emergenze
    description: |
      Pianificazione e prontezza per la risposta alle emergenze su cantieri e asset.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: Monitoraggio della performance HSE
    description: |
      Monitoraggio e reporting della performance HSE e degli indicatori leading.
    source_hash: sha256-fbf0f34769e795c3
