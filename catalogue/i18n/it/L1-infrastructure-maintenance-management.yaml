# Gestione della manutenzione infrastrutturale (it) — translations for L1-infrastructure-maintenance-management.yaml
locale: it
source: L1-infrastructure-maintenance-management.yaml
entries:
  BC-5090:
    name: Gestione della manutenzione infrastrutturale
    description: |
      Esecuzione di ispezioni e manutenzione su asset infrastrutturali attivi, che spazia dalla pianificazione e programmazione della manutenzione, all'ispezione ed esame, all'esecuzione della manutenzione pianificata, alla manutenzione reattiva e di emergenza, e alla performance e ai registri della manutenzione.
    in_scope:
      - Pianificazione, programmazione e allocazione delle risorse dei lavori di manutenzione
      - Ispezione, esame e identificazione dei difetti sugli asset
      - Esecuzione della manutenzione preventiva pianificata e dei rinnovi
      - Riparazione reattiva e di emergenza e risposta ai guasti
      - Registri, backlog e gestione della performance della manutenzione
      - Miglioramento dell'affidabilità a partire dagli insight di manutenzione
    out_of_scope:
      - Manutenzione degli impianti cross-industry (BC-1030)
      - Strategia di asset management (BC-5070)
      - Esercizio della rete (BC-5080)
      - Strategia di rinnovi e manutenzione whole-life (BC-5070.40)
    source_hash: sha256-16e287e0a6c64f65
  BC-5090.10:
    name: Pianificazione e programmazione della manutenzione
    description: |
      Pianificazione e programmazione dei lavori di manutenzione e delle risorse e degli accessi necessari a realizzarli.
    source_hash: sha256-6a3eb19fe0db371f
  BC-5090.10.10:
    name: Pianificazione dei lavori di manutenzione
    description: |
      Pianificazione dello scope, dei metodi e dei requisiti dei lavori di manutenzione prima dell'esecuzione.
    source_hash: sha256-3349241f78e25c26
  BC-5090.10.20:
    name: Programmazione della manutenzione
    description: |
      Programmazione delle attività di manutenzione per bilanciare carico di lavoro, accessi e impatto sul servizio.
    source_hash: sha256-0b7ab11495443950
  BC-5090.10.30:
    name: Allocazione di risorse e squadre
    description: |
      Allocazione di squadre, competenze e risorse ai lavori di manutenzione pianificati.
    source_hash: sha256-e4ba046dbc77eb0a
  BC-5090.10.40:
    name: Pianificazione di interruzioni e possession
    description: |
      Pianificazione delle interruzioni e delle possession che forniscono accesso sicuro per la manutenzione.
    source_hash: sha256-bcd1694386b2e5fd
  BC-5090.20:
    name: Ispezione ed esame
    description: |
      Ispezione ed esame degli asset per identificare i difetti e confermare l'idoneità al servizio.
    source_hash: sha256-1186d613fd065c57
  BC-5090.20.10:
    name: Ispezione di routine
    description: |
      Ispezione di routine degli asset per rilevare difetti emergenti e deterioramento.
    source_hash: sha256-fd47a7ac1aee58a5
  BC-5090.20.20:
    name: Esame di dettaglio
    description: |
      Esame di dettaglio degli asset per valutarne la condizione quando è richiesta un'ispezione più approfondita.
    source_hash: sha256-c78848b64794adad
  BC-5090.20.30:
    name: Identificazione e classificazione dei difetti
    description: |
      Identificazione e classificazione dei difetti per prioritizzare gli interventi correttivi.
    source_hash: sha256-85281da9fca2213a
  BC-5090.20.40:
    name: Ispezione strutturale e di sicurezza
    description: |
      Ispezione strutturale e di sicurezza degli asset per confermarne l'integrità e l'uso sicuro.
    source_hash: sha256-af1c8418f2e03953
  BC-5090.30:
    name: Esecuzione della manutenzione pianificata
    description: |
      Realizzazione della manutenzione preventiva pianificata e dei rinnovi per sostenere condizione e performance degli asset.
    source_hash: sha256-d0a53686779cf2ba
  BC-5090.30.10:
    name: Esecuzione della manutenzione preventiva
    description: |
      Esecuzione della manutenzione preventiva per mantenere gli asset in condizione utilizzabile.
    source_hash: sha256-103353b24e101b23
  BC-5090.30.20:
    name: Esecuzione dei rinnovi pianificati
    description: |
      Esecuzione dei rinnovi pianificati che ripristinano o sostituiscono i componenti degli asset.
    source_hash: sha256-29579b3e2769d2be
  BC-5090.30.30:
    name: Realizzazione dei lavori di manutenzione
    description: |
      Realizzazione dei lavori di manutenzione in cantiere secondo piano, scope e standard.
    source_hash: sha256-3ca5ecc94c9983bf
  BC-5090.30.40:
    name: Assurance della qualità della manutenzione
    description: |
      Assurance che i lavori di manutenzione rispettino gli standard di qualità e sicurezza richiesti.
    source_hash: sha256-3cd6593a8ddac244
  BC-5090.40:
    name: Manutenzione reattiva e di emergenza
    description: |
      Risposta a guasti, difetti ed emergenze che richiedono un intervento di manutenzione non pianificato.
    source_hash: sha256-52593d3ed6d420fe
  BC-5090.40.10:
    name: Risposta a guasti e difetti
    description: |
      Risposta ai guasti e ai difetti segnalati per proteggere servizio e sicurezza.
    source_hash: sha256-4e64aaa0a9b9ca63
  BC-5090.40.20:
    name: Riparazione di emergenza
    description: |
      Esecuzione di riparazioni di emergenza per ripristinare gli asset a seguito di guasto o danno.
    source_hash: sha256-4a094ddcefb8095c
  BC-5090.40.30:
    name: Gestione dei lavori reattivi
    description: |
      Gestione dei lavori di manutenzione reattiva dalla notifica al completamento.
    source_hash: sha256-e30865fd9c368823
  BC-5090.40.40:
    name: Gestione delle riparazioni provvisorie
    description: |
      Gestione delle riparazioni provvisorie che mantengono il servizio in attesa della bonifica definitiva.
    source_hash: sha256-c8ff8367a52a27e3
  BC-5090.50:
    name: Performance e registri della manutenzione
    description: |
      Gestione dei registri, del backlog e della performance della manutenzione per guidare il miglioramento dell'affidabilità.
    source_hash: sha256-185627c67674b9c1
  BC-5090.50.10:
    name: Gestione dei registri di manutenzione
    description: |
      Gestione dei registri di manutenzione che documentano i lavori svolti e la storia dell'asset.
    source_hash: sha256-9b9ac70c40a55939
  BC-5090.50.20:
    name: Gestione del backlog di manutenzione
    description: |
      Gestione del backlog di manutenzione per controllare il rischio e prioritizzare i lavori.
    source_hash: sha256-371afc593fcd989e
  BC-5090.50.30:
    name: Analisi della performance della manutenzione
    description: |
      Analisi della performance della manutenzione rispetto a misure di costo, tempo e qualità.
    source_hash: sha256-3a0f3af4181d9f84
  BC-5090.50.40:
    name: Miglioramento dell'affidabilità
    description: |
      Miglioramento dell'affidabilità degli asset utilizzando gli insight dei dati di manutenzione e guasto.
    source_hash: sha256-4714639f367edd97
metadata:
  translator: claude-ai
  date: "2026-07-16"
