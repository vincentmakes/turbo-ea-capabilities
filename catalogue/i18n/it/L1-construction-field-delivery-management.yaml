# Gestione della costruzione e della consegna in cantiere (it) — translations for L1-construction-field-delivery-management.yaml
locale: it
source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Gestione della costruzione e della consegna in cantiere
    description: |
      Esecuzione in cantiere dei lavori infrastrutturali, che spazia dall'allestimento e mobilitazione del cantiere, alla gestione dei fronti di lavoro e della produzione, alle opere provvisionali, ai macchinari e alle attrezzature, ai materiali e alla logistica di cantiere, e alla qualità costruttiva. La disciplina di consegna sul campo che trasforma progetto e programma in opere costruite in modo sicuro, produttivo e conforme alle specifiche.
    in_scope:
      - Allestimento del cantiere, mobilitazione e fornitura di strutture provvisorie
      - Coordinamento dei fronti di lavoro, sequenziamento della produzione e tracking dell'avanzamento
      - Opere provvisionali inclusi ponteggi, casseforme e sostegno degli scavi
      - Gestione di macchinari, attrezzature e operazioni di sollevamento
      - Call-off dei materiali di cantiere, aree di deposito, logistica e gestione dei rifiuti
      - Controllo qualità costruttivo, ispezione e gestione delle non conformità
    out_of_scope:
      - Gestione della costruzione ingegneristica (BC-1150)
      - Commissioning e handover (BC-1160)
      - Progettazione ingegneristica (BC-1120)
      - Esercizio e manutenzione degli asset permanenti (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: Allestimento e mobilitazione del cantiere
    description: |
      Configurazione e mobilitazione del cantiere, inclusi i campi base, le strutture provvisorie e la connessione di utenze e servizi.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: Configurazione del cantiere e allestimento del campo base
    description: |
      Allestimento di campi base, uffici e aree welfare pronti per le operazioni costruttive.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Pianificazione della mobilitazione
    description: |
      Pianificazione della mobilitazione di risorse, manodopera e attrezzature verso il cantiere.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Fornitura di strutture provvisorie
    description: |
      Fornitura di alloggi provvisori, welfare e strutture di cantiere per la manodopera costruttiva.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: Connessione di utenze e servizi
    description: |
      Connessione dei servizi provvisori di energia, acqua e comunicazioni necessari alle operazioni di cantiere.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: Gestione dei fronti di lavoro e della produzione
    description: |
      Pianificazione, coordinamento e tracking della produzione costruttiva sui fronti di lavoro attivi per sostenere avanzamento e produttività.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: Pianificazione e sequenziamento della produzione
    description: |
      Pianificazione a intervalli brevi e sequenziamento della produzione costruttiva sui fronti di lavoro.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Coordinamento dei fronti di lavoro
    description: |
      Coordinamento di squadre, risorse e accessi sui fronti di lavoro concorrenti.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Operazioni quotidiane di cantiere
    description: |
      Direzione e controllo quotidiani delle operazioni costruttive in cantiere.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: Tracking di avanzamento e produttività
    description: |
      Misurazione dell'avanzamento costruttivo e della produttività della manodopera rispetto al programma.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Gestione delle opere provvisionali
    description: |
      Gestione delle opere provvisionali e dei sistemi di accesso che consentono la costruzione sicura delle opere permanenti.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Coordinamento della progettazione delle opere provvisionali
    description: |
      Coordinamento e controllo della progettazione delle opere provvisionali e del relativo regime di verifica.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: Gestione di ponteggi e accessi
    description: |
      Fornitura e controllo di ponteggi e accessi sicuri per le attività costruttive.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: Gestione di casseforme e centine
    description: |
      Gestione dei sistemi di casseforme e centine a sostegno delle opere in calcestruzzo e strutturali.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: Gestione di scavi e sostegni
    description: |
      Gestione degli scavi e del sostegno provvisorio del terreno per mantenere le opere stabili e sicure.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: Gestione di macchinari e attrezzature
    description: |
      Fornitura, dispiegamento e manutenzione di macchinari e attrezzature costruttive, incluse le operazioni di sollevamento.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Gestione della flotta di macchinari
    description: |
      Gestione della flotta di macchinari costruttivi tra progetti e fronti di lavoro.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: Noleggio e utilizzo delle attrezzature
    description: |
      Reperimento, noleggio e tracking dell'utilizzo delle attrezzature costruttive.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Gestione delle operazioni di sollevamento
    description: |
      Pianificazione e controllo delle operazioni di sollevamento e dell'uso delle gru in cantiere.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: Ispezione e manutenzione dei macchinari
    description: |
      Ispezione e manutenzione di macchinari e attrezzature per sostenere disponibilità e sicurezza.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: Materiali e logistica di cantiere
    description: |
      Consegna, stoccaggio e movimentazione dei materiali costruttivi in cantiere, inclusi logistica e rifiuti.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: Call-off e consegna dei materiali
    description: |
      Call-off e consegna dei materiali costruttivi per rispettare il programma dei lavori.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: Gestione delle aree di deposito e stoccaggio
    description: |
      Gestione delle aree di deposito e dello stoccaggio in cantiere di materiali e componenti.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: Logistica di cantiere e gestione del traffico
    description: |
      Gestione della logistica di cantiere, delle consegne e dei movimenti di veicoli e traffico.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Gestione dei rifiuti da costruzione
    description: |
      Separazione, movimentazione e smaltimento dei rifiuti da costruzione e dei materiali eccedenti.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Gestione della qualità costruttiva
    description: |
      Assurance e controllo della qualità costruttiva per consegnare opere conformi alle specifiche.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: Pianificazione di ispezioni e prove
    description: |
      Pianificazione delle ispezioni e delle prove e dei relativi hold e witness point.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: Controllo e assurance della qualità
    description: |
      Esecuzione dei controlli qualità e dell'assurance nelle attività costruttive.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Gestione delle non conformità
    description: |
      Identificazione, disposizione e chiusura delle non conformità costruttive.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: Snagging e supporto all'handover
    description: |
      Snagging, chiusura dei difetti e supporto all'handover delle opere completate.
    source_hash: sha256-c6fb7d5061da1fe6
