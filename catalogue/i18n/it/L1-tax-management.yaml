    name: Dichiarazioni fiscali sul reddito societario
    description: |
      Predisposizione e presentazione delle dichiarazioni dei redditi societari.
    source_hash: sha256-1a4c7d99cb4fc639
  BC-220.10.30:
    name: Gestione delle ritenute fiscali
    description: |
