# Gestione delle concessioni e dei ricavi (it) — translations for L1-concession-revenue-management.yaml
locale: it
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Gestione delle concessioni e dei ricavi
    description: |
      Gestione di concessioni e partnership pubblico-private, tariffe e pricing, riscossione e assurance dei ricavi, gestione di contributi e sussidi, e partnership commerciali che monetizzano gli asset infrastrutturali lungo la durata della concessione.
    in_scope:
      - Gestione degli accordi di concessione e delle partnership pubblico-private
      - Gestione di tariffe, pedaggi e prezzi regolati
      - Riscossione, assurance e controllo delle perdite di ricavo
      - Amministrazione di contributi, sussidi e availability payment
      - Partnership commerciali e sviluppo di ricavi accessori
      - Monetizzazione dei ricavi da terreni e immobili
    out_of_scope:
      - Gestione del pricing aziendale (BC-450)
      - Strategia di funding e finanziamento degli investimenti (BC-5000)
      - Controllo regolatorio dei prezzi (BC-5110)
      - Tesoreria aziendale e gestione della cassa
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: Gestione di concessioni e PPP
    description: |
      Gestione degli accordi di concessione e delle strutture di partnership pubblico-privata lungo il loro ciclo di vita e le loro obbligazioni.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Gestione dell'accordo di concessione
    description: |
      Amministrazione degli accordi di concessione, dei termini e delle obbligazioni lungo la durata della concessione.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: Strutturazione del PPP
    description: |
      Strutturazione degli accordi di partnership pubblico-privata e della relativa allocazione di rischio e rendimento.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: Meccanismo di availability e pagamento
    description: |
      Progettazione ed esercizio dei meccanismi di availability e pagamento che governano la remunerazione della concessione.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Conformità della concessione
    description: |
      Assurance che le obbligazioni e gli standard di performance della concessione siano rispettati lungo l'accordo.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: Gestione di tariffe e pricing
    description: |
      Definizione e governance di tariffe, pedaggi e prezzi applicati per l'uso e i servizi infrastrutturali.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: Definizione di tariffe e pedaggi
    description: |
      Determinazione di tariffe e pedaggi per l'accesso e l'utilizzo delle infrastrutture.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Strategia di pricing
    description: |
      Definizione della strategia di pricing commerciale per i servizi e la capacità infrastrutturale.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Controllo regolatorio dei prezzi
    description: |
      Gestione dei prezzi nell'ambito dei framework e delle determinazioni di controllo regolatorio dei prezzi.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: Pricing dinamico e da congestione
    description: |
      Applicazione di pricing responsivo alla domanda e basato sulla congestione per gestire utilizzo e ricavi.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: Riscossione e assurance dei ricavi
    description: |
      Riscossione dei ricavi infrastrutturali e assurance che il valore fatturato sia captato e riconciliato con accuratezza.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: Addebito e riscossione
    description: |
      Addebito e riscossione di canoni d'uso, pedaggi e ricavi da servizi dai clienti.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Revenue assurance
    description: |
      Assurance che tutti i ricavi maturati siano fatturati, captati e registrati in modo completo.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Gestione delle perdite di ricavo
    description: |
      Identificazione e recupero di perdite di ricavo, evasione e sotto-riscossione.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: Settlement e riconciliazione
    description: |
      Settlement e riconciliazione dei ricavi riscossi tra sistemi e controparti.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: Gestione di contributi e sussidi
    description: |
      Amministrazione di contributi, sussidi e conferimenti pubblici che finanziano la disponibilità e l'esercizio delle infrastrutture.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: Amministrazione di sussidi e contributi
    description: |
      Amministrazione di sussidi e contributi a supporto dei servizi infrastrutturali.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Gestione degli availability payment
    description: |
      Gestione dei pagamenti basati sulla disponibilità legati alla performance di servizio e asset.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Conformità del finanziamento pubblico
    description: |
      Conformità alle condizioni e al reporting associati al finanziamento pubblico.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Gestione dei conferimenti pubblici
    description: |
      Gestione dei conferimenti pubblici di capitale e di esercizio alle infrastrutture.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Gestione delle partnership commerciali
    description: |
      Sviluppo di ricavi da terzi, accessori e immobiliari attraverso partnership commerciali.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Gestione dei ricavi da terzi
    description: |
      Gestione dei ricavi da accessi, servizi e accordi con terzi.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Gestione delle partnership commerciali
    description: |
      Sviluppo e gestione delle partnership commerciali che generano ricavi infrastrutturali.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Sviluppo di ricavi accessori
    description: |
      Sviluppo di flussi di ricavo accessori e non-core attorno agli asset infrastrutturali.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: Ricavi da terreni e immobili
    description: |
      Monetizzazione delle proprietà fondiarie e immobiliari associate alle infrastrutture.
    source_hash: sha256-4931ef33faa7594b
