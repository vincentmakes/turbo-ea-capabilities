# Gestione del programma di investimenti e dei controlli di progetto (it) — translations for L1-capital-programme-project-controls-management.yaml
locale: it
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Gestione del programma di investimenti e dei controlli di progetto
    description: |
      Governance e controlli lato proprietario e lato consegna per programmi e progetti di investimento infrastrutturale, che spaziano dalla configurazione del programma, al controllo di costi e cronoprogramma, all'earned value, al controllo di rischio e varianti, e all'assurance.
    in_scope:
      - Configurazione, governance e gestione degli stage gate del programma
      - Stima, budgeting, controllo e previsione dei costi
      - Pianificazione, scheduling e analisi del percorso critico
      - Earned value e gestione integrata della performance
      - Controllo di rischio, varianti e contingency di programma
      - Assurance di progetto, gateway review e reporting
    out_of_scope:
      - Gestione di progetti e change aziendali (BC-900/BC-910)
      - Gestione di progetti ingegneristici (BC-1110)
      - Valutazione degli investimenti e decisioni di funding (BC-5000)
      - Esecuzione in cantiere e consegna dei lavori costruttivi
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: Configurazione e governance del programma
    description: |
      Definizione della struttura di programma, del modello di consegna e della governance per controllare l'investimento di capitale attraverso stage gate definiti.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: Definizione e configurazione del programma
    description: |
      Definizione e configurazione dello scope, della struttura e della baseline di controllo del programma.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Selezione del modello di consegna
    description: |
      Selezione del modello di consegna e di organizzazione più adatto al programma.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: Framework di governance e assurance
    description: |
      Definizione del framework di governance e assurance che supervisiona il programma.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Gestione degli stage gate
    description: |
      Gestione degli stage gate che autorizzano l'avanzamento e il rilascio del funding.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: Stima e gestione dei costi
    description: |
      Stima, definizione della baseline e controllo dei costi di programma e progetto lungo il ciclo di vita di consegna.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Stima dei costi
    description: |
      Predisposizione delle stime dei costi nelle classi di stima del ciclo di vita.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Gestione della baseline di budget
    description: |
      Definizione e mantenimento della baseline di costo rispetto alla quale si misura la performance.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: Controllo e previsione dei costi
    description: |
      Controllo e previsione dei costi a finire rispetto alla baseline approvata.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Reporting dei costi
    description: |
      Reporting dello stato dei costi e delle previsioni agli stakeholder di programma e progetto.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: Pianificazione e scheduling
    description: |
      Sviluppo e controllo dei cronoprogrammi di programma e progetto per gestire i tempi e la certezza di consegna.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Sviluppo del cronoprogramma
    description: |
      Sviluppo di cronoprogrammi integrati che coprono le attività di programma e progetto.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Analisi del percorso critico
    description: |
      Analisi dei percorsi critici e degli slack per proteggere le milestone chiave di consegna.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Misurazione dell'avanzamento
    description: |
      Misurazione dell'avanzamento fisico e temporale rispetto alla baseline del cronoprogramma.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Analisi del rischio di cronoprogramma
    description: |
      Analisi probabilistica del rischio di cronoprogramma per verificare la confidenza di consegna.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: Earned value e gestione della performance
    description: |
      Misurazione e reporting integrati della performance di costo e cronoprogramma per prevedere gli esiti del programma.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Earned value management
    description: |
      Integrazione di scope, costo e cronoprogramma per misurare l'earned value e la performance.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: Metriche di performance e KPI
    description: |
      Definizione e tracking delle metriche di performance e dei KPI sull'intero programma.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: Analisi di trend e scostamenti
    description: |
      Analisi di trend e scostamenti per anticipare le deviazioni dal piano.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Reporting integrato della performance
    description: |
      Reporting consolidato dello stato integrato di costo, cronoprogramma e performance.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: Controllo del rischio e delle varianti di programma
    description: |
      Gestione di rischio, varianti, contingency e interfacce di programma per proteggere gli esiti di consegna.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Gestione del rischio di programma
    description: |
      Identificazione, valutazione e trattamento dei rischi sull'intero programma.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Controllo delle varianti
    description: |
      Controllo delle varianti di scope e baseline attraverso un processo di change disciplinato.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: Gestione di contingency e riserve
    description: |
      Gestione delle contingency e delle riserve rispetto all'esposizione al rischio quantificata.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: Gestione di interfacce e dipendenze
    description: |
      Gestione delle interfacce e delle dipendenze tra progetti e stakeholder.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: Assurance e reporting di progetto
    description: |
      Assurance indipendente, apprendimento e reporting per confermare lo stato di salute del programma e la realizzazione dei benefici.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: Assurance di progetto e gateway review
    description: |
      Assurance indipendente e gateway review della prontezza di programma e progetto.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Gestione delle lezioni apprese
    description: |
      Acquisizione e applicazione delle lezioni apprese lungo il ciclo di vita del programma.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Reporting del programma
    description: |
      Reporting dello stato del programma a board, sponsor e organi di supervisione.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Tracking della realizzazione dei benefici
    description: |
      Tracking della realizzazione dei benefici rispetto al business case del programma.
    source_hash: sha256-de6ea1cd05c875b0
