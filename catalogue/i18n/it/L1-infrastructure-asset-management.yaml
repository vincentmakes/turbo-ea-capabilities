# Gestione degli asset infrastrutturali (it) — translations for L1-infrastructure-asset-management.yaml
locale: it
source: L1-infrastructure-asset-management.yaml
entries:
  BC-5070:
    name: Gestione degli asset infrastrutturali
    description: |
      Gestione dell'intero ciclo di vita degli asset infrastrutturali secondo ISO 55000, che spazia dalla strategia e pianificazione dell'asset management, al registro e alla base informativa degli asset, alla valutazione di condizione e performance, alla strategia di manutenzione e rinnovo, al rischio e criticità degli asset, e al ciclo di vita e dismissione.
    in_scope:
      - Strategia, policy e pianificazione dell'asset management allineate agli obiettivi aziendali
      - Registro, gerarchia e gestione della qualità delle informazioni degli asset
      - Valutazione di condizione, performance e vita residua degli asset
      - Strategia di manutenzione e rinnovo e modellazione del costo whole-life
      - Rischio, criticità e prioritizzazione degli interventi sugli asset
      - Ottimizzazione del valore del ciclo di vita, decommissioning e dismissione
    out_of_scope:
      - Gestione degli asset fisici cross-industry (BC-1040)
      - Manutenzione degli impianti (BC-1030)
      - Esecuzione della manutenzione (BC-5090)
      - Esercizio e controllo della rete attiva (BC-5080)
    source_hash: sha256-ff71cdfe8c3f3de2
  BC-5070.10:
    name: Strategia e pianificazione dell'asset management
    description: |
      Definizione della strategia, degli obiettivi e dei piani di asset management che allineano le decisioni sugli asset agli obiettivi organizzativi.
    source_hash: sha256-cb48a4e3ad61ef68
  BC-5070.10.10:
    name: Policy di asset management e SAMP
    description: |
      Definizione della policy di asset management e del piano strategico di asset management (SAMP) che indirizzano il parco asset.
    source_hash: sha256-4efc0bc3b4065e29
  BC-5070.10.20:
    name: Obiettivi di asset management
    description: |
      Definizione di obiettivi di asset management misurabili derivati dagli obiettivi organizzativi e dalle aspettative degli stakeholder.
    source_hash: sha256-d047fa7f6fb972a5
  BC-5070.10.30:
    name: Allineamento della line-of-sight
    description: |
      Allineamento delle decisioni e delle attività sugli asset alla strategia attraverso una chiara line-of-sight dagli obiettivi alla consegna.
    source_hash: sha256-6cfd9b4f6132b0eb
  BC-5070.10.40:
    name: Pianificazione dell'asset management
    description: |
      Sviluppo dei piani di asset management che traducono la strategia in attività definite e impegni di risorse.
    source_hash: sha256-fd8ba34b64a99758
  BC-5070.20:
    name: Registro e informazioni degli asset
    description: |
      Mantenimento di un registro degli asset affidabile e di una base informativa che sostiene le decisioni di asset management.
    source_hash: sha256-5490b84e55347d2a
  BC-5070.20.10:
    name: Gestione del registro degli asset
    description: |
      Mantenimento di un registro completo e accurato degli asset e dei loro attributi sull'intero patrimonio.
    source_hash: sha256-6d722217a5f0ac49
  BC-5070.20.20:
    name: Gerarchia e classificazione degli asset
    description: |
      Strutturazione degli asset in gerarchie e classificazioni coerenti a supporto di analisi e reporting.
    source_hash: sha256-9e987c11d892100d
  BC-5070.20.30:
    name: Qualità dei dati degli asset
    description: |
      Assurance della completezza, accuratezza e aggiornamento dei dati degli asset sull'intera base informativa.
    source_hash: sha256-f89ea51d1babb241
  BC-5070.20.40:
    name: Standard informativi degli asset
    description: |
      Definizione degli standard e dei requisiti informativi degli asset che governano l'acquisizione e lo scambio dei dati.
    source_hash: sha256-aef275138b49f44b
  BC-5070.30:
    name: Valutazione di condizione e performance
    description: |
      Valutazione della condizione, della performance e della vita residua degli asset per orientare le decisioni di intervento e investimento.
    source_hash: sha256-c07df052d056fc4d
  BC-5070.30.10:
    name: Monitoraggio della condizione
    description: |
      Monitoraggio della condizione degli asset per rilevare il deterioramento e orientare le decisioni di manutenzione e rinnovo.
    source_hash: sha256-3199e2eb959c8862
  BC-5070.30.20:
    name: Regime di ispezione degli asset
    description: |
      Definizione ed esercizio del regime di ispezione che stabilisce la condizione degli asset nel tempo.
    source_hash: sha256-4d15d9676a325be7
  BC-5070.30.30:
    name: Analisi della performance
    description: |
      Analisi della performance degli asset rispetto agli standard attesi e ai requisiti di servizio.
    source_hash: sha256-09be7cb7fb9b41f6
  BC-5070.30.40:
    name: Valutazione della vita residua
    description: |
      Valutazione della vita utile residua a supporto della tempistica dei rinnovi e della pianificazione degli investimenti.
    source_hash: sha256-61a54a779682dd8a
  BC-5070.40:
    name: Strategia di manutenzione e rinnovo
    description: |
      Sviluppo della strategia di manutenzione e rinnovo che ottimizza gli interventi sull'intero ciclo di vita dell'asset.
    source_hash: sha256-13b358ae5b73230a
  BC-5070.40.10:
    name: Sviluppo della strategia di manutenzione
    description: |
      Sviluppo di strategie di manutenzione che bilanciano costo, rischio e performance tra le tipologie di asset.
    source_hash: sha256-13a334f6b0cc4bf6
  BC-5070.40.20:
    name: Pianificazione di rinnovi e sostituzioni
    description: |
      Pianificazione dei rinnovi e delle sostituzioni per sostenere il servizio degli asset nel lungo termine.
    source_hash: sha256-a42bf68efe800c10
  BC-5070.40.30:
    name: Ottimizzazione degli interventi
    description: |
      Ottimizzazione della tempistica e del tipo di intervento per massimizzare il valore da manutenzione e rinnovi.
    source_hash: sha256-0bdf9c3f4fba162e
  BC-5070.40.40:
    name: Modellazione del costo whole-life
    description: |
      Modellazione dei costi whole-life per orientare i trade-off di manutenzione, rinnovo e investimento.
    source_hash: sha256-1d8e18229d67f995
  BC-5070.50:
    name: Rischio e criticità degli asset
    description: |
      Valutazione del rischio e della criticità degli asset per concentrare gli interventi sugli asset più rilevanti per servizio e sicurezza.
    source_hash: sha256-5648edaf25a3143a
  BC-5070.50.10:
    name: Valutazione della criticità degli asset
    description: |
      Valutazione della criticità degli asset per la continuità del servizio, la sicurezza e gli obiettivi organizzativi.
    source_hash: sha256-9df9330d24dddb32
  BC-5070.50.20:
    name: Analisi dei modi di guasto
    description: |
      Analisi dei modi di guasto degli asset e delle conseguenze per orientare le decisioni di rischio e manutenzione.
    source_hash: sha256-17bc85747541a823
  BC-5070.50.30:
    name: Prioritizzazione degli interventi basata sul rischio
    description: |
      Prioritizzazione degli interventi sulla base del rischio e della criticità degli asset.
    source_hash: sha256-3688db42b4cc5c95
  BC-5070.50.40:
    name: Valutazione della resilienza degli asset
    description: |
      Valutazione della resilienza degli asset a pericoli e stress che minacciano la continuità del servizio.
    source_hash: sha256-4924a98f4d041977
  BC-5070.60:
    name: Ciclo di vita e dismissione degli asset
    description: |
      Gestione degli asset nella fase avanzata di vita, decommissioning e dismissione per massimizzare il valore e gli esiti di sostenibilità.
    source_hash: sha256-05b0594a435070dd
  BC-5070.60.10:
    name: Ottimizzazione del valore del ciclo di vita
    description: |
      Ottimizzazione del valore generato dagli asset lungo l'intero ciclo di vita.
    source_hash: sha256-778175117807d49e
  BC-5070.60.20:
    name: Pianificazione del decommissioning
    description: |
      Pianificazione del decommissioning sicuro e ordinato degli asset a fine vita.
    source_hash: sha256-a079a535759c0c43
  BC-5070.60.30:
    name: Gestione della dismissione degli asset
    description: |
      Gestione della dismissione, del trasferimento e del ritiro degli asset in linea con policy e obblighi.
    source_hash: sha256-5a236bad8ace26bd
  BC-5070.60.40:
    name: Sostenibilità e circolarità
    description: |
      Integrazione degli esiti di sostenibilità ed economia circolare nelle decisioni di ciclo di vita e dismissione degli asset.
    source_hash: sha256-a30b5016384602a1
