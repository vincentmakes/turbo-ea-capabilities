    source_hash: sha256-f9ef3b94790b2379
  BC-1250.20:
    name: Gestione delle previsioni MET
    description: |
      TAF, previsioni d'area, SIGMET, AIRMET, GAMET.
    source_hash: sha256-1c7da79b4e6a0641
  BC-1250.20.10:
