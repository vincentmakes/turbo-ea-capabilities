locale: fr
source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Gestion de la construction et de la livraison sur chantier
    description: |
      Exécution sur chantier des travaux d'infrastructure, couvrant l'installation et
      la mobilisation du chantier, la gestion des fronts de travail et de la
      production, les travaux temporaires, les engins et équipements, les matériaux et
      la logistique de chantier, et la qualité de la construction. Discipline de
      livraison sur le terrain qui transforme la conception et le programme en
      ouvrages construits en toute sécurité, de manière productive et conforme aux
      spécifications.
    in_scope:
      - Installation, mobilisation du chantier et fourniture d'installations temporaires
      - Coordination des fronts de travail, séquencement de la production et suivi de l'avancement
      - Travaux temporaires incluant échafaudages, coffrages et soutènement des fouilles
      - Gestion des engins, des équipements et des opérations de levage
      - Approvisionnement, aires de stockage, logistique et gestion des déchets de chantier
      - Contrôle qualité de la construction, inspection et gestion des non-conformités
    out_of_scope:
      - Gestion de la construction en ingénierie (BC-1150)
      - Mise en service et remise (BC-1160)
      - Ingénierie de conception (BC-1120)
      - Exploitation et maintenance des actifs permanents (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: "Installation et mobilisation du chantier"
    description: |
      Mise en place et mobilisation du chantier de construction, incluant les bases de
      vie, les installations temporaires et le raccordement des réseaux et services.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: "Aménagement du chantier et établissement de la base de vie"
    description: |
      Établissement des bases de vie, bureaux et zones d'accueil du chantier prêts
      pour les opérations de construction.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Planification de la mobilisation
    description: |
      Planification de la mobilisation des ressources, de la main-d'œuvre et des
      équipements sur le chantier de construction.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Fourniture d'installations temporaires
    description: |
      Fourniture d'hébergements, d'installations d'accueil et d'équipements de
      chantier temporaires pour la main-d'œuvre de construction.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: "Raccordement des réseaux et services"
    description: |
      Raccordement des services temporaires d'électricité, d'eau et de communications
      nécessaires aux opérations de chantier.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: "Gestion des fronts de travail et de la production"
    description: |
      Planification, coordination et suivi de la production de construction sur les
      fronts de travail actifs pour maintenir l'avancement et la productivité.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: "Planification et séquencement de la production"
    description: |
      Planification à courte échéance et séquencement de la production de construction
      sur les fronts de travail.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Coordination des fronts de travail
    description: |
      Coordination des corps de métier, des ressources et des accès sur les fronts de
      travail concurrents.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Opérations quotidiennes de chantier
    description: |
      Direction et contrôle au jour le jour des opérations de construction sur le
      chantier.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: "Suivi de l'avancement et de la productivité"
    description: |
      Mesure de l'avancement de la construction et de la productivité de la
      main-d'œuvre au regard du programme.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Gestion des travaux temporaires
    description: |
      Gestion des travaux temporaires et des systèmes d'accès qui permettent la
      construction sûre des ouvrages permanents.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Coordination de la conception des travaux temporaires
    description: |
      Coordination et contrôle de la conception des travaux temporaires et de son
      régime de vérification.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: "Gestion des échafaudages et des accès"
    description: |
      Fourniture et contrôle des échafaudages et des accès sécurisés pour les
      activités de construction.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: "Gestion des coffrages et étaiements"
    description: |
      Gestion des systèmes de coffrage et d'étaiement soutenant les ouvrages en béton
      et structurels.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: "Gestion des fouilles et du soutènement"
    description: |
      Gestion des fouilles et du soutènement temporaire des terrains pour maintenir la
      stabilité et la sécurité des ouvrages.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: "Gestion des engins et équipements"
    description: |
      Fourniture, déploiement et entretien des engins et équipements de construction,
      incluant les opérations de levage.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Gestion du parc d'engins
    description: |
      Gestion du parc d'engins de construction à travers les projets et les fronts de
      travail.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: "Location et utilisation des équipements"
    description: |
      Sourcing, location et suivi de l'utilisation des équipements de construction.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Gestion des opérations de levage
    description: |
      Planification et contrôle des opérations de levage et de l'utilisation des grues
      sur chantier.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: "Inspection et maintenance des engins"
    description: |
      Inspection et maintenance des engins et équipements pour maintenir la
      disponibilité et la sécurité.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: "Matériaux et logistique de chantier"
    description: |
      Livraison, stockage et mouvement des matériaux de construction sur chantier,
      incluant la logistique et les déchets.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: "Approvisionnement et livraison des matériaux"
    description: |
      Approvisionnement et livraison des matériaux de construction pour répondre au
      programme des travaux.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: "Gestion des aires de stockage"
    description: |
      Gestion des aires de dépôt et du stockage sur site des matériaux et composants.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: "Logistique de chantier et gestion du trafic"
    description: |
      Gestion de la logistique de chantier, des livraisons et des mouvements de
      véhicules et de circulation.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Gestion des déchets de construction
    description: |
      Tri, manutention et élimination des déchets de construction et des matériaux
      excédentaires.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Gestion de la qualité de la construction
    description: |
      Assurance et contrôle de la qualité de la construction pour livrer des ouvrages
      conformes aux spécifications.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: "Planification des inspections et essais"
    description: |
      Planification des inspections et essais et de leurs points d'arrêt et de
      contrôle.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: "Contrôle et assurance qualité"
    description: |
      Réalisation des contrôles qualité et de l'assurance sur les activités de
      construction.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Gestion des non-conformités
    description: |
      Identification, traitement et clôture des non-conformités de construction.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: "Levée des réserves et appui à la remise"
    description: |
      Levée des réserves, clôture des défauts et appui à la remise des ouvrages
      achevés.
    source_hash: sha256-c6fb7d5061da1fe6
