    name: Pose des étiquettes
    description: |
      Application des étiquettes et des marques de sérialisation.
    source_hash: sha256-15b70e5f87944dfd
  BC-1550.40.40:
    name: Personnalisation en fin de ligne
    description: |
      Personnalisation en fin de ligne et conditionnement spécifique par pays.
    source_hash: sha256-fc7d845639884633
  BC-1550.50:
