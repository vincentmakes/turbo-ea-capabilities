    name: Exécution des dossiers de lot
    description: |
      Exécution des dossiers de lot papier ou électroniques.
    source_hash: sha256-c57777dd03e1e574
  BC-1550.70.20:
    name: Prélèvements pour les contrôles en cours de fabrication
    description: |
      Prélèvements et analyses des contrôles en cours de fabrication.
    source_hash: sha256-77110f63803e987b
  BC-1550.70.30:
    name: Dégagement de ligne de production
    description: |
      Opérations de dégagement de ligne et de changement de production.
    source_hash: sha256-27c08b1172a30b75
  BC-1550.70.40:
    name: Formation BPF des opérateurs
    description: |
      Formation et qualification BPF des opérateurs de fabrication.
    source_hash: sha256-1f6705b6caaa9f35
