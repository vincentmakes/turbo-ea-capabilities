    name: Qualification des équipements
    description: |
      Qualification IQ, OQ, PQ des équipements BPF.
    source_hash: sha256-28f5b1615e8eb612
  BC-1550.50.30:
    name: Validation du nettoyage
    description: |
      Validation du nettoyage lors des changements de produit.
    source_hash: sha256-636b3906955f748c
  BC-1550.50.40:
    name: Validation des systèmes informatisés
    description: |
      Validation des systèmes informatisés selon GAMP 5 et 21 CFR Part 11.
    source_hash: sha256-4ff58d47a9f61240
  BC-1550.60:
