      Vérification de la disponibilité du site receveur pour le transfert de technologie.
    source_hash: sha256-997a0e7512d39b30
  BC-1550.70:
    name: Gestion des opérations de production BPF
    description: |
      Production BPF quotidienne et exécution des dossiers de lot.
    source_hash: sha256-54d974ba84c89d4e
