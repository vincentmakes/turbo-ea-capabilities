    name: Opérations de conditionnement primaire
    description: |
      Conditionnement primaire des produits pharmaceutiques.
    source_hash: sha256-b7d423a531a48694
  BC-1550.40.20:
    name: Opérations de conditionnement secondaire
    description: |
      Conditionnement secondaire, mise en boîte et regroupement.
    source_hash: sha256-4b5aeab65a2a161f
