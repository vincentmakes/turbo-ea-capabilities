locale: fr
source: L1-pharmaceutical-manufacturing-management.yaml
entries:
  BC-1550:
    name: Gestion de la fabrication pharmaceutique
    description: |
      Fabrication conforme aux BPF de substances actives et de produits finis.
    source_hash: sha256-b9a924e576dac936
  BC-1550.10:
    name: Gestion de la fabrication des substances actives
    description: |
      Fabrication des substances pharmaceutiques actives.
    source_hash: sha256-156ec81e2e533637
  BC-1550.10.10:
    name: Synthèse des petites molécules
    description: |
      Synthèse des substances actives pharmaceutiques de petites molécules.
    source_hash: sha256-167ab0bcb34ca2dd
  BC-1550.10.20:
    name: Production des substances actives biologiques
    description: |
      Production de substances actives biologiques par culture cellulaire et fermentation.
    source_hash: sha256-abe211d250c62135
  BC-1550.10.30:
    name: Purification des substances actives
    description: |
      Purification en aval des substances pharmaceutiques actives.
    source_hash: sha256-933d0a83d7607609
  BC-1550.20:
    name: Gestion de la fabrication des produits finis
    description: |
      Fabrication des produits finis : comprimés, gélules, liquides et biologiques.
    source_hash: sha256-acf13a096fbb0668
  BC-1550.20.10:
    name: Fabrication des formes solides
    description: |
      Opérations de fabrication de comprimés et de gélules.
    source_hash: sha256-08e86b4913a6ff9d
  BC-1550.20.20:
    name: Fabrication des formes liquides et semi-solides
    description: |
      Fabrication des formes liquides, suspensions et semi-solides.
    source_hash: sha256-963e54f251bad1f2
  BC-1550.20.30:
    name: Remplissage et finition des produits biologiques
    description: |
      Opérations de remplissage et de finition des produits biologiques.
    source_hash: sha256-4782ccb0001622ac
  BC-1550.20.40:
    name: Fabrication des formes inhalées et spéciales
    description: |
      Fabrication des formes inhalées, transdermiques et des formes spéciales.
    source_hash: sha256-465b10db871dc321
  BC-1550.30:
    name: Gestion de la fabrication stérile
    description: |
      Fabrication aseptique et par stérilisation terminale.
    source_hash: sha256-aba5e34f565c9e72
  BC-1550.30.10:
    name: Opérations de remplissage aseptique
    description: |
      Remplissage aseptique conforme aux exigences de l'Annexe 1.
    source_hash: sha256-8e5486b83577c5d7
