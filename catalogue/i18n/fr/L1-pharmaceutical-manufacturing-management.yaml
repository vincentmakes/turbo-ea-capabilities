    name: Opérations de stérilisation terminale
    description: |
      Traitement par stérilisation terminale.
    source_hash: sha256-e21c02547d90a58e
  BC-1550.30.30:
    name: Opérations en salle propre
    description: |
      Exploitation des salles propres classifiées et surveillance environnementale.
    source_hash: sha256-49ea95c0d4cfeb7d
  BC-1550.40:
    name: Gestion du conditionnement et de l'étiquetage
    description: |
      Conditionnement primaire et secondaire, opérations d'étiquetage.
    source_hash: sha256-bc67daaae48975dc
