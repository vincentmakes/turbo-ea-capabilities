locale: fr
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Gestion des concessions et des revenus
    description: |
      Gestion des concessions et des partenariats public-privé, tarification et
      détermination des prix, collecte et assurance des revenus, gestion des subventions
      et aides, et partenariats commerciaux qui monétisent les actifs d'infrastructure sur
      la durée de la concession.
    in_scope:
      - Gestion des accords de concession et des partenariats public-privé
      - Gestion des tarifs, des péages et des prix réglementés
      - Collecte, assurance des revenus et contrôle des fuites
      - Administration des subventions, aides et paiements de disponibilité
      - Partenariats commerciaux et développement de revenus annexes
      - Monétisation des revenus fonciers et immobiliers
    out_of_scope:
      - Gestion de la tarification d'entreprise (BC-450)
      - Stratégie de financement des investissements (BC-5000)
      - Contrôle réglementaire des prix (BC-5110)
      - Trésorerie d'entreprise et gestion de la trésorerie
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: "Gestion des concessions et des PPP"
    description: |
      Gestion des accords de concession et des structures de partenariat public-privé sur
      leur cycle de vie et leurs obligations.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Gestion des accords de concession
    description: |
      Administration des accords de concession, de leurs termes et obligations sur la durée
      de la concession.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: Structuration des PPP
    description: |
      Structuration des arrangements de partenariat public-privé et de leur allocation des
      risques et rémunérations.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: "Mécanisme de disponibilité et de paiement"
    description: |
      Conception et opération des mécanismes de disponibilité et de paiement qui régissent
      la rémunération de la concession.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Conformité de la concession
    description: |
      Assurance que les obligations et normes de performance de la concession sont
      respectées tout au long de l'accord.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: "Gestion des tarifs et des prix"
    description: |
      Établissement et gouvernance des tarifs, péages et prix facturés pour l'usage et les
      services d'infrastructure.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: "Fixation des tarifs et péages"
    description: |
      Détermination des tarifs et péages pour l'accès et l'usage de l'infrastructure.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Stratégie de tarification
    description: |
      Définition de la stratégie de tarification commerciale pour les services et la
      capacité d'infrastructure.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Contrôle réglementaire des prix
    description: |
      Gestion des prix dans le cadre des dispositifs et déterminations de contrôle
      réglementaire des prix.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: "Tarification dynamique et de congestion"
    description: |
      Application d'une tarification sensible à la demande et fondée sur la congestion pour
      gérer l'utilisation et les revenus.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: "Collecte et assurance des revenus"
    description: |
      Collecte des revenus d'infrastructure et assurance que la valeur facturée est captée
      et rapprochée avec exactitude.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: "Facturation et collecte"
    description: |
      Facturation et collecte des frais d'usage, péages et revenus de service auprès des
      clients.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Assurance des revenus
    description: |
      Assurance que tous les revenus acquis sont facturés, captés et enregistrés de manière
      complète.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Gestion des fuites de revenus
    description: |
      Identification et recouvrement des fuites de revenus, de l'évasion et de la
      sous-perception.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: "Règlement et rapprochement"
    description: |
      Règlement et rapprochement des revenus collectés à travers les systèmes et les
      contreparties.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: "Gestion des subventions et aides"
    description: |
      Administration des subventions, aides et contributions publiques qui financent la
      disponibilité et l'exploitation de l'infrastructure.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: "Administration des subventions et aides"
    description: |
      Administration des subventions et aides soutenant les services d'infrastructure.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Gestion des paiements de disponibilité
    description: |
      Gestion des paiements fondés sur la disponibilité liés à la performance du service et
      des actifs.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Conformité du financement public
    description: |
      Conformité aux conditions et au reporting attachés au financement public.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Gestion des contributions publiques
    description: |
      Gestion des contributions publiques en capital et en exploitation à l'infrastructure.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Gestion des partenariats commerciaux
    description: |
      Développement de revenus tiers, annexes et immobiliers par des partenariats
      commerciaux.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Gestion des revenus tiers
    description: |
      Gestion des revenus issus des accès, services et arrangements avec des tiers.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Gestion des partenariats commerciaux
    description: |
      Développement et gestion des partenariats commerciaux qui génèrent des revenus
      d'infrastructure.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Développement des revenus annexes
    description: |
      Développement de flux de revenus annexes et non essentiels autour des actifs
      d'infrastructure.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: "Revenus fonciers et immobiliers"
    description: |
      Monétisation des avoirs fonciers et immobiliers associés à l'infrastructure.
    source_hash: sha256-4931ef33faa7594b
metadata:
