locale: fr
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Gestion de l'ingénierie numérique et de l'information sur les actifs
    description: |
      Ingénierie numérique et information structurée sur les actifs à travers le cycle
      de vie de l'actif bâti, couvrant la modélisation des données du bâtiment, le
      CDE, l'intégration 4D et 5D, la gestion des données géospatiales et de levé, et
      la gestion des jumeaux numériques et de l'information sur les actifs. Transforme
      les modèles et les données en un actif informationnel de confiance, de la
      conception à la construction et l'exploitation.
    in_scope:
      - Stratégie BIM, normes et coordination des modèles et détection des conflits
      - Environnement commun de données (CDE) et gestion des exigences d'information
      - Séquencement 4D de la construction et intégration 5D des coûts
      - Gestion des données géospatiales, de levé et de capture de la réalité
      - Développement de jumeaux numériques et intégration des données opérationnelles
      - Remise structurée de l'information à travers le cycle de vie de l'actif
    out_of_scope:
      - Gestion documentaire d'ingénierie (BC-1130)
      - Gestion du cycle de vie des produits (BC-820)
      - Gestion de l'information et des données d'entreprise (BC-610)
      - Livraison de plateformes et d'applications informatiques (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: Gestion BIM
    description: |
      Stratégie, normes et coordination de la modélisation des données du bâtiment à
      travers les projets et les disciplines.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: "Stratégie et normes BIM"
    description: |
      Définition de la stratégie, des normes et des protocoles d'information BIM.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: Planification de l'exécution BIM
    description: |
      Planification de l'exécution BIM, des rôles et des livrables pour un projet.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Coordination de la production des modèles
    description: |
      Coordination de la production des modèles par discipline selon les normes et
      calendriers convenus.
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: "Fédération des modèles et détection des conflits"
    description: |
      Fédération des modèles par discipline et détection et résolution des conflits.
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: Environnement commun de données
    description: |
      Gestion de l'environnement d'information partagé et des exigences, du contrôle
      et de l'échange des données de projet.
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: Gestion de l'environnement commun de données
    description: |
      Exploitation du CDE comme source unique de l'information de projet.
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: Gestion des exigences d'information
    description: |
      Définition et gestion des exigences d'information organisationnelles, d'actif et
      d'échange.
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: "Contrôle des documents et des données"
    description: |
      Contrôle, versionnage et gestion du statut des documents et des données.
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: "Échange de données et interopérabilité"
    description: |
      Échange d'information entre systèmes à l'aide de formats ouverts et
      interopérables.
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: "Intégration 4D et 5D"
    description: |
      Intégration des modèles avec le programme et les coûts pour soutenir le
      séquencement de la construction et l'analyse des quantités et des coûts.
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: "Séquencement 4D de la construction"
    description: |
      Liaison des modèles au programme pour visualiser et planifier les séquences de
      construction.
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: "Intégration 5D des coûts"
    description: |
      Intégration des données du modèle avec les coûts pour soutenir l'estimation et
      le contrôle des coûts.
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: Métrés à partir du modèle
    description: |
      Dérivation des quantités directement à partir des modèles coordonnés.
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: Coordination conception-construction
    description: |
      Coordination de l'information du modèle de la conception vers la livraison de la
      construction.
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: "Gestion géospatiale et des levés"
    description: |
      Gestion des données géospatiales, de levé et de sol qui sous-tendent la
      conception et la construction.
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: Gestion des données géospatiales
    description: |
      Gestion des données géospatiales et cartographiques à travers le parc d'actifs.
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: "Levé et implantation"
    description: |
      Fourniture du contrôle de levé et de l'implantation des travaux de construction.
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: "Capture de la réalité et numérisation"
    description: |
      Capture des conditions telles que construites par numérisation et techniques de
      capture de la réalité.
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: Gestion des données géotechniques
    description: |
      Gestion des données géotechniques et d'investigation des sols.
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: "Jumeau numérique et données d'actif"
    description: |
      Développement de modèles d'information sur les actifs et de jumeaux numériques
      alimentés par les données opérationnelles de l'actif en exploitation.
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: Gestion du modèle d'information sur l'actif
    description: |
      Gestion du modèle d'information sur l'actif pour l'actif en exploitation.
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: Développement de jumeaux numériques
    description: |
      Développement et maintenance des jumeaux numériques des actifs d'infrastructure.
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: Intégration des données opérationnelles
    description: |
      Intégration des données opérationnelles et de capteurs dans l'information sur
      les actifs et les jumeaux.
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: Remise de l'information
    description: |
      Remise structurée de l'information sur l'actif de la livraison vers
      l'exploitation.
    source_hash: sha256-d849483d22283722
