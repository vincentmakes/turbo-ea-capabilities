locale: fr
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Gestion des achats et des contrats d'infrastructure
    description: |
      Stratégie d'achat, appels d'offres et administration des contrats pour la
      livraison d'infrastructure, incluant la gestion commerciale et d'économie de la
      construction, les variations et réclamations, et la gestion des sous-traitants
      et de la chaîne d'approvisionnement.
    in_scope:
      - Stratégie d'achat, découpage en lots et sélection des voies contractuelles
      - Appels d'offres, gestion des offres et préqualification
      - Formation, administration des contrats et certification des paiements
      - Gestion commerciale, d'économie de la construction et de la valorisation
      - Gestion des variations, des événements de compensation et des réclamations
      - Achats et performance des sous-traitants et de la chaîne d'approvisionnement
    out_of_scope:
      - Achats d'entreprise (BC-500)
      - Appels d'offres et estimation d'ingénierie (BC-1140)
      - Gestion de la relation fournisseurs (BC-510)
      - Exécution des travaux de construction et livraison sur chantier
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: "Stratégie d'achat et découpage en lots"
    description: |
      Définition de la stratégie d'achat, du découpage des travaux en lots et des
      voies contractuelles pour la livraison d'infrastructure.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Définition de la stratégie d'achat
    description: |
      Définition de la stratégie d'achat alignée sur les objectifs du programme et la
      capacité du marché.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Définition des lots de travaux
    description: |
      Structuration des travaux en lots adaptés aux besoins du marché et de la
      livraison.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Sélection de la voie contractuelle
    description: |
      Sélection des voies et formes contractuelles appropriées à chaque lot.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Engagement du marché fournisseurs
    description: |
      Engagement précoce avec le marché fournisseurs pour façonner et tester les
      approches d'achat.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: "Appels d'offres et gestion des offres"
    description: |
      Préparation, évaluation et attribution des appels d'offres pour les travaux et
      services d'infrastructure.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Préparation des appels d'offres
    description: |
      Préparation des dossiers et exigences d'appel d'offres en vue de leur diffusion
      au marché.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: "Élaboration et soumission de l'offre"
    description: |
      Élaboration et soumission d'offres conformes et compétitives lorsqu'on agit en
      tant que soumissionnaire.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: "Évaluation et attribution des offres"
    description: |
      Évaluation des offres et attribution des contrats au regard de critères
      définis.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Gestion de la préqualification
    description: |
      Gestion de la préqualification des fournisseurs et des listes de sélection.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Administration des contrats
    description: |
      Administration des contrats d'infrastructure de la formation aux obligations, au
      paiement et à la gouvernance.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Formation des contrats
    description: |
      Formation et signature des contrats et de leurs accords de soutien.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Gestion des obligations contractuelles
    description: |
      Gestion des obligations, notifications et livrables contractuels tout au long de
      la livraison.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Certification des paiements
    description: |
      Certification des paiements dus selon les termes du contrat.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Gouvernance des contrats
    description: |
      Gouvernance de la performance, de la conformité et de la clôture des contrats.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: "Gestion commerciale et économie de la construction"
    description: |
      Gestion commerciale et d'économie de la construction de la mesure, de la
      valorisation et des coûts sur l'ensemble du contrat.
    source_hash: sha256-52e406bd028f6bfa
  BC-5030.40.10:
    name: "Économie de la construction et métrés"
    description: |
      Mesure et quantification des travaux pour étayer la valorisation et le paiement.
    source_hash: sha256-994fe8f9d6957d34
  BC-5030.40.20:
    name: Gestion des valorisations intermédiaires
    description: |
      Gestion des valorisations intermédiaires et des demandes de paiement pendant la
      livraison.
    source_hash: sha256-e70997d501807494
  BC-5030.40.30:
    name: Gestion commerciale des coûts
    description: |
      Gestion commerciale du coût, de la marge et de la position de trésorerie du
      contrat.
    source_hash: sha256-80745c2734fcb426
  BC-5030.40.40:
    name: Règlement du décompte final
    description: |
      Accord et règlement des décomptes finaux à l'achèvement du contrat.
    source_hash: sha256-758bace76c0c11da
  BC-5030.50:
    name: "Gestion des variations et des réclamations"
    description: |
      Gestion des variations, des événements de compensation, des réclamations et des
      litiges découlant des contrats d'infrastructure.
    source_hash: sha256-a2dbf2cb6eeec399
  BC-5030.50.10:
    name: Gestion des variations
    description: |
      Gestion des variations de périmètre et de leurs conséquences commerciales.
    source_hash: sha256-623e24d38463ca24
  BC-5030.50.20:
    name: Gestion des événements de compensation
    description: |
      Évaluation et gestion des événements de compensation prévus au contrat.
    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Gestion des réclamations
    description: |
      Préparation, défense et règlement des réclamations contractuelles.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Résolution des litiges
    description: |
      Résolution des litiges par la négociation, l'adjudication et les procédures
      formelles.
    source_hash: sha256-466233bca2bc96d7
  BC-5030.60:
    name: "Gestion des sous-traitants et de la chaîne d'approvisionnement"
    description: |
      Achats, intégration et gestion des sous-traitants et de la chaîne
      d'approvisionnement de livraison.
    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Achats des sous-traitants
    description: |
      Achats et désignation des sous-traitants pour les lots de livraison.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
    name: Gestion des lots techniques
    description: |
      Gestion des lots techniques et de leurs interfaces pendant la livraison.
    source_hash: sha256-5306b41f38a4c69c
  BC-5030.60.30:
    name: Intégration de la chaîne d'approvisionnement
    description: |
      Intégration et vérification de conformité des partenaires de la chaîne
      d'approvisionnement.
    source_hash: sha256-cde79efa5810c8eb
  BC-5030.60.40:
    name: Gestion de la performance des sous-traitants
    description: |
      Suivi et gestion de la performance des sous-traitants au regard du contrat.
    source_hash: sha256-154e39a8ff2b1f3c
