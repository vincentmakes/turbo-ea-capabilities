locale: fr
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Gestion réglementaire et de la conformité de l'infrastructure
    description: |
      Gestion de la régulation économique et de sécurité de l'infrastructure, couvrant les
      relations avec les régulateurs et les soumissions de contrôle des prix, la gestion
      des licences et des obligations, les dossiers de sécurité et l'assurance, le
      reporting réglementaire, et les permis et approbations statutaires.
    in_scope:
      - Engagement des régulateurs et soumissions de contrôle des prix
      - Gestion des licences d'exploitation et des obligations statutaires
      - Élaboration des dossiers de sécurité et assurance de sécurité
      - Reporting réglementaire de performance et statutaire
      - Gestion des permis opérationnels, environnementaux et statutaires
      - Appui aux audits et à la divulgation réglementaires
    out_of_scope:
      - Gestion de la conformité transverse (BC-130)
      - Gestion des risques d'entreprise (BC-140)
      - Gestion commerciale des concessions (BC-5100)
      - Gestion juridique et du contentieux d'entreprise
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Gestion de la relation réglementaire
    description: |
      Engagement avec les régulateurs économiques et gestion des soumissions et
      déterminations de contrôle des prix.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Engagement des régulateurs
    description: |
      Engagement continu et gestion de la relation avec les régulateurs économiques et
      sectoriels.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: "Contrôle des prix et détermination"
    description: |
      Gestion des processus réglementaires de contrôle des prix et des déterminations
      périodiques.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Gestion des soumissions réglementaires
    description: |
      Préparation et gestion des soumissions formelles aux régulateurs.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Veille des évolutions réglementaires
    description: |
      Veille et interprétation des évolutions réglementaires affectant l'entreprise.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: "Gestion des licences et des obligations"
    description: |
      Gestion des licences d'exploitation et des obligations et conditions statutaires qui
      leur sont attachées.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Gestion des licences d'exploitation
    description: |
      Gestion des licences d'exploitation détenues par l'exploitant d'infrastructure.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Suivi des obligations statutaires
    description: |
      Suivi des obligations statutaires et de leur respect à travers l'entreprise.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Conformité aux conditions de licence
    description: |
      Assurance de la conformité aux conditions attachées aux licences d'exploitation.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: "Gestion des devoirs et engagements"
    description: |
      Gestion des devoirs statutaires et des engagements donnés aux régulateurs et aux
      autorités.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: "Dossier de sécurité et assurance"
    description: |
      Élaboration des dossiers de sécurité et de l'assurance et de la certification qui
      démontrent l'exploitation sûre.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Élaboration du dossier de sécurité
    description: |
      Élaboration et maintien des dossiers de sécurité pour les actifs et exploitations
      d'infrastructure.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: "Certification et autorisation de sécurité"
    description: |
      Obtention de la certification et de l'autorisation de sécurité requises pour
      exploiter.
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: Assurance réglementaire de sécurité
    description: |
      Assurance auprès des régulateurs de sécurité que les obligations de sécurité sont
      respectées.
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: Évaluation indépendante de sécurité
    description: |
      Évaluation et validation indépendantes des dossiers et dispositions de sécurité.
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: "Reporting et divulgation réglementaires"
    description: |
      Reporting des informations de performance, financières et statutaires aux régulateurs
      et aux parties prenantes.
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: Reporting de performance réglementaire
    description: |
      Reporting de la performance opérationnelle et de service aux régulateurs.
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: Reporting financier réglementaire
    description: |
      Reporting des informations financières et de coûts réglementaires aux autorités.
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: Divulgation statutaire
    description: |
      Divulgation des informations statutaires requises par la loi et la réglementation.
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: Appui aux audits réglementaires
    description: |
      Appui aux audits, revues et investigations réglementaires.
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: "Permis et approbations statutaires"
    description: |
      Gestion des permis opérationnels, environnementaux et statutaires et des approbations
      nécessaires à l'exploitation.
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: Gestion des permis opérationnels
    description: |
      Gestion des permis opérationnels requis pour les activités d'infrastructure.
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: Gestion des approbations statutaires
    description: |
      Gestion des approbations et consentements statutaires des autorités.
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: Conformité aux permis environnementaux
    description: |
      Conformité aux permis environnementaux et à leurs conditions.
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: "Renouvellement et modification des permis"
    description: |
      Renouvellement et modification des permis et approbations au fil de l'évolution des
      exploitations.
    source_hash: sha256-07c3c25fd50f1ebe
metadata:
