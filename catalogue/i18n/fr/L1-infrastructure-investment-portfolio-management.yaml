locale: fr
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Gestion des investissements et du portefeuille d'infrastructure
    description: |
      Stratégie d'investissement, origination, évaluation et allocation de capital
      sur un portefeuille d'actifs d'infrastructure et de projets d'investissement.
      Discipline côté propriétaire/investisseur qui décide quelle infrastructure
      financer et comment, et suit les rendements au niveau du portefeuille et la
      valeur publique sur le cycle de vie de l'actif.
    in_scope:
      - Stratégie d'investissement en infrastructure et ciblage sectoriel
      - Origination et présélection du pipeline d'opérations et de projets
      - Dossiers d'affaires, évaluation des options et analyse coûts-bénéfices
      - Priorisation et séquencement du programme d'investissement à l'échelle du portefeuille
      - Stratégie de financement et de mobilisation de fonds incluant subventions et financement de projet
      - Suivi de la performance du portefeuille, des bénéfices et du rapport qualité-prix
    out_of_scope:
      - Trésorerie d'entreprise et financement de l'entreprise (BC-210)
      - Formulation de la stratégie d'entreprise (BC-580)
      - Revenus d'exploitation, tarifs et revenus de concession (BC-5100)
      - Contrôles de livraison des programmes et projets (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Stratégie d'investissement en infrastructure
    description: |
      Définition de la stratégie d'investissement en infrastructure à long terme,
      du ciblage sectoriel et de l'appétit pour le risque qui régit le déploiement
      du capital.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: "Stratégie sectorielle et de marché"
    description: |
      Sélection des secteurs et marchés d'infrastructure à cibler en fonction de la
      demande, des politiques et de la dynamique concurrentielle.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Définition de la thèse d'investissement
    description: |
      Articulation de la thèse d'investissement et de la logique de création de
      valeur pour chaque segment d'infrastructure ciblé.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Cadre d'allocation du capital
    description: |
      Cadre et critères régissant l'allocation du capital entre secteurs,
      géographies et classes d'actifs.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Définition de l'appétit pour le risque
    description: |
      Définition de l'appétit pour le risque d'investissement et des seuils de
      tolérance pour le portefeuille d'infrastructure.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: "Gestion du pipeline et de l'origination"
    description: |
      Origination, présélection et suivi des opportunités d'investissement et de
      projets d'infrastructure au regard des critères d'investissement.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Origination d'opportunités
    description: |
      Sourcing des opportunités d'investissement et de développement d'infrastructure
      via les marchés, les pouvoirs publics et les canaux propriétaires.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: "Présélection et priorisation des investissements"
    description: |
      Présélection et priorisation précoce des opportunités au regard de filtres
      stratégiques et financiers.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: "Intelligence de marché et sectorielle"
    description: |
      Collecte et analyse de l'intelligence de marché, de demande et de politiques
      pour éclairer l'origination.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Suivi du pipeline
    description: |
      Suivi des opportunités à travers les jalons décisionnels, du lead à la
      décision d'investissement.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: "Gestion des dossiers d'affaires et de l'évaluation"
    description: |
      Élaboration et évaluation des dossiers d'affaires pour l'investissement en
      infrastructure, incluant l'évaluation des options et de la valeur.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Évaluation des options
    description: |
      Évaluation des options d'investissement et de livraison au regard des
      objectifs stratégiques et des contraintes.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Analyse coûts-bénéfices
    description: |
      Évaluation quantifiée coûts-bénéfices et économique des investissements
      d'infrastructure candidats.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: "Évaluation de la valeur économique et sociale"
    description: |
      Évaluation de la valeur économique, sociale et publique plus large générée
      par l'investissement.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Jalonnement de la décision d'investissement
    description: |
      Jalons de gouvernance et approbations qui autorisent la progression et
      l'engagement des fonds.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Priorisation du programme d'investissement
    description: |
      Priorisation, équilibrage et séquencement des investissements à travers le
      programme d'investissement et le portefeuille d'actifs.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Priorisation du portefeuille
    description: |
      Classement des investissements candidats selon la valeur, le risque et la
      contribution stratégique.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Rationnement du capital
    description: |
      Allocation d'un capital contraint entre des demandes d'investissement
      concurrentes.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Équilibrage du portefeuille
    description: |
      Équilibrage du portefeuille selon le risque, le secteur et les horizons du
      cycle de vie.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Séquencement des investissements
    description: |
      Phasage et séquencement des investissements pour gérer la faisabilité de
      livraison et les profils de financement.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: "Stratégie de financement et de mobilisation de fonds"
    description: |
      Stratégie de recherche et de structuration du financement et de la
      mobilisation de fonds nécessaires à la livraison du programme d'infrastructure.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Stratégie des sources de financement
    description: |
      Sélection des sources de financement parmi les mécanismes publics, privés et
      de type utilisateur-payeur.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: "Gestion des subventions et du financement public"
    description: |
      Recherche et administration des subventions et des contributions publiques en
      capital.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Structuration du financement de projet
    description: |
      Structuration du financement de projet, de la dette et des fonds propres pour
      les actifs d'infrastructure.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Structuration du financement mixte
    description: |
      Structuration de montages de financement mixte public-privé et concessionnel.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Gestion de la performance du portefeuille
    description: |
      Suivi et reporting des rendements, des bénéfices et de la valeur générés par
      le portefeuille d'investissement en infrastructure.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Suivi de la performance du portefeuille
    description: |
      Suivi de la performance financière et opérationnelle à l'échelle du
      portefeuille.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Suivi des bénéfices
    description: |
      Suivi des bénéfices et résultats réalisés au regard des dossiers d'affaires
      d'investissement.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Évaluation du rapport qualité-prix
    description: |
      Évaluation du rapport qualité-prix et de la valeur sur le cycle de vie à
      l'échelle du portefeuille.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Reporting du portefeuille
    description: |
      Reporting de la performance du portefeuille auprès des investisseurs, des
      conseils et des parties prenantes publiques.
    source_hash: sha256-35c417c36c5cb686
