    description: |
      Identification des meilleures pratiques internes et externes.
    source_hash: sha256-7c4b70e06e611068
  BC-830.40.20:
    name: Codification des meilleures pratiques
    description: |
      Codification des meilleures pratiques en actifs réutilisables et en standards.
    source_hash: sha256-b27c11172693dcb8
  BC-830.40.30:
    name: Diffusion des meilleures pratiques
    description: |
      Diffusion, formation et accompagnement à l'adoption des meilleures pratiques.
    source_hash: sha256-86025215ce41a6b5
