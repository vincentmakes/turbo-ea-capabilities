    description: |
      Recherche d'entreprise et expériences de découverte de contenu.
    source_hash: sha256-4abe4891af4242ad
  BC-830.30:
    name: Gestion du partage des connaissances et de la collaboration
    description: |
      Communautés de pratique et plateformes de collaboration.
    source_hash: sha256-37e2f3f6ad5610bc
