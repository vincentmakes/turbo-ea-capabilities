entries:
  BC-830:
    name: Gestion des connaissances
    description: |
      Capture, conservation et partage des connaissances organisationnelles.
    source_hash: sha256-e7ba8ef4d66c2369
  BC-830.10:
    name: Gestion de la capture des connaissances
    description: |
      Capture auprès des experts, des projets et retours d'expérience.
    source_hash: sha256-d3a9467975ba3fb6
  BC-830.10.10:
    name: Élicitation des connaissances tacites
    description: |
      Élicitation des connaissances tacites des experts par entretiens et observations.
    source_hash: sha256-13c70b5496e19f7b
  BC-830.10.20:
    name: Capture des retours d'expérience
    description: |
      Capture des retours d'expérience issus des projets et des opérations.
    source_hash: sha256-0d424ae73ce1470f
  BC-830.10.30:
    name: Rédaction des actifs de connaissances
    description: |
      Rédaction d'articles, de guides de référence et de procédures.
    source_hash: sha256-9d1a4d99bb8147da
  BC-830.20:
    name: Gestion de la conservation et de la taxonomie des connaissances
    description: |
      Taxonomies, ontologies et conservation du contenu.
    source_hash: sha256-1aaef4ece2f3131e
  BC-830.20.10:
    name: Gestion de la taxonomie et de l'ontologie
    description: |
      Maintenance des taxonomies, ontologies et schémas de métadonnées.
    source_hash: sha256-474e8e496ec2c3d2
  BC-830.20.20:
