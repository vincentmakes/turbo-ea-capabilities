kind: business-process
locale: fr
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Prospect-à-Client"
    description: "Cycle d'acquisition client de bout en bout, de la stratégie marché et segments à la marque, à la génération de demande, au captage de leads, à la conversion, à l'onboarding, et à la rétention et advocacy en continu. Un BP2 par stage_name de VS-440."
  BP-1050.10:
    name: "Stratégie marché et segments"
    description: "Définir les marchés et segments cibles et aligner les priorités go-to-market sur les terrains où le right-to-win est le plus fort."
  BP-1050.10.10:
    name: "Analyser le paysage de marché"
    description: "Dimensionner les marchés, profiler les concurrents et faire ressortir les tendances qui façonnent la demande et la stratégie d'acquisition."
  BP-1050.10.20:
    name: "Définir les segments cibles"
    description: "Définir et prioriser les segments client cibles sur la base du besoin, de l'adéquation et du right-to-win."
  BP-1050.10.30:
    name: "Fixer les priorités d'acquisition"
    description: "Traduire les priorités de segments en cibles d'acquisition — comptes, géographies, canaux — pour l'horizon de planification."
  BP-1050.20:
    name: "Marque et positionnement"
    description: "Développer et gouverner la marque, le positionnement et le système de messages utilisés sur tous les canaux d'acquisition."
  BP-1050.20.10:
    name: "Développer la stratégie de marque"
    description: "Définir la promesse de marque, la personnalité, l'architecture et l'identité visuelle ; aligner à travers les marchés et les segments."
  BP-1050.20.20:
    name: "Développer positionnement et messages"
    description: "Développer le positionnement et les messages pour chaque segment et chaque offre ; équiper les campagnes et les ventes d'un narratif cohérent."
  BP-1050.20.30:
    name: "Gouverner les actifs de marque"
    description: "Maintenir les guidelines de marque, gérer les approbations sur l'usage de la marque et gouverner l'identité visuelle et verbale en marché."
  BP-1050.30:
    name: "Génération de demande"
    description: "Générer notoriété et demande à grande échelle via les canaux paid, owned, earned et partenaires."
  BP-1050.30.10:
    name: "Planifier les campagnes de génération de demande"
    description: "Planifier les campagnes par segment, canal et offre ; allouer le budget ; fixer les cibles de leads et de pipeline."
  BP-1050.30.20:
    name: "Exécuter les campagnes multicanal"
    description: "Exécuter les campagnes paid, owned, earned et partenaires ; gérer le créatif, les landing pages et les offres."
  BP-1050.30.30:
    name: "Mesurer la performance des campagnes"
    description: "Mesurer la portée, la réponse et l'impact pipeline par campagne et canal ; itérer sur le créatif et la dépense."
  BP-1050.40:
    name: "Captage et nurturing des leads"
    description: "Capter l'intérêt entrant, enrichir et scorer les leads et les nourrir jusqu'au statut sales-ready."
  BP-1050.40.10:
    name: "Capter les leads entrants"
    description: "Capter les leads issus des formulaires, événements, références partenaires et canaux entrants dans la plateforme de marketing automation."
  BP-1050.40.20:
    name: "Enrichir et scorer les leads"
    description: "Enrichir avec des données firmographiques et comportementales ; scorer sur l'adéquation et l'intention pour identifier les leads sales-ready."
  BP-1050.40.30:
    name: "Nourrir les leads"
    description: "Conduire des programmes de nurture — contenu, drip campaigns, retargeting — pour faire avancer les leads vers le statut sales-ready."
  BP-1050.40.40:
    name: "Transmettre les leads sales-ready"
    description: "Router les leads sales-ready vers les ventes pour un engagement direct ; suivre la conversion en opportunité."
  BP-1050.50:
    name: "Conversion"
    description: "Convertir les leads qualifiés en premières commandes ou premiers abonnements via l'engagement ventes, les essais et les offres."
  BP-1050.50.10:
    name: "Engager le prospect"
    description: "Conduire l'engagement ventes direct, les démos et les essais pour construire la confiance client et progresser vers la décision."
  BP-1050.50.20:
    name: "Traiter les objections de l'acheteur"
    description: "Faire ressortir et traiter les objections — prix, adéquation, sécurité, intégration — via l'évidence et l'essai."
  BP-1050.50.30:
    name: "Proposer et conclure la première vente"
    description: "Construire une offre de premier deal, négocier les termes et capturer la première commande ou abonnement."
  BP-1050.50.40:
    name: "Suivre le funnel de conversion"
    description: "Suivre la conversion lead-vers-client par segment, canal et offre ; itérer sur le funnel."
  BP-1050.60:
    name: "Onboarding client"
    description: "Onboarder les nouveaux clients — provisioning, formation, success planning — pour accélérer le time-to-value."
  BP-1050.60.10:
    name: "Accueillir le nouveau client"
    description: "Conduire l'expérience de bienvenue — kickoff, contacts nommés, success plan — pour fixer les attentes et l'énergie."
  BP-1050.60.20:
    name: "Provisionner le client"
    description: "Provisionner le client dans les systèmes de delivery — comptes, entitlements, intégrations, migration de données."
  BP-1050.60.30:
    name: "Former les utilisateurs du client"
    description: "Former les utilisateurs du client sur le produit ou le service ; certifier les champions ; enregistrer dans les jalons du success plan."
  BP-1050.60.40:
    name: "Confirmer le time-to-value"
    description: "Valider que le client a atteint les jalons de premier value ; capturer pour le scoring de rétention."
  BP-1050.70:
    name: "Rétention et advocacy"
    description: "Retenir les clients, piloter renouvellement et expansion, et transformer les promoteurs en advocates et références."
  BP-1050.70.10:
    name: "Opérer le customer health scoring"
    description: "Scorer la santé client à partir des signaux d'usage produit, d'engagement et de feedback ; faire ressortir les comptes à risque pour intervention."
  BP-1050.70.20:
    name: "Piloter renouvellement et expansion"
    description: "Conduire le motion de renouvellement et identifier les opportunités d'expansion — cross-sell, upsell — au sein du compte."
  BP-1050.70.30:
    name: "Cultiver l'advocacy"
    description: "Identifier les promoteurs, capturer les références, études de cas et témoignages ; activer les programmes d'advocacy."
