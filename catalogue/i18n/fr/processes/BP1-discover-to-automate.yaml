kind: business-process
locale: fr
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Découverte-à-Automatisation"
    description: "Cycle d'amélioration des processus et d'automatisation, de la découverte de processus à la mesure, au process mining, à la refonte et à l'automatisation. Un BP2 par stage_name de VS-150."
    source_hash: sha256-242ccdd2644d3357
  BP-1160.10:
    name: "Découverte de processus"
    description: "Découvrir et documenter le processus tel-quel — acteurs, étapes, données, systèmes."
    source_hash: sha256-98b633c844e6186d
  BP-1160.10.10:
    name: "Cartographier le processus tel-quel"
    description: "Cartographier le processus tel-quel via interviews, walk-throughs et observation ; persister dans un modèle de processus."
    source_hash: sha256-67cdd9b1759b8c85
  BP-1160.10.20:
    name: "Capturer les variantes de processus"
    description: "Capturer les variantes — par région, canal, type de client — pour faire ressortir où la standardisation compte."
    source_hash: sha256-4fd5fee3601621d3
  BP-1160.20:
    name: "Mesure des processus"
    description: "Mesurer la performance du processus — cycle time, coût, qualité, expérience client."
    source_hash: sha256-a3c0f1e1d505a6cc
  BP-1160.20.10:
    name: "Définir les KPI du processus"
    description: "Définir les KPI du processus — efficacité, qualité, outcome client — et baseliner la performance actuelle."
    source_hash: sha256-30ac3e4647779862
  BP-1160.20.20:
    name: "Baseliner la performance"
    description: "Baseliner la performance actuelle par sampling et analytics ; identifier les outliers et les patterns."
    source_hash: sha256-e76ab6dab63ebabb
  BP-1160.30:
    name: "Process mining"
    description: "Miner les event-logs systèmes pour dériver le flux réel du processus et faire ressortir les inefficacités."
    source_hash: sha256-29c23b6d3ba32017
  BP-1160.30.10:
    name: "Extraire l'event log"
    description: "Extraire les données d'event-log des systèmes sources pour le processus en périmètre ; nettoyer et préparer."
    source_hash: sha256-123c36e8e61e369a
  BP-1160.30.20:
    name: "Réaliser l'analyse de process mining"
    description: "Appliquer les outils de process mining pour dériver le flux réel, la conformance, les goulots d'étranglement, les boucles de rework et les variantes."
    source_hash: sha256-57df458afdfbfe9a
  BP-1160.30.30:
    name: "Faire ressortir les hypothèses d'amélioration"
    description: "Traduire les findings de mining en hypothèses d'amélioration priorisées par impact et faisabilité."
    source_hash: sha256-b2937b52a52a943e
  BP-1160.40:
    name: "Refonte de processus"
    description: "Refondre le processus — éliminer, simplifier, intégrer, automatiser — pour livrer une amélioration en step-change."
    source_hash: sha256-494cbf24df9546c1
  BP-1160.40.10:
    name: "Concevoir le processus cible"
    description: "Concevoir le processus cible en appliquant les principes lean, l'alignement parcours client et l'automatisation."
    source_hash: sha256-d48fc9741c148b80
  BP-1160.40.20:
    name: "Valider la refonte"
    description: "Valider la refonte avec les opérateurs, les clients et le risque ; affiner avant la construction."
    source_hash: sha256-db270467cb280b5c
  BP-1160.50:
    name: "Automatisation des processus"
    description: "Construire, déployer et opérer l'automatisation des processus — RPA, orchestration, assistance IA — à l'échelle."
    source_hash: sha256-10dd79850ae8b384
  BP-1160.50.10:
    name: "Construire l'automatisation"
    description: "Construire l'automatisation — bots RPA, flux orchestrés, composants IA agentique — selon le processus refondu."
    source_hash: sha256-041615d4647618a2
  BP-1160.50.20:
    name: "Déployer et opérer l'automatisation"
    description: "Déployer l'automatisation en production ; opérer, monitorer et maintenir à travers les cycles de changement."
    source_hash: sha256-a131e4085bd2075a
  BP-1160.50.30:
    name: "Suivre les bénéfices d'automatisation"
    description: "Suivre les bénéfices réalisés de l'automatisation face au business case ; itérer et passer à l'échelle."
    source_hash: sha256-3ad25892234ed3fc
