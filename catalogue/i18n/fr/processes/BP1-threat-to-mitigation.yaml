kind: business-process
locale: fr
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "Menace-à-Mitigation"
    description: "Cycle opérationnel de cybersécurité, de la définition de la posture à la threat intelligence, à la découverte des vulnérabilités, à la détection, à la réponse à incident, au durcissement des identités et accès, et à la sensibilisation. Un BP2 par stage_name de VS-600."
  BP-1150.10:
    name: "Définition de la posture de sécurité"
    description: "Définir la posture de sécurité, le baseline de contrôles et la maturité cible pour l'entreprise."
  BP-1150.10.10:
    name: "Définir la stratégie de sécurité"
    description: "Définir la stratégie cybersécurité — appétit au risque, maturité cible, framework (NIST CSF, ISO 27001)."
  BP-1150.10.20:
    name: "Fixer le baseline de contrôles"
    description: "Fixer le baseline de contrôles pour l'entreprise ; aligner sur les frameworks de contrôles et la réglementation applicable."
  BP-1150.20:
    name: "Threat intelligence"
    description: "Collecter, analyser et diffuser la threat intelligence aux défenseurs et aux décideurs."
  BP-1150.20.10:
    name: "Collecter la threat intelligence"
    description: "Collecter la threat intelligence depuis les capteurs internes, les flux ISAC, les éditeurs et l'OSINT."
  BP-1150.20.20:
    name: "Analyser et diffuser l'intelligence"
    description: "Analyser l'intelligence pour la pertinence et la rendre opérationnelle — IOCs, hypothèses de hunt, briefings."
  BP-1150.30:
    name: "Découverte des vulnérabilités"
    description: "Découvrir les vulnérabilités — scans, pen tests, bug bounty, revue de code — et piloter la remédiation."
  BP-1150.30.10:
    name: "Exécuter les scans de vulnérabilités"
    description: "Exécuter des scans de vulnérabilités en continu sur l'infrastructure, les applications et les workloads cloud."
  BP-1150.30.20:
    name: "Conduire des tests d'intrusion"
    description: "Conduire des tests d'intrusion périodiques et événementiels ; capturer les findings exploitables et les remédiations."
  BP-1150.30.30:
    name: "Piloter la remédiation des vulnérabilités"
    description: "Prioriser les vulnérabilités par exploitabilité et criticité d'actif ; suivre la remédiation face aux SLA."
  BP-1150.40:
    name: "Détection"
    description: "Détecter les événements de sécurité par monitoring, analytics, threat hunting et baselines comportementaux."
  BP-1150.40.10:
    name: "Opérer le monitoring de sécurité"
    description: "Opérer le SOC — SIEM, EDR, XDR, détection réseau — pour surveiller les événements de sécurité 24/7."
  BP-1150.40.20:
    name: "Trier et investiguer les alertes"
    description: "Trier et investiguer les alertes ; escalader les incidents confirmés ; clôturer les faux positifs."
  BP-1150.40.30:
    name: "Hunter les menaces"
    description: "Conduire des threat hunts proactifs sur des hypothèses dérivées de l'intelligence et des TTPs émergents."
  BP-1150.50:
    name: "Réponse à incident"
    description: "Répondre aux incidents de sécurité confirmés — contenir, éradiquer, restaurer et apprendre."
  BP-1150.50.10:
    name: "Contenir l'incident"
    description: "Contenir l'incident — isoler les systèmes affectés, révoquer les identifiants, bloquer le trafic — pour stopper la propagation."
  BP-1150.50.20:
    name: "Éradiquer la menace"
    description: "Éradiquer la menace — retirer le malware, patcher la vulnérabilité, fermer le mécanisme de persistance."
  BP-1150.50.30:
    name: "Restaurer les opérations"
    description: "Restaurer les systèmes et opérations affectés à un état known-good ; valider avant remise en service."
  BP-1150.50.40:
    name: "Notifier et reporter"
    description: "Notifier régulateurs, clients et parties affectées selon les obligations de breach notification et le protocole."
  BP-1150.60:
    name: "Durcissement identités et accès"
    description: "Durcir identités et accès — IAM, MFA, privileged access — pour prévenir les chemins d'attaque par identité."
  BP-1150.60.10:
    name: "Gérer le cycle de vie des identités"
    description: "Gérer le cycle de vie des identités — provisioning, changement de rôle, deprovisioning — pour collaborateurs, contractors et machines."
  BP-1150.60.20:
    name: "Imposer les contrôles d'authentification"
    description: "Imposer MFA, accès conditionnel et authentification basée sur le risque sur tous les chemins d'accès."
  BP-1150.60.30:
    name: "Gouverner l'accès privilégié"
    description: "Gouverner l'accès privilégié — vault, élévation just-in-time, monitoring de session, ré-attestation périodique."
  BP-1150.70:
    name: "Sensibilisation et retours d'expérience"
    description: "Conduire la sensibilisation à la sécurité auprès de la workforce ; capturer les apprentissages des incidents et exercices."
  BP-1150.70.10:
    name: "Conduire la sensibilisation à la sécurité"
    description: "Conduire la formation de sensibilisation à la sécurité, les simulations de phishing et la formation ciblée par rôle."
  BP-1150.70.20:
    name: "Capturer et appliquer les enseignements"
    description: "Capturer les enseignements des incidents, exercices et rapports de brèche ; appliquer aux contrôles, formations, runbooks."
