kind: business-process
locale: fr
source: BP1-idea-to-market.yaml
entries:
  BP-1030:
    name: "Idée-à-Marché"
    description: "Cycle d'innovation produit/service de bout en bout, du captage des idées à la conception et à la faisabilité, à la recherche et au prototypage, à la sélection du portefeuille, à la conception et au développement, à la protection de la propriété intellectuelle, à la préparation du lancement, à l'introduction sur le marché et à la performance post-lancement. Un BP2 par stage_name de VS-290."
  BP-1030.10:
    name: "Captage d'idées"
    description: "Faire émerger, capter et consolider les idées des collaborateurs, clients, partenaires et signaux de marché ; les router vers le triage."
  BP-1030.10.10:
    name: "Solliciter des idées"
    description: "Animer des campagnes de génération d'idées, des hackathons et des canaux continus ; encourager la soumission à travers l'organisation et l'écosystème."
  BP-1030.10.20:
    name: "Capter et trier les idées"
    description: "Persister les idées entrantes, dédupliquer et trier dans des files de revue avec une catégorisation initiale."
  BP-1030.10.30:
    name: "Valider l'adéquation de l'idée"
    description: "Appliquer un premier screen d'adéquation face à la stratégie, à la capability et au signal de marché ; rejeter, parquer ou faire avancer en faisabilité."
  BP-1030.20:
    name: "Concept et faisabilité"
    description: "Convertir les idées prometteuses en concepts ; évaluer la faisabilité technique, marché et commerciale ; bâtir le dossier pour la sélection de portefeuille."
  BP-1030.20.10:
    name: "Développer le concept"
    description: "Articuler le concept — problème, utilisateur cible, solution proposée, hypothèse de valeur — à un niveau de profondeur suffisant pour l'évaluation."
  BP-1030.20.20:
    name: "Évaluer la faisabilité technique"
    description: "Valider que le concept peut être construit avec la technologie, les matériaux et les compétences disponibles ou acquérables."
  BP-1030.20.30:
    name: "Évaluer la faisabilité commerciale"
    description: "Bâtir le business case — marché adressable, pricing, cost-to-serve, ROI — pour dimensionner l'opportunité."
  BP-1030.20.40:
    name: "Décider de l'avancement du concept"
    description: "Décider au gate concept d'avancer, d'affiner, de parquer ou de tuer, avec un rationnel et des conditions clairs."
  BP-1030.30:
    name: "Recherche et prototypage"
    description: "Conduire la recherche, construire des prototypes et tester avec les utilisateurs pour dérisquer le concept avant la conception complète."
  BP-1030.30.10:
    name: "Conduire la recherche utilisateurs"
    description: "Conduire des recherches qualitatives et quantitatives avec les utilisateurs cibles pour valider l'adéquation problème-solution."
  BP-1030.30.20:
    name: "Construire un prototype"
    description: "Construire des prototypes basse ou haute fidélité — maquettes physiques, wireframes, code fonctionnel — pour rendre le concept tangible."
  BP-1030.30.30:
    name: "Tester le prototype avec les utilisateurs"
    description: "Conduire des tests d'utilisabilité et de valeur avec les utilisateurs cibles ; capturer les findings pour informer l'itération ou la décision de tuer."
  BP-1030.30.40:
    name: "Itérer le concept"
    description: "Appliquer les apprentissages des tests de prototype au concept ; itérer jusqu'à ce que le concept soit prêt pour la sélection de portefeuille ou tué."
  BP-1030.40:
    name: "Sélection du portefeuille"
    description: "Prioriser les concepts validés au sein du portefeuille d'innovation ; allouer les ressources, séquencer la livraison et équilibrer le risque."
  BP-1030.40.10:
    name: "Coter les candidats du portefeuille"
    description: "Coter les concepts validés face aux critères de portefeuille — adéquation stratégique, valeur, risque, adéquation aux capabilities, time-to-market."
  BP-1030.40.20:
    name: "Séquencer le portefeuille"
    description: "Séquencer le portefeuille à travers les horizons, en équilibrant now/next/later et le mix core/adjacent/transformational."
  BP-1030.40.30:
    name: "Allouer les ressources"
    description: "Allouer financement, talents et infrastructure aux concepts sélectionnés ; déclencher le kick-off formel en design et développement."
  BP-1030.50:
    name: "Conception et développement"
    description: "Conception détaillée, ingénierie, build et intégration du produit ou du service jusqu'à la préparation au lancement."
  BP-1030.50.10:
    name: "Définir les exigences détaillées"
    description: "Traduire le concept validé en exigences fonctionnelles, non-fonctionnelles et d'acceptation détaillées."
  BP-1030.50.20:
    name: "Concevoir le produit ou le service"
    description: "Produire la conception détaillée — architecture, matériaux, UX, BOM — qui sera construite et validée."
  BP-1030.50.30:
    name: "Construire et intégrer"
    description: "Construire le produit ou le service selon la conception ; intégrer composants et sous-systèmes ; gérer le changement et la configuration."
  BP-1030.50.40:
    name: "Valider et vérifier"
    description: "Exécuter la vérification et la validation de la conception face aux exigences ; clore les non-conformités avant la préparation au lancement."
  BP-1030.60:
    name: "Protection de la propriété intellectuelle"
    description: "Identifier, protéger et gérer la propriété intellectuelle générée au cours du cycle d'innovation."
  BP-1030.60.10:
    name: "Identifier la PI brevetable"
    description: "Examiner les innovations pour la nouveauté, l'utilité et la non-évidence ; identifier les inventions candidates au brevetage."
  BP-1030.60.20:
    name: "Déposer et défendre les brevets"
    description: "Déposer les demandes provisoires et complètes ; gérer la prosécution jusqu'à la délivrance à travers les juridictions."
  BP-1030.60.30:
    name: "Gérer secrets d'affaires et marques"
    description: "Identifier le matériel relevant du secret d'affaires et les actifs de marque ; appliquer les protections (NDA, contrôles d'accès, enregistrements)."
  BP-1030.70:
    name: "Préparation au lancement"
    description: "Préparer le lancement marché — go-to-market, fabrication, supply chain, canaux, support, formation."
  BP-1030.70.10:
    name: "Construire le plan go-to-market"
    description: "Développer le plan GTM — positionnement, pricing, canaux, sales enablement, campagnes marketing — pour la fenêtre de lancement."
  BP-1030.70.20:
    name: "Monter en cadence la fabrication ou l'exécution"
    description: "Mettre en place la capacité de fabrication ou la readiness d'exécution de service — équipement, formation, approvisionnement, certifications."
  BP-1030.70.30:
    name: "Former ventes et support"
    description: "Former les équipes ventes, partenaires et support sur le nouveau produit/service avant le lancement."
  BP-1030.70.40:
    name: "Réussir la revue de préparation au lancement"
    description: "Conduire la revue cross-fonctionnelle de préparation au lancement ; combler les gaps ou retarder le lancement jusqu'à readiness."
  BP-1030.80:
    name: "Introduction au marché"
    description: "Exécuter le lancement — release, annonce, vente et support du nouveau produit ou service en marché."
  BP-1030.80.10:
    name: "Mettre en marché"
    description: "Couper la release à travers les canaux et les géographies selon le plan de lancement ; coordonner avec PR, partenaires et supply."
  BP-1030.80.20:
    name: "Exécuter le marketing de lancement"
    description: "Conduire les campagnes de lancement — publicité, contenu, événements, PR, social — selon le plan GTM."
  BP-1030.80.30:
    name: "Capter les premières ventes"
    description: "Pousser le motion ventes initial via les canaux directs, partenaires et digitaux ; suivre la conversion pour valider la courbe de lancement."
  BP-1030.90:
    name: "Performance post-lancement"
    description: "Suivre la performance face au business case, capter le feedback client, piloter les évolutions et décider des mouvements de cycle de vie."
  BP-1030.90.10:
    name: "Suivre les KPI de lancement"
    description: "Surveiller adoption, revenu, marge brute, NPS et autres KPI de lancement face au business case pour les premiers 30/60/90 jours et au-delà."
  BP-1030.90.20:
    name: "Capter le feedback client"
    description: "Capter le feedback client structuré et non structuré en marché ; le router dans le backlog produit et la roadmap."
  BP-1030.90.30:
    name: "Planifier les évolutions du cycle de vie"
    description: "Décider des évolutions, fonctionnalités fast-follow ou pivots sur la base de l'évidence post-lancement ; renvoyer dans le Captage d'idées."
