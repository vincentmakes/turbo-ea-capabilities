kind: business-process
locale: fr
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "Embauche-à-Départ"
    description: "Cycle de vie collaborateur de bout en bout, de la planification des effectifs au sourcing, à la sélection, à l'onboarding, à la performance et au développement, à l'administration de la rémunération et des avantages, à l'expérience collaborateur, à la mobilité interne et à l'offboarding. Un BP2 par stage_name de VS-280."
    source_hash: sha256-09ffdeb0d20eb666
  BP-1020.10:
    name: "Planification des effectifs"
    description: "Prévoir les besoins en effectifs face à la stratégie et à l'offre actuelle, identifier les écarts de compétences et planifier les mouvements d'embauche, de mobilité et de départ nécessaires pour les combler."
    source_hash: sha256-8ee05419330812e0
  BP-1020.10.10:
    name: "Prévoir la demande en effectifs"
    description: "Traduire le plan business en demande de headcount, de compétences et de capacité par équipe, rôle et horizon temporel."
    source_hash: sha256-b13cd46fc052b75b
  BP-1020.10.20:
    name: "Évaluer l'offre d'effectifs"
    description: "Inventorier les collaborateurs actuels, contractors et mouvements en cours ; évaluer les compétences face à la demande pour faire ressortir écarts et excédents."
    source_hash: sha256-9aa3173db35ae515
  BP-1020.10.30:
    name: "Construire le plan d'effectifs"
    description: "Concevoir le plan intégré — embaucher, développer, redéployer, sortir — pour combler l'écart ; séquencer les mouvements avec le budget et les approbations."
    source_hash: sha256-05868c274352d2bf
  BP-1020.20:
    name: "Sourcing et attractivité"
    description: "Identifier et attirer les candidats via la marque employeur, les canaux de sourcing et l'approche directe."
    source_hash: sha256-c9f25567ef00b334
  BP-1020.20.10:
    name: "Développer la marque employeur"
    description: "Positionner la proposition de valeur de la marque employeur et les messages utilisés sur les canaux pour attirer les segments de talents cibles."
    source_hash: sha256-301153251b07415f
  BP-1020.20.20:
    name: "Sourcer les candidats"
    description: "Sourcer via les job boards, les réseaux sociaux, la cooptation, les agences et l'approche directe ; persister les candidats dans l'ATS."
    source_hash: sha256-d2e9732fbea74c90
  BP-1020.20.30:
    name: "Gérer les communautés de talents"
    description: "Maintenir les relations avec les candidats dans les talent pools et communautés pour les rôles evergreen et les pipelines."
    source_hash: sha256-0d81fb41f934c50b
  BP-1020.30:
    name: "Sélection et embauche"
    description: "Filtrer, évaluer, interviewer et sélectionner les candidats ; exécuter les vérifications pré-embauche ; faire et faire accepter l'offre."
    source_hash: sha256-05bfafa6ba03c777
  BP-1020.30.10:
    name: "Filtrer et présélectionner les candidats"
    description: "Appliquer les critères de filtrage aux candidatures entrantes ; présélectionner pour entretien sur la base de l'adéquation et des qualifications."
    source_hash: sha256-cb5a307727a052bc
  BP-1020.30.20:
    name: "Conduire évaluations et entretiens"
    description: "Conduire des entretiens structurés et des évaluations de compétences ; consolider les retours des évaluateurs en une décision d'embauche."
    source_hash: sha256-3d521eea12b26cfa
  BP-1020.30.30:
    name: "Réaliser les vérifications pré-embauche"
    description: "Exécuter les vérifications de background, de références et de droit au travail selon la juridiction et le risque du poste."
    source_hash: sha256-19a67bb8129a9e6a
  BP-1020.30.40:
    name: "Faire et négocier l'offre"
    description: "Construire l'offre (rémunération, equity, date de prise de poste), négocier avec le candidat et capturer l'acceptation."
    source_hash: sha256-761e6d7b309b32d4
  BP-1020.30.50:
    name: "Embaucher le collaborateur"
    description: "Exécuter le contrat de travail, créer le dossier collaborateur dans le SIRH et déclencher les workflows d'onboarding en aval."
    source_hash: sha256-d80a4476cf0e5849
  BP-1020.40:
    name: "Onboarding"
    description: "Faire entrer le nouveau collaborateur dans l'organisation — accueil, formalités, équipement, formation et intégration."
    source_hash: sha256-f60d0cdc7e828a78
  BP-1020.40.10:
    name: "Provisionner équipement et accès"
    description: "Délivrer ordinateur portable, accès aux locaux, identifiants système et tout équipement spécifique au rôle avant le jour 1."
    source_hash: sha256-7c434b47b861c4de
  BP-1020.40.20:
    name: "Compléter les formalités d'onboarding"
    description: "Capturer les formalités statutaires d'embauche — formulaires fiscaux, adhésion aux avantages, accusés de politique — pour la conformité."
    source_hash: sha256-ddbf6f961bce99c1
  BP-1020.40.30:
    name: "Délivrer le programme d'onboarding"
    description: "Exécuter le parcours d'onboarding structuré — orientation, formation au rôle, points manager — sur les premiers 30/60/90 jours."
    source_hash: sha256-ee4ee7e3818020aa
  BP-1020.40.40:
    name: "Confirmer l'achèvement de l'onboarding"
    description: "Valider que le nouveau collaborateur a complété tous les jalons d'onboarding requis et qu'il est pleinement opérationnel."
    source_hash: sha256-0341b621099346a9
  BP-1020.50:
    name: "Performance et développement"
    description: "Fixer les objectifs, donner du feedback, conduire les revues formelles, identifier les besoins de développement et délivrer apprentissage et coaching."
    source_hash: sha256-7f4f873f09922c08
  BP-1020.50.10:
    name: "Fixer les objectifs de performance"
    description: "Cascader les objectifs business en objectifs individuels au début du cycle ; aligner avec les priorités d'équipe et de fonction."
    source_hash: sha256-6d6c3da452126277
  BP-1020.50.20:
    name: "Fournir un feedback continu"
    description: "Tenir des conversations 1:1 régulières et de feedback continu entre managers et collaborateurs tout au long du cycle."
    source_hash: sha256-108b0046db668289
  BP-1020.50.30:
    name: "Conduire la revue de performance"
    description: "Exécuter la revue formelle du cycle — auto-évaluation, revue manager, calibration — pour déterminer notations et conséquences."
    source_hash: sha256-672da1819702f401
  BP-1020.50.40:
    name: "Identifier les besoins de développement"
    description: "Identifier les écarts de compétences par rapport au rôle actuel et futur ; les capturer dans des plans de développement liés aux interventions de formation."
    source_hash: sha256-0c9679c589077ab9
  BP-1020.50.50:
    name: "Délivrer apprentissage et coaching"
    description: "Exécuter des programmes de formation, du coaching on-the-job, du mentorat et du développement par mission ; suivre la complétion et l'impact."
    source_hash: sha256-45e4c4dda86fdd30
  BP-1020.60:
    name: "Administration de la rémunération et des avantages"
    description: "Administrer le salaire de base, la rémunération variable, l'equity et les avantages tout au long du cycle de vie ; conduire la revue salariale et le handoff vers la paie."
    source_hash: sha256-ed60011d8ab65f0e
  BP-1020.60.10:
    name: "Administrer rémunération fixe et variable"
    description: "Maintenir les grilles salariales, les taux individuels et les plans de rémunération variable ; déclencher les mises à jour paie sur promotion, transfert ou changement de taux."
    source_hash: sha256-c45df0159b0099aa
  BP-1020.60.20:
    name: "Conduire le cycle de revue salariale"
    description: "Conduire le processus de revue salariale annuel ou hors cycle ; appliquer les guidelines budgétaires, propositions managers et approbations."
    source_hash: sha256-c01fd88d6f4da442
  BP-1020.60.30:
    name: "Administrer l'adhésion aux avantages"
    description: "Conduire l'adhésion en open enrolment et événements qualifiants pour la santé, la retraite et autres avantages ; réconcilier avec les flux des organismes."
    source_hash: sha256-09055d65dc34c179
  BP-1020.60.40:
    name: "Gérer les programmes d'equity"
    description: "Octroyer, faire vester et exercer l'equity selon les règles du plan ; coordonner avec la finance, le juridique et le broker equity."
    source_hash: sha256-31daf9cd9c81ea58
  BP-1020.70:
    name: "Expérience et engagement collaborateur"
    description: "Conduire le programme d'engagement, les sondages employee voice, la reconnaissance, le wellbeing et plus largement l'expérience collaborateur."
    source_hash: sha256-f0e69b4282464c4a
  BP-1020.70.10:
    name: "Conduire les enquêtes d'engagement"
    description: "Conduire des enquêtes d'engagement périodiques et des pulse surveys ; analyser les résultats par équipe, segment et tendance."
    source_hash: sha256-78f0d2806028c8ed
  BP-1020.70.20:
    name: "Agir sur le feedback collaborateur"
    description: "Traduire les insights des enquêtes en plans d'action au niveau équipe et entreprise ; suivre la mise en œuvre."
    source_hash: sha256-952715be78e361e8
  BP-1020.70.30:
    name: "Opérer les programmes de reconnaissance"
    description: "Conduire les programmes de reconnaissance peer-to-peer et manager ; suivre la participation et l'impact sur l'engagement."
    source_hash: sha256-2f1b11504ae2ac03
  BP-1020.70.40:
    name: "Soutenir le bien-être collaborateur"
    description: "Opérer les programmes de wellbeing — EAP, santé mentale, bien-être financier, ergonomie — et répondre aux escalades."
    source_hash: sha256-04c0e83acf6247b0
  BP-1020.80:
    name: "Mobilité interne et carrière"
    description: "Opérer le marketplace interne d'emplois, la planification de la succession et la gestion des parcours de carrière."
    source_hash: sha256-993c916a1d85bec6
  BP-1020.80.10:
    name: "Opérer le marketplace interne d'emplois"
    description: "Publier les rôles internes, gérer les candidatures internes et conduire les entretiens face aux candidats internes."
    source_hash: sha256-43393d28f6a60618
  BP-1020.80.20:
    name: "Conduire la planification de la succession"
    description: "Identifier les successeurs pour les rôles critiques, évaluer leur readiness et construire les mouvements de développement pour combler les écarts."
    source_hash: sha256-1fdfca6245f60e37
  BP-1020.80.30:
    name: "Gérer les parcours de carrière"
    description: "Maintenir les frameworks de parcours de carrière, les critères de progression de rôle et les guidelines de mobilité interne pour managers et collaborateurs."
    source_hash: sha256-dfdd52489ff5725d
  BP-1020.90:
    name: "Offboarding et alumni"
    description: "Gérer les départs collaborateurs — volontaires, involontaires, retraite — et opérer le programme alumni."
    source_hash: sha256-22e8c08197f922e3
  BP-1020.90.10:
    name: "Traiter démission ou rupture"
    description: "Capturer et traiter la séparation — démission, licenciement, rupture économique, retraite — via le workflow d'offboarding."
    source_hash: sha256-a125a10cab774080
  BP-1020.90.20:
    name: "Conduire l'entretien de départ"
    description: "Conduire l'entretien de départ pour capturer les apprentissages et le feedback ; intégrer dans les insights d'engagement et de rétention."
    source_hash: sha256-e9c23ee30af51824
  BP-1020.90.30:
    name: "Récupérer équipement et accès"
    description: "Récupérer ordinateur portable, badge, identifiants système et tout équipement spécifique au rôle au dernier jour de travail."
    source_hash: sha256-4c346ccd2649f029
  BP-1020.90.40:
    name: "Opérer le réseau alumni"
    description: "Maintenir le réseau alumni pour ré-embauche, recommandations et communauté ; conduire un engagement périodique."
    source_hash: sha256-d66212468362c119
