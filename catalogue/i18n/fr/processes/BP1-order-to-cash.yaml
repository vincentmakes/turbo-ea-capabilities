kind: business-process
locale: fr
source: BP1-order-to-cash.yaml
entries:
  BP-1000:
    name: "Commande-à-Encaissement"
    description: "Cycle de revenus de bout en bout : de la captation du lead jusqu'au devis, à la contractualisation et la prise de commande (avec contrôle de crédit), à la promesse et à l'allocation, à la production ou à l'exécution du service, à la logistique sortante, à la facturation client, à l'encaissement et à l'imputation des paiements, et à la reconnaissance du revenu. Un BP2 par étape de VS-390 ; les BP3 décomposent le travail en activités opérationnelles à voix verbale."
  BP-1000.10:
    name: "Captation et qualification de leads"
    description: "Capter l'intérêt des prospects, l'enrichir avec des données firmographiques et comportementales, le scorer face aux critères du profil client idéal, et router les leads qualifiés vers les ventes."
  BP-1000.10.10:
    name: "Capter le lead entrant"
    description: "Recevoir l'intérêt entrant des prospects via formulaires web, événements, références partenaires ou prospection sortante, et le persister sous forme d'enregistrement de lead."
  BP-1000.10.20:
    name: "Enrichir les données du lead"
    description: "Augmenter le lead avec des données firmographiques, technographiques et comportementales issues de sources internes et tierces afin de permettre le scoring et le routage."
  BP-1000.10.30:
    name: "Scorer et qualifier le lead"
    description: "Appliquer un modèle de scoring (adéquation + intention) pour qualifier le lead en Marketing-Qualified ou Sales-Qualified, ou le disqualifier et le recycler."
  BP-1000.10.40:
    name: "Router le lead vers les ventes"
    description: "Affecter le lead qualifié au territoire commercial, au rôle ou au partenaire approprié selon les règles de routage et les SLA."
  BP-1000.20:
    name: "Devis et configuration"
    description: "Configurer la solution client, la valoriser selon les règles de remise approuvées et émettre un devis que le client peut accepter."
  BP-1000.20.10:
    name: "Configurer la solution client"
    description: "Traduire les exigences client en un bundle de produit ou de service configuré, en validant la compatibilité et la faisabilité face au catalogue d'offres."
  BP-1000.20.20:
    name: "Calculer le prix du devis"
    description: "Appliquer le prix de liste, les remises contractuelles, les promotions, les règles de devise et de fiscalité pour produire le total du devis ligne à ligne."
  BP-1000.20.30:
    name: "Soumettre le devis pour approbation"
    description: "Router le devis dans le workflow d'approbation des remises et des marges lorsque les seuils requièrent une validation, en capturant les décisions des approbateurs."
  BP-1000.20.40:
    name: "Émettre le devis au client"
    description: "Délivrer le devis approuvé au client avec ses conditions, sa durée de validité et les instructions d'acceptation ; suivre le statut du devis jusqu'à la décision."
  BP-1000.30:
    name: "Contractualisation et prise de commande"
    description: "Négocier et exécuter le contrat, exécuter le contrôle de crédit client et enregistrer la commande de vente ferme."
  BP-1000.30.10:
    name: "Négocier les termes du contrat"
    description: "Négocier les conditions commerciales, niveaux de service, indemnités et responsabilités ; redliner le contrat jusqu'à acceptation des deux parties."
  BP-1000.30.20:
    name: "Vérifier le crédit client"
    description: "Exécuter le contrôle de crédit du client (historique de crédit interne + bureau externe le cas échéant), définir ou confirmer la limite de crédit et autoriser la commande au regard du crédit disponible."
  BP-1000.30.30:
    name: "Exécuter le contrat"
    description: "Capturer les signatures du client et du signataire autorisé, persister le contrat exécuté dans le référentiel de contrats et déclencher la prise de commande en aval."
  BP-1000.30.40:
    name: "Saisir la commande client"
    description: "Convertir le contrat exécuté ou le devis accepté en une commande de vente ferme dans le système de gestion des commandes ; valider la complétude et la faisabilité avant validation."
  BP-1000.40:
    name: "Promesse de commande et allocation"
    description: "Promettre la date de livraison, allouer le stock ou la capacité et planifier la commande pour exécution."
  BP-1000.40.10:
    name: "Promettre la date de livraison"
    description: "Exécuter les contrôles available-to-promise / capable-to-promise face au stock, à l'approvisionnement et à la capacité afin d'engager une date de livraison fiable pour le client."
  BP-1000.40.20:
    name: "Allouer le stock à la commande"
    description: "Réserver un stock spécifique (lots, numéros de série, emplacements) sur la commande ; résoudre les conflits d'allocation lorsque l'approvisionnement est contraint."
  BP-1000.40.30:
    name: "Réserver la capacité de production"
    description: "Pour les commandes make-to-order ou assemble-to-order, réserver la ligne de production et l'approvisionnement en composants nécessaires pour tenir la date promise."
  BP-1000.40.40:
    name: "Libérer la commande à l'exécution"
    description: "Transmettre la commande allouée et planifiée à la production ou à l'exécution entrepôt avec toutes les instructions de routage."
  BP-1000.50:
    name: "Production / exécution du service"
    description: "Exécuter l'ordre de fabrication ou réaliser la prestation de service afin de satisfaire la commande client."
  BP-1000.50.10:
    name: "Émettre l'ordre de fabrication"
    description: "Générer l'ordre de fabrication face à la capacité réservée, incluant la nomenclature, le routing et les points de contrôle qualité."
  BP-1000.50.20:
    name: "Exécuter la production make-to-order"
    description: "Réaliser la production selon les spécifications sur la ligne planifiée, en enregistrant la consommation de main-d'œuvre, de machine et de matières."
  BP-1000.50.30:
    name: "Délivrer le service au client"
    description: "Pour les commandes de service, exécuter la mission selon le statement of work, en capturant le temps, les jalons et les livrables."
  BP-1000.50.40:
    name: "Confirmer la complétion de la commande"
    description: "Clôturer l'ordre de fabrication ou la mission de service avec validation qualité ; déclencher la facturation et la reconnaissance du revenu en aval."
  BP-1000.60:
    name: "Logistique sortante"
    description: "Picker, emballer et expédier la commande ; gérer le transport sortant et confirmer la livraison au client."
  BP-1000.60.10:
    name: "Picker, emballer et expédier la commande"
    description: "Picker le stock alloué, emballer en condition prête à l'expédition avec la documentation et remettre au transporteur."
  BP-1000.60.20:
    name: "Gérer le transport sortant"
    description: "Planifier le fret, sélectionner le transporteur, générer les étiquettes d'expédition et la documentation douanière, et expédier le chargement."
  BP-1000.60.30:
    name: "Suivre l'expédition vers le client"
    description: "Surveiller le statut en transit, gérer les exceptions (retard, dommage, erreur de routage) et tenir le client informé."
  BP-1000.60.40:
    name: "Confirmer la livraison au client"
    description: "Capturer la preuve de livraison, clore l'expédition et déclencher la facturation en aval lorsque la facturation est basée sur la livraison."
  BP-1000.70:
    name: "Facturation client"
    description: "Générer la facture client avec taxes et remises, l'émettre via le canal préféré du client et gérer les éventuels litiges."
  BP-1000.70.10:
    name: "Générer la facture client"
    description: "Construire la facture à partir des données de commande, de livraison et de contrat ; valider la complétude et l'arithmétique avant émission."
  BP-1000.70.20:
    name: "Appliquer taxes et remises"
    description: "Appliquer les taxes juridictionnelles (TVA/GST/sales tax), retenues à la source et remises contractuelles aux lignes de la facture."
  BP-1000.70.30:
    name: "Émettre la facture au client"
    description: "Délivrer la facture via le canal préféré du client (portail e-invoicing, EDI, e-mail, papier) et persister la piste d'audit."
  BP-1000.70.40:
    name: "Gérer les litiges de facture"
    description: "Recevoir, instruire et résoudre les litiges client portant sur le contenu de la facture ; émettre des avoirs ou des révisions lorsque cela se justifie."
  BP-1000.80:
    name: "Encaissement et imputation"
    description: "Collecter les paiements clients via le cycle de relance, imputer les encaissements aux factures et poursuivre les soldes en retard."
  BP-1000.80.10:
    name: "Envoyer les rappels de paiement"
    description: "Exécuter le cycle de relance — rappels automatiques aux intervalles définis par la politique à mesure que les factures approchent et dépassent l'échéance."
  BP-1000.80.20:
    name: "Recevoir le paiement client"
    description: "Accepter le paiement via l'instrument choisi par le client (virement, ACH, carte, chèque, e-paiement) et persister l'encaissement."
  BP-1000.80.30:
    name: "Imputer le paiement à la facture"
    description: "Rapprocher l'encaissement avec la ou les factures ouvertes, allouer ligne à ligne en cas de paiement partiel et clore la créance."
  BP-1000.80.40:
    name: "Gérer le recouvrement client"
    description: "Poursuivre les soldes en retard via l'échelle de relance (collecteur, agence de recouvrement, passage en perte / provisionnement pour créances douteuses)."
  BP-1000.90:
    name: "Reconnaissance du revenu"
    description: "Comptabiliser le revenu acquis selon la norme comptable applicable (IFRS 15 / ASC 606), différer le revenu non acquis et réconcilier au sous-grand livre."
  BP-1000.90.10:
    name: "Comptabiliser le revenu acquis"
    description: "Appliquer le modèle en cinq étapes IFRS 15 / ASC 606 pour reconnaître le revenu au point dans le temps approprié ou sur la durée du contrat."
  BP-1000.90.20:
    name: "Différer le revenu non acquis"
    description: "Parquer les montants facturés mais non encore acquis dans les comptes de revenus différés, en libérant à mesure que l'obligation de prestation est satisfaite."
  BP-1000.90.30:
    name: "Réconcilier le revenu au sous-grand livre"
    description: "Réconcilier le grand livre des revenus avec la comptabilité client et les systèmes de commande/facturation ; résoudre les écarts avant la clôture de période."
  BP-1000.90.40:
    name: "Reporter la performance du revenu"
    description: "Produire le reporting des revenus (reconnus, différés, backlog) pour le management, la clôture financière et la communication externe."
