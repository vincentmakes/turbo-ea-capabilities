kind: business-process
locale: fr
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Stratégie-à-Exécution"
    description: "Cycle de livraison de la stratégie de bout en bout, de la formulation de la stratégie à la définition du portefeuille, à la mise en place des programmes et projets, à la livraison et à la gouvernance, à l'adoption du changement et à la réalisation des bénéfices. Un BP2 par stage_name de VS-580."
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "Formulation de la stratégie"
    description: "Définir la stratégie d'entreprise — vision, objectifs, choix et le modèle opérationnel nécessaire pour gagner."
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "Définir la direction stratégique"
    description: "Définir vision, mission, objectifs stratégiques et les principes guidant les choix."
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "Faire les choix stratégiques"
    description: "Faire les choix where-to-play et how-to-win ; arbitrer les trade-offs entre marchés, segments, produits et capabilities."
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "Définir le modèle opérationnel"
    description: "Définir le modèle opérationnel — capabilities, organisation, localisations et partenaires — nécessaire pour exécuter la stratégie."
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "Définition du portefeuille"
    description: "Traduire la stratégie en portefeuille de programmes et d'investissements qui livreront les outcomes choisis."
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "Identifier les investissements du portefeuille"
    description: "Identifier les investissements candidats qui combleront les écarts stratégiques ; capturer valeur, coût, risque et dépendances."
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "Prioriser le portefeuille"
    description: "Prioriser les investissements par valeur, adéquation, capacité et risque ; bâtir le portefeuille intégré à travers les horizons."
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "Approuver le portefeuille"
    description: "Approuver et financer le portefeuille via le forum exécutif ; déclencher la mise en place des programmes et projets."
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "Mise en place des programmes et projets"
    description: "Mettre en place les programmes et projets avec charter, gouvernance, plan, équipe et budget."
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "Charter le programme"
    description: "Charter le programme — outcomes, périmètre, gouvernance, sponsor, redevabilités, critères de succès."
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "Planifier la livraison du programme"
    description: "Bâtir le plan de livraison intégré à travers les projets constitutifs, avec jalons, dépendances et ressourcement."
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "Mettre en place les équipes projet"
    description: "Constituer les équipes projet, confirmer les rôles, onboarder et déclencher le travail de sprint ou de phase zéro."
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "Livraison et gouvernance"
    description: "Livrer programmes et projets face au plan ; conduire la gouvernance pour faire ressortir le risque, décider le changement et assurer la qualité."
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "Exécuter le travail projet"
    description: "Exécuter le travail projet — design, build, test, livraison — selon la méthode de livraison choisie (agile, waterfall, hybride)."
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "Conduire la gouvernance du programme"
    description: "Conduire les comités de pilotage, forums de décision et gates qualité sous autorité de corporate governance d'entreprise ; faire ressortir et résoudre risques, issues et changements."
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "Gérer les risques et changements du programme"
    description: "Maintenir le registre des risques et le change log ; mitiger, escalader et décider les changements via la gouvernance."
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "Adoption du changement"
    description: "Piloter l'adoption end-user des changements livrés par le programme — communiquer, former, soutenir, ancrer."
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "Planifier l'adoption du changement"
    description: "Bâtir le plan d'adoption du changement — cartographie des parties prenantes, communication, formation, soutien, durabilité."
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "Communiquer et former"
    description: "Conduire les communications et la formation à travers la population impactée selon le plan d'adoption du changement."
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "Soutenir l'adoption"
    description: "Fournir un soutien hyper-care, faire ressortir les blockers d'adoption et conduire les activités de renforcement."
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "Réalisation des bénéfices"
    description: "Suivre et capturer les bénéfices stratégiques que le programme s'est engagé à livrer ; clôturer le programme."
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "Suivre les métriques de bénéfices"
    description: "Suivre les bénéfices engagés — revenu, coût, NPS, throughput — face à la baseline et à la cible."
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "Capturer les bénéfices"
    description: "Capturer les bénéfices dans le business-as-usual — encastrer dans les budgets, KPI et processus run-the-business."
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "Clôturer le programme"
    description: "Clôturer le programme — rapport final, retours d'expérience, archivage, libération de l'équipe ; déclencher les mouvements de portefeuille de suivi."
    source_hash: sha256-25c19e1849fe48b3
