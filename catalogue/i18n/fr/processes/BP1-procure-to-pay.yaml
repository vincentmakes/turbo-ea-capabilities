kind: business-process
locale: fr
source: BP1-procure-to-pay.yaml
entries:
  BP-1010:
    name: "Achat-à-Paiement"
    description: "Cycle de dépense côté fournisseur de bout en bout, de l'identification du besoin au sourcing, à la sélection du fournisseur, au contrat et au bon de commande, à la réception des biens ou services, au traitement de facture, au paiement, à la réconciliation et au pilotage de la performance fournisseur. Un BP2 par stage_name de VS-420."
  BP-1010.10:
    name: "Identification du besoin et requisition"
    description: "Capter, valider et approuver la demande interne de biens ou de services et la traduire en demande d'achat."
  BP-1010.10.10:
    name: "Identifier le besoin d'achat"
    description: "Capter la demande métier pour un bien ou un service auprès de la fonction demandeuse et confirmer que les alternatives internes ont été considérées."
  BP-1010.10.20:
    name: "Spécifier les exigences"
    description: "Convertir le besoin en une spécification claire — quantité, qualité, niveau de service, contraintes de livraison — sur laquelle les fournisseurs peuvent répondre."
  BP-1010.10.30:
    name: "Créer la demande d'achat"
    description: "Créer la demande d'achat dans le système d'approvisionnement, attribuer l'imputation budgétaire et la soumettre à l'approbation."
  BP-1010.10.40:
    name: "Approuver la demande d'achat"
    description: "Router la demande d'achat dans la hiérarchie d'autorisation de dépense ; capturer les décisions et les rejets des approbateurs avec leurs motifs."
  BP-1010.20:
    name: "Sourcing"
    description: "Sélectionner la stratégie de sourcing, lancer les événements de sourcing (RFx), évaluer les réponses et attribuer le marché."
  BP-1010.20.10:
    name: "Développer la stratégie de sourcing par catégorie"
    description: "Confirmer la stratégie de catégorie — make-vs-buy, mono-source vs multi-source, contraintes géographiques — qui cadre cet événement de sourcing."
  BP-1010.20.20:
    name: "Lancer l'événement de sourcing"
    description: "Émettre RFI/RFP/RFQ aux fournisseurs qualifiés, gérer les Q&R et collecter les réponses dans les délais."
  BP-1010.20.30:
    name: "Évaluer les réponses fournisseurs"
    description: "Coter les réponses face aux critères d'évaluation publiés — coût total de possession, qualité, capacité, durabilité, risque."
  BP-1010.20.40:
    name: "Négocier l'attribution du marché"
    description: "Conduire les rounds de négociation best-and-final avec les fournisseurs en short-list et finaliser la décision d'attribution et son rationnel."
  BP-1010.30:
    name: "Sélection et onboarding du fournisseur"
    description: "Qualifier le fournisseur retenu, exécuter les contrôles de risque et de conformité et l'onboarder dans les données maîtres fournisseur et les systèmes opérationnels."
  BP-1010.30.10:
    name: "Conduire la due diligence fournisseur"
    description: "Exécuter les contrôles financiers, réglementaires, de sanctions, ESG et cybersécurité sur le fournisseur retenu et documenter les risques résiduels."
  BP-1010.30.20:
    name: "Qualifier le fournisseur"
    description: "Confirmer que le fournisseur satisfait les critères de qualification de la catégorie — certifications, assurances, normes qualité — avant de poursuivre l'onboarding."
  BP-1010.30.30:
    name: "Mettre en place les données maîtres fournisseur"
    description: "Persister les coordonnées bancaires, fiscales, postales et de contact du fournisseur dans la base maîtres avec les contrôles de stewardship appropriés."
  BP-1010.30.40:
    name: "Onboarder le fournisseur dans les systèmes"
    description: "Provisionner le fournisseur dans le P2P, l'EDI/portail et tout système spécifique à la catégorie ; exécuter les tests d'intégration sur les transactions."
  BP-1010.40:
    name: "Contrat et bon de commande"
    description: "Exécuter le contrat fournisseur et convertir les demandes d'achat approuvées en bons de commande sur lesquels le fournisseur peut livrer."
  BP-1010.40.10:
    name: "Négocier le contrat fournisseur"
    description: "Négocier les termes commerciaux, juridiques et opérationnels — prix, SLA, indemnités, gestion du changement — et capturer les redlines jusqu'à exécution."
  BP-1010.40.20:
    name: "Exécuter le contrat fournisseur"
    description: "Capturer les signatures autorisées, persister le contrat exécuté dans le référentiel de contrats et le lier aux données maîtres fournisseur."
  BP-1010.40.30:
    name: "Émettre le bon de commande"
    description: "Convertir la demande d'achat approuvée (sous contrat exécuté ou bon de commande ponctuel) en bon de commande ferme et le transmettre au fournisseur."
  BP-1010.40.40:
    name: "Gérer les changements de bon de commande"
    description: "Traiter les changements demandés par le fournisseur ou par l'acheteur — quantité, date, prix — via le workflow de change-control des bons de commande."
  BP-1010.50:
    name: "Réception des biens/services"
    description: "Recevoir les biens ou services, vérifier la quantité et la qualité face au bon de commande et comptabiliser la réception pour le rapprochement de facture en aval."
  BP-1010.50.10:
    name: "Réceptionner les biens ou services"
    description: "Prendre la réception physique des biens au quai, ou valider l'achèvement des services rendus, et capturer la preuve de livraison."
  BP-1010.50.20:
    name: "Inspecter quantité et qualité"
    description: "Vérifier la quantité, l'état et la conformité à la spécification du bon de commande ; émettre des rapports de non-conformité en cas d'écart."
  BP-1010.50.30:
    name: "Comptabiliser la réception des biens"
    description: "Comptabiliser la réception dans l'ERP, libérant le stock ou la reconnaissance des charges et permettant le rapprochement à trois voies des factures."
  BP-1010.50.40:
    name: "Résoudre les exceptions de réception"
    description: "Gérer les écarts, dommages ou litiges sur l'achèvement de service avec le fournisseur ; convenir des ajustements avant acceptation de la facture."
  BP-1010.60:
    name: "Réception et contrôle de la facture"
    description: "Recevoir la facture fournisseur, exécuter le rapprochement à trois voies face au bon de commande et à la réception, et résoudre les écarts."
  BP-1010.60.10:
    name: "Recevoir la facture fournisseur"
    description: "Capturer la facture fournisseur via e-invoicing, EDI, portail ou papier ; persister avec les métadonnées du système source."
  BP-1010.60.20:
    name: "Rapprocher facture, bon de commande et réception"
    description: "Exécuter le rapprochement à trois voies face au bon de commande et à la réception ; router les exceptions vers les comptes fournisseurs pour résolution avant autorisation de paiement."
  BP-1010.60.30:
    name: "Résoudre les écarts de facture"
    description: "Investiguer les écarts de prix, de quantité ou de termes avec l'acheteur et le fournisseur ; capturer les avoirs ou ajustements avant approbation."
  BP-1010.60.40:
    name: "Approuver la facture pour paiement"
    description: "Router la facture rapprochée dans toute approbation requise (seuil CFO, validation projet) et l'autoriser au paiement."
  BP-1010.70:
    name: "Exécution du paiement"
    description: "Exécuter le paiement fournisseur via l'instrument retenu et envoyer l'avis de règlement au fournisseur."
  BP-1010.70.10:
    name: "Planifier la campagne de paiement"
    description: "Grouper les factures approuvées en une campagne de paiement par échéance, devise et instrument ; optimiser la captation d'escomptes et la trésorerie."
  BP-1010.70.20:
    name: "Exécuter le paiement"
    description: "Décaisser via virement, ACH, carte virtuelle, chèque ou e-paiement ; persister les confirmations bancaires de la trésorerie."
  BP-1010.70.30:
    name: "Envoyer l'avis de règlement"
    description: "Notifier le fournisseur du paiement avec le détail ligne à ligne afin qu'il puisse l'imputer sur ses créances ouvertes."
  BP-1010.80:
    name: "Réconciliation"
    description: "Réconcilier le sous-grand livre des comptes fournisseurs avec le grand livre et la banque, en résolvant les écarts avant la clôture de période."
  BP-1010.80.10:
    name: "Réconcilier les comptes fournisseurs avec le grand livre"
    description: "Reporter le sous-grand livre des comptes fournisseurs et réconcilier les soldes avec les comptes de contrôle du grand livre, en investiguant tout écart."
  BP-1010.80.20:
    name: "Réconcilier les paiements avec la banque"
    description: "Rapprocher les campagnes de paiement avec les relevés bancaires ; investiguer les chèques non encaissés, ACH retournés, timing FX et écarts de frais bancaires."
  BP-1010.80.30:
    name: "Résoudre les écarts de réconciliation"
    description: "Tracer les écarts à la cause racine — paiement en double, écriture mal imputée, avoir fournisseur non appliqué — et passer les écritures de correction."
  BP-1010.90:
    name: "Pilotage de la performance fournisseur"
    description: "Suivre la performance fournisseur face aux SLA et KPI contractuels, exécuter les scorecards et gérer les actions correctives."
  BP-1010.90.10:
    name: "Suivre les KPI fournisseur"
    description: "Collecter les données opérationnelles sur la qualité, le on-time delivery, le taux de service et l'atteinte des SLA ; persister pour la génération de scorecards."
  BP-1010.90.20:
    name: "Émettre la scorecard fournisseur"
    description: "Produire et partager la scorecard fournisseur périodique avec le fournisseur et le category management interne ; capturer le feedback du fournisseur."
  BP-1010.90.30:
    name: "Gérer les actions correctives fournisseur"
    description: "Ouvrir, suivre et clôturer les plans d'action correctifs avec les fournisseurs sous-performants ; escalader vers les remèdes contractuels en cas de manquement persistant."
