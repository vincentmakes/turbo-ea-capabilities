kind: business-process
locale: fr
source: BP1-audit-to-action.yaml
entries:
  BP-1120:
    name: "Audit-à-Action"
    description: "Cycle d'audit interne, de la planification de l'univers d'audit au cadrage de la mission, aux travaux sur le terrain, aux constats, au suivi de la remédiation et à l'assurance qualité de l'audit. Un BP2 par stage_name de VS-80."
  BP-1120.10:
    name: "Univers et plan d'audit"
    description: "Maintenir l'univers d'audit et bâtir le plan d'audit annuel basé sur le risque."
  BP-1120.10.10:
    name: "Maintenir l'univers d'audit"
    description: "Maintenir la population des entités auditables — processus, systèmes, sites, tierces parties."
  BP-1120.10.20:
    name: "Bâtir le plan d'audit basé sur le risque"
    description: "Bâtir le plan d'audit annuel à partir de l'univers pondéré par le risque ; obtenir l'approbation du comité d'audit."
  BP-1120.20:
    name: "Cadrage de la mission"
    description: "Cadrer la mission d'audit — objectifs, contrôles dans le périmètre, période, ressources."
  BP-1120.20.10:
    name: "Définir les objectifs d'audit"
    description: "Définir les objectifs d'audit, les questions clés et les risques à adresser dans la mission."
  BP-1120.20.20:
    name: "Planifier les procédures d'audit"
    description: "Planifier les procédures d'audit — walk-throughs, tests par échantillonnage, analytique — et les preuves requises."
  BP-1120.30:
    name: "Travaux sur le terrain"
    description: "Exécuter les travaux d'audit sur le terrain — recueillir les preuves, exécuter les tests et documenter les feuilles de travail."
  BP-1120.30.10:
    name: "Parcourir le processus"
    description: "Parcourir le processus dans le périmètre pour comprendre la conception et les contrôles clés ; documenter le narratif et le flowchart."
  BP-1120.30.20:
    name: "Tester les contrôles et les transactions"
    description: "Exécuter les tests d'efficacité de conception et opérationnelle par échantillonnage ou sur la population ; documenter les feuilles de travail."
  BP-1120.30.30:
    name: "Exécuter l'analytique d'audit"
    description: "Exécuter l'analytique de données sur la population complète pour faire ressortir anomalies, exceptions et motifs."
  BP-1120.30.40:
    name: "Documenter les preuves d'audit"
    description: "Documenter les preuves dans les feuilles de travail avec références croisées ; obtenir les confirmations des audités si requis."
  BP-1120.40:
    name: "Constats et reporting"
    description: "Développer les constats, convenir des réponses de la direction et émettre le rapport d'audit."
  BP-1120.40.10:
    name: "Développer les constats"
    description: "Développer les constats avec condition, critère, cause, conséquence et recommandation."
  BP-1120.40.20:
    name: "Convenir des réponses de la direction"
    description: "Convenir de la réponse de la direction — accepter, action alternative, contester — avec les audités et la date cible de remédiation."
  BP-1120.40.30:
    name: "Émettre le rapport d'audit"
    description: "Émettre le rapport d'audit final au sponsor exécutif et au comité d'audit ; clôturer la mission."
  BP-1120.50:
    name: "Suivi de la remédiation"
    description: "Suivre la remédiation des constats par la direction jusqu'à la clôture ; vérifier par re-test le cas échéant."
  BP-1120.50.10:
    name: "Suivre le statut de la remédiation"
    description: "Suivre les constats d'audit ouverts, les dates cibles et l'avancement de la direction face au plan de remédiation."
  BP-1120.50.20:
    name: "Vérifier la clôture"
    description: "Vérifier la clôture du constat par re-test, revue de preuves ou audit de suivi ; clôturer dans le tracker."
  BP-1120.60:
    name: "Assurance qualité de l'audit"
    description: "Conduire l'assurance qualité sur la fonction audit — revue des feuilles de travail, peer review, évaluation externe."
  BP-1120.60.10:
    name: "Réviser les feuilles de travail d'audit"
    description: "Conduire la revue de supervision des feuilles de travail et des constats pour preuves suffisantes et appropriées."
  BP-1120.60.20:
    name: "Conduire l'évaluation externe de qualité"
    description: "Conduire l'évaluation externe périodique de qualité de la fonction audit selon les Standards IIA."
