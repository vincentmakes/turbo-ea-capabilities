kind: business-process
locale: fr
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Risque-à-Mitigation"
    description: "Cycle de gestion des risques d'entreprise, du cadrage de l'appétence au risque à l'identification, à l'évaluation, au traitement, à la surveillance et au reporting des risques. Un BP2 par stage_name de VS-500."
  BP-1110.10:
    name: "Appétence et cadre de risque"
    description: "Définir l'appétence au risque et les tolérances ; définir le cadre, la taxonomie et la gouvernance de la gestion des risques d'entreprise."
  BP-1110.10.10:
    name: "Définir l'appétence au risque"
    description: "Définir les énoncés d'appétence au risque d'entreprise et les seuils de tolérance par catégorie de risque ; ratifier avec le conseil."
  BP-1110.10.20:
    name: "Définir le cadre de risque"
    description: "Définir le cadre ERM — taxonomie, forums de gouvernance, rôles, cycle de vie — sous COSO ERM et ISO 31000."
  BP-1110.20:
    name: "Identification des risques"
    description: "Identifier les risques d'entreprise à travers les domaines stratégiques, opérationnels, financiers, réglementaires et émergents."
  BP-1110.20.10:
    name: "Animer des ateliers de risque"
    description: "Animer des ateliers structurés pour faire ressortir les risques à travers le business avec owners et SME."
  BP-1110.20.20:
    name: "Scanner les risques externes"
    description: "Scanner les sources externes — réglementaires, marché, géopolitiques, environnementales — à la recherche de signaux de risque émergents."
  BP-1110.20.30:
    name: "Constituer l'inventaire des risques"
    description: "Persister les risques identifiés dans le registre des risques d'entreprise avec owner, catégorie et évaluation initiale."
  BP-1110.30:
    name: "Évaluation des risques"
    description: "Évaluer les risques identifiés pour la vraisemblance, l'impact et la vélocité ; coter le risque inhérent et résiduel."
  BP-1110.30.10:
    name: "Coter vraisemblance et impact"
    description: "Coter la vraisemblance et l'impact de chaque risque selon des méthodes qualitatives et quantitatives conformes au cadre."
  BP-1110.30.20:
    name: "Évaluer le risque inhérent et résiduel"
    description: "Calculer la cotation de risque inhérent et, après considération des contrôles existants, la cotation résiduelle."
  BP-1110.30.30:
    name: "Prioriser les risques"
    description: "Prioriser les risques à traiter sur la base de la cotation résiduelle, de l'appétence et de la pertinence stratégique."
  BP-1110.40:
    name: "Traitement et conception des contrôles"
    description: "Décider le traitement — accepter, éviter, mitiger, transférer — et concevoir ou renforcer les contrôles."
  BP-1110.40.10:
    name: "Décider le traitement du risque"
    description: "Décider le traitement par risque — accepter, éviter, mitiger, transférer (assurance, contractuel, hedging)."
  BP-1110.40.20:
    name: "Concevoir les contrôles"
    description: "Concevoir ou renforcer les contrôles — préventifs, détectifs, correctifs — pour ramener le risque résiduel dans l'appétence."
  BP-1110.40.30:
    name: "Mettre en œuvre le plan de traitement"
    description: "Mettre en œuvre le plan de traitement ; assigner owners, échéances et preuves de vérification."
  BP-1110.50:
    name: "Surveillance"
    description: "Surveiller risques et contrôles — suivi des KRI, test des contrôles, surveillance des motifs d'incidents."
  BP-1110.50.10:
    name: "Suivre les indicateurs clés de risque"
    description: "Suivre les KRI et signaux de risque émergents ; déclencher seuils et routes d'escalade."
  BP-1110.50.20:
    name: "Tester les contrôles"
    description: "Tester l'efficacité de design et opérationnelle des contrôles ; coter les exceptions ; piloter la remédiation."
  BP-1110.50.30:
    name: "Surveiller les motifs d'incidents"
    description: "Surveiller les motifs d'incidents, near-miss et événements de perte ; affiner en conséquence les vues de risque et de contrôle."
  BP-1110.60:
    name: "Reporting et escalade"
    description: "Reporter le risque d'entreprise aux forums exécutifs, au conseil et aux régulateurs ; escalader les dépassements."
  BP-1110.60.10:
    name: "Produire le rapport de risque"
    description: "Produire le rapport périodique de risque d'entreprise — dashboards, heat-maps, narratifs des top risques."
  BP-1110.60.20:
    name: "Briefer la direction et le conseil"
    description: "Briefer le comité risque exécutif et le comité risque du conseil ; capturer les décisions et orientations."
  BP-1110.60.30:
    name: "Escalader les dépassements"
    description: "Escalader les dépassements d'appétence et les incidents à forte vélocité selon le protocole ; notifier les régulateurs si requis."
