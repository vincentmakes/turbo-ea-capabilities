kind: business-process
locale: fr
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-à-Publication"
    description: "Cycle de reporting de durabilité, de la stratégie ESG et de la matérialité à la collecte de données, à la qualité des données et à l'assurance, au reporting et à la publication, à l'engagement des parties prenantes et aux objectifs d'amélioration. Un BP2 par stage_name de VS-200."
    source_hash: sha256-66d60ef4b72a8d5f
  BP-1130.10:
    name: "Stratégie ESG et matérialité"
    description: "Définir l'ambition ESG et conduire l'évaluation de double matérialité pour se concentrer sur ce qui compte."
    source_hash: sha256-59d591c8d59454a6
  BP-1130.10.10:
    name: "Définir l'ambition ESG"
    description: "Définir l'ambition ESG et la lier à la stratégie d'entreprise ; s'engager sur les objectifs net-zero, sociaux et de gouvernance."
    source_hash: sha256-5fa74157442208e6
  BP-1130.10.20:
    name: "Conduire l'évaluation de double matérialité"
    description: "Conduire l'évaluation de double matérialité pour identifier les sujets matériels — matérialité financière et matérialité d'impact."
    source_hash: sha256-4c2d2749ad94da76
  BP-1130.20:
    name: "Collecte de données"
    description: "Collecter les données ESG — émissions, énergie, eau, déchets, social, gouvernance — à travers la chaîne de valeur."
    source_hash: sha256-0c21f34aa6281b15
  BP-1130.20.10:
    name: "Collecter les données environnementales"
    description: "Collecter les données d'émissions (scopes 1/2/3), énergie, eau, déchets, biodiversité et pollution issues des opérations."
    source_hash: sha256-b7ce2922da1bda78
  BP-1130.20.20:
    name: "Collecter les données sociales"
    description: "Collecter les données effectifs, santé-sécurité, diversité, communauté et droits humains selon les sujets matériels."
    source_hash: sha256-4e7113198459286a
  BP-1130.20.30:
    name: "Collecter les données de gouvernance"
    description: "Collecter les données de gouvernance — composition du conseil, éthique, anti-corruption, rémunération des dirigeants, conduite fournisseurs."
    source_hash: sha256-e6cf111543dc7f20
  BP-1130.20.40:
    name: "Collecter les données de la chaîne de valeur"
    description: "Collecter les données upstream et downstream de la chaîne de valeur — émissions fournisseurs, phase d'usage produit, fin de vie."
    source_hash: sha256-0af74fa019d57c4d
  BP-1130.30:
    name: "Qualité des données et assurance"
    description: "Conduire les contrôles de qualité de données et obtenir l'assurance externe sur les données publiées."
    source_hash: sha256-f9693fa74569cc51
  BP-1130.30.10:
    name: "Exécuter les contrôles qualité des données ESG"
    description: "Exécuter les contrôles de complétude, exactitude, cohérence et traçabilité sur les données ESG."
    source_hash: sha256-7017be162f9deabf
  BP-1130.30.20:
    name: "Obtenir l'assurance externe"
    description: "Engager un prestataire d'assurance pour une assurance limitée ou raisonnable sur les métriques publiées selon la norme applicable."
    source_hash: sha256-5f0c5838aacf550a
  BP-1130.40:
    name: "Reporting et publication"
    description: "Produire le rapport ESG et les publications réglementaires — CSRD/ESRS, SEC climate, GRI, SASB, TCFD, ISSB."
    source_hash: sha256-2d52a82565566693
  BP-1130.40.10:
    name: "Construire le pack de publication ESG"
    description: "Construire le pack de publication ESG — narratif, métriques, notes de bas de page, mappings vers les normes."
    source_hash: sha256-83bb85f5f8360240
  BP-1130.40.20:
    name: "Déposer les publications réglementaires"
    description: "Déposer les publications ESG / durabilité obligatoires — CSRD/ESRS, SEC climate, taxonomies juridictionnelles."
    source_hash: sha256-7c0fab2067dbeb32
  BP-1130.40.30:
    name: "Publier les frameworks volontaires"
    description: "Publier les publications volontaires — GRI, SASB, TCFD, CDP, ISSB — alignées sur les sujets matériels."
    source_hash: sha256-bd460ef4e53b9bd9
  BP-1130.50:
    name: "Engagement des parties prenantes"
    description: "Engager les parties prenantes — investisseurs, régulateurs, clients, collaborateurs, ONG, communautés — sur l'ESG."
    source_hash: sha256-b4049d33409ffab1
  BP-1130.50.10:
    name: "Engager investisseurs et analystes"
    description: "Engager les investisseurs orientés ESG et les agences de notation ; répondre aux questionnaires et ratings."
    source_hash: sha256-8756d4ffe0961ddf
  BP-1130.50.20:
    name: "Engager communautés et ONG"
    description: "Engager les communautés locales, ONG et parties prenantes de la société civile sur l'impact et la remédiation."
    source_hash: sha256-263f7bd55b5594a0
  BP-1130.60:
    name: "Objectifs d'amélioration"
    description: "Définir, suivre et ajuster les objectifs d'amélioration — émissions, social, gouvernance — à travers l'horizon."
    source_hash: sha256-06b57ef8ea29fa2b
  BP-1130.60.10:
    name: "Définir les objectifs d'amélioration"
    description: "Définir les science-based targets et autres objectifs d'amélioration ESG alignés sur l'ambition et les sujets matériels."
    source_hash: sha256-539bdc8cfd82ce5e
  BP-1130.60.20:
    name: "Suivre l'avancement des objectifs"
    description: "Suivre l'avancement face aux objectifs au cours du cycle ESG ; faire ressortir les gaps et décider de l'action corrective."
    source_hash: sha256-2286ebfa082ad915
