locale: fr
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Gestion de la planification et du développement d'infrastructure
    description: |
      Planification à long terme des réseaux et systèmes, études de faisabilité et
      développement des options, acquisition foncière et de tracés, autorisations et
      évaluation environnementale, et engagement des parties prenantes pour développer
      les projets d'infrastructure jusqu'au point de livraison.
    in_scope:
      - Planification à long terme des réseaux, de la capacité et spatiale
      - Études de faisabilité et développement des options et concepts
      - Acquisition de foncier, de tracés et de corridors et servitudes
      - Autorisations d'urbanisme et évaluation des impacts environnementaux
      - Engagement des parties prenantes, des communautés et des propriétaires fonciers
      - Planification de la durabilité, du carbone et de l'adaptation climatique
    out_of_scope:
      - Promotion immobilière (BC-4900)
      - Exécution de la construction (BC-5040)
      - Permis d'exploitation et approbations réglementaires (BC-5110)
      - Conception d'ingénierie détaillée et production BIM
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: "Planification des réseaux et systèmes"
    description: |
      Planification à long terme des réseaux et systèmes d'infrastructure pour
      répondre aux besoins prévisionnels de demande et de capacité.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Prévision de la demande
    description: |
      Prévision de la demande et de l'utilisation à long terme pour dimensionner les
      besoins futurs en infrastructure.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Planification de la capacité du réseau
    description: |
      Planification de la capacité des réseaux et systèmes pour combler les écarts
      entre la demande et l'offre disponible.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: "Planification spatiale et des corridors"
    description: |
      Planification spatiale et des corridors pour réserver le foncier et aligner les
      projets sur la politique d'aménagement du territoire.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Planification directrice
    description: |
      Élaboration de plans directeurs intégrés qui coordonnent les projets à travers
      un réseau ou une région.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: "Faisabilité et développement des options"
    description: |
      Évaluation de la faisabilité et développement des options et concepts pour les
      projets d'infrastructure candidats.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Études de faisabilité
    description: |
      Études établissant la faisabilité technique, économique et de livrabilité des
      projets candidats.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Développement des options
    description: |
      Développement et comparaison des options de projet au regard des objectifs et
      des contraintes.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Sélection du concept
    description: |
      Sélection du concept privilégié à porter en conception et en livraison.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Évaluation de la constructibilité
    description: |
      Évaluation de la constructibilité et du risque de livraison pour façonner des
      concepts de projet viables.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: "Gestion du foncier et des tracés"
    description: |
      Sélection et acquisition du foncier, des tracés et des droits d'accès
      nécessaires à la livraison des projets d'infrastructure.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: "Sélection des tracés et corridors"
    description: |
      Sélection des tracés et corridors qui équilibrent coût, impact et livrabilité.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: "Acquisition et assemblage foncier"
    description: |
      Acquisition et assemblage des parcelles foncières nécessaires à la livraison
      d'un projet.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: "Droits de passage et servitudes"
    description: |
      Obtention des droits de passage, servitudes et droits d'accès sur des terrains
      tiers.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Gestion de l'expropriation
    description: |
      Gestion de l'expropriation et de l'indemnisation associée pour sécuriser le
      foncier requis.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: "Autorisations et évaluation environnementale"
    description: |
      Obtention des autorisations d'urbanisme et réalisation des évaluations
      environnementales et patrimoniales pour les projets d'infrastructure.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Gestion des autorisations d'urbanisme
    description: |
      Gestion des demandes et autorisations d'urbanisme jusqu'à leur décision.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Évaluation des impacts environnementaux
    description: |
      Évaluation des impacts environnementaux et des mesures d'atténuation pour
      étayer les décisions d'autorisation.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: "Évaluation écologique et patrimoniale"
    description: |
      Évaluation des contraintes écologiques et patrimoniales affectant la conception
      et l'autorisation du projet.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Ordres d'autorisation de projet
    description: |
      Préparation et gestion des ordres d'autorisation de projet pour les grands
      projets d'infrastructure.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: "Engagement des parties prenantes et des communautés"
    description: |
      Engagement avec les communautés, les parties prenantes et les propriétaires
      fonciers pour construire l'adhésion et gérer les objections aux projets.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Consultation communautaire
    description: |
      Consultation des communautés affectées pour informer et façonner les
      propositions de projet.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: "Cartographie et engagement des parties prenantes"
    description: |
      Cartographie et engagement des parties prenantes tout au long du cycle de vie
      du projet.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Gestion des enquêtes publiques
    description: |
      Gestion des enquêtes et examens publics portant sur les propositions de projet.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: "Liaison avec les propriétaires et riverains"
    description: |
      Liaison avec les propriétaires fonciers et les riverains pour résoudre les
      préoccupations et obtenir leur coopération.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: "Planification de la durabilité et du climat"
    description: |
      Intégration de la durabilité, du carbone et de la résilience climatique dans la
      planification et la conception des projets d'infrastructure.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Planification du carbone sur le cycle de vie
    description: |
      Planification visant à réduire le carbone sur l'ensemble du cycle de vie de la
      conception et de la livraison du projet.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: "Planification de la biodiversité et du gain net"
    description: |
      Planification visant à protéger la biodiversité et à délivrer un gain net
      mesurable.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Planification de l'adaptation climatique
    description: |
      Planification de la résilience et de l'adaptation climatique des actifs
      d'infrastructure.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Normes de conception durable
    description: |
      Adoption de normes de conception durable et de cadres de notation pour les
      projets.
    source_hash: sha256-5942740434ce459c
