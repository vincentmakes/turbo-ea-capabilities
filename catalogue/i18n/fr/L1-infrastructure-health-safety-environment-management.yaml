locale: fr
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Gestion HSE de l'infrastructure
    description: |
      Gestion de la santé, de la sécurité et de l'environnement à travers la
      construction et l'exploitation d'infrastructure, couvrant les systèmes de
      management HSE, la sécurité de la construction, la santé au travail, la gestion
      environnementale, et la gestion des incidents et des urgences. Protège les
      personnes, les communautés et l'environnement pendant la livraison et
      l'exploitation des ouvrages et des actifs.
    in_scope:
      - Politique, systèmes de management, culture et compétence HSE
      - Sécurité de la construction sous CDM, permis et évaluation des risques
      - Surveillance de la santé au travail, accueil du personnel et bien-être
      - Contrôles environnementaux, prévention de la pollution et conformité aux autorisations
      - Protection de l'écologie et du patrimoine pendant les travaux
      - Déclaration, investigation des incidents et réponse d'urgence
    out_of_scope:
      - Environnement, santé et sécurité transverse (BC-720)
      - Résilience et sécurité opérationnelles (BC-5120)
      - Gestion de la qualité de la construction (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: Système de management HSE
    description: |
      Politique, normes, culture et compétence qui composent le système de management
      de la santé, de la sécurité et de l'environnement.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: "Politique et normes HSE"
    description: |
      Définition de la politique, des normes et des objectifs HSE à travers les
      activités d'infrastructure.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: Système de management HSE
    description: |
      Exploitation et amélioration continue du système de management HSE certifié.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: "Culture et comportement de sécurité"
    description: |
      Développement d'une culture de sécurité positive et de comportements sûrs au
      sein de la main-d'œuvre.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: "Compétence et formation HSE"
    description: |
      Assurance de la compétence, de la formation et de l'habilitation HSE du
      personnel.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Gestion de la sécurité de la construction
    description: |
      Gestion du risque de sécurité de la construction par la conception, les
      contrôles de chantier, les permis et les systèmes de travail sûrs.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: "CDM et gestion des risques de conception"
    description: |
      Gestion des obligations CDM et de la réduction des risques au stade de la
      conception.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Gestion de la sécurité de chantier
    description: |
      Gestion au jour le jour des contrôles de sécurité et de la supervision sur le
      chantier de construction.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Gestion des permis de travail
    description: |
      Contrôle des activités à haut risque par des systèmes de permis de travail.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: "Mode opératoire et évaluation des risques"
    description: |
      Préparation et contrôle des modes opératoires et des évaluations de risques par
      tâche pour une exécution sûre.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Gestion de la santé au travail
    description: |
      Protection de la santé de la main-d'œuvre par la surveillance, l'accueil,
      l'hygiène et la gestion du bien-être.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Surveillance de la santé au travail
    description: |
      Suivi de la santé et de l'aptitude de la main-d'œuvre au regard des expositions
      professionnelles.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Fourniture des installations d'accueil
    description: |
      Fourniture des installations et dispositions d'accueil pour la main-d'œuvre de
      chantier.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: "Surveillance des expositions et de l'hygiène"
    description: |
      Surveillance et contrôle des expositions professionnelles et de l'hygiène du
      lieu de travail.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: "Gestion de la fatigue et du bien-être"
    description: |
      Gestion de la fatigue, de la santé mentale et du bien-être au sein de la
      main-d'œuvre.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Gestion environnementale
    description: |
      Gestion des impacts, contrôles et autorisations environnementaux à travers la
      construction et l'exploitation.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Contrôles environnementaux
    description: |
      Mise en œuvre de contrôles qui limitent l'impact environnemental des travaux et
      de l'exploitation.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Prévention de la pollution
    description: |
      Prévention et contrôle de la pollution de l'air, de l'eau et des sols pendant
      les travaux.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Conformité aux autorisations environnementales
    description: |
      Conformité aux autorisations, permis et conditions de licence environnementaux.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: "Protection de l'écologie et du patrimoine"
    description: |
      Protection de l'écologie, de la biodiversité et des actifs patrimoniaux affectés
      par les travaux.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: "Gestion des incidents et des urgences"
    description: |
      Déclaration, investigation et réponse d'urgence pour les incidents HSE, avec
      suivi de la performance.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: "Déclaration et investigation des incidents"
    description: |
      Déclaration et investigation des incidents et presqu'accidents HSE.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Analyse des causes profondes
    description: |
      Analyse des causes sous-jacentes pour prévenir la récurrence des incidents.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Planification de la réponse d'urgence
    description: |
      Planification et préparation de la réponse d'urgence à travers les sites et les
      actifs.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: Suivi de la performance HSE
    description: |
      Suivi et reporting de la performance HSE et des indicateurs avancés.
    source_hash: sha256-fbf0f34769e795c3
