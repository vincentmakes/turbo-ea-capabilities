locale: fr
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Gestion du programme d'investissement et des contrôles de projet
    description: |
      Gouvernance et contrôles côté propriétaire et livraison pour les programmes et
      projets d'investissement en infrastructure, couvrant la configuration du
      programme, le contrôle des coûts et des délais, la valeur acquise, la gestion
      des risques et du changement, et l'assurance.
    in_scope:
      - Configuration du programme, gouvernance et gestion des jalons décisionnels
      - Estimation, budgétisation, contrôle et prévision des coûts
      - Planification, ordonnancement et analyse du chemin critique
      - Valeur acquise et gestion intégrée de la performance
      - Contrôle des risques, du changement et des provisions du programme
      - Assurance projet, revues de jalons et reporting
    out_of_scope:
      - Gestion des projets et du changement d'entreprise (BC-900/BC-910)
      - Gestion de projets d'ingénierie (BC-1110)
      - Évaluation des investissements et décisions de financement (BC-5000)
      - Exécution des travaux sur chantier et livraison de la construction
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: "Configuration et gouvernance du programme"
    description: |
      Établissement de la structure du programme, du modèle de livraison et de la
      gouvernance pour contrôler l'investissement en capital à travers des jalons
      décisionnels définis.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: "Définition et configuration du programme"
    description: |
      Définition et configuration du périmètre, de la structure et du référentiel de
      contrôle du programme.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Sélection du modèle de livraison
    description: |
      Sélection du modèle de livraison et d'organisation le mieux adapté au
      programme.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: "Cadre de gouvernance et d'assurance"
    description: |
      Établissement du cadre de gouvernance et d'assurance qui supervise le
      programme.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Gestion des jalons décisionnels
    description: |
      Gestion des jalons décisionnels qui autorisent la progression et la libération
      des fonds.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: "Estimation et gestion des coûts"
    description: |
      Estimation, établissement du référentiel et contrôle des coûts du programme et
      des projets sur le cycle de vie de la livraison.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Estimation des coûts
    description: |
      Préparation des estimations de coûts selon les classes d'estimation du cycle de
      vie.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Gestion du référentiel budgétaire
    description: |
      Établissement et maintien du référentiel de coûts au regard duquel la
      performance est mesurée.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: "Contrôle et prévision des coûts"
    description: |
      Contrôle et prévision des coûts à l'achèvement au regard du référentiel
      approuvé.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Reporting des coûts
    description: |
      Reporting de l'état et des prévisions de coûts auprès des parties prenantes du
      programme et des projets.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: "Planification et ordonnancement"
    description: |
      Élaboration et contrôle des plannings de programme et de projet pour gérer les
      délais et la certitude de livraison.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Élaboration du planning
    description: |
      Élaboration de plannings intégrés couvrant les activités du programme et des
      projets.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Analyse du chemin critique
    description: |
      Analyse des chemins critiques et des marges pour protéger les jalons clés de
      livraison.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Mesure de l'avancement
    description: |
      Mesure de l'avancement physique et temporel au regard du référentiel de
      planning.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Analyse des risques du planning
    description: |
      Analyse probabiliste du risque de planning pour tester la confiance de
      livraison.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: "Valeur acquise et gestion de la performance"
    description: |
      Mesure et reporting intégrés de la performance de coûts et de délais pour
      prévoir les résultats du programme.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Gestion de la valeur acquise
    description: |
      Intégration du périmètre, des coûts et des délais pour mesurer la valeur acquise
      et la performance.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: "Indicateurs de performance et KPI"
    description: |
      Définition et suivi des indicateurs de performance et des KPI à travers le
      programme.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: "Analyse des tendances et des écarts"
    description: |
      Analyse des tendances et des écarts pour anticiper les déviations par rapport au
      plan.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Reporting de performance intégré
    description: |
      Reporting consolidé de l'état intégré des coûts, des délais et de la
      performance.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: "Contrôle des risques et du changement du programme"
    description: |
      Gestion des risques, du changement, des provisions et des interfaces du
      programme pour protéger les résultats de livraison.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Gestion des risques du programme
    description: |
      Identification, évaluation et traitement des risques à travers le programme.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Contrôle du changement
    description: |
      Contrôle des changements de périmètre et de référentiel par un processus de
      changement discipliné.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: "Gestion des provisions et des réserves"
    description: |
      Gestion des provisions et des réserves au regard de l'exposition au risque
      quantifiée.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: "Gestion des interfaces et des dépendances"
    description: |
      Gestion des interfaces et des dépendances entre projets et parties prenantes.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: "Assurance projet et reporting"
    description: |
      Assurance indépendante, apprentissage et reporting pour confirmer la santé du
      programme et la réalisation des bénéfices.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: "Assurance projet et revues de jalons"
    description: |
      Assurance indépendante et revues de jalons de la maturité du programme et des
      projets.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Gestion des leçons apprises
    description: |
      Capture et application des leçons apprises tout au long du cycle de vie du
      programme.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Reporting du programme
    description: |
      Reporting de l'état du programme auprès des conseils, sponsors et organes de
      supervision.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Suivi de la réalisation des bénéfices
    description: |
      Suivi de la réalisation des bénéfices au regard du dossier d'affaires du
      programme.
    source_hash: sha256-de6ea1cd05c875b0
