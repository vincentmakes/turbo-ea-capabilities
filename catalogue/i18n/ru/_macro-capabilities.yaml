kind: macro-capability
locale: ru
source: _macro-capabilities.yaml
entries:
  MC-10:
    name: "Корпоративное управление и риски"
    description: |
      Задавать стратегическое направление предприятия и устанавливать
      ограничения, удерживающие его на курсе: стратегия, корпоративное
      управление, риски, комплаенс, аудит, юридические вопросы, непрерывность
      бизнеса и архитектурная функция, объединяющая их.
    in_scope:
      - "Стратегические намерения, надзор совета директоров и корпоративное управление"
      - "Идентификация, обработка и мониторинг корпоративных рисков"
      - "Регуляторный комплаенс, внутренний аудит и юридическое консультирование"
      - "Непрерывность бизнеса, готовность к кризисам и архитектурное управление"
    out_of_scope:
      - "Финансовая отчётность и операции казначейства (см. MC-20)"
      - "Кадровые операции, связанные с рисками (см. MC-30)"
      - "Отраслевые риски (например, кредитные, страховые, безопасности), решаемые в соответствующем L1"
    source_hash: sha256-742b9d11877faaa1
  MC-20:
    name: "Корпоративные финансы"
    description: |
      Распоряжаться финансовыми ресурсами предприятия: учёт и регистрация,
      казначейство, налоги, планирование и анализ, а также диалог с
      инвесторами и рынками капитала.
    in_scope:
      - "Главная книга, контроллинг и нормативная отчётность"
      - "Казначейство, денежные средства и управление ликвидностью"
      - "Налоговый комплаенс и планирование"
      - "Финансовое планирование, бюджетирование, прогнозирование и анализ эффективности"
      - "Связи с инвесторами и коммуникация с рынками капитала"
    out_of_scope:
      - "Ценообразование продуктов и услуг (см. MC-40)"
      - "Операции признания выручки на стороне клиента (см. MC-40)"
      - "Управление закупочными расходами (см. MC-50)"
    source_hash: sha256-d45328ca473bb0f0
  MC-30:
    name: "Человеческий капитал"
    description: |
      Привлекать, развивать, размещать, вознаграждать и поддерживать
      персонал, чтобы у предприятия были нужные люди на нужных ролях с
      нужным уровнем эффективности.
    in_scope:
      - "Планирование персонала, наём, адаптация и размещение"
      - "Управление эффективностью, талантами, преемственностью и обучением"
      - "Компенсация, льготы, расчёт заработной платы и общее вознаграждение"
      - "Отношения с сотрудниками, вовлечённость и увольнение"
    out_of_scope:
      - "Помещения и физическая рабочая среда (см. MC-70)"
      - "Безопасность работников в регулируемых операциях (см. MC-80 для нормативной рамки и соответствующий операционный L1 для исполнения)"
    source_hash: sha256-ef68e5156c6ba75c
  MC-40:
    name: "Клиенты и коммерция"
    description: |
      Привлекать, обслуживать и развивать клиентские отношения: создание
      спроса, исполнение продаж, ведение счетов, обслуживание клиентов и
      ценообразование, связывающее предложение и готовность платить.
    in_scope:
      - "Маркетинговая стратегия, бренд и генерация спроса"
      - "Операции продаж, управление возможностями и развитие каналов"
      - "Жизненный цикл клиентских отношений и ведение клиентов"
      - "Обслуживание клиентов, поддержка и обработка жалоб"
      - "Ценовая стратегия, управление прайс-листами и управление скидками"
    out_of_scope:
      - "Исполнение заказов и логистика (см. MC-50)"
      - "Биллинг, инкассация и учёт выручки (см. MC-20)"
      - "Отраслевые клиентские артефакты (банковский клиент, страхователь, абонент телеком и т. д.), управляемые в их отраслевом L1"
    source_hash: sha256-47519d8a70bd3787
  MC-50:
    name: "Цепочка поставок и закупки"
    description: |
      Закупать ресурсы и оркестрировать сквозной поток материалов, услуг и
      информации от поставщика до клиента с правильной стоимостью, уровнем
      сервиса и профилем риска.
    in_scope:
      - "Стратегия закупок, сорсинг, контрактование и purchase-to-pay"
      - "Квалификация, эффективность и управление отношениями с поставщиками"
      - "Планирование цепочки поставок, оркестрация исполнения и логистика"
      - "Позиционирование, контроль и оптимизация запасов"
    out_of_scope:
      - "Отраслевые операции (производство, переработка, добыча, складские операции и т. д.), управляемые в их L1"
      - "Захват клиентских заказов (см. MC-40)"
      - "Казначейские расчёты по счетам поставщиков (см. MC-20)"
    source_hash: sha256-23b8a759fde708ca
  MC-60:
    name: "Технологии и информация"
    description: |
      Эксплуатировать цифровой хребет предприятия: ИТ-услуги, активы данных
      и информации, а также позиция кибербезопасности, защищающая и то, и
      другое.
    in_scope:
      - "ИТ-стратегия, архитектура, доставка и эксплуатация услуг"
      - "Управление информацией и данными, управление и аналитические платформы"
      - "Политики, контроли, мониторинг и реагирование на инциденты кибербезопасности"
    out_of_scope:
      - "Встроенное в продукт ПО и firmware подключённых устройств (управляются в соответствующем L1 разработки продукта)"
      - "Отраслевые клинические, банковские или телеком информационные системы, управляемые в их L1"
      - "Операционные технологии (OT) регулируемых активов, совместно управляемые с соответствующим отраслевым L1"
    source_hash: sha256-f578fe11ce79d38f
  MC-70:
    name: "Рабочее пространство и объекты"
    description: |
      Обеспечивать физическую рабочую среду предприятия: портфель
      операционных объектов и корпоративную недвижимость, размещающую людей,
      процессы и оборудование.
    in_scope:
      - "Эксплуатация и обслуживание объектов и сервисы рабочего места"
      - "Стратегия корпоративной недвижимости, приобретение и отчуждение"
      - "Планирование пространств и управление занятостью"
    out_of_scope:
      - "Бизнес-направления недвижимости, у которых объект — коммерческий продукт (см. отраслевые L1 Недвижимости)"
      - "Активы производственных объектов, управляемые отраслевыми L1 обслуживания"
      - "Политика охраны труда, безопасности и окружающей среды (см. MC-80)"
    source_hash: sha256-2af429b32f798951
  MC-80:
    name: "Качество, инновации и знания"
    description: |
      Повышать операционный стандарт предприятия и обновлять то, что оно
      предлагает: обеспечение качества и HSE, устойчивое развитие, двигатель
      инноваций и R&D, управление жизненным циклом продукта, а также
      знания, интеллектуальная собственность и коммуникации,
      капитализирующие обучение во времени.
    in_scope:
      - "Системы менеджмента качества и непрерывное улучшение"
      - "Программы охраны труда, безопасности, окружающей среды и устойчивого развития"
      - "Портфель инноваций, исследования и разработки и управление жизненным циклом продукта"
      - "Управление знаниями, интеллектуальная собственность и корпоративные коммуникации"
    out_of_scope:
      - "Отраслевая разработка продуктов (фармацевтика, электротехника, автомобильная и т. д.), управляемая в соответствующем L1"
      - "Маркетинговая коммуникация продуктов и предложений (см. MC-40)"
      - "Операционное исполнение безопасности на регулируемых активах, управляемое в соответствующем отраслевом L1"
    source_hash: sha256-8a8128aa3ace91c4
  MC-90:
    name: "Проекты, изменения и процессы"
    description: |
      Превращать намерения в результаты: портфель и исполнение проектов,
      внедрение организационных изменений, корпоративная трансформация и
      дисциплина бизнес-процессов, фиксирующая, измеряющая и улучшающая
      способ выполнения работы.
    in_scope:
      - "Управление портфелем проектов и программ"
      - "Управление организационными изменениями и их принятие"
      - "Оркестрация трансформации на уровне предприятия"
      - "Моделирование, эффективность и улучшение бизнес-процессов"
    out_of_scope:
      - "Технические практики поставки, специфичные для ИТ (см. MC-60)"
      - "Управление отраслевыми программами (программы обороны, автомобильные программы, фармразработка, горнодобывающие проекты), управляемые в соответствующем L1"
    source_hash: sha256-bdf5fbe3800d21eb
