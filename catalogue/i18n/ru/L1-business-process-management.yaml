locale: ru
source: L1-business-process-management.yaml
entries:
  BC-930:
    name: Управление бизнес-процессами
    description: |
      Дисциплина проектирования, моделирования, мониторинга, аналитики, оптимизации и управления сквозными бизнес-процессами как управляемым классом активов. Рассматривает процессы как полноценные артефакты, независимые от операционных доменов, в которых они исполняются.
    in_scope:
      - Управление таксономией, владением, жизненным циклом и стандартами процессов
      - Обнаружение, моделирование BPMN, документирование и версионирование процессов
      - KPI эффективности процессов, мониторинг и отчётность по соответствию
      - Process mining, включая получение журналов событий, обнаружение и проверку соответствия
      - Перепроектирование процессов, моделирование сценариев и выявление возможностей автоматизации
      - Управление портфелем автоматизации на платформах workflow и RPA
      - Проектирование процессных контролей и моделирование разделения обязанностей
    out_of_scope:
      - Реализация проектов улучшений в формате Lean, Six Sigma или Kaizen (BC-720.50)
      - Доменно-специфичная операционная деятельность (заказы, претензии, отгрузки и т.п.)
      - Разработка ПО RPA-ботов и инженерия платформ (ИТ-возможности доставки)
      - Исполнение процессов управления ИТ-сервисами (ИТ-возможности линейки BC-700)
      - Моделирование бизнес-архитектуры, способностей и потоков создания ценности (BC-170)
  BC-930.10:
    name: Архитектура и управление процессами
    description: |
      Таксономия процессов, модель владения, политика жизненного цикла и стандарты оформления, формирующие портфель процессов.
  BC-930.10.10:
    name: Управление таксономией процессов
    description: |
      Определение и поддержка корпоративной системы классификации процессов.
  BC-930.10.20:
    name: Назначение владельцев процессов
    description: |
      Назначение владельцев, кураторов и стюардов процессов в портфеле.
  BC-930.10.30:
    name: Политика жизненного цикла процессов
    description: |
      Политика введения, сопровождения, вывода из эксплуатации и архивирования процессов.
  BC-930.10.40:
    name: Стандарты и соглашения по процессам
    description: |
      Нотации моделирования, стандарты атрибутов и соглашения по ревью артефактов процессов.
  BC-930.20:
    name: Моделирование и документирование процессов
    description: |
      Обнаружение, оформление, публикация и контроль версий моделей процессов и сопровождающей документации.
  BC-930.20.10:
    name: Обнаружение и сбор требований к процессам
    description: |
      Воркшопы, интервью и наблюдения для фиксации знаний о процессах «как есть».
  BC-930.20.20:
    name: Оформление моделей процессов
    description: |
      Оформление моделей в нотации BPMN и эквивалентных в инструменте моделирования.
  BC-930.20.30:
    name: Публикация документации процессов
    description: |
      Публикация документации процессов для операционных аудиторий.
  BC-930.20.40:
    name: Версионирование моделей процессов
    description: |
      Контроль версий, история изменений и согласование моделей процессов.
  BC-930.30:
    name: Измерение эффективности процессов
    description: |
      Определение, мониторинг и отчётность по эффективности и соответствию процессов.
  BC-930.30.10:
    name: Определение KPI процессов
    description: |
      Определение KPI длительности цикла, пропускной способности, качества и затрат по каждому процессу.
  BC-930.30.20:
    name: Мониторинг эффективности процессов
    description: |
      Операционные дашборды и оповещения по целевым показателям эффективности процессов.
  BC-930.30.30:
    name: Отчётность по соответствию процессов
    description: |
      Отчётность по соответствию исполнения смоделированному целевому процессу.
  BC-930.40:
    name: Process mining и обнаружение процессов
    description: |
      Обнаружение, проверка соответствия и интеллектуальный анализ процессов на основе журналов событий.
  BC-930.40.10:
    name: Получение журналов событий
    description: |
      Извлечение, преобразование и загрузка журналов событий из систем-источников.
  BC-930.40.20:
    name: Анализ обнаружения процессов
    description: |
      Алгоритмическое восстановление вариантов исполненных процессов из журналов событий.
  BC-930.40.30:
    name: Проверка соответствия
    description: |
      Сравнение фактического поведения с эталонными моделями и наборами правил.
  BC-930.40.40:
    name: Отчётность по интеллектуальному анализу процессов
    description: |
      Отчётность по найденным инсайтам, таким как узкие места, доработки и влияние вариантов.
  BC-930.50:
    name: Оптимизация и перепроектирование процессов
    description: |
      Архитектурное и основанное на данных перепроектирование процессов, включая моделирование сценариев и анализ кандидатов на автоматизацию. Отличается от реализации проектов улучшений, относящейся к BC-720.50.
  BC-930.50.10:
    name: Анализ узких мест в процессах
    description: |
      Идентификация и количественная оценка узких мест по вариантам процессов.
  BC-930.50.20:
    name: Имитационное моделирование процессов
    description: |
      Дискретно-событийное и Монте-Карло моделирование альтернатив проектирования процесса.
  BC-930.50.30:
    name: Проектирование целевых процессов
    description: |
      Проектирование потоков, контролей и передач при перепроектировании процессов.
  BC-930.50.40:
    name: Идентификация возможностей автоматизации
    description: |
      Определение шагов-кандидатов для автоматизации с помощью workflow, RPA или ИИ.
  BC-930.60:
    name: Управление автоматизацией процессов
    description: |
      Управление портфелем автоматизации на платформах workflow, RPA и интеллектуальной автоматизации. Не охватывает инженерию и эксплуатацию самих платформ.
  BC-930.60.10:
    name: Управление портфелем автоматизации
    description: |
      Приём спроса, приоритизация и управление жизненным циклом активов автоматизации.
  BC-930.60.20:
    name: Управление оркестрацией workflow
    description: |
      Стандарты и контроли для оркестрированных workflow-процессов между бизнес-системами.
  BC-930.60.30:
    name: Управление программой RPA
    description: |
      Управление программой роботизированной автоматизации процессов, включая владение ботами.
  BC-930.60.40:
    name: Контроль и аудит автоматизации
    description: |
      Каркас контроля, мониторинг и аудиторский след по парку автоматизации.
  BC-930.70:
    name: Управление рисками и контролями процессов
    description: |
      Встроенные в процессы риски и контроли, включая разделение обязанностей. Дополняет, не заменяя, корпоративные функции рисков и аудита.
  BC-930.70.10:
    name: Проектирование процессных контролей
    description: |
      Проектирование превентивных и обнаруживающих контролей, встраиваемых в потоки процессов.
  BC-930.70.20:
    name: Моделирование разделения обязанностей
    description: |
      Моделирование правил разделения обязанностей и обнаружение конфликтов в процессах.
  BC-930.70.30:
    name: Тестирование процессных контролей
    description: |
      Периодическое тестирование эффективности процессных контролей и обработки исключений.
