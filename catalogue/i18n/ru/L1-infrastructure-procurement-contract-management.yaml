# Управление закупками и контрактами инфраструктуры (ru) — translations for L1-infrastructure-procurement-contract-management.yaml
locale: ru
source: L1-infrastructure-procurement-contract-management.yaml
entries:
  BC-5030:
    name: Управление закупками и контрактами инфраструктуры
    description: |
      Стратегия закупок, проведение тендеров и администрирование
      контрактов для реализации инфраструктуры, включая коммерческое и
      количественно-сметное управление, изменения и претензии, а также
      управление субподрядчиками и цепочкой поставок.
    in_scope:
      - Стратегия закупок, пакетирование и выбор способа контрактации
      - Проведение тендеров, управление заявками и предквалификация
      - Заключение, администрирование контрактов и сертификация платежей
      - Коммерческое и количественно-сметное управление и оценка
      - Управление изменениями, компенсационными событиями и претензиями
      - Закупка и эффективность субподрядчиков и цепочки поставок
    out_of_scope:
      - Корпоративные закупки (BC-500)
      - Инженерные тендеры и оценка (BC-1140)
      - Управление отношениями с поставщиками (BC-510)
      - Выполнение строительных работ и реализация на площадке
    source_hash: sha256-cb54eb484c6d6066
  BC-5030.10:
    name: Стратегия закупок и пакетирование
    description: |
      Определение стратегии закупок, пакетирования работ и способов
      контрактации для реализации инфраструктуры.
    source_hash: sha256-c278a5ab94f55ea6
  BC-5030.10.10:
    name: Определение стратегии закупок
    description: |
      Определение стратегии закупок, согласованной с целями программы и
      возможностями рынка.
    source_hash: sha256-192f156cdb4f9b4f
  BC-5030.10.20:
    name: Определение пакетов работ
    description: |
      Структурирование работ в пакеты, подходящие для потребностей рынка
      и реализации.
    source_hash: sha256-be2dc24b3b896538
  BC-5030.10.30:
    name: Выбор способа контрактации
    description: |
      Выбор способов и форм контрактации, подходящих для каждого пакета.
    source_hash: sha256-e44081b485473631
  BC-5030.10.40:
    name: Взаимодействие с рынком поставщиков
    description: |
      Раннее взаимодействие с рынком поставщиков для формирования и
      проверки подходов к закупкам.
    source_hash: sha256-a1b08ee6e0a7692a
  BC-5030.20:
    name: Проведение тендеров и управление заявками
    description: |
      Подготовка, оценка и присуждение тендеров на инфраструктурные
      работы и услуги.
    source_hash: sha256-9def12677496d957
  BC-5030.20.10:
    name: Подготовка тендера
    description: |
      Подготовка тендерной документации и требований для выпуска на
      рынок.
    source_hash: sha256-741bd312438f7b6b
  BC-5030.20.20:
    name: Разработка и подача заявки
    description: |
      Разработка и подача соответствующих требованиям конкурентных
      заявок при выступлении в роли участника торгов.
    source_hash: sha256-6230db0ce85d44f1
  BC-5030.20.30:
    name: Оценка тендеров и присуждение
    description: |
      Оценка тендеров и присуждение контрактов по определённым
      критериям.
    source_hash: sha256-1734ac0003c4439a
  BC-5030.20.40:
    name: Управление предквалификацией
    description: |
      Управление предквалификацией поставщиков и списками отбора.
    source_hash: sha256-5e0dd9921fb18016
  BC-5030.30:
    name: Администрирование контрактов
    description: |
      Администрирование инфраструктурных контрактов через заключение,
      обязательства, платежи и управление.
    source_hash: sha256-d5508a9572a1d447
  BC-5030.30.10:
    name: Заключение контракта
    description: |
      Заключение и подписание контрактов и сопутствующих соглашений.
    source_hash: sha256-74bd26b614bd46fc
  BC-5030.30.20:
    name: Управление контрактными обязательствами
    description: |
      Управление контрактными обязательствами, уведомлениями и
      результатами на протяжении реализации.
    source_hash: sha256-c044d99f00160ea3
  BC-5030.30.30:
    name: Сертификация платежей
    description: |
      Сертификация платежей, причитающихся по условиям контракта.
    source_hash: sha256-1cf290701105ce80
  BC-5030.30.40:
    name: Управление контрактом
    description: |
      Управление исполнением контракта, соответствием и закрытием.
    source_hash: sha256-6d45f2461eec7f0b
  BC-5030.40:
    name: Коммерческое и количественно-сметное управление
    description: |
