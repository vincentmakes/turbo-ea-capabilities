    source_hash: sha256-0114026af06ad56f
  BC-5030.50.30:
    name: Управление претензиями
    description: |
      Подготовка, защита и урегулирование контрактных претензий.
    source_hash: sha256-761057e635b21465
  BC-5030.50.40:
    name: Разрешение споров
    description: |
      Разрешение споров через переговоры, адъюдикацию и формальные
