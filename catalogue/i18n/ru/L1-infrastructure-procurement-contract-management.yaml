    source_hash: sha256-2620af91a858f13f
  BC-5030.60.10:
    name: Закупка субподрядчиков
    description: |
      Закупка и привлечение субподрядчиков для пакетов реализации.
    source_hash: sha256-ab4218e04af118a2
  BC-5030.60.20:
