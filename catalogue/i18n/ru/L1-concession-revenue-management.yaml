# Управление концессиями и доходами (ru) — translations for L1-concession-revenue-management.yaml
locale: ru
source: L1-concession-revenue-management.yaml
entries:
  BC-5100:
    name: Управление концессиями и доходами
    description: |
      Управление концессиями и государственно-частными партнёрствами,
      тарифами и ценообразованием, сбором и обеспечением доходов,
      управление грантами и субсидиями, а также коммерческие
      партнёрства, монетизирующие инфраструктурные активы в течение
      срока концессии.
    in_scope:
      - Управление концессионными соглашениями и государственно-частными партнёрствами
      - Управление тарифами, платой за проезд и регулируемым ценообразованием
      - Сбор, обеспечение доходов и контроль утечек
      - Администрирование грантов, субсидий и платежей за доступность
      - Коммерческие партнёрства и развитие сопутствующих доходов
      - Монетизация доходов от земли и недвижимости
    out_of_scope:
      - Корпоративное управление ценообразованием (BC-450)
      - Стратегия фондирования и финансирования инвестиций (BC-5000)
      - Регуляторный контроль цен (BC-5110)
      - Корпоративное казначейство и управление денежными средствами
    source_hash: sha256-31fe0db849266357
  BC-5100.10:
    name: Управление концессиями и PPP
    description: |
      Управление концессионными соглашениями и структурами государственно-
      частного партнёрства на протяжении их жизненного цикла и
      обязательств.
    source_hash: sha256-a22a548a8645183d
  BC-5100.10.10:
    name: Управление концессионным соглашением
    description: |
      Администрирование концессионных соглашений, условий и обязательств
      в течение срока концессии.
    source_hash: sha256-9def85a178499207
  BC-5100.10.20:
    name: Структурирование PPP
    description: |
      Структурирование механизмов государственно-частного партнёрства и
      их распределения рисков и вознаграждения.
    source_hash: sha256-b5b581d6585802f8
  BC-5100.10.30:
    name: Механизм доступности и платежей
    description: |
      Проектирование и функционирование механизмов доступности и
      платежей, регулирующих концессионное вознаграждение.
    source_hash: sha256-b8f1dc9bb51c88d3
  BC-5100.10.40:
    name: Соответствие концессионным требованиям
    description: |
      Обеспечение выполнения концессионных обязательств и стандартов
      эффективности по соглашению.
    source_hash: sha256-cbb61f6c434c3745
  BC-5100.20:
    name: Управление тарифами и ценообразованием
    description: |
      Установление и регулирование тарифов, платы за проезд и цен,
      взимаемых за использование инфраструктуры и услуги.
    source_hash: sha256-a227181d00143284
  BC-5100.20.10:
    name: Установление тарифов и платы за проезд
    description: |
      Определение тарифов и платы за проезд за доступ и использование
      инфраструктуры.
    source_hash: sha256-9c85397c4e9511ad
  BC-5100.20.20:
    name: Стратегия ценообразования
    description: |
      Определение коммерческой стратегии ценообразования для
      инфраструктурных услуг и мощностей.
    source_hash: sha256-40aadd13ac8753e6
  BC-5100.20.30:
    name: Регулируемый контроль цен
    description: |
      Управление ценами в рамках регулируемых механизмов контроля цен и
      определений.
    source_hash: sha256-36858333bcb9bcd5
  BC-5100.20.40:
    name: Динамическое ценообразование и плата за перегрузку
    description: |
      Применение реагирующего на спрос и основанного на перегрузке
      ценообразования для управления загрузкой и доходами.
    source_hash: sha256-e1a71a20889653b1
  BC-5100.30:
    name: Сбор и обеспечение доходов
    description: |
      Сбор инфраструктурных доходов и обеспечение того, что выставленная
      к оплате стоимость точно захвачена и сверена.
    source_hash: sha256-21a8f1a79eee1297
  BC-5100.30.10:
    name: Начисление и сбор
    description: |
      Начисление и сбор платы за использование, платы за проезд и
      доходов от услуг с клиентов.
    source_hash: sha256-e843c438e364d4b7
  BC-5100.30.20:
    name: Обеспечение доходов
    description: |
      Обеспечение того, что весь заработанный доход выставлен, захвачен и
      полностью учтён.
    source_hash: sha256-33c8a1b0d8055c38
  BC-5100.30.30:
    name: Управление утечками доходов
    description: |
      Выявление и возврат утечек доходов, уклонения и недосбора.
    source_hash: sha256-e74eb30ed9cc0fab
  BC-5100.30.40:
    name: Расчёт и сверка
    description: |
      Расчёт и сверка собранных доходов между системами и
      контрагентами.
    source_hash: sha256-4cf5bee158a16ab1
  BC-5100.40:
    name: Управление грантами и субсидиями
    description: |
      Администрирование грантов, субсидий и государственных взносов,
      финансирующих доступность и эксплуатацию инфраструктуры.
    source_hash: sha256-59676894b6d296b4
  BC-5100.40.10:
    name: Администрирование субсидий и грантов
    description: |
      Администрирование субсидий и грантов, поддерживающих
      инфраструктурные услуги.
    source_hash: sha256-7327dbe74c44dcb2
  BC-5100.40.20:
    name: Управление платежами за доступность
    description: |
      Управление платежами на основе доступности, привязанными к
      эффективности обслуживания и активов.
    source_hash: sha256-f582a8fec53b9457
  BC-5100.40.30:
    name: Соответствие требованиям государственного финансирования
    description: |
      Соблюдение условий и отчётности, привязанных к государственному
      финансированию.
    source_hash: sha256-37956e4e43055d0d
  BC-5100.40.40:
    name: Управление государственными взносами
    description: |
      Управление государственными капитальными и операционными взносами
      в инфраструктуру.
    source_hash: sha256-f3bca7eecd76da31
  BC-5100.50:
    name: Управление коммерческими партнёрствами
    description: |
      Развитие доходов от третьих сторон, сопутствующих и основанных на
      недвижимости доходов через коммерческие партнёрства.
    source_hash: sha256-7dbec12d746a51f5
  BC-5100.50.10:
    name: Управление доходами от третьих сторон
    description: |
      Управление доходами от доступа, услуг и механизмов третьих сторон.
    source_hash: sha256-964d00f984dfe361
  BC-5100.50.20:
    name: Управление коммерческими партнёрствами
    description: |
      Развитие и управление коммерческими партнёрствами, генерирующими
      инфраструктурные доходы.
    source_hash: sha256-d8c2ce036978a06c
  BC-5100.50.30:
    name: Развитие сопутствующих доходов
    description: |
      Развитие сопутствующих и непрофильных потоков доходов вокруг
      инфраструктурных активов.
    source_hash: sha256-1b21081c2948c2fa
  BC-5100.50.40:
    name: Доходы от земли и недвижимости
    description: |
      Монетизация земельных и имущественных владений, связанных с
      инфраструктурой.
    source_hash: sha256-4931ef33faa7594b
metadata:
