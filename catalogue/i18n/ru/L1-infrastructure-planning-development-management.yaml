# Управление планированием и развитием инфраструктуры (ru) — translations for L1-infrastructure-planning-development-management.yaml
locale: ru
source: L1-infrastructure-planning-development-management.yaml
entries:
  BC-5010:
    name: Управление планированием и развитием инфраструктуры
    description: |
      Долгосрочное планирование сетей и систем, разработка технико-
      экономических обоснований и вариантов, приобретение земли и
      трасс, согласования и экологическая экспертиза, а также
      взаимодействие с заинтересованными сторонами для развития
      инфраструктурных схем вплоть до момента реализации.
    in_scope:
      - Долгосрочное планирование сетей, пропускной способности и пространственное планирование
      - Технико-экономические обоснования и разработка вариантов и концепций
      - Приобретение земли, трасс и коридоров и сервитутов
      - Согласования планировки и оценка воздействия на окружающую среду
      - Взаимодействие с заинтересованными сторонами, сообществами и землевладельцами
      - Планирование устойчивого развития, углеродного следа и адаптации к климату
    out_of_scope:
      - Девелопмент недвижимости (BC-4900)
      - Строительное производство (BC-5040)
      - Операционные разрешения и регуляторные согласования (BC-5110)
      - Детальное инженерное проектирование и BIM-производство
    source_hash: sha256-1f061ce9eaeff698
  BC-5010.10:
    name: Планирование сетей и систем
    description: |
      Долгосрочное планирование инфраструктурных сетей и систем для
      удовлетворения прогнозируемого спроса и потребностей в пропускной
      способности.
    source_hash: sha256-221c19a33b77d008
  BC-5010.10.10:
    name: Прогнозирование спроса
    description: |
      Прогнозирование долгосрочного спроса и загрузки для определения
      будущих инфраструктурных потребностей.
    source_hash: sha256-28c9752c180e99cc
  BC-5010.10.20:
    name: Планирование пропускной способности сети
    description: |
      Планирование пропускной способности сетей и систем для устранения
      разрывов между спросом и доступным обеспечением.
    source_hash: sha256-26a1b0b36e5c8858
  BC-5010.10.30:
    name: Пространственное и коридорное планирование
    description: |
      Пространственное и коридорное планирование для резервирования
      земли и согласования схем с политикой землепользования.
    source_hash: sha256-03a96a52e24ef446
  BC-5010.10.40:
    name: Мастер-планирование
    description: |
      Разработка интегрированных мастер-планов, координирующих схемы в
      масштабе сети или региона.
    source_hash: sha256-4604aaba1b3148e9
  BC-5010.20:
    name: Разработка технико-экономических обоснований и вариантов
    description: |
      Оценка осуществимости и разработка вариантов и концепций для
      кандидатных инфраструктурных схем.
    source_hash: sha256-1f24373cbb830060
  BC-5010.20.10:
    name: Технико-экономические обоснования
    description: |
      Исследования, устанавливающие техническую, экономическую и
      реализационную осуществимость кандидатных схем.
    source_hash: sha256-589666843c2b65c8
  BC-5010.20.20:
    name: Разработка вариантов
    description: |
      Разработка и сравнение вариантов схем относительно целей и
      ограничений.
    source_hash: sha256-b87a7671d3c68f8e
  BC-5010.20.30:
    name: Выбор концепции
    description: |
      Выбор предпочтительной концепции для перехода к проектированию и
      реализации.
    source_hash: sha256-5751d085f3d082b2
  BC-5010.20.40:
    name: Оценка технологичности
    description: |
      Оценка строительной пригодности и рисков реализации для
      формирования жизнеспособных концепций схем.
    source_hash: sha256-42ca80fb581982cf
  BC-5010.30:
    name: Управление землёй и трассами
    description: |
      Выбор и приобретение земли, трасс и прав доступа, необходимых для
      реализации инфраструктурных схем.
    source_hash: sha256-daa595eb14de2fd9
  BC-5010.30.10:
    name: Выбор трассы и коридора
    description: |
      Выбор трасс и коридоров, балансирующих затраты, воздействие и
      реализуемость.
    source_hash: sha256-9f66a105036d0a2f
  BC-5010.30.20:
    name: Приобретение и консолидация земли
    description: |
      Приобретение и консолидация земельных участков, необходимых для
      реализации схемы.
    source_hash: sha256-5bfdec58b202996a
  BC-5010.30.30:
    name: Права прохода и сервитуты
    description: |
      Получение прав прохода, сервитутов и прав доступа через земли
      третьих сторон.
    source_hash: sha256-9245c3eaf8b15e60
  BC-5010.30.40:
    name: Управление принудительным выкупом
    description: |
      Управление принудительным выкупом и связанной компенсацией для
      обеспечения необходимой земли.
    source_hash: sha256-9c0550400b915cdf
  BC-5010.40:
    name: Согласования и экологическая экспертиза
    description: |
      Получение согласований планировки и проведение экологической и
      историко-культурной экспертизы инфраструктурных схем.
    source_hash: sha256-7edf3dbebde36060
  BC-5010.40.10:
    name: Управление согласованием планировки
    description: |
      Управление заявками на согласование планировки и согласованиями
      вплоть до принятия решения.
    source_hash: sha256-2905e9cb0aea2ee2
  BC-5010.40.20:
    name: Оценка воздействия на окружающую среду
    description: |
      Оценка воздействия на окружающую среду и мер снижения для
      обоснования решений о согласовании.
    source_hash: sha256-9a114cc95d3f4ec4
  BC-5010.40.30:
    name: Экологическая и историко-культурная экспертиза
    description: |
      Оценка экологических и историко-культурных ограничений,
      влияющих на проектирование схемы и согласование.
    source_hash: sha256-53e91dddca764172
  BC-5010.40.40:
    name: Ордера на согласование застройки
    description: |
      Подготовка и управление ордерами на согласование застройки для
      крупных инфраструктурных схем.
    source_hash: sha256-8a4927dbdb94dd28
  BC-5010.50:
    name: Взаимодействие с заинтересованными сторонами и сообществами
    description: |
      Взаимодействие с сообществами, заинтересованными сторонами и
      землевладельцами для формирования поддержки и управления
      возражениями по схемам.
    source_hash: sha256-14a5ef3b68697a33
  BC-5010.50.10:
    name: Консультации с сообществом
    description: |
      Консультации с затронутыми сообществами для информирования и
      формирования предложений по схемам.
    source_hash: sha256-b7a978970c190087
  BC-5010.50.20:
    name: Картирование и вовлечение заинтересованных сторон
    description: |
      Картирование и вовлечение заинтересованных сторон на протяжении
      жизненного цикла схемы.
    source_hash: sha256-715a0e8e4ee875ab
  BC-5010.50.30:
    name: Управление публичными слушаниями
    description: |
      Управление публичными слушаниями и рассмотрениями предложений по
      схемам.
    source_hash: sha256-ef504b071318f4b4
  BC-5010.50.40:
    name: Взаимодействие с землевладельцами и соседями
    description: |
      Взаимодействие с землевладельцами и соседями для разрешения
      опасений и обеспечения сотрудничества.
    source_hash: sha256-5873b48e93dddd50
  BC-5010.60:
    name: Планирование устойчивого развития и климата
    description: |
      Встраивание устойчивого развития, углеродного следа и
      климатической устойчивости в планирование и проектирование
      инфраструктурных схем.
    source_hash: sha256-bde366e3522fd2f8
  BC-5010.60.10:
    name: Планирование углеродного следа за весь срок службы
    description: |
      Планирование для сокращения углеродного следа за весь срок службы
      на этапах проектирования и реализации схемы.
    source_hash: sha256-a2d9e214f4ace182
  BC-5010.60.20:
    name: Планирование биоразнообразия и чистого прироста
    description: |
      Планирование для защиты биоразнообразия и обеспечения измеримого
      чистого прироста.
    source_hash: sha256-8a8de1c65bdf26ef
  BC-5010.60.30:
    name: Планирование адаптации к климату
    description: |
      Планирование климатической устойчивости и адаптации
      инфраструктурных активов.
    source_hash: sha256-9ba4b8631a709caf
  BC-5010.60.40:
    name: Стандарты устойчивого проектирования
    description: |
      Принятие стандартов устойчивого проектирования и рейтинговых
      систем для схем.
    source_hash: sha256-5942740434ce459c
