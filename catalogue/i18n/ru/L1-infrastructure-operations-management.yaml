# Управление эксплуатацией инфраструктуры (ru) — translations for L1-infrastructure-operations-management.yaml
locale: ru
source: L1-infrastructure-operations-management.yaml
entries:
  BC-5080:
    name: Управление эксплуатацией инфраструктуры
    description: |
      Эксплуатация действующих инфраструктурных сетей и систем,
      охватывающая операции по управлению сетью, управление пропускной
      способностью и спросом, доступность обслуживания, операции по
      событиям и инцидентам, а также клиентские и пользовательские
      операции.
    in_scope:
      - Диспетчерские и операции по управлению сетью в реальном времени
      - Управление пропускной способностью, спросом и потоками по сети
      - Управление доступностью обслуживания и уровнями обслуживания
      - Управление операционными событиями, инцидентами и нарушениями
      - Клиентские и пользовательские операции и информационные услуги
      - Операционные коммуникации и восстановление обслуживания
    out_of_scope:
      - Эксплуатация коммунальных сетей (BC-3800)
      - Транспортная эксплуатация (BC-2400)
      - Выполнение обслуживания (BC-5090)
      - Стратегия и планирование управления активами (BC-5070)
    source_hash: sha256-9017b7761406afa9
  BC-5080.10:
    name: Управление и операции сети
    description: |
      Управление и эксплуатация инфраструктурной сети в реальном времени
      из диспетчерских и операционных центров.
    source_hash: sha256-a809ce5352d19ec3
  BC-5080.10.10:
    name: Операции диспетчерской
    description: |
      Работа диспетчерских, направляющих и контролирующих активность
      действующей сети.
    source_hash: sha256-52ba486b7fa1220e
  BC-5080.10.20:
    name: Мониторинг сети в реальном времени
    description: |
      Непрерывный мониторинг состояния сети для поддержания безопасной и
      надёжной эксплуатации.
    source_hash: sha256-3cc6847c301fff02
  BC-5080.10.30:
    name: Операционное командование и контроль
    description: |
      Командование и контроль операций сети для координации ресурсов и
      реагирования.
    source_hash: sha256-38b9bd72ebc128d9
  BC-5080.10.40:
    name: Управление операционными процедурами
    description: |
      Управление операционными процедурами и правилами, регулирующими
      безопасную эксплуатацию сети.
    source_hash: sha256-caebefd5eb402b25
  BC-5080.20:
    name: Управление пропускной способностью и спросом
    description: |
      Балансирование пропускной способности сети относительно спроса для
      поддержания обслуживания и управления перегрузкой.
    source_hash: sha256-fe707b7d24bf69c4
  BC-5080.20.10:
    name: Управление пропускной способностью
    description: |
      Управление доступной пропускной способностью сети для
      удовлетворения текущего и прогнозируемого спроса.
    source_hash: sha256-036f1ed463efeaf3
  BC-5080.20.20:
    name: Управление спросом и потоками
    description: |
      Управление спросом и потоками по сети для оптимизации загрузки и
      обслуживания.
    source_hash: sha256-724b5fbac7fe0a09
  BC-5080.20.30:
    name: Планирование обслуживания
    description: |
      Планирование обслуживания и доступа для эффективного использования
      пропускной способности сети.
    source_hash: sha256-c102d0a1291175e5
  BC-5080.20.40:
    name: Управление перегрузкой
    description: |
      Управление перегрузкой для защиты эффективности обслуживания при
      пиковом спросе.
    source_hash: sha256-93ff4b80da497c5b
  BC-5080.30:
    name: Управление доступностью обслуживания
    description: |
      Обеспечение доступности и эффективности обслуживания относительно
      согласованных стандартов и уровней обслуживания.
    source_hash: sha256-29572f69e7c76a56
  BC-5080.30.10:
    name: Управление доступностью
    description: |
      Управление доступностью обслуживания для достижения целей по
      надёжности и непрерывности.
    source_hash: sha256-849d496ecfc74adc
  BC-5080.30.20:
    name: Управление уровнями обслуживания
    description: |
      Управление уровнями обслуживания и обязательствами перед
      пользователями и заинтересованными сторонами.
    source_hash: sha256-4c92806743fa9393
  BC-5080.30.30:
    name: Мониторинг соответствия стандарту
    description: |
      Мониторинг операционной эффективности относительно определённых
      стандартов обслуживания.
    source_hash: sha256-5d7d212f28559ece
  BC-5080.30.40:
    name: Восстановление обслуживания
    description: |
      Восстановление обслуживания до стандарта после деградации или
      нарушения.
    source_hash: sha256-118768d509691748
  BC-5080.40:
    name: Операции по событиям и инцидентам
    description: |
      Обнаружение, координация и разрешение операционных событий и
      инцидентов, нарушающих обслуживание.
    source_hash: sha256-b516cc1a42d01d43
  BC-5080.40.10:
    name: Управление операционными инцидентами
    description: |
      Управление операционными инцидентами через обнаружение,
      реагирование и разрешение.
    source_hash: sha256-b8b9a63388a10b1a
  BC-5080.40.20:
    name: Управление нарушениями
    description: |
      Управление нарушениями обслуживания для ограничения воздействия на
      пользователей и сеть.
    source_hash: sha256-dd720e2f4353cc9f
  BC-5080.40.30:
    name: Координация реагирования на инциденты
    description: |
      Координация ресурсов и заинтересованных сторон в ответ на
      операционные инциденты.
    source_hash: sha256-ba83aa3785b202bd
  BC-5080.40.40:
    name: Операционные коммуникации
    description: |
      Коммуникация операционного статуса и инструкций реагирующим и
      затронутым сторонам.
    source_hash: sha256-dc717820ca2c763b
  BC-5080.50:
    name: Клиентские и пользовательские операции
    description: |
      Операционные услуги и информация, поддерживающие клиентов и
      пользователей инфраструктурной сети.
    source_hash: sha256-b452d8cb8558f23b
  BC-5080.50.10:
    name: Информационные услуги для пользователей
    description: |
      Предоставление операционной информации, помогающей пользователям
      планировать и использовать сеть.
    source_hash: sha256-dc0d0659f1c7df22
  BC-5080.50.20:
    name: Управление доступом и допуском
    description: |
      Управление доступом и допуском пользователей к сети и её услугам.
    source_hash: sha256-665b633351da8100
  BC-5080.50.30:
    name: Операционное обслуживание клиентов
    description: |
      Оказание обслуживания клиентов, возникающего из эксплуатации
      действующей сети.
    source_hash: sha256-906e547f1cf1feb8
  BC-5080.50.40:
    name: Управление обратной связью пользователей
    description: |
      Сбор и управление обратной связью пользователей об операционном
      обслуживании.
    source_hash: sha256-0f89156801a5c9d2
