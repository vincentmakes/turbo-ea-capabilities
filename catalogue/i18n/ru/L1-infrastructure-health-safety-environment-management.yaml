# Управление охраной труда, безопасностью и окружающей средой в инфраструктуре (ru) — translations for L1-infrastructure-health-safety-environment-management.yaml
locale: ru
source: L1-infrastructure-health-safety-environment-management.yaml
entries:
  BC-5050:
    name: Управление охраной труда, безопасностью и окружающей средой в инфраструктуре
    description: |
      Управление охраной труда, безопасностью и окружающей средой в
      инфраструктурном строительстве и эксплуатации, охватывающее
      системы менеджмента HSE, строительную безопасность, гигиену труда,
      экологический менеджмент, а также реагирование на инциденты и
      чрезвычайные ситуации. Защищает людей, сообщества и окружающую
      среду в процессе реализации и эксплуатации работ и активов.
    in_scope:
      - Политика HSE, системы менеджмента, культура и компетентность
      - Строительная безопасность по CDM, разрешения и оценка рисков
      - Наблюдение за гигиеной труда, бытовые условия и благополучие
      - Экологический контроль, предотвращение загрязнения и соблюдение согласований
      - Защита экологии и историко-культурного наследия при работах
      - Отчётность об инцидентах, расследование и реагирование на чрезвычайные ситуации
    out_of_scope:
      - Межотраслевая охрана окружающей среды, здоровья и безопасности (BC-720)
      - Операционная устойчивость и безопасность (BC-5120)
      - Управление качеством строительства (BC-5040.60)
    source_hash: sha256-8eabe951d7b48e96
  BC-5050.10:
    name: Система менеджмента HSE
    description: |
      Политика, стандарты, культура и компетентность, составляющие
      систему менеджмента охраны труда, безопасности и окружающей среды.
    source_hash: sha256-1b6f617504fc49d0
  BC-5050.10.10:
    name: Политика и стандарты HSE
    description: |
      Определение политики, стандартов и целей HSE по инфраструктурной
      деятельности.
    source_hash: sha256-e670724077291407
  BC-5050.10.20:
    name: Система менеджмента HSE
    description: |
      Функционирование и непрерывное улучшение сертифицированной системы
      менеджмента HSE.
    source_hash: sha256-5afaed9dca67948e
  BC-5050.10.30:
    name: Культура и поведение в области безопасности
    description: |
      Развитие позитивной культуры безопасности и безопасного поведения
      среди рабочей силы.
    source_hash: sha256-33e73fe44fb83fd7
  BC-5050.10.40:
    name: Компетентность и обучение HSE
    description: |
      Обеспечение компетентности, обучения и допуска персонала в области
      HSE.
    source_hash: sha256-a70eaf44e561ea4b
  BC-5050.20:
    name: Управление строительной безопасностью
    description: |
      Управление рисками строительной безопасности через проектирование,
      площадные средства контроля, разрешения и безопасные системы работ.
    source_hash: sha256-fe8cae8bf9bedb16
  BC-5050.20.10:
    name: CDM и управление проектными рисками
    description: |
      Управление обязанностями по CDM и снижение рисков на этапе
      проектирования.
    source_hash: sha256-36ca456bf43f3bff
  BC-5050.20.20:
    name: Управление безопасностью на площадке
    description: |
      Повседневное управление средствами контроля безопасности и надзор
      на строительной площадке.
    source_hash: sha256-3b2a7f642438eb29
  BC-5050.20.30:
    name: Управление разрешениями на работы
    description: |
      Контроль работ повышенного риска через системы разрешений на
      работы.
    source_hash: sha256-52f354c8e121b9fe
  BC-5050.20.40:
    name: Технологические карты и оценка рисков
    description: |
      Подготовка и контроль технологических карт и оценок рисков задач
      для безопасного выполнения.
    source_hash: sha256-94c6d8b01bd255c9
  BC-5050.30:
    name: Управление гигиеной труда
    description: |
      Защита здоровья рабочей силы через наблюдение, бытовые условия,
      гигиену и управление благополучием.
    source_hash: sha256-6659bc982cc38b9c
  BC-5050.30.10:
    name: Наблюдение за гигиеной труда
    description: |
      Мониторинг здоровья и пригодности рабочей силы относительно
      профессиональных воздействий.
    source_hash: sha256-7e16b35348a51224
  BC-5050.30.20:
    name: Обеспечение бытовых условий
    description: |
      Предоставление бытовых объектов и условий для рабочей силы на
      площадке.
    source_hash: sha256-83c580cb9c2e1884
  BC-5050.30.30:
    name: Мониторинг воздействий и гигиены
    description: |
      Мониторинг и контроль профессиональных воздействий и гигиены
      рабочих мест.
    source_hash: sha256-03ec82a56043cf5f
  BC-5050.30.40:
    name: Управление усталостью и благополучием
    description: |
      Управление усталостью, психическим здоровьем и благополучием
      рабочей силы.
    source_hash: sha256-4bd1fb3d9b47c488
  BC-5050.40:
    name: Экологический менеджмент
    description: |
      Управление экологическими воздействиями, средствами контроля и
      согласованиями в строительстве и эксплуатации.
    source_hash: sha256-3e9ae086b2098469
  BC-5050.40.10:
    name: Экологические средства контроля
    description: |
      Внедрение средств контроля, ограничивающих экологическое
      воздействие работ и операций.
    source_hash: sha256-e1076a34183f471d
  BC-5050.40.20:
    name: Предотвращение загрязнения
    description: |
      Предотвращение и контроль загрязнения воздуха, воды и земли в
      процессе работ.
    source_hash: sha256-068c6e62f992db3d
  BC-5050.40.30:
    name: Соблюдение экологических согласований
    description: |
      Соблюдение экологических согласований, разрешений и лицензионных
      условий.
    source_hash: sha256-e6c1eb85a2778e1d
  BC-5050.40.40:
    name: Защита экологии и историко-культурного наследия
    description: |
      Защита экологии, биоразнообразия и объектов историко-культурного
      наследия, затронутых работами.
    source_hash: sha256-f1a5e1daa9a044a5
  BC-5050.50:
    name: Управление инцидентами и чрезвычайными ситуациями
    description: |
      Отчётность, расследование и реагирование на чрезвычайные ситуации
      по инцидентам HSE с мониторингом эффективности.
    source_hash: sha256-8ed077243773e402
  BC-5050.50.10:
    name: Отчётность и расследование инцидентов
    description: |
      Отчётность и расследование инцидентов HSE и предпосылок к ним.
    source_hash: sha256-4d252fb602c0e61a
  BC-5050.50.20:
    name: Анализ первопричин
    description: |
      Анализ глубинных причин для предотвращения повторения инцидентов.
    source_hash: sha256-51a62957d2311273
  BC-5050.50.30:
    name: Планирование реагирования на чрезвычайные ситуации
    description: |
      Планирование и готовность к реагированию на чрезвычайные ситуации
      на площадках и активах.
    source_hash: sha256-ba9c27ad6816fee4
  BC-5050.50.40:
    name: Мониторинг эффективности HSE
    description: |
      Мониторинг и отчётность об эффективности HSE и опережающих
      индикаторах.
    source_hash: sha256-fbf0f34769e795c3
