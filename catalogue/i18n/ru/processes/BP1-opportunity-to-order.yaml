kind: business-process
locale: ru
source: BP1-opportunity-to-order.yaml
entries:
  BP-1060:
    name: "Возможность-в-Заказ"
    description: "Pre-sale цикл корпоративных продаж от квалификации возможности через scoping решения, котировку и конфигурацию, утверждение цен, предложение, переговоры, контракт и booking заказа и handover в исполнение. Один BP2 на каждый stage_name VS-380."
  BP-1060.10:
    name: "Квалификация возможности"
    description: "Квалифицировать возможность по соответствию, бюджету, полномочиям и срокам; принять решение о вложении усилий преследования."
  BP-1060.10.10:
    name: "Захватить возможность"
    description: "Захватить возможность в CRM с источником, продуктами интереса, целевой датой закрытия и контекстом аккаунта."
  BP-1060.10.20:
    name: "Квалифицировать возможность"
    description: "Применить критерии квалификации (BANT, MEDDIC или эквивалент) для валидации соответствия, бюджета, полномочий, потребности и сроков."
  BP-1060.10.30:
    name: "Построить план преследования"
    description: "Принять решение о преследовании, построить план аккаунта и карту decision-making-unit и собрать команду преследования."
  BP-1060.20:
    name: "Scoping решения"
    description: "Раскрыть требования клиента и разработать решение, которое им соответствует в рамках коммерческих и операционных ограничений."
  BP-1060.20.10:
    name: "Раскрыть требования"
    description: "Провести discovery-воркшопы и интервью для захвата функциональных, нефункциональных и контекстных операционных требований."
  BP-1060.20.20:
    name: "Разработать решение"
    description: "Перевести требования в кандидатное решение — продукты, услуги, интеграции, конфигурации."
  BP-1060.20.30:
    name: "Валидировать осуществимость решения"
    description: "Валидировать решение с поставкой, финансами и риском на осуществимость, исполнимость и приемлемую маржу."
  BP-1060.30:
    name: "Котировка и конфигурация"
    description: "Сконфигурировать ценообразованное предложение для клиента используя продуктовый конфигуратор, ценовые правила и фреймворки скидок."
  BP-1060.30.10:
    name: "Сконфигурировать пакет решения"
    description: "Использовать продуктовый конфигуратор для составления ценообразованного пакета из компонентов каталога предложений."
  BP-1060.30.20:
    name: "Рассчитать котировку"
    description: "Применить прейскурантную цену, контрактную скидку и налоговые правила для получения ценообразованной котировки."
  BP-1060.40:
    name: "Ценообразование и утверждения"
    description: "Применить governance скидок и маржи; провести через workflow утверждения цен; зафиксировать решения утверждающих."
  BP-1060.40.10:
    name: "Проверить ценовой комплаенс"
    description: "Валидировать котировку относительно правил скидок, маржи и special-pricing-agreement; пометить исключения."
  BP-1060.40.20:
    name: "Маршрутизировать утверждения цен"
    description: "Провести исключительные котировки через иерархию утверждения скидок; зафиксировать решения, условия и обоснования."
  BP-1060.50:
    name: "Разработка предложения"
    description: "Построить формальное предложение или ответ на RFP; оркестрировать входы от решения, юридического, безопасности и поставки."
  BP-1060.50.10:
    name: "Авторить контент предложения"
    description: "Авторить нарратив предложения — executive summary, решение, поставка, коммерция, референсы, условия."
  BP-1060.50.20:
    name: "Координировать входы SME"
    description: "Координировать входы от SME решения, юридического, безопасности, финансов и поставки в предложение."
  BP-1060.50.30:
    name: "Подать предложение"
    description: "Отформатировать, проревьюить и подать предложение через требуемый клиентом канал (RFP портал, email, очно)."
  BP-1060.60:
    name: "Переговоры"
    description: "Согласовать коммерческие и контрактные условия с клиентом; разрешить открытые позиции до принятия."
  BP-1060.60.10:
    name: "Провести коммерческие переговоры"
    description: "Согласовать цену, условия оплаты, обязательства по объёму и коммерческие уступки."
  BP-1060.60.20:
    name: "Согласовать контрактные условия"
    description: "Согласовать юридические условия — SLA, гарантии возмещения, IP, безопасность, данные — с юридическим и юристом клиента."
  BP-1060.60.30:
    name: "Разрешить открытые вопросы"
    description: "Отслеживать и закрывать все открытые вопросы — коммерческие, технические, юридические — пока клиент не будет готов подписать."
  BP-1060.70:
    name: "Контракт и booking заказа"
    description: "Заключить контракт, забукировать заказ и инициировать downstream provisioning, исполнение и признание выручки."
  BP-1060.70.10:
    name: "Заключить контракт"
    description: "Получить подписи клиента и уполномоченных лиц; сохранить заключённый контракт; связать с аккаунтом и заказом."
  BP-1060.70.20:
    name: "Забукировать заказ на продажу"
    description: "Преобразовать заключённый контракт в твёрдый заказ на продажу в OMS; валидировать полноту относительно условий контракта."
  BP-1060.70.30:
    name: "Подтвердить booking с финансами"
    description: "Подтвердить booking финансам для backlog, биллинга и настройки признания выручки; разрешить любые удержания."
  BP-1060.80:
    name: "Handover в исполнение"
    description: "Передать забукированный заказ в исполнение, поставку или сервисные команды; закрыть петлю с продажами для продления."
  BP-1060.80.10:
    name: "Провести handover sales-to-delivery"
    description: "Провести handover-встречу; передать контекст, критерии успеха и отношения с клиентом от продаж к поставке."
  BP-1060.80.20:
    name: "Настроить delivery engagement"
    description: "Настроить delivery engagement — проект, account team, success plan — и подтвердить готовность к kick-off."
  BP-1060.80.30:
    name: "Закрыть цикл продаж"
    description: "Закрыть возможность в CRM, зафиксировать причины win/loss и инициировать workflows комиссионных и отслеживания продления."
