kind: business-process
locale: ru
source: BP1-strategy-to-execution.yaml
entries:
  BP-1100:
    name: "Стратегия-в-Исполнение"
    description: "Сквозной цикл реализации стратегии от формулирования стратегии через определение портфеля, настройку программ и проектов, поставку и governance, адаптацию изменений и реализацию выгод. Один BP2 на каждый stage_name VS-580."
    source_hash: sha256-b69e3a9f9cb68335
  BP-1100.10:
    name: "Формулирование стратегии"
    description: "Установить корпоративную стратегию — видение, цели, выборы и операционную модель, необходимую для победы."
    source_hash: sha256-97985b6ffdf1e6ec
  BP-1100.10.10:
    name: "Определить стратегическое направление"
    description: "Определить видение, миссию, стратегические цели и принципы, направляющие выборы."
    source_hash: sha256-15c6b4668bf15d3f
  BP-1100.10.20:
    name: "Сделать стратегические выборы"
    description: "Сделать выборы where-to-play и how-to-win; разрешить trade-offs между рынками, сегментами, продуктами и способностями."
    source_hash: sha256-5e96a52229977c49
  BP-1100.10.30:
    name: "Определить операционную модель"
    description: "Определить операционную модель — способности, организация, локации и партнёры — необходимую для исполнения стратегии."
    source_hash: sha256-532364c16c646f10
  BP-1100.20:
    name: "Определение портфеля"
    description: "Перевести стратегию в портфель программ и инвестиций, которые принесут выбранные результаты."
    source_hash: sha256-52979b4cc361e2fb
  BP-1100.20.10:
    name: "Идентифицировать инвестиции портфеля"
    description: "Идентифицировать кандидатные инвестиции, которые закроют стратегические пробелы; зафиксировать ценность, стоимость, риск и зависимости."
    source_hash: sha256-a255a676c5a92195
  BP-1100.20.20:
    name: "Приоритизировать портфель"
    description: "Приоритизировать инвестиции по ценности, соответствию, мощности и риску; построить интегрированный портфель по горизонтам."
    source_hash: sha256-f03cdad52c8805e8
  BP-1100.20.30:
    name: "Утвердить портфель"
    description: "Утвердить и профинансировать портфель через executive forum; инициировать настройку программ и проектов."
    source_hash: sha256-85d7555712299e11
  BP-1100.30:
    name: "Настройка программ и проектов"
    description: "Настроить программы и проекты с charter, governance, планом, командой и бюджетом."
    source_hash: sha256-ce4e2e6a61b682a8
  BP-1100.30.10:
    name: "Чартерировать программу"
    description: "Чартерировать программу — результаты, scope, governance, спонсор, accountabilities, критерии успеха."
    source_hash: sha256-523d39e37c5a23c8
  BP-1100.30.20:
    name: "Спланировать поставку программы"
    description: "Построить интегрированный план поставки по составляющим проектам с milestones, зависимостями и ресурсами."
    source_hash: sha256-cc86c80e5649b442
  BP-1100.30.30:
    name: "Развернуть проектные команды"
    description: "Сформировать проектные команды, подтвердить роли, онбордить и инициировать спринт или phase-zero работу."
    source_hash: sha256-ae419aaafaa1e9f3
  BP-1100.40:
    name: "Поставка и governance"
    description: "Поставлять программы и проекты по плану; вести governance для выявления риска, принятия решений по изменениям и обеспечения качества."
    source_hash: sha256-ae2b4708e1df0be1
  BP-1100.40.10:
    name: "Выполнять проектную работу"
    description: "Выполнять проектную работу — дизайн, сборка, тестирование, поставка — согласно выбранному методу поставки (agile, waterfall, hybrid)."
    source_hash: sha256-9bf9b5a86f20ab64
  BP-1100.40.20:
    name: "Вести governance программы"
    description: "Проводить steering committees, decision forums и quality gates под полномочиями корпоративного governance; выявлять и разрешать риски, проблемы и изменения."
    source_hash: sha256-0b4a4d5dbd234177
  BP-1100.40.30:
    name: "Управлять рисками и изменениями программы"
    description: "Поддерживать risk register и change log; митигировать, эскалировать и принимать решения по изменениям через governance."
    source_hash: sha256-3ae7a9edd2f7cb97
  BP-1100.50:
    name: "Адаптация изменений"
    description: "Продвигать end-user adoption изменений, поставленных программой — коммуницировать, обучать, поддерживать, поддерживать."
    source_hash: sha256-0b19e3e156fafe51
  BP-1100.50.10:
    name: "Спланировать адаптацию изменений"
    description: "Построить план адаптации изменений — карта стейкхолдеров, коммуникация, обучение, поддержка, устойчивость."
    source_hash: sha256-315360500a67da74
  BP-1100.50.20:
    name: "Коммуницировать и обучать"
    description: "Проводить коммуникации и обучение по затронутой популяции согласно плану адаптации изменений."
    source_hash: sha256-44dcc4f8b540ec7f
  BP-1100.50.30:
    name: "Поддерживать adoption"
    description: "Обеспечивать hyper-care поддержку, выявлять блокеры adoption и проводить активности усиления."
    source_hash: sha256-60db912031fed422
  BP-1100.60:
    name: "Реализация выгод"
    description: "Отслеживать и собирать стратегические выгоды, которые программа обязалась поставить; закрыть программу."
    source_hash: sha256-3b245ce45240daf2
  BP-1100.60.10:
    name: "Отслеживать метрики выгод"
    description: "Отслеживать обязанные выгоды — выручка, стоимость, NPS, throughput — относительно базовой линии и цели."
    source_hash: sha256-d6501d54848c2c1f
  BP-1100.60.20:
    name: "Собрать выгоды"
    description: "Собрать выгоды в business-as-usual — встроить в бюджеты, KPI, run-the-business процессы."
    source_hash: sha256-bca0879512514bda
  BP-1100.60.30:
    name: "Закрыть программу"
    description: "Закрыть программу — финальный отчёт, lessons learned, архивирование, освобождение команды; инициировать любые follow-on портфельные движения."
    source_hash: sha256-25c19e1849fe48b3
