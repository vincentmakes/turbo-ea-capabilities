kind: business-process
locale: ru
source: BP1-crisis-to-recovery.yaml
entries:
  BP-1140:
    name: "Кризис-в-Восстановление"
    description: "Цикл business-continuity и crisis-management от планирования continuity через тестирование устойчивости, обнаружение и активацию, кризисный response, disaster recovery, восстановление и пост-кризисное ревью. Один BP2 на каждый stage_name VS-140."
  BP-1140.10:
    name: "Планирование continuity"
    description: "Строить и поддерживать планы business-continuity и disaster-recovery для критических процессов и систем."
  BP-1140.10.10:
    name: "Провести business-impact analysis"
    description: "Идентифицировать критические процессы, цели RTO/RPO, зависимости и минимальные операционные требования."
  BP-1140.10.20:
    name: "Построить планы continuity"
    description: "Построить планы business-continuity уровня процесса и площадки — workarounds, альтернативные площадки, ключевые контакты."
  BP-1140.10.30:
    name: "Построить планы disaster-recovery"
    description: "Построить IT планы disaster-recovery — runbooks, репликация, цели failover — для критических систем."
  BP-1140.20:
    name: "Тестирование устойчивости"
    description: "Тестировать планы continuity и recovery — tabletops, walk-throughs, полный failover."
  BP-1140.20.10:
    name: "Провести tabletop упражнения"
    description: "Провести tabletop упражнения с ключевыми командами для валидации планов и выявления пробелов без нарушения операций."
  BP-1140.20.20:
    name: "Провести failover drills"
    description: "Провести контролируемые failover drills для валидации технического восстановления; зафиксировать тайминг относительно целей."
  BP-1140.20.30:
    name: "Обновить планы по находкам тестов"
    description: "Обновить планы continuity и recovery на основе находок тестов; закрыть пробелы до следующего цикла."
  BP-1140.30:
    name: "Обнаружение и активация"
    description: "Обнаружить триггер кризиса и активировать response — incident commander, war-room, коммуникации."
  BP-1140.30.10:
    name: "Обнаружить триггер кризиса"
    description: "Обнаружить события, соответствующие критериям crisis-trigger — отказ, breach, событие безопасности, регуляторное действие."
  BP-1140.30.20:
    name: "Активировать кризисный протокол"
    description: "Активировать crisis-management протокол — назначить commander, созвать war-room, установить каденцию коммуникаций."
  BP-1140.40:
    name: "Кризисный response"
    description: "Управлять активным кризисом — защищать людей и активы, сдерживать вред, коммуницировать, координировать."
  BP-1140.40.10:
    name: "Защитить людей и активы"
    description: "Проводить защитные действия — эвакуация, останов, изоляция, медицинская, безопасность — для ограничения вреда."
  BP-1140.40.20:
    name: "Сдержать влияние кризиса"
    description: "Сдерживать операционное, финансовое, регуляторное и репутационное влияние через целевые response-действия."
  BP-1140.40.30:
    name: "Управлять кризисными коммуникациями"
    description: "Проводить внутренние, внешние, регуляторные и медиа-коммуникации на протяжении активного кризиса."
  BP-1140.50:
    name: "Disaster recovery"
    description: "Исполнять процедуры disaster-recovery для восстановления IT-сервисов в рамках целей RTO/RPO."
  BP-1140.50.10:
    name: "Исполнить IT failover"
    description: "Исполнить запланированный failover критических IT-систем на recovery-инфраструктуру."
  BP-1140.50.20:
    name: "Валидировать восстановленные сервисы"
    description: "Валидировать восстановленные сервисы по acceptance-критериям; возобновить customer-facing операции."
  BP-1140.50.30:
    name: "Провести reverse failover"
    description: "Спланировать и исполнить возврат на основную инфраструктуру после стабилизации; валидировать полное восстановление."
  BP-1140.60:
    name: "Восстановление"
    description: "Восстановить физические активы, цепи поставок и операции до пред-кризисного состояния."
  BP-1140.60.10:
    name: "Восстановить физические операции"
    description: "Восстановить физические активы, площадки и оборудование до рабочего состояния; пройти проверки безопасности."
  BP-1140.60.20:
    name: "Восстановить поток поставок и спроса"
    description: "Восстановить поток поставщиков, поток заказов клиентов и позиционирование запаса до базовой линии."
  BP-1140.70:
    name: "Пост-кризисное ревью"
    description: "Провести after-action review; зафиксировать уроки; продвинуть системные улучшения устойчивости."
  BP-1140.70.10:
    name: "Провести after-action review"
    description: "Провести blameless after-action review со всеми respondants; зафиксировать timeline, решения и уроки."
  BP-1140.70.20:
    name: "Улучшить устойчивость"
    description: "Перевести уроки в улучшения устойчивости — контроли, планы, обучение, технологии."
