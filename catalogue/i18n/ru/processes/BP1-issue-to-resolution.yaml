kind: business-process
locale: ru
source: BP1-issue-to-resolution.yaml
entries:
  BP-1070:
    name: "Инцидент-в-Разрешение"
    description: "Универсальный цикл обработки инцидентов и вопросов от захвата через расследование, разрешение и lessons learned. Используется в обслуживании клиентов, IT, безопасности, комплаенсе, аудите и операционном риске — отраслевые варианты в VS-310 сворачиваются здесь в четыре логических фазы."
    source_hash: sha256-b983a0971b80b34a
  BP-1070.10:
    name: "Захват инцидента"
    description: "Захватывать инциденты, жалобы, дефекты, near-misses и аудиторские находки через любой канал; сохранять со структурированными метаданными."
    source_hash: sha256-093e28b2aff5be18
  BP-1070.10.10:
    name: "Принять инцидент"
    description: "Принять инцидент из исходного канала (клиент, сотрудник, система, регулятор, аудит) в систему управления инцидентами."
    source_hash: sha256-6677adae952fc44a
  BP-1070.10.20:
    name: "Классифицировать инцидент"
    description: "Классифицировать инцидент по типу, серьёзности, бизнес-влиянию и затронутому сервису или активу; направить в правильную очередь."
    source_hash: sha256-cba5705b5f9d810f
  BP-1070.10.30:
    name: "Подтвердить получение инициатору"
    description: "Подтвердить получение инициатору с идентификатором кейса и ожидаемой каденцией ответа."
    source_hash: sha256-a717b2fcc19577ea
  BP-1070.10.40:
    name: "Запустить протокол major-incident"
    description: "Для инцидентов высокой серьёзности запустить протокол major-incident или кризиса — incident commander, war-room, пути эскалации."
    source_hash: sha256-87779e038caf7086
  BP-1070.20:
    name: "Расследование"
    description: "Расследовать инцидент — собирать доказательства, проводить диагностику, идентифицировать первопричину и оценивать влияние."
    source_hash: sha256-9a76413da5babd6b
  BP-1070.20.10:
    name: "Собрать доказательства"
    description: "Собирать логи, заявления, образцы и другие доказательства, относящиеся к инциденту; сохранять в case file."
    source_hash: sha256-f1889e0eb572f35a
  BP-1070.20.20:
    name: "Диагностировать первопричину"
    description: "Применить методы анализа первопричин (5 whys, fault-tree, fishbone) для идентификации первичных и сопутствующих причин."
    source_hash: sha256-efd298ee1737914c
  BP-1070.20.30:
    name: "Оценить влияние"
    description: "Оценить клиентское, финансовое, регуляторное, безопасностное и репутационное влияние инцидента и предлагаемого пути разрешения."
    source_hash: sha256-537fbed4ced3fa38
  BP-1070.30:
    name: "Разрешение"
    description: "Разрешить инцидент — восстановить сервис, устранить вред, коммуницировать и закрыть кейс."
    source_hash: sha256-b5d47b41164583bf
  BP-1070.30.10:
    name: "Применить workaround"
    description: "Применить workaround для восстановления сервиса или сдерживания вреда, пока разрабатывается постоянное исправление."
    source_hash: sha256-f14e89ff6d03d050
  BP-1070.30.20:
    name: "Внедрить постоянное исправление"
    description: "Разработать и развернуть постоянное корректирующее действие через change management; валидировать исправление."
    source_hash: sha256-9c9fe4ea00149e05
  BP-1070.30.30:
    name: "Коммуницировать разрешение"
    description: "Коммуницировать разрешение инициатору, затронутым клиентам, регуляторам где требуется и внутренним стейкхолдерам."
    source_hash: sha256-9120ad28b948233e
  BP-1070.30.40:
    name: "Закрыть кейс"
    description: "Подтвердить удовлетворённость инициатора; закрыть кейс с полным аудиторским следом и оценкой CSAT или эквивалентом."
    source_hash: sha256-21993740429b4490
  BP-1070.40:
    name: "Lessons learned"
    description: "Извлечь уроки из кейса, продвинуть системные превентивные действия и улучшить способность к разрешению."
    source_hash: sha256-ecad8d3fe25fecc6
  BP-1070.40.10:
    name: "Провести post-incident review"
    description: "Провести blameless post-incident review; зафиксировать что прошло хорошо, что нет и что менять."
    source_hash: sha256-afac791cac610cae
  BP-1070.40.20:
    name: "Продвинуть превентивные действия"
    description: "Открывать и отслеживать превентивные действия (система, процесс, обучение); подтверждать закрытие с доказательствами."
    source_hash: sha256-1cc2a76473435e62
  BP-1070.40.30:
    name: "Обновить базу знаний"
    description: "Обновлять базу знаний, runbooks и правила решения с новыми доказательствами для ускорения будущих разрешений."
    source_hash: sha256-06c8c470a3324f6e
