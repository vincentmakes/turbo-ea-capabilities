kind: business-process
locale: ru
source: BP1-prospect-to-customer.yaml
entries:
  BP-1050:
    name: "Потенциальный клиент-в-Клиента"
    description: "Сквозной цикл привлечения клиентов от рыночной и сегментной стратегии через бренд, demand generation, захват лидов, конверсию, onboarding и непрерывное удержание и адвокатирование. Один BP2 на каждый stage_name VS-440."
  BP-1050.10:
    name: "Рыночная и сегментная стратегия"
    description: "Определить целевые рынки и сегменты клиентов и выровнять приоритеты go-to-market туда, где right-to-win сильнее всего."
  BP-1050.10.10:
    name: "Проанализировать рыночный ландшафт"
    description: "Оценить размер рынков, профилировать конкурентов и выявить тренды, формирующие спрос и стратегию привлечения."
  BP-1050.10.20:
    name: "Определить целевые сегменты"
    description: "Определить и приоритизировать целевые сегменты клиентов на основе потребности, соответствия и right-to-win."
  BP-1050.10.30:
    name: "Установить приоритеты привлечения"
    description: "Перевести приоритеты сегментов в цели привлечения — аккаунты, географии, каналы — на горизонт планирования."
  BP-1050.20:
    name: "Бренд и позиционирование"
    description: "Развивать и стюардить бренд, позиционирование и messaging system, используемую по всем каналам привлечения."
  BP-1050.20.10:
    name: "Разработать стратегию бренда"
    description: "Определить обещание бренда, личность, архитектуру и визуальную идентичность; выровнять по рынкам и сегментам."
  BP-1050.20.20:
    name: "Разработать позиционирование и messaging"
    description: "Разработать позиционирование и messaging для каждого сегмента и предложения; оснастить кампании и продажи последовательным нарративом."
  BP-1050.20.30:
    name: "Стюардить бренд-активы"
    description: "Поддерживать guidelines бренда, управлять утверждениями использования бренда и регулировать визуальную и вербальную идентичность на рынке."
  BP-1050.30:
    name: "Demand generation"
    description: "Генерировать осведомлённость и спрос в масштабе через paid, owned, earned и партнёрские каналы."
  BP-1050.30.10:
    name: "Спланировать кампании demand generation"
    description: "Спланировать кампании по сегменту, каналу и предложению; аллоцировать бюджет; установить цели по лидам и pipeline."
  BP-1050.30.20:
    name: "Исполнить мульти-канальные кампании"
    description: "Исполнить paid, owned, earned и партнёрские кампании; управлять креативом, landing pages и предложениями."
  BP-1050.30.30:
    name: "Измерить результативность кампаний"
    description: "Измерить охват, отклик и влияние на pipeline по кампании и каналу; итерировать креатив и расходы."
  BP-1050.40:
    name: "Захват и nurture лидов"
    description: "Захватывать входящий интерес, обогащать и оценивать лиды и nurture их до статуса sales-ready."
  BP-1050.40.10:
    name: "Захватить входящие лиды"
    description: "Захватить лиды из форм, мероприятий, партнёрских рекомендаций и входящих каналов в платформу маркетинговой автоматизации."
  BP-1050.40.20:
    name: "Обогатить и оценить лиды"
    description: "Обогатить фирмографическими и поведенческими данными; оценить по соответствию и намерению для идентификации sales-ready лидов."
  BP-1050.40.30:
    name: "Nurture лидов"
    description: "Запускать программы nurture — контент, drip-кампании, ретаргетинг — для продвижения лидов к статусу sales-ready."
  BP-1050.40.40:
    name: "Передать sales-ready лиды"
    description: "Направить sales-ready лиды в продажи для прямого engagement; отслеживать конверсию в opportunity."
  BP-1050.50:
    name: "Конверсия"
    description: "Конвертировать квалифицированные лиды в первые заказы или первые подписки через sales engagement, trials и предложения."
  BP-1050.50.10:
    name: "Engage потенциального клиента"
    description: "Запустить прямой sales engagement, демо и trials для построения уверенности клиента и продвижения к решению."
  BP-1050.50.20:
    name: "Адресовать возражения покупателя"
    description: "Выявлять и адресовать возражения — цена, соответствие, безопасность, интеграция — через доказательства и trial."
  BP-1050.50.30:
    name: "Предложить и закрыть первую сделку"
    description: "Сконструировать предложение для первой сделки, согласовать условия и захватить первый заказ или подписку."
  BP-1050.50.40:
    name: "Отслеживать воронку конверсии"
    description: "Отслеживать конверсию lead-to-customer по сегменту, каналу и предложению; итерировать воронку."
  BP-1050.60:
    name: "Onboarding клиента"
    description: "Онбордить новых клиентов — provisioning, обучение, success planning — для ускорения time-to-value."
  BP-1050.60.10:
    name: "Поприветствовать нового клиента"
    description: "Провести welcome-опыт — kickoff, именованные контакты, success plan — для установки ожиданий и энергии."
  BP-1050.60.20:
    name: "Provisioning клиента"
    description: "Provisioning клиента в системах поставки — аккаунты, entitlements, интеграции, миграция данных."
  BP-1050.60.30:
    name: "Обучить пользователей клиента"
    description: "Обучить пользователей клиента продукту или услуге; сертифицировать чемпионов; зафиксировать в milestones success plan."
  BP-1050.60.40:
    name: "Подтвердить time-to-value"
    description: "Валидировать, что клиент достиг milestones первой ценности; зафиксировать для скоринга удержания."
  BP-1050.70:
    name: "Удержание и адвокатирование"
    description: "Удерживать клиентов, продвигать продление и расширение и превращать промоутеров в адвокатов и референсы."
  BP-1050.70.10:
    name: "Запустить customer health scoring"
    description: "Оценить здоровье клиента по сигналам использования продукта, вовлечённости и обратной связи; выявить рискованные аккаунты для интервенции."
  BP-1050.70.20:
    name: "Продвинуть продление и расширение"
    description: "Запустить движение продления и идентифицировать возможности расширения — cross-sell, upsell — внутри аккаунта."
  BP-1050.70.30:
    name: "Культивировать адвокатирование"
    description: "Идентифицировать промоутеров, захватывать референсы, case studies и testimonials; активировать программы адвокатирования."
