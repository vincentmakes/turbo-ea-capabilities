kind: business-process
locale: ru
source: BP1-record-to-report.yaml
entries:
  BP-1080:
    name: "Запись-в-Отчётность"
    description: "Цикл финансового закрытия от захвата транзакций через закрытие субкниги, сверку, консолидацию, управленческую отчётность, статутарную и регуляторную отчётность и аудиторское подтверждение. Один BP2 на каждый stage_name VS-460."
    source_hash: sha256-4fde77e621173949
  BP-1080.10:
    name: "Захват транзакций"
    description: "Захватывать экономические транзакции из систем-источников в финансовый backbone с надлежащей кодировкой."
    source_hash: sha256-777e85c66d610c9a
  BP-1080.10.10:
    name: "Захватить транзакции из источников"
    description: "Захватывать транзакции из продаж, закупок, payroll, казначейства и других систем-источников в учётные feeds."
    source_hash: sha256-fbc670a75cbbd7dc
  BP-1080.10.20:
    name: "Применить кодировку счетов"
    description: "Применить кодировку счетов, cost-center и проектов согласно chart of accounts и политике."
    source_hash: sha256-3208ef579f9e5a6e
  BP-1080.10.30:
    name: "Валидировать данные транзакций"
    description: "Запустить правила валидации — полнота, классификация, валюта, период — и направить исключения на коррекцию."
    source_hash: sha256-94f1805cf11bb0f4
  BP-1080.20:
    name: "Закрытие субкниг"
    description: "Закрывать субкниги — AR, AP, основные средства, payroll, казначейство — и проводить в general ledger."
    source_hash: sha256-3a01332bbbd8e5b6
  BP-1080.20.10:
    name: "Закрыть субкнигу AR"
    description: "Закрыть субкнигу accounts-receivable; провести summary AR-to-GL и прокатить открытые балансы."
    source_hash: sha256-16b68b86dab484d7
  BP-1080.20.20:
    name: "Закрыть субкнигу AP"
    description: "Закрыть субкнигу accounts-payable; провести summary AP-to-GL и прокатить открытые балансы."
    source_hash: sha256-822c5ccc9d117a3e
  BP-1080.20.30:
    name: "Закрыть субкнигу основных средств"
    description: "Запустить амортизацию основных средств и поступления/выбытия; провести в GL."
    source_hash: sha256-2cc9569fd696441c
  BP-1080.20.40:
    name: "Закрыть прочие субкниги"
    description: "Закрыть субкниги payroll, казначейства, запасов и проектов; провести в GL с аудиторским следом."
    source_hash: sha256-dfa3c16a92f5cd96
  BP-1080.30:
    name: "Сверка и корректировки"
    description: "Сверять счета баланса и проводить корректировки конца периода для фиксации книг."
    source_hash: sha256-a40463df068adf10
  BP-1080.30.10:
    name: "Сверить счета баланса"
    description: "Сверить cash, AR, AP, intercompany, начисления и другие счета баланса с детализацией источников."
    source_hash: sha256-cdac4b1e9dea96b3
  BP-1080.30.20:
    name: "Провести корректировки конца периода"
    description: "Провести начисления, предоплаты, отсрочки и реклассификации; зафиксировать подтверждающую документацию."
    source_hash: sha256-94718769a1e91c73
  BP-1080.30.30:
    name: "Разрешить расхождения сверки"
    description: "Расследовать и разрешать сверочные позиции; эскалировать неразрешённые позиции в controllership для списания или переноса."
    source_hash: sha256-47fa45469b7aecfa
  BP-1080.40:
    name: "Консолидация"
    description: "Консолидировать финансы по юридическим лицам и валютам; элиминировать intercompany; произвести групповые результаты."
    source_hash: sha256-8664a943f2bd0932
  BP-1080.40.10:
    name: "Транслировать пробные балансы из локальной валюты"
    description: "Транслировать пробные балансы локальной валюты в отчётную валюту по соответствующим курсам FX согласно стандарту учёта."
    source_hash: sha256-f313d0c3bb592eaf
  BP-1080.40.20:
    name: "Элиминировать intercompany"
    description: "Элиминировать intercompany продажи, балансы и нереализованную прибыль согласно правилам консолидации."
    source_hash: sha256-9a6678eccaf80ba7
  BP-1080.40.30:
    name: "Произвести групповые консолидированные результаты"
    description: "Произвести консолидированный баланс, отчёт о прибылях, cash flow и капитал для группы; сохранить в системе консолидации."
    source_hash: sha256-7a001bb947c22f23
  BP-1080.50:
    name: "Управленческая отчётность"
    description: "Производить внутренние управленческие отчёты для исполнительной команды, совета директоров и операционных лидеров."
    source_hash: sha256-9c8b574b42de7183
  BP-1080.50.10:
    name: "Построить управленческие отчёты"
    description: "Построить управленческие отчёты — P&L по сегменту, cost centre, продукту, клиенту; представления cash и оборотного капитала."
    source_hash: sha256-de53fc2bd2c34b48
  BP-1080.50.20:
    name: "Проанализировать отклонения от плана"
    description: "Проанализировать отклонения факт vs план и от прошлого периода; идентифицировать драйверы и корректирующие действия."
    source_hash: sha256-f7c61b60767e9595
  BP-1080.50.30:
    name: "Распространить management pack"
    description: "Распространять management reporting pack руководителям и операционным лидерам с согласованной каденцией."
    source_hash: sha256-704f3bdaa5a9510b
  BP-1080.60:
    name: "Статутарная и регуляторная отчётность"
    description: "Производить статутарную, регуляторную и налоговую отчётность для органов в срок."
    source_hash: sha256-28b70bf275aca7d0
  BP-1080.60.10:
    name: "Подготовить статутарные отчёты"
    description: "Подготовить статутарную финансовую отчётность по локальному GAAP / IFRS для каждого юридического лица в юрисдикции."
    source_hash: sha256-b8abdafd810f4956
  BP-1080.60.20:
    name: "Подать налоговые декларации"
    description: "Подготовить и подать декларации по корпоративному налогу на прибыль, VAT/GST, удержаниям и transfer-pricing по юрисдикции."
    source_hash: sha256-daddfbd3713c4626
  BP-1080.60.30:
    name: "Подать регуляторные отчёты"
    description: "Подавать отраслевые регуляторные отчёты (банковские, страховые, раскрытия публичных компаний) применимым регуляторам."
    source_hash: sha256-9492faf5010a52e2
  BP-1080.70:
    name: "Аудит и подтверждение"
    description: "Поддерживать внутренний и внешний аудит; получать подтверждение по финансовой отчётности и контролям."
    source_hash: sha256-fbcdf10910aea625
  BP-1080.70.10:
    name: "Поддержать внешний аудит"
    description: "Предоставлять доказательства и walk-throughs внешним аудиторам; разрешать аудиторские запросы; реагировать на находки."
    source_hash: sha256-9373890a507a8478
  BP-1080.70.20:
    name: "Поддержать внутренний аудит"
    description: "Поддерживать ревью внутреннего аудита по финансовому закрытию, сверкам и контролям; закрывать находки."
    source_hash: sha256-93f2c12d1ae74ff2
  BP-1080.70.30:
    name: "Получить подтверждение менеджмента"
    description: "Получить подтверждение CFO и CEO по финансовой отчётности и репрезентациям контролей SOX / эквивалент; брифинговать audit committee согласно протоколу корпоративного управления."
    source_hash: sha256-7615dbb49880ed60
