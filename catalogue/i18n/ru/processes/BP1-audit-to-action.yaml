kind: business-process
locale: ru
source: BP1-audit-to-action.yaml
entries:
  BP-1120:
    name: "Аудит-в-Действие"
    description: "Цикл внутреннего аудита от планирования audit-universe через scoping engagement, fieldwork, находки, отслеживание remediation и quality assurance аудита. Один BP2 на каждый stage_name VS-80."
  BP-1120.10:
    name: "Audit universe и план"
    description: "Поддерживать audit universe и строить риск-ориентированный годовой план аудита."
  BP-1120.10.10:
    name: "Поддерживать audit universe"
    description: "Поддерживать популяцию аудируемых сущностей — процессы, системы, локации, третьи стороны."
  BP-1120.10.20:
    name: "Построить риск-ориентированный план аудита"
    description: "Построить годовой план аудита из universe взвешенный по риску; получить утверждение audit committee."
  BP-1120.20:
    name: "Scoping engagement"
    description: "Сделать scoping аудиторского engagement — цели, контроли в scope, период, ресурсы."
  BP-1120.20.10:
    name: "Определить цели аудита"
    description: "Определить цели аудита, ключевые вопросы и риски для адресации в engagement."
  BP-1120.20.20:
    name: "Спланировать аудиторские процедуры"
    description: "Спланировать аудиторские процедуры — walk-throughs, выборочные тесты, аналитика — и требуемые доказательства."
  BP-1120.30:
    name: "Fieldwork"
    description: "Выполнить аудиторский fieldwork — собрать доказательства, провести тесты и задокументировать workpapers."
  BP-1120.30.10:
    name: "Провести walk through процесса"
    description: "Провести walk through по процессу в scope для понимания дизайна и ключевых контролей; задокументировать нарратив и flowchart."
  BP-1120.30.20:
    name: "Тестировать контроли и транзакции"
    description: "Провести выборочное или популяционное тестирование дизайна и операционной эффективности; задокументировать workpapers."
  BP-1120.30.30:
    name: "Запустить аудиторскую аналитику"
    description: "Запустить аналитику данных по полной популяции для выявления аномалий, исключений и паттернов."
  BP-1120.30.40:
    name: "Задокументировать аудиторские доказательства"
    description: "Задокументировать доказательства в workpapers с перекрёстными ссылками; получить подтверждения auditee где требуется."
  BP-1120.40:
    name: "Находки и отчётность"
    description: "Разработать находки, согласовать ответы менеджмента и выпустить аудиторский отчёт."
  BP-1120.40.10:
    name: "Разработать находки"
    description: "Разработать находки с условием, критерием, причиной, последствием и рекомендацией."
  BP-1120.40.20:
    name: "Согласовать ответы менеджмента"
    description: "Согласовать ответ менеджмента — принять, альтернативное действие, оспорить — с auditee и целевую дату remediation."
  BP-1120.40.30:
    name: "Выпустить аудиторский отчёт"
    description: "Выпустить финальный аудиторский отчёт исполнительному спонсору и audit committee; закрыть engagement."
  BP-1120.50:
    name: "Отслеживание remediation"
    description: "Отслеживать remediation находок менеджментом до закрытия; верифицировать re-test где применимо."
  BP-1120.50.10:
    name: "Отслеживать статус remediation"
    description: "Отслеживать открытые аудиторские находки, целевые даты и прогресс менеджмента по плану remediation."
  BP-1120.50.20:
    name: "Верифицировать закрытие"
    description: "Верифицировать закрытие находки через re-test, ревью доказательств или follow-up аудит; закрыть в трекере."
  BP-1120.60:
    name: "Quality assurance аудита"
    description: "Проводить quality assurance над аудиторской функцией — ревью workpapers, peer review, внешняя оценка."
  BP-1120.60.10:
    name: "Проревьюить аудиторские workpapers"
    description: "Провести supervisory review workpapers и находок на достаточные и подходящие доказательства."
  BP-1120.60.20:
    name: "Провести внешнюю оценку качества"
    description: "Проводить периодическую внешнюю оценку качества аудиторской функции согласно IIA Standards."
