kind: business-process
locale: ru
source: BP1-threat-to-mitigation.yaml
entries:
  BP-1150:
    name: "Угроза-в-Митигацию"
    description: "Цикл операционной кибербезопасности от определения posture через threat intelligence, обнаружение уязвимостей, детекцию, incident response, ужесточение identity-and-access и осведомлённость. Один BP2 на каждый stage_name VS-600."
  BP-1150.10:
    name: "Определение security posture"
    description: "Определить security posture, базовую линию контролей и целевую зрелость для предприятия."
  BP-1150.10.10:
    name: "Определить стратегию безопасности"
    description: "Определить стратегию кибербезопасности — risk appetite, целевая зрелость, фреймворк (NIST CSF, ISO 27001)."
  BP-1150.10.20:
    name: "Установить базовую линию контролей"
    description: "Установить базовую линию контролей для предприятия; выровнять с фреймворками контролей и применимым регулированием."
  BP-1150.20:
    name: "Threat intelligence"
    description: "Собирать, анализировать и распространять threat intelligence защитникам и принимающим решения."
  BP-1150.20.10:
    name: "Собирать threat intelligence"
    description: "Собирать threat intelligence из внутренних сенсоров, ISAC feeds, вендоров и OSINT."
  BP-1150.20.20:
    name: "Анализировать и распространять intelligence"
    description: "Анализировать intelligence на релевантность и операционализировать — IOCs, гипотезы хантов, брифинги."
  BP-1150.30:
    name: "Обнаружение уязвимостей"
    description: "Обнаруживать уязвимости — сканирования, pen tests, bug bounty, ревью кода — и продвигать remediation."
  BP-1150.30.10:
    name: "Запускать сканирования уязвимостей"
    description: "Запускать непрерывные сканирования уязвимостей по инфраструктуре, приложениям и cloud workloads."
  BP-1150.30.20:
    name: "Проводить pen tests"
    description: "Проводить периодические и event-driven penetration tests; фиксировать эксплуатируемые находки и remediations."
  BP-1150.30.30:
    name: "Продвигать remediation уязвимостей"
    description: "Приоритизировать уязвимости по эксплуатируемости и критичности активов; отслеживать remediation против SLA."
  BP-1150.40:
    name: "Детекция"
    description: "Обнаруживать события безопасности через мониторинг, аналитику, threat hunting и поведенческие базовые линии."
  BP-1150.40.10:
    name: "Эксплуатировать мониторинг безопасности"
    description: "Эксплуатировать SOC — SIEM, EDR, XDR, network detection — для мониторинга событий безопасности 24/7."
  BP-1150.40.20:
    name: "Триажировать и расследовать алёрты"
    description: "Триажировать и расследовать алёрты; эскалировать подтверждённые инциденты; закрывать ложные срабатывания."
  BP-1150.40.30:
    name: "Хантить угрозы"
    description: "Проводить проактивные хант угроз по гипотезам, выведенным из intelligence и emerging TTPs."
  BP-1150.50:
    name: "Incident response"
    description: "Реагировать на подтверждённые инциденты безопасности — сдерживать, искоренять, восстанавливать и извлекать уроки."
  BP-1150.50.10:
    name: "Сдержать инцидент"
    description: "Сдержать инцидент — изолировать затронутые системы, отозвать учётные данные, заблокировать трафик — для остановки распространения."
  BP-1150.50.20:
    name: "Искоренить угрозу"
    description: "Искоренить угрозу — удалить вредонос, пропатчить уязвимость, закрыть механизм persistence."
  BP-1150.50.30:
    name: "Восстановить операции"
    description: "Восстановить затронутые системы и операции до known-good состояния; валидировать перед возвратом в эксплуатацию."
  BP-1150.50.40:
    name: "Уведомить и отчитаться"
    description: "Уведомить регуляторов, клиентов и затронутые стороны согласно обязательствам breach-notification и протоколу."
  BP-1150.60:
    name: "Ужесточение identity и access"
    description: "Ужесточить identity и access — IAM, MFA, privileged access — для предотвращения identity-based путей атаки."
  BP-1150.60.10:
    name: "Управлять жизненным циклом identity"
    description: "Управлять жизненным циклом identity — provisioning, изменение роли, deprovisioning — по сотрудникам, контракторам и машинам."
  BP-1150.60.20:
    name: "Обеспечить контроли аутентификации"
    description: "Обеспечить MFA, conditional access и risk-based authentication по всем путям доступа."
  BP-1150.60.30:
    name: "Регулировать privileged access"
    description: "Регулировать privileged access — vault, just-in-time elevation, мониторинг сессий, периодическая повторная аттестация."
  BP-1150.70:
    name: "Осведомлённость и lessons learned"
    description: "Проводить security awareness среди персонала; захватывать уроки из инцидентов и упражнений."
  BP-1150.70.10:
    name: "Проводить security awareness"
    description: "Проводить тренинги security-awareness, симуляции фишинга и role-targeted обучение."
  BP-1150.70.20:
    name: "Захватывать и применять уроки"
    description: "Захватывать уроки из инцидентов, упражнений и breach-отчётов; применять к контролям, обучению, runbooks."
