kind: business-process
locale: ru
source: BP1-order-to-cash.yaml
entries:
  BP-1000:
    name: "Заказ-в-Деньги"
    description: "Сквозной цикл выручки от захвата лида через котировку, контракт и захват заказа (с проверкой кредита), обещание срока поставки и аллокацию, производство или оказание услуги, исходящую логистику, выставление счёта клиенту, инкассацию и применение денежных средств, а также признание выручки. Один BP2 на каждую стадию VS-390; BP3 раскладывает работу на операционные активности в форме инфинитивов."
    source_hash: sha256-02663879ffca2011
  BP-1000.10:
    name: "Захват и квалификация лидов"
    description: "Захватить интерес потенциального клиента, обогатить его фирмографическими и поведенческими данными, оценить по критериям ideal-customer-profile и направить квалифицированные лиды в продажи."
    source_hash: sha256-07bdfadef9990ed2
  BP-1000.10.10:
    name: "Захватить входящий лид"
    description: "Принять входящий интерес потенциального клиента из веб-форм, мероприятий, партнёрских рекомендаций или исходящего проспектинга и сохранить как запись лида."
    source_hash: sha256-6454fcf6bc6781ce
  BP-1000.10.20:
    name: "Обогатить данные лида"
    description: "Дополнить лид фирмографическими, технографическими и поведенческими данными из внутренних и сторонних источников для скоринга и маршрутизации."
    source_hash: sha256-a3dd161e93754dbc
  BP-1000.10.30:
    name: "Оценить и квалифицировать лид"
    description: "Применить модель скоринга (соответствие + намерение) для квалификации лида как Marketing-Qualified или Sales-Qualified, либо для дисквалификации и возврата в цикл."
    source_hash: sha256-f43020b741809658
  BP-1000.10.40:
    name: "Направить лид в продажи"
    description: "Назначить квалифицированный лид в соответствующую территорию продаж, роль или партнёру согласно правилам маршрутизации и SLA."
    source_hash: sha256-7d6396d776187ec0
  BP-1000.20:
    name: "Котировка и конфигурация"
    description: "Сконфигурировать решение для клиента, определить цену по утверждённым правилам скидок и выпустить котировку, которую клиент может принять."
    source_hash: sha256-d780b7ea12fbe2c2
  BP-1000.20.10:
    name: "Сконфигурировать решение для клиента"
    description: "Перевести требования клиента в сконфигурированный пакет продуктов или услуг, проверяя совместимость и осуществимость по каталогу предложений."
    source_hash: sha256-20914cf9c10ff37d
  BP-1000.20.20:
    name: "Рассчитать цену котировки"
    description: "Применить прейскурантную цену, контрактные скидки, промоакции, валюту и налоговые правила для получения построчной суммы котировки."
    source_hash: sha256-b510e96248e28f82
  BP-1000.20.30:
    name: "Направить котировку на утверждение"
    description: "Провести котировку через workflow утверждения скидки и маржи при превышении порогов, фиксируя решения утверждающих."
    source_hash: sha256-c4f14a586af0b8e6
  BP-1000.20.40:
    name: "Выпустить котировку клиенту"
    description: "Доставить утверждённую котировку клиенту с условиями, сроком действия и инструкциями по принятию; отслеживать статус котировки до решения."
    source_hash: sha256-423cb58f1e902201
  BP-1000.30:
    name: "Контракт и захват заказа"
    description: "Согласовать и заключить контракт, провести проверку кредита клиента и захватить твёрдый заказ на продажу."
    source_hash: sha256-4fcc590b0de143b0
  BP-1000.30.10:
    name: "Согласовать условия контракта"
    description: "Согласовать коммерческие условия, уровни сервиса, гарантии возмещения и ответственность; редактировать контракт до взаимного принятия."
    source_hash: sha256-0f2c1c373f9fbe2f
  BP-1000.30.20:
    name: "Проверить кредит клиента"
    description: "Провести проверку кредита клиента (внутренняя кредитная история + внешнее бюро, где применимо), установить или подтвердить кредитный лимит и авторизовать заказ в рамках доступного кредита."
    source_hash: sha256-4bda1b0a655e43c1
  BP-1000.30.30:
    name: "Заключить контракт"
    description: "Получить подписи клиента и уполномоченных лиц, сохранить заключённый контракт в репозитории и инициировать downstream-захват заказа."
    source_hash: sha256-b1b33289faef6e20
  BP-1000.30.40:
    name: "Захватить заказ клиента"
    description: "Преобразовать заключённый контракт или принятую котировку в твёрдый заказ на продажу в системе управления заказами; проверить полноту и осуществимость до фиксации."
    source_hash: sha256-8a89509e24124861
  BP-1000.40:
    name: "Обещание срока и аллокация заказа"
    description: "Подтвердить дату поставки, аллоцировать запас или мощности и запланировать заказ для исполнения."
    source_hash: sha256-b00d1e0b79ab3dda
  BP-1000.40.10:
    name: "Подтвердить дату поставки заказа"
    description: "Запустить проверки available-to-promise / capable-to-promise по запасам, поставкам и мощностям для подтверждения даты поставки, на которую клиент может рассчитывать."
    source_hash: sha256-529e86dc01e814a6
  BP-1000.40.20:
    name: "Аллоцировать запас на заказ"
    description: "Зарезервировать конкретный запас (партии, серийные номера, локации) под заказ; разрешить конфликты аллокации при ограниченных поставках."
    source_hash: sha256-7c8ab755d52164f4
  BP-1000.40.30:
    name: "Зарезервировать производственные мощности"
    description: "Для make-to-order или assemble-to-order зарезервировать производственную линию и поставку компонентов, необходимых для соблюдения обещанной даты."
    source_hash: sha256-1312ab0f17c8f21d
  BP-1000.40.40:
    name: "Передать заказ на исполнение"
    description: "Передать аллоцированный и запланированный заказ в производство или склад для исполнения со всеми инструкциями маршрутизации."
    source_hash: sha256-b0e3332507414bf6
  BP-1000.50:
    name: "Производство / Оказание услуги"
    description: "Выполнить производственный наряд-заказ или оказать услугу для исполнения заказа клиента."
    source_hash: sha256-c778d7128a28f457
  BP-1000.50.10:
    name: "Выпустить производственный наряд-заказ"
    description: "Сгенерировать наряд-заказ под зарезервированные мощности, включая BOM, маршрутизацию и контрольные точки качества."
    source_hash: sha256-9c74e1005241f1cc
  BP-1000.50.20:
    name: "Выполнить производство make-to-order"
    description: "Выполнить производственную работу по спецификации на запланированной линии, фиксируя расход труда, оборудования и материалов."
    source_hash: sha256-7784055ee0d59778
  BP-1000.50.30:
    name: "Оказать услугу клиенту"
    description: "Для сервисных заказов выполнить engagement по statement of work, фиксируя время, milestones и поставляемые результаты."
    source_hash: sha256-c821d4e93a7b2fa7
  BP-1000.50.40:
    name: "Подтвердить завершение заказа"
    description: "Закрыть наряд-заказ или сервисный engagement с подтверждением качества; инициировать downstream-выставление счёта и признание выручки."
    source_hash: sha256-898a3aa4a2d5049f
  BP-1000.60:
    name: "Исходящая логистика"
    description: "Скомплектовать, упаковать и отгрузить заказ; управлять исходящей транспортировкой и подтвердить поставку клиенту."
    source_hash: sha256-143fc0bf329859d2
  BP-1000.60.10:
    name: "Скомплектовать, упаковать и отгрузить заказ"
    description: "Скомплектовать аллоцированный запас, упаковать в готовое к отгрузке состояние с документацией и передать перевозчику."
    source_hash: sha256-66dce8504ab268b4
  BP-1000.60.20:
    name: "Управлять исходящей транспортировкой"
    description: "Спланировать фрахт, выбрать перевозчика, сформировать отгрузочные этикетки и таможенную документацию и отправить груз."
    source_hash: sha256-7da56889672fd0b0
  BP-1000.60.30:
    name: "Отслеживать отгрузку до клиента"
    description: "Мониторить статус в пути, управлять исключениями (задержка, повреждение, неверная маршрутизация) и информировать клиента."
    source_hash: sha256-7e612f642846a332
  BP-1000.60.40:
    name: "Подтвердить поставку клиенту"
    description: "Зафиксировать подтверждение доставки, закрыть отгрузку и инициировать downstream-выставление счёта, где биллинг основан на поставке."
    source_hash: sha256-4235ba98e513e646
  BP-1000.70:
    name: "Выставление счетов клиентам"
    description: "Сгенерировать счёт клиенту с налогами и скидками, выпустить его через предпочтительный канал клиента и управлять любыми спорами."
    source_hash: sha256-1a9cbab342c75127
  BP-1000.70.10:
    name: "Сгенерировать счёт клиенту"
    description: "Сформировать счёт из данных заказа, поставки и контракта; проверить полноту и арифметику до выпуска."
    source_hash: sha256-015419e91094b20b
  BP-1000.70.20:
    name: "Применить налоги и скидки"
    description: "Применить юрисдикционные налоги (VAT/GST/sales tax), удержания и контрактные скидки к строкам счёта."
    source_hash: sha256-976c7ebd9885656f
  BP-1000.70.30:
    name: "Выпустить счёт клиенту"
    description: "Доставить счёт через предпочтительный канал клиента (e-invoicing portal, EDI, email, бумага) и сохранить аудиторский след."
    source_hash: sha256-b95e6fb74bd072ce
  BP-1000.70.40:
    name: "Управлять спорами по счетам"
    description: "Принимать, расследовать и разрешать споры клиентов по содержанию счетов; выпускать кредит-ноты или ревизии при обоснованности."
    source_hash: sha256-c585e82bed2bfd3c
  BP-1000.80:
    name: "Инкассация и применение денежных средств"
    description: "Собирать платежи клиентов через цикл напоминаний, применять поступления к счетам и преследовать просроченные балансы."
    source_hash: sha256-8d8f97ede9e3ceda
  BP-1000.80.10:
    name: "Отправить напоминания об оплате"
    description: "Запустить цикл напоминаний — автоматизированные сообщения с заданной периодичностью по мере приближения и наступления срока оплаты счёта."
    source_hash: sha256-a6b6ae3029528d87
  BP-1000.80.20:
    name: "Получить платёж клиента"
    description: "Принять платёж выбранным клиентом инструментом (wire, ACH, карта, чек, e-payment) и сохранить поступление."
    source_hash: sha256-ea2521d19092870f
  BP-1000.80.30:
    name: "Применить платёж к счёту"
    description: "Сопоставить поступление с открытым(и) счётом(ами), распределить по строкам при частичной оплате и закрыть дебиторскую задолженность."
    source_hash: sha256-39354d40e2fdce1d
  BP-1000.80.40:
    name: "Управлять инкассацией клиентов"
    description: "Преследовать просроченные балансы по эскалационной лестнице (коллектор, коллекторское агентство, списание / резерв на безнадёжные долги)."
    source_hash: sha256-278d2b3138044a1c
  BP-1000.90:
    name: "Признание выручки"
    description: "Признавать заработанную выручку по применимому стандарту учёта (IFRS 15 / ASC 606), отсрочивать незаработанную выручку и сверять с субкнигой."
    source_hash: sha256-89c091b122b13417
  BP-1000.90.10:
    name: "Признать заработанную выручку"
    description: "Применить пятишаговую модель IFRS 15 / ASC 606 для признания выручки в соответствующий момент времени или в течение срока контракта."
    source_hash: sha256-6662367ac5e86683
  BP-1000.90.20:
    name: "Отсрочить незаработанную выручку"
    description: "Размещать суммы, выставленные, но ещё не заработанные, на счетах отсроченной выручки, высвобождая по мере исполнения обязательства."
    source_hash: sha256-8d97df9e020fe229
  BP-1000.90.30:
    name: "Сверить выручку с субкнигой"
    description: "Сверить книгу выручки с AR и системами заказов/биллинга; разрешить расхождения до закрытия периода."
    source_hash: sha256-744e9c32a46a15e5
  BP-1000.90.40:
    name: "Отчитываться о результативности выручки"
    description: "Производить отчётность по выручке (признанная, отсроченная, backlog) для менеджмента, закрытия финансов и внешнего раскрытия."
    source_hash: sha256-6aaef44ce04968d1
