kind: business-process
locale: ru
source: BP1-esg-to-disclosure.yaml
entries:
  BP-1130:
    name: "ESG-в-Раскрытие"
    description: "Цикл отчётности по устойчивому развитию от ESG-стратегии и материальности через сбор данных, качество и assurance данных, отчётность и раскрытие, вовлечение стейкхолдеров и цели улучшения. Один BP2 на каждый stage_name VS-200."
  BP-1130.10:
    name: "ESG-стратегия и материальность"
    description: "Установить ESG-амбицию и провести оценку double-materiality для фокуса на том, что важно."
  BP-1130.10.10:
    name: "Установить ESG-амбицию"
    description: "Установить ESG-амбицию и связать с корпоративной стратегией; обязаться по net-zero, социальным и governance целям."
  BP-1130.10.20:
    name: "Провести оценку double-materiality"
    description: "Провести оценку double-materiality для идентификации материальных тем — финансовая материальность и материальность воздействия."
  BP-1130.20:
    name: "Сбор данных"
    description: "Собирать ESG-данные — выбросы, энергия, вода, отходы, социальные, governance — по цепи создания стоимости."
  BP-1130.20.10:
    name: "Собрать экологические данные"
    description: "Собирать данные по выбросам (Scopes 1/2/3), энергии, воде, отходам, биоразнообразию и загрязнению из операций."
  BP-1130.20.20:
    name: "Собрать социальные данные"
    description: "Собирать данные о персонале, охране труда, разнообразии, сообществах и правах человека по материальным темам."
  BP-1130.20.30:
    name: "Собрать governance данные"
    description: "Собирать governance данные — состав совета, этика, антикоррупция, executive remuneration, поведение поставщиков."
  BP-1130.20.40:
    name: "Собрать данные цепи создания стоимости"
    description: "Собирать upstream и downstream данные цепи создания стоимости — выбросы поставщиков, фаза использования продукта, end-of-life."
  BP-1130.30:
    name: "Качество и assurance данных"
    description: "Проводить контроли качества данных и получать внешний assurance по раскрываемым данным."
  BP-1130.30.10:
    name: "Провести контроли качества ESG-данных"
    description: "Проводить контроли полноты, точности, согласованности и прослеживаемости ESG-данных."
  BP-1130.30.20:
    name: "Получить внешний assurance"
    description: "Привлечь провайдера assurance для limited или reasonable assurance по раскрываемым метрикам согласно применимому стандарту."
  BP-1130.40:
    name: "Отчётность и раскрытие"
    description: "Производить ESG-отчёт и регуляторные раскрытия — CSRD/ESRS, SEC climate, GRI, SASB, TCFD, ISSB."
  BP-1130.40.10:
    name: "Построить ESG disclosure pack"
    description: "Построить ESG disclosure pack — нарратив, метрики, сноски, сопоставления со стандартами."
  BP-1130.40.20:
    name: "Подать регуляторные раскрытия"
    description: "Подать обязательные ESG / sustainability раскрытия — CSRD/ESRS, SEC climate, юрисдикционные таксономии."
  BP-1130.40.30:
    name: "Опубликовать добровольные фреймворки"
    description: "Опубликовать добровольные раскрытия — GRI, SASB, TCFD, CDP, ISSB — выровненные с материальными темами."
  BP-1130.50:
    name: "Вовлечение стейкхолдеров"
    description: "Вовлекать стейкхолдеров — инвесторов, регуляторов, клиентов, сотрудников, NGO, сообщества — по ESG."
  BP-1130.50.10:
    name: "Вовлекать инвесторов и аналитиков"
    description: "Вовлекать ESG-ориентированных инвесторов и рейтинговые агентства; отвечать на анкеты и рейтинги."
  BP-1130.50.20:
    name: "Вовлекать сообщества и NGO"
    description: "Вовлекать местные сообщества, NGO и стейкхолдеров гражданского общества по воздействию и remediation."
  BP-1130.60:
    name: "Цели улучшения"
    description: "Устанавливать, отслеживать и корректировать цели улучшения — выбросы, социальные, governance — по горизонту."
  BP-1130.60.10:
    name: "Установить цели улучшения"
    description: "Устанавливать science-based цели и другие ESG-цели улучшения, выровненные с амбицией и материальными темами."
  BP-1130.60.20:
    name: "Отслеживать прогресс по целям"
    description: "Отслеживать прогресс по целям через ESG-цикл; выявлять пробелы и принимать корректирующие действия."
