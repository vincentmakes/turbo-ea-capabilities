kind: business-process
locale: ru
source: BP1-plan-to-inventory.yaml
entries:
  BP-1040:
    name: "План-в-Запас"
    description: "Цикл планирования спроса и поставок, который позиционирует запас в нужном месте, времени и количестве. Шесть BP2 зеркалируют стадии VS-400 от планирования спроса через сверку S&OP, позиционирование запаса, пополнение и непрерывный мониторинг здоровья запаса."
  BP-1040.10:
    name: "Планирование спроса"
    description: "Построить консенсусный прогноз спроса на основе истории, рыночных сигналов, sales pipeline и планов промоакций."
  BP-1040.10.10:
    name: "Построить статистический прогноз"
    description: "Запустить модели статистического прогнозирования на истории спроса на выбранном уровне агрегации; отслеживать ошибку прогноза."
  BP-1040.10.20:
    name: "Учесть входы продаж и маркетинга"
    description: "Наложить сигнал sales-pipeline, календари промоакций и планы запусков продуктов для корректировки статистической базовой линии."
  BP-1040.10.30:
    name: "Сверить прогноз спроса"
    description: "Сверить прогнозы спроса bottom-up и top-down; зафиксировать консенсусный прогноз на горизонт планирования."
  BP-1040.20:
    name: "Планирование поставок"
    description: "Спланировать поставки для покрытия спроса — производство, сорсинг, дистрибуция — в рамках мощностей, lead-time и материальных ограничений."
  BP-1040.20.10:
    name: "Спланировать график производства"
    description: "Построить master production schedule относительно мощностей, материалов и труда; разрешить конфликты ограничений."
  BP-1040.20.20:
    name: "Спланировать поставки материалов"
    description: "Спланировать потребности в материалах (MRP) — сырьё, компоненты, упаковка — относительно графика производства и lead times поставщиков."
  BP-1040.20.30:
    name: "Спланировать поток дистрибуционной сети"
    description: "Спланировать поток запаса по дистрибуционной сети (DRP) — DC-to-DC, DC-to-store, cross-dock — для позиционирования запаса близко к спросу."
  BP-1040.20.40:
    name: "Разрешить ограничения поставок"
    description: "Выявить пробелы поставок относительно спроса; ребалансировать через ускорения, альтернативы, аллокации или demand-shaping в S&OP."
  BP-1040.30:
    name: "Сверка S&OP"
    description: "Провести интегрированный цикл Sales & Operations Planning — pre-S&OP, executive S&OP — для фиксации интегрированного бизнес-плана."
  BP-1040.30.10:
    name: "Провести pre-S&OP ревью"
    description: "Провести кросс-функциональный pre-S&OP для выравнивания взглядов спроса, поставок и финансов; выявить пробелы и рекомендации для executive S&OP."
  BP-1040.30.20:
    name: "Провести executive S&OP"
    description: "Провести executive S&OP для принятия решений по trade-offs (сервис vs стоимость, рост vs маржа, ребалансировка портфеля) и фиксации интегрированного плана."
  BP-1040.30.30:
    name: "Коммуницировать зафиксированный план"
    description: "Каскадировать зафиксированный интегрированный бизнес-план функциям; выровнять downstream-исполнение с планом."
  BP-1040.40:
    name: "Позиционирование запаса"
    description: "Установить целевые показатели запаса и позиционирование — по SKU, локации, каналу — для баланса сервиса и оборотного капитала."
  BP-1040.40.10:
    name: "Установить целевые показатели запаса"
    description: "Установить страховой запас, циклический запас и целевой запас по SKU/локации на основе целей уровня сервиса и вариативности спроса."
  BP-1040.40.20:
    name: "Позиционировать запас в сети"
    description: "Разместить запас по DC, хабам и forward stocking locations для соответствия геометрии сети спроса."
  BP-1040.40.30:
    name: "Управлять миксом и аллокацией запаса"
    description: "Аллоцировать ограниченный запас по клиентам, каналам и вариантам продукта согласно правилам аллокации."
  BP-1040.50:
    name: "Исполнение пополнения"
    description: "Исполнять заказы на пополнение для поддержания запаса на целевых уровнях по сети."
  BP-1040.50.10:
    name: "Сгенерировать заказы на пополнение"
    description: "Сгенерировать заказы на пополнение относительно целевых показателей запаса — заказы на закупку, перемещение или производство."
  BP-1040.50.20:
    name: "Ускорить критические пополнения"
    description: "Ускорить пополнения при риске stock-out или обязательствах перед VIP-клиентами; координировать с поставками и логистикой."
  BP-1040.50.30:
    name: "Подтвердить приёмку пополнения"
    description: "Подтвердить приёмку пополнения в локации назначения и обновить позиции запаса."
  BP-1040.60:
    name: "Мониторинг здоровья запаса"
    description: "Мониторить здоровье запаса — оборачиваемость, старение, slow-and-obsolete — и действовать для поддержания качества, стоимости и оборотного капитала."
  BP-1040.60.10:
    name: "Мониторить KPI запаса"
    description: "Отслеживать оборачиваемость запаса, days-on-hand, старение и события stock-out; выявлять аномалии для действий."
  BP-1040.60.20:
    name: "Управлять медленно движущимся и устаревшим запасом"
    description: "Идентифицировать медленно движущийся и устаревший запас; принять решение об уценке, перемещении, возврате поставщику или списании."
  BP-1040.60.30:
    name: "Проводить циклические подсчёты и аудиты"
    description: "Проводить циклические подсчёты и физические аудиты запаса; сверять подсчёты с системными записями и проводить корректировки."
