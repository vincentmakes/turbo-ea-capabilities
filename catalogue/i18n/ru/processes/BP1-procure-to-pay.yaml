kind: business-process
locale: ru
source: BP1-procure-to-pay.yaml
entries:
  BP-1010:
    name: "Закупка-в-Оплату"
    description: "Сквозной цикл расходов на стороне поставщика от идентификации потребности через сорсинг, выбор поставщика, контракт и заказ на закупку, приёмку товаров или услуг, обработку счёта, оплату, сверку и мониторинг результативности поставщика. Один BP2 на каждый stage_name VS-420."
    source_hash: sha256-441bb8b7fd59b66e
  BP-1010.10:
    name: "Идентификация потребности и заявка"
    description: "Захватить, проверить и утвердить внутренний спрос на товары или услуги и преобразовать его в заявку на закупку."
    source_hash: sha256-bbc0873a1ff7d971
  BP-1010.10.10:
    name: "Идентифицировать потребность в закупке"
    description: "Захватить бизнес-спрос на товар или услугу от запрашивающей функции и подтвердить, что внутренние альтернативы были рассмотрены."
    source_hash: sha256-66e41d54b5c4bea5
  BP-1010.10.20:
    name: "Специфицировать требования"
    description: "Преобразовать потребность в чёткую спецификацию — количество, качество, уровень сервиса и ограничения по поставке — на которую поставщики могут котировать."
    source_hash: sha256-3fd70cb209eafc8f
  BP-1010.10.30:
    name: "Создать заявку на закупку"
    description: "Создать заявку на закупку в системе, присвоить бюджетную кодировку и направить на утверждение."
    source_hash: sha256-b0677f99d098cf47
  BP-1010.10.40:
    name: "Утвердить заявку на закупку"
    description: "Провести заявку через иерархию авторизации расходов; зафиксировать решения утверждающих и отказы с обоснованиями."
    source_hash: sha256-8d4bdb1517b11a19
  BP-1010.20:
    name: "Сорсинг"
    description: "Выбрать стратегию сорсинга, провести сорсинговые мероприятия (RFx), оценить отклики и присудить работу."
    source_hash: sha256-719e2b17612cca8c
  BP-1010.20.10:
    name: "Разработать категорийную стратегию сорсинга"
    description: "Подтвердить категорийную стратегию — make-vs-buy, single vs multi-source, географические ограничения — которая обрамляет данное сорсинговое мероприятие."
    source_hash: sha256-727cd2bf1bfe20b6
  BP-1010.20.20:
    name: "Провести сорсинговое мероприятие"
    description: "Выпустить RFI/RFP/RFQ квалифицированным поставщикам, управлять Q&A и собрать отклики к крайнему сроку."
    source_hash: sha256-e735ccd3c4480991
  BP-1010.20.30:
    name: "Оценить отклики поставщиков"
    description: "Оценить отклики по опубликованным критериям — total cost of ownership, качество, мощности, устойчивость, риск."
    source_hash: sha256-af59b5fc1ba76ba3
  BP-1010.20.40:
    name: "Согласовать присуждение"
    description: "Провести best-and-final раунды переговоров с шорт-листом поставщиков и финализировать решение о присуждении и обоснование."
    source_hash: sha256-b98f7d3de17963a7
  BP-1010.30:
    name: "Выбор и onboarding поставщика"
    description: "Квалифицировать выбранного поставщика, провести проверки рисков и комплаенса и онбордить его в master data поставщиков и операционные системы."
    source_hash: sha256-683a9e61adb86dea
  BP-1010.30.10:
    name: "Провести due diligence поставщика"
    description: "Провести финансовые, регуляторные, санкционные, ESG и кибербезопасностные проверки выбранного поставщика и задокументировать остаточные риски."
    source_hash: sha256-8ef50a47cb84a438
  BP-1010.30.20:
    name: "Квалифицировать поставщика"
    description: "Подтвердить, что поставщик соответствует квалификационным критериям категории — сертификации, страхование, стандарты качества — до продолжения onboarding."
    source_hash: sha256-f3331baf6022fbae
  BP-1010.30.30:
    name: "Настроить master data поставщика"
    description: "Сохранить банковские, налоговые, адресные и контактные данные поставщика в master data с надлежащими проверками data stewardship."
    source_hash: sha256-b7b66f5643b401ce
  BP-1010.30.40:
    name: "Онбордить поставщика в операционные системы"
    description: "Подключить поставщика к P2P, EDI/порталу и любым категорийным системам; провести интеграционные тесты транзакций."
    source_hash: sha256-7fdaa28784925973
  BP-1010.40:
    name: "Контракт и заказ на закупку"
    description: "Заключить контракт с поставщиком и преобразовать утверждённые заявки в заказы на закупку, по которым поставщик может исполнять."
    source_hash: sha256-3113e72df76ed62c
  BP-1010.40.10:
    name: "Согласовать контракт с поставщиком"
    description: "Согласовать коммерческие, юридические и операционные условия — цены, SLA, гарантии возмещения, контроль изменений — и фиксировать редакции до заключения."
    source_hash: sha256-2c9256ddb544c554
  BP-1010.40.20:
    name: "Заключить контракт с поставщиком"
    description: "Получить уполномоченные подписи, сохранить заключённый контракт в репозитории и связать с master data поставщика."
    source_hash: sha256-4b716cff8ccb2b56
  BP-1010.40.30:
    name: "Выпустить заказ на закупку"
    description: "Преобразовать утверждённую заявку (под заключённым контрактом или одноразовый PO) в твёрдый заказ на закупку и передать поставщику."
    source_hash: sha256-6a43283b2a09687a
  BP-1010.40.40:
    name: "Управлять изменениями PO"
    description: "Обрабатывать запрошенные поставщиком или покупателем изменения — количество, дата, цена — через workflow контроля изменений PO."
    source_hash: sha256-a94a0169b6c872df
  BP-1010.50:
    name: "Приёмка товаров/услуг"
    description: "Принять товары или услуги, проверить количество и качество против PO и провести приёмку для downstream-сопоставления счёта."
    source_hash: sha256-aa4194c3a4173341
  BP-1010.50.10:
    name: "Принять товары или услуги"
    description: "Принять физическую поставку товаров на доке или подписать завершение оказанных услуг и зафиксировать подтверждение поставки."
    source_hash: sha256-51f0892b82631e47
  BP-1010.50.20:
    name: "Проверить количество и качество"
    description: "Проверить количество, состояние и соответствие спецификации PO; оформить отчёты о несоответствии при обнаружении нехватки."
    source_hash: sha256-46bf76cbcd12b15b
  BP-1010.50.30:
    name: "Провести приёмку товаров"
    description: "Провести приёмку товаров в ERP, высвобождая запас или признание расходов и обеспечивая three-way matching счетов."
    source_hash: sha256-7935849d37adf90f
  BP-1010.50.40:
    name: "Разрешить исключения по приёмке"
    description: "Управлять нехваткой, повреждением или спорами по завершению услуг с поставщиком; согласовать корректировки до приёма счёта."
    source_hash: sha256-c5539a1a7af33dee
  BP-1010.60:
    name: "Получение и проверка счёта"
    description: "Получить счёт поставщика, провести three-way match против PO и приёмки и разрешить расхождения."
    source_hash: sha256-1ca657d8c9103c84
  BP-1010.60.10:
    name: "Получить счёт поставщика"
    description: "Захватить счёт поставщика через e-invoicing, EDI, портал или бумагу; сохранить с метаданными системы-источника."
    source_hash: sha256-cc3184c35be1df6c
  BP-1010.60.20:
    name: "Сопоставить счёт с PO и приёмкой"
    description: "Запустить three-way match против PO и приёмки товаров; направить исключения в AP для разрешения до авторизации платежа."
    source_hash: sha256-cf6eb77a135e2b0e
  BP-1010.60.30:
    name: "Разрешить расхождения по счёту"
    description: "Расследовать расхождения по цене, количеству или условиям с покупателем и поставщиком; зафиксировать кредит-ноты или корректировки до утверждения."
    source_hash: sha256-e72235e3e615abcb
  BP-1010.60.40:
    name: "Утвердить счёт к оплате"
    description: "Провести сопоставленный счёт через любые требуемые утверждения (порог CFO, подтверждение проекта) и авторизовать его к оплате."
    source_hash: sha256-3e4fc912913e5ef4
  BP-1010.70:
    name: "Исполнение платежа"
    description: "Исполнить платёж поставщику выбранным инструментом и направить поставщику remittance advice."
    source_hash: sha256-4c0510057501fef2
  BP-1010.70.10:
    name: "Запланировать платёжный прогон"
    description: "Сгруппировать утверждённые счета в платёжный прогон по дате, валюте и инструменту; оптимизировать захват скидок и float."
    source_hash: sha256-60937e6890ef6c0d
  BP-1010.70.20:
    name: "Исполнить платёж"
    description: "Произвести выплату через wire, ACH, виртуальную карту, чек или e-payment; сохранить казначейские банковские подтверждения."
    source_hash: sha256-6b277f8f8fa00b9c
  BP-1010.70.30:
    name: "Отправить remittance advice"
    description: "Уведомить поставщика о платеже с построчной информацией о remittance, чтобы он мог применить к своей открытой AR."
    source_hash: sha256-e44fa0c5d23f05e2
  BP-1010.80:
    name: "Сверка"
    description: "Сверить субкнигу AP с general ledger и банком, разрешая расхождения до закрытия периода."
    source_hash: sha256-1f90bbe4d421b275
  BP-1010.80.10:
    name: "Сверить AP с general ledger"
    description: "Прокатить субкнигу AP вперёд и сверить балансы с контрольными счетами GL, расследуя любые расхождения."
    source_hash: sha256-7d8553b73cbbc050
  BP-1010.80.20:
    name: "Сверить платежи с банком"
    description: "Сопоставить платёжные прогоны с банковскими выписками; расследовать необналиченные чеки, возвращённые ACH, FX timing и расхождения банковских комиссий."
    source_hash: sha256-196a279cd9183e28
  BP-1010.80.30:
    name: "Разрешить расхождения сверки"
    description: "Довести расхождения до первопричины — дублирующий платёж, неверная проводка, неприменённый кредит поставщика — и провести корректирующие записи."
    source_hash: sha256-322c16848d9c70f8
  BP-1010.90:
    name: "Мониторинг результативности поставщика"
    description: "Отслеживать результативность поставщика по контрактным SLA и KPI, вести scorecards и управлять корректирующими действиями."
    source_hash: sha256-2ebe5b6f74d11ea4
  BP-1010.90.10:
    name: "Отслеживать KPI поставщика"
    description: "Собирать операционные данные по качеству, своевременности поставки, fill rate и достижению SLA; сохранять для генерации scorecard."
    source_hash: sha256-2940321cf7dfdec7
  BP-1010.90.20:
    name: "Выпустить scorecard поставщика"
    description: "Произвести и направить периодический scorecard поставщику и внутреннему категорийному менеджменту; зафиксировать обратную связь поставщика."
    source_hash: sha256-96a7a88808e2fe7a
  BP-1010.90.30:
    name: "Управлять корректирующими действиями поставщика"
    description: "Открывать, отслеживать и закрывать планы корректирующих действий с недостаточно эффективными поставщиками; эскалировать к контрактным средствам защиты при сохранении нарушений."
    source_hash: sha256-04248767aaf1f096
