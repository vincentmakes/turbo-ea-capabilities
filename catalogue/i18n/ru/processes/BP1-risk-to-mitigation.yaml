kind: business-process
locale: ru
source: BP1-risk-to-mitigation.yaml
entries:
  BP-1110:
    name: "Риск-в-Митигацию"
    description: "Цикл управления корпоративными рисками от формирования risk-appetite через идентификацию рисков, оценку, обработку, мониторинг и отчётность. Один BP2 на каждый stage_name VS-500."
    source_hash: sha256-494ddf222f3c79d7
  BP-1110.10:
    name: "Risk appetite и фреймворк"
    description: "Установить risk appetite и tolerances; определить корпоративный фреймворк управления рисками, таксономию и governance."
    source_hash: sha256-5ed438707cfc47f0
  BP-1110.10.10:
    name: "Установить risk appetite"
    description: "Установить корпоративные заявления risk-appetite и пороги толерантности по категориям рисков; ратифицировать с советом директоров."
    source_hash: sha256-2702c26d79adb56d
  BP-1110.10.20:
    name: "Определить фреймворк рисков"
    description: "Определить ERM фреймворк — таксономия, форумы governance, роли, жизненный цикл — согласно COSO ERM и ISO 31000."
    source_hash: sha256-975111890e3db132
  BP-1110.20:
    name: "Идентификация рисков"
    description: "Идентифицировать корпоративные риски в стратегических, операционных, финансовых, регуляторных и emerging доменах."
    source_hash: sha256-c458af5588d1358c
  BP-1110.20.10:
    name: "Провести risk-воркшопы"
    description: "Провести структурированные воркшопы для выявления рисков по бизнесу с владельцами и SME."
    source_hash: sha256-98c4f264e792dc22
  BP-1110.20.20:
    name: "Сканировать внешние риски"
    description: "Сканировать внешние источники — регуляторные, рыночные, геополитические, экологические — на emerging-сигналы рисков."
    source_hash: sha256-6ed46d7d6b53c706
  BP-1110.20.30:
    name: "Захватить инвентарь рисков"
    description: "Сохранить идентифицированные риски в корпоративном risk register с владельцем, категорией и первичной оценкой."
    source_hash: sha256-982ce6599d21e9f5
  BP-1110.30:
    name: "Оценка рисков"
    description: "Оценить идентифицированные риски на вероятность, воздействие и скорость; рейтинговать inherent и residual риск."
    source_hash: sha256-68ad48200248cad9
  BP-1110.30.10:
    name: "Оценить вероятность и воздействие"
    description: "Оценить вероятность и воздействие каждого риска используя качественные и количественные методы согласно фреймворку."
    source_hash: sha256-d19d95f00f313a43
  BP-1110.30.20:
    name: "Рейтинговать inherent и residual риск"
    description: "Вычислить рейтинг inherent риска и, после учёта существующих контролей, residual рейтинг."
    source_hash: sha256-62d82e648198bd19
  BP-1110.30.30:
    name: "Приоритизировать риски"
    description: "Приоритизировать риски для обработки на основе residual рейтинга, appetite и стратегической релевантности."
    source_hash: sha256-bae4d88342581ab3
  BP-1110.40:
    name: "Обработка и дизайн контролей"
    description: "Принять решение об обработке — принять, избежать, митигировать, передать — и спроектировать или усилить контроли."
    source_hash: sha256-a53b334a45df6a03
  BP-1110.40.10:
    name: "Принять решение об обработке риска"
    description: "Принять решение об обработке по риску — принять, избежать, митигировать, передать (страхование, контрактное, хеджирование)."
    source_hash: sha256-a3831e0126cf6e78
  BP-1110.40.20:
    name: "Спроектировать контроли"
    description: "Спроектировать или усилить контроли — превентивные, детективные, корректирующие — для приведения residual риска в рамки appetite."
    source_hash: sha256-5a8597b33882eb25
  BP-1110.40.30:
    name: "Внедрить план обработки"
    description: "Внедрить план обработки; назначить владельцев, дедлайны и доказательства верификации."
    source_hash: sha256-d1b6ee2996ec0f69
  BP-1110.50:
    name: "Мониторинг"
    description: "Мониторить риски и контроли — отслеживание KRI, тестирование контролей, мониторинг паттернов инцидентов."
    source_hash: sha256-31343c537ab94347
  BP-1110.50.10:
    name: "Отслеживать ключевые индикаторы рисков"
    description: "Отслеживать KRI и emerging-сигналы рисков; запускать пороги и маршруты эскалации."
    source_hash: sha256-6998b92c9e955c6c
  BP-1110.50.20:
    name: "Тестировать контроли"
    description: "Тестировать дизайн и операционную эффективность контролей; рейтинговать исключения; продвигать remediation."
    source_hash: sha256-144bcd0032a31a00
  BP-1110.50.30:
    name: "Мониторить паттерны инцидентов"
    description: "Мониторить паттерны инцидентов, near-miss и loss-event; уточнять представления о рисках и контролях соответственно."
    source_hash: sha256-94b91d87039665ec
  BP-1110.60:
    name: "Отчётность и эскалация"
    description: "Отчитываться о корпоративных рисках исполнительным форумам, совету директоров и регуляторам; эскалировать нарушения."
    source_hash: sha256-440701f79d5734c8
  BP-1110.60.10:
    name: "Произвести отчёт о рисках"
    description: "Произвести периодический корпоративный отчёт о рисках — dashboards, heat-maps, нарративы по топ-рискам."
    source_hash: sha256-a65872e6f0fd82e1
  BP-1110.60.20:
    name: "Брифинговать исполнительный комитет и совет"
    description: "Брифинговать исполнительный risk committee и совет risk committee; зафиксировать решения и направления."
    source_hash: sha256-7339dc20573eddab
  BP-1110.60.30:
    name: "Эскалировать нарушения"
    description: "Эскалировать нарушения appetite и инциденты высокой скорости согласно протоколу; уведомлять регуляторов где требуется."
    source_hash: sha256-afb51b25de2f12a5
