kind: business-process
locale: ru
source: BP1-idea-to-market.yaml
entries:
  BP-1030:
    name: "Идея-в-Рынок"
    description: "Сквозной цикл инноваций продукта/услуги от захвата идеи через концепцию и осуществимость, исследование и прототипирование, отбор портфеля, дизайн и разработку, защиту IP, готовность к запуску, выход на рынок и пост-запусковую результативность. Один BP2 на каждый stage_name VS-290."
    source_hash: sha256-b36539c6a860d958
  BP-1030.10:
    name: "Захват идей"
    description: "Выявлять, захватывать и консолидировать идеи от сотрудников, клиентов, партнёров и рыночных сигналов; направлять на triage."
    source_hash: sha256-a7061e299a1ff468
  BP-1030.10.10:
    name: "Собирать идеи"
    description: "Проводить кампании генерации идей, хакатоны и непрерывные каналы; поощрять подачу по всей организации и экосистеме."
    source_hash: sha256-c583fe2370715b4c
  BP-1030.10.20:
    name: "Захватить и провести triage идей"
    description: "Сохранять входящие идеи, дедуплицировать и проводить triage в очереди ревью с первичной категоризацией."
    source_hash: sha256-c9215649b73f4f3e
  BP-1030.10.30:
    name: "Проверить соответствие идеи"
    description: "Применить первичный фильтр соответствия по стратегии, способностям и рыночному сигналу; отклонить, отложить или продвинуть к оценке осуществимости."
    source_hash: sha256-e141bfd4610a44b2
  BP-1030.20:
    name: "Концепция и осуществимость"
    description: "Преобразовать перспективные идеи в концепции; оценить техническую, рыночную и коммерческую осуществимость; построить кейс для отбора в портфель."
    source_hash: sha256-bad24bcc25be296d
  BP-1030.20.10:
    name: "Разработать концепцию"
    description: "Сформулировать концепцию — проблема, целевой пользователь, предлагаемое решение, гипотеза ценности — на достаточной глубине для оценки."
    source_hash: sha256-7f29485cfc7bb17a
  BP-1030.20.20:
    name: "Оценить техническую осуществимость"
    description: "Проверить, что концепция может быть построена доступной или приобретаемой технологией, материалами и навыками."
    source_hash: sha256-79c0fcd5a32d0a6b
  BP-1030.20.30:
    name: "Оценить коммерческую осуществимость"
    description: "Построить бизнес-кейс — адресуемый рынок, ценообразование, cost-to-serve, ROI — для оценки масштаба возможности."
    source_hash: sha256-91311fcf277dd9f2
  BP-1030.20.40:
    name: "Принять решение о продвижении концепции"
    description: "Принять на гейте концепции решение продвинуть, доработать, отложить или закрыть с чётким обоснованием и условиями."
    source_hash: sha256-138369baf58db536
  BP-1030.30:
    name: "Исследование и прототипирование"
    description: "Проводить исследования, строить прототипы и тестировать с пользователями для де-рискинга концепции до полного дизайна."
    source_hash: sha256-17f18132d611266a
  BP-1030.30.10:
    name: "Провести user research"
    description: "Провести качественные и количественные исследования с целевыми пользователями для валидации problem-solution fit."
    source_hash: sha256-6f99d5b5143f9411
  BP-1030.30.20:
    name: "Построить прототип"
    description: "Построить прототипы низкой или высокой степени достоверности — физические макеты, wireframes, рабочий код — чтобы сделать концепцию осязаемой."
    source_hash: sha256-5739023c197a8fda
  BP-1030.30.30:
    name: "Тестировать прототип с пользователями"
    description: "Провести тесты юзабилити и ценности с целевыми пользователями; зафиксировать находки для информирования итераций или решений о закрытии."
    source_hash: sha256-e0ce8001b6cefc0d
  BP-1030.30.40:
    name: "Итерировать концепцию"
    description: "Применить уроки тестов прототипа к концепции; итерировать пока концепция не будет готова к отбору в портфель или закрытию."
    source_hash: sha256-b97ec6e807254040
  BP-1030.40:
    name: "Отбор в портфель"
    description: "Приоритизировать валидированные концепции в инновационном портфеле; аллоцировать ресурсы, выстроить последовательность и сбалансировать риск."
    source_hash: sha256-05557aba2112750f
  BP-1030.40.10:
    name: "Оценить кандидатов портфеля"
    description: "Оценить валидированные концепции по критериям портфеля — стратегическое соответствие, ценность, риск, соответствие способностям, time to market."
    source_hash: sha256-2122433ebccc8046
  BP-1030.40.20:
    name: "Выстроить последовательность портфеля"
    description: "Выстроить портфель по горизонтам, балансируя сейчас/далее/потом и core/смежные/трансформационные миксы."
    source_hash: sha256-038a49840a38ad82
  BP-1030.40.30:
    name: "Аллоцировать ресурсы"
    description: "Аллоцировать финансирование, таланты и инфраструктуру выбранным концепциям; инициировать формальный kick-off в дизайн и разработку."
    source_hash: sha256-e99973b9328d841f
  BP-1030.50:
    name: "Дизайн и разработка"
    description: "Детальный дизайн, инжиниринг, сборка и интеграция продукта или услуги до готовности к запуску."
    source_hash: sha256-6787748725dca2eb
  BP-1030.50.10:
    name: "Определить детальные требования"
    description: "Перевести валидированную концепцию в детальные функциональные, нефункциональные и acceptance-требования."
    source_hash: sha256-e0f465f9e03256c8
  BP-1030.50.20:
    name: "Разработать дизайн продукта или услуги"
    description: "Произвести детальный дизайн — архитектура, материалы, UX, BOM — который будет построен и валидирован."
    source_hash: sha256-a18aadaba349f517
  BP-1030.50.30:
    name: "Построить и интегрировать"
    description: "Построить продукт или услугу по дизайну; интегрировать компоненты и подсистемы; управлять изменениями и конфигурацией."
    source_hash: sha256-43fb091529479223
  BP-1030.50.40:
    name: "Валидировать и верифицировать"
    description: "Провести design verification и validation против требований; закрыть несоответствия до готовности к запуску."
    source_hash: sha256-0491e890b9359851
  BP-1030.60:
    name: "Защита IP"
    description: "Идентифицировать, защищать и управлять интеллектуальной собственностью, генерируемой через инновационный цикл."
    source_hash: sha256-61ef19429576caef
  BP-1030.60.10:
    name: "Идентифицировать патентоспособную IP"
    description: "Рассматривать инновации на новизну, полезность и неочевидность; идентифицировать кандидатные изобретения для патентования."
    source_hash: sha256-1bda5b069a27694a
  BP-1030.60.20:
    name: "Подавать и продвигать патенты"
    description: "Подавать предварительные и полные патентные заявки; управлять prosecution до выдачи в разных юрисдикциях."
    source_hash: sha256-f6bb1449f35764c6
  BP-1030.60.30:
    name: "Управлять trade secrets и товарными знаками"
    description: "Идентифицировать материалы trade secret и бренд-активы; применить защиту (NDAs, контроль доступа, регистрации)."
    source_hash: sha256-5618df73b3f9460a
  BP-1030.70:
    name: "Готовность к запуску"
    description: "Подготовиться к рыночному запуску — go-to-market, производство, цепь поставок, каналы, поддержка, обучение."
    source_hash: sha256-7421f1a483dcc4f8
  BP-1030.70.10:
    name: "Построить план go-to-market"
    description: "Разработать GTM план — позиционирование, ценообразование, каналы, sales enablement, маркетинговые кампании — на окно запуска."
    source_hash: sha256-6258e6325e861f8d
  BP-1030.70.20:
    name: "Развернуть производство или оказание услуг"
    description: "Развернуть производственные мощности или готовность оказания услуг — оборудование, обучение, поставки, сертификации."
    source_hash: sha256-176d0f039e4a2315
  BP-1030.70.30:
    name: "Обучить продажи и поддержку"
    description: "Обучить команды продаж, партнёров и поддержки новому продукту/услуге до запуска."
    source_hash: sha256-30636bf100386a45
  BP-1030.70.40:
    name: "Пройти ревью готовности к запуску"
    description: "Провести кросс-функциональное ревью готовности к запуску; закрыть пробелы или удержать запуск до готовности."
    source_hash: sha256-5158e4d8c5beec12
  BP-1030.80:
    name: "Выход на рынок"
    description: "Исполнить запуск — выпустить, объявить, продавать и поддерживать новый продукт или услугу на рынке."
    source_hash: sha256-fccc929bbdbc1c0e
  BP-1030.80.10:
    name: "Выпустить на рынок"
    description: "Выпустить релиз по каналам и географиям согласно плану запуска; координировать с PR, партнёрами и поставками."
    source_hash: sha256-595440a14e2c944e
  BP-1030.80.20:
    name: "Исполнить launch-маркетинг"
    description: "Запустить кампании запуска — рекламу, контент, мероприятия, PR, социальные сети — согласно GTM плану."
    source_hash: sha256-7bef6ca901f65664
  BP-1030.80.30:
    name: "Захватить начальные продажи"
    description: "Запустить начальное движение продаж через прямой, партнёрский и цифровой каналы; отслеживать конверсию для валидации launch curve."
    source_hash: sha256-d7010f1d15c04462
  BP-1030.90:
    name: "Пост-запусковая результативность"
    description: "Отслеживать результативность относительно бизнес-кейса, захватывать обратную связь клиентов, продвигать улучшения и принимать решения по жизненному циклу."
    source_hash: sha256-01cca0985f06a990
  BP-1030.90.10:
    name: "Отслеживать KPI запуска"
    description: "Мониторить adoption, выручку, валовую маржу, NPS и другие KPI запуска относительно бизнес-кейса в первые 30/60/90 дней и далее."
    source_hash: sha256-9749cd117ed6d4c6
  BP-1030.90.20:
    name: "Захватить обратную связь клиентов"
    description: "Захватывать структурированную и неструктурированную обратную связь клиентов на рынке; направлять в product backlog и roadmap."
    source_hash: sha256-eb22fe36b8bf4541
  BP-1030.90.30:
    name: "Планировать улучшения жизненного цикла"
    description: "Принимать решения об улучшениях, fast-follow функциях или pivot-движениях на основе пост-запусковых данных; возвращать в Захват идей."
    source_hash: sha256-7dd9d530f1896f55
