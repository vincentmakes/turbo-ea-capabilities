kind: business-process
locale: ru
source: BP1-acquire-to-retire.yaml
entries:
  BP-1090:
    name: "Приобретение-в-Списание"
    description: "Сквозной жизненный цикл физических активов от потребности и обоснования через приобретение, ввод в эксплуатацию, эксплуатацию и обслуживание, риск и надёжность, поддержание информации об активе и вывод из эксплуатации. Один BP2 на каждый stage_name VS-10."
  BP-1090.10:
    name: "Потребность в активе и обоснование"
    description: "Идентифицировать потребности в активах, обосновать капитал и утвердить актив до начала закупки."
  BP-1090.10.10:
    name: "Идентифицировать потребность в активе"
    description: "Захватить бизнес-потребность в новом или замещающем активе; собрать технический и операционный контекст."
  BP-1090.10.20:
    name: "Построить капитальное обоснование"
    description: "Построить бизнес-кейс — total cost of ownership, NPV, чувствительность — и обеспечить капитальное утверждение."
  BP-1090.10.30:
    name: "Утвердить план активов"
    description: "Провести через комитет утверждения капитала; задокументировать условия и связать с портфелем."
  BP-1090.20:
    name: "Приобретение"
    description: "Сорсинг, дизайн или спецификация, закупка и приёмка поставки актива."
  BP-1090.20.10:
    name: "Специфицировать актив"
    description: "Перевести потребность в спецификацию актива — мощность, производительность, комплаенс, требования жизненного цикла."
  BP-1090.20.20:
    name: "Закупить актив"
    description: "Провести сорсинг, выбор поставщика и контрактование; разместить заказ на закупку или строительный контракт."
  BP-1090.20.30:
    name: "Принять поставку актива"
    description: "Принять, проинспектировать и формально принять актив по спецификации."
  BP-1090.30:
    name: "Ввод в эксплуатацию и капитализация"
    description: "Установить, протестировать и ввести актив в эксплуатацию; капитализировать его на балансе."
  BP-1090.30.10:
    name: "Установить и ввести актив в эксплуатацию"
    description: "Установить, запитать и провести тесты ввода в эксплуатацию; передать в операции при успешном завершении."
  BP-1090.30.20:
    name: "Капитализировать актив"
    description: "Капитализировать актив в реестре основных средств с правильным классом, методом амортизации и сроком полезного использования."
  BP-1090.40:
    name: "Эксплуатация и обслуживание"
    description: "Эксплуатировать актив и проводить превентивное, корректирующее и условное обслуживание на протяжении срока полезного использования."
  BP-1090.40.10:
    name: "Эксплуатировать актив"
    description: "Проводить ежедневные операции с активом в рамках проектных параметров; захватывать операционные данные."
  BP-1090.40.20:
    name: "Спланировать и спланировать обслуживание"
    description: "Планировать превентивное, предиктивное и условное обслуживание; планировать относительно операций и доступности ресурсов."
  BP-1090.40.30:
    name: "Выполнить обслуживание"
    description: "Выполнять работы по обслуживанию — превентивное, корректирующее, останов — и подтверждать возврат актива в эксплуатацию."
  BP-1090.50:
    name: "Риск и надёжность"
    description: "Управлять риском asset-integrity, надёжности и операционной безопасности на протяжении эксплуатационного срока."
  BP-1090.50.10:
    name: "Оценить риск активов"
    description: "Проводить оценки критичности и риска — режимы отказа, последствие, вероятность — для управления программами обслуживания и integrity."
  BP-1090.50.20:
    name: "Управлять asset integrity"
    description: "Проводить программы инспекции, тестирования и управления коррозией для поддержания integrity на протяжении жизненного цикла."
  BP-1090.50.30:
    name: "Улучшить надёжность активов"
    description: "Продвигать улучшение надёжности — анализ первопричин хронических отказов, моделирование RAM, рекомендации по design-change."
  BP-1090.60:
    name: "Поддержание информации об активе"
    description: "Поддерживать master data, чертежи, конфигурацию и документы актива на протяжении жизненного цикла."
  BP-1090.60.10:
    name: "Поддерживать master data актива"
    description: "Поддерживать master data актива — класс, локация, parent-child, атрибуты — в реестре активов."
  BP-1090.60.20:
    name: "Поддерживать документы актива"
    description: "Поддерживать чертежи, руководства, P&IDs, сертификаты и as-built документацию; выравнивать с инженерными изменениями."
  BP-1090.70:
    name: "Вывод из эксплуатации и утилизация"
    description: "Спланировать и выполнить end-of-life — вывод из эксплуатации, утилизацию, восстановление и итоговое учётное обращение."
  BP-1090.70.10:
    name: "Спланировать вывод из эксплуатации"
    description: "Спланировать end-of-life — сроки, экологические обязательства, удаление, восстановление, финансовое влияние."
  BP-1090.70.20:
    name: "Выполнить вывод из эксплуатации"
    description: "Вывести из эксплуатации, демонтировать и удалить актив; управлять обращением с опасными материалами и восстановлением площадки."
  BP-1090.70.30:
    name: "Утилизировать или продать актив"
    description: "Утилизировать, переработать или продать актив; зафиксировать остаточную стоимость и chain-of-custody."
