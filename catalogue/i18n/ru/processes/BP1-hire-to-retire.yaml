kind: business-process
locale: ru
source: BP1-hire-to-retire.yaml
entries:
  BP-1020:
    name: "Найм-в-Увольнение"
    description: "Сквозной жизненный цикл сотрудника от планирования персонала через сорсинг, отбор, onboarding, результативность и развитие, администрирование вознаграждения и льгот, опыт сотрудника, внутреннюю мобильность и offboarding. Один BP2 на каждый stage_name VS-280."
  BP-1020.10:
    name: "Планирование персонала"
    description: "Прогнозировать потребности в персонале относительно стратегии и текущего предложения, идентифицировать пробелы в навыках и планировать движения по найму, мобильности и выходам для их закрытия."
  BP-1020.10.10:
    name: "Прогнозировать спрос на персонал"
    description: "Перевести бизнес-план в спрос на численность, навыки и мощности по командам, ролям и горизонту времени."
  BP-1020.10.20:
    name: "Оценить предложение персонала"
    description: "Инвентаризировать текущих сотрудников, контракторов и предстоящие движения; оценить навыки относительно спроса для выявления пробелов и излишков."
  BP-1020.10.30:
    name: "Построить план персонала"
    description: "Разработать интегрированный план — нанять, развить, перераспределить, вывести — для закрытия пробела; последовательно выстроить движения с бюджетом и утверждениями."
  BP-1020.20:
    name: "Сорсинг и привлечение"
    description: "Идентифицировать и привлекать кандидатов через employer branding, сорсинговые каналы и прямой outreach."
  BP-1020.20.10:
    name: "Развить employer brand"
    description: "Спозиционировать ценностное предложение employer-brand и messaging, используемый по всем каналам для привлечения целевых сегментов талантов."
  BP-1020.20.20:
    name: "Сорсить кандидатов"
    description: "Запустить сорсинг через job boards, социальные сети, рекомендации, агентства и прямой outreach; сохранять кандидатов в ATS."
  BP-1020.20.30:
    name: "Управлять talent communities"
    description: "Поддерживать отношения с кандидатами в talent pools и сообществах для evergreen и pipeline-ролей."
  BP-1020.30:
    name: "Отбор и найм"
    description: "Скринить, оценивать, проводить интервью и отбирать кандидатов; проводить pre-employment проверки; делать и принимать оффер."
  BP-1020.30.10:
    name: "Скринить и шорт-листить кандидатов"
    description: "Применить критерии скрининга к входящим заявкам; составить шорт-лист для интервью на основе соответствия и квалификации."
  BP-1020.30.20:
    name: "Провести оценки и интервью"
    description: "Провести структурированные интервью и оценки навыков; консолидировать обратную связь оценивающих в решение о найме."
  BP-1020.30.30:
    name: "Провести pre-employment проверки"
    description: "Провести background, reference и right-to-work проверки согласно юрисдикции и требованиям к рискам роли."
  BP-1020.30.40:
    name: "Сделать и согласовать оффер"
    description: "Составить оффер (вознаграждение, equity, дата старта), согласовать с кандидатом и зафиксировать принятие."
  BP-1020.30.50:
    name: "Нанять сотрудника"
    description: "Заключить трудовой договор, настроить запись сотрудника в HRIS и инициировать downstream-workflows onboarding."
  BP-1020.40:
    name: "Onboarding"
    description: "Ввести нового сотрудника в организацию — приветствие, документы, оборудование, обучение и интеграция."
  BP-1020.40.10:
    name: "Предоставить оборудование и доступ"
    description: "Выдать ноутбук, доступ в здание, учётные записи и любое специфичное для роли оборудование до первого дня."
  BP-1020.40.20:
    name: "Завершить документы onboarding"
    description: "Зафиксировать обязательные документы нового сотрудника — налоговые формы, регистрацию льгот, подтверждения политик — для комплаенса."
  BP-1020.40.30:
    name: "Провести программу onboarding"
    description: "Провести структурированный путь onboarding — ориентация, обучение по роли, чек-ины менеджера — в первые 30/60/90 дней."
  BP-1020.40.40:
    name: "Подтвердить завершение onboarding"
    description: "Проверить, что новый сотрудник завершил все обязательные milestones onboarding и полностью вышел на рабочий темп."
  BP-1020.50:
    name: "Результативность и развитие"
    description: "Ставить цели, давать обратную связь, проводить формальные ревью, выявлять потребности в развитии и обеспечивать обучение и коучинг."
  BP-1020.50.10:
    name: "Поставить цели результативности"
    description: "Каскадировать бизнес-цели в индивидуальные цели в начале цикла; выровнять с приоритетами команды и функции."
  BP-1020.50.20:
    name: "Обеспечить непрерывную обратную связь"
    description: "Проводить регулярные 1:1 и непрерывные разговоры обратной связи между менеджерами и сотрудниками в течение всего цикла."
  BP-1020.50.30:
    name: "Провести ревью результативности"
    description: "Провести формальное ревью цикла — самооценка, ревью менеджера, калибровка — для определения рейтингов и итогов."
  BP-1020.50.40:
    name: "Идентифицировать потребности в развитии"
    description: "Идентифицировать пробелы в способностях относительно текущей и будущей роли; зафиксировать в планах развития, привязанных к обучающим интервенциям."
  BP-1020.50.50:
    name: "Обеспечить обучение и коучинг"
    description: "Проводить программы обучения, on-the-job коучинг, менторинг и развитие на основе assignments; отслеживать завершение и эффект."
  BP-1020.60:
    name: "Администрирование вознаграждения и льгот"
    description: "Администрировать базовую и переменную оплату, equity и льготы на протяжении жизненного цикла; проводить salary review и передачу в payroll."
  BP-1020.60.10:
    name: "Администрировать базовую и переменную оплату"
    description: "Поддерживать pay grades, индивидуальные ставки и планы переменной оплаты; инициировать обновления payroll при повышении, переводе или изменении ставки."
  BP-1020.60.20:
    name: "Провести цикл salary review"
    description: "Провести ежегодный или внеочередной процесс salary review; применить бюджетные guidelines, предложения менеджеров и утверждения."
  BP-1020.60.30:
    name: "Администрировать регистрацию в льготах"
    description: "Провести open и qualifying-event регистрацию в медицинских, пенсионных и других льготах; сверить с feeds carrier."
  BP-1020.60.40:
    name: "Управлять программами equity"
    description: "Предоставлять, vest и реализовывать equity по правилам плана; координировать с финансами, юридическим и equity broker."
  BP-1020.70:
    name: "Опыт сотрудника и вовлечённость"
    description: "Запускать программу вовлечённости, опросы голоса сотрудника, признание, wellbeing и более широкий опыт сотрудника."
  BP-1020.70.10:
    name: "Проводить опросы вовлечённости"
    description: "Проводить периодические и pulse-опросы вовлечённости; анализировать результаты по командам, сегментам и трендам."
  BP-1020.70.20:
    name: "Действовать по обратной связи сотрудников"
    description: "Перевести инсайты опросов в планы действий уровня команды и предприятия; отслеживать выполнение."
  BP-1020.70.30:
    name: "Эксплуатировать программы признания"
    description: "Запустить программы peer-to-peer и менеджерского признания; отслеживать участие и эффект на вовлечённость."
  BP-1020.70.40:
    name: "Поддерживать wellbeing сотрудников"
    description: "Эксплуатировать программы wellbeing — EAP, ментальное здоровье, финансовое благополучие, эргономика — и реагировать на эскалации."
  BP-1020.80:
    name: "Внутренняя мобильность и карьера"
    description: "Эксплуатировать внутренний job marketplace, succession planning и управление карьерными путями."
  BP-1020.80.10:
    name: "Эксплуатировать внутренний job marketplace"
    description: "Публиковать внутренние роли, управлять внутренними заявками и проводить интервью с внутренними кандидатами."
  BP-1020.80.20:
    name: "Провести succession planning"
    description: "Идентифицировать преемников для критических ролей, оценить готовность и построить движения развития для закрытия пробелов."
  BP-1020.80.30:
    name: "Управлять карьерными путями"
    description: "Поддерживать фреймворки карьерных путей, критерии прогрессии ролей и руководство по внутренней мобильности для менеджеров и сотрудников."
  BP-1020.90:
    name: "Offboarding и alumni"
    description: "Управлять увольнениями сотрудников — добровольными, недобровольными, выходом на пенсию — и эксплуатировать программу alumni."
  BP-1020.90.10:
    name: "Обработать увольнение или прекращение"
    description: "Захватить и обработать увольнение — заявление по собственному, увольнение, сокращение, выход на пенсию — через workflow offboarding."
  BP-1020.90.20:
    name: "Провести exit interview"
    description: "Провести exit interview для захвата уроков и обратной связи; интегрировать в инсайты по вовлечённости и удержанию."
  BP-1020.90.30:
    name: "Изъять оборудование и доступ"
    description: "Восстановить ноутбук, badge, учётные записи и любое специфичное для роли оборудование в последний рабочий день."
  BP-1020.90.40:
    name: "Эксплуатировать сеть alumni"
    description: "Поддерживать сеть alumni для повторного найма, рекомендаций и сообщества; проводить периодическую вовлечённость."
