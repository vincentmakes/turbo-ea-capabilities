kind: business-process
locale: ru
source: BP1-discover-to-automate.yaml
entries:
  BP-1160:
    name: "Обнаружение-в-Автоматизацию"
    description: "Цикл process-improvement и автоматизации от обнаружения процесса через измерение, mining, редизайн и автоматизацию. Один BP2 на каждый stage_name VS-150."
  BP-1160.10:
    name: "Обнаружение процесса"
    description: "Обнаружить и задокументировать as-is процесс — акторы, шаги, данные, системы."
  BP-1160.10.10:
    name: "Замапить as-is процесс"
    description: "Замапить as-is процесс через интервью, walk-throughs и наблюдение; сохранить в модели процесса."
  BP-1160.10.20:
    name: "Захватить варианты процесса"
    description: "Захватить варианты — по региону, каналу, типу клиента — для выявления где важна стандартизация."
  BP-1160.20:
    name: "Измерение процесса"
    description: "Измерить результативность процесса — cycle time, стоимость, качество, опыт клиента."
  BP-1160.20.10:
    name: "Определить KPI процесса"
    description: "Определить KPI процесса — эффективность, качество, клиентский результат — и установить базовую линию текущей результативности."
  BP-1160.20.20:
    name: "Установить базовую линию результативности"
    description: "Установить базовую линию текущей результативности через выборку и аналитику; идентифицировать выбросы и паттерны."
  BP-1160.30:
    name: "Process mining"
    description: "Майнить системные event-logs для вывода фактического потока процесса и выявления неэффективностей."
  BP-1160.30.10:
    name: "Извлечь event log"
    description: "Извлечь данные event-log из систем-источников для процесса в scope; очистить и подготовить."
  BP-1160.30.20:
    name: "Запустить анализ process mining"
    description: "Применить инструменты process-mining для вывода фактического потока, conformance, узких мест, циклов rework и вариантов."
  BP-1160.30.30:
    name: "Выявить гипотезы улучшения"
    description: "Перевести находки mining в гипотезы улучшения, приоритизированные по влиянию и осуществимости."
  BP-1160.40:
    name: "Редизайн процесса"
    description: "Редизайнить процесс — устранить, упростить, интегрировать, автоматизировать — для поставки step-change улучшения."
  BP-1160.40.10:
    name: "Спроектировать to-be процесс"
    description: "Спроектировать to-be процесс применяя lean-принципы, выравнивание customer-journey и автоматизацию."
  BP-1160.40.20:
    name: "Валидировать редизайн"
    description: "Валидировать редизайн с операторами, клиентами и риском; уточнить до сборки."
  BP-1160.50:
    name: "Автоматизация процесса"
    description: "Строить, развёртывать и эксплуатировать автоматизацию процессов — RPA, оркестрация, AI assistance — в масштабе."
  BP-1160.50.10:
    name: "Построить автоматизацию"
    description: "Построить автоматизацию — RPA bots, оркестрированные потоки, agentic-AI компоненты — согласно редизайненному процессу."
  BP-1160.50.20:
    name: "Развернуть и эксплуатировать автоматизацию"
    description: "Развернуть автоматизацию в production; эксплуатировать, мониторить и поддерживать через циклы изменений."
  BP-1160.50.30:
    name: "Отслеживать выгоды автоматизации"
    description: "Отслеживать реализованные выгоды автоматизации относительно бизнес-кейса; итерировать и масштабировать."
