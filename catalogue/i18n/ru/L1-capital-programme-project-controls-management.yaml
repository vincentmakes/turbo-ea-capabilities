# Управление капитальной программой и контролем проектов (ru) — translations for L1-capital-programme-project-controls-management.yaml
locale: ru
source: L1-capital-programme-project-controls-management.yaml
entries:
  BC-5020:
    name: Управление капитальной программой и контролем проектов
    description: |
      Управление и контроль со стороны собственника и исполнителя для
      инфраструктурных капитальных программ и проектов, охватывающие
      настройку программы, контроль затрат и графика, освоенный объём,
      управление рисками и изменениями, а также обеспечение.
    in_scope:
      - Настройка программы, управление и управление контрольными точками
      - Оценка, бюджетирование, контроль и прогнозирование затрат
      - Планирование, календарное планирование и анализ критического пути
      - Освоенный объём и интегрированное управление эффективностью
      - Контроль рисков, изменений и резервов программы
      - Обеспечение проектов, шлюзовые обзоры и отчётность
    out_of_scope:
      - Корпоративное управление проектами и изменениями (BC-900/BC-910)
      - Инженерное управление проектами (BC-1110)
      - Оценка инвестиций и решения о финансировании (BC-5000)
      - Строительное производство на площадке и выполнение работ
    source_hash: sha256-9fc1c5b155b0fef9
  BC-5020.10:
    name: Настройка программы и управление
    description: |
      Формирование структуры программы, модели реализации и управления
      для контроля капитальных инвестиций через определённые
      контрольные точки.
    source_hash: sha256-17f84efc3eb0d794
  BC-5020.10.10:
    name: Определение и настройка программы
    description: |
      Определение и настройка объёма, структуры и базового плана
      контроля программы.
    source_hash: sha256-5709e596855b93f2
  BC-5020.10.20:
    name: Выбор модели реализации
    description: |
      Выбор модели реализации и организации, наиболее подходящей для
      программы.
    source_hash: sha256-6c5c2755e98e2bb9
  BC-5020.10.30:
    name: Модель управления и обеспечения
    description: |
      Формирование модели управления и обеспечения, надзирающей за
      программой.
    source_hash: sha256-2e2ef8f4ae1d1118
  BC-5020.10.40:
    name: Управление контрольными точками
    description: |
      Управление контрольными точками, санкционирующими переход к
      следующему этапу и высвобождение финансирования.
    source_hash: sha256-52fec66d0f878198
  BC-5020.20:
    name: Оценка и управление затратами
    description: |
      Оценка, базирование и контроль затрат программы и проектов на
      протяжении жизненного цикла реализации.
    source_hash: sha256-73bf482c93d0c56c
  BC-5020.20.10:
    name: Оценка затрат
    description: |
      Подготовка сметных оценок затрат по классам оценки жизненного
      цикла.
    source_hash: sha256-cbaec6069a62adc0
  BC-5020.20.20:
    name: Управление базовым бюджетом
    description: |
      Формирование и поддержание базового плана затрат, относительно
      которого измеряется эффективность.
    source_hash: sha256-4fda81ff501f7e3b
  BC-5020.20.30:
    name: Контроль и прогнозирование затрат
    description: |
      Контроль и прогнозирование затрат до завершения относительно
      утверждённого базового плана.
    source_hash: sha256-ec8b572235d12ae0
  BC-5020.20.40:
    name: Отчётность по затратам
    description: |
      Отчётность о статусе и прогнозах затрат для заинтересованных
      сторон программы и проектов.
    source_hash: sha256-01ffcdba9aaf9cfb
  BC-5020.30:
    name: Планирование и календарное планирование
    description: |
      Разработка и контроль графиков программы и проектов для
      управления сроками и определённостью реализации.
    source_hash: sha256-515d830ddf6cb14d
  BC-5020.30.10:
    name: Разработка графика
    description: |
      Разработка интегрированных графиков, охватывающих деятельность
      программы и проектов.
    source_hash: sha256-561a38418fafd2fa
  BC-5020.30.20:
    name: Анализ критического пути
    description: |
      Анализ критических путей и резервов времени для защиты ключевых
      вех реализации.
    source_hash: sha256-449d16e9c2c6b8d5
  BC-5020.30.30:
    name: Измерение прогресса
    description: |
      Измерение физического и временного прогресса относительно
      базового графика.
    source_hash: sha256-69936fc34fef28f9
  BC-5020.30.40:
    name: Анализ рисков графика
    description: |
      Вероятностный анализ рисков графика для проверки уверенности в
      реализации.
    source_hash: sha256-b73f92c97503f6f0
  BC-5020.40:
    name: Управление освоенным объёмом и эффективностью
    description: |
      Интегрированное измерение и отчётность об эффективности затрат и
      графика для прогнозирования результатов программы.
    source_hash: sha256-a2fa88c5297a0428
  BC-5020.40.10:
    name: Управление освоенным объёмом
    description: |
      Интеграция объёма, затрат и графика для измерения освоенного
      объёма и эффективности.
    source_hash: sha256-17b5e310aac05165
  BC-5020.40.20:
    name: Метрики эффективности и KPI
    description: |
      Определение и отслеживание метрик эффективности и KPI по
      программе.
    source_hash: sha256-c8bf4927974314c1
  BC-5020.40.30:
    name: Анализ трендов и отклонений
    description: |
      Анализ трендов и отклонений для прогнозирования расхождений с
      планом.
    source_hash: sha256-d771c2dcdf0ee759
  BC-5020.40.40:
    name: Интегрированная отчётность об эффективности
    description: |
      Консолидированная отчётность об интегрированном статусе затрат,
      графика и эффективности.
    source_hash: sha256-da3506016f3debf4
  BC-5020.50:
    name: Контроль рисков и изменений программы
    description: |
      Управление рисками, изменениями, резервами и интерфейсами
      программы для защиты результатов реализации.
    source_hash: sha256-67e0a5c2f1a45be4
  BC-5020.50.10:
    name: Управление рисками программы
    description: |
      Выявление, оценка и обработка рисков по программе.
    source_hash: sha256-bddef78254de846d
  BC-5020.50.20:
    name: Контроль изменений
    description: |
      Контроль изменений объёма и базового плана через дисциплинированный
      процесс управления изменениями.
    source_hash: sha256-ca06ad0506a3518d
  BC-5020.50.30:
    name: Управление резервами
    description: |
      Управление резервами относительно количественно оценённой
      подверженности рискам.
    source_hash: sha256-80ca39be530dbf43
  BC-5020.50.40:
    name: Управление интерфейсами и зависимостями
    description: |
      Управление интерфейсами и зависимостями между проектами и
      заинтересованными сторонами.
    source_hash: sha256-8da79b3ae6b34d77
  BC-5020.60:
    name: Обеспечение проектов и отчётность
    description: |
      Независимое обеспечение, извлечение уроков и отчётность для
      подтверждения здоровья программы и реализации выгод.
    source_hash: sha256-23138fe79d7d152f
  BC-5020.60.10:
    name: Обеспечение проектов и шлюзовые обзоры
    description: |
      Независимое обеспечение и шлюзовые обзоры готовности программы и
      проектов.
    source_hash: sha256-c0ce1fd66611d1a2
  BC-5020.60.20:
    name: Управление извлечёнными уроками
    description: |
      Фиксация и применение извлечённых уроков на протяжении жизненного
      цикла программы.
    source_hash: sha256-46a62e60db648176
  BC-5020.60.30:
    name: Отчётность по программе
    description: |
      Отчётность о статусе программы для советов, спонсоров и надзорных
      органов.
    source_hash: sha256-94b61e3a5c528ce5
  BC-5020.60.40:
    name: Отслеживание реализации выгод
    description: |
      Отслеживание реализации выгод относительно экономического
      обоснования программы.
    source_hash: sha256-de6ea1cd05c875b0
