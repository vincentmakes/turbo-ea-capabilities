# Управление цифровым инжинирингом и информацией об активах (ru) — translations for L1-digital-engineering-asset-information-management.yaml
locale: ru
source: L1-digital-engineering-asset-information-management.yaml
entries:
  BC-5060:
    name: Управление цифровым инжинирингом и информацией об активах
    description: |
      Цифровой инжиниринг и структурированная информация об активах на
      протяжении жизненного цикла построенного актива, охватывающие
      информационное моделирование зданий, общую среду данных, 4D- и
      5D-интеграцию, управление геопространственными и геодезическими
      данными, а также управление цифровыми двойниками и информацией об
      активах. Превращает модели и данные в надёжный информационный актив
      от проектирования через строительство до эксплуатации.
    in_scope:
      - Стратегия BIM, стандарты, координация моделей и обнаружение коллизий
      - Общая среда данных и управление информационными требованиями
      - 4D-очерёдность строительства и 5D-интеграция затрат
      - Управление геопространственными, геодезическими данными и данными реального захвата
      - Разработка цифровых двойников и интеграция операционных данных
      - Структурированная передача информации на протяжении жизненного цикла актива
    out_of_scope:
      - Управление инженерной документацией (BC-1130)
      - Управление жизненным циклом продукта (BC-820)
      - Корпоративное управление информацией и данными (BC-610)
      - Реализация ИТ-платформ и приложений (BC-600)
    source_hash: sha256-252fed20e0f30793
  BC-5060.10:
    name: Управление BIM
    description: |
      Стратегия, стандарты и координация информационного моделирования
      зданий по проектам и дисциплинам.
    source_hash: sha256-1a2264812a0d6bc8
  BC-5060.10.10:
    name: Стратегия и стандарты BIM
    description: |
      Определение стратегии, стандартов и информационных протоколов BIM.
    source_hash: sha256-73e031636aaeaa59
  BC-5060.10.20:
    name: Планирование выполнения BIM
    description: |
      Планирование выполнения BIM, ролей и результатов для проекта.
    source_hash: sha256-0a50d140b7a496d8
  BC-5060.10.30:
    name: Координация авторства моделей
    description: |
      Координация авторства дисциплинарных моделей по согласованным
      стандартам и графикам.
    source_hash: sha256-baf194303af0377d
  BC-5060.10.40:
    name: Федерация моделей и обнаружение коллизий
    description: |
      Федерация дисциплинарных моделей и обнаружение и устранение
      коллизий.
    source_hash: sha256-b51b66978a9238c2
  BC-5060.20:
    name: Общая среда данных
    description: |
      Управление общей информационной средой и требованиями, контролем и
      обменом проектными данными.
    source_hash: sha256-a3cc27bc57806f42
  BC-5060.20.10:
    name: Управление общей средой данных
    description: |
      Функционирование общей среды данных (CDE) как единого источника
      проектной информации.
    source_hash: sha256-3c95e25ee4cfc34e
  BC-5060.20.20:
    name: Управление информационными требованиями
    description: |
      Определение и управление организационными, активными и обменными
      информационными требованиями.
    source_hash: sha256-fcdeb59103ff8d52
  BC-5060.20.30:
    name: Контроль документов и данных
    description: |
      Контроль, версионирование и управление статусом документов и
      данных.
    source_hash: sha256-ef2efaf4a0da9785
  BC-5060.20.40:
    name: Обмен данными и интероперабельность
    description: |
      Обмен информацией между системами с использованием открытых и
      интероперабельных форматов.
    source_hash: sha256-b654e4cc82de1832
  BC-5060.30:
    name: 4D- и 5D-интеграция
    description: |
      Интеграция моделей с программой и затратами для поддержки
      очерёдности строительства и понимания объёмов и затрат.
    source_hash: sha256-9d980cae05a04fd1
  BC-5060.30.10:
    name: 4D-очерёдность строительства
    description: |
      Связывание моделей с программой для визуализации и планирования
      последовательностей строительства.
    source_hash: sha256-63addee14f9bcb82
  BC-5060.30.20:
    name: 5D-интеграция затрат
    description: |
      Интеграция данных модели с затратами для поддержки оценки и
      контроля затрат.
    source_hash: sha256-b6ca1ac8fe141b4e
  BC-5060.30.30:
    name: Модельный подсчёт объёмов
    description: |
      Извлечение объёмов непосредственно из скоординированных моделей.
    source_hash: sha256-e9efdd2baf113590
  BC-5060.30.40:
    name: Координация «проектирование — строительство»
    description: |
      Координация информации модели от проектирования до реализации
      строительства.
    source_hash: sha256-2877ddd9664327b8
  BC-5060.40:
    name: Управление геопространственными и геодезическими данными
    description: |
      Управление геопространственными, геодезическими и грунтовыми
      данными, лежащими в основе проектирования и строительства.
    source_hash: sha256-1d6dfd1ef441a795
  BC-5060.40.10:
    name: Управление геопространственными данными
    description: |
      Управление геопространственными и картографическими данными по
      базе активов.
    source_hash: sha256-52a13b0c5856d07b
  BC-5060.40.20:
    name: Геодезия и разбивочные работы
    description: |
      Предоставление геодезического контроля и разбивки для строительных
      работ.
    source_hash: sha256-7e15516d3308e0ca
  BC-5060.40.30:
    name: Реальный захват и сканирование
    description: |
      Захват фактического состояния через сканирование и техники
      реального захвата.
    source_hash: sha256-ab0519427abb5d1c
  BC-5060.40.40:
    name: Управление геотехническими данными
    description: |
      Управление геотехническими данными и данными инженерно-
      геологических изысканий.
    source_hash: sha256-904c517e21d2d188
  BC-5060.50:
    name: Цифровой двойник и данные об активах
    description: |
      Разработка информационных моделей активов и цифровых двойников,
      питаемых операционными данными для действующего актива.
    source_hash: sha256-f69fe9dec79e3fe7
  BC-5060.50.10:
    name: Управление информационной моделью актива
    description: |
      Управление информационной моделью актива для действующего актива.
    source_hash: sha256-74d47c484cb7e19e
  BC-5060.50.20:
    name: Разработка цифровых двойников
    description: |
      Разработка и поддержание цифровых двойников инфраструктурных
      активов.
    source_hash: sha256-c2b266fa3c506322
  BC-5060.50.30:
    name: Интеграция операционных данных
    description: |
      Интеграция операционных и сенсорных данных в информацию об активах
      и двойники.
    source_hash: sha256-5eef0a6479659d02
  BC-5060.50.40:
    name: Передача информации
    description: |
      Структурированная передача информации об активах от реализации в
      эксплуатацию.
    source_hash: sha256-d849483d22283722
