# Управление инфраструктурными инвестициями и портфелем (ru) — translations for L1-infrastructure-investment-portfolio-management.yaml
locale: ru
source: L1-infrastructure-investment-portfolio-management.yaml
entries:
  BC-5000:
    name: Управление инфраструктурными инвестициями и портфелем
    description: |
      Инвестиционная стратегия, инициирование, оценка и распределение
      капитала по портфелю инфраструктурных активов и капитальных
      проектов. Дисциплина со стороны собственника/инвестора,
      определяющая, какую инфраструктуру финансировать и как, и
      отслеживающая доходность и общественную ценность на уровне
      портфеля на протяжении жизненного цикла актива.
    in_scope:
      - Инвестиционная стратегия и отраслевой фокус в инфраструктуре
      - Инициирование и скрининг воронки сделок и проектов
      - Экономические обоснования, оценка вариантов и анализ затрат и выгод
      - Приоритизация и очерёдность капитальной программы по портфелю
      - Стратегия фондирования и финансирования, включая гранты и проектное финансирование
      - Отслеживание эффективности портфеля, выгод и соотношения цены и качества
    out_of_scope:
      - Корпоративное казначейство и финансирование предприятия (BC-210)
      - Формирование корпоративной стратегии (BC-580)
      - Операционные доходы, тарифы и концессионные поступления (BC-5100)
      - Контроль реализации программ и проектов (BC-5020)
    source_hash: sha256-b4252b476f980d27
  BC-5000.10:
    name: Инфраструктурная инвестиционная стратегия
    description: |
      Определение долгосрочной инфраструктурной инвестиционной стратегии,
      отраслевого фокуса и риск-аппетита, регулирующего размещение
      капитала.
    source_hash: sha256-b5b985dd7c296721
  BC-5000.10.10:
    name: Отраслевая и рыночная стратегия
    description: |
      Выбор инфраструктурных отраслей и рынков для таргетирования на
      основе спроса, политики и конкурентной динамики.
    source_hash: sha256-c1b2cbbfc4e38de3
  BC-5000.10.20:
    name: Определение инвестиционного тезиса
    description: |
      Формулирование инвестиционного тезиса и логики создания ценности
      для каждого целевого инфраструктурного сегмента.
    source_hash: sha256-e1334bc433350328
  BC-5000.10.30:
    name: Модель распределения капитала
    description: |
      Модель и критерии, регулирующие распределение капитала по
      отраслям, географиям и классам активов.
    source_hash: sha256-cad84aaca5304418
  BC-5000.10.40:
    name: Определение риск-аппетита
    description: |
      Определение инвестиционного риск-аппетита и порогов толерантности
      для инфраструктурного портфеля.
    source_hash: sha256-6d7dbd99cbd71731
  BC-5000.20:
    name: Управление воронкой и инициированием
    description: |
      Инициирование, скрининг и отслеживание инфраструктурных
      инвестиционных и проектных возможностей относительно
      инвестиционных критериев.
    source_hash: sha256-827110a27928a2f7
  BC-5000.20.10:
    name: Инициирование возможностей
    description: |
      Поиск инфраструктурных инвестиционных и девелоперских
      возможностей через рынки, государство и проприетарные каналы.
    source_hash: sha256-a8957578819d096c
  BC-5000.20.20:
    name: Скрининг и приоритизация инвестиций
    description: |
      Скрининг и ранняя приоритизация возможностей относительно
      стратегических и финансовых фильтров.
    source_hash: sha256-f5cb6cfc43436d65
  BC-5000.20.30:
    name: Рыночная и отраслевая аналитика
    description: |
      Сбор и анализ рыночной аналитики, данных о спросе и политике для
      информирования инициирования.
    source_hash: sha256-5531bdca50feab4d
  BC-5000.20.40:
    name: Отслеживание воронки
    description: |
      Отслеживание возможностей через контрольные точки от лида до
      инвестиционного решения.
    source_hash: sha256-79c9d81658fc7d6b
  BC-5000.30:
    name: Управление экономическим обоснованием и оценкой
    description: |
      Разработка и оценка экономических обоснований инфраструктурных
      инвестиций, включая оценку вариантов и ценности.
    source_hash: sha256-20683f0ea431d943
  BC-5000.30.10:
    name: Оценка вариантов
    description: |
      Оценка инвестиционных и реализационных вариантов относительно
      стратегических целей и ограничений.
    source_hash: sha256-a64a4eca5ff8f21c
  BC-5000.30.20:
    name: Анализ затрат и выгод
    description: |
      Количественный анализ затрат и выгод и экономическая оценка
      кандидатных инфраструктурных инвестиций.
    source_hash: sha256-143c2a3d862b4bfb
  BC-5000.30.30:
    name: Оценка экономической и социальной ценности
    description: |
      Оценка более широкой экономической, социальной и общественной
      ценности, создаваемой инвестицией.
    source_hash: sha256-654dd9bd08664d88
  BC-5000.30.40:
    name: Контрольные точки инвестиционных решений
    description: |
      Управленческие контрольные точки и одобрения, санкционирующие
      переход к следующему этапу и обязательное финансирование.
    source_hash: sha256-223f919d043e882c
  BC-5000.40:
    name: Приоритизация капитальной программы
    description: |
      Приоритизация, балансирование и очерёдность инвестиций по
      капитальной программе и портфелю активов.
    source_hash: sha256-db8c3971ed69d16a
  BC-5000.40.10:
    name: Приоритизация портфеля
    description: |
      Ранжирование кандидатных инвестиций относительно ценности, риска
      и стратегического вклада.
    source_hash: sha256-f62464687dd0c83c
  BC-5000.40.20:
    name: Нормирование капитала
    description: |
      Распределение ограниченного капитала между конкурирующими
      инвестиционными потребностями.
    source_hash: sha256-055871f851524976
  BC-5000.40.30:
    name: Балансирование портфеля
    description: |
      Балансирование портфеля по риску, отрасли и горизонтам
      жизненного цикла.
    source_hash: sha256-f8d0db5e1911263a
  BC-5000.40.40:
    name: Очерёдность инвестиций
    description: |
      Поэтапность и очерёдность инвестиций для управления
      реализуемостью и профилями финансирования.
    source_hash: sha256-2fd8a87f4ea6530b
  BC-5000.50:
    name: Стратегия фондирования и финансирования
    description: |
      Стратегия привлечения и структурирования фондирования и
      финансирования, необходимого для реализации инфраструктурной
      программы.
    source_hash: sha256-4f4ef0d46d2a8bce
  BC-5000.50.10:
    name: Стратегия источников фондирования
    description: |
      Выбор источников фондирования среди государственных, частных
      механизмов и механизмов оплаты пользователями.
    source_hash: sha256-6cefd5c17a6f81ef
  BC-5000.50.20:
    name: Управление грантами и государственным фондированием
    description: |
      Привлечение и администрирование грантов и государственных
      капитальных взносов.
    source_hash: sha256-21d847924a49d7ed
  BC-5000.50.30:
    name: Структурирование проектного финансирования
    description: |
      Структурирование проектного финансирования, долга и капитала для
      инфраструктурных активов.
    source_hash: sha256-22571d1c74787bc6
  BC-5000.50.40:
    name: Структурирование смешанного финансирования
    description: |
      Структурирование смешанных государственно-частных и льготных
      финансовых пакетов.
    source_hash: sha256-4d510123ac846290
  BC-5000.60:
    name: Управление эффективностью портфеля
    description: |
      Мониторинг и отчётность о доходности, выгодах и ценности,
      создаваемых инфраструктурным инвестиционным портфелем.
    source_hash: sha256-1068ae18740dc7f3
  BC-5000.60.10:
    name: Мониторинг эффективности портфеля
    description: |
      Мониторинг финансовой и операционной эффективности по портфелю.
    source_hash: sha256-63cc0360eb56fe02
  BC-5000.60.20:
    name: Отслеживание выгод
    description: |
      Отслеживание реализованных выгод и результатов относительно
      инвестиционных экономических обоснований.
    source_hash: sha256-c51c803ec6004bde
  BC-5000.60.30:
    name: Оценка соотношения цены и качества
    description: |
      Оценка соотношения цены и качества и ценности за весь срок службы
      по портфелю.
    source_hash: sha256-fdf35aaf5760e753
  BC-5000.60.40:
    name: Отчётность по портфелю
    description: |
      Отчётность об эффективности портфеля для инвесторов, советов
      директоров и общественных заинтересованных сторон.
    source_hash: sha256-35c417c36c5cb686
