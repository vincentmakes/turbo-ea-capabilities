# Управление регуляторным соответствием инфраструктуры (ru) — translations for L1-infrastructure-regulatory-compliance-management.yaml
locale: ru
source: L1-infrastructure-regulatory-compliance-management.yaml
entries:
  BC-5110:
    name: Управление регуляторным соответствием инфраструктуры
    description: |
      Управление экономическим регулированием и регулированием
      безопасности для инфраструктуры, охватывающее отношения с
      регуляторами и подачи по контролю цен, управление лицензиями и
      обязательствами, обоснования безопасности и обеспечение,
      регуляторную отчётность, а также разрешения и статутные
      согласования.
    in_scope:
      - Взаимодействие с регуляторами и подачи по контролю цен
      - Управление операционной лицензией и статутными обязательствами
      - Разработка обоснования безопасности и обеспечение безопасности
      - Регуляторная и статутная отчётность об эффективности
      - Управление операционными, экологическими и статутными разрешениями
      - Поддержка регуляторного аудита и раскрытия информации
    out_of_scope:
      - Межотраслевое управление комплаенсом (BC-130)
      - Управление корпоративными рисками (BC-140)
      - Коммерческое управление концессиями (BC-5100)
      - Корпоративное юридическое и судебное управление
    source_hash: sha256-e5ced761fe1cfddb
  BC-5110.10:
    name: Управление отношениями с регуляторами
    description: |
      Взаимодействие с экономическими регуляторами и управление подачами
      по контролю цен и определениями.
    source_hash: sha256-a3ec1f988596e443
  BC-5110.10.10:
    name: Взаимодействие с регулятором
    description: |
      Постоянное взаимодействие и управление отношениями с
      экономическими и отраслевыми регуляторами.
    source_hash: sha256-8ddf30f80f33e3b6
  BC-5110.10.20:
    name: Контроль цен и определение
    description: |
      Управление регуляторными процессами контроля цен и периодическими
      определениями.
    source_hash: sha256-10c64cc2f525858d
  BC-5110.10.30:
    name: Управление регуляторными подачами
    description: |
      Подготовка и управление формальными подачами регуляторам.
    source_hash: sha256-e91abda642ead550
  BC-5110.10.40:
    name: Мониторинг регуляторных изменений
    description: |
      Мониторинг и интерпретация регуляторных изменений, влияющих на
      бизнес.
    source_hash: sha256-6ed96aab89ba17c0
  BC-5110.20:
    name: Управление лицензиями и обязательствами
    description: |
      Управление операционными лицензиями и статутными обязательствами и
      условиями, привязанными к ним.
    source_hash: sha256-53db5c5621e3241e
  BC-5110.20.10:
    name: Управление операционной лицензией
    description: |
      Управление операционными лицензиями, которыми владеет оператор
      инфраструктуры.
    source_hash: sha256-27f72c7beefa310a
  BC-5110.20.20:
    name: Отслеживание статутных обязательств
    description: |
      Отслеживание статутных обязательств и их выполнения по бизнесу.
    source_hash: sha256-e985300615273294
  BC-5110.20.30:
    name: Соответствие лицензионным условиям
    description: |
      Обеспечение соответствия условиям, привязанным к операционным
      лицензиям.
    source_hash: sha256-c2a1768d4f587d6a
  BC-5110.20.40:
    name: Управление обязанностями и обязательствами
    description: |
      Управление статутными обязанностями и обязательствами, данными
      регуляторам и органам власти.
    source_hash: sha256-30b226bb85a3b49d
  BC-5110.30:
    name: Обоснование безопасности и обеспечение
    description: |
      Разработка обоснований безопасности и обеспечение и сертификация,
      демонстрирующие безопасную эксплуатацию.
    source_hash: sha256-ca9a01993d3552cf
  BC-5110.30.10:
    name: Разработка обоснования безопасности
    description: |
      Разработка и поддержание обоснований безопасности для
      инфраструктурных активов и операций.
    source_hash: sha256-56a8df483c491778
  BC-5110.30.20:
    name: Сертификация и авторизация безопасности
    description: |
      Получение сертификации и авторизации безопасности, необходимых для
      эксплуатации.
    source_hash: sha256-f8e331b336a1d8b8
  BC-5110.30.30:
    name: Регуляторное обеспечение безопасности
    description: |
      Обеспечение регуляторам безопасности того, что обязательства по
      безопасности выполнены.
    source_hash: sha256-a38059a9305a614c
  BC-5110.30.40:
    name: Независимая оценка безопасности
    description: |
      Независимая оценка и валидация обоснований безопасности и
      механизмов.
    source_hash: sha256-26ac0b77b52af056
  BC-5110.40:
    name: Регуляторная отчётность и раскрытие информации
    description: |
      Отчётность об эффективности, финансовой и статутной информации
      регуляторам и заинтересованным сторонам.
    source_hash: sha256-4ff7e1f61053c34c
  BC-5110.40.10:
    name: Регуляторная отчётность об эффективности
    description: |
      Отчётность об операционной и сервисной эффективности регуляторам.
    source_hash: sha256-4e4742a416695a94
  BC-5110.40.20:
    name: Финансовая регуляторная отчётность
    description: |
      Отчётность о регуляторной финансовой и стоимостной информации
      органам власти.
    source_hash: sha256-50ac35dcb15f1d8d
  BC-5110.40.30:
    name: Статутное раскрытие информации
    description: |
      Раскрытие статутной информации, требуемой законом и регулированием.
    source_hash: sha256-507527d8c2e99558
  BC-5110.40.40:
    name: Поддержка регуляторного аудита
    description: |
      Поддержка регуляторных аудитов, обзоров и расследований.
    source_hash: sha256-46d413ec7195f9b7
  BC-5110.50:
    name: Разрешения и статутные согласования
    description: |
      Управление операционными, экологическими и статутными
      разрешениями и согласованиями, необходимыми для эксплуатации.
    source_hash: sha256-5599fbdc2486fce2
  BC-5110.50.10:
    name: Управление операционными разрешениями
    description: |
      Управление операционными разрешениями, необходимыми для
      инфраструктурной деятельности.
    source_hash: sha256-57563b39a7a0fb65
  BC-5110.50.20:
    name: Управление статутными согласованиями
    description: |
      Управление статутными согласованиями и разрешениями от органов
      власти.
    source_hash: sha256-0ca10642a67bebf3
  BC-5110.50.30:
    name: Соответствие экологическим разрешениям
    description: |
      Соблюдение экологических разрешений и их условий.
    source_hash: sha256-813e7a242e3a4b16
  BC-5110.50.40:
    name: Продление и изменение разрешений
    description: |
      Продление и изменение разрешений и согласований по мере изменения
      операций.
    source_hash: sha256-07c3c25fd50f1ebe
