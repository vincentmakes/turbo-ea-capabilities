# Управление строительством и полевой реализацией (ru) — translations for L1-construction-field-delivery-management.yaml
locale: ru
source: L1-construction-field-delivery-management.yaml
entries:
  BC-5040:
    name: Управление строительством и полевой реализацией
    description: |
      Выполнение инфраструктурных работ на площадке, охватывающее
      обустройство и мобилизацию площадки, управление рабочими фронтами
      и производством, временные работы, машины и оборудование, площадные
      материалы и логистику, а также качество строительства. Дисциплина
      полевой реализации, превращающая проект и программу в возведённые
      работы безопасно, продуктивно и в соответствии со спецификацией.
    in_scope:
      - Обустройство и мобилизация площадки и предоставление временных объектов
      - Координация рабочих фронтов, очерёдность производства и отслеживание прогресса
      - Временные работы, включая леса, опалубку и крепление выемок
      - Управление машинами, оборудованием и грузоподъёмными операциями
      - Заказ, складирование, логистика площадных материалов и управление отходами
      - Контроль качества строительства, инспекция и управление несоответствиями
    out_of_scope:
      - Управление инженерным строительством (BC-1150)
      - Пусконаладка и передача (BC-1160)
      - Проектирование (BC-1120)
      - Эксплуатация и обслуживание постоянных активов (BC-5090)
    source_hash: sha256-f60dee7ffc45dc55
  BC-5040.10:
    name: Обустройство и мобилизация площадки
    description: |
      Настройка и мобилизация строительной площадки, включая городки,
      временные объекты и подключение коммунальных сетей и служб.
    source_hash: sha256-9285db5eebfe952b
  BC-5040.10.10:
    name: Настройка площадки и обустройство городка
    description: |
      Обустройство строительных городков, офисов и бытовых зон,
      готовых к строительным операциям.
    source_hash: sha256-335d23dfe82de860
  BC-5040.10.20:
    name: Планирование мобилизации
    description: |
      Планирование мобилизации ресурсов, рабочей силы и оборудования на
      строительную площадку.
    source_hash: sha256-60581384b46a2489
  BC-5040.10.30:
    name: Предоставление временных объектов
    description: |
      Предоставление временного жилья, бытовых и площадных объектов для
      строительной рабочей силы.
    source_hash: sha256-bdc570f26453b4f2
  BC-5040.10.40:
    name: Подключение коммунальных сетей и служб
    description: |
      Подключение временного электро-, водоснабжения и связи,
      необходимых для операций на площадке.
    source_hash: sha256-fa9d21c7a31f421d
  BC-5040.20:
    name: Управление рабочими фронтами и производством
    description: |
      Планирование, координация и отслеживание строительного
      производства на активных рабочих фронтах для поддержания прогресса
      и производительности.
    source_hash: sha256-da95d0c17d542f0f
  BC-5040.20.10:
    name: Планирование и очерёдность производства
    description: |
      Планирование с коротким интервалом и очерёдность строительного
      производства по рабочим фронтам.
    source_hash: sha256-6ca57b510f83bd37
  BC-5040.20.20:
    name: Координация рабочих фронтов
    description: |
      Координация специальностей, ресурсов и доступа по одновременным
      рабочим фронтам.
    source_hash: sha256-ef99fde0316a0954
  BC-5040.20.30:
    name: Ежедневные операции на площадке
    description: |
      Повседневное руководство и контроль строительных операций на
      площадке.
    source_hash: sha256-58aaf7e20cd2397b
  BC-5040.20.40:
    name: Отслеживание прогресса и производительности
    description: |
      Измерение строительного прогресса и производительности труда
      относительно программы.
    source_hash: sha256-4cfcef94c2878c4d
  BC-5040.30:
    name: Управление временными работами
    description: |
      Управление временными работами и системами доступа, обеспечивающими
      безопасное возведение постоянных работ.
    source_hash: sha256-cd9a0aeb12bc89c8
  BC-5040.30.10:
    name: Координация проектирования временных работ
    description: |
      Координация и контроль проектирования временных работ и режима их
      проверки.
    source_hash: sha256-07057d176e2f55e3
  BC-5040.30.20:
    name: Управление лесами и доступом
    description: |
      Предоставление и контроль лесов и безопасного доступа для
      строительной деятельности.
    source_hash: sha256-a8709804ef7874ba
  BC-5040.30.30:
    name: Управление опалубкой и поддерживающими конструкциями
    description: |
      Управление системами опалубки и поддерживающих конструкций,
      несущих бетонные и несущие работы.
    source_hash: sha256-8d4e49f3e73f3bfe
  BC-5040.30.40:
    name: Управление выемками и креплением
    description: |
      Управление выемками и временным укреплением грунта для сохранения
      устойчивости и безопасности работ.
    source_hash: sha256-e9633d74a71f99ca
  BC-5040.40:
    name: Управление машинами и оборудованием
    description: |
      Предоставление, развёртывание и поддержание строительных машин и
      оборудования, включая грузоподъёмные операции.
    source_hash: sha256-b9444e8ef65b4670
  BC-5040.40.10:
    name: Управление парком машин
    description: |
      Управление парком строительных машин по проектам и рабочим
      фронтам.
    source_hash: sha256-20a6c52330ee2c49
  BC-5040.40.20:
    name: Аренда и использование оборудования
    description: |
      Поиск, аренда и отслеживание использования строительного
      оборудования.
    source_hash: sha256-9f5eebbf705c8257
  BC-5040.40.30:
    name: Управление грузоподъёмными операциями
    description: |
      Планирование и контроль грузоподъёмных операций и использования
      кранов на площадке.
    source_hash: sha256-ee1aa7bedc9fc4a1
  BC-5040.40.40:
    name: Инспекция и обслуживание машин
    description: |
      Инспекция и обслуживание машин и оборудования для поддержания
      доступности и безопасности.
    source_hash: sha256-2a091f67f3a9138f
  BC-5040.50:
    name: Площадные материалы и логистика
    description: |
      Поставка, хранение и перемещение строительных материалов на
      площадке, включая логистику и отходы.
    source_hash: sha256-b6986a7c3867f0b8
  BC-5040.50.10:
    name: Заказ и поставка материалов
    description: |
      Заказ и поставка строительных материалов для выполнения программы
      работ.
    source_hash: sha256-869e753658759c30
  BC-5040.50.20:
    name: Управление складированием и хранением
    description: |
      Управление зонами складирования и хранением материалов и
      компонентов на площадке.
    source_hash: sha256-83efb39bc1be74d7
  BC-5040.50.30:
    name: Логистика площадки и управление движением
    description: |
      Управление логистикой площадки, поставками и движением транспорта.
    source_hash: sha256-e2831a838b0316f3
  BC-5040.50.40:
    name: Управление строительными отходами
    description: |
      Сортировка, обращение и удаление строительных отходов и излишков
      материалов.
    source_hash: sha256-76a72cd81d95d613
  BC-5040.60:
    name: Управление качеством строительства
    description: |
      Обеспечение и контроль качества строительства для реализации
      работ, соответствующих спецификации.
    source_hash: sha256-65f01840c29dd072
  BC-5040.60.10:
    name: Планирование инспекций и испытаний
    description: |
      Планирование инспекций и испытаний и их контрольных и
      свидетельских точек.
    source_hash: sha256-006327a666a14d37
  BC-5040.60.20:
    name: Контроль и обеспечение качества
    description: |
      Выполнение проверок контроля качества и обеспечения по строительной
      деятельности.
    source_hash: sha256-325581465aeccc65
  BC-5040.60.30:
    name: Управление несоответствиями
    description: |
      Выявление, урегулирование и закрытие строительных несоответствий.
    source_hash: sha256-716e63f20d5a2f4a
  BC-5040.60.40:
    name: Устранение замечаний и поддержка передачи
    description: |
      Устранение замечаний, закрытие дефектов и поддержка передачи
      завершённых работ.
    source_hash: sha256-c6fb7d5061da1fe6
