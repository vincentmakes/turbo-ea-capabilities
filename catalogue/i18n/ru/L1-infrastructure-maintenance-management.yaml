# Управление обслуживанием инфраструктуры (ru) — translations for L1-infrastructure-maintenance-management.yaml
locale: ru
source: L1-infrastructure-maintenance-management.yaml
entries:
  BC-5090:
    name: Управление обслуживанием инфраструктуры
    description: |
      Выполнение инспекции и обслуживания действующих инфраструктурных
      активов, охватывающее планирование и календарное планирование
      обслуживания, инспекцию и обследование, выполнение планового
      обслуживания, реактивное и аварийное обслуживание, а также
      эффективность и записи об обслуживании.
    in_scope:
      - Планирование работ по обслуживанию, календарное планирование и распределение ресурсов
      - Инспекция, обследование и выявление дефектов на активах
      - Выполнение планового профилактического и обновляющего обслуживания
      - Реактивный и аварийный ремонт и реагирование на неисправности
      - Записи, задолженность и управление эффективностью обслуживания
      - Улучшение надёжности на основе понимания обслуживания
    out_of_scope:
      - Межотраслевое обслуживание оборудования (BC-1030)
      - Стратегия управления активами (BC-5070)
      - Операции сети (BC-5080)
      - Стратегия обновлений и обслуживания за весь срок службы (BC-5070.40)
    source_hash: sha256-16e287e0a6c64f65
  BC-5090.10:
    name: Планирование и календарное планирование обслуживания
    description: |
      Планирование и календарное планирование работ по обслуживанию и
      ресурсов и доступа, необходимых для их выполнения.
    source_hash: sha256-6a3eb19fe0db371f
  BC-5090.10.10:
    name: Планирование работ по обслуживанию
    description: |
      Планирование объёма, методов и требований работ по обслуживанию
      перед выполнением.
    source_hash: sha256-3349241f78e25c26
  BC-5090.10.20:
    name: Календарное планирование обслуживания
    description: |
      Календарное планирование деятельности по обслуживанию для
      балансирования нагрузки, доступа и воздействия на обслуживание.
    source_hash: sha256-0b7ab11495443950
  BC-5090.10.30:
    name: Распределение ресурсов и бригад
    description: |
      Распределение бригад, навыков и ресурсов на плановые работы по
      обслуживанию.
    source_hash: sha256-e4ba046dbc77eb0a
  BC-5090.10.40:
    name: Планирование окон и допусков
    description: |
      Планирование окон и допусков к работам, обеспечивающих безопасный
      доступ для обслуживания.
    source_hash: sha256-bcd1694386b2e5fd
  BC-5090.20:
    name: Инспекция и обследование
    description: |
      Инспекция и обследование активов для выявления дефектов и
      подтверждения пригодности к обслуживанию.
    source_hash: sha256-1186d613fd065c57
  BC-5090.20.10:
    name: Плановая инспекция
    description: |
      Плановая инспекция активов для обнаружения возникающих дефектов и
      деградации.
    source_hash: sha256-fd47a7ac1aee58a5
  BC-5090.20.20:
    name: Детальное обследование
    description: |
      Детальное обследование активов для оценки состояния там, где
      требуется более пристальная инспекция.
    source_hash: sha256-c78848b64794adad
  BC-5090.20.30:
    name: Выявление и градация дефектов
    description: |
      Выявление и градация дефектов для приоритизации ремонтных
      действий.
    source_hash: sha256-85281da9fca2213a
  BC-5090.20.40:
    name: Структурная инспекция и инспекция безопасности
    description: |
      Структурная инспекция и инспекция безопасности активов для
      подтверждения целостности и безопасного использования.
    source_hash: sha256-af1c8418f2e03953
  BC-5090.30:
    name: Выполнение планового обслуживания
    description: |
      Выполнение планового профилактического и обновляющего обслуживания
      для поддержания состояния и эффективности активов.
    source_hash: sha256-d0a53686779cf2ba
  BC-5090.30.10:
    name: Выполнение профилактического обслуживания
    description: |
      Выполнение профилактического обслуживания для сохранения активов в
      пригодном к эксплуатации состоянии.
    source_hash: sha256-103353b24e101b23
  BC-5090.30.20:
    name: Выполнение плановых обновлений
    description: |
      Выполнение плановых обновлений, восстанавливающих или заменяющих
      компоненты активов.
    source_hash: sha256-29579b3e2769d2be
  BC-5090.30.30:
    name: Выполнение работ по обслуживанию
    description: |
      Выполнение работ по обслуживанию на площадке по плану, объёму и
      стандарту.
    source_hash: sha256-3ca5ecc94c9983bf
  BC-5090.30.40:
    name: Обеспечение качества обслуживания
    description: |
      Обеспечение того, что работы по обслуживанию соответствуют
      требуемым стандартам качества и безопасности.
    source_hash: sha256-3cd6593a8ddac244
  BC-5090.40:
    name: Реактивное и аварийное обслуживание
    description: |
      Реагирование на неисправности, дефекты и аварии, требующие
      незапланированного вмешательства по обслуживанию.
    source_hash: sha256-52593d3ed6d420fe
  BC-5090.40.10:
    name: Реагирование на неисправности и дефекты
    description: |
      Реагирование на заявленные неисправности и дефекты для защиты
      обслуживания и безопасности.
    source_hash: sha256-4e64aaa0a9b9ca63
  BC-5090.40.20:
    name: Аварийный ремонт
    description: |
      Выполнение аварийного ремонта для восстановления активов после
      отказа или повреждения.
    source_hash: sha256-4a094ddcefb8095c
  BC-5090.40.30:
    name: Управление реактивными работами
    description: |
      Управление реактивными работами по обслуживанию от уведомления до
      завершения.
    source_hash: sha256-e30865fd9c368823
  BC-5090.40.40:
    name: Управление временным ремонтом
    description: |
      Управление временным ремонтом, поддерживающим обслуживание до
      постоянного устранения.
    source_hash: sha256-c8ff8367a52a27e3
  BC-5090.50:
    name: Эффективность и записи об обслуживании
    description: |
      Управление записями, задолженностью и эффективностью обслуживания
      для повышения надёжности.
    source_hash: sha256-185627c67674b9c1
  BC-5090.50.10:
    name: Управление записями об обслуживании
    description: |
      Управление записями об обслуживании, документирующими выполненные
      работы и историю актива.
    source_hash: sha256-9b9ac70c40a55939
  BC-5090.50.20:
    name: Управление задолженностью по обслуживанию
    description: |
      Управление задолженностью по обслуживанию для контроля риска и
      приоритизации работ.
    source_hash: sha256-371afc593fcd989e
  BC-5090.50.30:
    name: Анализ эффективности обслуживания
    description: |
      Анализ эффективности обслуживания относительно показателей затрат,
      времени и качества.
    source_hash: sha256-3a0f3af4181d9f84
  BC-5090.50.40:
    name: Улучшение надёжности
    description: |
      Повышение надёжности активов на основе данных об обслуживании и
      отказах.
    source_hash: sha256-4714639f367edd97
metadata:
