# Управление устойчивостью и безопасностью инфраструктуры (ru) — translations for L1-infrastructure-resilience-security-management.yaml
locale: ru
source: L1-infrastructure-resilience-security-management.yaml
entries:
  BC-5120:
    name: Управление устойчивостью и безопасностью инфраструктуры
    description: |
      Защита и устойчивость критической инфраструктуры в области
      физической безопасности, кибер-физической безопасности и
      безопасности операционных технологий, устойчивости и
      непрерывности, управления чрезвычайными ситуациями и кризисами, а
      также климатической и экологической устойчивости.
    in_scope:
      - Физическая безопасность, контроль доступа и видеонаблюдение
      - Кибер-физическая безопасность и безопасность операционных технологий
      - Операционная устойчивость и непрерывность бизнеса
      - Готовность к чрезвычайным ситуациям и управление кризисами
      - Адаптация к климату и устойчивость к экстремальной погоде
      - Защита критических систем и активов
    out_of_scope:
      - Управление корпоративными рисками (BC-140)
      - Управление непрерывностью бизнеса (BC-160)
      - Управление кибербезопасностью (BC-620)
      - Охрана труда, безопасность и окружающая среда (BC-5050)
    source_hash: sha256-bcfbe910a7b9a461
  BC-5120.10:
    name: Управление физической безопасностью
    description: |
      Защита инфраструктурных площадок и активов через контроль доступа,
      видеонаблюдение и охранный персонал.
    source_hash: sha256-ab6fd81d819c7d19
  BC-5120.10.10:
    name: Управление доступом и вторжениями
    description: |
      Управление правами доступа и обнаружение несанкционированного
      вторжения на инфраструктурных площадках.
    source_hash: sha256-bf54fd2f6191d076
  BC-5120.10.20:
    name: Периметр и контроль доступа
    description: |
      Контроль периметров площадок и физических точек доступа к
      критическим активам.
    source_hash: sha256-aaeb117e531a75c4
  BC-5120.10.30:
    name: Охранное видеонаблюдение
    description: |
      Видеонаблюдение и мониторинг инфраструктурных площадок на предмет
      угроз безопасности.
    source_hash: sha256-c8a6e9e5d44e94ed
  BC-5120.10.40:
    name: Управление охранным персоналом
    description: |
      Управление охранным персоналом и услугами охраны по площадкам.
    source_hash: sha256-92a7a9683019e254
  BC-5120.20:
    name: Кибер-физическая безопасность
    description: |
      Защита операционных технологий и систем управления, обеспечивающих
      работу критической инфраструктуры, от кибер-физических угроз.
    source_hash: sha256-76663dc59f61c43e
  BC-5120.20.10:
    name: Безопасность OT и систем управления
    description: |
      Безопасность операционных технологий (OT) и промышленных систем
      управления, лежащих в основе инфраструктуры.
    source_hash: sha256-bab81199c8b2066f
  BC-5120.20.20:
    name: Защита критических систем
    description: |
      Защита критических систем и активов, необходимых для работы
      инфраструктуры.
    source_hash: sha256-8782fc5bee69d8ed
  BC-5120.20.30:
    name: Управление кибер-физическими угрозами
    description: |
      Управление угрозами, охватывающими киберпространственный и
      физический домены инфраструктуры.
    source_hash: sha256-45b5d8d04bf46916
  BC-5120.20.40:
    name: Мониторинг безопасности и реагирование
    description: |
      Мониторинг событий безопасности и реагирование на инциденты,
      затрагивающие системы управления.
    source_hash: sha256-2c7999abe3b319bf
  BC-5120.30:
    name: Управление устойчивостью и непрерывностью
    description: |
      Планирование и тестирование, поддерживающие работу критических
      инфраструктурных услуг в условиях нарушений.
    source_hash: sha256-50c82bf8d9652c50
  BC-5120.30.10:
    name: Планирование операционной устойчивости
    description: |
      Планирование операционной устойчивости критических
      инфраструктурных услуг.
    source_hash: sha256-87d444d87065fb57
  BC-5120.30.20:
    name: Управление непрерывностью бизнеса
    description: |
      Управление непрерывностью бизнеса для инфраструктурных операций во
      время нарушений.
    source_hash: sha256-e9e5fdd1c4f37b7d
  BC-5120.30.30:
    name: Проектирование резервирования и переключения
    description: |
      Проектирование резервирования и переключения для поддержания
      обслуживания при отказе активов.
    source_hash: sha256-de3a61dc3d3e824a
  BC-5120.30.40:
    name: Тестирование и учения по устойчивости
    description: |
      Тестирование и отработка механизмов устойчивости и непрерывности.
    source_hash: sha256-ccbec6e3ab225a02
  BC-5120.40:
    name: Управление чрезвычайными ситуациями и кризисами
    description: |
      Подготовка к чрезвычайным ситуациям и кризисам, затрагивающим
      инфраструктуру и её пользователей, и реагирование на них.
    source_hash: sha256-c9a84def75d1bc66
  BC-5120.40.10:
    name: Готовность к чрезвычайным ситуациям
    description: |
      Планирование готовности к чрезвычайным ситуациям, затрагивающим
      инфраструктурные активы и услуги.
    source_hash: sha256-2c08b126adcf3a8b
  BC-5120.40.20:
    name: Управление кризисами
    description: |
      Управление кризисами, угрожающими инфраструктурным операциям и
      заинтересованным сторонам.
    source_hash: sha256-dda20de9498639d8
  BC-5120.40.30:
    name: Координация реагирования на чрезвычайные ситуации
    description: |
      Координация реагирования на чрезвычайные ситуации между командами
      и внешними реагирующими сторонами.
    source_hash: sha256-23673881e80ccf22
  BC-5120.40.40:
    name: Планирование восстановления
    description: |
      Планирование восстановления услуг после разрушительных событий.
    source_hash: sha256-e8210e4f65f83176
  BC-5120.50:
    name: Климатическая и экологическая устойчивость
    description: |
      Адаптация и защита инфраструктуры от изменения климата и
      экологических опасностей.
    source_hash: sha256-5c8519c07ef26be6
  BC-5120.50.10:
    name: Управление адаптацией к климату
    description: |
      Управление адаптацией к климату для долгоживущих инфраструктурных
      активов.
    source_hash: sha256-7eded7738db31aa4
  BC-5120.50.20:
    name: Устойчивость к экстремальной погоде
    description: |
      Устойчивость инфраструктуры к экстремальным погодным событиям и их
      воздействиям.
    source_hash: sha256-d38d9fa5f0f02308
  BC-5120.50.30:
    name: Защита от наводнений и опасностей
    description: |
      Защита инфраструктуры от наводнений и природных опасностей.
    source_hash: sha256-e133de2790603d36
  BC-5120.50.40:
    name: Управление экологическими опасностями
    description: |
      Управление экологическими опасностями, затрагивающими
      инфраструктуру и её окружение.
    source_hash: sha256-f9a3bb27d308ea50
metadata:
