# Управление инфраструктурными активами (ru) — translations for L1-infrastructure-asset-management.yaml
locale: ru
source: L1-infrastructure-asset-management.yaml
entries:
  BC-5070:
    name: Управление инфраструктурными активами
    description: |
      Управление инфраструктурными активами на протяжении всего срока
      службы по ISO 55000, охватывающее стратегию и планирование
      управления активами, реестр активов и информационную базу, оценку
      состояния и эффективности, стратегию обслуживания и обновлений,
      риск и критичность активов, а также жизненный цикл и утилизацию.
    in_scope:
      - Стратегия, политика и планирование управления активами в увязке с корпоративными целями
      - Реестр активов, иерархия и управление качеством информации
      - Оценка состояния, эффективности и остаточного срока службы активов
      - Стратегия обслуживания и обновлений и моделирование затрат за весь срок службы
      - Риск, критичность активов и приоритизация вмешательств
      - Оптимизация ценности жизненного цикла, вывод из эксплуатации и утилизация
    out_of_scope:
      - Межотраслевое управление физическими активами (BC-1040)
      - Обслуживание оборудования (BC-1030)
      - Выполнение обслуживания (BC-5090)
      - Оперативное управление сетью и её контроль (BC-5080)
    source_hash: sha256-ff71cdfe8c3f3de2
  BC-5070.10:
    name: Стратегия и планирование управления активами
    description: |
      Определение стратегии, целей и планов управления активами,
      согласующих решения по активам с целями организации.
    source_hash: sha256-cb48a4e3ad61ef68
  BC-5070.10.10:
    name: Политика управления активами и SAMP
    description: |
      Формирование политики управления активами и стратегического плана
      управления активами (SAMP), задающих направление для базы активов.
    source_hash: sha256-4efc0bc3b4065e29
  BC-5070.10.20:
    name: Цели управления активами
    description: |
      Определение измеримых целей управления активами, выведенных из
      целей организации и ожиданий заинтересованных сторон.
    source_hash: sha256-d047fa7f6fb972a5
  BC-5070.10.30:
    name: Согласование прямой видимости
    description: |
      Согласование решений и деятельности по активам со стратегией через
      чёткую прямую видимость от целей до реализации.
    source_hash: sha256-6cfd9b4f6132b0eb
  BC-5070.10.40:
    name: Планирование управления активами
    description: |
      Разработка планов управления активами, переводящих стратегию в
      конкретизированные виды деятельности и ресурсные обязательства.
    source_hash: sha256-fd8ba34b64a99758
  BC-5070.20:
    name: Реестр активов и информация
    description: |
      Ведение надёжного реестра активов и информационной базы, лежащих в
      основе решений по управлению активами.
    source_hash: sha256-5490b84e55347d2a
  BC-5070.20.10:
    name: Управление реестром активов
    description: |
      Ведение полного и точного реестра активов и их атрибутов по всему
      имущественному комплексу.
    source_hash: sha256-6d722217a5f0ac49
  BC-5070.20.20:
    name: Иерархия и классификация активов
    description: |
      Структурирование активов в согласованные иерархии и классификации
      для поддержки анализа и отчётности.
    source_hash: sha256-9e987c11d892100d
  BC-5070.20.30:
    name: Качество данных об активах
    description: |
      Обеспечение полноты, точности и актуальности данных об активах по
      всей информационной базе.
    source_hash: sha256-f89ea51d1babb241
  BC-5070.20.40:
    name: Стандарты информации об активах
    description: |
      Определение стандартов и требований к информации об активах,
      регулирующих сбор и обмен данными.
    source_hash: sha256-aef275138b49f44b
  BC-5070.30:
    name: Оценка состояния и эффективности
    description: |
      Оценка состояния, эффективности и остаточного срока службы активов
      для информирования решений о вмешательстве и инвестициях.
    source_hash: sha256-c07df052d056fc4d
  BC-5070.30.10:
    name: Мониторинг состояния
    description: |
      Мониторинг состояния активов для обнаружения деградации и
      информирования решений об обслуживании и обновлении.
    source_hash: sha256-3199e2eb959c8862
  BC-5070.30.20:
    name: Режим инспекции активов
    description: |
      Определение и функционирование режима инспекции, устанавливающего
      состояние активов во времени.
    source_hash: sha256-4d15d9676a325be7
  BC-5070.30.30:
    name: Анализ эффективности
    description: |
      Анализ эффективности активов относительно ожидаемых стандартов и
      требований к обслуживанию.
    source_hash: sha256-09be7cb7fb9b41f6
  BC-5070.30.40:
    name: Оценка остаточного срока службы
    description: |
      Оценка остаточного срока полезного использования для поддержки
      сроков обновления и планирования инвестиций.
    source_hash: sha256-61a54a779682dd8a
  BC-5070.40:
    name: Стратегия обслуживания и обновлений
    description: |
      Разработка стратегии обслуживания и обновлений, оптимизирующей
      вмешательства за весь срок службы актива.
    source_hash: sha256-13b358ae5b73230a
  BC-5070.40.10:
    name: Разработка стратегии обслуживания
    description: |
      Разработка стратегий обслуживания, балансирующих затраты, риск и
      эффективность по типам активов.
    source_hash: sha256-13a334f6b0cc4bf6
  BC-5070.40.20:
    name: Планирование обновлений и замены
    description: |
      Планирование обновлений и замен для поддержания обслуживания
      активов в долгосрочной перспективе.
    source_hash: sha256-a42bf68efe800c10
  BC-5070.40.30:
    name: Оптимизация вмешательств
    description: |
      Оптимизация сроков и типа вмешательств для максимизации ценности
      от обслуживания и обновлений.
    source_hash: sha256-0bdf9c3f4fba162e
  BC-5070.40.40:
    name: Моделирование затрат за весь срок службы
    description: |
      Моделирование затрат за весь срок службы для информирования
      компромиссов по обслуживанию, обновлению и инвестициям.
    source_hash: sha256-1d8e18229d67f995
  BC-5070.50:
    name: Риск и критичность активов
    description: |
      Оценка риска и критичности активов для фокусировки вмешательств на
      активах, наиболее важных для обслуживания и безопасности.
    source_hash: sha256-5648edaf25a3143a
  BC-5070.50.10:
    name: Оценка критичности активов
    description: |
      Оценка критичности активов для непрерывности обслуживания,
      безопасности и целей организации.
    source_hash: sha256-9df9330d24dddb32
  BC-5070.50.20:
    name: Анализ видов отказов
    description: |
      Анализ видов отказов активов и их последствий для информирования
      решений по риску и обслуживанию.
    source_hash: sha256-17bc85747541a823
  BC-5070.50.30:
    name: Риск-ориентированная приоритизация вмешательств
    description: |
      Приоритизация вмешательств на основе риска и критичности активов.
    source_hash: sha256-3688db42b4cc5c95
  BC-5070.50.40:
    name: Оценка устойчивости активов
    description: |
      Оценка устойчивости активов к угрозам и нагрузкам, ставящим под
      угрозу продолжение обслуживания.
    source_hash: sha256-4924a98f4d041977
  BC-5070.60:
    name: Жизненный цикл и утилизация активов
    description: |
      Управление активами на поздних этапах жизни, при выводе из
      эксплуатации и утилизации для максимизации ценности и результатов
      устойчивого развития.
    source_hash: sha256-05b0594a435070dd
  BC-5070.60.10:
    name: Оптимизация ценности жизненного цикла
    description: |
      Оптимизация ценности, создаваемой активами на протяжении всего их
      жизненного цикла.
    source_hash: sha256-778175117807d49e
  BC-5070.60.20:
    name: Планирование вывода из эксплуатации
    description: |
      Планирование безопасного и упорядоченного вывода активов из
      эксплуатации в конце срока службы.
    source_hash: sha256-a079a535759c0c43
  BC-5070.60.30:
    name: Управление утилизацией активов
    description: |
      Управление утилизацией, передачей и списанием активов в
      соответствии с политикой и обязательствами.
    source_hash: sha256-5a236bad8ace26bd
  BC-5070.60.40:
    name: Устойчивость и цикличность
    description: |
      Встраивание устойчивого развития и результатов циркулярной
      экономики в решения по жизненному циклу и утилизации активов.
    source_hash: sha256-a30b5016384602a1
metadata:
  translator: claude-ai
  date: "2026-07-16"
