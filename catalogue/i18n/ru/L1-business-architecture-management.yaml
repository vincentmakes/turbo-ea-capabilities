locale: ru
source: L1-business-architecture-management.yaml
entries:
  BC-170:
    name: Управление бизнес-архитектурой
    description: |
      Проектирование, документирование и управление структурными связями между стратегией, способностями, потоками создания ценности, операционной моделью и информационными активами бизнеса. Создаёт архитектурные артефакты, переводящие корпоративную стратегию в согласованное и навигируемое представление того, как бизнес организован для создания ценности.
    in_scope:
      - Моделирование, декомпозиция, тепловые карты и оценка бизнес-способностей
      - Идентификация, определение этапов и сопоставление способностей в потоках создания ценности
      - Проектирование целевой операционной модели и планирование перехода
      - Моделирование бизнес-информации на концептуальном и логическом уровне
      - Принципы, внедрение фреймворков и управление бизнес-архитектурой
      - Управление репозиторием архитектурных артефактов и трассируемость
    out_of_scope:
      - ИТ-, прикладная, информационно-технологическая и архитектура безопасности
      - Формирование стратегии и управление её исполнением (BC-100)
      - Реализация проектов, программ и портфелей (BC-900)
      - Внедрение организационных изменений и реализация выгод (BC-910 и BC-920)
      - Моделирование, аналитика, оптимизация и управление автоматизацией процессов (BC-930)
  BC-170.10:
    name: Управление бизнес-архитектурой (governance)
    description: |
      Архитектурные принципы, внедрение фреймворков, ревью и управление исключениями для практики бизнес-архитектуры.
  BC-170.10.10:
    name: Определение архитектурных принципов
    description: |
      Определение и сопровождение принципов бизнес-архитектуры, направляющих проектные решения по всему предприятию.
  BC-170.10.20:
    name: Внедрение архитектурных фреймворков
    description: |
      Выбор, адаптация и развёртывание фреймворков, таких как TOGAF и BIZBOK.
  BC-170.10.30:
    name: Архитектурное ревью и соответствие
    description: |
      Проверка решений и инициатив на соответствие архитектурным стандартам и принципам.
  BC-170.10.40:
    name: Управление исключениями архитектуры
    description: |
      Регистрация, оценка и обработка отклонений от архитектурных стандартов.
  BC-170.20:
    name: Моделирование бизнес-способностей
    description: |
      Идентификация, декомпозиция, оценка и анализ источников обеспечения бизнес-способностей, используемых как основной архитектурный якорь.
  BC-170.20.10:
    name: Идентификация способностей
    description: |
      Выявление и наименование бизнес-способностей на уровне предприятия.
  BC-170.20.20:
    name: Декомпозиция способностей
    description: |
      Декомпозиция способностей на дочерние способности по принципу MECE до рабочего уровня.
  BC-170.20.30:
    name: Тепловое картирование способностей
    description: |
      Визуализация значимости, эффективности и инвестиционной позиции способностей.
  BC-170.20.40:
    name: Оценка способностей
    description: |
      Оценка зрелости, эффективности и пробелов отдельных способностей.
  BC-170.20.50:
    name: Стратегия обеспечения способностей
    description: |
      Решения «делать, покупать, партнёрство, удерживать» в разрезе портфелей способностей.
  BC-170.30:
    name: Моделирование потоков создания ценности
    description: |
      Идентификация и моделирование сквозных потоков создания ценности и их связи с обеспечивающими способностями.
  BC-170.30.10:
    name: Идентификация потоков создания ценности
    description: |
      Выявление клиентских, партнёрских и внутренних потоков создания ценности на уровне предприятия.
  BC-170.30.20:
    name: Определение этапов потоков создания ценности
    description: |
      Определение этапов потока создания ценности, критериев входа и единиц ценности.
  BC-170.30.30:
    name: Измерение эффективности потоков создания ценности
    description: |
      Определение и отслеживание метрик эффективности и создания ценности по этапам.
  BC-170.30.40:
    name: Сопоставление потоков создания ценности и способностей
    description: |
      Сопоставление способностей, необходимых для каждого этапа потока создания ценности.
  BC-170.40:
    name: Проектирование операционной модели
    description: |
      Архитектурное проектирование операционной модели, включая модель предоставления услуг, размещение источников и планирование перехода.
  BC-170.40.10:
    name: Проектирование целевой операционной модели
    description: |
      Определение целевой операционной модели по способностям, процессам, организации, локациям и информации.
  BC-170.40.20:
    name: Проектирование модели предоставления услуг
    description: |
      Проектирование внутренних моделей предоставления услуг, общих сервисов и центров компетенций.
  BC-170.40.30:
    name: Стратегия источников и локаций
    description: |
      Архитектурные решения по источникам и географии при предоставлении способностей.
  BC-170.40.40:
    name: Планирование перехода операционной модели
    description: |
      Последовательность изменений операционной модели по переходным состояниям и волнам.
  BC-170.50:
    name: Моделирование бизнес-информации
    description: |
      Моделирование информационных активов, глоссария и жизненного цикла информации с точки зрения бизнеса. Концептуальный и логический уровень; физическая архитектура данных относится к ИТ.
  BC-170.50.10:
    name: Моделирование бизнес-сущностей
    description: |
      Идентификация и определение ключевых бизнес-сущностей и их связей.
  BC-170.50.20:
    name: Управление бизнес-глоссарием
    description: |
      Авторитетные определения бизнес-терминов и понятий.
  BC-170.50.30:
    name: Картирование жизненного цикла информации
    description: |
      Картирование мест создания, использования, хранения и вывода из обращения бизнес-информации.
  BC-170.60:
    name: Управление репозиторием бизнес-архитектуры
    description: |
      Каталогизация, версионирование и инструменты для артефактов бизнес-архитектуры.
  BC-170.60.10:
    name: Каталогизация архитектурных артефактов
    description: |
      Инвентаризация и классификация артефактов бизнес-архитектуры в репозитории.
  BC-170.60.20:
    name: Версионирование и трассируемость артефактов
    description: |
      Версионирование артефактов и трассируемость между стратегией, способностями, потоками создания ценности и инициативами.
  BC-170.60.30:
    name: Администрирование инструмента репозитория
    description: |
      Конфигурация, управление доступом и эксплуатация инструмента репозитория архитектуры.
  BC-170.70:
    name: Дорожная карта и планирование перехода бизнес-архитектуры
    description: |
      Планирование текущего, целевого состояния и переходных архитектур для управления решениями по портфелю и инвестициям.
  BC-170.70.10:
    name: Оценка текущего состояния
    description: |
      Документирование текущей бизнес-архитектуры по способностям и потокам создания ценности.
  BC-170.70.20:
    name: Определение целевого состояния
    description: |
      Определение целевой бизнес-архитектуры, выровненной со стратегией.
  BC-170.70.30:
    name: Анализ пробелов
    description: |
      Идентификация и приоритизация пробелов между текущей и целевой архитектурой.
  BC-170.70.40:
    name: Проектирование переходных архитектур
    description: |
      Проектирование промежуточных переходных архитектур и упорядочивание с учётом зависимостей.
