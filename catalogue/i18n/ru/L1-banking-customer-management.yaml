    source_hash: sha256-c66690947334fd6e
  BC-1300.40.20:
    name: Управление информацией о бенефициарных владельцах
    description: |
      Сбор и ведение информации о бенефициарных владельцах.
    source_hash: sha256-d70c911aaab41677
  BC-1300.40.30:
