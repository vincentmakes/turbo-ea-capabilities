# Business Architecture Management
id: BC-170
name: Business Architecture Management
level: 1
industry: Cross-Industry
description: |
  Design, documentation, and governance of the structural relationships between
  strategy, capabilities, value streams, operating model, and business information
  assets. Provides the architectural artefacts that translate enterprise strategy
  into a coherent, navigable view of how the business is organised to deliver value.
in_scope:
  - Business capability modelling, decomposition, heatmapping, and assessment
  - Value stream identification, stage definition, and capability mapping
  - Target operating model design and transition planning
  - Business information modelling at the conceptual and logical level
  - Business architecture principles, framework adoption, and governance
  - Architecture artefact repository management and traceability
out_of_scope:
  - IT, application, data-layer, technology, and security architecture
  - Strategy formation and execution governance (covered by BC-100)
  - Project, programme, and portfolio delivery (covered by BC-900)
  - Organisational change adoption and benefits realisation (covered by BC-910 and BC-920)
  - Process modelling, mining, optimization, and automation governance (covered by BC-930)
references:
  - https://www.businessarchitectureguild.org/page/bizbok
  - https://pubs.opengroup.org/togaf-standard/business-architecture/
  - https://www.omg.org/spec/VDML/
  - https://www.gartner.com/en/information-technology/glossary/business-architecture
