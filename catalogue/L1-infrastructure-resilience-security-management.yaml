# Infrastructure Resilience & Security Management
id: BC-5120
name: "Infrastructure Resilience & Security Management"
level: 1
industry: Infrastructure
description: |
  Protection and resilience of critical infrastructure across physical security,
  cyber-physical and operational-technology security, resilience and continuity,
  emergency and crisis management, and climate and environmental resilience.
references:
  - https://www.iso.org/standard/75106.html
  - https://www.isa.org/isa99
  - https://www.nist.gov/cyberframework
  - https://www.iso.org/iso-31000-risk-management.html
in_scope:
  - Physical security, access control, and surveillance
  - Cyber-physical and operational-technology security
  - Operational resilience and business continuity
  - Emergency preparedness and crisis management
  - Climate adaptation and extreme-weather resilience
  - Protection of critical systems and assets
out_of_scope:
  - Enterprise risk management (BC-140)
  - Business continuity management (BC-160)
  - Cybersecurity management (BC-620)
  - Health, safety & environment (BC-5050)
children:
