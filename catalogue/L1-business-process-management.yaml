# Business Process Management
id: BC-930
name: Business Process Management
level: 1
industry: Cross-Industry
description: |
  Discipline of designing, modelling, monitoring, mining, optimizing, and governing
  end-to-end business processes as a managed asset class. Treats processes as
  first-class artefacts independent of the operational domains that execute them.
in_scope:
  - Process taxonomy, ownership, lifecycle, and standards governance
  - Process discovery, BPMN-based modelling, documentation, and versioning
  - Process performance KPIs, monitoring, and conformance reporting
  - Process mining including event log acquisition, discovery, and conformance checking
  - Process redesign, simulation, and automation opportunity identification
  - Automation portfolio governance across workflow and RPA platforms
  - Process control design and segregation-of-duties modelling
out_of_scope:
  - Improvement-project delivery via Lean, Six Sigma, or Kaizen events (covered by BC-720.50)
  - Per-domain operational execution such as order, claims, or shipment handling
  - RPA bot software development and platform engineering (covered by IT delivery capabilities)
  - IT service management process execution (covered by BC-700-series IT capabilities)
  - Business architecture, capability, and value stream modelling (covered by BC-170)
references:
  - https://www.omg.org/spec/BPMN/2.0/
  - https://www.apqc.org/process-frameworks
  - https://www.gartner.com/en/information-technology/glossary/bpm-business-process-management
  - https://www.processmining.org/process-mining-manifesto
  - https://www.abpmp.org/page/CBOK_Guide
