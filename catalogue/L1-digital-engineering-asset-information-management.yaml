# Digital Engineering & Asset Information Management
id: BC-5060
name: "Digital Engineering & Asset Information Management"
level: 1
industry: Infrastructure
description: |
  Digital engineering and structured asset information across the built-asset
  lifecycle, spanning building information modelling, the common data
  environment, 4D and 5D integration, geospatial and survey management, and
  digital-twin and asset-information management. Turns models and data into a
  trusted information asset from design through construction and operation.
references:
  - https://www.buildingsmart.org/
  - https://technical.buildingsmart.org/standards/ifc/
  - https://www.ogc.org/
in_scope:
  - BIM strategy, standards, and model coordination and clash detection
  - Common data environment and information requirements management
  - 4D construction sequencing and 5D cost integration
  - Geospatial, survey, and reality-capture data management
  - Digital twin development and operational data integration
  - Structured information handover across the asset lifecycle
out_of_scope:
  - Engineering document management (BC-1130)
  - Product lifecycle management (BC-820)
  - Enterprise information & data management (BC-610)
  - IT platform and application delivery (BC-600)
