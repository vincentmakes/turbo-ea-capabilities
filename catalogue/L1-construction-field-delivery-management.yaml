# Construction & Field Delivery Management
id: BC-5040
name: "Construction & Field Delivery Management"
level: 1
industry: Infrastructure
description: |
  Site execution of infrastructure works, spanning site establishment and
  mobilisation, work-front and production management, temporary works, plant
  and equipment, site materials and logistics, and construction quality. The
  field-delivery discipline that turns design and programme into constructed
  works safely, productively, and to specification.
references:
  - https://www.iso.org/iso-45001-occupational-health-and-safety.html
  - https://www.buildingsmart.org/
  - https://www.iso.org/iso-9001-quality-management.html
  - https://www.hse.gov.uk/construction/cdm/2015/index.htm
in_scope:
  - Site establishment, mobilisation, and temporary facilities provision
  - Work-front coordination, production sequencing, and progress tracking
  - Temporary works including scaffolding, formwork, and excavation support
  - Plant, equipment, and lifting operations management
  - Site materials call-off, laydown, logistics, and waste management
  - Construction quality control, inspection, and non-conformance management
out_of_scope:
  - Engineering construction management (BC-1150)
  - Commissioning and handover (BC-1160)
  - Design engineering (BC-1120)
  - Permanent asset operations and maintenance (BC-5090)
