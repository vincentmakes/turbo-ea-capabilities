# Infrastructure Asset Management
id: BC-5070
name: Infrastructure Asset Management
level: 1
industry: Infrastructure
description: |
  Whole-life management of infrastructure assets under ISO 55000, spanning
  asset management strategy and planning, the asset register and information
  base, condition and performance assessment, maintenance and renewals
  strategy, asset risk and criticality, and lifecycle and disposal.
references:
  - https://theiam.org/
  - https://www.iso.org/standard/83053.html
in_scope:
  - Asset management strategy, policy, and planning aligned to corporate objectives
  - Asset register, hierarchy, and information quality management
  - Condition, performance, and remaining-life assessment of assets
  - Maintenance and renewals strategy and whole-life cost modelling
  - Asset risk, criticality, and intervention prioritisation
  - Lifecycle value optimisation, decommissioning, and disposal
out_of_scope:
  - Cross-industry physical asset management (BC-1040)
  - Plant maintenance (BC-1030)
  - Maintenance execution (BC-5090)
  - Live network operations and control (BC-5080)
