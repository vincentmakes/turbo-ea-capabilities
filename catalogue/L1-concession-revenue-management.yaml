# Concession & Revenue Management
id: BC-5100
name: "Concession & Revenue Management"
level: 1
industry: Infrastructure
description: |
  Concession and public-private partnership management, tariff and pricing,
  revenue collection and assurance, grant and subsidy management, and commercial
  partnerships that monetise infrastructure assets over the concession term.
references:
  - https://ppp.worldbank.org/public-private-partnership/
  - https://www.gov.uk/government/organisations/infrastructure-and-projects-authority
  - https://www.oecd.org/gov/budgeting/public-private-partnerships.htm
in_scope:
  - Concession agreement and public-private partnership management
  - Tariff, toll, and regulated pricing management
  - Revenue collection, assurance, and leakage control
  - Grant, subsidy, and availability payment administration
  - Commercial partnerships and ancillary revenue development
  - Land and property revenue monetisation
out_of_scope:
  - Enterprise pricing management (BC-450)
  - Investment funding and financing strategy (BC-5000)
  - Regulatory price control (BC-5110)
  - Corporate treasury and cash management
