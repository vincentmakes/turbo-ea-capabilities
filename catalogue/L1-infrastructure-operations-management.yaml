# Infrastructure Operations Management
id: BC-5080
name: Infrastructure Operations Management
level: 1
industry: Infrastructure
description: |
  Operation of live infrastructure networks and systems, spanning network
  control operations, capacity and demand management, service availability,
  event and incident operations, and customer and user operations.
references:
  - https://theiam.org/
  - https://www.iso.org/iso-22301-business-continuity.html
in_scope:
  - Control-room and real-time network control operations
  - Capacity, demand, and flow management across the network
  - Service availability and service-level management
  - Operational event, incident, and disruption management
  - Customer and user operations and information services
  - Operational communications and restoration of service
out_of_scope:
  - Utilities operations (BC-3800)
  - Transportation operations (BC-2400)
  - Maintenance execution (BC-5090)
  - Asset management strategy and planning (BC-5070)
