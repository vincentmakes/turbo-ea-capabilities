# Capital Programme & Project Controls Management
id: BC-5020
name: "Capital Programme & Project Controls Management"
level: 1
industry: Infrastructure
description: |
  Owner- and delivery-side governance and controls for infrastructure capital
  programmes and projects, spanning programme setup, cost and schedule control,
  earned value, risk and change control, and assurance.
references:
  - https://web.aacei.org/
  - https://www.pmi.org/
  - https://www.gov.uk/government/organisations/infrastructure-and-projects-authority
  - https://www.neccontract.com/
in_scope:
  - Programme setup, governance, and stage-gate management
  - Cost estimating, budgeting, control, and forecasting
  - Planning, scheduling, and critical path analysis
  - Earned value and integrated performance management
  - Programme risk, change, and contingency control
  - Project assurance, gateway reviews, and reporting
out_of_scope:
  - Enterprise project and change management (BC-900/BC-910)
  - Engineering project management (BC-1110)
  - Investment appraisal and funding decisions (BC-5000)
  - Construction site execution and works delivery
