# Infrastructure Maintenance Management
id: BC-5090
name: Infrastructure Maintenance Management
level: 1
industry: Infrastructure
description: |
  Execution of inspection and maintenance on live infrastructure assets,
  spanning maintenance planning and scheduling, inspection and examination,
  planned maintenance execution, reactive and emergency maintenance, and
  maintenance performance and records.
references:
  - https://theiam.org/
  - https://www.iso.org/standard/83053.html
in_scope:
  - Maintenance work planning, scheduling, and resource allocation
  - Inspection, examination, and defect identification on assets
  - Planned preventive and renewals maintenance execution
  - Reactive and emergency repair and fault response
  - Maintenance records, backlog, and performance management
  - Reliability improvement from maintenance insight
out_of_scope:
  - Cross-industry plant maintenance (BC-1030)
  - Asset management strategy (BC-5070)
  - Network operations (BC-5080)
  - Whole-life renewals and maintenance strategy (BC-5070.40)
