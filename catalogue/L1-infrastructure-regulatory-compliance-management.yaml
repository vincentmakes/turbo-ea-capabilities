# Infrastructure Regulatory & Compliance Management
id: BC-5110
name: "Infrastructure Regulatory & Compliance Management"
level: 1
industry: Infrastructure
description: |
  Management of economic and safety regulation for infrastructure, spanning
  regulator relationships and price-control submissions, licence and obligation
  management, safety cases and assurance, regulatory reporting, and permits and
  statutory approvals.
references:
  - https://www.iso.org/iso-31000-risk-management.html
  - https://www.gov.uk/government/organisations/infrastructure-and-projects-authority
  - https://ppp.worldbank.org/public-private-partnership/
in_scope:
  - Regulator engagement and price-control submissions
  - Operating licence and statutory obligation management
  - Safety case development and safety assurance
  - Regulatory performance and statutory reporting
  - Operational, environmental, and statutory permit management
  - Regulatory audit and disclosure support
out_of_scope:
  - Cross-industry compliance management (BC-130)
  - Enterprise risk management (BC-140)
  - Concession commercial management (BC-5100)
  - Corporate legal and litigation management
