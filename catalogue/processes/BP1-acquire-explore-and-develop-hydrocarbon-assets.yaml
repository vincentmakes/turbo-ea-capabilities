id: BP-210
name: Acquire, Explore, and Develop Hydrocarbon Assets
level: 1
industry: Oil & Gas
description: >-
  Run upstream petroleum operations from licence acquisition and exploration through field appraisal and development to first hydrocarbons.
framework_refs:
  - framework: APQC-PCF
    external_id: "Upstream Petroleum PCF v7.2 — Categories 2.0 'Acquire, Explore, and Appraise Hydrocarbon Assets' and 3.0 'Develop and Deplete Hydrocarbon Assets'"
