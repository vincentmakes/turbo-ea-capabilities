id: BP-60
name: Manage Customer Service
level: 1
industry: Cross-Industry
description: >-
  Managing interactions with current customers after the delivery of products and services. This includes developing and planning customer service practices with a focus on handling inquiries after sales, feedback, warranties, recalls, and other related processes.
framework_refs:
  - framework: APQC-PCF
    external_id: "6.0"
    version: "8.0"
realizes_capability_ids:
  - BC-430
  - BC-420
children:
  - id: BP-60.10
    name: Develop Customer Service Strategy
    level: 2
    description: >-
      Defining a plan that removes customer obstacles by gathering operational insight and competitive insight, as well as improving soft skills and forward resolution for employees. Develop customer segmentation. Define rules and regulations for customer service. Establish service levels for customers.
    framework_refs:
      - framework: APQC-PCF
        external_id: "6.1"
        version: "8.0"
    realizes_capability_ids: []
    children:
      - id: BP-60.10.10
        name: Define Customer Service Requirements Across the Enterprise
        level: 3
        description: >-
          Identifying the customer service requirements across the organization, including the needs and expectations of different customer segments. Additionally this includes defining a set of behaviors, skills, and policies needed to provide customer service effectively across the enterprise.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.1"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.10.20
        name: Define Customer Service Experience
        level: 3
        description: >-
          Communicating how customer service interactions are handled including what is expected when engaging the customer. Relate service level expectations to the workforce. Ensure positive customer experience.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.2"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.10.30
        name: Define and Manage Customer Service Channel Strategy
        level: 3
        description: >-
          Define the channels and communication methods that will be used to deliver customer service, including phone, email, chat, social media, and in-person interactions.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.3"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.10.40
        name: Define Customer Service Policies and Procedures
        level: 3
        description: >-
          Develop policies and procedures for delivering customer service, including handling customer complaints, resolving issues, and maintaining customer records.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.4"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.10.50
        name: Establish Target Service Level for Each Customer Segment
        level: 3
        description: >-
          Determining and implementing levels for customer services. Benchmark certain customer service practices, and base customer level services on those benchmarks. Create a service level agreement, which is an agreement designed to create a common understanding about services, priorities, and responsibilities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.5"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.10.60
        name: Identify and Define Customer Service Strategy Integrations
        level: 3
        description: >-
          Define how the customer service strategy will integrate with other departments like marketing, sales, and product development to ensure a seamless customer experience.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.1.6"
            version: "8.0"
        realizes_capability_ids: []
        children: []
  - id: BP-60.20
    name: Plan and Manage Customer Service Contacts
    level: 2
    description: >-
      Planning and administering workforce operations for customer service provision by taking care of customer services requests/inquiries, as well as the complaints.
    framework_refs:
      - framework: APQC-PCF
        external_id: "6.2"
        version: "8.0"
    realizes_capability_ids: []
    children:
      - id: BP-60.20.10
        name: Plan and Manage Customer Service Workforce
        level: 3
        description: >-
          Creating and administering the workforce deployed for the customer service process. Forecast the customer workforce needs to correctly schedule the workforce. Track the utility of the workforce deployed. Examine the interactions between the customer and customer service representatives to achieve high quality.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-300
        children: []
      - id: BP-60.20.20
        name: Manage Customer Service Problems, Requests, and Inquiries
        level: 3
        description: >-
          Handling the requests and inquiries from customers that seek information regarding the organization's products/services. Obtain the customer requests online and by phone. Direct these requests to higher-level representatives. Approve requests, and respond to customers.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.2.2"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.20.30
        name: Manage Customer Complaints
        level: 3
        description: >-
          Obtaining customer complaints online or by phone. Direct these complaints to higher-level representatives as appropriate. Resolve them. Respond to customers.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-60.20.40
        name: Process Returns
        level: 3
        description: >-
          Acquiring returns and identify if the returns are scraped or salvaged.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.2.4"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.20.50
        name: Report Incidents and Risks to Regulatory Bodies
        level: 3
        description: >-
          Notifying all stakeholders, legal, and industry regulatory bodies of the incidents and risks related to a return or recall, if needed.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.2.5"
            version: "8.0"
        realizes_capability_ids: []
        children: []
  - id: BP-60.30
    name: Service Products After Sales
    level: 2
    description: >-
      Assigning post-sales policies and paying claims on purchased products.  This is a process that is an administrative function focused on creating rules (claim codes). This group ensures that claims are valid and are processed quickly.  As well as to quickly determine responsibility for claim settlement.
    framework_refs:
      - framework: APQC-PCF
        external_id: "6.3"
        version: "8.0"
    realizes_capability_ids: []
    children:
      - id: BP-60.30.10
        name: Register Products
        level: 3
        description: >-
          Filing product registrations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.3.1"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.30.20
        name: Process Warranty Claims
        level: 3
        description: >-
          Identifying, investigating, and processes warranty claims. This process includes: receipt and validation of a warranty claim; definition and diagnosis /root cause analysis of an issue and recommendation for corrective action; the determination of responsibility for settlement of the claim; the transaction being approved or denied; and the originator being notified and payment authorized. In the case of a recurring event, further investigation (definition and diagnosis or root cause analysis) is performed, and a recommendation for corrective action is made and implemented in production/design. It ends when the claim is closed.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.3.2"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.30.30
        name: Manage Supplier Recovery
        level: 3
        description: >-
          Managing the recovery of costs from suppliers for individual claims.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.3.3"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.30.40
        name: Service Products
        level: 3
        description: >-
          Validating specific service requirements for individual customers. Determine and schedule resource to fulfill these requirements. Provide service to specific individual customers. Ensure the quality of service delivery.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.3.4"
            version: "8.0"
        realizes_capability_ids: []
        children: []
  - id: BP-60.40
    name: Manage Product Recalls and Regulatory Audits
    level: 2
    description: >-
      Removing defective products from the distribution chain. Participate in audits from watchdog agencies.
    framework_refs:
      - framework: APQC-PCF
        external_id: "6.4"
        version: "8.0"
    realizes_capability_ids: []
    children:
      - id: BP-60.40.10
        name: Initiate Recall
        level: 3
        description: >-
          Commencing the removal process of defective products.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.1"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.40.20
        name: Assess the Likelihood and Consequences of Occurrence of Any Hazards
        level: 3
        description: >-
          Performing risk analysis. Identify all dangers, evaluate how probable they are, and what kinds of negative results or or adverse side effect they carry.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.2"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.40.30
        name: Manage Recall Related Communications
        level: 3
        description: >-
          Handling communications that are related to product recalls.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.3"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.40.40
        name: Submit Regulatory Reports
        level: 3
        description: >-
          Creating and delivering reports to regulatory agencies to provide details about handling product recalls.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.4"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.40.50
        name: Monitor and Audit Recall Effectiveness
        level: 3
        description: >-
          Analyzing the effectiveness of product recalls.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.5"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.40.60
        name: Manage Recall Termination
        level: 3
        description: >-
          Ending product recalls, communicating to the public and filing reports.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.4.6"
            version: "8.0"
        realizes_capability_ids: []
        children: []
  - id: BP-60.50
    name: Evaluate Customer Service Operations and Customer Satisfaction
    level: 2
    description: >-
      Calculating and assessing the operational activities of the customer service function. Evaluation is achieved through the customer requests/inquiries handling process, the customer complaint handling process, and product and services quality. Examine activities to ensure high levels of customer service.
    framework_refs:
      - framework: APQC-PCF
        external_id: "6.5"
        version: "8.0"
    realizes_capability_ids: []
    children:
      - id: BP-60.50.10
        name: Measure Customer Satisfaction with Customer Problems, Requests, and Inquiries Handling
        level: 3
        description: >-
          Calculating satisfaction levels of customers by effectively evaluating the process of handling requests/inquiries of customers. Effectively calculate the performance of customer-requests/inquiries handling and resolution. Obtain information regarding requests/inquiries handling and resolution through customer feedback. Use it to explore new ideas and opportunities for enhanced customer requests/inquiries handling and resolution process.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.5.1"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.50.20
        name: Measure Customer Satisfaction with Customer- Complaint Handling and Resolution
        level: 3
        description: >-
          Measuring the satisfaction level of customers as pertains to how their complaints are handled and resolved. This process element requires the organization to estimate the customers level of fulfillment with the process reconciling their complaints and towards the objective of ensuring customer retention. The feedback received can be used to develop concepts for new opportunities to boost the level of customer satisfaction.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.5.2"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.50.30
        name: Measure Customer Satisfaction with Products and Services
        level: 3
        description: >-
          Calculating satisfaction levels of customers with products/services. Obtain customer feedback on products/services, as well as the effectiveness of the advertising campaigns. Examine this information to reach meaningful conclusions, which could then be used to enhance the customer service operations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.5.3"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.50.40
        name: Evaluate and Manage Warranty Performance
        level: 3
        description: >-
          Assessing the cost and effectiveness of warranties.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.5.4"
            version: "8.0"
        realizes_capability_ids: []
        children: []
      - id: BP-60.50.50
        name: Evaluate Recall Performance
        level: 3
        description: >-
          Reviewing customer service feedback to identify areas in which improvements can be made. Engage with management to discuss issues.
        framework_refs:
          - framework: APQC-PCF
            external_id: "6.5.5"
            version: "8.0"
        realizes_capability_ids: []
        children: []
