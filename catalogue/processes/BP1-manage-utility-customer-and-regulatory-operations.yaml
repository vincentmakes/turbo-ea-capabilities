id: BP-270
name: Manage Utility Customer and Regulatory Operations
level: 1
industry: Power & Water Utilities
description: >-
  Run utility-specific customer operations (metering, billing, supply switching, hardship support) and regulatory operations (price control, code compliance, statutory reporting).
framework_refs:
  - framework: APQC-PCF
    external_id: "APQC Utilities PCF v7.2 — Customer and regulatory categories"
realizes_capability_ids:
  - BC-100
children:
  - id: BP-270.10
    name: Manage Customer Metering and Meter Data
    level: 2
    description: >-
      Operate the meter estate; collect, validate, estimate, edit meter data.
    realizes_capability_ids:
      - BC-420
      - BC-610
    children:
      - id: BP-270.10.10
        name: Operate Meter Estate
        level: 3
        description: >-
          Operate smart and non-smart meter estate; manage meter exchange.
        realizes_capability_ids:
          - BC-610
        children: []
      - id: BP-270.10.20
        name: Collect and Validate Meter Data
        level: 3
        description: >-
          Collect AMI/AMR readings; validate, estimate, and edit (VEE) meter data.
        realizes_capability_ids:
          - BC-610
        children: []
      - id: BP-270.10.30
        name: Provide Meter Data to Market
        level: 3
        description: >-
          Provide meter data to retailers, settlement bodies, and customers.
        realizes_capability_ids:
          - BC-610
        children: []
  - id: BP-270.20
    name: Operate Utility Billing and Revenue Collection
    level: 2
    description: >-
      Calculate utility bills, present bills, run dunning, and manage collections and disconnection.
    realizes_capability_ids:
      - BC-200
    children:
      - id: BP-270.20.10
        name: Calculate Utility Bills
        level: 3
        description: >-
          Calculate utility bills using tariffs, meter data, and prepayment top-up where applicable.
        realizes_capability_ids:
          - BC-200
        children: []
      - id: BP-270.20.20
        name: Present Bills and Manage Inquiries
        level: 3
        description: >-
          Present bills across channels; resolve billing inquiries and disputes.
        realizes_capability_ids:
          - BC-430
          - BC-200
        children: []
      - id: BP-270.20.30
        name: Manage Collections and Disconnection
        level: 3
        description: >-
          Run dunning and collections; manage disconnection and reconnection per regulations.
        realizes_capability_ids:
          - BC-200
        children: []
  - id: BP-270.30
    name: Manage Supply Switching and Customer Onboarding
    level: 2
    description: >-
      Manage supply-point onboarding, switching, and tariff changes per market codes.
    realizes_capability_ids:
      - BC-420
      - BC-430
    children:
      - id: BP-270.30.10
        name: Manage Customer Switching
        level: 3
        description: >-
          Manage customer switching between retailers per market codes.
        realizes_capability_ids:
          - BC-420
        children: []
      - id: BP-270.30.20
        name: Operate Supply-Point Onboarding
        level: 3
        description: >-
          Onboard new connections; manage move-in/move-out events.
        realizes_capability_ids:
          - BC-430
        children: []
  - id: BP-270.40
    name: Manage Vulnerable Customer and Hardship Programs
    level: 2
    description: >-
      Identify and support vulnerable customers and customers in hardship per regulatory obligations.
    realizes_capability_ids:
      - BC-130
      - BC-420
      - BC-430
    children:
      - id: BP-270.40.10
        name: Identify and Register Vulnerable Customers
        level: 3
        description: >-
          Identify and register vulnerable customers per regulatory definitions.
        realizes_capability_ids:
          - BC-430
          - BC-130
        children: []
      - id: BP-270.40.20
        name: Operate Hardship Programs
        level: 3
        description: >-
          Operate payment plans, hardship grants, and energy-efficiency programs for hardship customers.
        realizes_capability_ids:
          - BC-430
        children: []
