    name: Manage Regulatory Reporting and Price-Control Submissions
    level: 2
    description: >-
      Prepare regulatory rate filings, performance reports, and price-control submissions.
    realizes_capability_ids:
      - BC-130
      - BC-240
    children:
      - id: BP-270.50.10
        name: Prepare Price-Control Submissions
        level: 3
        description: >-
          Prepare RIIO / equivalent price-control submissions to economic regulators.
        realizes_capability_ids:
          - BC-130
          - BC-240
        children: []
      - id: BP-270.50.20
        name: Produce Regulatory Performance Reports
        level: 3
        description: >-
          Produce regulatory performance reports against published targets.
        realizes_capability_ids:
          - BC-130
        children: []
      - id: BP-270.50.30
        name: Manage Regulatory Inquiries and Audits
        level: 3
        description: >-
          Respond to regulatory inquiries and audits; manage remediation.
        realizes_capability_ids:
          - BC-130
          - BC-140
        children: []
