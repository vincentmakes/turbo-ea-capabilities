            external_id: "8.5.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-170
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.50.40
        name: Execute IT Service/solution Creation and Testing
        level: 3
        description: >-
