id: BP-80
name: "Manage Information Technology (IT)"
level: 1
industry: Cross-Industry
description: >-
  Managing process groups relevant to the business of information technology within an organization. The process groups include "Develop and manage IT customer relationships", "Develop and manage IT business strategy", " Develop and manage IT resilience and risk", " Manage information", " Develop and manage services/solutions", "Deploy services/solutions", and " Create and manage support services/solutions".
framework_refs:
  - framework: APQC-PCF
    external_id: "8.0"
    version: "8.0"
realizes_capability_ids:
  - BC-600
  - BC-610
  - BC-620
children:
  - id: BP-80.10
    name: Develop and Manage IT Customer Relationships
    level: 2
    description: >-
      Creating and administering relationships with IT customers. Understanding customer needs including high-level business requirements for IT transformation. Plan for and communicate IT services along with establishing IT service levels, providing transformation guidance, and performance analysis that foster IT customer relationships.
    framework_refs:
      - framework: APQC-PCF
        external_id: "8.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-420
      - BC-600
      - BC-610
      - BC-620
    children:
      - id: BP-80.10.10
        name: Understand IT Customer Needs
        level: 3
        description: >-
          Assessing the customer communities along with current IT operational capabilities and usage.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-420
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.10.20
        name: Identify IT Customer Transformation Needs
        level: 3
        description: >-
          Identifying changing needs of staff dependent on information technology based on continuous improvement to deliver results according to organizational goals. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI).
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-420
          - BC-600
          - BC-610
          - BC-620
          - BC-920
        children: []
      - id: BP-80.10.30
        name: Plan and Communicate IT Services
        level: 3
        description: >-
          Create and design an organized and curated collection of all IT-related services that can be performed by, for, or within the organization. Maintain and convey information about deliverables, prices, contact points, and processes for requesting an information technology service.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.10.40
        name: Provide IT Transformation Guidance
        level: 3
        description: >-
          Understanding the necessity of IT transformation for the business. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI). Collect and analyze customer requirements. Identify opportunities and prioritize outcomes. Develop and support business case for transformation. Develop transformation plan and roadmap.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
          - BC-920
        children: []
      - id: BP-80.10.50
        name: Develop and Manage IT Service Levels
        level: 3
        description: >-
          Establishing and maintaining service levels for the provision of IT services and solutions. Design and maintain the IT services and solution catalogue, as well as service level agreements. Evaluate the performance of IT service level agreements. Communicate the results to the management.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.10.60
        name: Manage IT Customer Relationships
        level: 3
        description: >-
          Managing the IT relationship with its customers by systematically coordinating interactions over multiple touch points on a regular basis. Coordinate the IT's efforts to reach out to its customers, which include emails, social-media interactions, newsletters, and direct conversations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-420
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.10.70
        name: Analyze Service Performance
        level: 3
        description: >-
          Proactively manage IT service levels against IT customer requirements.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.1.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
  - id: BP-80.20
    name: Develop and Manage IT Business Strategy
    level: 2
    description: >-
      Handling the business of IT. Create a organization-wide strategy for the IT function. Define the organization's IT architecture. Manage the IT portfolio. Research and innovate in the field of IT. Assess and convey the performance and the value of the IT function.
    framework_refs:
      - framework: APQC-PCF
        external_id: "8.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-600
      - BC-610
      - BC-620
    children:
      - id: BP-80.20.10
        name: Define Business Technology and Governance Strategy
        level: 3
        description: >-
          Defining the need of technology in business and systematic implementation of IT investments. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI). It comprises of assessing competitive technology components to ensure structural analysis, development, usage and security of technology for efficient business operations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.20.20
        name: Manage IT Portfolio Strategy
        level: 3
        description: >-
          Strategy for systematic management of IT investments, projects, and activities. Analyze and examine the value of the IT portfolio and allocate resources based on business objectives.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
          - BC-900
        children: []
      - id: BP-80.20.30
        name: Define and Maintain Enterprise Architecture
        level: 3
        description: >-
          Outlining and maintaining the organization's IT architecture. Establish the IT architecture definition and framework. Ensure the relevance of IT. Create and confirm the approach for IT maintenance. Create rules and regulations to guide IT architecture. Authenticate and finalize all IT related research and innovation that takes place within the organization.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-170
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.20.40
        name: Define IT Service Management Strategy
        level: 3
        description: >-
          Defining perspective, position, plans, and patterns needed to execute designing, delivering, managing, and improving the way information technology is used within an organization.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.20.50
        name: Control IT Management System
        level: 3
        description: >-
          Regulating the IT management system through performance measures, governance, analysis, and monitoring through a variety of analytic tools. Evaluate IT finances, resource, services, projects, and value for report out.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.20.60
        name: Manage IT Value Portfolio
        level: 3
        description: >-
          Creating and establishing the value portfolio. Defining, analyzing, and examining the value of projects, investments, and activities of the IT function.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
          - BC-900
        children: []
      - id: BP-80.20.70
        name: Define and Manage Technology Innovation
        level: 3
        description: >-
          Outline and manage the innovation of technology within the organization. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI). Research and understand emerging future technological concepts and capabilities. Plan for IT innovation investments. Plan and execute viable innovation projects.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.2.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
          - BC-800
        children: []
  - id: BP-80.30
    name: Develop and Manage IT Resilience and Risk
    level: 2
    description: >-
      Develop and include the processes required to rapidly adapt and respond to any internal or external opportunity, demand, disruption, or threat to IT and cybersecurity. Build a dynamic, strategic, and integrated approach to managing IT and cyber risks, compliance obligations, and resilience, while ensuring alignment with global standards and frameworks.
    framework_refs:
      - framework: APQC-PCF
        external_id: "8.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-120
      - BC-600
      - BC-610
      - BC-620
    children:
      - id: BP-80.30.10
        name: Develop IT Compliance, Risk, and Security Strategy
        level: 3
        description: >-
          Ensuring that the organization effectively manages IT and cybersecurity risks by developing rules, standards, and strategies that safeguard the confidentiality, integrity, and availability of IT and OT assets. Establish compliance objectives, align with recognized cybersecurity frameworks, and integrate IT and OT risk management to create a unified approach.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.20
        name: Develop IT Resilience Strategy
        level: 3
        description: >-
          Developing resilience strategies across IT and cybersecurity functions to proactively avoid risks and disruptions. Identify critical risks, prioritize them based on business needs, and establish mitigation approaches to ensure the organization’s ability to adapt and recover from cyber and IT-related threats.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.30
        name: Control IT Risk, Compliance, and Security
        level: 3
        description: >-
          Ensuring effective control over IT and cybersecurity risks, compliance obligations, and security measures. Formulate and execute guidelines in line with regulatory bodies and organizational security objectives. Implement proactive measures such as threat intelligence, vulnerability management, and OT-specific controls to safeguard the organization’s IT and OT environments. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI).
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.40
        name: Plan and Manage IT Continuity
        level: 3
        description: >-
          Planning and managing the organization’s ability to recover from exposure to internal and external threats, with a focus on IT and cybersecurity. Ensure that continuity plans address cyber-specific scenarios, including ransomware attacks and other evolving threats, while maintaining uninterrupted operations of critical IT and OT services.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.50
        name: Develop and Manage IT Security, Privacy, and Data Protection
        level: 3
        description: >-
          Creating and deploying an architecture for securing and ensuring the privacy of data flows throughout the organization. Develop and implement protocols and policies to protect IT and OT environments, aligned with global standards. Incorporate modern security paradigms, such as Zero Trust Architecture, to ensure the safe use of IT services and solutions.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.60
        name: Conduct and Analyze IT Compliance Assessments
        level: 3
        description: >-
          Evaluate and analyze the IT environment for the compliance of industry regulations and government legislation. Ensure that IT capability and resources meet the set standards.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-130
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.70
        name: Develop and Execute IT Resilience and Continuity Operations
        level: 3
        description: >-
          Create and execute a process to rapidly adapt and respond to any internal or external opportunity, demand, disruption, or threat in IT. Maintain continuous IT operations to protect employees, assets, and overall brand equity.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
      - id: BP-80.30.80
        name: Manage IT User Identity and Authorization
        level: 3
        description: >-
          The process of identifying, authenticating, and authorizing IT users to have access to applications, systems, IT components, or networks by associating user rights and restrictions with established identities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "8.3.8"
            version: "8.0"
        realizes_capability_ids:
          - BC-600
          - BC-610
          - BC-620
        children: []
  - id: BP-80.40
    name: Manage Information
    level: 2
