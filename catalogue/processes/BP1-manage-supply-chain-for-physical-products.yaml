id: BP-40
name: Manage Supply Chain for Physical Products
level: 1
industry: Cross-Industry
description: >-
  Plan, source, make, deliver, and return physical products end-to-end. Structured along the SCOR (Supply Chain Operations Reference) macro processes Plan, Source, Make, Deliver — with returns and reverse logistics scoped under Deliver and Enable functions distributed across the relevant L2 categories. APQC PCF Cross-Industry v8.0 retained as a secondary cross-walk so existing tooling and benchmarking continue to resolve.
framework_refs:
  - framework: SCOR
    external_id: Supply Chain Operations
    version: "14.0"
    url: https://www.ascm.org/learning-development/certifications-credentials/scor-ds/
  - framework: APQC-PCF
    external_id: "4.0"
    version: "8.0"
realizes_capability_ids:
  - BC-520
  - BC-530
children:
  - id: BP-40.10
    name: Plan Supply Chain Operations
    level: 2
    description: >-
      Develop and align demand, supply, production, and distribution plans across the supply chain. Covers production and materials strategy, demand forecasting and reconciliation, master scheduling, distribution requirements planning (DRP), and quality standard-setting. Maps to SCOR Plan (sP).
    framework_refs:
      - framework: SCOR
        external_id: sP
        version: "14.0"
      - framework: APQC-PCF
        external_id: "4.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-520
      - BC-530
    children:
      - id: BP-40.10.10
        name: Develop Production and Materials Strategies
        level: 3
        description: >-
          Creating strategies for production processes, as well as the process of managing materials. Define production and supply constraints. Design a blueprint of the workplace. Establish rules and regulations regarding the employees, outsourcing of services, and the expenditure to be incurred on the manufacturing capital.
        framework_refs:
          - framework: SCOR
            external_id: sP3.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.20
        name: Manage Demand for Products
        level: 3
        description: >-
          Forecasting demand for products using secondary research and customer feedback. Refine these forecasts. Inspect the approach used in creating forecasts, and determine its accuracy.
        framework_refs:
          - framework: SCOR
            external_id: sP1.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.30
        name: Create Materials Plan
        level: 3
        description: >-
          Developing a scheme that allows for advance planning for the availability of raw materials and spares. Start with an unconstrained plan, and refine based on supply chain realities by identifying critical materials required for production, checking material specifications, and collaborating with all vendors over the supply.
        framework_refs:
          - framework: SCOR
            external_id: sP2.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.40
        name: Create and Manage Master Production Schedule
        level: 3
        description: >-
          Taking care of the master production plan. The master production includes creation and implementation of the site-level production plan, as well as management of the inventory that is currently in the production process.
        framework_refs:
          - framework: SCOR
            external_id: sP3.4
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-40.10.50
        name: Plan Distribution Requirements
        level: 3
        description: >-
          Maintaining master data of finished products and inventory. Identify the requirements of finished products at the destination, as well as partner requirements. Calculate the consolidation at source. Manage replenishment planning. Create and administer a dispatch plan. Calculate load plans for destinations and partners. Manage the cost of supplying these products. Ensure effective utilization of capacity.
        framework_refs:
          - framework: SCOR
            external_id: sP4.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.60
        name: Establish Distribution Planning Constraints
        level: 3
        description: >-
          Instituting the constraints for planning of distribution process. Create a plan that specifies every element in the distribution process from the blueprint of the distribution centers to how and when the inventory would reach the distribution centers.
        framework_refs:
          - framework: SCOR
            external_id: sP4.2
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.70
        name: Review Distribution Planning Policies
        level: 3
        description: >-
          Revisiting and refurbishing the policies for planning the distribution process. Asses the distribution strategies, including how the products are to be made available and sent to different distributors. Set guidelines regarding relationships between the sources and the distribution centers.
        framework_refs:
          - framework: SCOR
            external_id: sE1.3
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
      - id: BP-40.10.80
        name: Develop Quality Standards and Procedures
        level: 3
        description: >-
          Developing standards and procedures for maintaining the quality of products/services. Establish desired quality targets. Create standardized procedures for the quality. Ensure quality specifications are effectively communicated.
        framework_refs:
          - framework: SCOR
            external_id: sE2.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.1.8"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
          - BC-720
        children: []
  - id: BP-40.20
    name: Source Materials and Services
    level: 2
    description: >-
      Order, receive, and pay for materials and services from approved suppliers. Includes sourcing strategy and category management, supplier selection and contracting, requisitioning and purchase order placement, and supplier performance management. Maps to SCOR Source (sS) plus Enable Procurement (sE9) for governance.
    framework_refs:
      - framework: SCOR
        external_id: sS
        version: "14.0"
      - framework: APQC-PCF
        external_id: "4.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-500
      - BC-510
    children:
      - id: BP-40.20.10
        name: Provide Sourcing Governance
        level: 3
        description: >-
          Creating strategies for procuring materials and services from various sources, and for managing and evaluating categories. Establish a procurement process that describes the approach for obtaining products and purchasing activities. Evaluate the sources. Create sourcing relationships in order to continuously improve. Re-evaluate purchasing activities.
        framework_refs:
          - framework: SCOR
            external_id: sE9
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-500
          - BC-510
        children: []
      - id: BP-40.20.20
        name: Develop Category Plan
        level: 3
        description: >-
          Defining sourcing strategies and plans for categories of materials or services to optimize cost, supply continuity, value, and alignment with organizational requirements and market conditions.
        framework_refs:
          - framework: SCOR
            external_id: sE9.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-500
          - BC-510
        children: []
      - id: BP-40.20.30
        name: Select Suppliers and Develop/maintain Contracts
        level: 3
        description: >-
          Evaluating supplier options to select the most effective and efficient suppliers. Validate selected suppliers. Establish and manage supplier contracts.
        framework_refs:
          - framework: SCOR
            external_id: sE9.4
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-500
          - BC-510
        children: []
      - id: BP-40.20.40
        name: Order Materials and Services
        level: 3
        description: >-
          Creating and approving requisitions and distributing purchase orders accordingly. Hasten the procurement process to satisfy internal needs.
        framework_refs:
          - framework: SCOR
            external_id: sS1.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.2.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-500
          - BC-510
        children: []
      - id: BP-40.20.50
        name: Manage Suppliers
        level: 3
        description: >-
          Collecting and analyzing new information in order to track and rate suppliers and build relationships.
        framework_refs:
          - framework: SCOR
            external_id: sE9.5
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.2.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-500
          - BC-510
        children: []
  - id: BP-40.30
    name: Make Products
    level: 2
    description: >-
      Schedule, execute, and quality-control the production of finished goods. Covers production scheduling, manufacturing and assembly, in-process and final quality testing, and lot traceability. Maps to SCOR Make (sM) — Make-to-Stock, Make-to-Order, and Engineer-to-Order are mode variants pinned per node where relevant.
    framework_refs:
      - framework: SCOR
        external_id: sM
        version: "14.0"
      - framework: APQC-PCF
        external_id: "4.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-520
      - BC-530
    children:
      - id: BP-40.30.10
        name: Schedule Production
        level: 3
        description: >-
          Scheduling the production of final products. Generate a detailed schedule plan. Create and release production orders and lots. Schedule the planned and unplanned maintenance orders.
        framework_refs:
          - framework: SCOR
            external_id: sM1.1
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-40.30.20
        name: Produce and Assemble Product
        level: 3
        description: >-
          Manufacturing the product. Convert the raw materials to develop consumer-ready products. Manage the raw materials to implement the detailed production schedule. Reproduce defectives to establish and remediate cause. Ensure production optimization and benchmark performance.
        framework_refs:
          - framework: SCOR
            external_id: sM1.3
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-40.30.30
        name: Perform Quality Testing
        level: 3
        description: >-
          Executing tests to evaluate the quality of the products manufactured. Calibrate the test equipment. Conduct the actual tests. Record the results and outcomes of the quality test conducted.
        framework_refs:
          - framework: SCOR
            external_id: sM1.4
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-720
        children: []
      - id: BP-40.30.40
        name: Maintain Production Records and Manage Lot Traceability
        level: 3
        description: >-
          Perpetuating the production records by systematically documenting and using it to ensure the effective management of lots. Determine the lot numbering system and its use. (The lot number enables tracking of the constituent parts, as well as labor and equipment records involved in the manufacturing of a product. It enables manufacturers and to perform quality control checks, calculate expiration dates, and issue corrections of their production output.)
        framework_refs:
          - framework: SCOR
            external_id: sM1.6
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-610
        children: []
  - id: BP-40.40
    name: Deliver Products
    level: 2
    description: >-
      Receive customer orders, fulfil them from inventory or production, ship to destination, manage the last-mile, and process customer returns. Covers logistics governance and network design, inbound and reverse-logistics flow, warehousing and pick-pack-ship, outbound transportation, and last-mile delivery. Maps to SCOR Deliver (sD) plus Return (sR) for the reverse flows.
    framework_refs:
      - framework: SCOR
        external_id: sD
        version: "14.0"
      - framework: APQC-PCF
        external_id: "4.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-520
      - BC-530
    children:
      - id: BP-40.40.10
        name: Provide Logistics Governance
        level: 3
        description: >-
          Outlining the strategy for managing logistics. Translate customer requirements logistic requirements. Create an efficient logistic network and outsourcing portions of logistics activities. Design a logistics strategy that optimizes transportation costs and schedule. Define key performance indicators.
        framework_refs:
          - framework: SCOR
            external_id: sE5
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-520
          - BC-530
        children: []
      - id: BP-40.40.20
        name: Manage Inbound Logistics and Returns
        level: 3
        description: >-
          Plan, receive, and inspect inbound materials and customer returns. Includes inbound receipt scheduling, monitoring of inbound delivery performance, processing of returned products, quality control of returned parts, and salvage or repair. Covers SCOR Source-Return (sSR) and Deliver-Return (sDR).
        framework_refs:
          - framework: SCOR
            external_id: sR
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-510
        children: []
      - id: BP-40.40.30
        name: Operate Warehousing
        level: 3
        description: >-
          Tracking the inventory deployment. Accept and store products. Pick, pack, and ship customer orders. Measure the accuracy of the inventory. Assess the performance of the outsourced logistics activities.
        framework_refs:
          - framework: SCOR
            external_id: sD1.7
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-530
        children: []
      - id: BP-40.40.40
        name: Operate Outbound Transportation
        level: 3
        description: >-
          Creating a plan that specifies the schedule and system for transportation and delivery of the outbound products, as well as tracking the performance of the carrier delivery system. Conduct vehicle management and processing of all carrier-related documents.
        framework_refs:
          - framework: SCOR
            external_id: sD1.12
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.4.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-40.40.50
        name: Operate Last-Mile Delivery
        level: 3
        description: >-
          Validate specific service requirements for individual customers. Determine and schedule resource to fulfill these requirements. Provide service to specific individual customers. Ensure the quality of service delivery.
        framework_refs:
          - framework: SCOR
            external_id: sD4
            version: "14.0"
          - framework: APQC-PCF
            external_id: "4.4.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-520
          - BC-530
        children: []
