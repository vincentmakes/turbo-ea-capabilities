id: BP-10
name: Develop Vision and Strategy
level: 1
industry: Cross-Industry
description: >-
  Establishing a direction and vision for an organization. This involves defining the business concept and long-term vision, as well as developing the business strategy and managing strategic initiatives. Processes in this category focus on creating a vision, a mission, and strategic objectives, and culminate in creating measures to ensure that the organization is moving in the desired direction.
framework_refs:
  - framework: APQC-PCF
    external_id: "1.0"
    version: "8.0"
realizes_capability_ids:
  - BC-100
children:
  - id: BP-10.10
    name: Define the Business Concept and Long-term Vision
    level: 2
    description: >-
      Creating a conceptual framework of the organization's business activity and strategic vision with long-term applicability. Scout the organization's internal capabilities, as well as the customer's needs and desires, to identify a fit that can be used to advance a conceptual structure of the organization's business activity. Conduct analysis in light of relevant externalities and large-scale shifts in the market landscape.
    framework_refs:
      - framework: APQC-PCF
        external_id: "1.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-100
    children:
      - id: BP-10.10.10
        name: Assess the External Environment
        level: 3
        description: >-
          Assessing all forces, entities, and systems that are external to an organization but can affect its operation. Analyze far-reaching currents in the macroeconomic situation, assess the competition, evaluate technological changes, and identify societal as well as ecological issues of concern. Create a big-picture understanding of externalities, with sufficient depth across individual aspects.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.10.20
        name: Survey Market and Determine Customer Needs and Wants
        level: 3
        description: >-
          Examining the market to identify customer required solutions. Assess the relevant market(s) to determine the products/services that are needed or wanted by customers. Carry out quantitative and qualitative analyses to capture and investigate products/services. Employ creative techniques that allow for a closer appreciation of the customer, and design relevant solutions.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-420
        children: []
      - id: BP-10.10.30
        name: Assess the Internal Environment
        level: 3
        description: >-
          Undertaking a review of the organization's in-house skills and resources in order to create a big-picture understanding of internal capacities. Assess the organization's capabilities in order to advance the advantageous and weed out the detrimental aspects. Identify synergic associations within the backdrop of the forces and players active in the market, and take into account all externalities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.10.40
        name: Establish Strategic Vision
        level: 3
        description: >-
          Establishing the organization's long-term vision as a strategic positioning and engagement of stakeholders. Institute the vision by creating strategic orientations of all stakeholders. Understand the strategy development frameworks in this context.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.1.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.10.50
        name: Conduct Organization Restructuring Opportunities
        level: 3
        description: >-
          Examining the scope and contingencies for restructuring based on market situation and internal realities. Map the market forces over which any and all probabilities can be probed for utility and viability. Once the restructuring options have been analyzed and the due-diligence performed, execute the deal. Consider seeking professional services for assistance in formalizing these opportunities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.1.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
  - id: BP-10.20
    name: Develop Business Strategy
    level: 2
    description: >-
      Developing an organization's mission statement, strategy, and business design. Create a concise statement that clearly articulates the mission of the organization, outlining practicable targets to Establish a strategic vision. Delineate strategic options by matching these alternatives with the organization's internal capabilities. Create an organizational design, and identify goals by developing strategies at the functional and process levels.
    framework_refs:
      - framework: APQC-PCF
        external_id: "1.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-100
      - BC-230
    children:
      - id: BP-10.20.10
        name: Develop Overall Mission Statement
        level: 3
        description: >-
          Establishing an overarching, compact statement that concisely underscores the mission of the organization. Define and communicate a clear and succinct mission statement, which encapsulates how the organization aims to proceed in order to Establish a strategic vision. Solicit critical inputs from senior management and strategy executives, and collaborate with marketing or personnel from allied functions.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.20.20
        name: Define and Evaluate Strategic Options to Achieve the Mission
        level: 3
        description: >-
          Assessing sets of strategic decisions designed to drive the organization's long-term objectives. Identify various strategies concerning core functional areas. Appraise strategic options in light of auxiliary decision frameworks that ensure smooth functioning, the advancement of functional efficiencies, and vitality. Involve senior management executives, especially strategy and/or business unit personnel, with need-based consultative assistance from professional services providers.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.20.30
        name: Set/Develop Long-term Enterprise Strategy
        level: 3
        description: >-
          Developing a strategy for the achievement of business goals over the distant future. Adopt one of the strategic options for realizing its mission over the long term. Enlist senior management executives, comprising strategy and/or business unit personnel.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.20.40
        name: Coordinate and Align Cross-functional and Process Strategies
        level: 3
        description: >-
          Aligning the approach and method of individual units, departments, systems, and operations within the organization, in accordance with the larger strategic course adopted. Employ the organization's strategic path to guide the functions, divisions, and operations. Calibrate the plan and method of each functional area, as well as the processes therein, to Select the long-term business strategy.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.20.50
        name: Create Organizational Design
        level: 3
        description: >-
          Formulating a design for the organization's resources that allow it to meet its objectives. Develop a new framework for molding the organization's various processes into a coherent and seamless whole.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.20.60
        name: Develop and Set Organizational Objectives
        level: 3
        description: >-
          Developing overall goals for the organization that help in accomplishing its mission. Formulate organization-wide targets in the near to middle term, which will accumulate and propel the organization to realize its long-term objectives, as outlined in Develop an overall mission statement. Enlist business unit heads or equivalent personnel, in close collaboration with senior management executives.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.20.70
        name: Formulate Business Unit Strategies
        level: 3
        description: >-
          Charting a strategic course for business units in order to leverage opportunities, sidestep hurdles, and create synergies among each other. Create strategic road maps for the organization's units--in light of their individual resources and requirements, as well as their relationships with other business units--to achieve organizational goals.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.20.80
        name: Develop Customer Experience Strategy
        level: 3
        description: >-
          Defining a roadmap to meet customer expectations while considering how it will affect the business.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.8"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
          - BC-420
        children: []
      - id: BP-10.20.90
        name: Communicate Strategies Internally and Externally
        level: 3
        description: >-
          Conveying planned procedures and methods to both internal departments and external stakeholders like customers, suppliers, etc., in an effective manner based on organizational objective.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.2.9"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
  - id: BP-10.30
    name: Develop and Measure Strategic Initiatives
    level: 2
    description: >-
      Managing strategic initiatives, from development through selection, execution, and evaluation. Conduct and oversee strategic projects supporting long-term objectives. Administer programs of strategic significance by developing such initiatives, select the most appropriate projects, and formulate measures to assess their impact.
    framework_refs:
      - framework: APQC-PCF
        external_id: "1.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-100
    children:
      - id: BP-10.30.10
        name: Develop Strategic Initiatives
        level: 3
        description: >-
          Developing strategic projects that help fulfill long-term goals. Develop time-bound projects that are discretionary in nature and lie beyond the scope of the organization's routine operations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-900
        children: []
      - id: BP-10.30.20
        name: Evaluate Strategic Initiatives
        level: 3
        description: >-
          Examining projects of strategic significance that lie outside the purview of the organization's routine operations. Closely analyze strategic initiatives for their applicability and feasibility, given the organization's vision.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-900
        children: []
      - id: BP-10.30.30
        name: Select Strategic Initiatives
        level: 3
        description: >-
          Selecting relevant projects of strategic significance that create opportunities for the organization to realize its long-term objectives, on the basis of their suitability to the organization's constraints and reality. Select from the process Evaluate strategic initiatives, based on their applicability and feasibility for the organization. Enlist senior management, especially strategy personnel.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-900
        children: []
      - id: BP-10.30.40
        name: Establish High-level Measures
        level: 3
        description: >-
          Devising measures to examine strategic projects. Formulate evaluation criteria to assess the strategic initiatives for the level of impact.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-230
        children: []
      - id: BP-10.30.50
        name: Execute Strategic Initiatives
        level: 3
        description: >-
          Successfully implement strategic initiatives. Execution of strategy is also defined as the process of implementing logical set of connected activities by an organization to make a strategy work.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.30.60
        name: Review Execution of Strategic Initiatives
        level: 3
        description: >-
          Periodic review of initiatives based performance, conditions, and marketplace response.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.30.70
        name: Refine Strategic Initiatives and Project Plans As Needed
        level: 3
        description: >-
          Performing required updates to strategic initiatives based upon changes in the marketplace or performance.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.3.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-900
        children: []
  - id: BP-10.40
    name: Develop and Maintain Business Models
    level: 2
    description: >-
      Establishing how an organization creates, delivers and captures value or makes profit. Identify the products or services that a business will sell, its target market, anticipated expenses, and other core aspects of its modus operandi. Revise the plan as required to reflect changing circumstances.
    framework_refs:
      - framework: APQC-PCF
        external_id: "1.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-100
    children:
      - id: BP-10.40.10
        name: Develop Business Models
        level: 3
        description: >-
          Creating an economic model that describes the goals of an organization and the business processes needed to achieve those goals. This involves information gathering, securing necessary approvals and authorizations, integrating with preexisting models, including the general business concept and business strategy, and formally accepting the model as the basis for organization's day-to-day operations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.40.20
        name: Maintain Business Models
        level: 3
        description: >-
          Revising and updating business models to reflect the changes in the marketed services, product inventory, market behavior, available resources or accrued expenses. Determine how and when to modify the accepted business model in response to incoming feedback.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
        children: []
      - id: BP-10.40.30
        name: Establish Business Model Governance
        level: 3
        description: >-
          Creating and implementing a strategy, responsibilities and control mechanisms for managing business models that are timely, efficient and cost-effective.
        framework_refs:
          - framework: APQC-PCF
            external_id: "1.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-100
          - BC-110
        children: []
