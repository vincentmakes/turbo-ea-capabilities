id: BP-1020
name: Hire-to-Retire
level: 1
industry: Cross-Industry
description: >-
  End-to-end employee lifecycle from workforce planning through sourcing,
  selection, onboarding, performance and development, compensation and
  benefits administration, employee experience, internal mobility, and
  offboarding. One BP2 per VS-280 stage_name.
framework_refs:
  - framework: SHRM-BoCK
    external_id: HR Competency Model
    version: "2022"
realizes_capability_ids:
  - BC-300
  - BC-400
  - BC-1290
  - BC-1560
  - BC-1810
  - BC-2440
  - BC-2890
  - BC-3790
  - BC-4380
  - BC-4760
  - BC-4960
  - BC-4990
children:
