id: BP-130
name: Operate Banking Products and Services
level: 1
industry: Banking & Capital Markets
description: >-
  Run banking-specific product and service operations: deposit-taking, lending, cards, payments, trade finance, customer servicing, channels — distinct from cross-industry Order-to-Cash.
framework_refs:
  - framework: BIAN
    external_id: "Banking Industry Architecture Network — service-domain reference"
realizes_capability_ids:
  - BC-100
