    name: Manage Cold-Chain and Pharmaceutical Supply Chain
    level: 2
    description: >-
      Operate the pharmaceutical supply chain, including cold-chain logistics, serialisation, and distributor management.
    realizes_capability_ids:
      - BC-520
      - BC-530
    children:
