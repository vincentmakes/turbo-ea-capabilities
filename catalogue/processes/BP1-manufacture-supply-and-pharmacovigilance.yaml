        name: Manage Cold-Chain Logistics
        level: 3
        description: >-
          Operate temperature-controlled storage and transport across the supply chain.
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-200.30.20
        name: Manage Serialisation and Track-and-Trace
        level: 3
        description: >-
          Apply unit-level serialisation and aggregate to comply with DSCSA / FMD track-and-trace requirements.
        realizes_capability_ids:
          - BC-520
          - BC-130
        children: []
      - id: BP-200.30.30
        name: Manage Wholesaler and Pharmacy Distribution
        level: 3
        description: >-
          Manage 3PL/wholesaler relationships; deliver to retail and hospital pharmacy channels.
        realizes_capability_ids:
          - BC-510
          - BC-520
        children: []
