      - id: BP-200.50.10
        name: Maintain Product Registrations
        level: 3
        description: >-
          Maintain marketing authorisations across jurisdictions; manage registration databases.
        realizes_capability_ids:
          - BC-130
        children: []
      - id: BP-200.50.20
        name: Submit Variations and Renewals
        level: 3
        description: >-
          Prepare and submit registration variations, line extensions, and periodic renewals.
        realizes_capability_ids:
          - BC-130
        children: []
      - id: BP-200.50.30
        name: Manage Inspection Readiness
        level: 3
        description: >-
          Maintain inspection readiness for FDA / EMA / health-authority inspections; respond to findings.
        realizes_capability_ids:
          - BC-130
          - BC-720
        children: []
