        name: Process Adverse-Event Cases
        level: 3
        description: >-
          Receive, triage, and process individual case safety reports across markets.
        realizes_capability_ids:
          - BC-130
        children: []
      - id: BP-200.40.20
        name: Conduct Signal Detection and Risk Assessment
        level: 3
        description: >-
          Detect safety signals; assess and document risk; update Risk Management Plans.
        realizes_capability_ids:
          - BC-120
          - BC-130
        children: []
