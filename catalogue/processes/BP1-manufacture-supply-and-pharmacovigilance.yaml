id: BP-200
name: Manufacture, Supply, and Pharmacovigilance
level: 1
industry: Pharmaceuticals & Life Sciences
description: >-
  Manufacture pharmaceutical and biologic products under GMP; manage commercial supply chain; run pharmacovigilance and post-market safety surveillance.
framework_refs:
  - framework: APQC-PCF
    external_id: "Life Sciences PCF v6.1/7.2 — Manufacturing and Pharmacovigilance categories"
realizes_capability_ids:
  - BC-520
  - BC-130
children:
  - id: BP-200.10
    name: Manage GMP Manufacturing Operations
    level: 2
    description: >-
      Run GMP-compliant manufacturing of APIs, drug products, and biologics.
    realizes_capability_ids:
      - BC-520
      - BC-720
    children:
      - id: BP-200.10.10
        name: Plan GMP Production
        level: 3
        description: >-
          Plan GMP production runs against demand and supply constraints; manage materials and capacity.
        realizes_capability_ids:
          - BC-520
        children: []
      - id: BP-200.10.20
        name: Execute GMP Manufacturing
        level: 3
        description: >-
          Execute GMP manufacturing operations including API synthesis, drug-product formulation, and biologics fermentation/purification.
        realizes_capability_ids:
          - BC-520
          - BC-720
        children: []
      - id: BP-200.10.30
        name: Manage Batch Records and Release
        level: 3
        description: >-
          Maintain executed batch records; perform QA review and product release.
        realizes_capability_ids:
          - BC-720
        children: []
  - id: BP-200.20
    name: Manage Quality Assurance and Quality Control
    level: 2
    description: >-
      Run QA/QC programs across the product lifecycle, including stability, release testing, and CAPA.
    realizes_capability_ids:
      - BC-720
    children:
      - id: BP-200.20.10
        name: Operate Quality Control Testing
        level: 3
        description: >-
          Run incoming, in-process, and finished-product QC testing.
        realizes_capability_ids:
          - BC-720
        children: []
      - id: BP-200.20.20
        name: Manage Stability Studies
        level: 3
        description: >-
          Plan and run ICH stability studies; manage shelf-life determination.
        realizes_capability_ids:
          - BC-720
        children: []
      - id: BP-200.20.30
        name: Manage CAPA and Deviations
        level: 3
        description: >-
          Process deviations, OOS results, and corrective/preventive actions per ICH Q10.
        realizes_capability_ids:
          - BC-720
        children: []
      - id: BP-200.20.40
        name: Conduct Quality Audits
        level: 3
        description: >-
          Conduct internal and supplier quality audits; manage findings and corrective actions.
        realizes_capability_ids:
          - BC-720
          - BC-140
        children: []
