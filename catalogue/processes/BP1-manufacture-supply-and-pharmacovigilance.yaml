        name: Maintain Safety Database
        level: 3
        description: >-
          Maintain the global safety database with adequate data quality and traceability.
        realizes_capability_ids:
          - BC-610
          - BC-130
        children: []
      - id: BP-200.40.40
        name: Submit PSUR / PADER and Regulatory Safety Reports
        level: 3
        description: >-
          Prepare and submit Periodic Safety Update Reports and equivalent regulatory safety reports.
        realizes_capability_ids:
          - BC-130
        children: []
