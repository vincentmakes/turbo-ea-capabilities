id: BP-110
name: Manage Enterprise Risk, Compliance, Remediation, and Resiliency
level: 1
industry: Cross-Industry
description: >-
  Ensuring that an organization effectively manages its risk. Process groups are aligned with traditional risk management activities.
framework_refs:
  - framework: APQC-PCF
    external_id: "11.0"
    version: "8.0"
realizes_capability_ids:
  - BC-120
  - BC-130
  - BC-160
  - BC-730
children:
  - id: BP-110.10
    name: Manage Enterprise Risk
    level: 2
    description: >-
      Creating requisite frameworks and coordinating all risk management activities for the entire organization and each function. Manage the enterprise risk by outlining the risk policies and procedures. Monitor and communicate all risk management activities. Encourage correspondence among the business units. Manage the risk of all business units and functions.
    framework_refs:
      - framework: APQC-PCF
        external_id: "11.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-120
      - BC-140
    children:
      - id: BP-110.10.10
        name: Establish the Enterprise Risk Framework and Policies
        level: 3
        description: >-
          Creating an agenda for the rules and regulations of enterprise risk that deal with hazardous, financial, operational, and strategic risks. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI).
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-140
        children: []
      - id: BP-110.10.20
        name: Oversee and Coordinate Enterprise Risk Management Activities
        level: 3
        description: >-
          Coordinating to plan, organize, lead, and control the activities of an organization in order to minimize the special effects of risk on capital and earnings.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-140
        children: []
      - id: BP-110.10.30
        name: Manage Business Unit and Function Risk
        level: 3
        description: >-
          Analyzing the threats a business unit/function faces to prioritize the controls it implements..
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-140
        children: []
  - id: BP-110.20
    name: Manage Compliance
    level: 2
    description: >-
      Managing steps to confirm enduring compliance to industry regulations and government legislation.
    framework_refs:
      - framework: APQC-PCF
        external_id: "11.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-120
      - BC-130
      - BC-160
      - BC-730
    children:
      - id: BP-110.20.10
        name: Establish Compliance Framework and Policies
        level: 3
        description: >-
          Developing a set of procedures detailing an organization's progress in complying with established guidelines, provisions, and legislation.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.20.20
        name: Manage Regulatory Compliance
        level: 3
        description: >-
          Obeying laws, guidelines, strategies, and stipulations related to the business.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
  - id: BP-110.30
    name: Manage Remediation Efforts
    level: 2
    description: >-
      Administering the efforts and activities for remediation. This process element requires the organization to create plans for corrective action in collaboration with government agencies and pertinent professional services agencies which specialize in remediation efforts relevant to the organization's operations. Additionally, the organization needs to consult experts to validate the plan, determine resources allocation, resolve any legal concerns, and formulate a company-wide policy for remediation.
    framework_refs:
      - framework: APQC-PCF
        external_id: "11.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-120
      - BC-130
      - BC-160
      - BC-730
    children:
      - id: BP-110.30.10
        name: Create Remediation Plans
        level: 3
        description: >-
          Creating plans for remediation efforts. Make a plan to address a case of environmental adulteration. Identify and treat the adulteration so that the area will become operational again.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.30.20
        name: Contact and Confer with Experts
        level: 3
        description: >-
          Discussing and soliciting advice from experts for in order to incorporate their suggestion (regarding Create remediation plans).
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.30.30
        name: Identify/Dedicate Resources
        level: 3
        description: >-
          Identifying and dedicating the resources for managing remediation efforts. Discern the resources needed for remediation efforts. Dispense with resources in a sound and well-reasoned manner.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.30.40
        name: Investigate Legal Aspects
        level: 3
        description: >-
          Examining regulatory and legislative frameworks. Obligate the organization to remediate any damages through compensations, fines, and any other remedial efforts necessitated to correct the situations. Analyze local environmental laws, binding international covenants, etc. in order to examine legal accuracy about the rules and procedures.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-150
          - BC-160
          - BC-730
        children: []
      - id: BP-110.30.50
        name: Investigate Damage Cause
        level: 3
        description: >-
          Studying the causes of damage, which could be environmental, physical, social, etc. at country level in order to institute better policies and regulations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.30.60
        name: Amend or Create Policy
        level: 3
        description: >-
          Crafting a new framework of policies and procedures for deploying remediation efforts, or change existing policies and procedures. Adapt the policy structure to the context of the apposite national and international regulatory frameworks.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.3.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
  - id: BP-110.40
    name: Manage Business Resiliency
    level: 2
    description: >-
      Including the processes required to rapidly adapt and respond to any internal or external opportunity, demand, disruption, or threat. Develop a more dynamic, strategic, and integrated approach to managing compliance obligations.
    framework_refs:
      - framework: APQC-PCF
        external_id: "11.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-120
      - BC-130
      - BC-160
      - BC-730
    children:
      - id: BP-110.40.10
        name: Develop the Business Resilience Strategy
        level: 3
        description: >-
          Creating a strategy for rapidly adapting to disturbances. Maintain continuous business processes and protecting employees, assets, and overall brand equity. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI).
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.40.20
        name: Perform Continuous Business Operations Planning
        level: 3
        description: >-
          Developing plans to ensure continuous business operations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.40.30
        name: Test Continuous Business Operations
        level: 3
        description: >-
          Assessing ongoing activities within the organization that are not intended to stop except for in an emergency.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.40.40
        name: Maintain Continuous Business Operations
        level: 3
        description: >-
          Evaluating business operations. Determine which activities generate revenues, perform best, and provide good returns.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.4.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
        children: []
      - id: BP-110.40.50
        name: Share Knowledge of Specific Risks Across Other Parts of the Organization
        level: 3
        description: >-
          Sharing information about risks and resilience strategies of business operations across the organization so that prospective risks can be avoided.
        framework_refs:
          - framework: APQC-PCF
            external_id: "11.4.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-120
          - BC-130
          - BC-160
          - BC-730
          - BC-830
        children: []
