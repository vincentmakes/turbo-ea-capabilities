id: BP-120
name: Manage External Relationships
level: 1
industry: Cross-Industry
description: >-
  Fostering external relationships with stakeholders of the entity, including investors, government and industry, the board of directors, and the general public. This is not related to customer management.
framework_refs:
  - framework: APQC-PCF
    external_id: "12.0"
    version: "8.0"
realizes_capability_ids:
  - BC-240
  - BC-150
  - BC-850
  - BC-110
children:
  - id: BP-120.10
    name: Build Investor Relationships
    level: 2
    description: >-
      Creating a strategic management responsibility for integrating finance, communication, marketing, and securities law compliance. Allow the most effective two-way communication among the organization, the financial community, and other constituencies. Enlist the investor relations function to provide market intelligence to corporate management.
    framework_refs:
      - framework: APQC-PCF
        external_id: "12.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-240
    children:
      - id: BP-120.10.10
        name: Plan, Build, and Manage Lender Relations
        level: 3
        description: >-
          Building and managing relations with bankers or lenders through strong products/services strategies that bankers would want to invest in. Foster a receptive environment for low rates of interest, easy access to loans, etc.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-240
        children: []
      - id: BP-120.10.20
        name: Plan, Build, and Manage Analyst Relations
        level: 3
        description: >-
          Creating and maintaining long-term relations with analysts. Involve analysts in strategy and product decisions in order to elicit valuable information.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-240
        children: []
      - id: BP-120.10.30
        name: Communicate with Shareholders
        level: 3
        description: >-
          Practicing regular, transparent communication with shareholders through annual shareholders' meetings, quarterly earnings calls, shareholders letters, one-on-one emails or calls, etc.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-240
        children: []
  - id: BP-120.20
    name: Manage Government and Industry Relationships
    level: 2
    description: >-
      Creating and maintaining relationships with government and industry representatives.
    framework_refs:
      - framework: APQC-PCF
        external_id: "12.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-150
      - BC-850
    children:
      - id: BP-120.20.10
        name: Manage Government Relations
        level: 3
        description: >-
          Persuading public and government policy at the local, regional, national, and global level (subject to government regulations).
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-850
        children: []
      - id: BP-120.20.20
        name: Manage Relations with Quasi-government Bodies
        level: 3
        description: >-
          Managing relations with quasi-governmental organizations, corporations, businesses, or any other agency that is treated by national laws and principles to be under the supervision of the government but also distinct and self-directed from the government.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-850
        children: []
      - id: BP-120.20.30
        name: Manage Relations with Trade or Industry Groups
        level: 3
        description: >-
          Managing relations with organizations established and financed by businesses that operate in a specific industry. Participate in public relations actions such as lobbying and publishing, advertising, education, and political donations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-850
        children: []
      - id: BP-120.20.40
        name: Manage Lobby Activities
        level: 3
        description: >-
          Managing lobbying activities to affect government policies.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.2.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-850
        children: []
  - id: BP-120.30
    name: Manage Relations with Board of Directors
    level: 2
    description: >-
      Maintaining relations with representatives of the stockholders. Establish corporate management-related policies and to make decisions on major company issues. Implement practices designed to engender communication, trust, and cooperation.
    framework_refs:
      - framework: APQC-PCF
        external_id: "12.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-110
      - BC-240
    children:
      - id: BP-120.30.10
        name: Report Financial Results
        level: 3
        description: >-
          Reporting financial results to management, and releasing results to the public. Report financial statements, including the income statement, balance sheet, and statement of cash flows.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-240
        children: []
      - id: BP-120.30.20
        name: Report Audit Findings
        level: 3
        description: >-
          Reporting audit findings to management. Practice an internal audit with criteria for confirming a problem, a description of the situation, and the root cause of the problem. Make recommendations that resolve the issue.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-140
          - BC-240
        children: []
  - id: BP-120.40
    name: Manage Legal and Ethical Issues
    level: 2
    description: >-
      Managing legal practices to abide by the law, as well as ethical practices.
    framework_refs:
      - framework: APQC-PCF
        external_id: "12.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-150
      - BC-130
    children:
      - id: BP-120.40.10
        name: Create Ethics Policies
        level: 3
        description: >-
          Creating a code of ethics that communicate the organization's philosophy to employees, vendors, customers, clients, and the public.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.20
        name: Manage Corporate Governance Policies
        level: 3
        description: >-
          Administering the system of rules, practices, and processes through which a company is directed and controlled. Balance stakeholder interests including shareholders, management, customers, suppliers, financiers, government, and the community. Outline a strategy for achieving organizational goals, from action plans and internal controls to performance measurement and corporate disclosure.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-130
          - BC-150
        children: []
      - id: BP-120.40.30
        name: Develop and Perform Preventive Law Programs
        level: 3
        description: >-
          Creating and applying programs and activities. Encourage the adherence preventive laws, such as environmental law, sex discrimination, computer law, estate planning, corporate compliance, business planning, and property transactions.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.40
        name: Ensure Compliance
        level: 3
        description: >-
          Ensuring the organization's compliance position. Validate compliance with different statutes, regulatory directions, and legal principles (using Establish compliance framework and policies [17468]). Coordinate with compliance and risk management personnel.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.50
        name: Manage Outside Counsel
        level: 3
        description: >-
          Managing professionals, sought externally for assistance over legal and ethical concerns. Administer and oversee assistance from subject matter experts and professionals for sourcing expert opinion and counseling over legal and ethical matters.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.60
        name: Protect Intellectual Property
        level: 3
        description: >-
          Safeguarding the intellectual property of the organization. This process requires the organization to protect a wide variety of intellectual property created by it. This includes leveraging artificial intelligence(AI) to identify potential infringement of intellectual property and making sure employees are adhering to company policies around use of artificial intelligence(AI). It involves creating and managing non-disclosure agreements (NDAs), following up on current developments in the areas where the organization holds patents, tracking the use of the organization's copyrighted material, creating and upholding licensing terms, and administering policies for safeguarding intellectual property.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-130
          - BC-150
          - BC-710
          - BC-840
        children: []
      - id: BP-120.40.70
        name: Resolve Disputes and Litigations
        level: 3
        description: >-
          Resolving disputes or civil lawsuits internally or externally.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.80
        name: Provide Legal Advice/counseling
        level: 3
        description: >-
          Providing legal advice concerning the substance or procedure of a law in relation to a particular situation.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.8"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
      - id: BP-120.40.90
        name: Negotiate and Document Agreements/contracts
        level: 3
        description: >-
          Negotiating terms to reach a final draft of a contract that is acceptable to all parties.
        framework_refs:
          - framework: APQC-PCF
            external_id: "12.4.9"
            version: "8.0"
        realizes_capability_ids:
          - BC-150
          - BC-130
        children: []
