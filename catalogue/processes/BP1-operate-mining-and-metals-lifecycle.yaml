id: BP-310
name: Operate Mining and Metals Lifecycle
level: 1
industry: Mining & Metals
description: >-
  Run end-to-end mining and metals lifecycle: exploration and resource definition, mine planning, extraction, mineral processing, tailings management, closure and rehabilitation.
framework_refs:
  - framework: APQC-PCF
    external_id: "Mining lifecycle reference (no published APQC Mining PCF; aligned to ICMM Mining Principles, CRIRSCO, GISTM)"
