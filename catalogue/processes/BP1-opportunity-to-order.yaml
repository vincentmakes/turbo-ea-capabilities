id: BP-1060
name: Opportunity-to-Order
level: 1
industry: Cross-Industry
description: >-
  Pre-sale enterprise selling cycle from opportunity qualification
  through solution scoping, quote and configuration, pricing approvals,
  proposal, negotiation, contract and order booking, and handover to
  fulfilment. One BP2 per VS-380 stage_name.
