        realizes_capability_ids:
          - BC-5090
        children: []
      - id: BP-370.80.30
        name: Manage Asset Lifecycle and Renewals
        level: 3
        description: >-
          Manage whole-life asset strategy, condition, and renewals.
        realizes_capability_ids:
          - BC-5070
        children: []
      - id: BP-370.80.40
        name: Manage Resilience and Security
        level: 3
        description: >-
          Manage operational resilience, security, and emergency preparedness.
        realizes_capability_ids:
          - BC-5120
        children: []
