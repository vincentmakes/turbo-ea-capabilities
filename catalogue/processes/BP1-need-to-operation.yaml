    realizes_capability_ids:
      - BC-5070
      - BC-5080
      - BC-5090
      - BC-5120
    children:
      - id: BP-370.80.10
        name: Operate Infrastructure Network
        level: 3
        description: >-
          Operate the live network, availability, capacity, and events.
        realizes_capability_ids:
          - BC-5080
        children: []
      - id: BP-370.80.20
        name: Inspect and Maintain Assets
        level: 3
        description: >-
          Inspect and carry out planned and reactive maintenance on live
