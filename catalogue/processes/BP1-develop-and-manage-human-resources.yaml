id: BP-70
name: Develop and Manage Human Resources
level: 1
industry: Cross-Industry
aliases:
  - Hire-to-Retire
  - H2R
  - People Operations
  - HR Operations
description: >-
  Run the human-resources function end-to-end — workforce strategy,
  talent acquisition, onboarding, learning and development, performance
  management, total rewards, employee relations, mobility and offboarding,
  HR information systems, and employee communications. Anchored on APQC
  Cross-Industry PCF v8.0 with operational vernacular drawn from SHRM
  Body of Competency and Knowledge (BoCK) and APQC's Human Capital
  Management industry PCF.
framework_refs:
  - framework: SHRM-BoCK
    external_id: HR Competency Model
    version: "2022"
  - framework: APQC-PCF
    external_id: "7.0"
    version: "8.0"
