      - id: BP-70.10.20
        name: Develop and Implement Workforce Planning, Policies, and Strategies
        level: 3
        aliases:
          - Workforce Planning
          - Strategic Workforce Planning
          - SWP
        description: >-
          Creating and executing strategies and policies for smooth administration of workforce. Determine and gather skill requirements. Plan the requirements for employee resourcing per unit. Create compensation, succession, HR program, and employee diversity plans. Develop and administer policies for HR. Develop benefits for employees. Create models for work force strategies.
        framework_refs:
          - framework: SHRM-BoCK
            external_id: Workforce Management
            version: "2022"
          - framework: APQC-PCF
