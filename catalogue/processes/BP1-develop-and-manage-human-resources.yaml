    children:
      - id: BP-70.10.10
        name: Develop Human Resources Strategy
        level: 3
        aliases:
          - HR Strategy
          - People Strategy
        description: >-
          Creating a long-term plan that strategically aligns human resources with the company's goals. The HR function's focus is to ensure the organization has the necessary talent and capabilities to achieve its objectives, sustain its competitive advantage, and reduce employee turnover.
        framework_refs:
          - framework: SHRM-BoCK
            external_id: Business and HR Strategy
            version: "2022"
          - framework: APQC-PCF
