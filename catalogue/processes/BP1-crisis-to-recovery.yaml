          - BC-3310
        children: []
      - id: BP-1140.70.20
        name: Improve Resilience
        level: 3
        description: Translate lessons into resilience improvements — controls, plans, training, technology.
        realizes_capability_ids:
          - BC-120
          - BC-830
        children: []
