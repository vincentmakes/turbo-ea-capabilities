id: BP-1140
name: Crisis-to-Recovery
level: 1
industry: Cross-Industry
description: >-
  Business-continuity and crisis-management cycle from continuity
  planning through resilience testing, detection and activation,
  crisis response, disaster recovery, restoration, and post-crisis
  review. One BP2 per VS-140 stage_name.
