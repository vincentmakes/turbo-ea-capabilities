  - BC-3820
  - BC-3830
  - BC-3890
  - BC-4220
  - BC-4460
  - BC-4770
children:
  - id: BP-1140.10
    name: Continuity Planning
    level: 2
    description: Build and maintain business-continuity and disaster-recovery plans for critical processes and systems.
    realizes_capability_ids:
      - BC-160
      - BC-3310
      - BC-3830
      - BC-4460
    children:
      - id: BP-1140.10.10
        name: Run Business-Impact Analysis
        level: 3
        description: Identify critical processes, RTO/RPO targets, dependencies, and minimum operating requirements.
        realizes_capability_ids:
          - BC-160
          - BC-3310
        children: []
      - id: BP-1140.10.20
        name: Build Continuity Plans
        level: 3
        description: Build process- and site-level business-continuity plans — workarounds, alternate sites, key contacts.
        realizes_capability_ids:
          - BC-160
          - BC-3830
          - BC-4460
        children: []
      - id: BP-1140.10.30
        name: Build Disaster-Recovery Plans
        level: 3
        description: Build IT disaster-recovery plans — runbooks, replication, failover targets — for critical systems.
        realizes_capability_ids:
          - BC-3310
        children: []
  - id: BP-1140.20
    name: Resilience Testing
    level: 2
    description: Test continuity and recovery plans — tabletops, walk-throughs, full failover.
    realizes_capability_ids:
      - BC-160
      - BC-1280
      - BC-3310
      - BC-4220
    children:
      - id: BP-1140.20.10
        name: Run Tabletop Exercises
        level: 3
        description: Run tabletop exercises with key teams to validate plans and surface gaps without disrupting operations.
        realizes_capability_ids:
          - BC-160
          - BC-1280
        children: []
      - id: BP-1140.20.20
        name: Run Failover Drills
        level: 3
        description: Run controlled failover drills to validate technical recovery; capture timing against targets.
        realizes_capability_ids:
          - BC-3310
          - BC-4220
        children: []
      - id: BP-1140.20.30
        name: Update Plans from Test Findings
        level: 3
        description: Update continuity and recovery plans based on test findings; close gaps before next cycle.
        realizes_capability_ids:
          - BC-160
        children: []
