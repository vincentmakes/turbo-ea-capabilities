id: BP-20
name: Develop and Manage Products and Services
level: 1
industry: Cross-Industry
aliases:
  - Product Lifecycle Management
  - PLM
  - New Product Introduction
  - NPI
  - Idea-to-Launch
description: >-
  Govern the product/service portfolio, generate and qualify new
  ideas, design and develop new offerings, and manage them through
  launch, scale, and end-of-life. Anchored on ASCM DCOR (Design Chain
  Operations Reference — Plan, Research, Design, Integrate, Amend,
  Enable) with APQC Cross-Industry PCF v8.0 retained as a secondary
  cross-walk.
framework_refs:
  - framework: DCOR
    external_id: Design Chain Operations
    version: "12"
  - framework: APQC-PCF
    external_id: "2.0"
    version: "8.0"
realizes_capability_ids:
  - BC-820
  - BC-810
  - BC-800
children:
