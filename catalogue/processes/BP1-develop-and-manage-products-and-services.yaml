        name: Manage Patents, Copyrights, and Regulatory Requirements
        level: 3
        aliases:
          - IP Management
          - Patent Portfolio
          - Regulatory Affairs
        description: >-
          Determining the attributes necessary to protect and safeguard intellectual assets, maximize the value of IP assets through streamlined process, and collaboration between departments. Focus on needs to safeguard, critical assets, and assets' value.
        framework_refs:
          - framework: DCOR
            external_id: dE6
            version: "12"
          - framework: APQC-PCF
            external_id: "2.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-130
          - BC-800
          - BC-810
          - BC-820
        children: []
      - id: BP-20.10.40
        name: Manage Product and Service Master Data
        level: 3
        aliases:
          - Product Master Data
          - PIM
          - Product Information Management
          - GS1 Item Setup
        description: >-
          Controlling/authorizing to enable services' and products' data and other critical data of these functions through a well secured storage and accessibility processes backed by siloed applications/IT systems.
        framework_refs:
          - framework: DCOR
            external_id: dE2
            version: "12"
          - framework: APQC-PCF
            external_id: "2.1.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-820
          - BC-810
          - BC-800
        children: []
  - id: BP-20.20
    name: Generate and Define New Product/service Ideas
    level: 2
    aliases:
      - Ideation
      - Innovation Pipeline
      - Discovery Research
    description: >-
      Generate, capture, and qualify new product/service ideas; define
      product requirements. Maps to DCOR Research (dR) and the early
      stages of Design (dD).
    framework_refs:
      - framework: DCOR
        external_id: dR
        version: "12"
      - framework: APQC-PCF
        external_id: "2.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-800
      - BC-810
    children:
      - id: BP-20.20.10
        name: Perform Discovery Research
        level: 3
        aliases:
          - Discovery Research
          - Customer Discovery
          - Technology Scouting
        description: >-
          Coordinating R&D activity to identify new technologies to integrate into the revamped portfolio of products/services. This is inclusive of all forms of new and evolving technology such as artificial intelligence (AI). Conduct early-stage R&D activity to close gaps between existing solution offerings and changing market expectations. Triangulate appropriate technologies that can support the development of a revised product/service portfolio.
        framework_refs:
          - framework: DCOR
            external_id: dR1
            version: "12"
          - framework: APQC-PCF
            external_id: "2.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-800
          - BC-810
          - BC-400
        children: []
      - id: BP-20.20.20
        name: Generate New Product/service Concepts
        level: 3
        aliases:
          - Concept Generation
          - Ideation
        description: >-
          Producing and defining ideologies for new product/service offerings.
        framework_refs:
          - framework: DCOR
            external_id: dR2
            version: "12"
          - framework: APQC-PCF
            external_id: "2.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-800
          - BC-810
        children: []
      - id: BP-20.20.30
        name: Define Product/service Development Requirements
        level: 3
        aliases:
          - Product Requirements
          - PRD
          - User Stories
        description: >-
          Encompassing the identification and capture of new product/service requirements or potential improvements to current products/services. Collaborating with members of the supply chain to ensure the feasibility of what is being defined in the requirements. For example, a product with manufacturing requirements that supply chain cannot currently fulfill requires a corporate decision to either upgrade manufacturing capabilities or abandon the new product. Enterprise-level effects and needs must be considered. Depending on the nature of the final product or service, these requirements are often defined as a set of abilities, such as availability or reliability, that influence product development decisions.
        framework_refs:
          - framework: DCOR
            external_id: dD1
            version: "12"
          - framework: APQC-PCF
            external_id: "2.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-800
          - BC-810
        children: []
  - id: BP-20.30
    name: Develop Products and Services
    level: 2
    aliases:
      - Product Development
      - Engineering and Design
      - New Product Introduction
      - NPI
    description: >-
      Design, prototype, validate, and prepare new products and services
      for launch — including warranty and recall planning. Maps to DCOR
      Design (dD) and Integrate (dI), with launch readiness governed
      under DCOR Amend (dA).
    framework_refs:
      - framework: DCOR
        external_id: dD
        version: "12"
      - framework: APQC-PCF
        external_id: "2.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-810
      - BC-820
      - BC-840
    children:
      - id: BP-20.30.10
        name: Design and Prototype Products and Services
        level: 3
        aliases:
          - Product Design
          - Prototyping
          - MVP Development
        description: >-
          Sketching and standardizing product and service based on the market. Analyze the data market competitiveness and innovation attained for the product and service development.
        framework_refs:
          - framework: DCOR
            external_id: dD2
            version: "12"
          - framework: APQC-PCF
            external_id: "2.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-810
          - BC-820
        children: []
      - id: BP-20.30.20
        name: Test Market for New or Revised Products and Services
        level: 3
        aliases:
          - Market Testing
          - Beta Programme
          - Customer Validation
        description: >-
          Expanding on the marketplace analysis that took place earlier in the product development lifecycle by testing the market against offerings. The results from this in-depth analysis will help the organization finalize product/service characteristics and technical requirements and also identify any needed changes in the manufacturing and delivery processes that support market delivery. To prepare a detailed market study that accounts for any changes in the global environment, the organization may want to conduct a series of interviews, workshops, and focus groups with potential and existing customers.
        framework_refs:
          - framework: DCOR
            external_id: dD3
            version: "12"
          - framework: APQC-PCF
            external_id: "2.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-810
          - BC-820
          - BC-840
        children: []
      - id: BP-20.30.30
        name: Prepare for Production/service Delivery
        level: 3
        aliases:
          - Production Readiness
          - Launch Readiness
          - Pilot Production
        description: >-
          Devising business plans and procedures for manufacturing/operations/production and delivery of services offered by the organization. Further in general terms the total amount of output that the manufacturing department is responsible to produce for each period.
        framework_refs:
          - framework: DCOR
            external_id: dI
            version: "12"
          - framework: APQC-PCF
            external_id: "2.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-810
          - BC-820
          - BC-840
        children: []
      - id: BP-20.30.40
        name: Define Warranty Claims
        level: 3
        aliases:
          - Warranty Policy
          - Warranty Terms
        description: >-
          Determining the exact terms and conditions under which specific warranties apply to certain goods or services.
        framework_refs:
          - framework: APQC-PCF
            external_id: "2.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-810
          - BC-820
          - BC-840
        children: []
      - id: BP-20.30.50
        name: Develop Recall Strategy
        level: 3
        aliases:
          - Product Recall
          - Field Action
          - Safety Recall
        description: >-
          Establishing procedures to handle recalls of defective products.
        framework_refs:
          - framework: DCOR
            external_id: dA
            version: "12"
          - framework: APQC-PCF
            external_id: "2.3.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-810
          - BC-820
          - BC-840
        children: []
