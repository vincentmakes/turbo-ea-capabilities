    level: 2
    aliases:
      - Product Portfolio Management
      - Product Governance
      - Stage-Gate
      - Phase-Gate
    description: >-
      Govern the new-product programme — portfolio decisions, lifecycle
      management, IP and regulatory protection, and product-master
      data. Maps to DCOR Plan and Enable.
    framework_refs:
      - framework: DCOR
        external_id: dP
        version: "12"
      - framework: APQC-PCF
        external_id: "2.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-820
      - BC-810
      - BC-800
    children:
      - id: BP-20.10.10
        name: Manage Product and Service Portfolio
        level: 3
        aliases:
          - Product Portfolio Management
          - Portfolio Rationalization
        description: >-
          Managing a portfolio of product/service offerings to take advantage of shifts in the market expectations, all the while coordinating with the overall business strategy. Revisit the product/service portfolio in light of market opportunities, and overhaul it to capture value created by these opportunities. Identify gaps between current offerings and the market expectations to direct the organization's R&D activity. Create new solutions, and revise or retire existing ones so that the revamped portfolio aligns with Develop a business strategy.
        framework_refs:
          - framework: DCOR
            external_id: dP1
            version: "12"
          - framework: APQC-PCF
            external_id: "2.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-820
          - BC-900
        children: []
      - id: BP-20.10.20
        name: Manage Product and Service Life Cycle
        level: 3
        aliases:
          - Product Lifecycle Management
          - PLM
          - End-of-Life Management
        description: >-
          Manage the introduction and withdrawal of products/services. Administer associated changes, namely measuring the performance of new solution offerings and the revision of master files in the archives.
        framework_refs:
          - framework: DCOR
            external_id: dE3
            version: "12"
          - framework: APQC-PCF
            external_id: "2.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-820
          - BC-810
          - BC-800
        children: []
