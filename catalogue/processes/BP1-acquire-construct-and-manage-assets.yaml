id: BP-100
name: Acquire, Construct, and Manage Assets
level: 1
industry: Cross-Industry
aliases:
  - Asset Lifecycle Management
  - ALM
  - Asset Management
  - Strategic Asset Management Plan
  - SAMP
description: >-
  Plan, acquire, build, operate, maintain, and retire physical assets
  end-to-end. Anchored on ISO 55000 / 55001 (asset-management system
  requirements) with APQC Cross-Industry PCF v8.0 retained as a
  secondary cross-walk for benchmarking continuity.
framework_refs:
  - framework: ISO-55000
    external_id: ISO 55001
    version: "2024"
    url: https://www.iso.org/standard/82260.html
  - framework: APQC-PCF
    external_id: "10.0"
    version: "8.0"
realizes_capability_ids:
  - BC-700
  - BC-710
children:
  - id: BP-100.10
    name: Plan and Acquire Assets
    level: 2
    aliases:
      - Asset Planning
      - Capital Planning for Assets
      - Facilities Planning
      - Strategic Asset Management Plan
    description: >-
      Set asset strategy and acquire facilities, workspace, and
      supporting equipment. Maps to ISO 55001 §6 Planning + §8.1
      Operational Planning and Control (acquisition phase).
    framework_refs:
      - framework: ISO-55000
        external_id: ISO 55001 §6
        version: "2024"
      - framework: APQC-PCF
        external_id: "10.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-710
      - BC-700
    children:
      - id: BP-100.10.10
        name: Develop Property Strategy and Long Term Vision
        level: 3
        aliases:
          - Real Estate Strategy
          - Property Vision
        description: >-
          Strategizing a long-term vision for managing properties. Prepare strategies and a long-term vision for managing purchased/retained properties.
        framework_refs:
          - framework: ISO-55000
            external_id: SAMP
            version: "2024"
          - framework: APQC-PCF
            external_id: "10.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-710
          - BC-700
        children: []
      - id: BP-100.10.20
        name: Plan Facility
        level: 3
        aliases:
          - Facility Planning
          - Space Planning
        description: >-
          Recognizing the needs of facility users in order to construct a project proposal that meets those needs.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-710
          - BC-700
        children: []
      - id: BP-100.10.30
        name: Provide Workspace and Facilities
        level: 3
        aliases:
          - Facilities Management
          - FM
          - Workplace Services
        description: >-
          Managing the provision of the workspace and its assets. Arrange an office space with all assets (tables, chairs, computers, admin staff, etc.) according to requirements.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.1.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-710
          - BC-700
        children: []
      - id: BP-100.10.40
        name: Manage Facilities Operations
        level: 3
        aliases:
          - Facilities Operations
          - Building Operations
        description: >-
          Managing all operational activities of the facility. Manage how each function/business unit works. Support the manufacturing facility to attain organizational goals.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.1.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-710
          - BC-700
        children: []
  - id: BP-100.20
    name: Design and Construct Assets
    level: 2
    aliases:
      - Capital Project Delivery
      - Construction Management
      - Engineering and Construction
    description: >-
      Engineer, fund, and build new productive and non-productive
      assets. Maps to ISO 55001 §8 Operation (acquisition / capital
      project phase).
    framework_refs:
      - framework: ISO-55000
        external_id: ISO 55001 §8
        version: "2024"
      - framework: APQC-PCF
        external_id: "10.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-700
      - BC-710
    children:
      - id: BP-100.20.10
        name: Manage Capital Program for Assets
        level: 3
        aliases:
          - Capital Program Management
          - CapEx Programme
        description: >-
          Producing and maintaining a planning schedule and a financial plan to purchase or manufacture assets. Determine the investment plan, monitor capital, and secure the necessary financing in order to realize completion of the program.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.20.20
        name: Design and Plan Asset Construction
        level: 3
        aliases:
          - Engineering Design
          - Construction Planning
          - BIM Design
        description: >-
          Outlining the steps and strategies needed to construct assets. Verify that all regulations are adhered to and that all permissions have been granted. Organize and plan for resources to complete construction.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.20.30
        name: Schedule and Perform Construction Work
        level: 3
        aliases:
          - Construction Execution
          - Construction Scheduling
        description: >-
          Arranging a timetable for which to perform construction work. Schedule resources to contract assets for new or replacement assets. Reschedule or redesign assets if needed.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.20.40
        name: Manage Asset Construction
        level: 3
        aliases:
          - Construction Supervision
          - Quality Assurance for Construction
        description: >-
          Overseeing the performance and quality of work. Assure that records are maintained throughout the construction process. Adhere to all safety, security, and access regulations set forth by the organization and all government standards.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.2.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
  - id: BP-100.30
    name: Maintain Assets
    level: 2
    aliases:
      - Enterprise Asset Management
      - EAM
      - Maintenance Management
      - CMMS
      - Reliability-Centred Maintenance
      - RCM
    description: >-
      Plan, schedule, and execute preventive, corrective, predictive,
      and shutdown maintenance to keep assets fit-for-purpose. Maps to
      ISO 55001 §8 Operation (in-service phase) and the Reliability-
      Centred Maintenance and Total Productive Maintenance traditions.
    framework_refs:
      - framework: ISO-55000
        external_id: ISO 55001 §8
        version: "2024"
      - framework: APQC-PCF
        external_id: "10.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-700
      - BC-710
    children:
      - id: BP-100.30.10
        name: Plan Asset Maintenance
        level: 3
        aliases:
          - Maintenance Planning
          - Preventive Maintenance Planning
        description: >-
          Ensuring that necessary resources are available and tasks are prioritized accordingly through planning. Provide strategies and policies that identify tasks that need to be completed, and the resources necessary to fulfill those tasks.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.30.20
        name: Manage Asset Maintenance
        level: 3
        aliases:
          - Maintenance Scheduling
          - Work Order Management
        description: >-
          Ensuring that asset maintenance is conducted in a timely manner and successfully. Schedule work with the required resources with an eye on quality control and safety. Verify that contracted maintenance meets performance targets.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.30.30
        name: Perform Asset Maintenance
        level: 3
        aliases:
          - Maintenance Execution
          - Predictive Maintenance
          - Corrective Maintenance
        description: >-
          Engaging in all aspects of asset maintenance. Ensure that all assets are functioning properly and to all specified codes and regulations where applicable. Maintenance includes all preventative, routine, and corrective activates.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
  - id: BP-100.40
    name: Manage Asset End-of-life
    level: 2
    aliases:
      - Asset Decommissioning
      - Asset Disposal
      - End-of-Life Management
      - Decommissioning and Recycling
    description: >-
      Decommission, dispose of, recycle, or sell assets at end-of-life
      while meeting all legal, regulatory, and environmental obligations.
      Maps to ISO 55001 §8 Operation (renewal / disposal phase).
    framework_refs:
      - framework: ISO-55000
        external_id: ISO 55001 §8
        version: "2024"
      - framework: APQC-PCF
        external_id: "10.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-700
      - BC-710
    children:
      - id: BP-100.40.10
        name: Develop Exit Strategy
        level: 3
        aliases:
          - Asset Exit Strategy
          - Disposal Strategy
        description: >-
          Creating a strategy for managing asset exits.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.20
        name: Decommission Productive Assets
        level: 3
        aliases:
          - Asset Decommissioning
          - Plant Decommissioning
        description: >-
          Retiring assets that are no longer viable to the business. Decommission assets that are no longer in working order, are out of date, or whose maintenance exceeds the cost of replacement.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.30
        name: Perform Sale or Trade
        level: 3
        aliases:
          - Asset Sale
          - Asset Trade-In
        description: >-
          Performing the sale of assets. Achieve and complete the sale process. Deliver the end product to the customers.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.40
        name: Manage Take-back Centers
        level: 3
        aliases:
          - Take-Back Operations
          - Reverse Logistics for Assets
        description: >-
          Managing locations where end-of-life assets are evaluated for decommissioning, disassembly, recycling, etc.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.50
        name: Dismantle Assets
        level: 3
        aliases:
          - Asset Dismantling
          - Asset Disassembly
        description: >-
          Dismantling an asset into manageable parts. The parts may follow different dispositions, such as resale, reuse, recycle, etc.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.5"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.60
        name: Track Parts
        level: 3
        aliases:
          - Parts Traceability
          - Disposition Tracking
        description: >-
          Tracking the disposition of all parts from end-of-life assets. Tracking should provide an audit trail to include source, rational for disposition, and destination.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.6"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.70
        name: Recycle Parts
        level: 3
        aliases:
          - Materials Recycling
          - Circular-Economy Operations
        description: >-
          Recycling parts in accordance with legal, regulatory, and social/environmental responsibilities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.7"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.80
        name: Ship Hazardous Material
        level: 3
        aliases:
          - HazMat Shipping
          - Dangerous Goods Shipping
        description: >-
          Planning, conducting, and tracking shipment of hazardous materials.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.8"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.90
        name: Provide Government Reporting
        level: 3
        aliases:
          - Regulatory Reporting for Assets
          - Environmental Reporting
        description: >-
          Preparing and distributing government reports.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.9"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.100
        name: Perform Abandonment
        level: 3
        aliases:
          - Asset Abandonment
          - Site Abandonment
        description: >-
          Planning and performing abandonment activities. Whether facilities or equipment, ensure assets to be abandoned are safe, secure, and meet all legal, regulatory, and social/environmental responsibilities.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.10"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
      - id: BP-100.40.110
        name: Perform Waste and Hazardous Goods Management
        level: 3
        aliases:
          - Hazardous Waste Management
          - HazWaste Disposal
        description: >-
          Planning and performing waste and hazardous goods management. In compliance with all legal, regulatory, and social/environmental requirements, plan, document, and conduct hazardous material handling, disposal, and reporting.
        framework_refs:
          - framework: APQC-PCF
            external_id: "10.4.11"
            version: "8.0"
        realizes_capability_ids:
          - BC-700
          - BC-710
        children: []
