id: BP-170
name: Deliver Patient Care
level: 1
industry: Healthcare Providers
description: >-
  Run end-to-end patient care delivery in a hospital or care-network setting: from access through clinical encounters to discharge and post-discharge follow-up.
framework_refs:
  - framework: APQC-PCF
    external_id: "Healthcare Provider PCF v7.2 — Care delivery categories"
realizes_capability_ids:
  - BC-100
children:
