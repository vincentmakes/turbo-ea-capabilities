      Receive, register, schedule, and admit patients across inpatient, outpatient, and emergency channels.
    realizes_capability_ids: []
    children:
      - id: BP-170.10.10
        name: Schedule Patient Appointments and Encounters
        level: 3
        description: >-
          Schedule outpatient appointments and inpatient admissions across services.
        realizes_capability_ids: []
        children: []
      - id: BP-170.10.20
        name: Register and Verify Patient Demographics
        level: 3
        description: >-
          Register patients; verify demographics and coverage; perform authorisation checks.
        realizes_capability_ids: []
        children: []
      - id: BP-170.10.30
        name: Admit and Transfer Patients
        level: 3
