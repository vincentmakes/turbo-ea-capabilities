        children: []
      - id: BP-170.20.20
        name: Conduct Initial History and Examination
        level: 3
        description: >-
          Capture history, perform physical examination, document chief complaint.
        realizes_capability_ids: []
        children: []
      - id: BP-170.20.30
        name: Develop Initial Care Plan
        level: 3
        description: >-
          Formulate initial diagnosis and care plan; place initial orders.
        realizes_capability_ids: []
        children: []
  - id: BP-170.30
