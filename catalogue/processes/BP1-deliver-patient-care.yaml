        realizes_capability_ids:
          - BC-430
        children: []
      - id: BP-170.60.20
        name: Manage Patient Complaints and Grievances
        level: 3
        description: >-
          Process patient complaints and formal grievances per regulatory requirements.
        realizes_capability_ids:
          - BC-430
        children: []
