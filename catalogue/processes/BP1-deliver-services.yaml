id: BP-50
name: Deliver Services
level: 1
industry: Cross-Industry
description: >-
  Offering services to customers. This is the act of providing service delivery as a core business practice and covers identifying strategies for performing service delivery, managing resources, and delivering services to the customer.
framework_refs:
  - framework: APQC-PCF
    external_id: "5.0"
    version: "8.0"
realizes_capability_ids:
  - BC-430
  - BC-720
children:
  - id: BP-50.10
    name: Establish Service Delivery Governance and Strategies
    level: 2
    description: >-
      Creating rules and regulations for service delivery to the customer. Establish a system to manage performance, delivery, and direction of service delivery. Engage with the customer for satisfaction feedback. Define goals, policies, processes, and workplace layout and infrastructure as a part of the service delivery strategy.
    framework_refs:
      - framework: APQC-PCF
        external_id: "5.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-430
      - BC-720
    children:
      - id: BP-50.10.10
        name: Establish Service Delivery Governance
        level: 3
        description: >-
          Establishing service delivery governance through a system that manages performance, development, and direction. Allow for customer feedback on delivery satisfaction.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-100
        children: []
      - id: BP-50.10.20
        name: Develop Service Delivery Strategies
        level: 3
        description: >-
          Constructing strategies that identify goals, policies, processes, and procedures in relation to service delivery. Review and validate strategies. Define the workplace layout and infrastructure.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
  - id: BP-50.20
    name: Manage Service Delivery Resources
    level: 2
    description: >-
      Understanding the demands on resources and creating a plan to enable the delivery of services via those resources.
    framework_refs:
      - framework: APQC-PCF
        external_id: "5.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-300
      - BC-700
    children:
      - id: BP-50.20.10
        name: Manage Service Delivery Resource Demand
        level: 3
        description: >-
          Ensuring necessary resources are maintained through monitoring pipeline, developing forecasts, and collaborating with customers. Determine skills needed for service deliver and forecast customer orders. Monitor forecasted orders and modify if where needed. Measure forecast accuracy.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
      - id: BP-50.20.20
        name: Create and Manage Resource Plan
        level: 3
        description: >-
          Identifying the need for and creating a resource plan. Understand resource demand and align with capacity, skills, and capabilities. Enlist suppliers and partners to supplement needed skills and capabilities. Monitor and manage capabilities and skills with an eye on critical resources and supplier capacity.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
      - id: BP-50.20.30
        name: Enable Service Delivery Resources
        level: 3
        description: >-
          Instituting training to enable resources to provide service delivery to the customer. Develop a training plan. Create materials that provide for operation and technical training. Schedule, perform, and evaluate training.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
  - id: BP-50.30
    name: Manage and Operate Service Delivery System
    level: 2
    description: >-
      Managing and operating the systems, resources, and processes used to deliver services to customers, including planning, startup, ongoing operations, and service assurance.
    framework_refs:
      - framework: APQC-PCF
        external_id: "5.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-430
      - BC-720
    children:
      - id: BP-50.30.10
        name: Perform Service Delivery System Planning
        level: 3
        description: >-
          Planning the service delivery system by defining service requirements, capacity, resources, and delivery approaches needed to support effective and reliable service provision.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.20
        name: Perform Service Delivery System Startup
        level: 3
        description: >-
          Establishing and activating the service delivery system, including preparing resources, processes, and controls required to begin delivering services.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.30
        name: Operate Service Delivery System
        level: 3
        description: >-
          Executing day-to-day service delivery activities using the established service delivery system to meet service commitments, performance expectations, and customer needs.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.40
        name: Assure Service Delivery System Service
        level: 3
        description: >-
          Monitoring and assuring service delivery system performance to maintain service quality, reliability, and compliance with defined service standards and expectations.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
  - id: BP-50.40
    name: Deliver Service to Customer
    level: 2
    description: >-
      Rendering service to the customer by initiating, executing, and completing tasks associated with service delivery.
    framework_refs:
      - framework: APQC-PCF
        external_id: "5.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-430
      - BC-720
    children:
      - id: BP-50.40.10
        name: Initiate Service Delivery
        level: 3
        description: >-
          Collaborating with the customer to understand service needs. Review, understand, and modify the delivery scope with the organization needs of the customer in mind. Confirm readiness and identify, select, and assign resources. Plan for service delivery.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.40.20
        name: Execute Service Delivery
        level: 3
        description: >-
          Carrying out service delivery to the customer by creating and deploying the necessary solution. Analyze need and create a solution. Validate the solution and make changes if needed. Obtain approval to build/buy solution and then deploy solution to customer.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.40.30
        name: Complete Service Delivery
        level: 3
        description: >-
          Implementing final steps to complete service delivery to the customer. Evaluate success through project review, complete finance activities, and confirm delivery. Release resources and manage completion by harvesting knowledge and systems by archiving records.
        framework_refs:
          - framework: APQC-PCF
            external_id: "5.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
