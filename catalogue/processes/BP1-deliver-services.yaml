    aliases:
      - Manage and Operate Service Delivery System
      - Service Operations
      - Service Configuration Management
      - Service Assurance
    description: >-
      Establish and run the production service-delivery system,
      maintaining service quality and assurance. Maps to ITIL 4 Deliver
      and Support SVC plus Service Configuration Management, Monitoring
      and Event Management, and Service Validation and Testing practices.
    framework_refs:
