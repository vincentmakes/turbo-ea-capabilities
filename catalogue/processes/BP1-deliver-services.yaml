id: BP-50
name: Deliver Services
level: 1
industry: Cross-Industry
aliases:
  - Service Delivery
  - Service Operations
  - ITIL 4 Service Value Chain
description: >-
  Plan, resource, operate, and execute service delivery to customers
  end-to-end. Structured along the ITIL 4 Service Value Chain — Plan,
  Engage, Design and Transition, Obtain/Build, Deliver and Support — with
  the operating cadence of ITIL 4 service-management practices (Service
  Configuration, Service Desk, Capacity and Performance, Continual
  Improvement). APQC PCF Cross-Industry v8.0 retained as a secondary
  cross-walk.
framework_refs:
  - framework: ITIL
    external_id: Service Value Chain
    version: "4"
  - framework: APQC-PCF
    external_id: "5.0"
    version: "8.0"
realizes_capability_ids:
  - BC-430
  - BC-720
children:
  - id: BP-50.10
    name: Govern Service Delivery and Set Strategy
    level: 2
    aliases:
      - Establish Service Delivery Governance and Strategies
      - Service Delivery Governance
      - Strategy Management for Services
    description: >-
      Set rules, performance regimes, and strategic direction for the
      service-delivery function. Maps to ITIL 4 Plan SVC plus the
      Strategy Management and Continual Improvement practices.
    framework_refs:
      - framework: ITIL
        external_id: Plan
        version: "4"
      - framework: APQC-PCF
        external_id: "5.1"
        version: "8.0"
    realizes_capability_ids:
      - BC-110
      - BC-430
      - BC-720
    children:
      - id: BP-50.10.10
        name: Establish Service Delivery Governance
        level: 3
        aliases:
          - Service Governance
          - Continual Improvement
        description: >-
          Establishing service delivery governance through a system that manages performance, development, and direction. Allow for customer feedback on delivery satisfaction.
        framework_refs:
          - framework: ITIL
            external_id: Continual Improvement
            version: "4"
          - framework: APQC-PCF
            external_id: "5.1.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-110
          - BC-100
        children: []
      - id: BP-50.10.20
        name: Develop Service Delivery Strategies
        level: 3
        aliases:
          - Service Strategy
          - Strategy Management
        description: >-
          Constructing strategies that identify goals, policies, processes, and procedures in relation to service delivery. Review and validate strategies. Define the workplace layout and infrastructure.
        framework_refs:
          - framework: ITIL
            external_id: Strategy Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.1.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
  - id: BP-50.20
    name: Plan and Resource Service Delivery
    level: 2
    aliases:
      - Manage Service Delivery Resources
      - Workforce Planning
      - Capacity and Performance Management
    description: >-
      Forecast service demand, plan capacity, and develop the workforce
      and partner ecosystem needed to deliver. Maps to ITIL 4 Workforce
      and Talent Management and Capacity and Performance Management.
    framework_refs:
      - framework: ITIL
        external_id: Capacity and Performance Management
        version: "4"
      - framework: APQC-PCF
        external_id: "5.2"
        version: "8.0"
    realizes_capability_ids:
      - BC-300
      - BC-700
    children:
      - id: BP-50.20.10
        name: Forecast Service Demand
        level: 3
        aliases:
          - Demand Forecasting
          - Manage Service Delivery Resource Demand
        description: >-
          Ensuring necessary resources are maintained through monitoring pipeline, developing forecasts, and collaborating with customers. Determine skills needed for service deliver and forecast customer orders. Monitor forecasted orders and modify if where needed. Measure forecast accuracy.
        framework_refs:
          - framework: ITIL
            external_id: Capacity and Performance Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.2.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
      - id: BP-50.20.20
        name: Create and Manage Resource Plan
        level: 3
        aliases:
          - Workforce Planning
          - Resource Planning
        description: >-
          Identifying the need for and creating a resource plan. Understand resource demand and align with capacity, skills, and capabilities. Enlist suppliers and partners to supplement needed skills and capabilities. Monitor and manage capabilities and skills with an eye on critical resources and supplier capacity.
        framework_refs:
          - framework: ITIL
            external_id: Workforce and Talent Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.2.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
      - id: BP-50.20.30
        name: Enable Service Delivery Resources
        level: 3
        aliases:
          - Resource Enablement
          - Workforce Training and Onboarding
        description: >-
          Instituting training to enable resources to provide service delivery to the customer. Develop a training plan. Create materials that provide for operation and technical training. Schedule, perform, and evaluate training.
        framework_refs:
          - framework: ITIL
            external_id: Workforce and Talent Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.2.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-300
          - BC-700
        children: []
