        external_id: Deliver and Support
        version: "4"
      - framework: APQC-PCF
        external_id: "5.3"
        version: "8.0"
    realizes_capability_ids:
      - BC-430
      - BC-720
    children:
      - id: BP-50.30.10
        name: Plan Service Delivery System
        level: 3
        aliases:
          - Service Design
          - Perform Service Delivery System Planning
        description: >-
          Planning the service delivery system by defining service requirements, capacity, resources, and delivery approaches needed to support effective and reliable service provision.
        framework_refs:
          - framework: ITIL
            external_id: Service Design
            version: "4"
          - framework: APQC-PCF
            external_id: "5.3.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.20
        name: Stand Up the Service Delivery System
        level: 3
        aliases:
          - Service Transition
          - Go-Live
          - Perform Service Delivery System Startup
        description: >-
          Establishing and activating the service delivery system, including preparing resources, processes, and controls required to begin delivering services.
        framework_refs:
          - framework: ITIL
            external_id: Deployment Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.3.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.30
        name: Operate Service Delivery System
        level: 3
        aliases:
          - Service Operations
          - Monitoring and Event Management
        description: >-
          Executing day-to-day service delivery activities using the established service delivery system to meet service commitments, performance expectations, and customer needs.
        framework_refs:
          - framework: ITIL
            external_id: Monitoring and Event Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.3.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.30.40
        name: Assure Service Quality
        level: 3
        aliases:
          - Service Assurance
          - Service Validation and Testing
          - Quality Assurance
          - Assure Service Delivery System Service
        description: >-
          Monitoring and assuring service delivery system performance to maintain service quality, reliability, and compliance with defined service standards and expectations.
        framework_refs:
          - framework: ITIL
            external_id: Service Validation and Testing
            version: "4"
          - framework: APQC-PCF
            external_id: "5.3.4"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
  - id: BP-50.40
    name: Deliver Service to Customer
    level: 2
    aliases:
      - Engage and Deliver
      - Service Engagement
    description: >-
      Engage with the customer, execute the service, and close out the
      engagement. Maps to ITIL 4 Engage and Deliver and Support SVC
      activities plus Service Request Management and Service Level
      Management.
    framework_refs:
      - framework: ITIL
        external_id: Deliver and Support
        version: "4"
      - framework: APQC-PCF
        external_id: "5.4"
        version: "8.0"
    realizes_capability_ids:
      - BC-420
      - BC-430
      - BC-720
    children:
      - id: BP-50.40.10
        name: Initiate Service Delivery
        level: 3
        aliases:
          - Service Engagement
          - Service Request Management
          - Engage with Customer
        description: >-
          Collaborating with the customer to understand service needs. Review, understand, and modify the delivery scope with the organization needs of the customer in mind. Confirm readiness and identify, select, and assign resources. Plan for service delivery.
        framework_refs:
          - framework: ITIL
            external_id: Service Request Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.4.1"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.40.20
        name: Execute Service Delivery
        level: 3
        aliases:
          - Service Execution
          - Service Fulfilment
        description: >-
          Carrying out service delivery to the customer by creating and deploying the necessary solution. Analyze need and create a solution. Validate the solution and make changes if needed. Obtain approval to build/buy solution and then deploy solution to customer.
        framework_refs:
          - framework: ITIL
            external_id: Service Request Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.4.2"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
      - id: BP-50.40.30
        name: Complete Service Delivery
        level: 3
        aliases:
          - Service Closure
          - Knowledge Capture
        description: >-
          Implementing final steps to complete service delivery to the customer. Evaluate success through project review, complete finance activities, and confirm delivery. Release resources and manage completion by harvesting knowledge and systems by archiving records.
        framework_refs:
          - framework: ITIL
            external_id: Knowledge Management
            version: "4"
          - framework: APQC-PCF
            external_id: "5.4.3"
            version: "8.0"
        realizes_capability_ids:
          - BC-430
          - BC-720
        children: []
