id: BP-180
name: Manage Clinical Operations and Health Information
level: 1
industry: Healthcare Providers
description: >-
  Run the operational backbone of a healthcare provider: ancillary clinical services (pharmacy, laboratory, imaging, surgical), health information management, infection prevention, and credentialing.
