# Infrastructure Investment & Portfolio Management
id: BC-5000
name: "Infrastructure Investment & Portfolio Management"
level: 1
industry: Infrastructure
description: |
  Investment strategy, origination, appraisal, and capital allocation across a
  portfolio of infrastructure assets and capital projects. Owner/investor-side
  discipline that decides which infrastructure to fund and how, and tracks
  portfolio-level returns and public value over the asset lifecycle.
references:
  - https://ppp.worldbank.org/public-private-partnership/
  - https://www.gov.uk/government/organisations/infrastructure-and-projects-authority
  - https://web.aacei.org/
  - https://sustainableinfrastructure.org/envision/
in_scope:
  - Infrastructure investment strategy and sector focus
  - Deal and project pipeline origination and screening
  - Business cases, options appraisal, and cost-benefit analysis
  - Capital-programme prioritisation and sequencing across the portfolio
  - Funding and financing strategy including grant and project finance
  - Portfolio performance, benefits, and value-for-money tracking
out_of_scope:
  - Corporate treasury and enterprise financing (BC-210)
  - Enterprise strategy formulation (BC-580)
  - Operational revenue, tariffs, and concession income (BC-5100)
  - Programme and project delivery controls (BC-5020)
